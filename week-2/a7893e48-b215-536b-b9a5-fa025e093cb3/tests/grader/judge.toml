weight = 5
description = "Recipe: read the browser source (client entry and every module it imports) and the server code that renders HTML or JSON. Search for process.env, import.meta.env, injected window globals, config endpoints and any import of the server config module from browser code. Cite each offending reference as file:line. Pass: no browser module or server response carries a service URL, credential or session secret."

