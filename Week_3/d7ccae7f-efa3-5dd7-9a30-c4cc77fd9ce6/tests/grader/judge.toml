[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: search the server source for `process.env`, `DATABASE_URL`, `VALKEY_URL`, `S3_` and `APP_PUBLIC_PORT`, then read every file that opens a Postgres, Valkey or S3 client. Defaults the brief documents (port 4173, 1800 idle seconds, 120 picture-link seconds) are allowed and the seeded quizmaster passwords are seed data, but any literal fallback for a service URL, host, bucket, region or credential fails, so cite each as `file:line`. Pass: every service URL, credential, bucket and region reaches its client from process.env read at start, with no literal connection string, host or key in server source."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-57",
]
evidence = "file_line"
cites = "L83, L493-L502"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: read the browser app source (entry file, any `import.meta.env` or `process.env` use, any injected config script) and the server code that builds picture links, API responses and error bodies. A secret key in a link or any service URL or credential in a client file or response body fails, so cite each as `file:line`. Pass: no browser source or response builder carries a service URL or credential, except the presigned picture-link builder that signs with the S3 endpoint and access key id."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-57",
]
evidence = "file_line"
cites = "L83, L504-L508"

[[criterion]]
id = "Q1"
name = "Q1"
type = "binary"
weight = 3
description = "Recipe: read `tsconfig.json`, search the TypeScript source for `any` (annotations, `as any`, `<any>`, `as unknown as`), and find where request bodies, stream events and Postgres, Valkey and S3 replies enter the code. Any `any` or any untyped input used without narrowing fails, so cite each as `file:line`. Pass: strict compilation is on, with no `any` anywhere and each request body, event and service reply parsed and narrowed at its entry point."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L530"

[[criterion]]
id = "Q2"
name = "Q2"
type = "binary"
weight = 3
description = "Recipe: read type, table, route, module and function names in the server and client source. A generic stand-in for a brief term (`User` for quizmaster, `Game` or `Match` for room, `Token` for rejoin token, `Connection` for client, `Scoreboard` for standings) is a defect, while `session` for the sign-in cookie is allowed, so cite each defect as `file:line`. Pass: no identifier in the server or client source uses a generic stand-in for a term the brief defines."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L531"

[[criterion]]
id = "Q3"
name = "Q3"
type = "binary"
weight = 5
description = "Recipe: locate where each of six rules is decided (room transition table, answer-window check, score formula, rank order, player payload projection, picture sniffing), then search for a second copy (a repeated legal-transition list, a second comparison against `deadlineAt`, repeated 1000 and 500 scoring constants, a second sort by score, a second field whitelist, a second magic-byte check). Cite the deciding `file:line` of each rule and every duplicate. Pass: each of the six rules is decided in exactly one place that all other code calls."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L532"

[[criterion]]
id = "Q4"
name = "Q4"
type = "binary"
weight = 3
description = "Recipe: search the source for `interface` and `abstract` declarations with their implementers, and for functions or classes whose whole body forwards to one other function. Any interface with one implementer and any wrapper with a single caller that only forwards fails, so cite each as `file:line`. Pass: no interface has a single implementer and no wrapper only forwards."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L533"

[[criterion]]
id = "Q5"
name = "Q5"
type = "binary"
weight = 3
description = "Recipe: search the source for commented-out code blocks, unused exports and unreachable branches, and for guards on states the room transition table cannot reach (a `default` branch over an exhaustive state union, a null check on a value just set). Any instance fails, so cite each as `file:line`. Pass: the source holds no commented-out block, unused export, unreachable branch or guard for an unreachable room state."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L534"

[[criterion]]
id = "Q6"
