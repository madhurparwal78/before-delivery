criteria = []
parameter_cases = []

[[requirements]]
id = "DP-06"
title = "Job lifecycle and cancellation"
text = "Jobs move only along the published state machine; cancelling a queued, leased or running job releases its whole reservation, and cancelling a succeeded or failed job is refused."
kind = "behavior"
primary = "pytest"
workflow = "api-submit"
tests = [
    "test_app.py::test_job_lifecycle_and_cancel",
    "test_app.py::test_wf_api_submit_cancel",
    "test_app.py::test_parallel_cancels_release_once",
]
criteria = []
parameter_cases = []

