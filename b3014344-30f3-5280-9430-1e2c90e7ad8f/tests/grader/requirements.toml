text = "Activating a case-study card carries it out of the deck into its detail route with the published open motion, or at once under reduced motion, and going back returns focus to that card."
kind = "behavior"
primary = "pytest"
workflow = "explore-work"
tests = [
    "test_app.py::test_case_study_open_motion",
    "test_app.py::test_wf_explore_work_phone_reduced",
    "test_app.py::test_wf_explore_work_breakpoints",
]
criteria = []
parameter_cases = []

