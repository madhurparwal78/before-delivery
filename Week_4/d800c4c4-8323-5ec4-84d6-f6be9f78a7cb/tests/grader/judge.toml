weight = 3
description = "Recipe: trace the join, pay, waiver approval and check-in photo paths from their route handlers to the Kill Bill and object-storage calls built from the environment-read configuration. A stubbed, in-memory or test-only branch that skips the provider or fakes its answer fails. Cite each as `file:line`. Pass: each traced path reaches a real authenticated provider call."

[criterion.annotations]
