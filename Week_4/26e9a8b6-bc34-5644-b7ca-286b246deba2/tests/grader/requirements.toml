[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "storage-down"
port = 4174
url_env = "APP_STORAGE_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "short-limits"
port = 4175
url_env = "APP_SHORT_LIMITS_URL"

[outages.env]
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"
MODEL_MAX_BYTES = "400000"
MODEL_MAX_PARTS = "12"
QUESTION_LIMIT = "2"
QUESTION_WINDOW_SECONDS = "30"
CONFIRM_TOKEN_TTL_SECONDS = "5"

[[requirements]]
id = "DP-01"
title = "Keyboard authoring journey."
text = "From a grading world's `draft` guide open in the editor, the author adds a step, chooses its parts, sets its apart amount, saves a version, moves the step and resizes the panes using only the keyboard, while the author's second tab shows the new version number live."
kind = "behavior"
primary = "workflow"
workflow = "keyboard-authoring"
tests = [
    "test_app.py::test_wf_keyboard_authoring_happy",
    "test_app.py::test_wf_keyboard_authoring_limit_recovery",
]
criteria = []
parameter_cases = []

