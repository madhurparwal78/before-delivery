[task]
name = "tumbler-pin/keyway-bench"
version = "1.0.0"
description = "Keyway Bench by Tumbler & Pin Co.: a browser 3D bench where independent escape-room owners lay out a room to true millimetre scale, wire its puzzle chain as trigger nodes, co-edit live across two instances, run server-timed remote playtests with emailed invites and debriefs, and freeze gap-free numbered build packs with byte-exact prop files, sixteenth-inch dimensions and live-updating version cards. Uses Postgres, MinIO, Valkey and Mailpit."
