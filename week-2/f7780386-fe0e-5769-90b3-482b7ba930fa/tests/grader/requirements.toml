]
parameter_cases = []

[[if_rules]]
id = "IF-02"
text = "`/app/THIRD_PARTY_NOTICES.md` lists every shipped package and every bundled font, each with name, version and licence. Shipped packages means the production dependency tree reported by `npm ls --omit=dev --all --json`."
tests = [
    "test_app.py::test_if_third_party_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
