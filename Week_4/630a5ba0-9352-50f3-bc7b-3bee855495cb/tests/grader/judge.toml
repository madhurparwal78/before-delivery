id = "Q3"
name = "Q3"
type = "binary"
weight = 5
description = "Recipe: locate where the server decides each of these rules: subscription state transitions, a day's planned minutes, today and day boundaries in the profile zone, routine expansion across daylight-saving changes, and CSV import matching. Treat a second server-side implementation of a rule as a duplicate. In the browser, the brief requires an optimistic projected total and ghost during and after a drop, and working out the first board column from the device clock converted to the profile zone, so those are allowed; count browser code as a duplicate only when it replaces a server-confirmed total, state or import result instead of being overwritten by it, or when it derives today from the browser's own zone. Cite the single owner of each rule and any duplicate as `file:line`. Pass: each of the five rules is decided in exactly one server source location that all its server callers use, with no browser logic that overrides the server's values."

