title = "Duplicate, empty and oversized captures"
text = "Reject a second live copy of the same bytes under a different request key, an empty body, a wrong content type and a body over the size limit with the statuses in API."
kind = "behavior"
primary = "pytest"
workflow = "capture-upload"
tests = [
    "test_app.py::test_upload_refusals",
]
criteria = []
parameter_cases = []

