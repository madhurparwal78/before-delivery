{% extends "base.html" %}
{% block scripts %}<script src="/static/js/studio.js" defer></script>{% endblock %}
{% block main %}
<section class="signin">
  <h1 class="statement">Studio sign in</h1>
  <form method="post" action="/studio/signin" class="signin-form" data-signin>
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field">
      <label for="si-email">Email</label>
      <input class="field-input" id="si-email" name="email" type="email" autocomplete="username" value="{{ email }}">
    </div>
    <div class="field">
      <label for="si-password">Password</label>
      <input class="field-input" id="si-password" name="password" type="password" autocomplete="current-password">
    </div>
    <button type="submit" class="pillbutton solid wide">Sign in</button>
    <p class="signin-status{% if error %} is-error{% endif %}" role="status" aria-label="Sign-in status">{{ error }}</p>
  </form>
</section>
{% endblock %}
