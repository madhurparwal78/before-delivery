schema_version = 1
id_prefix = "DP"
mandatory_count = 89
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "browse-studio",
    "client-access",
    "intake-upload",
    "scale-check",
    "shot-rig",
    "quote-pricing",
    "deposit",
    "outages",
    "review-links",
    "revisions",
    "milestone-invoices",
    "payment-recovery",
    "cancel-refund",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "S4",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 91
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "pocketbase", env = {} },
    { name = "minio", env = {} },
    { name = "killbill", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Gloamwork Studio <studio@gloamwork.test>" } },
    { name = "rabbitmq", env = {} },
    { name = "gotenberg", env = {} },
    { name = "meilisearch", env = {} },
    { name = "ntfy", env = {} },
]

[criterion_weights]
B1 = 5
B2 = 3
B3 = 3
B4 = 3
B5 = 5
B6 = 3
B7 = 3
B8 = 3
B9 = 5
B10 = 3
B11 = 5
B12 = 5
S1 = 5
S2 = 3
S3 = 5
S4 = 5
Q1 = 5
Q2 = 5
Q3 = 5
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4176
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"
MAILPIT_URL = "http://127.0.0.1:9"

[[outages]]
id = "rabbitmq-down"
port = 4177
url_env = "APP_RABBITMQ_DOWN_URL"

[outages.env]
AMQP_URL = "amqp://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_queue_down"

[[outages]]
id = "gotenberg-down"
port = 4178
url_env = "APP_GOTENBERG_DOWN_URL"

[outages.env]
GOTENBERG_URL = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_docs_down"

[[outages]]
id = "short-timer"
port = 4179
url_env = "APP_SHORT_URL"

[outages.env]
SIGNIN_CODE_TTL_SECONDS = "10"
SIGNIN_CODE_WINDOW_SECONDS = "20"
REVIEW_LINK_TTL_SECONDS = "20"
OVERDUE_AFTER_SECONDS = "5"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
