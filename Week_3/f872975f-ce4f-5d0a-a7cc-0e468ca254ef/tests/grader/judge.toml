description = "Recipe: `playwright` at 1280x800. 1) Open `/` with no filters and wait for `list \"Rack\"`. 2) Run browser_evaluate on the rack list items to read their borders, `box-shadow` and vertical gaps. 3) Take a screenshot of the rack area. Pass: at least 5 horizontal board strips are stacked one under another, each row separated from the next by a single rule no thicker than 1 px with no box-shadow, rounded tile or grid of boxes."

[criterion.annotations]
