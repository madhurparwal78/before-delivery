[[requirements]]
id = "DP-01"
title = "Five reels on one hoarding."
text = "The home page shows Now Showing, The Pack, The Lineup, Price Notices and End Credits in that order with the hero from Screens and layout, and under 768 wide its Reels navigation stays closed and unreachable until opened, then opens fully on screen and topmost at any point in the scroll without moving it, and stays correct through a pending read and a width crossing."
kind = "behavior"
primary = "workflow"
workflow = "first-visit"
tests = [
    "test_app.py::test_wf_first_visit_reels_on_phone",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Exact seeded catalogue."
text = "A first boot on an empty database holds exactly the Seed data records and nothing else, and a restart neither duplicates nor overwrites them."
kind = "behavior"
primary = "pytest"
workflow = "first-visit"
tests = [
    "test_app.py::test_wf_first_visit_seed",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Published counts from one reading."
text = "The household buyer's first visit and the house editor's first sign-in both open on the seeded catalogue with the published counts line, both lines change together at the Kolkata midnight a scheduled revision takes effect, and the open editor's line updates in place after a publish."
kind = "behavior"
primary = "workflow"
workflow = "first-visit"
tests = [
    "test_app.py::test_wf_first_visit_counts",
]
criteria = []
parameter_cases = []

