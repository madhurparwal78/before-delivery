[[requirements]]
id = "DP-63"
title = "Session ended mid-change"
text = "When a workspace change answers 401 because the session ended, the workspace holds it, opens the Sign in again dialog, and after sign-in sends it exactly once with focus back on the control that made it, never reloading or losing the change, as qualified in Interactions."
kind = "behavior"
primary = "pytest"
workflow = "trip-packing"
