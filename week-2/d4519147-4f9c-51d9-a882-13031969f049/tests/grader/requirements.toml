[[requirements]]
id = "DP-47"
title = "Zones carry their systems and never overlap"
text = "Moving a zone carries its member shapes and their connectors, resizing a zone moves no shapes, and a zone move or resize that would overlap or touch another zone is refused whole with the published announcement."
