type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800. 1) Open `/en/`. 2) Scroll the window to y=200 and let it settle. 3) Confirm that the stage's `data-iris-open` reads between 0.3 and 0.7. 4) Take a screenshot. 5) Scroll to y=900 and take a second screenshot. Where the blades are SVG or DOM elements, a probe may count them. Otherwise count the blades that frame the opening in the screenshots. Straight or curved blade edges both count, so a scalloped, near-round opening passes when the blades that form it are visible. Pass: in both screenshots the opening is framed by the iris's nine overlapping blades like a lens diaphragm, not a plain circle, ring, vignette or gradient."

