[[if_rules]]
id = "IF-01"
text = "`/app/run.json` holds non-empty `install`, `build` and `serve` commands, and no `Dockerfile`, `start.sh` or compose file sits at the root of `/app`."
tests = [
    "test_app.py::test_if_run_manifest",
]
parameter_cases = []

[[if_rules]]
id = "IF-02"
text = "`/app/USER_README.md` lists the three seeded accounts with the password `deku-demo-pw-2026`."
tests = [
    "test_app.py::test_if_user_readme_lists_seeded_logins",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "The reserved `.browser_screenshots/` and `.downloads/` directories exist at the app root, empty."
tests = [
    "test_app.py::test_if_reserved_directories_exist",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "`/app/package.json` names the stated libraries and builds with Vite, brings no second database, cache, queue, object store, identity, payment or mail provider, and its runtime `dependencies` are only the named libraries and their direct dependencies."
tests = [
    "test_app.py::test_if_named_libraries_only",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "The app logs to standard output one line per HTTP request naming its method and path."
tests = [
    "test_app.py::test_if_app_logs_each_request",
]
parameter_cases = []

