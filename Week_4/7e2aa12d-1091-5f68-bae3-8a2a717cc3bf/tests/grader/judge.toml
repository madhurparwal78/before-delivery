description = "Recipe: search the server source for the numeric literals 12, 3 and 30 used as track, breakpoint or presence limits, and read the presence renewal and expiry code and the track and breakpoint validation. Fixed limits stated by the brief (gap 200, track size ranges, body 65,536, CSS 20,000) may stay as constants, and a default inside the configuration module is allowed. Pass: the track limit, the breakpoint limit, the presence expiry and the renewal interval are each derived from the configuration object, with no second hard-coded copy elsewhere."

[criterion.annotations]
