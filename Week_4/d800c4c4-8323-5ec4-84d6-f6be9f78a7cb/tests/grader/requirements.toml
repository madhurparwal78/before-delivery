Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "storage-down"
port = 4174
url_env = "APP_STORAGE_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "billing-down"
port = 4175
url_env = "APP_BILLING_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "short-session"
port = 4176
url_env = "APP_SHORT_SESSION_URL"

[outages.env]
SESSION_IDLE_SECONDS = "20"

