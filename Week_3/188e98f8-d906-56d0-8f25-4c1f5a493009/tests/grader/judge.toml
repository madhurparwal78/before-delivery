id = "B3"
name = "B3"
type = "binary"
weight = 3
description = "Recipe: `playwright` at 1280x800. 1. Open `/`. 2. With `browser_evaluate`, read the computed font family, weight and style of the masthead text, the League table heading and one tile total. 3. Run `document.fonts.check` for each sampled weight and style. 4. Screenshot the masthead and two tiles. Pass: all three sampled texts render in one loaded serif display face."

