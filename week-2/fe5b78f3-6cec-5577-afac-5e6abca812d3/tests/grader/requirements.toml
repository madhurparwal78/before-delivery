schema_version = 1
id_prefix = "DP"
mandatory_count = 80
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "search",
    "payment",
    "last-berth",
    "booking-windows",
    "cancellation",
    "my-bookings",
    "public-pnr",
    "family-booking",
    "pnr-tracking",
    "promotion",
    "chart",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 90
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "killbill", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Pakka Rail <tickets@pakka-rail.example>" } },
    { name = "minio", env = {} },
]

[criterion_weights]
B1 = 5
B2 = 3
B3 = 5
B4 = 5
B5 = 3
B6 = 3
B7 = 3
B8 = 5
B9 = 5
B10 = 5
B11 = 5
B12 = 3
S1 = 5
S2 = 5
S3 = 3
Q1 = 5
Q2 = 3
Q3 = 5
Q4 = 5
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[outages]]
id = "minio-down"
port = 4176
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "fast-clock"
port = 4177
url_env = "APP_FAST_CLOCK_URL"

[outages.env]
RAIL_CLOCK_START = "2026-12-01T06:00:00+05:30"
RAIL_CLOCK_RATE = "240"
DATABASE_URL = "${DATABASE_URL}_fast"
S3_BUCKET = "${S3_BUCKET}-fast"

[[requirements]]
id = "DP-01"
title = "Run manifest and health check"
text = "Ship /app/run.json as described in Deployment, and answer the health path with the healthy body once the database is ready, whether or not the other services are reachable."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_health",
    "test_app.py::test_health_primary",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Service settings from the environment"
text = "Read every service URL and credential at start from the environment variables listed in Configuration and secrets, and never hard-code them or send them to the browser."
kind = "source"
primary = "rubric"
workflow = "cross-cutting"
tests = []
criteria = [
    "S1",
    "S2",
    "S3",
]
parameter_cases = []

