name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server configuration and connection code. Search for `process.env` and for string literals that start a database, cache or mail connection or that look like a password or key. Pass: the Postgres, Valkey and SMTP connection settings and credentials are read only from the environment, with no literal URL, host or secret in source beyond the brief's documented defaults."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
