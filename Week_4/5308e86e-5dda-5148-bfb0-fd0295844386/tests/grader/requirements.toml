title = "Resumable stream and outage recovery"
text = "A stream reconnect naming its last event id, even one issued before a restart, first replays the company's missed transactions oldest first. When the database refuses connections while the app runs and then accepts them again, the API recovers within ten seconds without a restart. The cockpit reconnects and shows the transactions created after the database returned, within the deadline stated under Interactions."
