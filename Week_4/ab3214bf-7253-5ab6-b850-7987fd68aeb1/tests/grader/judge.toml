id = "B3"
name = "B3"
type = "binary"
weight = 5
description = "Recipe: open a fresh `playwright` context at 1280x800 and load `http://127.0.0.1:4173/`. With `browser_evaluate`, read the computed text-align, text-transform and bounding rect of `heading \"EVERY HOUR\"`, then take a screenshot. A one-line, centred or left-aligned headline fails. Pass: the headline is set in capitals on two right-aligned lines near the right edge with a font size of 10 to 15 percent of the viewport width."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-58",
]
evidence = "screenshot"
cites = "L295, L164"

