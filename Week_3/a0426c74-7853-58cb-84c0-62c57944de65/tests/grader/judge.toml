type = "binary"
weight = 3
description = "Recipe: List every interface, abstract class, factory, wrapper or generic helper with an implementation slot that has exactly one implementation. Each instance is a defect, cited as `file:line`. Pass: No abstraction in the source has a single implementation."

[criterion.annotations]
channel = "quality"
