weight = 3
description = "Recipe: 1. `touch` at 375x812, open `/` as a guest. 2. Probe `document.scrollingElement.scrollWidth` and the right edge of the headline. 3. Take a screenshot of the first screen. 4. Scroll to the test sheet, probe its right edge and take a second screenshot. Pass: neither the headline nor the test sheet extends past the right edge of the 375 px viewport."

[criterion.annotations]
