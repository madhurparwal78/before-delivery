weight = 5
description = "Recipe: With the `source` MCP find every route that returns configuration, health, session or error data, the code that serves the front-end, and any build-time define or injection of environment values into client code. Any service URL or credential reaching those places fails, cite each as `file:line`. Pass: no environment value for a service URL or credential is returned by a route, embedded in served client assets or interpolated into an error message."

[criterion.annotations]
channel = "source"
