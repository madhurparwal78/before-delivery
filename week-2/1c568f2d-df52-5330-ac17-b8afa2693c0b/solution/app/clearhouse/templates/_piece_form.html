<form class="form piece-form" data-piece-form novalidate>
  <div class="field">
    <label for="field-title">Title</label>
    <p class="field__error" id="field-title-error" hidden></p>
    <input id="field-title" name="title" value="{{ piece.title if piece else '' }}" maxlength="200">
  </div>
  <div class="field">
    <label for="field-summary">Summary</label>
    <p class="field__hint" id="field-summary-hint">20 to 600 characters.</p>
    <p class="field__error" id="field-summary-error" hidden></p>
    <textarea id="field-summary" name="summary" rows="4" aria-describedby="field-summary-hint">{{ piece.summary if piece else '' }}</textarea>
  </div>
  <div class="field field--short">
    <label for="field-fee">Fee in dollars</label>
    <p class="field__error" id="field-fee-error" hidden></p>
    <input id="field-fee" name="fee" inputmode="decimal" class="mono" value="{{ (piece.fee_cents | money)[1:] | replace(',', '') if piece else '0.00' }}">
  </div>
  <button type="submit" class="btn btn--primary">Save draft</button>
</form>
