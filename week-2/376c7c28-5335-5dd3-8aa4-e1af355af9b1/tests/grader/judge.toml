description = "Recipe: `playwright` at 1280x800. 1) Sign in as studio `ember-lane`, priya@ember-lane.example, password `kilnroom-2026`, and open Log a piece. 2) Use browser_evaluate to read the computed background and text colour of `button \"Log piece\"`, and collect the computed colour, background-color and border-color of every visible element whose colour has HSL saturation above 25% and HSL lightness from 20% to 80% (the warm near-black ground and warm off-white ink are excluded). 3) Screenshot Log a piece. 4) Sign out, sign in as owner rowan@ember-lane.example and repeat step 2 and the screenshot on Dashboard. Pass: on both screens every saturated colour outside photos, the Log piece button fill behind its near-black label included, is one orange (all hues within 10 degrees of each other, from 15 to 40 degrees)."

