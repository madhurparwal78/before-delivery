    "S3",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 78
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "killbill", env = {} },
    { name = "minio", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Pegworth Desk <desk@pegworth.example>" } },
]

[criterion_weights]
B1 = 5
B2 = 5
B3 = 5
B4 = 3
B5 = 3
B6 = 3
B7 = 3
B8 = 3
