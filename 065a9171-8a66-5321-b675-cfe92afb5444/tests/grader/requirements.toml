[[requirements]]
id = "DP-61"
title = "Missed clock-out"
text = "An attendance left without a clock-out becomes a missed clock-out 4 hours after its rostered end, which counts zero worked hours, refuses a late clock-out, never blocks a later clock-in and is listed on the home's Today until corrected, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "clock-in-out"
tests = [
    "test_app.py::test_missed_clock_out",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-62"
title = "Removed shifts are gone everywhere"
text = "Removing a rota assignment takes it off the rota, My shifts, Today counts, previews, clock-in matching and the hours of later leave requests, cancels any claimed cover behind it, and lets the same person be added again, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "team-rota"
tests = [
    "test_app.py::test_removed_assignment_gone",
    "test_app.py::test_removed_claim_cancels_cover",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-63"
title = "One claim per retry key"
text = "A cover claim carries an Idempotency-Key, so retries and concurrent duplicates with that key return the one stored success and the same key on a different request is refused, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "bank-cover-claim"
tests = [
    "test_app.py::test_claim_idempotency",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-64"
title = "Sick days return holiday"
text = "Rostered hours of annual leave that fall on days the requester is off sick go back into their balance, and the same balance shows on /api/me, My shifts and the submit check, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "leave-request"
tests = [
    "test_app.py::test_sick_days_return_holiday",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-65"
title = "One open attendance per person"
text = "Of clock-ins or clock-outs sent at the same moment by one person with different Idempotency-Keys exactly one succeeds and the rest are refused with nothing written, so a person has at most one open attendance and a shift at most one attendance, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "clock-in-out"
tests = [
    "test_app.py::test_concurrent_punches_one_attendance",
]
criteria = []
parameter_cases = []

