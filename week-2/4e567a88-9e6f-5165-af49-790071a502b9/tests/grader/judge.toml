name = "Q2"
type = "binary"
weight = 5
description = "Recipe: for each of job state transitions, unit and charge computation with its rounding, rate selection by submission time, model access resolution, payload projection and budget period boundaries, find where it is decided. Then check that submission, settlement, the meter, CSV export, webhooks and screens reuse that one site. A second implementation or an inline re-derivation of any of the six fails. Cite both sites as `file:line`. Pass: each of the six rules is decided in exactly one place that every caller reuses."

[criterion.annotations]
channel = "quality"
