description = "Recipe: read the error type, the central error handler and every place a route or middleware sends a non-2xx response. A route that writes its own error JSON, a framework default error page or text body, or a leaked stack trace counts as a defect; cite each as file:line. Pass: every error response is produced through one error type rendered into the one error body the brief defines."

