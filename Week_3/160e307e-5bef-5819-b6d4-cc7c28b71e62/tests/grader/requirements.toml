[[requirements]]
id = "DP-01"
title = "Guest session and welcome"
text = "A first visit to `/` gets the `dc_session` cookie and lands on `/welcome`, and pressing `button \"Continue\"` with a typed name and `radio \"Avatar 7\"` selected lands on `/` with `link \"<name> profile\"`, keeping the same name and avatar 7 after reload and in `GET /api/me`."
kind = "behavior"
primary = "workflow"
workflow = "guest-onboarding"
tests = [
    "test_app.py::test_wf_guest_onboarding_happy",
    "test_app.py::test_wf_guest_onboarding_hero_phone",
]
criteria = []
parameter_cases = []

