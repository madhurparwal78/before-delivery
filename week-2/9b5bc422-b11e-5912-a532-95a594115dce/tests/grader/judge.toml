description = "Recipe: `touch` at 375x812. 1. Open `/`, then `/doc/seed-welcome?view=canvas`. 2. Probe the bounding boxes of `region \"Canvas\"` and the strip holding `button \"Zoom in\"` and `status \"Zoom level\"`. 3. Take a screenshot. Pass: a small paper strip holding the zoom controls and readout sits at the bottom edge of the `Canvas` region on the dark green table."

