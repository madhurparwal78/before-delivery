[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: source MCP. 1) Find where configuration is read. 2) Trace each of the database URL, SMTP host and port, public URL, public port and the four window lengths to its use, citing each as `file:line`. 3) Defaults the brief documents are allowed: `mailpit`/1025 for SMTP, 4173 for the port, and the brief's default seconds for each window. The fixed durations the brief pins without a variable (the 90-day call window, 45-minute calls, the 15-second recheck and the retry waits) are not window lengths. Pass: each of these settings is read from its environment variable at start, with no other hard-coded service address or window length."

[criterion.annotations]
