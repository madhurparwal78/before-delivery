]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-06"
title = "Idempotent writes."
text = "A transfer, batch or deposit sent with an Idempotency-Key replays its stored first answer verbatim, refuses the key on another path or body, answers a key still in flight with 409 IDEMPOTENCY_KEY_IN_PROGRESS and forgets keys after the retention period, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "race-safety"
tests = [
    "test_app.py::test_wf_race_safety_idempotent_retry",
    "test_app.py::test_idempotency_retention",
]
criteria = []
parameter_cases = []

