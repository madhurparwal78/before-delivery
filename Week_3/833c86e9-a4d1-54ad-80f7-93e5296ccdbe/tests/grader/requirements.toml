[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[services]]
name = "postgres"

[services.env]
KIP_GRADING = "1"
KIP_HOLD_MS = "900000"
KIP_QUOTE_TTL_MS = "600000"
KIP_REVIEW_WINDOW_MS = "2592000000"
KIP_MAP_DEBOUNCE_MS = "400"
KIP_TYPE_DEBOUNCE_MS = "200"
KIP_PAGE_SIZE = "5"
KIP_SSE_HEARTBEAT_MS = "2000"
KIP_TOAST_MS = "5000"
KIP_LOGIN_RATE = "1000"
KIP_LOOKUP_RATE = "1000"
KIP_SEARCH_RATE = "100000"
KIP_IMPORT_MAX_BYTES = "1000000"

[[services]]
name = "minio"

[services.env]

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

