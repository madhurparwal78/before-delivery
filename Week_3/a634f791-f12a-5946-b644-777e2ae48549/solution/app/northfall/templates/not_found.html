{% extends "base.html" %}
{% import "_icons.html" as icons %}
{% block title %}{{ t.not_found }}{% endblock %}
{% block main %}
<div class="error-page">
  <p class="wordmark"><span>Northfall</span></p>
  <h1 class="display-xl" data-arrive>{{ t.not_found }}</h1>
  <p class="lede">{{ t.not_found_lede }}</p>
  <p class="error-links">
    <a class="text-link" href="{{ prefix or '/' }}">{{ t.go_home }}{{ icons.arrow() }}</a>
    <a class="text-link" href="{{ prefix }}/references">{{ t.go_index }}{{ icons.arrow() }}</a>
  </p>
</div>
{% endblock %}
