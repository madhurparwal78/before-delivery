description = "Recipe: read the TypeScript configuration, then search for `any`, `as unknown as`, `@ts-ignore`, `@ts-expect-error` and unchecked non-null assertions, and compare identifier names with the brief's terms (drawing, object, handle, layer, trace, issue, share link, export, title-block revision). Synonyms such as doc, shape, comment or ticket for those concepts fail, and entity is allowed only inside the DXF reader and writer. Cite each defect as `file:line`. Pass: the code is strictly typed idiomatic TypeScript with names matching the brief's domain terms."

