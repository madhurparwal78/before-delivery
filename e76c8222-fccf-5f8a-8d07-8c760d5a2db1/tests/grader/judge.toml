[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: `source`. 1) Find every place the vermilion signal colour is written in stylesheets, CSS-in-TS and inline styles, whether as a named token, a CSS variable or a direct colour literal; tokens and literals count equally. 2) List every selector or component that applies it, citing each as `file:line`. 3) Treat any use on a button, link, focus ring, seat-taken text or decoration as a defect, and treat a client where no failing gate pip is styled vermilion as a defect. Pass: the vermilion colour styles failing gate pips and is applied only to failing gate pips, gate-failure reasons, the 'In cancellation window' marker or the in-window card's left edge."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-44",
]
evidence = "file_line"
cites = "L203"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 3
description = "Recipe: `source`. 1) Search all client styles and components for `box-shadow`, `text-shadow`, `drop-shadow`, `linear-gradient`, `radial-gradient`, `conic-gradient`, `backdrop-filter` and `blur(`, ignoring values set to `none` and citing each other match as `file:line`. A `box-shadow` with zero offsets and zero blur (an inset or spread hairline or ring, such as `inset 0 0 0 1px`) is a flat hairline, not a shadow. 2) Find the style that draws the rule under each board day group and cite it as `file:line`. 3) Cards, the detail pane and dialogs may use any flat fill and may be separated by hairline borders, hairline rules or spacing alone; neither a fill that differs from the page nor the absence of individual borders is a defect. Pass: the client styles apply no offset or blurred shadow, gradient or blur anywhere and define a 1 to 2 pixel hairline rule for the board's day groups."

