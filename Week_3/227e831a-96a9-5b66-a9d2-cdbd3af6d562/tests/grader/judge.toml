[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server configuration entrypoint, then search the server source for service URL literals, bucket names, access keys and passwords (patterns such as `http://`, `postgres`, `secret`, `accessKey`, `minio`). The brief's documented defaults (the port, the seed choice, the seed passphrase and profile) may be literals, and any hard-coded service URL or credential fails, cited as `file:line`. Pass: every service URL, bucket name or credential in the server source is read from the published environment variables."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-47",
]
evidence = "file_line"
cites = "L136, L1200-L1202, L1204-L1216"

