id = "DP-58"
title = "Shared rate limits"
text = "Public reads, candidate requests, sign-in attempts and console writes are counted per client or per account in the database across every instance, and requests over a limit answer 429 with Retry-After and RateLimit headers."
kind = "behavior"
primary = "pytest"
workflow = "platform-operations"
tests = [
