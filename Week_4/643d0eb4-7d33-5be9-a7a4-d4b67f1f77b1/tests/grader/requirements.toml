[[requirements]]
id = "DP-95"
title = "Bulk revoke is all or nothing behind its phrase"
text = "A mismatched confirmation phrase revokes nothing, changes no grant, appends no log entry and announces the published refusal sentence, while a matching phrase revokes every named grant or none of them when any one cannot be revoked."
