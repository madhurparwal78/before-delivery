[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the client source tree (the frontend entry that `npm run build` bundles and every module it imports). Search for sim clock, timer, countdown, wake, penalty, setInterval, setTimeout, Date.now and any table of rule ids, wake minimums, penalties or timer limits, and trace where each displayed sim time and strip timer text gets its value. Browser timers that only set or clear motion markers are allowed. Pass: no client file counts the sim clock or a strip timer on its own (formatting a replay position as the session start plus the slider offset is allowed), and no client file decides a rule outcome."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-61",
]
evidence = "file_line"
cites = "L89, L497, L502, L1026"

