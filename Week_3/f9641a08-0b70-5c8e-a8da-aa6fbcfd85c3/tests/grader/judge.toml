weight = 3
description = "Recipe: find where the grading setup route is registered, read its guard, then search the source for test-mode branches, debug routes and seed-reset hooks. Any such extra hook fails. Pass: the grading setup route is registered only when a grading token is configured."

[criterion.annotations]
