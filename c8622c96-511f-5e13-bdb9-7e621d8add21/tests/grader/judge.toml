[judge]
judge = "codex"
model = "openai/gpt-5.6-sol"
version = "0.163.0"
cwd = "/judge-workspace"
timeout = 2400
mode = "batched"
samples = 3
guard = "penalize"
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "normal",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_press_key",
    "browser_resize",
    "browser_select_option",
    "browser_hover",
    "browser_drag",
    "browser_tabs",
    "browser_wait_for",
    "browser_mouse_wheel",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "reduced"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "reduced",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_press_key",
    "browser_resize",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "touch"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "touch",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_press_key",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "source"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "source-mcp",
]
allowed_tools = [
    "list_files",
    "read_file",
    "search_files",
]

[scoring]
aggregation = "weighted-mean"

[[criterion]]
id = "B1"
name = "B1"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800. 1. Open http://127.0.0.1:4173 and sign in as the invented seed picture editor priya@harbor-light.example with password darkroom-proof-26. 2. Open `/sheet` and wait for the tiles. 3. Probe with browser_evaluate the computed background colour of the document body, or of the outermost element that paints the page ground. 4. Screenshot the contact sheet. Pass: the page ground is a warm off-white with lightness 90% or higher, a hue between 15 and 60 degrees, not pure white."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-57",
]
evidence = "screenshot"
cites = "L57, L210-L211"

[[criterion]]
id = "B2"
name = "B2"
type = "binary"
weight = 3
description = "Recipe: `playwright` at 1280x800. 1. Open http://127.0.0.1:4173 and sign in as the invented seed picture editor priya@harbor-light.example with password darkroom-proof-26. 2. Open `/sheet` and wait for the tiles. 3. Probe with browser_evaluate the computed text colour of the tile titles inside `region 'Contact sheet'`. 4. Screenshot the contact sheet. Pass: the tile title text is a near-black ink with lightness 20% or lower."

[criterion.annotations]
channel = "experience"
