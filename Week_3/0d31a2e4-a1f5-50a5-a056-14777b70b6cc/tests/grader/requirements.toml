[[if_rules]]
id = "IF-01"
text = "/app/run.json exists, with \"_schema\":\"run-manifest-v1\" and string install, build and serve commands that build and serve the app as described in Deployment."
tests = [
    "test_app.py::test_if_run_manifest",
]
parameter_cases = []

[[if_rules]]
id = "IF-02"
text = "/app/THIRD_PARTY_NOTICES.md lists every shipped package (name, version, licence) and every shipped font (family, file, licence); a package ships when /app/package.json lists it under dependencies or optionalDependencies, along with every package those depend on in turn as installed; devDependencies hold build and test tooling only, so after the build npm prune --omit=dev leaves an app that still serves the same pages; a font ships when its file is in the app outside node_modules, build output included."
tests = [
    "test_app.py::test_if_third_party_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Shipped packages use only MIT, ISC, BSD-2-Clause, BSD-3-Clause or Apache-2.0 licences, and shipped fonts use only OFL-1.1, with the two allowlists kept separate."
tests = [
    "test_app.py::test_if_licence_allowlists",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "PostgreSQL is the only datastore: no other database, cache server, object storage, replay archive or file-based store, and no replay video or snapshot files; the photo-finish re-simulates from inputs stored in PostgreSQL."
tests = [
    "test_app.py::test_if_postgres_only_datastore",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "At runtime the app contacts no host other than its configured services, except the direct WebRTC voice connections between party members' own browsers: fonts, icons and scripts are self-hosted, and voice uses no external STUN or TURN servers."
tests = [
    "test_app.py::test_if_self_hosted_and_no_stun",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "Server and browser source is TypeScript, compiled with strict type checking."
tests = [
    "test_app.py::test_if_strict_typescript",
]
parameter_cases = []

[[if_rules]]
id = "IF-07"
text = "The provided service compose files and seeded service configuration stay unchanged."
tests = [
    "test_app.py::test_if_service_config_untouched",
]
parameter_cases = []

