<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-label="Greenfield: from a prose brief to a working web application, graded in a live browser">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#2fd38a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2fd38a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.12" cy="0.95" r="0.5">
      <stop offset="0" stop-color="#7a99d1" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7a99d1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfeedd"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a99d1"/>
      <stop offset="1" stop-color="#2fd38a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="560" rx="28" fill="url(#dots)"/>
  <rect width="1600" height="560" rx="28" fill="url(#glow)"/>
  <rect width="1600" height="560" rx="28" fill="url(#glow2)"/>

  <!-- wordmark -->
  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(96 150)">
      <rect width="14" height="14" rx="3" fill="#2fd38a"/>
      <text x="26" y="12" font-size="17" letter-spacing="3.4" fill="#9fb0cc" font-weight="600">AGENT BENCHMARK · WEB APPLICATIONS</text>
    </g>
    <text x="92" y="268" font-size="104" font-weight="800" letter-spacing="-3" fill="url(#word)">Greenfield</text>
    <text x="96" y="326" font-size="27" fill="#c9d3e6">From a prose brief and an empty <tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#2fd38a">/app</tspan></text>
    <text x="96" y="364" font-size="27" fill="#c9d3e6">to a working app, graded in a live browser.</text>
    <g transform="translate(96 418)" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="17">
      <rect width="118" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="59" y="25" text-anchor="middle" fill="#dbe4f3">pytest</text>
      <rect x="132" width="150" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="207" y="25" text-anchor="middle" fill="#dbe4f3">workflows</text>
      <rect x="296" width="124" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="358" y="25" text-anchor="middle" fill="#dbe4f3">rubric</text>
    </g>
  </g>

  <!-- brief document -->
  <g transform="translate(860 118)" filter="url(#shadow)">
    <rect width="190" height="250" rx="16" fill="#18223a" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="24" y="30" width="96" height="12" rx="6" fill="#7a99d1"/>
    <rect x="24" y="64" width="142" height="8" rx="4" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="24" y="84" width="128" height="8" rx="4" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="24" y="104" width="140" height="8" rx="4" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="24" y="124" width="104" height="8" rx="4" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="24" y="156" width="70" height="10" rx="5" fill="#7a99d1" fill-opacity="0.7"/>
    <rect x="24" y="184" width="138" height="8" rx="4" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="24" y="204" width="118" height="8" rx="4" fill="#ffffff" fill-opacity="0.16"/>
    <text x="95" y="290" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" fill="#9fb0cc">instruction.md</text>
  </g>

  <!-- flow arrow -->
  <g fill="none" stroke="#2fd38a" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round">
    <path d="M1066 243 C 1090 243, 1098 243, 1122 243" stroke-dasharray="2 9"/>
  </g>
  <path d="M1122 235 l12 8 l-12 8 z" fill="#2fd38a"/>

  <!-- browser window -->
  <g transform="translate(1148 82)" filter="url(#shadow)">
    <rect width="372" height="330" rx="18" fill="#f7f8fa"/>
    <path d="M0 18 a18 18 0 0 1 18 -18 h336 a18 18 0 0 1 18 18 v28 h-372 z" fill="#e7eaf0"/>
    <circle cx="24" cy="23" r="6" fill="#ff6159"/>
    <circle cx="44" cy="23" r="6" fill="#ffbd2e"/>
    <circle cx="64" cy="23" r="6" fill="#28c941"/>
    <rect x="92" y="13" width="248" height="20" rx="10" fill="#ffffff"/>
    <text x="106" y="28" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#6b7385">localhost/app</text>

    <rect x="22" y="66" width="150" height="14" rx="7" fill="#0b1020"/>
    <rect x="22" y="90" width="230" height="9" rx="4.5" fill="#c9cfdb"/>

    <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">
      <g transform="translate(22 124)">
        <rect width="328" height="44" rx="10" fill="#ffffff" stroke="#e3e7ee"/>
        <circle cx="24" cy="22" r="11" fill="#2fd38a"/>
        <path d="M18.5 22 l4 4 l7.5 -8" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="48" y="17" width="150" height="10" rx="5" fill="#c9cfdb"/>
        <text x="312" y="27" text-anchor="end" fill="#1b7f4b" font-weight="600">pass</text>
      </g>
      <g transform="translate(22 178)">
        <rect width="328" height="44" rx="10" fill="#ffffff" stroke="#e3e7ee"/>
        <circle cx="24" cy="22" r="11" fill="#2fd38a"/>
        <path d="M18.5 22 l4 4 l7.5 -8" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="48" y="17" width="118" height="10" rx="5" fill="#c9cfdb"/>
        <text x="312" y="27" text-anchor="end" fill="#1b7f4b" font-weight="600">pass</text>
      </g>
      <g transform="translate(22 232)">
        <rect width="328" height="44" rx="10" fill="#ffffff" stroke="#e3e7ee"/>
        <circle cx="24" cy="22" r="11" fill="none" stroke="#e0a400" stroke-width="2.6"/>
        <rect x="48" y="17" width="170" height="10" rx="5" fill="#c9cfdb"/>
        <text x="312" y="27" text-anchor="end" fill="#9a6b00" font-weight="600">checking</text>
      </g>
    </g>
    <rect x="22" y="292" width="328" height="8" rx="4" fill="#e3e7ee"/>
    <rect x="22" y="292" width="218" height="8" rx="4" fill="#2fd38a"/>
  </g>

  <!-- health probe chip -->
  <g transform="translate(1164 444)" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15">
    <rect width="340" height="40" rx="20" fill="#2fd38a" fill-opacity="0.12" stroke="#2fd38a" stroke-opacity="0.5"/>
    <circle cx="26" cy="20" r="5" fill="#2fd38a"/>
    <text x="44" y="25" fill="#bfeedd">health probe → 200 · deployed</text>
  </g>
</svg>
