[[if_rules]]
id = "IF-01"
text = "/app/run.json exists, is valid JSON with string install, build and serve, and has _schema set to run-manifest-v1."
tests = [
    "test_app.py::test_if_run_manifest",
]
parameter_cases = []

[[if_rules]]
id = "IF-02"
text = "/app/THIRD_PARTY_NOTICES.md lists every shipped package by name, version and licence, plus every bundled font; shipped packages are the production dependency tree as reported by npm ls --omit=dev --all --json or the lockfile's non-dev packages."
tests = [
    "test_app.py::test_if_third_party_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Every shipped package and bundled font uses one of these licences: MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD or OFL-1.1."
tests = [
    "test_app.py::test_if_licences",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "The only datastores are the provided PostgreSQL, MinIO bucket and Kill Bill; there is no SQLite, Redis, in-memory store standing in for records, or local files used as records."
tests = [
    "test_app.py::test_if_datastores",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "The provided service definitions and their development credentials are left unchanged."
tests = [
    "test_app.py::test_if_service_definitions",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "All hand-written application source is TypeScript; plain JavaScript appears only as build output or tool configuration."
tests = [
    "test_app.py::test_if_typescript_only",
]
parameter_cases = []

