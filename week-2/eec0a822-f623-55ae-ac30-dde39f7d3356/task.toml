[task]
name = "lumen-tide/tidewright"
version = "1.0.0"
description = "Tidewright by Lumen Tide: an operations workspace for crewed solar-electric catamaran charter companies sailing from Split and Lavrio. It covers holds and deposits invoiced in Kill Bill, a passage planner with a live battery charge ribbon, a crew rota checked against maritime rest rules on elapsed hours, berth and shore-power booking, ship's stores, battery energy logs in MinIO, a private guest manifest with passport erasure, partner broker pages and a public fleet site."
authors = [
    { name = "Sankalp Goel", email = "sankalp.goel5@ethara.ai" },
    { name = "Sonu Sharma", email = "sonu.sharma@ethara.ai" },
]
