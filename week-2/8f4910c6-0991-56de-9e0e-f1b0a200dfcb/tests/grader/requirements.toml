[[requirements]]
id = "DP-01"
title = "Workspace sign-in and invitations"
text = "A wrong password shows the sign-in error and the right one lands each role on its home screen. Sign out returns to the sign-in screen. A booker invited by the agency director sets a password from the emailed link and lands signed in on the board."
kind = "behavior"
primary = "workflow"
workflow = "workspace-access"
tests = [
    "test_app.py::test_wf_workspace_access_sign_in",
    "test_app.py::test_wf_workspace_access_invitation",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Identical account replies"
text = "Forgot-password and invitation requests answer with the same status and body whether or not the email already has an account, and send only the emails the Business rules allow."
kind = "behavior"
primary = "pytest"
workflow = "workspace-access"
tests = [
    "test_app.py::test_account_replies_identical",
]
criteria = []
parameter_cases = []

