    "email_semicolon",
    "email_space",
    "email_angle",
]

[[requirements]]
id = "DP-56"
title = "One winner for stage moves"
text = "Concurrent stage moves at the same version, a candidate withdrawal racing a move, or a requisition close racing a move leave exactly one effect, with one decision, one stage email and one audit entry, and the loser gets 412 or 409 as stated in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "recruiter-pipeline"
