id = "DP-02"
title = "Booking request intake"
text = "A requester (for their own organisation) or the coordinator submits a request that is validated, receives a booking reference, starts as Submitted and gets one or two seats by the team seat rule in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "request-intake"
tests = [
