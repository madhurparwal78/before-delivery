[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "mailpit-down"
port = 4174
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"
MAIL_RETRY_SECONDS = "45"

[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "mailpit-down-short-ttl"
port = 4176
url_env = "APP_MAILPIT_DOWN_SHORT_TTL_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"
MAIL_RETRY_SECONDS = "45"
PROPOSAL_LINK_TTL_SECONDS = "20"

[[outages]]
id = "high-limits"
port = 4177
url_env = "APP_HIGH_LIMITS_URL"

[outages.env]
ENQUIRY_LIMIT_PER_SENDER = "1000"
ENQUIRY_LIMIT_PER_IP = "1000"

[[outages]]
id = "strict-pacing"
port = 4178
url_env = "APP_STRICT_PACING_URL"

[outages.env]
ENQUIRY_LIMIT_PER_IP = "5"

[[requirements]]
id = "DP-01"
title = "Sound gate"
text = "The journey and private listening page open behind a modal sound gate, nothing makes a sound until the visitor chooses \"Enter with sound\" or \"Enter muted\", and a muted visitor drives every visual and state change exactly as a listening visitor does with every layer's volume at zero."
kind = "behavior"
primary = "pytest"
workflow = "listening-journey"
tests = [
    "test_app.py::test_sound_gate",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Station corridor"
text = "After the gate, the journey shows one full-screen station per published public project in the operator's order, each with its title, credit label, credit line, role and blurb in the lower-left third, followed by the brief form."
kind = "behavior"
primary = "pytest"
workflow = "listening-journey"
tests = [
    "test_app.py::test_wf_listening_journey_scroll",
]
criteria = []
parameter_cases = []

