[[requirements]]
id = "DP-01"
title = "Browser-bound sign-in"
text = "Sign-in goes through Keycloak with a fresh state and code challenge per attempt, and a callback with a missing, reused or other-browser state shows the published sign-in error and creates no session."
kind = "behavior"
primary = "pytest"
workflow = "sign-in"
tests = [
    "test_app.py::test_signin_state_bound_to_browser",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Seeded accounts and roles"
text = "At start the app ensures the four roles and the seeded Keycloak accounts exist, gives a first-time self-registered user the client role, and lands each role on its published route after sign-in."
kind = "behavior"
primary = "pytest"
workflow = "sign-in"
tests = [
    "test_app.py::test_seeded_roles_and_landing",
]
criteria = []
parameter_cases = [
    "producer",
    "client",
    "crew",
    "self-registered",
]

[[requirements]]
id = "DP-03"
title = "Expired access resumes the action"
text = "When access expires during a request the browser refreshes once, shared by concurrent requests, and replays the original request with its payload; a failed refresh shows the published signed-out message and keeps what was entered."
kind = "behavior"
primary = "pytest"
workflow = "sign-in"
tests = [
    "test_app.py::test_expired_access_refresh_replay",
    "test_app.py::test_wf_sign_in_failed_refresh_keeps_entries",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Sign-in returns to the interrupted step"
text = "A client who signs in from the brief or checkout comes back to the interrupted step with the pending answer saved once, at that step's published address as qualified in Interactions, and reloading that address shows the same screen."
kind = "behavior"
primary = "workflow"
workflow = "sign-in"
tests = [
    "test_app.py::test_wf_sign_in_brief_return",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-05"
title = "Brief answers saved per step"
text = "Each brief answer is validated and saved on the server step by step in order with the published field errors, and completing all six steps creates one commission in state briefed."
kind = "behavior"
primary = "pytest"
workflow = "brief"
tests = [
    "test_app.py::test_brief_steps_validated_in_order",
    "test_app.py::test_wf_brief_field_errors",
]
criteria = []
parameter_cases = []

