[[requirements]]
id = "DP-01"
title = "Create a stay by keyboard."
text = "With `N` pressed from any control in `Reservation timeline`, the clerk tabs through `New stay` with focus wrapping inside it, presses Enter on `Create stay`, hears the result in `Desk notices`, sees the new block on the timeline and gets focus back on the opener."
kind = "behavior"
primary = "workflow"
workflow = "stay-create-keyboard"
tests = [
    "test_app.py::test_wf_stay_create_keyboard_happy",
    "test_app.py::test_wf_stay_create_keyboard_empty_cell_reduced",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Exact nightly pricing."
text = "Every night of a stay is priced in whole cents by the published steps and one half-up rounding, matching each worked example in Business rules in the quote, the `Nightly breakdown` table, `Stay total` and every posted line."
kind = "behavior"
primary = "pytest"
workflow = "stay-create-keyboard"
tests = [
    "test_app.py::test_nightly_pricing_worked_examples",
]
criteria = []
parameter_cases = []

