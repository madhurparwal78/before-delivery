type = "binary"
weight = 5
description = "Recipe: read the server's error type, error responder and request pipeline, then search route handlers for error bodies written directly to the response. A handler that writes its own error JSON or reorders checks locally counts as a defect. Cite the helper and each bypass as `file:line`. Pass: every API error body is built through one error helper whose precedence order is decided in one place."

[criterion.annotations]
channel = "quality"
