[[requirements]]
id = "DP-49"
title = "Share dialog and downgrade banner survive refreshes"
text = "The Share dialog's periodic refresh never resets typed input, chosen role, field errors, an open confirm or focus, and a downgraded editor's tab keeps its banner through every timer and sends no further saves."
