[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: For each published PLOT_ setting in the brief's list, find the line that reads it from the environment and the code path it governs, such as toast lifetime, operation window, presence timeout, link and review lifetimes, upload limits, export step, rate limits and undo depth. A setting that is read but never used, or replaced by a literal number at its point of use, is a defect. Pass: Each published PLOT_ setting is read from its environment variable and drives the code path it governs."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
