[[requirements]]
id = "DP-01"
title = "Slot hold"
text = "A signed-in player holds a free court slot with POST /api/holds, which creates a held booking only after the payment provider authorises the organiser's guarantee for the full total, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "hold-and-pay"
tests = [
    "test_app.py::test_hold_needs_authorisation",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Per-minute pricing"
text = "Every quote, hold, match and lesson total is priced minute by minute, in whole cents, at the off-peak or peak rate in club time of the pricing version in force on the slot's club date."
kind = "behavior"
primary = "pytest"
workflow = "grid-browse"
tests = [
    "test_app.py::test_quote_per_minute",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Paid only on provider capture"
text = "A held booking becomes paid only when the provider's capture of the organiser's amount (the total as a final capture, or the first share as a non-final capture on a split booking) answers captured while the hold is still live, and any other answer leaves it held, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "hold-and-pay"
tests = [
    "test_app.py::test_paid_only_on_capture",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "One winner per slot"
text = "Of several players holding overlapping slots on the same court at once, exactly one gets the hold, and every other gets 409 SLOT_TAKEN and has its authorisation voided."
kind = "behavior"
primary = "pytest"
workflow = "hold-and-pay"
tests = [
    "test_app.py::test_one_winner_per_slot",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-05"
title = "Idempotent payments"
text = "Holds, payments, share payments, match creation and joins sent with an Idempotency-Key replay a stored 2xx, 402, 409 or 502 answer for the same body, run afresh after a 503 or any other unstored answer, and answer 409 IDEMPOTENCY_CONFLICT for a different body, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "payment-outage"
tests = [
    "test_app.py::test_idempotent_payment_actions",
    "test_app.py::test_idempotent_repeat_while_running_runs_afresh",
    "test_app.py::test_idempotent_repeat_waits_for_slow_first",
]
criteria = []
parameter_cases = []

