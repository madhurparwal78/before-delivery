[[criterion]]
id = "Q3"
name = "Q3"
type = "binary"
weight = 3
description = "Recipe: locate the approval and dual-approval thresholds, the per-method cutoffs, the expiry rule, the lockout count, the holiday rule, the New York midnight rule, the dollar-input format, the available-balance computation and the cockpit breakpoints. A repeated literal, such as a threshold number or breakpoint width written in two files, counts as a fail. Cite each definition and any duplicate as `file:line`. Pass: each listed rule or constant has exactly one definition that every use imports."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
