weight = 3
description = "Recipe: read the code that builds the map payload and the client settings it sends, the other response builders, and the client entry, then search client code and response bodies for service credentials, store endpoints and bucket names. Cite each defect as `file:line`. Pass: no service credential or URL reaches client code or any server response."

[criterion.annotations]
