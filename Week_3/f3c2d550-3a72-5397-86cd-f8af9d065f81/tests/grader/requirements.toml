[[requirements]]
id = "DP-01"
title = "Landing hero composition"
text = "The landing page shows the wordmark, the published headline, sentence and Open your deck action on the left, and the pinned wine-coloured field with the demo tile on the right, as described in Visual design."
kind = "visual"
primary = "rubric"
workflow = "landing"
tests = []
criteria = [
    "B1",
    "B2",
    "B3",
]
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Landing demo reel"
text = "The landing tile plays the three bundled demo stops through the fader, and scrolling the left column and moving the fader drive each other as described in Interactions."
kind = "behavior"
primary = "pytest"
workflow = "landing"
tests = [
    "test_app.py::test_landing_fader_and_scroll_drive_each_other",
    "test_app.py::test_wf_landing_rapid_input_settles",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Bundled demo stops"
text = "Landing always plays exactly the three bundled demo stops in seed order, with the seed's names, makers, years, millimetre size lines and computed swatches, announced in the published wording, whatever happens to the Demo reel or its references and whether or not storage is reachable."
kind = "behavior"
primary = "pytest"
workflow = "landing"
tests = [
    "test_app.py::test_wf_landing_demo_swatch_match",
    "test_app.py::test_wf_landing_independent_of_db",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Saved only once confirmed"
text = "A capture answers 201 only after storage confirms the byte-exact original and, while search is up, the search index confirms the document, and a failed capture leaves no row, search document, tile or stored object."
kind = "behavior"
primary = "pytest"
workflow = "capture"
tests = [
    "test_app.py::test_capture_confirmed_and_failure_leaves_nothing",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-05"
title = "Photo type and size from its bytes"
text = "Capture decides JPEG or PNG from the photo's bytes, names the stored original and reports its content type to match, rejects photos that are neither type with 422, and rejects photos over the pixel limit with 422 from their header dimensions within the published time and before any pixel is decoded or anything is stored, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "capture"
tests = [
    "test_app.py::test_capture_photo_type_and_pixel_limit",
]
criteria = []
parameter_cases = [
    "png_named_jpg",
    "jpeg_named_png",
    "svg_with_script",
    "png_signature_undecodable",
    "header_over_area",
    "header_over_side",
    "jpeg_header_over_area",
    "decodable_over_area",
    "side_at_limit",
    "area_at_limit",
]

[[requirements]]
id = "DP-06"
title = "Capture validation"
text = "Capture rejects invalid fields with 422 and the per-field copy from Feedback states, and rejects oversize bodies with 413, as qualified in API."
kind = "behavior"
primary = "pytest"
workflow = "capture"
tests = [
    "test_app.py::test_capture_validation_copy",
]
criteria = []
parameter_cases = [
