description = "Recipe: follow the `serve` command in `/app/run.json` into the serve module and every place that builds the Postgres, S3 and SMTP clients. Then search the source for DSN strings, endpoint URLs, bucket names, access keys, secret keys, SMTP hosts and ports. Seeded user passcodes are seed data, not service credentials. The brief's documented defaults (port 4173 and the 30-second notice hold) are allowed. Any other hard-coded service URL or credential fails; cite each as file:line. Pass: every service URL and credential comes from the environment variables the brief lists."

