    "recurring-visits",
    "plan-revision",
    "costing",
    "dependencies-bulk",
    "live-updates",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B7",
    "B8",
    "B9",
    "B10",
