[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: `source`. 1. Find the module that reads `DATABASE_URL`, `SMTP_HOST` and `SMTP_PORT` from `process.env`. 2. Search the server source, the client source, and the `package.json` scripts for `postgres://`, `postgresql://`, `smtp://`, and user names or passwords used to connect to PostgreSQL or SMTP. The brief requires seeded player accounts, so the seed password `Bounce-Seed-2026` and the `<handle>@wobblewell.test` emails in the seeding code are fixture data and do not fail. A service credential or a fallback default such as `postgres://postgres:postgres@localhost` fails. Cite each failing instance as `file:line`. Pass: no literal database or SMTP connection string or service credential appears in the source."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-45",
]
evidence = "file_line"
cites = "L740: `MAILPIT_URL` may be present and is not used by the app. No credential or connection string is hard-coded, logged, written into the browser bundle, or included in any response. Session cookies are named `pc_session` and are `HttpOnly` and `SameSite=Lax`."

[[criterion]]
id = "S18"
name = "S18"
type = "binary"
weight = 3
description = "Recipe: `source`. 1. Search the server source for every outbound network client: the PostgreSQL pool or client, the SMTP transport, `fetch`, `http.request`, `https.request`, `net.connect`, `tls.connect`, `dgram`, `dns` lookups and outbound WebSocket clients, and trace each destination to its value. 2. Search the browser source, `index.html` and stylesheets for absolute `http://` or `https://` URLs to fonts, icons, scripts or APIs, and read every `RTCPeerConnection` configuration. A destination other than `DATABASE_URL`, `SMTP_HOST`:`SMTP_PORT` or the page's own origin, any client that uses `MAILPIT_URL`, a CDN font or script URL, or any `stun:` or `turn:` entry fails. Build and test tooling outside the served app does not count. Cite each client and its destination as `file:line`. Pass: every runtime network client targets only `DATABASE_URL`, `SMTP_HOST`:`SMTP_PORT` or the page's own origin, with no STUN or TURN server."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-45",
]
evidence = "file_line"
cites = "L765: - IF-05: At runtime the app contacts no host other than its configured services. The one exception is the direct WebRTC voice connections between party members' own browsers. Fonts, icons and scripts are self-hosted, and voice uses no external STUN or TURN servers."

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: `source`. 1. Trace the WebSocket `tick` broadcast, the frames route and `POST /api/simulate` back to the simulation module. 2. Read the browser match view and the photo-finish view. Browser code that steps physics, decides finishes or assigns qualification fails. Interpolating between two received positions is allowed. Cite each instance as `file:line`. Pass: qualification is decided only in server modules."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-45",
