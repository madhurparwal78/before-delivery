weight = 3
description = "Recipe: Read the TypeScript configuration, then search server and browser source for explicit any, double casts through unknown that bypass the types, and compiler suppression comments. Any escape fails; cite each as file:line. Pass: Strict compiler settings are on with no type escape in the source."

