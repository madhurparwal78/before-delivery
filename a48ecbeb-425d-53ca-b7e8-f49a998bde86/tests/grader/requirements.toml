schema_version = 1
id_prefix = "DP"
mandatory_count = 60
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "storefront-scenes",
    "crate-drop",
    "live-totals",
    "limited-drop",
    "checkout",
    "subscription-changes",
    "dunning",
    "fulfilment",
    "refunds",
    "owner-settings",
    "retailers",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "S4",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 83
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "pocketbase", env = {} },
    { name = "minio", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Ceibo <orders@ceibo.test>" } },
    { name = "killbill", env = {} },
]

[criterion_weights]
B1 = 5
B2 = 5
B3 = 3
B4 = 3
B5 = 5
B6 = 3
B7 = 3
B8 = 5
B9 = 5
B10 = 3
B11 = 3
B12 = 3
S1 = 5
S2 = 5
S3 = 3
S4 = 3
Q1 = 3
Q2 = 3
Q3 = 3
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "postgres-down"
port = 4175
url_env = "APP_POSTGRES_DOWN_URL"

[outages.env]
DATABASE_URL = "postgresql://gf_down:gf_down@127.0.0.1:9/gf_down"

[[outages]]
id = "pocketbase-down"
port = 4176
url_env = "APP_POCKETBASE_DOWN_URL"

[outages.env]
POCKETBASE_URL = "http://127.0.0.1:9"

[[outages]]
id = "minio-down"
port = 4177
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4178
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"
MAILPIT_URL = "http://127.0.0.1:9"

[[outages]]
id = "short-timer"
port = 4179
url_env = "APP_SHORT_URL"

[outages.env]
HOLD_SECONDS = "20"
DUNNING_DAY_SECONDS = "3"
CHANGE_CUTOFF_HOURS = "1000"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
id = "DP-01"
title = "Scroll-scene storefront"
text = "The home page stacks the four scenes from Screens and layout, and every scene's heading and message is readable at every published viewport, with and without reduced motion."
kind = "behavior"
primary = "pytest"
workflow = "storefront-scenes"
tests = [
    "test_app.py::test_wf_storefront_scenes_viewports",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Can turntable"
text = "A 3D can generated in code turns with pointer drag, swipe, scroll and the turn buttons, reports its flavour and angle in its accessible name, and falls back to a layered drawing of the can without WebGL, as qualified in Motion and effects."
kind = "behavior"
primary = "pytest"
workflow = "storefront-scenes"
tests = [
    "test_app.py::test_wf_storefront_scenes_turntable",
    "test_app.py::test_can_fallback",
]
criteria = []
parameter_cases = []

