    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 79
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "minio", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Snaglight <notices@snaglight.example>" } },
]

[criterion_weights]
B1 = 5
B2 = 5
B3 = 3
B4 = 3
B5 = 3
B7 = 3
B8 = 3
B9 = 3
B10 = 3
B11 = 3
B12 = 3
B13 = 3
