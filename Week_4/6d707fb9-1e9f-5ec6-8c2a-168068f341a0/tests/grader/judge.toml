description = "Recipe: read the code for mass, energy conversion, the footprint sum, shares, data quality, scenario differences, Try one garment and the display rule, plus the database column types holding those values. Integer counts, washes, slider percents, timers, the provider's whole-number score and the whole `dataQualityPercent` once rounded in exact decimals do not count as published figures, and neither does a number used only for a bar's width or a validity check. A decimal library's own `toFixed` and rounding are exact. Pass: published figures stay in an exact decimal, scaled integer or string form from input to display, with no JavaScript `Number`, `parseFloat`, number `toFixed` or `Math.round` computing or rounding one and no float column storing one."

