{% extends "base.html" %}
{% block main %}
<section class="page-hero game" data-slug="{{ slug }}">
  <h1 class="display page-title page-title--plain">{{ name }}</h1>
  <p class="lede" id="game-desc"></p>
  <p class="game-community" id="game-community"></p>
  <table class="history" aria-label="Weekly history" id="history">
    <thead><tr><th scope="col">Week</th><th scope="col">Rank</th><th scope="col">Plays</th><th scope="col">Streams</th></tr></thead>
    <tbody></tbody>
  </table>
</section>
{% endblock %}
{% block scripts %}<script src="/static/js/trending.js?v={{ version }}"></script>{% endblock %}
