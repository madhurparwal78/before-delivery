const PRELUDE = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uTime; uniform float uLoop; uniform float uT; uniform float uFrame; uniform float uGrain;
out vec4 fragColor;
#define TAU 6.28318530718
#define PI 3.14159265359
const vec3 NIGHT=vec3(0.051,0.039,0.118);
const vec3 VIOLET=vec3(0.173,0.141,0.345);
const vec3 DUSK1=vec3(0.925,0.894,0.953);
const vec3 DUSK3=vec3(0.773,0.702,0.863);
const vec3 DUSK4=vec3(0.373,0.310,0.549);
const vec3 EMBER=vec3(0.957,0.635,0.349);
const vec3 MOON=vec3(0.953,0.937,0.906);
float hash(vec2 p){ vec3 p3=fract(vec3(p.xyx)*0.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float hash1(float n){ return hash(vec2(n, n*0.371+1.7)); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),u.x), mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),u.x),u.y); }
float fbm(vec2 p){ float v=0.0, a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p=mat2(1.6,1.2,-1.2,1.6)*p+vec2(17.1,9.2); a*=0.5; } return v; }
float phase(){ return fract(uTime/uLoop); }
float loopFbm(vec2 p, vec2 vel){ float ph=phase(); return mix(fbm(p+vel*ph*uLoop), fbm(p+vel*(ph-1.0)*uLoop), ph); }
float glow(float d, float r){ return exp(-d*d/(r*r)); }
float fill(float d, float aa){ return 1.0-smoothstep(-aa, aa, d); }
float sdBox(vec2 p, vec2 b){ vec2 d=abs(p)-b; return length(max(d,0.0))+min(max(d.x,d.y),0.0); }
float sdSeg(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0); return length(pa-ba*h); }
float sdTri(vec2 p, vec2 p0, vec2 p1, vec2 p2){
  vec2 e0=p1-p0, e1=p2-p1, e2=p0-p2; vec2 v0=p-p0, v1=p-p1, v2=p-p2;
  vec2 pq0=v0-e0*clamp(dot(v0,e0)/dot(e0,e0),0.0,1.0);
  vec2 pq1=v1-e1*clamp(dot(v1,e1)/dot(e1,e1),0.0,1.0);
  vec2 pq2=v2-e2*clamp(dot(v2,e2)/dot(e2,e2),0.0,1.0);
  float s=sign(e0.x*e2.y-e0.y*e2.x);
  vec2 d=min(min(vec2(dot(pq0,pq0), s*(v0.x*e0.y-v0.y*e0.x)), vec2(dot(pq1,pq1), s*(v1.x*e1.y-v1.y*e1.x))), vec2(dot(pq2,pq2), s*(v2.x*e2.y-v2.y*e2.x)));
  return -sqrt(d.x)*sign(d.y); }
vec3 finish(vec3 col, vec2 uv){
  float v=smoothstep(1.25,0.3,length((uv-0.5)*vec2(uRes.x/uRes.y,1.0)));
  col*=mix(0.7,1.0,v);
  col+=(hash(gl_FragCoord.xy*0.73+vec2(mod(uFrame,61.0)*7.13, mod(uFrame,37.0)*3.71))-0.5)*uGrain;
  return clamp(col,0.0,1.0); }
`;

}

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

function program(name) {
  if (programs[name]) return programs[name];
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, PRELUDE + SHADERS[name]));
  gl.bindAttribLocation(prog, 0, "aPos");
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  programs[name] = prog;
  return prog;
}

function draw(name, u) {
  const prog = program(name);
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.uniform2f(gl.getUniformLocation(prog, "uRes"), glCanvas.width, glCanvas.height);
  for (const [key, value] of Object.entries(u)) gl.uniform1f(gl.getUniformLocation(prog, key), value);
  gl.drawArrays(gl.TRIANGLES, 0, 6);
}

function renderClip(name, time, loop, frame) {
  draw(name, { uTime: time, uLoop: loop, uT: time / loop, uFrame: frame, uGrain: 0.03 });
  ctx.globalAlpha = 1;
  ctx.drawImage(glCanvas, 0, 0);
  return comp.toDataURL("image/png");
}

/* The film: scenes with 0.8 s crossfades, title cards and a story clock stamp. */
const FADE = 0.8;
const FILM = [
  { scene: "dusk", start: 0.0, end: 7.0, stamp: "21:00" },
  { scene: "city", start: 6.2, end: 13.0, stamp: "21:10" },
  { scene: "lake", start: 12.2, end: 19.5, stamp: "21:25" },
  { scene: "flowers", start: 18.7, end: 25.5, stamp: "21:38" },
  { scene: "moon", start: 24.7, end: 31.5, stamp: "21:45" },
  { scene: "lantern", start: 30.7, end: 36.5, stamp: "21:55" },
  { scene: "end", start: 35.7, end: 40.0, stamp: "" },
];
const TITLES = [
  { text: "21:00", sub: "the hour before sleep", start: 0.9, end: 5.2 },
  { text: "Let the day settle.", sub: "", start: 14.0, end: 18.3 },
  { text: "22:00 · Goodnight.", sub: "", start: 36.4, end: 40.6, mark: true },
];
// The Stillhour mark (src/story/components/Mark.tsx): a crescent inside a thin circle, on a 64-unit grid.
const MARK_CRESCENT = new Path2D("M30.34 18.50 A14.5 14.5 0 1 0 43.93 37.04 A11.5 11.5 0 0 1 30.34 18.50 Z");

const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const envelope = (start, end, t, fade) => smooth(start, start + fade, t) * (1 - smooth(end - fade, end, t));

function drawMark(x, y, scale, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x - 32 * scale, y - 32 * scale);
  ctx.scale(scale, scale);
  ctx.strokeStyle = "#f4a259"; ctx.fillStyle = "#f4a259"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(32, 32, 29, 0, Math.PI * 2); ctx.stroke();
  ctx.fill(MARK_CRESCENT);
  ctx.restore();
}

function renderFilm(frame) {
  const t = frame / 30;
  const W = comp.width, H = comp.height;
  ctx.globalAlpha = 1; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  FILM.forEach((seg, index) => {
    if (t < seg.start || t > seg.end) return;
    const alpha = index === 0 ? 1 : smooth(seg.start, seg.start + FADE, t);
    draw(seg.scene, { uTime: t, uLoop: 1, uT: (t - seg.start) / (seg.end - seg.start), uFrame: frame, uGrain: 0.018 });
    ctx.globalAlpha = alpha;
    ctx.drawImage(glCanvas, 0, 0);
  });
  const seg = [...FILM].reverse().find((s) => t >= s.start && t <= s.end);
  if (seg && seg.stamp) {
    const a = envelope(seg.start + 0.4, seg.end, t, 0.6) * 0.8;
    const shade = ctx.createLinearGradient(0, H - 150, 0, H);
    shade.addColorStop(0, "rgba(13,10,30,0)");
    shade.addColorStop(1, "rgba(13,10,30,0.55)");
    ctx.globalAlpha = a; ctx.fillStyle = shade; ctx.fillRect(0, H - 150, 320, 150);
    ctx.globalAlpha = a; ctx.fillStyle = "#f3efe7";
    ctx.font = "500 22px Mono"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    ctx.fillText(seg.stamp, 56, H - 52);
    ctx.fillRect(56, H - 44, 40, 1.5);
  }
  for (const title of TITLES) {
    const a = envelope(title.start, title.end, t, 0.9);
    if (a <= 0) continue;
    const rise = (1 - smooth(title.start, title.start + 1.4, t)) * 12;
    ctx.globalAlpha = a; ctx.fillStyle = "#f3efe7"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(13,10,30,0.55)"; ctx.shadowBlur = 24;
    const y = title.mark ? H * 0.58 : H * 0.36;
    ctx.font = `300 ${title.text.length > 8 ? 68 : 96}px Fraunces`;
    ctx.fillText(title.text, W / 2, y + rise);
    if (title.sub) { ctx.font = "400 24px Hanken"; ctx.globalAlpha = a * 0.85; ctx.fillText(title.sub, W / 2, y + 78 + rise); }
    ctx.shadowBlur = 0;
    if (title.mark) drawMark(W / 2, H * 0.36, 1.6, a);
  }
  const out = 1 - smooth(39.3, 40.0, t);
  if (out < 1) { ctx.globalAlpha = 1 - out; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H); }
  return comp.toDataURL("image/jpeg", 0.95);
}

const FONT_DIR = "../../public/fonts";
const faces = [
  new FontFace("Fraunces", `url(${FONT_DIR}/fraunces-latin-full-normal.woff2)`, { weight: "100 900" }),
  new FontFace("Hanken", `url(${FONT_DIR}/hanken-grotesk-latin-wght-normal.woff2)`, { weight: "100 900" }),
  new FontFace("Mono", `url(${FONT_DIR}/hanken-grotesk-latin-wght-normal.woff2)`, { weight: "100 900" }),
];
window.ready = Promise.all(faces.map((face) => face.load().then((loaded) => document.fonts.add(loaded)))).then(() => true);
</script>
