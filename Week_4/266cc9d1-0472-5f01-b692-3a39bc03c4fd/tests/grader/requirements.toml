[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[outages]]
id = "short-ttl"
port = 4176
url_env = "APP_SHORT_TTL_URL"

[outages.env]
REVIEW_LINK_TTL_SECONDS = "5"
DATABASE_URL = "${DATABASE_URL}_shortttl"
S3_BUCKET = "${S3_BUCKET}-shortttl"

[[requirements]]
