[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: open the server entrypoint and its config module, then search the source for the database URL, the S3 endpoint, region, bucket, path-style flag and key variables, and for connection-string or store-URL literals. Treat as allowed only the defaults the brief documents (the port, the lockout window and the idle period). Cite every literal credential, connection string or store URL as `file:line`. Pass: every database and object-store credential and URL is read from `process.env` at start with no hard-coded value or fallback."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-43",
]
evidence = "file_line"
cites = "L1556, L1562-L1570, L1127, L1140"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: read the browser source tree, the bundler config (any `define` or env-inlining settings), the HTML shell template and the handlers that build headers or JSON responses. Cite as `file:line` any client file referencing those variables, any bundler config inlining them, or any endpoint exposing them. Pass: no environment value from the brief's configuration list can reach the browser."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
