[[requirements]]
id = "DP-48"
title = "Regenerate has one winner"
text = "Regenerating a report link requires the token the device shows, a stale token is refused with the published 409 copy while the list refreshes in place, exactly one of two simultaneous regenerates wins, and a regenerate racing a revoke always ends revoked with every token refused."
kind = "behavior"
primary = "pytest"
workflow = "report-links"
tests = [
    "test_app.py::test_wf_report_links_regenerate_race",
