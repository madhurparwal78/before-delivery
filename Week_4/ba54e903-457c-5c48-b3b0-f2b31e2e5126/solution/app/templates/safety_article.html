{% extends "base.html" %}
{% block main %}
<article class="page-hero prose">
  <p class="tag">{{ article.category }} · {{ article.topic }}</p>
  <h1 class="display page-title page-title--plain">{{ article.title }}</h1>
  <p class="lede">{{ article.summary }}</p>
  {% for paragraph in article.body %}<p>{{ paragraph }}</p>{% endfor %}
  <p><a class="btn btn-ghost" href="/safety-library">Back to Safety library</a></p>
</article>
{% endblock %}
