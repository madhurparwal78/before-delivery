[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "wiremock-down"
port = 4175
url_env = "APP_WIREMOCK_DOWN_URL"

[outages.env]
WIREMOCK_URL = "http://127.0.0.1:9"
RENDER_QUEUE = "render.jobs.wiremock-down"

[[outages]]
id = "gotenberg-down"
port = 4176
url_env = "APP_GOTENBERG_DOWN_URL"

[outages.env]
GOTENBERG_URL = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_gotenberg_down"
S3_BUCKET = "${S3_BUCKET}-gotenberg-down"
RENDER_QUEUE = "render.jobs.gotenberg-down"

[[outages]]
id = "mailpit-down"
port = 4177
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"
RENDER_QUEUE = "render.jobs.mailpit-down"
DATABASE_URL = "${DATABASE_URL}_mailpit_down"
S3_BUCKET = "${S3_BUCKET}-mailpit-down"

[[outages]]
id = "mailpit-recovered"
port = 4178
url_env = "APP_MAILPIT_RECOVERED_URL"

[outages.env]
RENDER_QUEUE = "render.jobs.mailpit-down"
DATABASE_URL = "${DATABASE_URL}_mailpit_down"
S3_BUCKET = "${S3_BUCKET}-mailpit-down"

[[outages]]
id = "minio-down"
port = 4179
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
RENDER_QUEUE = "render.jobs.minio-down"
DATABASE_URL = "${DATABASE_URL}_minio_down"

[[outages]]
id = "short-timer"
port = 4180
url_env = "APP_SHORT_URL"

[outages.env]
HOLD_SECONDS = "5"
PROVIDER_TIMEOUT_SECONDS = "3"
RENDER_BACKOFF_SECONDS = "1"
REFUND_WINDOW_SECONDS = "20"
IDEMPOTENCY_TTL_SECONDS = "10"
RENDER_QUEUE = "render.jobs.short"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

