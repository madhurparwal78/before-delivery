[[requirements]]
id = "DP-01"
title = "Request intake pull."
text = "Every pending request in the company request intake appears in triage as exactly one Triage task within 5 seconds, as qualified in Services."
kind = "behavior"
primary = "pytest"
workflow = "triage-intake"
tests = [
    "test_app.py::test_intake_pull_creates_exactly_one_triage_task",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Decisions written back to the intake."
text = "Accepting, declining or merging a triage task becomes final only after the intake records the outcome, and if the intake refuses or cannot be reached the task stays in triage unchanged, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "triage-intake"
tests = [
    "test_app.py::test_decision_written_back_before_it_is_final",
