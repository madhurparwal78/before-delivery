[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "short-timer"
port = 4176
url_env = "APP_SHORT_URL"

[outages.env]
HOLD_SECONDS = "5"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
id = "DP-01"
title = "Run manifest and health"
text = "The app installs, builds and serves from `/app/run.json` on port 4173 (or `APP_PUBLIC_PORT`) and answers `GET /api/health` with 200 `{\"status\":\"ok\"}` whether or not billing and photo storage are reachable."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_wf_cross_cutting_health",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Schema and seed on every start"
text = "Every start applies the schema and the Seed data idempotently, so a fresh empty database serves the seeded yard and a restarted or second instance on the same database changes nothing."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_wf_cross_cutting_seed",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Credentials from the environment"
text = "Database, storage and billing credentials and URLs are read from the environment variables in Configuration and secrets, never hard-coded and never sent to the browser."
kind = "source"
primary = "rubric"
workflow = "cross-cutting"
tests = []
criteria = [
    "S1",
    "S2",
    "S3",
]
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Server boundary"
text = "The server enforces the request size, content type and same-origin rules, never serves source files, manifests or credentials, and answers errors in the single precedence order stated in API."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_server_boundary",
]
criteria = []
parameter_cases = [
    "cross-origin",
    "bad-json",
    "content-type",
    "json-limit",
    "photo-limit",
    "unauthenticated",
    "not-found-before-forbidden",
    "never-served",
    "no-cors",
]

[[requirements]]
id = "DP-05"
title = "Sign-in and roles"
text = "Seeded people sign in with email and password into a server-side session, and each API route admits only the roles listed for it in API."
kind = "behavior"
