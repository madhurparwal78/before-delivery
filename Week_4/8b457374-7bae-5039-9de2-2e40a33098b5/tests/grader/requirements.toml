[[requirements]]
id = "DP-01"
title = "Person keys"
text = "Creating a person returns a secret key once, and every personal route accepts only that key as a bearer credential, as qualified in API."
kind = "behavior"
primary = "pytest"
workflow = "creator-draft"
tests = [
    "test_app.py::test_person_keys",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Draft campaigns"
text = "A creator saves a draft with a title, story, goal, minimum run, stretch break points, home country, time zone and local deadline, each validated as listed in API."
kind = "behavior"
primary = "pytest"
workflow = "creator-draft"
tests = [
    "test_app.py::test_draft_fields",
]
criteria = []
parameter_cases = [
    "title",
    "story",
    "goal",
    "min_run_copies",
    "stretch",
    "ships_from",
    "time_zone",
    "deadline_local",
]

