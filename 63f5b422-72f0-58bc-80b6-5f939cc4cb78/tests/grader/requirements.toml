[[requirements]]
id = "DP-51"
title = "Single-use invitations"
text = "The owner invites someone by email with a role. The invitee receives one mail whose link works once, for that address and role only. A second use, a revoked link or another account sees the invite-invalid page, and nothing changes."
kind = "behavior"
primary = "pytest"
workflow = "roles-invites"
