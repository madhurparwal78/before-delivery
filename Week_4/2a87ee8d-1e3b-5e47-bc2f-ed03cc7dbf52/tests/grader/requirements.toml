[[requirements]]
id = "DP-65"
title = "Daylight-saving schedule times"
text = "A scheduled start or end that falls in a spring-forward gap is rejected with its field message. A time in a fall-back overlap resolves to the earlier instant, and the end-after-start check compares the resolved instants."
kind = "behavior"
primary = "pytest"
workflow = "join-link"
tests = [
    "test_app.py::test_wf_join_link_dst_schedule",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-66"
title = "Safe invite batches"
text = "An invite batch with any entry that is not a bare address is rejected whole, with nothing sent or counted, and addresses that differ only in case are sent and counted once. Titles with line breaks or control characters are rejected. Every message has one To recipient and a subject that decodes exactly."
kind = "behavior"
primary = "pytest"
workflow = "invites"
tests = [
    "test_app.py::test_invite_batches_headers",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-67"
title = "Reveal after a dropped connection"
text = "A board that misses the reveal while its stream is down runs the face-down wave and announces each frame's reveal exactly once when the stream resumes. A board first loaded after the reveal shows no flip and no announcement."
kind = "behavior"
primary = "pytest"
workflow = "reveal"
tests = [
    "test_app.py::test_wf_reveal_dropped_connection",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-68"
title = "Deleted images are gone"
text = "Deleting an image note makes its image URL answer `not_found` at once. Its MinIO object is removed once no note, trashed frame or stored version uses it, which is delayed until storage returns when storage is down, as qualified in Services."
kind = "behavior"
primary = "pytest"
workflow = "image-notes"
tests = [
    "test_app.py::test_deleted_image_gone",
    "test_app.py::test_wf_image_notes_add_delete",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-69"
title = "Paired dot returns"
text = "Every dot return cancels exactly one earlier spend, and concurrent returns of one dot give back exactly one. Deleting a cluster mid-vote returns every spend on it in the same change, and a racing spend is either returned too or answers `not_found`."
kind = "behavior"
primary = "pytest"
workflow = "dot-voting"
tests = [
    "test_app.py::test_paired_dot_returns",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-70"
title = "Purge time enforced at read"
text = "From its purge time, a trashed frame is gone from the trash list, search and version restore, and restoring it answers `not_found`, whether or not the worker has deleted it yet."
kind = "behavior"
primary = "pytest"
workflow = "trash-restore"
tests = [
    "test_app.py::test_purge_at_read",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-71"
title = "Only published fields accepted"
text = "A board write carrying any key not published for that endpoint answers a field error on that key, applies nothing and is stored for replay, so nobody can reveal a note or set its author by adding keys."
kind = "behavior"
primary = "pytest"
workflow = "facilitator-only"
tests = [
    "test_app.py::test_unknown_keys_rejected",
]
criteria = []
parameter_cases = []

