Q4 = 5
Q5 = 3
Q6 = 3
Q7 = 5
Q8 = 3
Q9 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "storage-down"
port = 4174
url_env = "APP_STORAGE_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "tight-limits"
port = 4175
url_env = "APP_TIGHT_URL"

[outages.env]
COMMENT_MAX_CHARS = "40"
VERIFY_TOKEN_TTL_SECONDS = "3"
DATABASE_URL = "${DATABASE_URL}_tight"
S3_BUCKET = "${S3_BUCKET}-tight"
VALKEY_KEY_PREFIX = "tinework-tight:"

[[requirements]]
id = "DP-01"
title = "Parameter manifest"
text = "Each part's parameters are served in declaration order with label, kind, unit, default, limits, group, derived flag, and a step and display precision derived from the default when the source declares none."
kind = "behavior"
primary = "pytest"
workflow = "keyboard-reconfigure"
tests = [
    "test_app.py::test_parameter_manifest",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Dimension fields by keyboard"
text = "A visitor reaches every dimension control by Tab and sets it with the arrow, Page, Ctrl or Meta, and Shift keys, each press committing one clamped value."
kind = "behavior"
primary = "workflow"
workflow = "keyboard-reconfigure"
tests = [
    "test_app.py::test_wf_keyboard_reconfigure_keys",
