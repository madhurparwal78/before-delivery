weight = 3
description = "Recipe: Find the one error type or builder and the code list it carries, then search every route and middleware for responses written with a 4xx or 5xx status directly, including body-limit, origin and not-found handlers. A handler that writes its own error body or uses a code outside the published list is a defect, cited as `file:line`. Pass: Every API error response is built through one error shape carrying a published code."

[criterion.annotations]
