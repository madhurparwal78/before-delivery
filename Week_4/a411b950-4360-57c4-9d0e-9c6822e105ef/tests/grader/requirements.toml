[[requirements]]
id = "DP-65"
title = "Checked and resumable brief uploads"
text = "The brief form checks the size of a reference file, and the format, channels and sample rate of a reference WAV and that it decodes, in the browser before any request is sent, shows the upload's progress, and retries a brief whose connection drops with the same Idempotency-Key, which the server honours so that exactly one enquiry is saved."
