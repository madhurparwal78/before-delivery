description = "Recipe: source MCP. 1) Trace an inquiry submission and a transition to the outbox insert. 2) Follow the sender from the outbox row to the SMTP send and the sent mark, citing each as `file:line`. 3) A console, file or mock sender, or a send without an outbox row, counts as a fail. Pass: each email is inserted into the outbox in the same database transaction as its change before a real SMTP client sends it to the configured host."

