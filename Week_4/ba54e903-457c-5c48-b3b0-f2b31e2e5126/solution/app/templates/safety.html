{% extends "base.html" %}
{% block main %}
<section class="page-hero">
  <h1 class="display page-title">SAFETY CENTER</h1>
  <p class="lede">Roles, permissions and clear rules keep every community welcoming. Start with the guide that fits you.</p>
  <ul class="topic-grid topic-grid--safety">
    {% for path, title, summary in cards %}
    <li class="topic-card"><h2><a href="{{ path }}">{{ title }}</a></h2><p>{{ summary }}</p></li>
    {% endfor %}
  </ul>
</section>
{% endblock %}
