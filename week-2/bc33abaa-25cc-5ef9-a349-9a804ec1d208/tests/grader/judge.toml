description = "Recipe: search the server for every place that sends a 4xx or 5xx response, including status-setting calls and literal error bodies. A handler that assembles its own error JSON fails, cited as file:line. Pass: every error response is built through one shared error helper whose shapes match the API error table."

[criterion.annotations]
