[task]
name = "quillmere/quillmere-drafts"
version = "1.0.0"
description = "Quillmere Drafts, a live grant-proposal editor for a one-person grant-writing consultancy and its clients' outside reviewers, with per-person shares and server-timed end times, server-ordered concurrent editing, credited suggestions and anchored comments in a tethered margin, first-decision-wins settling, in-app notices, and a save status that turns to All changes saved only after MinIO confirms the body object, backed by PostgreSQL and MinIO."
authors = [
    { name = "raja.kumarint17", email = "raja.kumarint17@ethara.ai" },
    { name = "Kaustubh Dalvi", email = "kaustubh.dalvi@ethara.ai" },
]
keywords = [
    "collaborative-editing",
    "websocket",
    "suggestions",
    "comments",
    "access-control",
    "expiry",
    "minio",
    "postgres",
    "accessibility",
    "typescript",
]

