name = "S5"
type = "binary"
weight = 3
description = "Recipe: trace receipt creation from the join and from the periodic Kill Bill check to where receipt amounts and line items are written. A hard-coded amount, an amount computed from the app's own price table, or a receipt created without a fetched Kill Bill invoice is a defect; cite each as `file:line`. Pass: every receipt amount is copied from a Kill Bill invoice fetched over HTTP."

[criterion.annotations]
