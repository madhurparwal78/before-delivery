importance = "important"
requirements = []
evidence = "file_line"
cites = "L803"

[[criterion]]
id = "Q2"
name = "Q2"
type = "binary"
weight = 5
description = "Recipe: Find the module that applies the query order from row-level security through totals and reference lines. Search the rest of the source for a second sequence of those steps, for example alerts, exports, member lists or set evaluation that re-filter rows themselves. Grep for assignments of the extract states (live, refreshing, refresh_failed) and export states (queued, rendering, ready, failed) and check where each transition is written. Cite each duplicate as `file:line`. Pass: Query order, extract transitions, export transitions each live in exactly one module that all callers use."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L549-L560, L632, L648, L805"

[[criterion]]
id = "Q3"
name = "Q3"
type = "binary"
weight = 3
description = "Recipe: Read the error helper or middleware and the route layer. Search for `res.status(`, `reply.code(`, `res.send(` and `res.json(` calls that write error bodies, and for the 429, 413, 415, 401, 404, 403, 409 and 422 checks. Cite each ad hoc error body or repeated check ordering as `file:line`. Pass: Every error body is produced through one helper that emits the published shape, with the order of checks written once."

