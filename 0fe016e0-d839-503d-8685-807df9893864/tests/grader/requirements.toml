[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[requirements]]
id = "DP-01"
title = "Contiguous ladder"
text = "Promote a cohort for a flag only when every rung below it carries an active promotion for the same flag (rung 1 needs none), and of simultaneous promotions or force enables of one flag to one rung let exactly one succeed while the rest receive the published already-active field error, so a flag's active rungs never skip or repeat a rung."
kind = "behavior"
primary = "pytest"
workflow = "force-enable-gap"
tests = [
    "test_app.py::test_wf_force_enable_gap_race",
    "test_app.py::test_simultaneous_promotions_one_winner",
    "test_app.py::test_force_enable_idempotent_replay",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Inclusive soak gate"
text = "Promote only when the rung below has soaked at least its minimum soak minutes, with exactly the minimum allowed, measured on the server clock from that rung's current active promotion, and name the elapsed, minimum and remaining minutes in every soak refusal."
kind = "behavior"
primary = "pytest"
workflow = "ladder-climb"
tests = [
    "test_app.py::test_wf_ladder_climb_alert",
    "test_app.py::test_soak_gate_edges",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Rate gate"
text = "Promote only when the adverse rate of the rung below, in whole basis points of events per device, sits at or below the flag's maximum adverse rate."
kind = "behavior"
primary = "pytest"
workflow = "ladder-climb"
tests = [
    "test_app.py::test_wf_ladder_climb_rate_gate",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Attestation gate"
text = "Promote only with a signed bench attestation reference that is trimmed, within its published length and character limits and never used by any promotion row before, active or demoted, with limit and reuse failures answered before any gate refusal, as qualified in API and Business rules."
kind = "behavior"
primary = "pytest"
workflow = "ladder-climb"
tests = [
    "test_app.py::test_attestation_reference_rules",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-05"
title = "One-rung rollback and fresh restore"
text = "A rollback demotes only the flag's highest active rung and keeps that row with its demotion instant, a retry carrying the same idempotency key replays the first response instead of demoting again, and restoring a rolled-back rung is always a new promotion row with the next code, a fresh reference and a restarted soak, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "rollback"
tests = [
    "test_app.py::test_wf_rollback_flaky_retry",
    "test_app.py::test_wf_rollback_empty_ladder",
    "test_app.py::test_rollback_idempotency_and_concurrency",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-06"
title = "Breach cascade"
text = "When a rung's adverse rate exceeds the flag maximum, demote every active rung above it, highest first, each exactly once with its own instant even when events arrive together, while the breaching rung itself stays active and no later reassessment moves a recorded instant."
kind = "behavior"
primary = "pytest"
workflow = "breach-cascade"
tests = [
    "test_app.py::test_wf_breach_cascade_console",
    "test_app.py::test_breach_burst_once",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-07"
title = "Evidence gaps"
text = "The evidence pack lists as a gap, once each, every active rung without a complete soak, rate and attestation record below it, and a console whose promotion, force enable or rollback is refused shows the server's current ladder and evidence pack within 2 seconds without waiting for its regular reload."
kind = "behavior"
primary = "pytest"
workflow = "force-enable-gap"
tests = [
    "test_app.py::test_wf_force_enable_gap_refusal_reload",
    "test_app.py::test_evidence_gap_lists",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-08"
title = "Scoped adverse rate"
text = "A rung's adverse rate counts each normalised event code once, and only events of that flag on that cohort's devices that occurred inside any interval while the flag was active there, past intervals included, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "breach-cascade"
tests = [
    "test_app.py::test_wf_breach_cascade_backdated",
    "test_app.py::test_adverse_rate_scope",
    "test_app.py::test_duplicate_event_codes_once",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-09"
title = "Ladder state export"
text = "Produce `ladder-state.csv` on demand with one row per flag and rung pair, byte for byte in the columns, order, quoting, formula neutralisation and line endings given in Exports, neutralising in that file only."
kind = "behavior"
primary = "pytest"
workflow = "exports"
tests = [
    "test_app.py::test_wf_exports_formula_references",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-10"
title = "Evidence pack export"
text = "Produce `evidence-pack.json` on demand, byte for byte in the shape, order and layout given in Exports, with every empty list written as an empty array."
kind = "behavior"
primary = "pytest"
workflow = "exports"
tests = [
    "test_app.py::test_wf_exports_force_enabled_gap",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-11"
title = "Adverse rates export"
text = "Produce `adverse-rates.txt` on demand, byte for byte with one line per flag and cohort in the format and order given in Exports."
kind = "behavior"
primary = "pytest"
workflow = "exports"
tests = [
    "test_app.py::test_exports_byte_exact_live",
    "test_app.py::test_restart_keeps_seed_once",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-12"
title = "Live rate maximum"
text = "Every gate, figure and export re-reads a flag's maximum adverse rate from live state, so a saved whole number within its published range triggers the breach cascade at once, raising it never restores a demoted rung, and a refused change alters and triggers nothing."
kind = "behavior"
primary = "pytest"
workflow = "live-values"
tests = [
    "test_app.py::test_wf_live_values_max",
    "test_app.py::test_max_setting_refusals",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-13"
title = "Live soak minimum"
text = "Every gate, figure and export re-reads a cohort's minimum soak from live state, so a saved whole number within its published range governs the next promotion, lowering it never restores a demoted rung, and a refused change alters and triggers nothing."
kind = "behavior"
primary = "pytest"
workflow = "live-values"
tests = [
    "test_app.py::test_wf_live_values_soak",
    "test_app.py::test_soak_setting_refusals",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-14"
title = "Legible evidence"
text = "Every figure on a rung card sits beside the evidence it was derived from with its unit, every state word is printed beside any colour used for it, and every refusal reads beside the control that was used."
kind = "visual"
primary = "rubric"
workflow = "cross-cutting"
