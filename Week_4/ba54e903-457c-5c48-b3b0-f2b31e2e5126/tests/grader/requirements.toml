[[requirements]]
id = "DP-04"
title = "Sign-up validation"
text = "Sign-up refuses an invalid email, display name, username, password or date of birth and a taken email or username with the stated status and field, counts every character of a password up to 128 and of a trimmed, NFC-normalised display name up to 32, refuses line breaks and control characters in the name and email, and writes no member row and no email."
kind = "behavior"
primary = "pytest"
workflow = "signup-validation"
tests = [
    "test_app.py::test_signup_validation",
]
criteria = []
parameter_cases = []

