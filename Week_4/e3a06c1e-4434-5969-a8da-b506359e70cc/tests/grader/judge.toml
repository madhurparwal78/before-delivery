description = "Recipe: list the interfaces, abstract classes, factories and wrapper modules in the source, then count each one's implementations and read what each wrapper adds. Cite each single-implementation abstraction or pure forwarding wrapper as `file:line`. Pass: no abstraction has only one implementation or merely forwards calls."

[criterion.annotations]
