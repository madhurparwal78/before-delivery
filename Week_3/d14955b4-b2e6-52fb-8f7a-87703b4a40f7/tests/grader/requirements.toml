[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "wiremock-down"
port = 4174
url_env = "APP_WIREMOCK_DOWN_URL"

[outages.env]
WIREMOCK_URL = "http://127.0.0.1:9"

[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "short-timers"
port = 4176
url_env = "APP_SHORT_TIMERS_URL"

[outages.env]
ACCESS_TOKEN_TTL_SECONDS = "5"
REFRESH_FAMILY_TTL_SECONDS = "30"
WEBHOOK_NONCE_TTL_SECONDS = "20"
IDEMPOTENCY_KEY_TTL_SECONDS = "20"
DATABASE_URL = "${DATABASE_URL}_short"

[[requirements]]
id = "DP-01"
title = "Run manifest and health check"
text = "/app/run.json installs, builds and serves the app on port 4173 (or APP_PUBLIC_PORT), and GET /api/health answers 200 {\"status\":\"ok\"} even while MinIO or the game server is unreachable."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_health_ok_with_services_down",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Security headers on every response"
text = "Every response carries the content security policy, transport, sniffing, framing and referrer headers listed under Server boundary, with a fresh script nonce each time."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_security_headers",
]
criteria = []
parameter_cases = [
