[[criterion]]
id = "Q3"
name = "Q3"
type = "binary"
weight = 5
description = "Recipe: trace reservation, charge, release, top-up, cap and balance amounts from input parsing (including the browser's rate-to-micro conversion) through computation to storage (display-only values are outside this trace: the Run form's in-browser estimate and the formatting or drawing of a stored amount, such as the ribbon's segment widths). A step fails when it can make an amount inexact: a fractional value held in a JS `number` (a decimal rate or amount read with `parseFloat`, `Number` or unary `+`, a quotient from `/`, or units such as megapixels kept as a decimal), a product or sum of JS numbers that can pass `Number.MAX_SAFE_INTEGER` over the brief's published ranges, or a float, real or double column. Whole-number arithmetic on JS numbers inside the safe-integer range, `BigInt` arithmetic and digit-string decimal parsing are exact. Cite each failing step as `file:line`. Pass: every amount stays an exact whole number of micro-credits from input to storage."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L626, L368, L143"

