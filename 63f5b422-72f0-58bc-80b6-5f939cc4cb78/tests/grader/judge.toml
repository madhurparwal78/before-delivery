weight = 3
description = "Recipe: Trace how an accepted operation and the current workspace document are stored and read back. A module-level store that holds documents or operations without persisting them to Postgres fails. Cite the insert and read queries as `file:line`. Pass: Postgres is the source of truth for the document, operations, change log and undo stacks, with any in-process copy rebuilt from it."

[criterion.annotations]
