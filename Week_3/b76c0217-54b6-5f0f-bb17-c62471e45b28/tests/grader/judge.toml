[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server start-up and configuration code, then search the application source for literal connection strings, host names, service ports, bucket names, access keys, secret keys, SMTP settings and sender addresses. The demo passwords in the brief's Seed data, the untouched dev compose file, port 4173, the documented server timer defaults and grading routes off are all allowed. Cite each other hard-coded value as `file:line`. Pass: every service URL and credential named in Configuration and secrets is read from the environment with no undocumented literal fallback."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-02",
]
evidence = "file_line"
cites = "L31, L970, L976-L986"

