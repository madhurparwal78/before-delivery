[[requirements]]
id = "DP-51"
title = "Enquiry validation"
text = "Sending an invalid form shows the published field messages, `aria-invalid`, `aria-describedby` and the count in `Form status`, and moves focus to the first failing field. After the first send, every input is checked again in the same moment."
kind = "behavior"
primary = "pytest"
workflow = "contact-form"
tests = [
    "test_app.py::test_enquiry_validation",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-52"
title = "Sending and sent states"
text = "A valid press shows the published sending state, disables every field while keeping its value, and sends one request. A 201 replaces the form with the published sent panel, which stays until `Send another message` or a reload."
kind = "behavior"
primary = "pytest"
workflow = "contact-form"
tests = [
    "test_app.py::test_sending_sent",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-53"
title = "Enquiry API and email"
text = "`POST /api/enquiries` checks the published rules and sends exactly one email with the published recipient, sender, Reply-To, subject and body. It answers 201 only after the mail server accepted the message, and a line break in the name never reaches a mail header."
kind = "behavior"
primary = "pytest"
workflow = "contact-form"
tests = [
    "test_app.py::test_enquiry_api_email",
    "test_app.py::test_enquiry_api_rejections",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-54"
title = "Mail outage and retry"
text = "When mail is unreachable or slow, the server answers the published 503. The form shows the published not-sent message with every value kept and focus on `Send message`, and the next press sends once mail is back, without a restart."
kind = "behavior"
primary = "pytest"
workflow = "contact-form"
tests = [
