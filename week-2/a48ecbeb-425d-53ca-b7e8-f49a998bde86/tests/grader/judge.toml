description = "Recipe: `playwright` at 1280x800. 1) Open `/`. 2) Scroll until the break between the first and second scenes sits mid-screen. 3) Inspect the DOM of the decoration at that break. 4) Screenshot. A plain line, a gradient, or an image element with a PNG, JPEG or WebP source counts as a miss. Pass: the break carries a border of leaf shapes and blossom shapes drawn as inline SVG or canvas."

