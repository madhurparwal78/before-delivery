[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 5
description = "Recipe: 1) Trace the clip bytes handler from its route to the clip state write. 2) Treat marking stored from the request body length, a local variable, an in-memory map or before the size query as a failure. 3) Cite the path as `file:line`. Pass: the stored state is written to PostgreSQL only after a real object storage write followed by a HEAD whose returned size equals the declared size."

[criterion.annotations]
