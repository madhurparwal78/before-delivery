title = "Monthly statements"
text = "A statement for a chosen month lists that account's transactions whose New York date falls in the month, with a running balance carried from the end of the previous New York month. A malformed or future month is refused. The statement downloads from the account page's \"Statement month\" picker under a file name that keeps the account's name in any script."
