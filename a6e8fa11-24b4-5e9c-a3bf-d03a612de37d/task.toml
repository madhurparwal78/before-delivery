schema_version = "1.4"

[[artifacts]]
source = "/app"
exclude = [
    "node_modules",
    ".git",
]

[task]
name = "tilth-tally/furrowbook"
version = "1.0.0"
description = "Furrowbook by Tilth & Tally: an offline-first, station-scoped spreadsheet workbook for crop field-trial networks. Technicians edit on tablets without signal, and op batches sync exactly once with server-sequenced conflicts. Formulas work across sheets, with a recalc furrow that shows the dependency waves. There is a season lock state machine in station time, versions with exact restore, xlsx/csv import and export, and expiring read-only sponsor links, on PostgreSQL, MinIO and Mailpit."
authors = [
    { name = "Mohd Rafey", email = "mohd.rafey@ethara.ai" },
]
keywords = [
    "spreadsheet",
    "offline-first",
    "sync",
    "field-trials",
    "agronomy",
    "formulas",
    "multi-tenant",
    "typescript",
]

[metadata]
uuid_v5 = "a6e8fa11-24b4-5e9c-a3bf-d03a612de37d"
identity_namespace_url = "https://tasks.example/tilth-tally/furrowbook/1.0.0"
category = "Greenfield"
domain = "offline-first spreadsheet workbooks for crop field-trial networks"
archetype = "enterprise"
language = "typescript"
design_direction = "Surveyed, weathered, precise. Warm unbleached paper ground with a faint graph-paper rule, dark green-black ink, khaki rules, a rust accent and field green. Space Grotesk headings, IBM Plex Sans body, IBM Plex Mono right-aligned numerals. Compact full-height grid with a slim formula bar and sync strip on top, card-file sheet tabs along the bottom, and a collapsible right rail. Signature \"Recalc furrow\" dependency waves."
created_at = "2026-10-28"
service_profile = "postgres+minio+mailpit"
harbor_version = "0.24.0"
grader_version = "rewardkit-0.2.3"
contract_version = "1.0.0"
requirements_registry = "tests/grader/requirements.toml"
mandatory_requirement_count = 60
workflow_count = 13
rubric_criterion_count = 23
rubric_total_weight = 81
if_constraint_count = 6
scoring_policy = "reward=pytest-outcome-pass-rate;if_score+rubric+quality+combined_score-separate;binary-rubric-5/3/1"
self_contained = true
builds_from_source = true
null_floor = 0.0
platforms = [
    "linux/amd64",
    "linux/arm64",
]

[agent]
timeout_sec = 36000.0
network_mode = "public"

[environment]
os = "linux"
cpus = 4
memory_mb = 4096
storage_mb = 20480
network_mode = "public"
build_timeout_sec = 3600.0

[verifier]
environment_mode = "separate"
timeout_sec = 36000.0

[verifier.env]
JUDGE_SECRET = "${JUDGE_SECRET:-}"
JUDGE_URL = "${JUDGE_URL:-http://host.docker.internal:8790}"
