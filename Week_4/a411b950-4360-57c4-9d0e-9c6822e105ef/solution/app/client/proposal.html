<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="earshot-time-zone" content="UTC" data-zone>
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#121409">
  <meta name="referrer" content="no-referrer">
  <title>Proposal · Kettlehole Audio</title>
  <link rel="preload" href="./fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/bricolage-grotesque-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/jetbrains-mono-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script type="module" src="./proposal/main.ts"></script>
</head>
<body class="proposal-page">
  <header class="page-header">
    <span class="wordmark">Earshot</span>
    <span class="label">Kettlehole Audio</span>
  </header>
  <main class="proposal" id="proposal">
    <div class="proposal-head">
      <p class="label" id="proposal-kicker">Proposal</p>
      <h1 id="proposal-heading" tabindex="-1">Proposal <span class="mono" id="proposal-reference"></span></h1>
    </div>
    <div class="proposal-body" id="proposal-body" hidden>
      <section class="proposal-project" aria-labelledby="project-title">
        <h2 id="project-title"></h2>
        <p class="scope" id="project-scope"></p>
      </section>
      <dl class="proposal-facts">
        <div><dt class="label">Fee</dt><dd class="amount mono" id="proposal-fee"></dd></div>
        <div><dt class="label">Production month</dt><dd id="proposal-month"></dd></div>
        <div><dt class="label" id="proposal-expiry-label">Accept by</dt><dd id="proposal-expiry"></dd></div>
      </dl>
      <table class="milestones" aria-label="Milestones" role="table">
        <thead role="rowgroup"><tr role="row"><th scope="col" role="columnheader">Milestone</th><th scope="col" role="columnheader">Share</th><th scope="col" role="columnheader">Amount</th></tr></thead>
        <tbody id="milestone-rows" role="rowgroup"></tbody>
      </table>
      <div class="accept-area" id="accept-area" hidden>
        <p>Accepting holds the production month for this project and raises the deposit invoice. The remaining milestones are invoiced as production reaches them.</p>
        <button class="button primary" type="button" id="accept-button"></button>
      </div>
      <section class="deposit" id="deposit" aria-labelledby="deposit-heading" hidden>
        <h2 id="deposit-heading">Deposit invoice</h2>
        <div class="deposit-figures">
          <p class="mono" id="deposit-number"></p>
          <p class="amount mono" id="deposit-amount"></p>
        </div>
        <form class="pay-form" id="pay-form" novalidate>
          <div class="field">
            <label for="payer-name">Name on payment</label>
            <input type="text" id="payer-name" autocomplete="name">
          </div>
          <button class="button primary" type="submit" id="pay-button">Pay deposit</button>
        </form>
      </section>
    </div>
    <p class="status-line proposal-status" role="status" aria-label="Proposal status" id="proposal-status"></p>
  </main>
</body>
</html>
