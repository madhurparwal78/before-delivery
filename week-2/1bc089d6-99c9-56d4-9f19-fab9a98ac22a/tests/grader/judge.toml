[[criterion]]
id = "B3"
name = "B3"
type = "binary"
weight = 3
description = "Recipe: `playwright` at 1280x800, open `/`. 1) Poll until both gate buttons appear, then screenshot the gate close enough to see both `button \"Begin the hour\"` and `button \"Begin in silence\"`. 2) Press \"Begin in silence\". 3) Screenshot `button \"Breathe with me\"` and `button \"Save my hour\"`. 4) Judge each button's painted fill or outline from the screenshots, whether it comes from a colour, gradient or border. The two gate buttons form one action group, so either one of them may be the ember button and the other may be styled as secondary. A gate with no ember button, or a grey, white or violet-only \"Breathe with me\" or \"Save my hour\", fails. Pass: at least one gate button, \"Breathe with me\" and \"Save my hour\" each carry an ember fill or outline in a warm orange hue between red-orange and amber."

