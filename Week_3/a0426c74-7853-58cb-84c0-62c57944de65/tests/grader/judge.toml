weight = 3
description = "Recipe: `reduced` at 1280x800, open `/` and take a full-viewport screenshot. With browser_evaluate, read the computed font-family and font-size of the name Plotfold and of the Sign in link. Confirm the name's face loads with document.fonts.check at that element's own weight and size. Pass: The name Plotfold is set in Funnel Display at a size larger than the Sign in link text."

[criterion.annotations]
