[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "valkey-down"
port = 4174
url_env = "APP_VALKEY_DOWN_URL"

[outages.env]
VALKEY_URL = "redis://127.0.0.1:9"

[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4176
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[outages]]
id = "short-timers"
port = 4177
url_env = "APP_SHORT_URL"

[outages.env]
LOCK_TTL_SECONDS = "6"
PRESENCE_TTL_SECONDS = "6"
INVITE_TTL_SECONDS = "8"
SHARE_LINK_TTL_SECONDS = "8"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
id = "DP-01"
title = "Account sign-up and sign-in"
text = "Visitors create an account with display name, email and password and sign in with email and password, with exactly one account per address whatever its letter case or surrounding spaces, even under simultaneous sign-ups, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "onboarding"
tests = [
    "test_app.py::test_signup_and_signin",
    "test_app.py::test_signup_concurrent",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Sign-in landing route"
text = "When no safe return path is given, after sign-in the address bar shows `/w/<workspace id>` of the account's last opened workspace, its earliest-joined workspace when it has never opened one, or `/workspaces/new` when it belongs to none, and reloading shows the same screen."
kind = "behavior"
primary = "pytest"
workflow = "onboarding"
tests = [
    "test_app.py::test_signin_landing_routes",
    "test_app.py::test_wf_onboarding_signin",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Workspace creation and switching"
text = "Creating a workspace lands on `/w/<new workspace id>` and choosing another workspace in the account menu lands on `/w/<that workspace id>`, each surviving a reload and a direct visit."
kind = "behavior"
primary = "pytest"
workflow = "onboarding"
tests = [
    "test_app.py::test_wf_onboarding_happy",
]
criteria = []
parameter_cases = []

