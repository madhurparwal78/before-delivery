weight = 5
description = "Recipe: `playwright` at 1280x800. 1. Open `/`, open sign-in from the Reserve chapter and create a fresh Practitioner account named `Judge B3 <random>` with email `judge-<random>@example.com`. 2. In the lab chapter, with the Bench tier selected, press an `Open` row C or D bench. 3. Wait until its button reads `Held by you` and the hold timer runs. 4. Screenshot the lab chapter showing the bench map and the hold panel. A blue bench without a server-confirmed `Held by you` state counts as a fail. Pass: the `Held by you` bench is drawn in a saturated curing-light blue (blue to cyan-blue hue) that no `Open` bench uses."

