services:
  main:
    environment:
      SPUR_GRADING: '1'
      SPUR_INLINE_MAX_BYTES: '4096'
      SPUR_FILE_MAX_BYTES: '500000'
      SPUR_PARALLEL_LIMIT: '2'
      SPUR_RETRY_MAX: '2'
      SPUR_JOB_TIMEOUT_MS: '60000'
      SPUR_ARTIFACT_TTL_MS: '3600000'
      SPUR_CACHE_TTL_MS: '3600000'
      SPUR_AUTO_STOP_MS: '3600000'
      SPUR_DEPLOY_APPROVAL_MS: '3600000'
      SPUR_RETARGET_LIMIT: '2'
      SPUR_TRAIN_MAX: '6'
      SPUR_PRESENCE_TIMEOUT_MS: '3000'
      SPUR_EXPORT_STEP_MS: '100'
      SPUR_EXPORT_MAX_BYTES: '5000000'
      SPUR_WEBHOOK_RETRY_MS: 1000,2000,4000
      SPUR_WEBHOOK_ALLOW: 127.0.0.1:4173
      SPUR_SSE_HEARTBEAT_MS: '1000'
      SPUR_WRITE_RATE: '100000'
      SPUR_LOGIN_RATE: '1000'
      SPUR_TOAST_MS: '5000'
      APP_PUBLIC_PORT: '4173'
      APP_PUBLIC_URL: http://127.0.0.1:4173
      DATABASE_URL: postgresql://gf_app:gf-app-dev-2b7d41@postgres:5432/gf_dev
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: gf-dev
      S3_FORCE_PATH_STYLE: 'true'
      S3_ACCESS_KEY_ID: gf-dev-root-71c3e0
      S3_SECRET_ACCESS_KEY: gf-dev-secret-4b8d92
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      postgres-seed:
        condition: service_completed_successfully
      minio-seed:
        condition: service_completed_successfully
  postgres:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_USER: gf_admin
      POSTGRES_PASSWORD: gf-admin-dev-9e4a02
      POSTGRES_DB: postgres
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U gf_admin -d postgres
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  postgres-seed:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      PGHOST: postgres
      PGUSER: gf_admin
      PGPASSWORD: gf-admin-dev-9e4a02
      PGDATABASE: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - |
      psql -Atqc "SELECT 1 FROM pg_roles WHERE rolname = 'gf_app'" | grep -q 1 ||
        psql -qc "CREATE ROLE gf_app LOGIN PASSWORD 'gf-app-dev-2b7d41'"
      psql -Atqc "SELECT 1 FROM pg_database WHERE datname = 'gf_dev'" | grep -q 1 ||
        psql -qc "CREATE DATABASE gf_dev OWNER gf_app"
  minio:
    image: coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    environment:
      MINIO_ROOT_USER: gf-dev-root-71c3e0
      MINIO_ROOT_PASSWORD: gf-dev-secret-4b8d92
    command: server /data
    healthcheck:
      test:
      - CMD-SHELL
      - MC_HOST_local=http://$$MINIO_ROOT_USER:$$MINIO_ROOT_PASSWORD@localhost:9000 mc ready local >/dev/null
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  minio-seed:
    image: coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    environment:
      MINIO_ROOT_USER: gf-dev-root-71c3e0
      MINIO_ROOT_PASSWORD: gf-dev-secret-4b8d92
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - |
      export MC_HOST_local="http://$$MINIO_ROOT_USER:$$MINIO_ROOT_PASSWORD@minio:9000"
      mc mb --ignore-existing local/gf-dev
      mc anonymous set none local/gf-dev
x-minio-root:
  MINIO_ROOT_USER: gf-dev-root-71c3e0
  MINIO_ROOT_PASSWORD: gf-dev-secret-4b8d92
