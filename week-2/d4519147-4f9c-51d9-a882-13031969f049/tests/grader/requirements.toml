[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_STORAGE_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAIL_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"
MAILPIT_URL = "http://127.0.0.1:9"

[[outages]]
id = "short-timer"
port = 4176
url_env = "APP_SHORT_URL"

[outages.env]
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"
SESSION_IDLE_SECONDS = "5"
SESSION_ABSOLUTE_SECONDS = "60"
SIGNIN_WINDOW_SECONDS = "60"
SIGNIN_LOCK_SECONDS = "10"
INVITE_TTL_SECONDS = "15"
INVITE_RATE_WINDOW_SECONDS = "30"
INVITE_LOOKUP_WINDOW_SECONDS = "30"
IDEMPOTENCY_KEY_SECONDS = "30"
DOWNLOAD_LINK_SECONDS = "5"

[[requirements]]
id = "DP-01"
title = "Sign-in and session cookie"
text = "Signing in with a seeded email and password creates a new session with a new CSRF token, carried in the session cookie with the published name and attributes, and deletes any session the request already carried."
kind = "behavior"
primary = "pytest"
workflow = "sign-in-session"
tests = [
    "test_app.py::test_dp01_signin_session_cookie",
]
criteria = []
parameter_cases = [
    "http public URL cookie sw_session",
    "fixation: pre-existing cookie value answers 401 after sign-in",
]

[[requirements]]
id = "DP-02"
title = "Sign-in lockout and enumeration"
text = "Failed sign-ins lock an email and IP pair, and separately an IP, after the published thresholds within the published window, answering 429 with Retry-After, with identical answers and the same timing class whether or not the email exists, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "sign-in-session"
tests = [
    "test_app.py::test_dp02_signin_lockout",
]
criteria = []
parameter_cases = [
    "pair lock after 5",
    "ip lock after 20 across emails",
    "unknown email identical body and headers",
    "median timing within 100 ms",
    "correct password during lock answers 429",
]

[[requirements]]
id = "DP-03"
title = "Idle and absolute session expiry"
text = "A session idle longer than the idle limit, or older than the absolute limit, is refused with the session-expired error on its next request."
kind = "behavior"
primary = "pytest"
workflow = "sign-in-session"
tests = [
    "test_app.py::test_dp03_session_expiry",
]
criteria = []
parameter_cases = [
    "idle",
    "absolute despite activity",
]

[[requirements]]
id = "DP-04"
title = "Sign in to continue resends the request"
text = "When any editor request meets an expired session, the Sign in to continue dialog appears, and after sign-in that exact request is resent once with the new session's CSRF token, byte-identical file contents for an import and the original idempotency key for an export, as qualified in Interactions."
kind = "behavior"
primary = "pytest"
workflow = "sign-in-session"
tests = [
    "test_app.py::test_dp04_sign_in_to_continue_resends",
]
criteria = []
parameter_cases = [
    "page save",
    "create export",
    "import file",
    "share action",
]

