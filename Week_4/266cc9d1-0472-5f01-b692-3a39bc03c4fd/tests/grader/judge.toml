[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server's configuration module and every place that creates the database pool, the object storage client and the SMTP transport. The brief's documented defaults (port 4173, the `http://localhost:<port>` public URL and the 1,209,600-second link lifetime) are allowed. Cite each environment read and each hard-coded value as `file:line`. Pass: every database, object storage and mail connection setting is read from the process environment with no hard-coded credential, host or endpoint fallback."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-47",
]
evidence = "file_line"
cites = "L126, L976-L988"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: read the client globe code that builds the camera, the finding markers, the footprints, the drone marker and the conductor lines. A step that packs absolute ECEF metres into a Float32 array or a single-precision shader attribute counts as a defect. Cite the positioning code as `file:line`. Pass: positions reach the renderer as float64 values drawn relative to the eye through the globe library's high-precision path."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-47",
]
evidence = "file_line"
cites = "L126, L745, L1010"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: read the client code that loads the tileset, the terrain pyramid and their textures, plus any worker scripts and the bundler configuration that ships them. A decoder imported and called directly from main-thread code counts as a defect. Cite the worker setup and the decode call sites as `file:line`. Pass: compressed mesh decoding, KTX2 transcoding and quantized-mesh unpacking are dispatched to a pool of web workers."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-47",
]
evidence = "file_line"
cites = "L126, L1009"

[[criterion]]
id = "S4"
name = "S4"
type = "binary"
weight = 5
description = "Recipe: read the status route, the service probe code and its timer, and the code that consults storage or mail state in upload, file read, submit and outbox delivery. Any route, flag, query parameter or environment switch that sets or forces provider state counts as a defect. Cite the probe and each consumer as `file:line`. Pass: the reported storage and mail state comes only from periodic calls to the real services."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-47",
]
evidence = "file_line"
cites = "L126, L880, L995-L999"

[[criterion]]
id = "Q1"
name = "Q1"
type = "binary"
weight = 3
description = "Recipe: read `tsconfig*.json`, then search the TypeScript source for `any` (as a type, `as any` or `<any>`), `@ts-ignore`, `@ts-expect-error` and non-null `!` assertions on values that can be missing (a DOM lookup, a map get, an optional field, a query row). Cite each instance as `file:line`. Pass: strict mode is on with no `any` type or unsafe non-null assertion anywhere in the source."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L1024"

[[criterion]]
id = "Q2"
name = "Q2"
type = "binary"
weight = 3
description = "Recipe: read the module, type, table, column and function names in the server and client source, comparing them to the brief's domain terms. Synonyms such as `issue`, `defect`, `report`, `share token` or `zoom level` for a brief concept count as defects. Cite each synonym as `file:line`. Pass: domain concepts use the brief's terms with no competing synonym for the same concept."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L1025"

[[criterion]]
id = "Q3"
name = "Q3"
type = "binary"
weight = 5
description = "Recipe: for each rule the brief's engineering standards list (findings-set transitions, clearance and status, frozen counts, label assignment, terrain-level ordering, storage confirmation, link liveness and expiry, email state, coverage and interpolation, the current flight answer on the page, overdue), find where it is decided. A second copy of a rule, such as a threshold comparison or a state check repeated in a route, counts as a defect. Cite each rule's home and each duplicate as `file:line`. Pass: each listed rule is decided in exactly one function or module that every caller uses."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L1026"

