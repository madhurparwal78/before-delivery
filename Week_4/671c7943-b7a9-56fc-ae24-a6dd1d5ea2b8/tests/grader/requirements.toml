[[if_rules]]
id = "IF-01"
text = "`/app/run.json` exists, with string fields `install`, `build` and `serve` and `\"_schema\":\"run-manifest-v1\"`, and its commands install, build and serve the app."
tests = [
    "test_app.py::test_if_run_manifest",
]
parameter_cases = []

[[if_rules]]
id = "IF-02"
text = "`THIRD_PARTY_NOTICES.md` at `/app` lists every shipped package with its licence, plus the two font families; shipped packages means the production dependency tree reported by `npm ls --omit=dev --all --json`."
tests = [
    "test_app.py::test_if_third_party_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Every shipped package uses the MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0 or 0BSD licence, except `@fontsource/instrument-serif` and `@fontsource/instrument-sans`, which are under the SIL Open Font Licence and supply the font files the app serves."
tests = [
    "test_app.py::test_if_licences",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "The app stores data only in the provided Postgres database and uses no other datastore, such as SQLite, Redis, or local files for content or enquiries."
tests = [
    "test_app.py::test_if_postgres_only",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "The app uses no animation library, no WebGL, no canvas animation loop and no video."
tests = [
    "test_app.py::test_if_no_animation_library",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "Every colour in the stylesheets is written in hex or rgb/rgba notation, with no colour-mixing or other colour functions."
tests = [
    "test_app.py::test_if_colour_notation",
]
parameter_cases = []

[[if_rules]]
id = "IF-07"
text = "The provided service setup and its dev credentials are left unchanged, and no credentials are committed in source files."
tests = [
    "test_app.py::test_if_no_committed_credentials",
]
parameter_cases = []

