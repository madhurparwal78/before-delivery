[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "search-down"
port = 4174
url_env = "APP_SEARCH_DOWN_URL"

[outages.env]
MEILISEARCH_URL = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_searchdown"
S3_BUCKET = "${S3_BUCKET}-searchdown"
STUDIO_INSTANCE = "searchdown"
QUEUE_RETRY_SECONDS = "2,4,6"

[[outages]]
id = "storage-down"
port = 4175
url_env = "APP_STORAGE_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_storagedown"
MEILISEARCH_INDEX = "models_storagedown"
STUDIO_INSTANCE = "storagedown"
QUEUE_RETRY_SECONDS = "2,4,6"

[[outages]]
id = "killbill-down"
port = 4176
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_billingdown"
S3_BUCKET = "${S3_BUCKET}-billingdown"
MEILISEARCH_INDEX = "models_billingdown"
STUDIO_INSTANCE = "billingdown"
QUEUE_RETRY_SECONDS = "2,4,6"

[[requirements]]
id = "DP-01"
title = "Plan-checked package limits."
text = "The server refuses a package over the author's plan size limit, or of a type the plan doesn't accept, before any queue work starts, as qualified in API and Business rules."
kind = "behavior"
primary = "pytest"
workflow = "upload-queue"
tests = [
    "test_app.py::test_upload_plan_limits",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Package type judged by content."
text = "The server identifies a package by its bytes, not its file name, refuses a .glb that isn't a glTF binary with the published refusal, and refuses packages whose entries escape their folder."
kind = "behavior"
primary = "pytest"
workflow = "upload-queue"
tests = [
    "test_app.py::test_wf_upload_queue_refusals",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Original stored byte for byte."
text = "Every accepted package is stored in object storage under its content checksum exactly as uploaded, and downloading the original returns the same bytes and checksum whatever its derivatives went through."
kind = "behavior"
primary = "pytest"
workflow = "upload-queue"
tests = [
    "test_app.py::test_original_stored_byte_for_byte",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Ordered publishing queue."
text = "Each upload passes validate, transcode, preview, index and publish in that order, each stage pending, running, confirmed or failed, and nothing a stage produces is served before that stage confirms."
kind = "behavior"
primary = "pytest"
workflow = "upload-queue"
tests = [
    "test_app.py::test_queue_stage_order",
    "test_app.py::test_queue_holds_until_confirmed",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-05"
title = "Unit-scaled derivatives."
text = "The transcode stage writes a GLB in metres and a binary STL in millimetres, scaled from the declared source unit by the published factors."
kind = "behavior"
primary = "pytest"
workflow = "upload-queue"
tests = [
    "test_app.py::test_unit_scaled_derivatives",
]
criteria = []
parameter_cases = [
    "mm",
    "cm",
    "m",
    "in",
]

[[requirements]]
id = "DP-06"
title = "Rebuilds never serve stale files."
text = "Replacing a model's source invalidates its GLB, STL and preview at once so no outdated file is served again, and until the new revision's publish stage confirms every public and buyer route that would serve them answers the published rebuilding response, as qualified in API for studio sessions."
kind = "behavior"
primary = "pytest"
workflow = "upload-queue"
tests = [
    "test_app.py::test_rebuild_never_serves_stale",
]
criteria = []
parameter_cases = []

