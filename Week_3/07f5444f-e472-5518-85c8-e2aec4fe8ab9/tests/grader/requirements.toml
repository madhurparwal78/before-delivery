[[requirements]]
id = "DP-01"
title = "Passcode sign-in"
text = "Seeded people sign in with email and passcode, receive a session cookie, and land on the screen for their role, as qualified in API."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_sign_in",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Role-scoped access"
text = "Every endpoint enforces the role table and the single error order in API, so a role that may not act gets the stated 403 or 404 and nothing changes."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_role_access",
]
criteria = []
parameter_cases = []

