weight = 3
description = "Recipe: find the function that builds API error bodies, then grep route and middleware code for `res.status(`, `reply.code(`, `.json({ error` and equivalents that send an error without it. Read the check order in one write route (rate check, 401, 404, 403, 409, 422, 413). Cite each hand-built error as `file:line`. Pass: every error response is built through one error-shape function and no route invents another body."

