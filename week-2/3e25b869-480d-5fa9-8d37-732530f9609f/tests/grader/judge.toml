requirements = []
evidence = "file_line"
cites = "L1254"

[[criterion]]
id = "Q2"
name = "Q2"
type = "binary"
weight = 5
description = "Recipe: for each domain rule the brief lists (stock on hand, the money formula and rounding, refund allocation, each state machine's transitions, hold expiry, the code-request window, the lock window, Toronto time and Toronto month conversion), search the server source for every place it is computed, for example rounding constants, `America/Toronto` conversions, `expires_at` comparisons and transition tables. Client code the brief requires is never a duplicate: ending a hold row at 0:00 without waiting for a poll, and showing Toronto times whatever the browser's zone. Cite any duplicate as `file:line`. Pass: no listed domain rule has a second implementation in the server source."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L259, L267, L939, L1255"

[[criterion]]
id = "Q3"
name = "Q3"
type = "binary"
weight = 3
description = "Recipe: read how request bodies are validated for POST /api/checkout, POST /api/subscriptions, PATCH /api/account/subscriptions/{number}, POST /api/staff/orders/{number}/refunds and POST /api/contact. A second key list for the same route counts as failing. Cite each declaration as `file:line`. Pass: each listed route reads its accepted values from the same single declaration that rejects its extra keys."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L1256"

[[criterion]]
id = "Q4"
name = "Q4"
type = "binary"
weight = 3
description = "Recipe: list the source's swap points - abstract classes, and the interfaces or ports declared so one implementation can be exchanged for another - and its wrapper functions, then count the implementations of each. Two kinds never fail: a type declaration that merely describes data, such as an Order, Batch or Hold shape, and a single-purpose builder that assembles one configured client, pool or transport from the environment. A wrapper that only renames or forwards another call counts as failing. Cite each offender as `file:line`. Pass: no swap point has only one implementation."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L1257"

[[criterion]]
id = "Q5"
