[[criterion]]
id = "Q4"
name = "Q4"
type = "binary"
weight = 3
description = "Recipe: list the abstractions in the backend and frontend source: abstract classes, interfaces or abstract types that a class implements or that are declared so interchangeable implementations can stand behind them, and factories that choose between implementations; count the implementations of each. Not abstractions, and not counted: data-shape types (interfaces or type aliases that describe records or request and response bodies, such as Market or Order), plain helper modules that call a library or provider directly (for example a db module over pg, a mail sender or a fetch wrapper), and the one concrete client per provider. An abstraction with only one implementation is a defect; cite each as `file:line`. Pass: every counted abstraction has more than one implementation."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L763"

[[criterion]]
id = "Q5"
name = "Q5"
type = "binary"
weight = 3
description = "Recipe: find where error responses are built and where provider failures are caught for each provider client. Any handler that writes an error body outside the one `{error}` shape, or a provider failure mapped to a 503 code by ad-hoc logic in a route instead of one shared mapping, is a defect; cite each. Pass: every error response flows through one shape with provider failures mapped to the published 503 codes in one consistent way."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L298, L765"

[[criterion]]
id = "Q6"
name = "Q6"
type = "binary"
weight = 5
description = "Recipe: read the fee, hold, notional, margin profit-or-loss, liquidation, ledger, settlement, API response and money-formatting code in backend and frontend, and search for `parseFloat`, `toFixed`, division of money by 100 into floats, `Math.round` on money and non-integer column types for cents. A defect is money or price arithmetic whose result can differ from exact integer-cent arithmetic: a fractional cent that is kept, summed, compared or stored, a dollar float used in a calculation, or a rounding step the brief does not state; cite each. Not defects: the brief's own floor and ceil formulas computed on integer cents (for example `Math.floor((notional * bps + 5000) / 10000)` on Number values within the safe-integer range, or the BigInt equivalent); the exact conversion at the Kill Bill boundary between integer cents and the decimal dollar amounts Kill Bill sends and receives (for example `Math.round(amount * 100)` on an amount read back); and display-only motion, such as the eased in-between frames of a count-up between two integer-cent values and orbit ring geometry derived from prices. Pass: every money value stored, compared, sent in this app's own API or shown at rest is exact integer cents."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
