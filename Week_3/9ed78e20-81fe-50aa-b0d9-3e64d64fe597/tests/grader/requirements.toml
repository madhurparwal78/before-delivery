[[requirements]]
id = "DP-59"
title = "Sign-in lockout with backoff"
text = "Five consecutive failed sign-ins for one email lock sign-in for that email with a doubling lockout, identically for known and unknown emails, as qualified in Business rules."
kind = "behavior"
