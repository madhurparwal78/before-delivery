[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: 1) Read the server's configuration module and every module that opens the PostgreSQL pool, the SMTP transport or the Kill Bill client. 2) Search the whole source, lockfiles excluded, for literal connection strings, hosts, ports, usernames, passwords, API keys and secrets. 3) Treat as allowed only the documented defaults: the 0.0.0.0 listen host the brief requires, port 4173 when `APP_PUBLIC_PORT` is unset, the documented `MAIL_FROM` sender, and clock control off unless `CLOCK_CONTROL` equals enabled. 4) Cite each violation as `file:line`. Pass: every service URL and credential is read from `process.env` with no other literal value or fallback."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
