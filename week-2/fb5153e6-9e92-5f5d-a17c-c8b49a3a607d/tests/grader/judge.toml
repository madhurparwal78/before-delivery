name = "Q4"
type = "binary"
weight = 3
description = "Recipe: search the source for interfaces, abstract classes, factories and wrapper layers that have one implementation, for commented-out blocks, for unused exports and for unreachable branches. Cite each instance as `file:line`. Pass: no abstraction has a single implementation, with no commented-out code, unused export or unreachable branch found."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
