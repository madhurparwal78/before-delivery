[[if_rules]]
id = "IF-02"
text = "THIRD_PARTY_NOTICES.md at /app lists every shipped package (the production dependency tree from npm ls --omit=dev --all --json), the bundled Inter and Fragment Mono fonts and the Lucide icons, each with its licence."
tests = [
    "test_app.py::test_if_third_party_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Every shipped package, font and icon set is under MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD, Zlib or OFL-1.1."
tests = [
    "test_app.py::test_if_licences_allowed",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "The app stores state only in PostgreSQL, MinIO, Meilisearch and the browser's own storage, with no SQLite, no other database or cache, and no state files on disk."
tests = [
    "test_app.py::test_if_no_other_datastore",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "The given service definitions and their environment values are left unchanged; the app reads them and never overrides them."
tests = [
    "test_app.py::test_if_service_env_untouched",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "Server and browser source is TypeScript, and package-lock.json is committed."
tests = [
    "test_app.py::test_if_typescript_and_lockfile",
]
parameter_cases = []

[[if_rules]]
id = "IF-07"
text = "The served pages make no requests to any origin other than the app's own."
tests = [
    "test_app.py::test_if_same_origin_requests",
]
parameter_cases = []

