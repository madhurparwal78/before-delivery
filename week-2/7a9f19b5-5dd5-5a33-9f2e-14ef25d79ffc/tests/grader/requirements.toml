[[requirements]]
id = "DP-01"
title = "Catalogue and search"
text = "Show the seeded catalogue as product cards that search and the finish, beam, colour temperature and clearance filters narrow in place, backed by the catalogue endpoint in API."
kind = "behavior"
primary = "pytest"
workflow = "retail-browse"
tests = [
    "test_app.py::test_catalogue_query",
    "test_app.py::test_catalogue_search_filters_in_place",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Price fields by role"
text = "Catalogue, product, search and comparison responses carry exactly the field list API publishes for the caller, so signed-out visitors, retail customers and trade buyers not yet approved never receive a trade price."
kind = "behavior"
primary = "pytest"
workflow = "retail-browse"
tests = [
    "test_app.py::test_price_fields_by_role",
]
criteria = []
parameter_cases = [
    "visitor",
    "retail",
    "pending_trade",
    "declined_trade",
    "approved_trade",
    "admin",
]

