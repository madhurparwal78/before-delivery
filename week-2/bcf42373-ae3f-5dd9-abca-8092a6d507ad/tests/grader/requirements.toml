[[requirements]]
id = "DP-01"
title = "Owner sign-in"
text = "POST /api/auth/login with the seeded owner email and password answers a bearer token of at least 16 characters that opens every studio endpoint."
kind = "behavior"
primary = "pytest"
workflow = "owner-signs-in"
tests = [
    "test_app.py::test_owner_sign_in_opens_studio",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "One refusal for any wrong sign-in"
text = "A wrong password and an unknown email get the same status and a byte-identical body, carry no token and create no sessions row."
kind = "behavior"
primary = "pytest"
workflow = "owner-signs-in"
tests = [
    "test_app.py::test_login_refusal_identical",
]
criteria = []
parameter_cases = []

