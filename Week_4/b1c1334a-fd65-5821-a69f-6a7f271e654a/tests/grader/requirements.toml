title = "Typed cell values"
text = "Each cell write is validated against its column type and read from its exact decimal text, never through binary floating point, then stored and displayed in the canonical form from Business rules."
kind = "behavior"
primary = "pytest"
workflow = "order-entry"
tests = [
    "test_app.py::test_typed_values",
]
criteria = []
parameter_cases = [
    "decimal_half_away",
    "decimal_small",
    "decimal_negative",
    "decimal_negative_zero",
    "decimal_negative_zero_string",
    "decimal_padded",
    "decimal_exponent_number",
    "decimal_exponent_string",
    "decimal_sixteen_digits",
    "text_non_string",
    "text_too_long",
    "text_blank",
    "date_valid",
    "date_unreal",
    "bool_string_any_case",
    "bool_false",
    "bool_invalid",
    "formula_cell",
]

