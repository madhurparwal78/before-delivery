description = "Recipe: search the service packages, the browser files and any config or example file for literal database URLs with passwords, storage access keys, the ntfy username and password, and for environment reads that carry a fallback value on those settings. Seeded workspace keys are seed data, and the documented defaults (public port 4173, stale period 10800, lock period 900, retry period 10) are allowed. Cite each defect as `file:line`. Pass: no credential or endpoint setting has a committed secret or a literal fallback value."

