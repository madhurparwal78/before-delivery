[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: open the server's configuration loading and every module that connects to the database, object storage, billing or mail. Trace each service URL (the database URL, the storage endpoint, the Kill Bill URL and the mail server host) and each credential (the storage access key and secret, the Kill Bill username, password, API key and API secret) back to the process environment read at start. A hard-coded value or literal fallback for any of these fails. Literal fallbacks for other settings, such as the region, bucket, sender or a port, do not fail. Cite each as `file:line`. Pass: every service URL and credential is read from the environment, with no hard-coded value or fallback."

