[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: read the Kill Bill, S3 and SMTP client code and every caller. An in-memory, stubbed or mock provider in shipped source, a test-only endpoint, or a success path that skips the provider call fails, cite each as `file:line`. Pass: each provider client sends real requests to the endpoint from the environment, using whatever credentials the environment supplies for that provider."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-06",
]
evidence = "file_line"
cites = "L34, L535-L548, L622, L657"

[[criterion]]
id = "Q1"
name = "Q1"
type = "binary"
weight = 3
description = "Recipe: search the TypeScript source for `any`, `as any`, `as unknown as` and untyped request bodies where a domain type (piece, firing, placement, rate set, damage report, tracking link) exists, and for names that drift from the brief terms, citing each instance as `file:line`. Pass: the source has fewer than 3 such instances."

[criterion.annotations]
