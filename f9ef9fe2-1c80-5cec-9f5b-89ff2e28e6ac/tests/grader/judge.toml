description = "Recipe: list every interface or abstract class that code implements or extends as a behavioural contract, and every factory, adapter or wrapper that adds a layer of indirection between callers and the code doing the work, and count its implementations and call sites. Leave out `interface` and `type` declarations that only describe data shapes (for example Booking, Quote or Line), and plain modules of functions that make the brief's Kill Bill, S3 or SMTP calls directly, which add no indirection. Pass: no behavioural interface, wrapper or factory exists with only one implementation or only to allow a hypothetical future provider, and each instance fails cited as `file:line`."

