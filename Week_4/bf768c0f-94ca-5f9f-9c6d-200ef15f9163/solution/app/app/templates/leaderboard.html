{% extends "base.html" %}
{% block title %}Leaderboard — {{ club_name }}{% endblock %}
{% block content %}
<div class="page-head"><h1>Leaderboard</h1></div>
<section class="card">
  <table id="ladder">
    <colgroup><col class="c-rank"><col><col class="c-rating"><col class="c-games"></colgroup>
    <thead><tr><th>Rank</th><th>Member</th><th>Rating</th><th>Games</th></tr></thead>
    <tbody id="ladder-body">
      {% for m in ladder %}
      <tr>
        <td class="mono">{{ m.rank }}</td>
        <td class="ladder-member"><img class="avatar" src="{{ m.avatar_url }}" alt="" width="24" height="24">
          <a href="/members/{{ m.username }}">{{ m.username }}</a></td>
        <td class="mono">{{ m.rating_display }}</td>
        <td class="mono">{{ m.games }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  <div class="row-line" style="margin-top:12px">
    <button class="button small" id="ladder-more">Show more</button>
    <span class="muted" id="ladder-note"></span>
  </div>
</section>
{% endblock %}
{% block scripts %}<script type="module" src="/static/js/leaderboard.js"></script>{% endblock %}
