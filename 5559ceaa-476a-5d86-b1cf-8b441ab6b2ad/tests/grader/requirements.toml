title = "Applying an import"
text = "Applying a plan adds new files, replaces or keeps each changed file exactly as the mentor decided, never creates a duplicate path, and refuses a plan that is already applied, expired, superseded or changed since planning, in the order given in Business rules."
kind = "behavior"
primary = "pytest"
