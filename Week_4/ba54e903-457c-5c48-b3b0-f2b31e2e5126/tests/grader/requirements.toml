[[requirements]]
id = "DP-01"
title = "Health and error envelope"
text = "GET /api/health answers 200 with {\"status\": \"ok\"} once the database is ready, even while the mail service is down, and every refused API request answers only the shared error body with the stated status and code."
kind = "behavior"
primary = "pytest"
workflow = "not-found"
tests = [
    "test_app.py::test_health_and_envelope",
]
criteria = []
parameter_cases = []

