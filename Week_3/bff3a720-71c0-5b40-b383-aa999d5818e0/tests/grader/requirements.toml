[[requirements]]
id = "DP-14"
title = "Last-seat race"
text = "When simultaneous bookings or requests compete for the last seat on overlapping legs, exactly one succeeds and every other answers 409 `seat_taken`, leaving the loser on the ride page with the taken bands redrawn and the selection cleared."
