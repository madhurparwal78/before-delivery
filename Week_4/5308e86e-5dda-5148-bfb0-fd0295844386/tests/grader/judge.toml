[[criterion]]
id = "Q1"
name = "Q1"
type = "binary"
weight = 5
description = "Recipe: read the browser dollar-input parser, the server amount validation, the fee and quote arithmetic and the statement amount formatter. Any `parseFloat`, `Number(...)` on dollar text, `* 100` on a fraction, `toFixed` on a money value or floating rounding of a fee or quote counts as a fail. Cite each money path as `file:line`. Pass: every money value is integer cents converted by digit arithmetic with no floating-point step."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L2069"

[[criterion]]
id = "Q2"
name = "Q2"
type = "binary"
weight = 5
description = "Recipe: find the business-clock module, then search the server for `Date.now`, argument-less `new Date()`, SQL `now()`, `CURRENT_TIMESTAMP` and time-column defaults, and search the client for weekday, cutoff, holiday or deadline computation. Each stray clock read deciding a business time, server or browser, counts as a fail. Cite the clock and every violation as `file:line`. Pass: no code path outside the business-clock module reads a system or database clock to decide a business time."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
