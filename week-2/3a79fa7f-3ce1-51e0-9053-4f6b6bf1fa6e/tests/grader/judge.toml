description = "Recipe: `reduced` at 1280x800. 1) Open `/` and wait for \"Lift off quietly\". 2) Use `browser_evaluate` to read the computed `color` and `background-color` of the page body, the header, the lineup heading, one lineup card, the \"Find my board\" link, the three right-column comparison headings and the footer, converting each to hue, saturation and lightness. 3) Screenshot the lineup band. Pass: every sampled colour is a neutral (saturation under 15%), a near-white surface (lightness above 92%, whatever its saturation), a near-black ink (lightness below 15%, whatever its saturation) or a teal with a hue from 160 to 200 degrees."

