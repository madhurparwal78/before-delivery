description = "Recipe: locate where the source decides the delivery-state chip, the unread and read counts, the edit window with its version check, and the accepted-field lists for edits and sends. A second copy of any rule, for example the chip derived again in a component, is a defect; cite both sites. The browser's own edit-window comparison against `editable_until` is not a second copy: the brief asks the menu to re-evaluate it every second while the server still judges the window on save. Pass: each of these rules is decided in exactly one function or module that every caller uses."

