schema_version = 1
id_prefix = "DP"
mandatory_count = 60
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "workspace-access",
    "public-directory",
    "jurisdiction-rules",
    "counterparties",
    "outgoing-transfers",
    "incoming-messages",
    "case-review",
    "data-requests",
    "usage-invoicing",
    "examiner-files",
    "retention",
    "partner-access",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "S4",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 87
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "minio", env = {} },
    { name = "killbill", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Lanternline Desk <desk@lanternline.example>" } },
]

[criterion_weights]
B1 = 5
B2 = 3
B3 = 5
B4 = 3
B5 = 5
B6 = 3
B7 = 5
B8 = 3
B9 = 3
B10 = 3
B11 = 3
B12 = 3
