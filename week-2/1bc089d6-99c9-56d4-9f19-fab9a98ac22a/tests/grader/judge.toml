[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server configuration and start-up code and the database and SMTP client setup. Search the app's server and browser source for `postgres://`, `postgresql://`, `gf_app`, `gf_dev`, `mailpit`, `1025` and password-like literals, counting only hits used as a value or fallback, not comments or prose. Test files and the provided service configuration (which the brief says to leave unchanged) are out of scope. DATABASE_URL, SMTP_HOST and SMTP_PORT must come from `process.env`. Defaults the brief documents are allowed: port 4173 for APP_PUBLIC_PORT, `http://localhost:<port>` as the email origin, and the From address `Stillhour <goodnight@stillhour.example>` as a MAIL_FROM fallback. Cite each defect as `file:line`. Pass: no literal database or mail host, user or password appears in the app source as a value or fallback."

