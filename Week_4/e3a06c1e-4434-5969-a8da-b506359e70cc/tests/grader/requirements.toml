schema_version = 1
id_prefix = "DP"
mandatory_count = 60
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "public-site",
    "team-access",
    "project-quota-setup",
    "keys-and-synthesis",
    "live-streaming",
    "replay-and-search",
    "session-workspace",
    "quota-halt",
    "correction-review",
    "correction-approval",
    "usage-billing",
    "plan-change",
    "outage-recovery",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "B13",
    "S1",
    "S2",
    "S3",
    "S4",
    "S5",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 95
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "minio", env = {} },
    { name = "killbill", env = {} },
]

[criterion_weights]
B1 = 5
B2 = 5
B3 = 5
B4 = 5
B5 = 3
B6 = 3
B7 = 3
B8 = 5
B9 = 3
B10 = 3
B11 = 3
B12 = 3
B13 = 3
S1 = 5
S2 = 3
S3 = 5
S4 = 5
S5 = 5
Q1 = 3
Q2 = 5
Q3 = 3
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9999"
DATABASE_URL = "${DATABASE_URL}_kbdown"
S3_BUCKET = "${S3_BUCKET}-kbdown"
LOWFIELD_BILLING_PREFIX = "lowfield-kbdown"

[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9999"
DATABASE_URL = "${DATABASE_URL}_s3down"
LOWFIELD_BILLING_PREFIX = "lowfield-s3down"

[[outages]]
id = "short-timer"
port = 4176
url_env = "APP_SHORT_URL"

[outages.env]
LOWFIELD_IDLE_SECONDS = "5"
LOWFIELD_SESSION_CAP_SECONDS = "20"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"
LOWFIELD_BILLING_PREFIX = "lowfield-short"

[[requirements]]
id = "DP-01"
title = "Public site story"
