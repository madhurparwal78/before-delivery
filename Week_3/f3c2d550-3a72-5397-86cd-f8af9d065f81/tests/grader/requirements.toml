title = "Boot and self-recovery"
text = "The app starts and serves every screen while search, storage or printing is unreachable, shows each service's published banner, and clears it and resumes deferred work within the published delays when the service returns, without a restart."
kind = "behavior"
primary = "pytest"
workflow = "outages"
tests = [
    "test_app.py::test_wf_outages_boot_with_service_down",
    "test_app.py::test_outage_recovery_without_restart",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-43"
title = "Storage outage leaves nothing behind"
text = "While storage is unreachable, captures and swatch changes return 503 and leave nothing stored, the capture form keeps everything entered, and the same idempotency key succeeds once storage returns."
kind = "behavior"
primary = "pytest"
workflow = "outages"
tests = [
    "test_app.py::test_wf_outages_storage_503_atomic_key_reusable",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-44"
title = "Search fallback and catch-up"
text = "While search is unreachable or its index is being rebuilt, search answers from the library's own records under the published banner, references changed meanwhile become searchable in order within the catch-up delay once search returns, and a lost index is recreated and rebuilt from the library's records within the published delay."
kind = "behavior"
primary = "pytest"
workflow = "outages"
tests = [
    "test_app.py::test_wf_outages_search_catch_up",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-45"
