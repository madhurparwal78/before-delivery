schema_version = 1
id_prefix = "DP"
mandatory_count = 45
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "sign-up-and-trial",
    "pull-and-import",
    "meetings-import",
    "waterline-check",
    "move-between-days",
    "timebox-calendar",
    "routines",
    "calendar-feed",
    "evening-shutdown",
    "seats-and-invites",
    "weekly-review",
    "billing-and-operations",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "S4",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
    "Q8",
]
rubric_total_weight = 88
solo_criteria = [
    "B7",
]
services = [
    { name = "postgres", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Tidemark Daybook <daybook@tidemark.test>" } },
    { name = "killbill", env = {} },
]

[criterion_weights]
B1 = 5
B2 = 5
B3 = 3
B4 = 5
B5 = 3
B6 = 5
B7 = 3
B8 = 3
B9 = 3
B10 = 3
B11 = 3
B12 = 3
S1 = 5
S2 = 5
S3 = 3
S4 = 3
Q1 = 3
Q2 = 3
Q3 = 5
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 5
Q8 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAIL_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[outages]]
id = "trial-clock"
port = 4176
url_env = "APP_TRIAL_CLOCK_URL"

[outages.env]
TRIAL_LENGTH_SECONDS = "40"
TRIAL_NOTICE_LEAD_SECONDS = "30"
DATABASE_URL = "${DATABASE_URL}_trial"

[[requirements]]
id = "DP-01"
title = "Workspace sign-up"
text = "Creating a workspace starts it in the trialing state with its owner signed in, and registers a Kill Bill account plus one seat for the owner, or queues that registration when Kill Bill is unreachable, as qualified in Services."
kind = "behavior"
primary = "pytest"
workflow = "sign-up-and-trial"
tests = [
    "test_app.py::test_sign_up_registers_trial_and_billing",
]
criteria = []
parameter_cases = []

