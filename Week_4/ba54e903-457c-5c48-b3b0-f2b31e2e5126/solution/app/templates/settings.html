{% extends "base.html" %}
{% block main %}
<section class="page-hero form-page">
  <h1 class="display page-title">SETTINGS</h1>
  <p class="settings-line" id="settings-email"></p>
  <p class="settings-line" id="settings-tier"></p>
  <div class="field">
    <label for="settings-status">Status</label>
    <select id="settings-status">
      <option value="online">Online</option>
      <option value="idle">Idle</option>
      <option value="dnd">Do not disturb</option>
      <option value="invisible">Invisible</option>
    </select>
  </div>
  <p class="form-status" role="status" aria-label="Settings status" id="settings-note"></p>
  <button class="btn btn-ghost" type="button" id="settings-logout">Log out</button>
</section>
{% endblock %}
{% block scripts %}<script src="/static/js/account.js?v={{ version }}"></script>{% endblock %}
