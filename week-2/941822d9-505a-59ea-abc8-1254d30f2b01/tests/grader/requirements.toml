[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[services]]
name = "postgres"

[services.env]

[[services]]
name = "killbill"

[services.env]

[[services]]
name = "minio"

[services.env]

[[services]]
name = "mailpit"

[services.env]
MAIL_FROM = "Credwell Certificates <certificates@credwell.test>"

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "short-clock"
port = 4176
url_env = "APP_SHORT_CLOCK_URL"

[outages.env]
CREDWELL_SHARE_LINK_TTL_SECONDS = "8"
CREDWELL_DOWNLOAD_LINK_TTL_SECONDS = "8"
CREDWELL_SEAT_EXPIRY_SECONDS = "10"
CREDWELL_FULL_REFUND_WINDOW_SECONDS = "6"
CREDWELL_SEAL_RETRY_SECONDS = "3"

