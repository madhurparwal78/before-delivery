title = "Health and run manifest"
text = "The app installs, builds and serves from `/app/run.json` on the published port, and `/api/health` answers 200 even while a provider is down."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_wf_cross_cutting_health",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-56"
title = "Server boundary"
text = "The server enforces the published size limits and origin rule, never serves source files or credentials, and starts even when a provider is unreachable."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_wf_cross_cutting_server_boundary",
]
criteria = []
parameter_cases = []

