[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: `source`. 1) From the server entry, find the route that handles POST /api/requests/<id>/decision. 2) Trace the window, cap and record re-checks, the state update, the attendance write and the audit append. 3) Any of these on a separate pool query, after the commit or outside the transaction fails. 4) Cite the begin, each write and the commit as file:line. Pass: all of these statements run on one database client inside a single transaction that rolls back on failure."

[criterion.annotations]
