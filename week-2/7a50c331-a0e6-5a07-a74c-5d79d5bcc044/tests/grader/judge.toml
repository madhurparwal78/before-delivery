[judge]
judge = "codex"
model = "openai/gpt-5.6-sol"
version = "0.163.0"
cwd = "/judge-workspace"
timeout = 1200
mode = "batched"
samples = 3
guard = "penalize"
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "normal",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_press_key",
    "browser_resize",
    "browser_select_option",
    "browser_hover",
    "browser_drag",
    "browser_tabs",
    "browser_wait_for",
    "browser_mouse_wheel",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "reduced"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "reduced",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_press_key",
    "browser_resize",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "touch"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "touch",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_press_key",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "source"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "source-mcp",
]
allowed_tools = [
    "list_files",
    "read_file",
    "search_files",
]

[scoring]
aggregation = "weighted-mean"

[[criterion]]
id = "B1"
name = "B1"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800. 1) Open `/` and scroll to the Architecture section (`#architecture`). 2) Probe the computed backgroundColor and backgroundImage of `html` and `body`. 3) Take a screenshot. Pass: the page background is a neutral near-black with every RGB channel at most 24, ruled by evenly spaced thin vertical lines that run across the full screenshot width."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-56",
]
evidence = "screenshot"
cites = "L164, L514, L517, L533"

[[criterion]]
id = "B2"
name = "B2"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800. 1) Open `/` and probe the computed fontFamily of the hero heading, a Text view paragraph, the header `Sign up` capsule and the `Ship` plan card price line. 2) Sign in at `/login` as the invented seed member `northwind.viewer@example.com` and open `/console/db/launch_brain?tab=sources`. 3) Probe the computed fontFamily of the `ID` table header cell and one table body cell. 4) Screenshot both pages. Pass: every sampled element's font stack names `Geist Mono` first and ends in the generic `monospace`."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-56",
]
evidence = "screenshot"
cites = "L164, L542-L543"

[[criterion]]
id = "B3"
name = "B3"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800. 1) Open `/` and screenshot the top of the page. 2) Scroll to the Pricing section (`#pricing`) and screenshot it. 3) Sample the colours of coloured elements in both views with probes. Pass: every saturated colour in both screenshots has a hue from 15 to 60 degrees (signal orange or amber), with no blue, green, purple or pink accent."

[criterion.annotations]
