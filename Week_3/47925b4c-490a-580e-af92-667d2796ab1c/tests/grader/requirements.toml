Q3 = 5
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 5
Q8 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "gotenberg-down"
port = 4175
url_env = "APP_GOTENBERG_DOWN_URL"

[outages.env]
GOTENBERG_URL = "http://127.0.0.1:9"

[[outages]]
id = "wiremock-down"
port = 4176
url_env = "APP_WIREMOCK_DOWN_URL"

[outages.env]
WIREMOCK_URL = "http://127.0.0.1:9"

[[outages]]
id = "peer"
port = 4177
url_env = "APP_PEER_URL"

[outages.env]
MASK_STEP_MILLISECONDS = "0"

[[outages]]
id = "press-fault"
port = 4178
url_env = "APP_PRESS_FAULT_URL"

[outages.env]
GOTENBERG_URL = "${WIREMOCK_URL}"

[[outages]]
id = "store-fault"
port = 4179
url_env = "APP_STORE_FAULT_URL"

[outages.env]
S3_ENDPOINT = "${WIREMOCK_URL}"

[[outages]]
id = "short-timer"
port = 4180
url_env = "APP_SHORT_URL"

[outages.env]
TECH_LINK_SECONDS = "8"
READING_STALE_SECONDS = "8"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[outages]]
id = "slow-masks"
port = 4181
url_env = "APP_SLOW_MASKS_URL"

[outages.env]
MASK_STEP_MILLISECONDS = "1500"
DATABASE_URL = "${DATABASE_URL}_slow"
S3_BUCKET = "${S3_BUCKET}-slow"

[[outages]]
id = "slow-masks-peer"
port = 4182
url_env = "APP_SLOW_MASKS_PEER_URL"

[outages.env]
MASK_STEP_MILLISECONDS = "1500"
DATABASE_URL = "${DATABASE_URL}_slow"
S3_BUCKET = "${S3_BUCKET}-slow"

[[outages]]
id = "store-down-alone"
port = 4183
url_env = "APP_STORE_DOWN_ALONE_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_storedown"
S3_BUCKET = "${S3_BUCKET}-storedown"

[[requirements]]
id = "DP-01"
title = "Site with a measured wall"
text = "Create a site whose measured wall divides into half-metre cells and whose show time is wall-clock in the Brussels zone, with gaps and folds resolved as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "survey-wall"
tests = [
    "test_app.py::test_site_measured_wall",
]
criteria = []
parameter_cases = []

