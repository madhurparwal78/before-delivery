description = "Recipe: `reduced` at 1280x800, open `http://127.0.0.1:4173/g/coffee-grinder-fit-new-burrs?step=4`, wait until `Model stage` reports `data-state=\"ready\"`, read the field's text colour with `browser_evaluate`, and screenshot the stage region. A stage where every part has the same surface treatment fails. Pass: every visible part outside the two burrs is one flat colour matching the field's text colour with no shading."

