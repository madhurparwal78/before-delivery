[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "git-host-down"
port = 4174
url_env = "APP_GIT_DOWN_URL"

[outages.env]
GIT_HOST_URL = "http://127.0.0.1:9"

[[outages]]
id = "ai-engine-down"
port = 4175
url_env = "APP_AI_DOWN_URL"

[outages.env]
AI_ENGINE_URL = "http://127.0.0.1:9"

[[outages]]
id = "svix-down"
port = 4176
url_env = "APP_SVIX_DOWN_URL"

[outages.env]
SVIX_URL = "http://127.0.0.1:9"

[[outages]]
id = "short-timer"
port = 4177
url_env = "APP_SHORT_URL"

[outages.env]
ASSIGNMENT_TTL_SECONDS = "5"
CONFLICT_HOLD_SECONDS = "5"
AUDIT_RETENTION_SECONDS = "5"
WEBHOOK_RETRY_SECONDS = "2"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
id = "DP-01"
title = "Demo workspace at first boot"
text = "On first boot against an empty database the app holds exactly the published seed (one owner, one project with three target languages, 40 main keys, one TM with six entries, one open branch and one audit entry) and nothing else, however many instances boot at once."
kind = "behavior"
primary = "pytest"
workflow = "wf-first-run"
tests = [
    "test_app.py::test_seed_exact_first_boot",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Sign-in and roles"
text = "The owner and invited reviewers sign in with email and password into an HttpOnly session, and every endpoint enforces the owner, reviewer and CI token scopes with the published error precedence."
kind = "behavior"
primary = "pytest"
workflow = "wf-first-run"
tests = [
    "test_app.py::test_session_and_scopes",
    "test_app.py::test_wf_first_run_wrong_password",
]
criteria = []
parameter_cases = []

