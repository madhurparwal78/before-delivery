[[requirements]]
id = "DP-01"
title = "Signup"
text = "Signup creates an `attendee` account from a valid name, email and password whatever role or other extra fields the request carries, and refuses bad or taken input storing nothing, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "accounts"
tests = [
    "test_app.py::test_signup_ignores_role_and_refuses_bad_input",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Sign in and sign out"
text = "Sign-in exchanges an email and password for a bearer token that survives reloads and restarts until sign-out, after which the token is refused."
kind = "behavior"
primary = "pytest"
workflow = "accounts"
tests = [
    "test_app.py::test_token_survives_restart_until_logout",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Safe return after sign-in"
text = "Sign-in and signup return the visitor to the `next` address only when it is a same-origin path, keeping its query, and otherwise land on `/agenda`."
kind = "behavior"
primary = "pytest"
workflow = "accounts"
tests = [
    "test_app.py::test_safe_next_redirect",
]
criteria = []
parameter_cases = [
    "filtered-board",
    "protocol-relative",
    "encoded-slashes",
    "backslash",
    "absolute",
    "javascript",
    "empty",
    "missing",
]

[[requirements]]
id = "DP-04"
title = "Sign-in throttle"
text = "After five failed sign-ins for one email within the throttle window every further sign-in for that email is refused with a retry delay, counted in PostgreSQL across all running instances, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "accounts"
tests = [
    "test_app.py::test_signin_throttle_shared_across_instances",
]
criteria = []
parameter_cases = []

