description = "Recipe: Read the domain modules for money, cart, checkout, refunds, EMI and settlement. Search for `parseFloat`, `toFixed`, fractional money literals, decimal-string amounts and divisions whose result is kept without rounding. Conversion to rupees at the payment-ledger boundary and display formatting are allowed. Any other money amount held as a float or decimal string fails. Cite each as `file:line`. Pass: Every money amount in domain code is an integer number of paise."

[criterion.annotations]
channel = "quality"
