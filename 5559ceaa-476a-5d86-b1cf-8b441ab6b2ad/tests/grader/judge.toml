[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server's configuration loading and every place that builds the Postgres pool, the S3 client and the SMTP transport. The brief's documented defaults (port 4173, APP_PUBLIC_URL falling back to localhost on the port, the four timer defaults) are allowed. Cite each other literal connection string, endpoint, bucket, access key or password as `file:line`; any one counts as a fail. Pass: every service URL and credential reaches its client from an environment variable read at start."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-41",
]
evidence = "file_line"
cites = "L117, L941-L954"

