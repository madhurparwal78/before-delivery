description = "Recipe: Find where the source decides each of these rules: the 40% deposit split, the money display format, order state transitions, plan state transitions, the price in effect at an instant, the refund cap, the project access check and the upload allowlist. Search for second copies, such as a client-side formatter re-implementing the money format, or a route repeating the access check inline. Pass: each rule is decided in exactly one place and imported everywhere else, so every duplicate decision fails (cite both sites)."

