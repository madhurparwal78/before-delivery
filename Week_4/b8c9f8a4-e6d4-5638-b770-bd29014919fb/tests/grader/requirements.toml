schema_version = 1
id_prefix = "DP"
mandatory_count = 98
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "file-a-car",
    "evidence-upload",
    "record-pull",
    "publish-version",
    "named-links",
    "buyer-walkround",
    "viewing-claim",
    "make-offer",
    "accept-offer",
    "amend-reread",
    "inspector-capture",
    "owner-alerts",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "S4",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 83
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "minio", env = {} },
    { name = "wiremock", env = {} },
    { name = "gotenberg", env = {} },
    { name = "ntfy", env = {} },
]

[criterion_weights]
B1 = 5
B2 = 3
B3 = 3
B4 = 5
B5 = 3
B6 = 3
B7 = 3
B8 = 3
B9 = 3
B10 = 3
B11 = 5
B12 = 5
S1 = 5
S2 = 5
S3 = 3
S4 = 3
Q1 = 3
Q2 = 5
Q3 = 3
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "wiremock-down"
port = 4174
url_env = "APP_WIREMOCK_DOWN_URL"

[outages.env]
WIREMOCK_URL = "http://127.0.0.1:9"

[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "gotenberg-down"
port = 4176
url_env = "APP_GOTENBERG_DOWN_URL"

[outages.env]
GOTENBERG_URL = "http://127.0.0.1:9"

[[outages]]
id = "ntfy-down"
port = 4177
url_env = "APP_NTFY_DOWN_URL"

[outages.env]
NTFY_URL = "http://127.0.0.1:9"

[[outages]]
id = "short-timers"
port = 4178
url_env = "APP_SHORT_TIMERS_URL"

[outages.env]
OFFER_LAPSE_SECONDS = "40"
OFFER_WARNING_SECONDS = "20"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[outages]]
id = "short-links"
port = 4179
url_env = "APP_SHORT_LINKS_URL"

[outages.env]
LINK_TTL_SECONDS = "45"
DATABASE_URL = "${DATABASE_URL}_links"
S3_BUCKET = "${S3_BUCKET}-links"

[[outages]]
id = "stale-record"
port = 4180
url_env = "APP_STALE_RECORD_URL"

[outages.env]
RECORD_PULL_MAX_AGE_SECONDS = "30"
DATABASE_URL = "${DATABASE_URL}_stale"
S3_BUCKET = "${S3_BUCKET}-stale"

[[requirements]]
id = "DP-01"
title = "Owner sign-in."
text = "The owner signs in with the seeded passphrase, landing as published in DP-74, every owner screen and owner API call refuses anyone without that session, and signing out ends every owner session as qualified in DP-87."
kind = "behavior"
primary = "pytest"
workflow = "file-a-car"
tests = [
    "test_app.py::test_owner_session_gate",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Car file."
text = "The owner creates a car file that starts as a draft, holds a normalised registration and private home address, is listed in the owner's garage, and opens on the route published in DP-74."
kind = "behavior"
primary = "pytest"
workflow = "file-a-car"
tests = [
    "test_app.py::test_car_file_create_and_validation",
]
criteria = []
parameter_cases = []

