name = "S1"
type = "binary"
weight = 5
description = "Recipe: With the `source` MCP open the server start-up and configuration code, then search all TypeScript source for URL literals, host names, passwords and access keys. Trace how each database, renderer, object-storage and mail setting named in the brief's configuration section reaches the code that uses it. Pass: each of those settings is read from the process environment with no literal host, URL, password or key in source beyond the defaults the brief documents (listening port, protest window length, sender address, public base URL fallback) and the seeded demo accounts."

[criterion.annotations]
channel = "source"
