[judge]
judge = "codex"
model = "openai/gpt-5.6-sol"
version = "0.163.0"
cwd = "/judge-workspace"
timeout = 3600
mode = "batched"
samples = 3
guard = "penalize"
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "normal",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_press_key",
    "browser_resize",
    "browser_select_option",
    "browser_hover",
    "browser_drag",
    "browser_tabs",
    "browser_wait_for",
    "browser_mouse_wheel",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "reduced"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "reduced",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_press_key",
    "browser_resize",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "touch"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "touch",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_press_key",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "source"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "source-mcp",
]
allowed_tools = [
    "list_files",
    "read_file",
    "search_files",
]

[scoring]
aggregation = "weighted-mean"

[[criterion]]
id = "B1"
name = "B1"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800, open `/`, screenshot the first screen, then use `browser_evaluate` to read the computed background colour of `body` and the computed colour of `heading level 1 \"SAFFRON & SLATE\"`. Pass: the page ground is a bright bubblegum pink (high lightness, red-magenta hue) with the title in near-black ink (very low lightness)."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-10",
]
evidence = "screenshot"
cites = "L242-L246, L103"

[[criterion]]
id = "B2"
name = "B2"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800, screenshot `/`, then open `/book` with the Date set to tomorrow and 2 guests, choose the first bookable time, click one outlined table in `listbox \"Tables\"`, and screenshot once the hold ring shows. Pass: every acid-lime element in both screenshots is something the guest can act on or an action marker, such as the Book a table link, the chosen time or the hold ring, with none on a heading, caption, label or panel."

[criterion.annotations]
channel = "experience"
