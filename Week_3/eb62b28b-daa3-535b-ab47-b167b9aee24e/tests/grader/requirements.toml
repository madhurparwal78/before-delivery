schema_version = 1
id_prefix = "DP"
mandatory_count = 60
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "practice-access",
    "public-site",
    "memberships",
    "draw-visits",
    "visit-page",
    "lab-results",
    "marker-band",
    "longevity-plan",
    "supplement-blends",
    "care-messages",
    "records-and-receipts",
    "closing-an-account",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "S4",
    "S5",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 90
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "killbill", env = {} },
    { name = "minio", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Ocotillo Member Desk <desk@ocotillo.example>" } },
]

[criterion_weights]
B1 = 5
B2 = 3
B3 = 3
B4 = 5
B5 = 5
B6 = 5
B7 = 3
B8 = 3
B9 = 5
B10 = 3
B11 = 3
B12 = 3
S1 = 5
S2 = 3
S3 = 5
S4 = 3
S5 = 3
Q1 = 3
Q2 = 5
Q3 = 5
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_billing"
S3_BUCKET = "${S3_BUCKET}-billing"

[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_storage"
S3_BUCKET = "${S3_BUCKET}-storage"

[[outages]]
id = "short-timer"
port = 4176
url_env = "APP_SHORT_URL"

[outages.env]
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"
DRAW_PAGE_SECONDS = "20"
MESSAGE_RATE_WINDOW_SECONDS = "30"
FILE_RATE_WINDOW_SECONDS = "30"
CLOSURE_WAIT_SECONDS = "20"

[[outages]]
id = "short-session"
port = 4177
url_env = "APP_SESSION_URL"

[outages.env]
DATABASE_URL = "${DATABASE_URL}_session"
S3_BUCKET = "${S3_BUCKET}-session"
SESSION_SECONDS = "20"

[[outages]]
id = "spare"
port = 4178
url_env = "APP_SPARE_URL"

[outages.env]
DATABASE_URL = "${DATABASE_URL}_spare"
S3_BUCKET = "${S3_BUCKET}-spare"

[[requirements]]
id = "DP-01"
title = "Sign-in and sign-out"
text = "Sign-in answers the same status for an email that belongs to nobody as for a wrong password, the right password opens a session, and signing out ends it so the session endpoint answers 401."
kind = "behavior"
primary = "pytest"
workflow = "practice-access"
tests = [
    "test_app.py::test_sign_in_answers_alike",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Staff management by the owner"
text = "Only the practice owner lists, adds, re-roles and removes staff; a role change applies from that person's next request, a removed staff member can no longer sign in, and a removed or unknown staff id answers 404 on every staff endpoint."
kind = "behavior"
primary = "pytest"
workflow = "practice-access"
tests = [
    "test_app.py::test_staff_management_lifecycle",
    "test_app.py::test_staff_endpoints_refuse_other_roles",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Practice access journey"
text = "Filling the sign-in form lands each person on their published home route with a live session, and signing out makes the session endpoint answer 401."
kind = "behavior"
primary = "workflow"
workflow = "practice-access"
tests = [
    "test_app.py::test_wf_practice_access_signin_each_role",
    "test_app.py::test_wf_practice_access_refused_then_signed_in",
]
criteria = []
parameter_cases = []

