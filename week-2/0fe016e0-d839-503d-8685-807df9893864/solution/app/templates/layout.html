{{define "top"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{if .Title}}{{.Title}} · {{end}}Rungmark Rollout Ladder</title>
<link rel="stylesheet" href="/static/style.css">
{{if eq .Current "console"}}<script src="/static/console.js" defer blocking="render"></script>{{end}}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <a class="brand" href="/">
    <svg class="brand__mark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path d="M7 2v20M17 2v20M7 6h10M7 11h10M7 16h10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    <span>Rungmark Rollout Ladder</span>
  </a>
  <nav class="topnav" aria-label="Pages">
    <ul>
      {{range .Entities}}<li><a href="/{{.Name}}"{{if eq $.Current .Name}} aria-current="page"{{end}}>{{.Title}}</a></li>{{end}}
      <li><a class="topnav__console" href="/console"{{if eq .Current "console"}} aria-current="page"{{end}}>Rollout console</a></li>
    </ul>
  </nav>
</header>
{{end}}
{{define "bottom"}}
</body>
</html>
{{end}}
