type = "binary"
weight = 5
description = "Recipe: from the serve entrypoint, read the configuration loader and every constructor of the database, object-store, billing and mail clients. Pass: every service address and credential is read from the environment at start, with no literal host, port, user name, password or key for any service beyond the defaults the brief itself documents (app port 4173, the sender address and the timing defaults)."

