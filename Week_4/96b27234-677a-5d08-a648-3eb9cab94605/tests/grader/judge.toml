id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: find the client module that draws `img \"Room view\"`, starting from the client entry named by the package scripts, and read how floor, wall, seat, exit, avatar and ripple objects are created. A 2D canvas, a static image or hard-coded tile positions fail this criterion. Pass: the floor, wall, seat, exit and avatar objects are created by a WebGL renderer from the layout and people data the server sends."

