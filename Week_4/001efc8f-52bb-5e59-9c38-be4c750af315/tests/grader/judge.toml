description = "Recipe: locate the photo acceptance checks, the email projection of a User, the send-rate count, the message-text link rule, the literal search matcher with its query caps, the local-time-to-instant conversion, the answered-mention derivation, the removal queue and the resume filter for logged events. Any duplicated decision, such as a second link regex or an email field stripped by hand in a route, is a defect; cite both sites. The browser's check of signature, size and count as photos are chosen is not a duplicate: the brief asks for it alongside the server's own check of the bytes. Pass: each of these rules is decided in exactly one place."

