parameter_cases = []

[[requirements]]
id = "DP-52"
title = "Revocation reaches open pages"
text = "When the operator revokes or regenerates a listening link or withdraws its project, a listening page already open on that link fades to silence, removes the station and shows the not-available copy within 6 seconds, and every stem on the link answers 404 at once."
