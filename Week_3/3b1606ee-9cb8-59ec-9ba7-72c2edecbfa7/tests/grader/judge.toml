[[criterion]]
id = "Q3"
name = "Q3"
type = "binary"
weight = 5
description = "Recipe: for each of six rules, find every place that decides it: delivery state changes (search `'delivered'`, `'read'`, `'failed'` in updates), the unread count (search `unread`), the username rules (search the character pattern and length checks), the retract window (search `24 *` and `retract`), participant access (search the conversation membership checks) and padding with sealing (search `0x80` and `160`). A shared module imported by client and server counts as one place, and a second function that re-decides the same rule is a defect, cited as `file:line`. Pass: each of the six named rules is decided in exactly one place in the source."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L817-L823"

