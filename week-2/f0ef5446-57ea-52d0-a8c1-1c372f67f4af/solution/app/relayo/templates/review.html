{% extends "base.html" %}
{% block main %}
<section class="wrap review" data-review aria-labelledby="review-title">
  <script type="application/json" data-rules>{{ rules | safe }}</script>
  <div class="review-head">
    <div>
      <p class="eyebrow">Staff</p>
      <h1 class="page-title" id="review-title">Partner applications</h1>
    </div>
    <button class="btn btn-secondary" type="button" data-sign-out hidden>Sign out</button>
  </div>
  <p class="review-status" role="status" aria-label="Review status" data-review-status></p>
  <div class="review-alerts" data-review-alerts></div>
  <form class="panel sign-in" aria-label="Staff sign in" novalidate data-sign-in>
    <h2 class="panel-title">Staff sign in</h2>
    <p class="hint">Sign in with your Relayo staff account to read and decide partner applications.</p>
    <div class="field">
      <label class="field-label" for="sign-in-email">Email</label>
      <input class="input" id="sign-in-email" name="email" type="text" inputmode="email" autocomplete="username" spellcheck="false" aria-describedby="sign-in-email-error">
      <p class="field-error" id="sign-in-email-error" aria-live="polite"></p>
    </div>
    <div class="field">
      <label class="field-label" for="sign-in-password">Password</label>
      <input class="input" id="sign-in-password" name="password" type="password" autocomplete="current-password" aria-describedby="sign-in-password-error">
      <p class="field-error" id="sign-in-password-error" aria-live="polite"></p>
    </div>
    <button class="btn btn-primary" type="submit" data-sign-in-button>Sign in</button>
  </form>
  <div class="queue" data-queue hidden></div>
</section>
{% endblock %}
