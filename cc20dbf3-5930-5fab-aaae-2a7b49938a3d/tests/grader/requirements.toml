[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[requirements]]
id = "DP-01"
title = "Run manifest and health"
text = "/app/run.json names the install, build and serve commands, and the server answers GET /api/health with HTTP 200 {\"status\":\"ok\"} on port 4173 or APP_PUBLIC_PORT, even while billing or photo storage is down."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_health_on_every_copy",
]
criteria = []
parameter_cases = []

