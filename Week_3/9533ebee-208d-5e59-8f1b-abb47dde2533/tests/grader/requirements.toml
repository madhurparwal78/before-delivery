id = "DP-10"
title = "Liquidity provider journey"
text = "A liquidity provider supplies to a pool, watches the pool card's share price rise without a reload after a trader's swap in another browser that pays with that pool's asset, keeps a half-typed withdrawal through refreshes, withdraws, retries the withdrawal with the same key to get the original receipt, and opens a receipt that reads Settled."
