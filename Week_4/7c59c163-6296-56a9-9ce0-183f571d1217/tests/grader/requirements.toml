[[if_rules]]
id = "IF-01"
text = "`/app/run.json` exists with `\"_schema\":\"run-manifest-v1\"` and string `install`, `build` and `serve` commands, and `install` uses the committed lockfile (`npm ci`)."
tests = [
    "test_app.py::test_if_run_manifest",
]
parameter_cases = []

[[if_rules]]
id = "IF-02"
text = "`THIRD_PARTY_NOTICES.md` at `/app` lists every shipped package, meaning the production dependency tree from `npm ls --omit=dev --all --json`, with its licence, plus the two font families."
tests = [
    "test_app.py::test_if_third_party_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Every shipped package (same definition as IF-02) is under MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD or BlueOak-1.0.0, and the fonts under the SIL Open Font License 1.1."
tests = [
    "test_app.py::test_if_licences",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "The app uses no datastore, queue, cache or external network service beyond Postgres, Valkey, Keycloak, Kill Bill, Svix, MinIO and the SMTP sink (no SQLite, no file-based database, no CDN at runtime)."
tests = [
    "test_app.py::test_if_no_extra_datastore",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "The app never changes the Keycloak `app` or `gf-observer` clients, the realm's registration and login settings, the Kill Bill tenant's credentials, or the MinIO bucket's access policy."
tests = [
    "test_app.py::test_if_untouched_provider_config",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "All application source, backend and frontend, is TypeScript. Only tool configuration files may be plain JavaScript."
tests = [
    "test_app.py::test_if_typescript_only",
]
parameter_cases = []

[[if_rules]]
id = "IF-07"
text = "`package-lock.json` is committed and every dependency version in `package.json` is exact."
tests = [
    "test_app.py::test_if_exact_dependencies",
]
parameter_cases = []

