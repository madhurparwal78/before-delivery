[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[services]]
name = "postgres"

[services.env]
ASHLAR_GRADING = "1"
ASHLAR_PREVIEW_DELAY_MS = "300"
ASHLAR_LOOP_LIMIT = "1000"
ASHLAR_VERIFY_TTL_SECONDS = "20"
ASHLAR_DRAFT_INTERVAL_MS = "1000"
ASHLAR_SEARCH_DEBOUNCE_MS = "100"
ASHLAR_PANE_LIMIT_BYTES = "20000"
ASHLAR_BODY_LIMIT_BYTES = "100000"
ASHLAR_MAX_TAGS = "3"

[[services]]
name = "minio"

[services.env]

[[services]]
name = "mailpit"

[services.env]
MAIL_FROM = "Ashlar <no-reply@ashlar.test>"

[[outages]]
id = "storage-down"
port = 4174
url_env = "APP_STORAGE_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "mail-down"
port = 4175
url_env = "APP_MAIL_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"
MAILPIT_URL = "http://127.0.0.1:9"

