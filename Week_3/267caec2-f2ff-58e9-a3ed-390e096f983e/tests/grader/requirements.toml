criteria = []
parameter_cases = []

[[requirements]]
id = "DP-08"
title = "Fee in effect at payment time"
text = "The fee charged is the early-bird fee while the early-bird window is open at the moment of payment and the standard fee afterwards, and the receipt, Kill Bill invoice and screen all show that tier."
kind = "behavior"
primary = "pytest"
workflow = "entry-payment"
tests = [
    "test_app.py::test_fee_tier_at_payment",
