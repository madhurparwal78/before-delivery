[task]
name = "coldbrook/spurline"
version = "1.0.0"
description = "Spurline by Coldbrook Signal Works: a self-contained browser code forge with a content-addressed repository, threaded line review, suggestions, code owners, versions, stacked requests, a merge train whose cars are tested as stored speculative commits, a published pipeline file on a simulated runner, protected deployments with approval and rollback, boards, epics and milestones, all updating live on desktop and phone, backed by Postgres and MinIO."
