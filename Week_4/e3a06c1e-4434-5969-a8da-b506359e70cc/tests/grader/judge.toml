name = "S5"
type = "binary"
weight = 5
description = "Recipe: read the server code that sets a session's `billing_state` to `confirmed`, and trace it back to the Kill Bill usage call. A path that marks a session confirmed without sending a usage record, sends a record whose tracking id is not the session id or whose unit is not `billable-second`, or can send a session's record more than once without the tracking id guard fails. Cite the usage call and the confirming update as `file:line`. Pass: a session becomes `confirmed` only in the code path that runs after Kill Bill accepts that session's usage record or reports its tracking id already exists."

