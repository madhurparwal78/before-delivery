[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: Trace `HOLD_SECONDS`, `PROVIDER_TIMEOUT_SECONDS`, `RENDER_BACKOFF_SECONDS`, `REFUND_WINDOW_SECONDS`, `IDEMPOTENCY_TTL_SECONDS`, `PRESIGN_SECONDS` and `RENDER_QUEUE` from where they are read to the code that applies each one: the hold expiry, the provider render-call timeout, the retry wait, the refund-window check, the idempotency record expiry, the presigned-link expiry and the render queue name. At each of those use sites only, check whether a numeric or queue-name literal stands in for the configured value. Literals elsewhere are out of scope: seed data (such as seeded credit balances), plan and pack credit grants, prices, field length limits, the documented defaults inside the configuration module and the describe call's own 20-second cap are not defects. Cite each stand-in literal as `file:line`. Pass: every hold, timeout, backoff, refund-window, idempotency-TTL, presign and queue use site takes its value from the configuration."

