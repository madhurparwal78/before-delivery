title = "Board day and selection live in the URL"
text = "The coordinator board's agency-local day and selected booking are kept in the URL so that reload, Back and Forward restore them as qualified in Interactions, and the periodic refresh never changes the URL."
kind = "behavior"
primary = "pytest"
workflow = "triage-and-open-call"
tests = [
    "test_app.py::test_wf_triage_and_open_call_url",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-54"
title = "Interpreter search in the Assign dialog"
text = "Typing in Find interpreter narrows the Assign interpreter list, which always shows the results of the latest search text, and a chosen interpreter who is filtered out of view is unchosen and Assign is disabled."
kind = "behavior"
primary = "pytest"
workflow = "coordinator-assign"
tests = [
    "test_app.py::test_wf_coordinator_assign_search",
