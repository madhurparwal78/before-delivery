type = "binary"
weight = 3
description = "Recipe: Search the source for commented-out blocks, unused exports, unreachable branches, checks for states the types or schema rule out, and environment settings or routes the brief does not publish. Any instance fails. Cite each defect as `file:line`. Pass: The source holds no dead, commented-out or impossible-state code, with no feature, route or setting beyond the brief."

