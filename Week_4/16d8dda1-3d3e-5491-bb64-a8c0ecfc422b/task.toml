[task]
name = "corbel-slate/slatehall"
version = "1.0.0"
description = "Slatehall by Corbel & Slate: live browser 3D classrooms for independent teachers of adult learners, with seats, slides, raised hands, polls, server-timed breakout tables (Bell Return), spotlight, room lock and class-time-zone attendance, kept in step across two app instances through valkey, with lesson files in minio and the durable record in postgres."
authors = [
    { name = "Sunil Kumar", email = "sunil.kumar@ethara.ai" },
  { name = "Shivam Choudhary", email = "shivam.choudhary@ethara.ai" },
]
