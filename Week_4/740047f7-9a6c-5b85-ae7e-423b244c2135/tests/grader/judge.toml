[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: Read the Rust configuration code that reads the process environment, then search the Rust source and the frontend source folder for literal access keys, secrets, passwords, connection strings and service addresses. The brief's documented defaults (the listening port, and the request origin when no public URL is set) are allowed. Cite each literal as `file:line`. Pass: every service address, access key and secret is read from the process environment, with no literal credential in the Rust or frontend source."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-45",
]
evidence = "file_line"
cites = "L104, L1055-L1057"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: Trace the heartbeat, edit-lock and live-update code from the HTTP handlers to the Valkey calls. A process-local map, static or timer that stores or expires heartbeats or locks, or that relays changes between devices, is a defect. A key or channel name that differs from the published one is a defect. Cite each as `file:line`. Pass: heartbeats, edit locks and the live broadcast live only in Valkey under the published key and channel names."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-45",
]
evidence = "file_line"
cites = "L104, L917-L921"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: Trace the clearance check and the copilot question from the handlers to the outgoing HTTP client calls. Look for hard-coded forecast hours, canned completions, mock branches, and an `Authorization` header or any credential on those requests. Cite each defect as `file:line`. Pass: both provider calls are real HTTP requests to the configured provider base URL, with no canned reply or credential header in the code."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-45",
]
evidence = "file_line"
cites = "L104, L923-L962"

[[criterion]]
id = "S4"
name = "S4"
type = "binary"
weight = 3
description = "Recipe: Trace how defects, imports, revisions and links are stored, and how stills, sonar captures, import files and report packs are written. Look for SQLite, embedded databases, files or directories written to local disk, and object keys that differ from the published layout. Cite each defect as `file:line`. Pass: records live in Postgres and files in MinIO under the published object keys, with no SQLite, embedded database or local-disk state in the source."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-45",
]
evidence = "file_line"
cites = "L104, L897-L915, L1086-L1088"

[[criterion]]
id = "Q1"
name = "Q1"
type = "binary"
weight = 5
description = "Recipe: Search the Rust source for `.unwrap()`, `.expect(`, `panic!`, `unreachable!` and `#[allow(`. For each `unwrap` or `expect`, decide whether its value can depend on input, the network or storage. Cite each defect as `file:line`. Pass: every `unwrap` or `expect` call in the Rust source sits on a value that cannot depend on input, the network or storage."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L1094"

[[criterion]]
id = "Q2"
name = "Q2"
type = "binary"
weight = 3
description = "Recipe: Read the Rust module, type and function names and the TypeScript names that stand for the pen, net wall, panel cell, defect, placeholder, clearance, report revision, report link, edit lock, import ledger and findings context. A synonym such as `cage` for a pen, `issue` for a defect or `lease` for an edit lock is a defect. Cite each as `file:line`. Pass: the Rust and TypeScript names for these concepts use the brief's own domain terms rather than synonyms."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L1095"

[[criterion]]
id = "Q3"
name = "Q3"
type = "binary"
weight = 5
description = "Recipe: For each of these rules, find the Rust function that decides it, then search for a second implementation such as repeated threshold constants or repeated formulas: position and cell, areas and fouling cover, pen grade, clearance decision, dive transitions, lock check, one-at-a-time defect writes, import matching, link status and regeneration, tool-call validation, findings context, origin check, search matching, export neutralisation. Cite each duplicate as `file:line`. Pass: each domain rule named in the recipe is decided in exactly one Rust function."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L1096"

[[criterion]]
id = "Q4"
name = "Q4"
type = "binary"
weight = 5
description = "Recipe: Read the frontend source folder for code that computes bearings, depths, chart positions, panel cells, areas, fouling cover, grades, clearance results, link status, remaining link time or Online and Offline. Formatting the server's `expires_in_s` into hours and minutes, scaling server chart positions onto the flat chart, counting the dive clock from server elapsed seconds and sending a tapped wall point are allowed. Cite each defect as `file:line`. Pass: the frontend source computes none of the position, panel cell, area, fouling cover, grade, clearance, link status or presence values and only prints the server's values."

[criterion.annotations]
channel = "quality"
