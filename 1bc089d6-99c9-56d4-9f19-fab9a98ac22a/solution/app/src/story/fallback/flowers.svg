<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Flat drawing of the moonflowers for browsers without WebGL: a field of pale flowers under the moon. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0820"/>
      <stop offset=".3" stop-color="#3a2f6a"/>
      <stop offset=".31" stop-color="#141029"/>
      <stop offset="1" stop-color="#121722"/>
    </linearGradient>
    <g id="f">
      <g fill="#f1ecf6">
        <ellipse cx="0" cy="-14" rx="7" ry="15"/>
        <ellipse cx="0" cy="-14" rx="7" ry="15" transform="rotate(60)"/>
        <ellipse cx="0" cy="-14" rx="7" ry="15" transform="rotate(120)"/>
        <ellipse cx="0" cy="-14" rx="7" ry="15" transform="rotate(180)"/>
        <ellipse cx="0" cy="-14" rx="7" ry="15" transform="rotate(240)"/>
        <ellipse cx="0" cy="-14" rx="7" ry="15" transform="rotate(300)"/>
      </g>
      <circle r="5" fill="#ffb978"/>
    </g>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="380" cy="120" r="36" fill="#f3efe7"/>
  <circle cx="380" cy="120" r="90" fill="#f3efe7" opacity=".08"/>
  <g opacity=".7">
    <use xlink:href="#f" href="#f" transform="translate(160 360) scale(.6)"/><use href="#f" xlink:href="#f" transform="translate(420 340) scale(.5)"/>
    <use href="#f" xlink:href="#f" transform="translate(700 370) scale(.6)"/><use href="#f" xlink:href="#f" transform="translate(980 345) scale(.5)"/>
    <use href="#f" xlink:href="#f" transform="translate(1260 365) scale(.6)"/><use href="#f" xlink:href="#f" transform="translate(1500 350) scale(.5)"/>
  </g>
  <g opacity=".85">
    <use href="#f" xlink:href="#f" transform="translate(90 480) scale(1)"/><use href="#f" xlink:href="#f" transform="translate(360 450) scale(.9)"/>
    <use href="#f" xlink:href="#f" transform="translate(620 500) scale(1)"/><use href="#f" xlink:href="#f" transform="translate(880 460) scale(.9)"/>
    <use href="#f" xlink:href="#f" transform="translate(1140 490) scale(1)"/><use href="#f" xlink:href="#f" transform="translate(1420 470) scale(.9)"/>
  </g>
  <use href="#f" xlink:href="#f" transform="translate(220 640) scale(1.7)"/><use href="#f" xlink:href="#f" transform="translate(560 690) scale(1.9)"/>
  <use href="#f" xlink:href="#f" transform="translate(940 650) scale(1.7)"/><use href="#f" xlink:href="#f" transform="translate(1300 700) scale(1.9)"/>
  <use href="#f" xlink:href="#f" transform="translate(380 880) scale(2.6)"/><use href="#f" xlink:href="#f" transform="translate(1100 900) scale(2.6)"/>
</svg>
