[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 3
description = "Recipe: source MCP. 1) Search the source and templates for routes, handlers, models or UI for visitor accounts, signup or password reset. 2) Do the same for uploads, invoices, prices, payments and contracts. 3) Do the same for reply threads and comments. 4) Do the same for chat, journal, team, culture and careers views. 5) Search for analytics or third-party embeds, video, WebGL, 3D canvas contexts and native-app scaffolding. 6) Brief copy that only names them, such as the cookie card sentence, is allowed. Pass: none of the out-of-scope features exists in the source, with each instance found cited as `file:line`."

[criterion.annotations]
