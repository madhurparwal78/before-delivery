description = "Recipe: `playwright` at 1280x800, signed in as dana@brightfork.test (invented seed tenant). Open /documents, screenshot, and use `browser_evaluate` to read getComputedStyle of a cell in `table \"Documents on file\"` for color. Pass: the body text colour is a deep charcoal with a slight blue cast, with lightness below 25% and blue channel above red channel."

