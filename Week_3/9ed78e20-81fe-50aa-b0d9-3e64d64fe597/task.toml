[task]
name = "aldermoor/aldermoor-open-record"
version = "1.0.0"
description = "Open Record for the fictional Aldermoor Labs: a cookie-free public record of theses, model routes with claim-tethered benchmark charts, a newsroom with URL-held facets, ranked search and point-in-time reads, and careers, plus a governed staff console for review, responsible release sign-off, embargoed multi-surface launches, withdrawal, recruiting, time-limited role grants, a hash-chained audit record and a database-held job queue, running as several instances on PostgreSQL with MinIO and Mailpit."
authors = [
    { name = "Aniket Tyagi", email = "aniket.tyagi24@ethara.ai" },
    { name = "Sonu Sharma", email = "sonu.sharma@ethara.ai" },
]
keywords = [
    "editorial-workflow",
    "responsible-release",
    "embargo",
    "applicant-tracking",
    "optimistic-concurrency",
    "idempotency",
    "rate-limiting",
    "full-text-search",
    "audit-chain",
    "typescript",
]

