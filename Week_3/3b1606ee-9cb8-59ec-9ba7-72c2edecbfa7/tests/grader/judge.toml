weight = 3
description = "Recipe: list the type, function, column and route names in the server and client source that stand for held letters, delivery states, returned letters, seal numbers, recovery codes, the exchange, requests and blobs. A synonym such as message, fingerprint, safety number, pending queue or file token is a defect, cited as `file:line`. Pass: the source names those concepts only with the brief's own terms."

[criterion.annotations]
