{# The four icons of the brief, drawn inline in a square box, in the colour of the text around them. #}
{% macro arrow(class="") -%}
<svg class="icon icon-arrow {{ class }}" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path d="M3.5 12h16M13.5 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/></svg>
{%- endmacro %}
{% macro globe() -%}
<svg class="icon icon-globe" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="8.5"/><ellipse cx="12" cy="12" rx="3.6" ry="8.5"/><path d="M4.4 8.6h15.2M4.4 15.4h15.2"/></g></svg>
{%- endmacro %}
{% macro chevron() -%}
<svg class="icon icon-chevron" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path d="M6 9.5l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/></svg>
{%- endmacro %}
{% macro close(label) -%}
<svg class="icon icon-close" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="{{ label }}" focusable="false"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/></svg>
{%- endmacro %}
