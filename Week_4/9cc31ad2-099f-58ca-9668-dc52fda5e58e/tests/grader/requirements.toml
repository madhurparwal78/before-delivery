[runtime]
app_port = 4173
health_path = "/health"
manifest = "run.json"
bootstrap_probe = ""

[[services]]
name = "postgres"

[services.env]
GRADING_ROUTES = "on"
VERIFY_DELAY_MS = "1500"
SIGNIN_LINK_TTL_SECONDS = "20"
REJOIN_SECONDS = "10"
FINISH_GRACE_SECONDS = "5"

[[services]]
name = "minio"

[services.env]

[[services]]
name = "mailpit"

[services.env]
MAIL_FROM = "Kerbline <laps@ochrekerb.example>"

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_minio_down"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"
MAILPIT_URL = "http://127.0.0.1:9"

[[requirements]]
