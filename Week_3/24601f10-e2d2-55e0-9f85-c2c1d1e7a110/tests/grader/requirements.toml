[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[services]]
name = "postgres"

[services.env]
CUPFOLD_GRADING = "1"
CUPFOLD_CONFIRM_WINDOW_MS = "20000"
CUPFOLD_MATCH_LIMIT_MS = "15000"
CUPFOLD_SWISS_ROUND_MS = "30000"
CUPFOLD_CHECKIN_DEFAULT_MS = "30000"
CUPFOLD_REPORT_RATE = "20"
CUPFOLD_LOGIN_RATE = "10"
CUPFOLD_ROSTER_MAX_BYTES = "65536"
CUPFOLD_LOGO_MAX_BYTES = "524288"
CUPFOLD_TOAST_MS = "4000"

[[services]]
name = "minio"

[services.env]

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[requirements]]
id = "DP-01"
title = "Run manifest and health"
text = "The app installs, builds and serves from /app/run.json on port 4173 (honouring APP_PUBLIC_PORT), and GET /api/health answers as specified in Server boundary."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_health_and_served_files",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
