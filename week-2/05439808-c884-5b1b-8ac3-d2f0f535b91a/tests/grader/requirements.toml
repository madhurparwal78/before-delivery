[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "mailpit-down"
port = 4174
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[outages]]
id = "postgres-down"
port = 4175
url_env = "APP_POSTGRES_DOWN_URL"

[outages.env]
DATABASE_URL = "postgresql://gf_app:unreachable@127.0.0.1:9/gf_down"

[[outages]]
id = "short-timers"
port = 4176
url_env = "APP_SHORT_URL"

[outages.env]
DATABASE_URL = "${DATABASE_URL}_short"
RAID_FINALIZE_SECONDS = "20"
SHIELD_SECONDS = "30"
TARGET_COOLDOWN_SECONDS = "30"
VERIFY_TOKEN_SECONDS = "20"
RESET_TOKEN_SECONDS = "20"
SESSION_SECONDS = "60"
BUILD_TIME_DIVISOR = "10"

[[outages]]
id = "db-cut"
port = 4177
url_env = "APP_DB_CUT_URL"

[outages.env]
DATABASE_URL = "${DATABASE_URL}_cut"
RAID_FINALIZE_SECONDS = "20"

[[outages]]
id = "clock-havana"
port = 4178
url_env = "APP_CLOCK_HAVANA_URL"

[outages.env]
DATABASE_URL = "${DATABASE_URL}_clock_havana"
SALTREACH_CLOCK_START = "2027-03-14T04:55:00.000Z"

[[outages]]
id = "clock-santiago"
port = 4179
url_env = "APP_CLOCK_SANTIAGO_URL"

[outages.env]
