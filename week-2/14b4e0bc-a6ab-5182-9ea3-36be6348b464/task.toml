[task]
name = "quarrystone/strata-catalog"
version = "1.0.0"
description = "Strata, a self-hosted data governance catalog for regulated analytics teams at mid-size health plans and credit unions: column-level lineage with a downstream-sweep impact trace, tag propagation with suppression, bulk tagging with undo, certification with evidence in MinIO, deprecation notices through Mailpit, a chained append-only audit log in Postgres followed live, and point-in-time catalog views in business and viewer time."
authors = [
    { name = "Raja Kumar", email = "raja.kumarint17@ethara.ai" },
    { name = "Utsav Jain", email = "utsav.jain@ethara.ai" },
]
keywords = [
    "data-governance",
    "lineage",
    "tag-propagation",
    "audit-log",
    "point-in-time",
    "evidence",
    "range-requests",
    "server-sent-events",
    "accessibility",
    "typescript",
]

