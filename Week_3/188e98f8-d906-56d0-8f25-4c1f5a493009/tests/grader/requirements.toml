schema_version = 1
id_prefix = "DP"
mandatory_count = 87
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "desk-sign-in",
    "sheet-upload",
    "round-control",
    "captain-submit",
    "team-rename",
    "marking",
    "answer-archive",
    "spelling-search",
    "disputes",
    "rulings",
    "publish",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "S4",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 83
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "minio", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Roundkeeper <rulings@snug-league.test>" } },
]

[criterion_weights]
B1 = 5
B2 = 5
B3 = 3
B4 = 3
B5 = 3
B6 = 3
B7 = 5
B8 = 3
B9 = 3
B10 = 3
B11 = 5
B12 = 3
S1 = 5
S2 = 3
S3 = 5
S4 = 3
Q1 = 5
Q2 = 3
Q3 = 3
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"
DATABASE_URL = "${DATABASE_URL}_mailpit_down"

[[outages]]
id = "round-short"
port = 4176
url_env = "APP_ROUND_SHORT_URL"

[outages.env]
ROUND_SECONDS = "20"
DATABASE_URL = "${DATABASE_URL}_round_short"
S3_BUCKET = "${S3_BUCKET}-round-short"

[[requirements]]
id = "DP-01"
title = "Desk code sign-in"
text = "Signing in with a seeded desk code starts a session for that code's role and team, and an unknown code is refused, as specified in API and Seed data."
