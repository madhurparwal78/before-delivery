    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "intake-lifecycle",
    "queue-order",
    "grouping-urgency",
    "escalation-walk",
    "policy-editor",
    "final-timeline",
    "overrides-gaps",
    "oncall-cache",
    "notifications",
    "incident-list",
    "incident-page",
    "timers-reassign",
    "merge-split",
    "maintenance-windows",
    "map-status",
    "phone-journey",
    "analytics-job",
    "platform-access",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "B13",
    "S1",
    "S2",
    "S3",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 83
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "rabbitmq", env = {} },
    { name = "valkey", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Switchlamp <pager@tarecross.example>" } },
    { name = "wiremock", env = {} },
]

[criterion_weights]
B1 = 5
B2 = 5
B3 = 3
B4 = 3
B5 = 5
B6 = 3
B7 = 5
B8 = 3
B9 = 3
B10 = 3
B11 = 5
B12 = 3
B13 = 3
S1 = 5
S2 = 3
S3 = 3
Q1 = 3
Q2 = 3
Q3 = 5
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "valkey-down"
port = 4174
url_env = "APP_VALKEY_DOWN_URL"

[outages.env]
VALKEY_URL = "redis://127.0.0.1:9/0"
DATABASE_URL = "${DATABASE_URL}_valkeyout"
SWITCHLAMP_INSTANCE = "valkeyout"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"
MAILPIT_URL = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_mailout"
SWITCHLAMP_INSTANCE = "mailout"

[[outages]]
id = "wiremock-down"
port = 4176
url_env = "APP_WIREMOCK_DOWN_URL"

[outages.env]
WIREMOCK_URL = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_hookout"
SWITCHLAMP_INSTANCE = "hookout"

[[outages]]
id = "restart-copy"
port = 4177
url_env = "APP_RESTART_URL"

[outages.env]
DATABASE_URL = "${DATABASE_URL}_restart"
SWITCHLAMP_INSTANCE = "restart"

[[outages]]
id = "broker-down"
port = 4178
url_env = "APP_BROKER_DOWN_URL"

[outages.env]
AMQP_URL = "amqp://guest:guest@127.0.0.1:9/"
DATABASE_URL = "${DATABASE_URL}_brokerout"
SWITCHLAMP_INSTANCE = "brokerout"

