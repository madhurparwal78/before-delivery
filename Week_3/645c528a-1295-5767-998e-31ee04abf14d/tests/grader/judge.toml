[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: With the `source` MCP, start at the server's shot, placement, queue and settlement handlers, then read the browser code that plays an online table. Trace who decides shot outcomes, turns, fouls, clocks, balances and settlement, treating browser-only practice and the tutorial as permitted. Cite the deciding `file:line` for each. Pass: Every online shot result, turn, clock and settlement is decided in server code from client input limited to aim, power, spin, called pocket and ball placement."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-65",
]
evidence = "file_line"
cites = "L814, L866, L969"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: With the `source` MCP, read the server's configuration module and search all delivered files for credentials, connection strings, API keys and the grading key. Then read what configuration reaches browser code. The documented port and time-setting defaults are allowed. Cite each finding as `file:line`. Pass: Every credential comes from the environment at start, with no hard-coded value or fallback and none sent to the browser."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-65",
]
evidence = "file_line"
cites = "L961, L965, L970-L974"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 5
description = "Recipe: With the `source` MCP, trace a Cash pack purchase from its route through the payment provider client and receipt sending, then trace verification sending. A success path with no real provider call, a stubbed response, a canned payment id or a receipt marked sent before the mail server accepts it fails. Cite the call sites as `file:line`. Pass: Payment confirmation and mail delivery each rest on a real network call to the configured provider with its actual answer deciding the outcome."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-65",
]
evidence = "file_line"
cites = "L825, L881, L883-L890"

[[criterion]]
id = "S4"
name = "S4"
type = "binary"
weight = 3
description = "Recipe: With the `source` MCP, read the grading route guard and follow a scripted shot into the rules engine. A scripted path that sets fouls, turns, wins, balances or ledger lines by itself fails. Cite the guard and the shared path as `file:line`. Pass: Grading routes exist only behind the configured key, with scripted shots replacing only the simulation before the normal rules, settlement and ledger code runs."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-65",
]
evidence = "file_line"
cites = "L707-L711, L722"

[[criterion]]
id = "Q1"
name = "Q1"
type = "binary"
weight = 3
description = "Recipe: With the `source` MCP, read the TypeScript configuration, then search the source for `any`, `as unknown as`, `@ts-ignore`, `@ts-expect-error` and `@ts-nocheck`. Cite each instance as `file:line`. Pass: Strict mode is on with no use of these constructs to bypass the type checker."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L994"

[[criterion]]
