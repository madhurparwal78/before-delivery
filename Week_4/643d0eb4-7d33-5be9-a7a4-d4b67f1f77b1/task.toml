[task]
name = "deku/governed-table-workspace"
version = "1.0.0"
description = "Keystone Tables, the governed table workspace of an insurance operations group: a reader reaches no row of a department they hold no role in, a locked table refuses every amendment and names the period, a published snapshot keeps the rows it held at publication, one tier grant table feeds both the plan matrix and every console allowance refusal, change log ordinals stay contiguous across a deleted row and a removed column, and a requesting account cannot decide its own access request; plus the public landing, plans, enquiry, community and developer pages."
authors = [
    { name = "Sumit Gupta", email = "sumit.gupta39@ethara.ai" },
    { name = "Sonu Sharma", email = "sonu.sharma@ethara.ai" },
]
keywords = [
    "greenfield",
    "enterprise",
    "governed-table-workspace",
    "change-log",
    "entitlements",
    "snapshots",
    "access-requests",
    "postgres",
]

