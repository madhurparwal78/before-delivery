{% if member %}
<div class="account" x-data="accountMenu" @keydown.escape.window="close(true)" @click.outside="close(false)">
  <button type="button" class="account-button" aria-label="Account menu" aria-haspopup="menu" aria-controls="account-menu"
          :aria-expanded="open.toString()" aria-expanded="false" @click="toggle()" @keydown.down.prevent="show(0)" @keydown.up.prevent="show(-1)" x-ref="button">
    <span class="avatar avatar-sm" data-tint="{{ art.avatar_tint(member.email) }}" aria-hidden="true">{{ art.initials(member.name) }}</span>
  </button>
  <div class="menu" id="account-menu" role="menu" aria-label="Account" x-show="open" x-cloak x-ref="menu"
       @keydown.down.prevent="move(1)" @keydown.up.prevent="move(-1)" @keydown.home.prevent="show(0)" @keydown.end.prevent="show(-1)"
       @keydown.tab="close(false)">
    <p class="menu-who"><span class="menu-name">{{ member.name }}</span><span class="menu-email">{{ member.email }}</span></p>
    <a role="menuitem" tabindex="-1" href="/home">My Events</a>
    <a role="menuitem" tabindex="-1" href="/create">Create Event</a>
    <button role="menuitem" tabindex="-1" type="button" @click="signOut()">Sign Out</button>
  </div>
</div>
{% else %}
<a class="pill-link dark small" href="/signin{% if request.path not in ('/signin', '/') and not visitor_view %}?next={{ request.full_path.rstrip('?') | urlencode }}{% endif %}">Sign In</a>
{% endif %}
