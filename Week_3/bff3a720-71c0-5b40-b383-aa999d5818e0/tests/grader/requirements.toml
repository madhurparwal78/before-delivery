[[requirements]]
id = "DP-15"
title = "Booking attempt limit"
text = "A passenger may make at most `REQUEST_RATE_PER_HOUR` booking attempts in any 60-minute window; the next attempt answers 429 with `Retry-After`, shows the published wait copy and writes nothing."
kind = "behavior"
