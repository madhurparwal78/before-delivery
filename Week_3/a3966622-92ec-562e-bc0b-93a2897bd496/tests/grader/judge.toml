type = "binary"
weight = 3
description = "Recipe: trace notice sending from each state change to the SMTP transport, then list every HTTP route the server registers, looking for any route that marks notices sent, posts charges, advances the clock or otherwise exists only for tests. Cite as `file:line`. Pass: a notice's state becomes `sent` only after the SMTP transport accepts the message, with no route that fakes provider state or exists only for tests."

[criterion.annotations]
channel = "source"
