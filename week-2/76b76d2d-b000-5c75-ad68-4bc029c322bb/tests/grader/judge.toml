[[criterion]]
id = "B7"
name = "B7"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800. 1) Open `/en/?season=nitrate-nights`. 2) Take three numbers: the time in the first rail row, the number of seats left in that row and the f-stop readout. For each, probe the computed `font-family`, weight and style of the innermost element that holds the digits' own text node, not of a container that also holds words such as `left`, since the brief sets numbers in mono and leaves the words beside them to the body face. 3) Run `document.fonts.check` at each digit element's own weight and style with its first computed family name as the page registers it. 4) Find the face for that family in `document.styleSheets` or `document.fonts` and note its font file where shown. 5) Take a screenshot. The brief names a typeface, not a CSS family string, so a self-hosted face registered under an alias such as `IBMPlexMono` or `IBM Plex Mono Variable` counts when its family name or font file names IBM Plex Mono. Pass: the digits of all three numbers compute an IBM Plex Mono face under any alias as their first family, loaded at the weight each one uses."

