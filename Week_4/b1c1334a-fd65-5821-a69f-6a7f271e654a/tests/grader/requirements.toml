[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "mailpit-down"
port = 4174
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "short-ttl"
port = 4176
url_env = "APP_SHORT_TTL_URL"

[outages.env]
IDEMPOTENCY_TTL_SECONDS = "5"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
id = "DP-01"
title = "Sign in without revealing accounts"
text = "Sign-in accepts a seeded email and password, starts a session, and answers both a wrong password and an unknown email with the identical 401 response from API."
kind = "behavior"
primary = "pytest"
workflow = "viewer-readonly"
tests = [
    "test_app.py::test_sign_in_identical_401",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Sessions and sign-out"
text = "Every API route except sign-in and health requires a session, the current-person route returns the signed-in person, and sign-out ends the session at once."
kind = "behavior"
primary = "pytest"
workflow = "viewer-readonly"
tests = [
    "test_app.py::test_sessions_required",
]
criteria = []
parameter_cases = []

