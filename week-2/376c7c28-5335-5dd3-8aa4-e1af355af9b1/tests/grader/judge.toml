[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server source under /app/src and any setup scripts, find where Postgres, Kill Bill, MinIO and SMTP clients are constructed, and grep the tree for hostnames, ports, usernames, passwords, API keys and secrets. A literal credential, host or bucket name used as a value or fallback fails; cite each as `file:line`. Pass: every service URL and credential comes from its named environment variable with no literal value or fallback in source, other than the brief's own documented defaults (APP_PUBLIC_PORT 4173 and the stated session, invite, sign-in lock, billing retry and reminder sweep defaults)."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-05",
]
evidence = "file_line"
cites = "L731-L741, L627"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: identify the browser code (the client entry and every module it imports) and the build config that defines client-exposed variables, then grep them for the Configuration variable names, any `process.env` or `import.meta.env` read of a service value, and any API handler that serialises config into a response. Any env define, injected global or response field carrying one fails; cite it as `file:line`. Pass: no credential or service URL can reach browser code or any HTTP response."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-05",
]
evidence = "file_line"
cites = "L733, L736-L739"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: trace the Kill Bill purchase, refund and lookup calls and the MinIO put, get and delete calls from their route or settler entry to the outgoing request. Cite the call sites as `file:line`. Pass: each call goes to the configured service using the env-read credentials (Kill Bill basic auth plus the X-Killbill-ApiKey and X-Killbill-ApiSecret headers, S3 access key and secret) with no stub, in-memory fake or test-only branch that records success without calling the provider."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-05",
]
evidence = "file_line"
cites = "L627-L635, L736-L737"

