Q3 = 3
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "storage-down"
port = 4174
url_env = "APP_STORAGE_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "mail-down"
port = 4175
url_env = "APP_MAIL_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"
DATABASE_URL = "${DATABASE_URL}_maildown"
S3_BUCKET = "${S3_BUCKET}-maildown"

[[outages]]
id = "summary-clock"
port = 4176
url_env = "APP_SUMMARY_URL"

[outages.env]
SUMMARY_LOCAL_TIME = "00:00"
SUMMARY_QUIET_SECONDS = "15"
EVENT_RETENTION_COUNT = "20"
DATABASE_URL = "${DATABASE_URL}_summary"
S3_BUCKET = "${S3_BUCKET}-summary"

[[outages]]
id = "mirror"
port = 4177
url_env = "APP_MIRROR_URL"

[outages.env]

[[requirements]]
