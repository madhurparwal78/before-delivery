[task]
name = "ferrocline/switchyard-desk"
version = "1.0.0"
description = "Switchyard by Ferrocline Works: a published-rule service desk for a one-person IT provider running one organisation's internal IT. Request catalog and order guides, incidents and problems, SLA clocks on business schedules across daylight saving, a layered service map with outage impact and the Outage relay, change risk, freeze and board votes with quorum rules, on-call rotations and escalation ladders, a keyboard-complete workflow designer, access rules on every derived surface, and configuration promotion. Backed by Postgres and MinIO."
authors = [
    { name = "Khushi Tyagi", email = "khushi.tyagi@ethara.ai" },
    { name = "Kaustubh Dalvi", email = "kaustubh.dalvi@ethara.ai" },
]
