[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "storage-down"
port = 4174
url_env = "APP_STORAGE_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "short-limits"
port = 4175
url_env = "APP_SHORT_LIMITS_URL"

[outages.env]
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"
PHOTO_MAX_BYTES = "200000"
SAFARI_SEAT_RELEASE_SECONDS = "3"
POSTCARD_LIMIT = "2"
POSTCARD_WINDOW_SECONDS = "30"
LIVE_INTERVAL_MS = "500"

