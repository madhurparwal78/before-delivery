description = "Recipe: read the client handlers for the answers of Confirm and send, Approve, Mark paid, and Request withdrawal, plus the code that paints balances, available figures and feed rows. Client arithmetic that adjusts a shown figure, or a feed row inserted before or instead of a server answer, counts as a fail. Cite each handler as `file:line`. Pass: every shown balance, available figure or feed row is painted only from a server answer or a refetch."

[criterion.annotations]
