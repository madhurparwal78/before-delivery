S2 = 5
S3 = 3
S4 = 3
S5 = 3
S6 = 3
Q1 = 3
Q2 = 5
Q3 = 5
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4176
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[outages]]
id = "short-timer"
port = 4177
url_env = "APP_SHORT_URL"

[outages.env]
DUNNING_DAY_SECONDS = "5"
DOWNLOAD_LINK_SECONDS = "5"
PREVIEW_TTL_SECONDS = "5"
INVITE_TTL_SECONDS = "5"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
id = "DP-01"
title = "Published work and journal"
text = "The home page's card deck and the journal page list exactly the case studies and journal posts the CMS holds as published, newest first, and each one opens its own detail route."
kind = "behavior"
primary = "pytest"
workflow = "explore-work"
tests = [
    "test_app.py::test_published_work_and_journal",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Entry publishing lifecycle"
text = "The studio owner moves each entry only from draft to published to withdrawn, every other move is refused, and a withdrawn entry leaves the deck and its detail route shows the not-found page within the delay set in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "explore-work"
tests = [
    "test_app.py::test_entry_publishing_lifecycle",
]
criteria = []
parameter_cases = []

