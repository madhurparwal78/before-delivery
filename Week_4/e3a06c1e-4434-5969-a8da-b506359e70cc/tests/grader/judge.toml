description = "Recipe: search the source, config files and browser code for Postgres, S3 or MinIO, and Kill Bill URLs, usernames, passwords, access keys and API secrets, and for log calls that print config or connection objects. A hard-coded, logged or browser-shipped value fails. Documented defaults (port 4173, the idle and cap seconds, the `lowfield` billing prefix) are allowed. Cite each env read, and each violation as `file:line`. Pass: every service URL and credential is read from its environment variable at start."

