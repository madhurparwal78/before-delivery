[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: Read the configuration module and every place that builds a client for the database, the payment ledger, the object store, the search index, the SMS gateway and the UPI and net-banking provider. Search the source for literal hostnames, URLs, API keys, usernames and passwords. Allowed literals are the ones the brief documents: port 4173, the optional public-port override, the default search index name, the timing defaults, and the seeded persona passwords and gift card codes. Also check the log calls and the payloads sent to the browser for any credential or service URL. Pass: Every service URL and credential is read from the environment, with no other literal, log line or browser payload carrying one."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-56",
]
evidence = "file_line"
cites = "L84, L894-L895, L909"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: Trace checkout, refunds, the UPI and net-banking status pass, cash-on-delivery collection and the sign-in code send. Find the outbound HTTP calls to the payment ledger (accounts keyed by shopper, PURCHASE payments keyed by order and leg, REFUND transactions keyed by refund id), to the SMS gateway and to the UPI and net-banking provider. A payment marked paid, a refund counted or a code treated as sent before or without the provider's reply fails, as does a fixed code, an in-process ledger or a test-only route. Pass: Every payment, refund and SMS send is made by an outbound call to its provider."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-56",
]
evidence = "file_line"
cites = "L84, L736-L747, L775-L788, L619"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: Trace the invoice, label, listing photo and GST certificate writes, then the search index sync and the search query. Find the object-store calls that write the published object keys and confirm that no local file path holds those files and that a ready flag is set only after a successful write. Find the search-index client calls that create, update, delete and query documents, and confirm the Postgres title match runs only when the index call fails. Pass: Every document write and every search query is made by a client call to its provider."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-56",
]
evidence = "file_line"
cites = "L84, L748-L773"

[[criterion]]
id = "S4"
name = "S4"
type = "binary"
weight = 3
description = "Recipe: These screens need a signed-in session, so read their source instead. Find the components and style rules that render the cart parcel panels, the checkout review step and the seller settlement statement. Locate the taxable value, CGST, SGST, IGST, cash-on-delivery fee, delivery fee, commission, GST on commission, tax collected at source and tax deducted at source lines, and read the font family, weight and size applied to each at the phone width. A caption or small fine-print style on any of these lines fails. Pass: Every tax, fee and deduction line is set in a heavy weight at a size no smaller than the surrounding body text at the phone width, not as caption or fine print."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L191, L88"

