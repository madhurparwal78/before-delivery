{% extends "base.html" %}
{% block title %}Sign in · Keystone Tables{% endblock %}
{% block main %}
<section class="band"><div class="frame stack-lg">
  <h1>Sign in</h1>
  <form id="login-form" class="stack narrow" novalidate>
    <div class="field"><label for="email">Work email</label><input class="input" id="email" name="email" type="email" autocomplete="username" required aria-required="true"></div>
    <div class="field"><label for="password">Password</label><input class="input" id="password" name="password" type="password" autocomplete="current-password" required aria-required="true"></div>
    <div class="notice refuse" id="login-error" role="alert" hidden></div>
    <div class="btn-row"><button type="submit" class="btn btn-primary" id="login-send">Sign in</button></div>
  </form>
  <p class="muted">New here? <a href="/signup">Create an account</a>.</p>
</div></section>
{% endblock %}
{% block scripts %}<script src="{{ asset('public.js') }}" defer></script>{% endblock %}
