[[requirements]]
id = "DP-21"
title = "Withdrawn parts"
text = "A withdrawn part can no longer be claimed, estimated, identified or re-quoted, while claims already quoting it keep their quoted figures and can still be dispatched."
kind = "behavior"
primary = "pytest"
workflow = "catalogue-and-editions"
tests = [
    "test_app.py::test_wf_catalogue_and_editions_withdrawn",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-22"
title = "Public parts list"
text = "The public parts list pages in a stable order, returns at most 50 parts per page, answers 429 with Retry-After once a caller exceeds the published rate, and refuses every request when the rate is zero."
kind = "behavior"
primary = "pytest"
workflow = "catalogue-and-editions"
tests = [
    "test_app.py::test_public_parts_list",
