[[requirements]]
id = "DP-01"
title = "Member sessions and roles"
text = "Choosing a member opens a bearer-token session for them, every request except the health check, the member list and session creation carries that token, and the server refuses missing or unknown tokens and actions outside the member's role as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "funding-ledger"
tests = [
    "test_app.py::test_sessions_and_roles",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Onboarding and inbound transfers"
text = "The risk steward adds a member with a name, an email and one role, and records an inbound transfer typed in desk format that reaches the member's wallet as one balanced posting of the exact minor units."
kind = "behavior"
primary = "pytest"
workflow = "funding-ledger"
tests = [
    "test_app.py::test_onboarding_and_transfers",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Balanced journals"
text = "Every posting sums to zero per asset it touches, postings are never edited, and the trial balance on the Ledger view nets to zero in every asset after any sequence of actions."
kind = "behavior"
primary = "pytest"
workflow = "funding-ledger"
tests = [
    "test_app.py::test_balanced_journals",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Ledger view state in the URL"
text = "The Ledger view's asset, count and desk-time window filters live in the URL as set out in Interactions, so Back, Forward and reload restore them and an unknown value falls back to its default without adding a history entry."
kind = "behavior"
primary = "pytest"
workflow = "funding-ledger"
tests = [
    "test_app.py::test_ledger_url_state",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-05"
title = "Steward funding journey"
text = "The risk steward onboards a borrower, records a transfer typed in desk format while the borrower's open wallet shows it without a reload, filters the Ledger view to that asset and a desk-time window across the daylight-saving change, and sees the transfer's legs and a zero net, with a request that breaks two rungs of the error ladder answered at the higher rung."
kind = "behavior"
primary = "workflow"
workflow = "funding-ledger"
tests = [
    "test_app.py::test_wf_funding_ledger_happy",
    "test_app.py::test_wf_funding_ledger_ladder",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-06"
title = "Pool shares and withdrawals"
text = "A liquidity provider supplies an asset for shares and withdraws up to their share value and the pool's available liquidity, with mint and burn rounded in the pool's favour and each withdrawal settled with a statement."
kind = "behavior"
primary = "pytest"
workflow = "lp-supply"
tests = [
    "test_app.py::test_pool_shares_and_withdrawals",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-07"
title = "Pool figures read from the ledger"
text = "Every pool's available liquidity, total borrowed, utilization and share price equal the values computed from ledger balances at the moment of reading, after every swap, supply, withdrawal, draw, repay, accrual and liquidation."
kind = "behavior"
primary = "pytest"
workflow = "lp-supply"
tests = [
    "test_app.py::test_pool_figures_from_ledger",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-08"
title = "Last-liquidity contest"
text = "When concurrent withdrawals, draws or swaps together ask for more than a pool's available liquidity, even through different server processes, they are served one at a time and the one that no longer fits gets the insufficient-liquidity conflict with nothing moved."
kind = "behavior"
primary = "pytest"
workflow = "lp-supply"
tests = [
    "test_app.py::test_last_liquidity_contest",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-09"
title = "Supply form survives refresh"
text = "On the Supply view, typed amounts, the chosen pool, browser-side field errors, focus and the last announcement survive every 5-second refresh while the pool cards update in place."
kind = "behavior"
primary = "pytest"
workflow = "lp-supply"
tests = [
