type = "binary"
weight = 3
description = "Recipe: search the server for every place that writes an error status or an error body (reply and response calls, literal `error:` objects, 422 `fields` bodies). Any error body assembled outside the one shared builder fails, so cite each as `file:line`. Pass: every error response is built by one shared function that produces the `{\"error\":\"<code>\"}` shape, with `fields` added for validation failures."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L535"

[[criterion]]
id = "Q7"
name = "Q7"
type = "binary"
weight = 3
description = "Recipe: list the server routes, client pages, database tables and production dependencies, then compare them with the brief's out-of-scope list (player accounts, teams, chat, audio rounds, payments or plans, email, public deck sharing, analytics, a fourth datastore). Any route, screen, table or dependency serving one of them fails, so cite each as `file:line`. Pass: no route, screen, table or dependency exists for a feature beyond the brief."

