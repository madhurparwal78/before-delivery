]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-08"
title = "Retry-safe booking requests"
text = "Repeating a hold or confirm with the same Idempotency-Key, including concurrent repeats still in flight and repeats whose JSON differs only in key order, whitespace or an empty body for {}, returns the original response without a second hold, charge or email, and reusing a key with a different request answers 409."
kind = "behavior"
primary = "pytest"
workflow = "book-a-block"
tests = [
    "test_app.py::test_idempotent_booking_requests",
]
criteria = []
parameter_cases = []

