criteria = []
parameter_cases = []

[[requirements]]
id = "DP-55"
title = "The hidden pane is unavailable"
text = "In the compact layout, whichever of the list and detail panes is hidden is absent from the accessibility tree and unreachable by Tab, and after a withdrawal the list returns with focus on its first row as qualified in Interactions."
kind = "behavior"
primary = "pytest"
workflow = "withdraw-and-recover"
tests = [
    "test_app.py::test_wf_withdraw_and_recover_phone",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-56"
title = "Upload stores object and record together"
text = "Each prep file's stored object and its record exist together or not at all, concurrent uploads never take a booking past its file limit, and a storage outage leaves the materials list unchanged while bookings keep working."
kind = "behavior"
primary = "pytest"
workflow = "prep-materials"
tests = [
    "test_app.py::test_concurrent_uploads",
    "test_app.py::test_wf_prep_materials_storage_outage",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-57"
title = "Layout ranges at exact edges"
text = "The compact, medium and wide layouts and their dialog sizes switch exactly at the published range edges in Screens and layout."
kind = "behavior"
primary = "pytest"
workflow = "requester-cancel"
tests = [
    "test_app.py::test_wf_requester_cancel_layout",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-58"
title = "Rate by agency-local assignment date"
text = "Completions, late-cancellation lines and cancellation quotes use the contract rate in force on the booking's agency-local start date, and a rate added after a quote changes the charge that quote must confirm."
kind = "behavior"
primary = "pytest"
workflow = "complete-and-bill"
tests = [
    "test_app.py::test_rate_by_assignment_date",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-59"
title = "One booking per draft"
text = "The New request dialog sends one Idempotency-Key for an unchanged draft, so pressing Submit request again after a lost response replays the stored booking, and one key yields exactly one booking, reference and audit entry even when requests with it arrive concurrently."
kind = "behavior"
primary = "pytest"
workflow = "request-intake"
tests = [
    "test_app.py::test_wf_request_intake_lost_response",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-60"
title = "Actions are never undone by a stale refresh"
text = "A refetch requested before the user's latest action on the same data finished is discarded, so the board, the interpreter lists and the weave never show a booking state older than one an action produced and the action's announced result stays."
kind = "behavior"
primary = "pytest"
workflow = "triage-and-open-call"
tests = [
    "test_app.py::test_wf_triage_and_open_call_stale_refresh",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-61"
title = "In-app withdraw and release confirmation"
text = "Withdraw and Release confirm through in-app dialogs sized by the layout ranges, with the safe button focused first, Tab wrapping, tap support and no native prompt, and the departing turns collapse right to left or instantly under reduced motion."
kind = "behavior"
primary = "pytest"
workflow = "withdraw-and-recover"
tests = [
    "test_app.py::test_wf_withdraw_and_recover_release",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-62"
title = "Prep files stored as submitted"
text = "Each prep file is stored and served byte for byte with its recorded SHA-256, and its display name is kept exactly as submitted up to 120 code points and delivered in the download's RFC 5987 file name with the published ASCII fallback."
kind = "behavior"
primary = "pytest"
workflow = "prep-materials"
tests = [
    "test_app.py::test_stored_as_submitted",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-63"
title = "An ended session resumes the action"
text = "A user action answered as unauthenticated opens Sign in to continue over the kept screen and, after signing in again, is resent once with the same method, path, body and Idempotency-Key, while refreshes answered as unauthenticated change nothing on screen."
kind = "behavior"
primary = "pytest"
workflow = "request-intake"
tests = [
    "test_app.py::test_wf_request_intake_session_resume",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-64"
title = "A claim moves only on the server's answer"
text = "A claimed row moves to My assignments only after the server accepts the claim, a refetch requested before the claim answered never puts it back under Open calls, and a refused claim's alert and focus survive every later refresh, as qualified in Interactions."
kind = "behavior"
primary = "pytest"
workflow = "open-call-claim"
tests = [
    "test_app.py::test_wf_open_call_claim_refusal",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-65"
title = "Abandoned transfers release storage at once"
text = "A prep download the client abandons releases its storage connection at once and an upload cut off mid-body stores nothing and uses no file slot, so later downloads and API calls stay exact and fast, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "prep-materials"
tests = [
    "test_app.py::test_abandoned_transfers",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-66"
title = "Cancel dialog survives reopening"
text = "Reopening Cancel booking during its closing fade keeps the new dialog open with focus on Keep booking, each opening shows only its own fresh quote, and refreshes never change the quote, the confirm label or focus while it is open."
kind = "behavior"
primary = "pytest"
workflow = "requester-cancel"
tests = [
    "test_app.py::test_wf_requester_cancel_reopen",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-67"
title = "One completion per draft"
text = "The Complete assignment dialog sends one Idempotency-Key per unchanged draft, so pressing Record completion again after a lost response replays the stored result with exactly one invoice line, one Kill Bill charge and one audit entry."
kind = "behavior"
primary = "pytest"
workflow = "complete-and-bill"
tests = [
    "test_app.py::test_wf_complete_and_bill_lost_response",
]
criteria = []
parameter_cases = []

