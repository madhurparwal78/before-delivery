[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server configuration module and every place that connects to PostgreSQL, object storage or SMTP, then search the delivered source, excluding docs and compose files, for literal connection strings, service URLs, hostnames and access keys. Allow every default the brief documents: port 4173, APP_BASE_URL derived from the port, the MAIL_FROM value, and the retry, invite and session defaults, and do not count a literal fallback for a setting that is neither a credential nor a URL or hostname, such as a port number or region. Cite any hard-coded service credential, database URL or service endpoint as file:line, while the seeded members' password from the brief is allowed. Pass: every service credential and service URL is read from process.env."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-44",
]
evidence = "file_line"
cites = "L984-L998, L977, L127"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: read the client source tree, the bundler configuration and the HTML template, then trace every API handler that serialises configuration or workspace data. A client import of the server config module, a bundler define or exposed env prefix carrying a service value, or a response field exposing a credential counts as a fail; cite it as file:line. Pass: no service credential or service URL from the environment reaches the browser."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-44",
