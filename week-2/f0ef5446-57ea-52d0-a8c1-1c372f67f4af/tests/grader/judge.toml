description = "Recipe: 1. Trace each use of AUTH_CLIENT_SECRET, DATABASE_URL and any Keycloak admin or service-account token. 2. Read the page templates, the static scripts and the API response serialisers. 3. Cite as file:line any path that renders, inlines or returns one of those values. Pass: no code path lets the client secret, database URL or an admin token reach a template, static asset or response body."

