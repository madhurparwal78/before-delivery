S2 = 5
S3 = 5
S4 = 3
Q1 = 3
Q2 = 3
Q3 = 5
Q4 = 3
Q5 = 3
Q6 = 5
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_killbill_down"
S3_BUCKET = "${S3_BUCKET}-killbill-down"

[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_minio_down"

[[outages]]
id = "short-timer"
port = 4176
url_env = "APP_SHORT_URL"

[outages.env]
ANSWER_WINDOW_SECONDS = "20"
REVIEW_CLAIM_SECONDS = "20"
DATA_REQUEST_PAGE_SECONDS = "30"
RETENTION_SECONDS = "20"
PARTNER_RATE_WINDOW_SECONDS = "30"
REGULATOR_FILE_RATE_WINDOW_SECONDS = "30"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[outages]]
id = "short-session"
port = 4177
url_env = "APP_SHORT_SESSION_URL"

[outages.env]
SESSION_SECONDS = "20"
DATABASE_URL = "${DATABASE_URL}_session"
S3_BUCKET = "${S3_BUCKET}-session"

[[requirements]]
id = "DP-01"
title = "Staff sign-in without account hints."
text = "Staff sign in with email and password and sign out through the API, and a wrong password and an unknown email get the identical refusal status and body."
kind = "behavior"
primary = "pytest"
workflow = "workspace-access"
tests = [
    "test_app.py::test_session_sign_in_and_out",
    "test_app.py::test_wf_workspace_access_sign_in",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Members managed by the compliance officer."
text = "The compliance officer lists members, adds a member with a starting password and a role who can then sign in, changes that member's role and removes them, after which they can no longer sign in, as qualified in API."
kind = "behavior"
primary = "pytest"
workflow = "workspace-access"
tests = [
    "test_app.py::test_members_lifecycle",
    "test_app.py::test_wf_workspace_access_members",
]
criteria = []
parameter_cases = []

