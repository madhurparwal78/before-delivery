description = "Recipe: `playwright` at 1280x800. 1) Sign in as the invented seed designer Juno Park (juno@northvale.example, rushes-demo-2026). 2) On /w/northvale choose 'SS27 Coastal Workwear' in `combobox 'Tray cluster'` without changing anything else. 3) Activate `button 'Open clip Capstan reel'` and press Arrow Right twice. 4) Probe the computed colours of the playhead line, the 'Pluck' and 'Close' buttons, the links in `navigation 'Main'`, the page headings and the wall card borders. 5) Screenshot the wall, tray and strip. Pass: the playhead is a thin warm amber line while no button, link, heading or card edge in the screenshot shows amber."

