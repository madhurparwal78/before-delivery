[[requirements]]
id = "DP-56"
title = "Mobile menu"
text = "Below 1024 px, `Menu` opens the modal `Menu` dialog with focus on `About` and Tab wrapping inside. Escape, `Close menu` or a tap outside closes it with focus back on `Menu`, and choosing a link closes it and jumps with focus on the target heading; reopening it mid-close keeps it open, and nothing inside is reachable while it is closed."
kind = "behavior"
primary = "pytest"
workflow = "mobile-access"
tests = [
    "test_app.py::test_mobile_menu",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-57"
title = "Published layouts and targets"
text = "At 375x812, 768x1024 and 1280x800, the header, hero, gallery, services, counters, contact and footer follow the published layouts with no horizontal overflow, and every target is at least 44 px at 375 wide. Every page has `lang=\"en\"`, one `main` landmark, one level-1 heading and no automated accessibility violations."
kind = "behavior"
