title = "Touch controls"
text = "On touch devices the HUD shows move and aim sticks and Fire, Reload, Grenade and Pause buttons that drive the same server actions as the keyboard."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_touch_controls",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-56"
title = "Responsive layers"
text = "Every screen fits 375x812, 768x1024 and 1280x800 as fixed layers over the stage, with no document scroll or horizontal overflow and with tap targets of at least 44 px."
kind = "visual"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_responsive_layers",
]
criteria = []
parameter_cases = [
    "phone",
    "tablet",
    "desktop",
]

[[requirements]]
id = "DP-57"
title = "Siege field stage"
text = "A live 3D block-field stage sits behind every screen, with the published idle motion, input response, reduced-motion stillness and a still fallback without WebGL."
kind = "visual"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_stage",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-58"
title = "Server boundary"
text = "The server serves same-origin only, enforces the body-size and content-type limits, never serves source or credentials, and boots and recovers with dependencies down."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_server_boundary",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-59"
title = "Credentials from the environment"
text = "Every service URL and credential is read from the environment at start and never hard-coded or sent to the browser."
kind = "source"
primary = "rubric"
workflow = "cross-cutting"
tests = []
criteria = [
    "S1",
    "S2",
    "S3",
]
parameter_cases = []

