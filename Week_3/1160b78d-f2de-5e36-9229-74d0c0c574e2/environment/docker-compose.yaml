services:
  main:
    environment:
      MAIL_FROM: Switchlamp <pager@tarecross.example>
      APP_PUBLIC_PORT: '4173'
      APP_PUBLIC_URL: http://127.0.0.1:4173
      DATABASE_URL: postgresql://gf_app:gf-app-dev-2b7d41@postgres:5432/gf_dev
      AMQP_URL: amqp://gfkit:gfkit-dev@rabbitmq:5672/%2F
      VALKEY_URL: redis://app:gfkit-dev@valkey:6379/0
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      MAILPIT_URL: http://mailpit:8025
      WIREMOCK_URL: http://wiremock:8080
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      postgres-seed:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      valkey:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      wiremock:
        condition: service_healthy
  postgres:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_USER: gf_admin
      POSTGRES_PASSWORD: gf-admin-dev-9e4a02
      POSTGRES_DB: postgres
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U gf_admin -d postgres
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  postgres-seed:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      PGHOST: postgres
      PGUSER: gf_admin
      PGPASSWORD: gf-admin-dev-9e4a02
      PGDATABASE: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - |
      psql -Atqc "SELECT 1 FROM pg_roles WHERE rolname = 'gf_app'" | grep -q 1 ||
        psql -qc "CREATE ROLE gf_app LOGIN PASSWORD 'gf-app-dev-2b7d41'"
      psql -Atqc "SELECT 1 FROM pg_database WHERE datname = 'gf_dev'" | grep -q 1 ||
        psql -qc "CREATE DATABASE gf_dev OWNER gf_app"
  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine@sha256:b768d2e09a809b48458d6c3c32fc2894643a6bfafd76264c120373eff0ee6532
    environment:
      RABBITMQ_DEFAULT_USER: gfkit
      RABBITMQ_DEFAULT_PASS: gfkit-dev
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
  valkey:
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    command:
    - valkey-server
    - --requirepass
    - gfkit-dev-admin
    - --save
    - ''
    - --appendonly
    - 'no'
    - --user
    - app
    - 'on'
    - '>gfkit-dev'
    - ~*
    - '&*'
    - +@all
    - -@admin
    - -flushall
    - -flushdb
    healthcheck:
      test:
      - CMD
      - valkey-cli
      - -a
      - gfkit-dev-admin
      - --no-auth-warning
      - ping
      interval: 2s
      timeout: 5s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    healthcheck:
      test:
      - CMD
      - /mailpit
      - readyz
      interval: 2s
      timeout: 5s
      retries: 30
  wiremock:
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    entrypoint:
    - sh
    - -c
    - if [ -n "$$WIREMOCK_STUBS" ]; then printf '%s' "$$WIREMOCK_STUBS" > /home/wiremock/mappings/baseline.json;
      fi; exec /docker-entrypoint.sh --port 8080 --disable-banner --max-request-journal-entries 20000 --admin-api-basic-auth
      gfkit-admin:gfkit-dev
    healthcheck:
      test:
      - CMD
      - curl
      - -sf
      - -u
      - gfkit-admin:gfkit-dev
      - http://127.0.0.1:8080/__admin/health
      interval: 2s
      timeout: 5s
      retries: 60
    environment:
      WIREMOCK_STUBS: '{"mappings": [{"request": {"method": "POST", "urlPathPattern": "/hooks/.*"}, "response":
        {"jsonBody": {"received": true}, "status": 200}}]}'
