criteria = []
parameter_cases = []

[[requirements]]
id = "DP-06"
title = "Slack rings and readout"
text = "Each sketch point with remaining freedom shows a slack-coloured ring whose radius grows with its freedom, the bottom strip reads Slack N, and a sketch at zero turns its strokes to ink with the readout Fully held."
