[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_storage"
S3_BUCKET = "${S3_BUCKET}-storage"
SEARCH_INDEX_PREFIX = "storage"
CLOSURE_WAIT_SECONDS = "5"

[[outages]]
id = "gotenberg-down"
port = 4175
url_env = "APP_GOTENBERG_DOWN_URL"

[outages.env]
GOTENBERG_URL = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_render"
S3_BUCKET = "${S3_BUCKET}-render"
SEARCH_INDEX_PREFIX = "render"

[[outages]]
id = "meilisearch-down"
port = 4176
url_env = "APP_SEARCH_DOWN_URL"

[outages.env]
MEILISEARCH_URL = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_search"
S3_BUCKET = "${S3_BUCKET}-search"
SEARCH_INDEX_PREFIX = "search"
CLOSURE_WAIT_SECONDS = "5"

[[outages]]
id = "short-timers"
port = 4177
url_env = "APP_SHORT_URL"

[outages.env]
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"
SEARCH_INDEX_PREFIX = "short"
CLIENT_PAGE_SECONDS = "20"
REMINDER_AFTER_SECONDS = "10"
ENQUIRY_RATE_WINDOW_SECONDS = "30"
FILE_RATE_WINDOW_SECONDS = "30"
STOCK_CACHE_SECONDS = "10"
CLOSURE_WAIT_SECONDS = "20"

[[outages]]
id = "short-session"
port = 4178
url_env = "APP_SESSION_URL"

[outages.env]
DATABASE_URL = "${DATABASE_URL}_session"
S3_BUCKET = "${S3_BUCKET}-session"
SEARCH_INDEX_PREFIX = "session"
SESSION_SECONDS = "20"

[[outages]]
id = "spare"
port = 4179
url_env = "APP_SPARE_URL"

[outages.env]
DATABASE_URL = "${DATABASE_URL}_spare"
S3_BUCKET = "${S3_BUCKET}-spare"
SEARCH_INDEX_PREFIX = "spare"

[[requirements]]
id = "DP-01"
title = "Desk access"
text = "A new desk signs up, signs in with its email and password, signs out, changes its password so that its other sessions end at once and the new password works, and the sign-in form lands on `/pieces` with a live session, with the status codes published in API."
kind = "behavior"
primary = "workflow"
workflow = "desk-access"
tests = [
    "test_app.py::test_wf_desk_access_sign_up_and_in",
    "test_app.py::test_wf_desk_access_password_change_ends_other_sessions",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Clients on one desk"
text = "The conservator creates, reads, renames and deletes a client, and a client of another desk answers 404 exactly like an unknown id in the same shape."
kind = "behavior"
primary = "pytest"
workflow = "desk-access"
tests = [
    "test_app.py::test_wf_desk_access_other_desk_is_404",
    "test_app.py::test_wf_desk_access_deleted_client_is_gone",
]
criteria = []
parameter_cases = []

