text = "The `intro` section shows the published hero copy and sculpture and carries `data-intro=\"playing\"` and then `\"done\"` at the published moment. Each published intro motion plays at its published start and length, and the page opens in the done state with reduced motion, with a hash, or with a `category` or `service` parameter."
