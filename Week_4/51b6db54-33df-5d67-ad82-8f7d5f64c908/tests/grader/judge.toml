description = "Recipe: `reduced` at 1280x800, open `/` and screenshot the hero and the area beneath it, so all stickers are seen at their settled end state. Pass: four die-cut pixel stickers taken from the hero sprite appear at different tilts, with at least one cropped by a viewport edge."

