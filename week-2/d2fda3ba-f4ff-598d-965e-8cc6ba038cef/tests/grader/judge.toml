weight = 3
description = "Recipe: `playwright` at 1280x800, signed in as the fresh judge account with Publish added and the sample case loaded, with the note 'Port Ellery fuel contracts' open and `tab \"Publish\"` showing the judge's own dossier, hop two chosen in `radiogroup \"Hop\"` and `status \"Boundary check\"` showing its match copy. 1) From the accessibility snapshot, list the node `img` names that end in outside or private. 2) Screenshot the canvas. 3) Compare each of those nodes with its drawn fill. Pass: no node whose name marks it outside or private carries any amber fill."

