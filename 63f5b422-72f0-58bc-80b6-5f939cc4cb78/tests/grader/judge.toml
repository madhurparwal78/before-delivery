weight = 3
description = "Recipe: Trace the publish code from its route to the object-storage calls for the snapshot HTML and its copied images. An in-memory map, local-disk folder or no-op stand-in that replaces object storage fails, as does recording the page live before the snapshot is read back. Cite the write, read-back and live-record calls as `file:line`. Pass: the publish code records a page live only after reading its snapshot back through a real S3-compatible client."

