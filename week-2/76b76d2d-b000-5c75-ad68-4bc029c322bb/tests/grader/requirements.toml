services = [
    { name = "postgres", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Halide Box Office <billetterie@halide.example>" } },
    { name = "killbill", env = {} },
]

[criterion_weights]
B1 = 5
B2 = 3
B3 = 5
B4 = 3
B5 = 3
B6 = 5
B7 = 5
B8 = 3
B9 = 5
