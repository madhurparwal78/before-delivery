[[requirements]]
id = "DP-57"
title = "Unreadable files are refused plainly"
text = "A CSV that is not valid UTF-8 or has an unclosed quote is refused with the published plain field message, leaves no stored file and no import run, and no error ever exposes internal details."
kind = "behavior"
primary = "pytest"
workflow = "gear-import"
