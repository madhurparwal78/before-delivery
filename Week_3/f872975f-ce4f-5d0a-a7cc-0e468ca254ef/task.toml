[task]
name = "greenfield/kerfwell"
version = "1.0.0"
description = "Kerfwell Rack: a TypeScript web app for reclaimed-timber yards that tags one-of-a-kind salvaged boards with defect zones and upright photos, prices them by board foot from dated rate versions, tracks offcut lineage with ledger-balanced corrections, lets makers fit, undo, export and import cut-list layouts on a to-scale board, hold it with a Kill Bill deposit, buy the cuts with a stored cut ticket PDF in MinIO, and keeps a paired board-volume ledger and attributed saw history in PostgreSQL."
authors = [
    { name = "Aakanksha Sharma", email = "aakanksha.sharma@ethara.ai" },
    { name = "Kaustubh Dalvi", email = "kaustubh.dalvi@ethara.ai" },
]
keywords = [
    "reclaimed timber",
    "inventory",
    "board feet",
    "cut list",
    "svg",
    "killbill",
    "minio",
    "postgres",
    "ledger",
    "lineage",
    "concurrency",
    "idempotency",
    "accessibility",
    "responsive",
    "reduced motion",
]

