description = "Recipe: `source` MCP. 1. Trace how the stage sign-off, variation PATCH and sheet upload handlers turn failures into HTTP responses. 2. Find where the published precedence (body limit, session, removed access, replay, not found, role, conflict, validation, rate limit, outage) is enforced. Handlers that build their own error JSON or reorder checks count as a fail; cite each as file:line. Pass: one shared mechanism builds every error body in the published precedence order."

