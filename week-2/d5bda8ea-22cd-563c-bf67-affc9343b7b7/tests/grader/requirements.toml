[[requirements]]
id = "DP-01"
title = "Healthy deployment"
text = "`GET /api/health` answers 200 as soon as the server listens, with `\"status\": \"ok\"` once the database answers and seeding has finished and `\"status\": \"unavailable\"` before that, and the server listens on every interface at the public port."
kind = "behavior"
primary = "pytest"
workflow = "deployment"
tests = [
    "test_app.py::test_wf_deployment_health",
]
criteria = []
parameter_cases = []

