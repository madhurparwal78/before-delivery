[[criterion]]
id = "Q5"
name = "Q5"
type = "binary"
weight = 3
description = "Recipe: search the app's own Python, Jinja, CSS and JS source for commented-out code, unused functions, routes, templates or CSS rules, unreachable branches, and features outside the brief such as payment, billing, paid tickets or ticket types, chat, translation, social or phone sign-in, or extra routes. The vendored Alpine.js file and any other shipped third-party library are not the app's own source and are excluded, including their licence comments and functions the app does not call. The `Ticket Price` field shown fixed as `Free` on the create and edit forms is required by the brief and is not a pricing feature. Any other instance counts as a defect; cite each as `file:line`. Pass: the app's own source contains no commented-out code, unused definition, unreachable branch or feature outside the brief."

