    "estate-table",
    "nearest-shop",
    "checkout",
    "stock-hold",
    "last-unit",
    "repeat-submit",
    "order-commit",
    "opening-hours",
    "fulfilment",
    "order-history",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
