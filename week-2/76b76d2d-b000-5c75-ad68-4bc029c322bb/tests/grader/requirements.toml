[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"
APP_PUBLIC_PORT = "4174"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"
APP_PUBLIC_PORT = "4175"

[[requirements]]
id = "DP-01"
title = "Season programme stage"
text = "The public programme page shows every published season, in date order, as a full-screen stage segment with its title, dates and a schedule rail whose rows give each screening's local time, auditorium code and seats left, and each row opens that screening."
kind = "behavior"
primary = "workflow"
workflow = "programme-browse"
tests = [
    "test_app.py::test_wf_programme_browse_stage",
    "test_app.py::test_wf_programme_browse_french",
]
criteria = []
parameter_cases = []

