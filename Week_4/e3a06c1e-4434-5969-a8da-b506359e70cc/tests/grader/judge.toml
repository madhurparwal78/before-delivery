[[criterion]]
id = "Q5"
name = "Q5"
type = "binary"
weight = 3
description = "Recipe: find every place the API produces an error reply - the route handlers, the auth and origin middleware, the body-limit handling and the WebSocket upgrade - then read the body each one writes. The brief publishes `{\"error\":\"<code>\",\"message\":\"<human text>\"}`, with `\"fields\"` added for validation errors. A body carrying other keys fails, and so does a reply that invents its own code where the brief names one for that endpoint; the brief names no code for an oversized body, an unsupported media type or an unexpected server fault, so a build's own code there is free, and the number of functions that write these bodies does not matter. Cite each deviation as `file:line`. Pass: every API error body is the brief's published error shape, carrying the brief's own code wherever the brief names one."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L630-L632, L1138"

[[criterion]]
id = "Q6"
name = "Q6"
type = "binary"
weight = 3
description = "Recipe: read the module, type, table and function names for sessions, segments, corrections, billable seconds, quota, plan changes, keys and idempotency records. Synonyms such as utterance, edit, credits or limit-counter for these concepts fail. The brief's own `Authorization: Token <key>` scheme and its `/join/<token>` invitation path make `token` the brief's term there, so naming after them is not a mismatch. Cite each mismatch. Pass: the brief's domain terms name every module, type, table and function for these concepts."

[criterion.annotations]
