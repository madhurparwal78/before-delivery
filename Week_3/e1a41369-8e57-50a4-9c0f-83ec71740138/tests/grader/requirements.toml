port = 4174
url_env = "APP_STORAGE_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_storagedown"

[[outages]]
id = "short-timers"
port = 4175
url_env = "APP_SHORT_URL"

[outages.env]
UNDO_WINDOW_SECONDS = "3"
QUEST_INVITE_SECONDS = "5"
CHAT_MAX_PER_MINUTE = "2"
PARTY_MAX_MEMBERS = "2"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

