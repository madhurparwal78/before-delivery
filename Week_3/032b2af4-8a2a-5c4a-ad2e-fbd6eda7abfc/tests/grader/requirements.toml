[[requirements]]
id = "DP-01"
title = "Sign up with email."
text = "`POST /api/auth/signup` with a valid email, a name of one to eighty characters and a password of at least eight characters returns `201` with a working token, refuses invalid fields with `400` naming each one and a registered email with `409` `email_taken`, and the signup page marks invalid fields inline."
kind = "behavior"
primary = "pytest"
workflow = "athlete-signup-and-session"
tests = [
    "test_app.py::test_signup_returns_token_and_athlete",
    "test_app.py::test_signup_invalid_fields_refused",
    "test_app.py::test_signup_duplicate_email_conflict",
    "test_app.py::test_signup_page_shows_inline_errors",
    "test_app.py::test_signup_page_meets_wcag_aa",
    "test_app.py::test_signup_page_renders_own_web_font",
]
criteria = []
parameter_cases = []

