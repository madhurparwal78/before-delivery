[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: Read the server's configuration loading and each provider client (database, Kill Bill, SMTP mail, S3 object storage, PocketBase), then search all server source for literal hosts, URLs, service ports, usernames, passwords, API keys and secrets. A default app port of 4173 is allowed because the brief documents it. Any literal service URL, host or credential, including one used as a fallback when the environment value is missing, fails; cite each as file:line. Pass: every service URL and credential the brief lists under Configuration is read from the environment when the server starts."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L87, L705, L708-L720"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 3
description = "Recipe: Read the browser entry point and every module it imports, plus any server code that renders HTML, injects runtime config into pages or serialises config into API responses, and search them for the environment variable names the brief lists under Configuration. Any browser-side reference or any page or response that carries one of those values fails; cite each as file:line. Pass: no browser-side source and no server-rendered page or API response carries a service URL or credential."

[criterion.annotations]
channel = "source"
