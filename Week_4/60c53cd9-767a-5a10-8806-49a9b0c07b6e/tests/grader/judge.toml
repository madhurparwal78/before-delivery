description = "Recipe: search the non-test source, scripts and committed files for string literals shaped like a datastore URL with host, an access key, a secret or a password, and for logging calls that print a credential or a service URL, including a raw datastore or search connection error that carries the service host, port or user. A log line that prints only the listening port of the app is not such a call. Pass: none is hard-coded or logged, other than the seeded demo account passwords (which must be stored hashed) and the documented defaults."

