description = "Recipe: Search the source for interfaces, abstract or base classes, factories, registries and helper functions. Count the implementations of each, and check whether any function body only forwards its arguments to another call. An abstraction with exactly one implementation, or a wrapper that only forwards, fails. Cite each as `file:line`. Pass: No abstraction in the source has a single implementation or only forwards its call."

