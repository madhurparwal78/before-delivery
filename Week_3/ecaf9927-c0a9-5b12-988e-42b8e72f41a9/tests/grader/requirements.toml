]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-05"
title = "Constraint ranks and redundancy"
text = "Each accepted constraint lowers slack by the freedom it actually removes, and a consistent constraint that removes none is accepted and marked redundant."
kind = "behavior"
primary = "pytest"
workflow = "sketch-constrain"
tests = [
    "test_app.py::test_constraint_rank_and_redundancy",
