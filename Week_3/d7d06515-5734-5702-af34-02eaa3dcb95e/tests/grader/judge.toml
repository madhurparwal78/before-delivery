cites = "L939, L1129-L1131, L1563"

[[criterion]]
id = "Q1"
name = "Q1"
type = "binary"
weight = 5
description = "Recipe: for the version check, link status, trace transitions, layer refusals, export state, trial days left and geometry values, find the function that decides each, then search server and frontend for a second place that decides it again (a repeated base_version comparison, repeated status strings, repeated layer refusal order, a recomputed derived value). Values shown from the pointer position while a grip drag is in progress are allowed. Any rule decided in a second place fails, so cite each as `file:line`. Pass: each named domain rule has exactly one implementation that every caller uses."

[criterion.annotations]
channel = "quality"
