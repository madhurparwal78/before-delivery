text = "Every shipped package and bundled font uses one of MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD, BlueOak-1.0.0, CC0-1.0, Unlicense, OFL-1.1, LGPL-3.0-only or LGPL-3.0-or-later."
tests = [
    "test_app.py::test_if_licences",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "The app stores data only in Postgres and the MinIO bucket: no SQLite, Redis, other databases, in-process stores shared across requests as a source of truth, or app data written to local files."
tests = [
    "test_app.py::test_if_storage_only_postgres_minio",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "The provided service configuration and compose files stay unchanged."
tests = [
    "test_app.py::test_if_service_config_unchanged",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "/app/package-lock.json is committed and matches package.json."
tests = [
    "test_app.py::test_if_package_lock",
]
parameter_cases = []

[[if_rules]]
id = "IF-07"
text = "The browser loads no fonts, scripts or styles from any third-party host."
tests = [
    "test_app.py::test_if_no_third_party_assets",
]
parameter_cases = []

