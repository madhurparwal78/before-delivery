description = "Recipe: read the server's configuration module and every place that builds the Postgres pool, the S3 client and the SMTP transport, citing each literal found as file:line. Pass: every database, S3, SMTP and MAIL_FROM value comes from process.env at start, with no connection string, access key, secret, bucket name, SMTP host or From address hard-coded in server source, where the documented default port 4173 for APP_PUBLIC_PORT is allowed."

