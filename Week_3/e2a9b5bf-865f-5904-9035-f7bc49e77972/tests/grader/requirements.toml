schema_version = 1
id_prefix = "DP"
mandatory_count = 99
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "account-and-kit",
    "optics-readout",
    "field-swap",
    "sketching",
    "offline-night",
    "sync-replay",
    "object-history",
    "program-progress",
    "packet-check",
    "packet-render",
    "packet-send",
    "service-outages",
    "edit-after-send",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "S4",
    "S5",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 90
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "minio", env = {} },
    { name = "gotenberg", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Lowlamp Field Log <packets@lowlamp.test>" } },
]

[criterion_weights]
B1 = 3
B2 = 5
B3 = 3
B4 = 3
B5 = 3
B6 = 5
B7 = 3
B8 = 5
B9 = 5
B10 = 3
B11 = 5
B12 = 3
S1 = 5
S2 = 5
S3 = 3
S4 = 3
S5 = 3
Q1 = 3
Q2 = 5
Q3 = 5
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "gotenberg-down"
port = 4174
url_env = "APP_GOTENBERG_DOWN_URL"

[outages.env]
GOTENBERG_URL = "http://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[outages]]
id = "minio-down"
port = 4176
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "short-lock"
port = 4177
url_env = "APP_SHORT_LOCK_URL"

[outages.env]
SIGNIN_LOCK_SECONDS = "20"
SIGNIN_SESSION_SECONDS = "30"

[[outages]]
id = "minio-refusing"
port = 4178
url_env = "APP_MINIO_REFUSING_URL"

[outages.env]
S3_SECRET_ACCESS_KEY = "wrong-secret"

[[outages]]
id = "mailpit-silent"
port = 4179
url_env = "APP_MAILPIT_SILENT_URL"

[outages.env]
SMTP_PORT = "8025"

[[outages]]
id = "gotenberg-erroring"
port = 4180
url_env = "APP_GOTENBERG_ERRORING_URL"

[outages.env]
GOTENBERG_URL = "${S3_ENDPOINT}"

[[requirements]]
id = "DP-01"
title = "Observer accounts"
text = "Observers sign up, sign in and sign out with a password and an email that is compared trimmed and lowercased, a sign-in session ends after its published lifetime, and every observer route except health, sign-up and sign-in answers 401 without a signed-in session, as specified in API."
kind = "behavior"
primary = "pytest"
workflow = "account-and-kit"
tests = [
    "test_app.py::test_accounts_email_normalised_and_routes_guarded",
    "test_app.py::test_signin_session_ends_after_its_lifetime",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Kit in millimetres or inches"
text = "Telescopes, eyepieces and Barlows are added to the observer's own kit, with telescope aperture accepted in millimetres or inches and stored in millimetres by the published conversion and ranges."
kind = "behavior"
primary = "pytest"
workflow = "account-and-kit"
tests = [
    "test_app.py::test_kit_conversion_ranges_and_order",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Setting up a kit"
text = "A newly signed-up observer adds a telescope in inches, an eyepiece and a Barlow on the Kit screen, sees the millimetre equivalent update while typing, and finds all three listed and offered in the session optics pickers."
kind = "behavior"
primary = "workflow"
workflow = "account-and-kit"
tests = [
    "test_app.py::test_wf_account_and_kit_setup",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Derived optics values and orientation"
text = "The server derives magnification, true field, exit pupil, aperture and orientation from the chosen telescope, eyepiece, optional Barlow and train with the published formulas, rounding and train table, and stores them on the session and the observation."
kind = "behavior"
primary = "pytest"
workflow = "optics-readout"
tests = [
    "test_app.py::test_derived_optics_stored_on_session_and_observation",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-05"
title = "Live optics readout"
text = "Changing any optics picker updates the Optics readout in place with the published readout line before anything is saved, with no reload or submit."
kind = "behavior"
primary = "pytest"
workflow = "optics-readout"
tests = [
    "test_app.py::test_live_readout_follows_each_picker_before_saving",
    "test_app.py::test_wf_optics_readout_keyboard_swaps",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-06"
title = "Choosing optics at the scope"
text = "The observer starts a session, picks telescope, eyepiece, Barlow and train, watches the readout follow each pick, and finds the same values saved on the session by the server."
kind = "behavior"
primary = "workflow"
workflow = "optics-readout"
tests = [
    "test_app.py::test_wf_optics_readout_choosing_saved_by_server",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-07"
title = "Field swap numerals"
