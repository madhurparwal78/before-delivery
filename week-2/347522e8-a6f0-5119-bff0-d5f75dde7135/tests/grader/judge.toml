description = "Recipe: read the server configuration module and every file that opens a Postgres pool, a Kill Bill client, an SMTP transport or an S3 client, then search the whole source for hostnames, `http://`, ports, usernames, passwords, API keys and secrets. Documented defaults (port 4173, hold TTL 600, scan 60, outbox retry 30 seconds) are allowed. A literal service host, URL or credential, including as a fallback, fails; cite each as `file:line`. Pass: no service URL, hostname or credential named in Configuration and secrets appears as a literal in source."

