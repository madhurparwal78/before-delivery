requirements = []
evidence = "file_line"
cites = "L493-L498, L836-L838, L1040, L1045-L1046, L1075"

[[criterion]]
id = "Q7"
name = "Q7"
type = "binary"
weight = 3
description = "Recipe: search the source for `process.env` reads and for hard-coded hosts, ports, connection strings, secrets or retention periods. The documented defaults (port 4173 and idempotency retention 86400 seconds), the bind host `0.0.0.0` the brief requires, and the seed fixture values the brief fixes (such as the seeded password `deku-demo-pw-2026`, organization and app ids) are allowed. Any other configuration source, such as a config file, a hard-coded database URL or an undocumented variable, is a defect. Cite each as `file:line`. Pass: configuration comes only from `DATABASE_URL`, `APP_PUBLIC_URL`, `APP_PUBLIC_PORT` and `CORVO_IDEMPOTENCY_RETENTION_SECONDS`."

