description = "Credwell, the accredited nursing continuing-education platform of Sorrel & Pike Learning: self-paced and live-cohort courses, effective-dated hospital tuition coverage with co-paid checkout, prepaid seat packs on a paired seat ledger, a module player and post-evaluation, contact-hour certificates sealed into versioned PDFs with the Seal press, revocable expiring verification links, attributed refund decisions, and hospital compliance exports, backed by Postgres, Kill Bill, MinIO and Mailpit."
