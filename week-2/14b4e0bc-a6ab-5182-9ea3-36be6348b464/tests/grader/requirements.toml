[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "evidence-down"
port = 4174
url_env = "APP_EVIDENCE_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "mail-down"
port = 4175
url_env = "APP_MAIL_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[outages]]
id = "both-down"
port = 4176
url_env = "APP_BOTH_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[outages]]
id = "isolated-mail-down"
port = 4177
url_env = "APP_ISOLATED_MAIL_DOWN_URL"

[outages.env]
DATABASE_URL = "${DATABASE_URL}_isolated"
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[requirements]]
id = "DP-01"
title = "Sign in and session"
text = "Each seeded person signs in with email and password and gets a new session that replaces any session the browser already held, a wrong password answers 401 with the published copy, and the database stores no session token or password in readable form."
kind = "behavior"
primary = "pytest"
workflow = "access-admin"
tests = [
    "test_app.py::test_session_signin_and_storage",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Server-enforced roles"
text = "Every API route and every activity stream enforces the published role rules on the server, so a refused request answers 403 and leaves state, the evidence store and the audit log unchanged whatever the interface shows."
kind = "behavior"
primary = "pytest"
workflow = "access-admin"
tests = [
    "test_app.py::test_server_enforced_roles",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "User and role administration"
text = "An Admin lists users, creates a user with a role and changes another user's role, which applies to that user's next request; changing your own role or resetting your own password answers 409."
kind = "behavior"
primary = "pytest"
workflow = "access-admin"
tests = [
    "test_app.py::test_user_and_role_administration",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Ingested lineage reaches open views"
text = "Within 3 seconds of another person's lineage write, an open live canvas or hop list adds each new edge and node in place with the published attributes and removes each removed edge, keeping every other node's lit, drawn and hop state, the sweep counter and Trace summary; Lineage status announces the lineage-changed copy once; a chosen node stays chosen across a breakpoint crossing; non-Latin labels wrap inside their nodes; and a newly registered asset matching an open search joins its results with the new count announced once, as set out in Interactions and Motion and effects."
kind = "behavior"
primary = "pytest"
workflow = "lineage-ingest"
tests = [
    "test_app.py::test_wf_lineage_ingest_live_edge",
    "test_app.py::test_wf_lineage_ingest_search_join",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-05"
title = "Live audit rows keep the reading position"
text = "While an Admin has scrolled the Audit log's first row out of view, rows committed on any instance are held behind a Show <n> new audit rows button that counts in place and is announced once, the rows in view stay within 2 pixels of their place, and pressing the button inserts the held rows in strictly descending, contiguous seq and focuses the first row's Seq link, at every published viewport, as set out in Interactions."
kind = "behavior"
primary = "pytest"
workflow = "live-activity"
tests = [
    "test_app.py::test_wf_live_activity_held_rows",
    "test_app.py::test_wf_live_activity_held_rows_phone",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-06"
title = "Bulk tag apply with undo"
text = "A Steward or Admin applies one tag to several selected Columns rows in one request that reports a per-row outcome and applies the tag wherever allowed, the published count is announced once, the request honours an Idempotency-Key, and one Undo restores those rows' exact direct tags as one audit row or is refused with the published message, as qualified in API."
kind = "behavior"
primary = "pytest"
workflow = "tag-propagation"
tests = [
    "test_app.py::test_bulk_apply_and_undo",
    "test_app.py::test_wf_tag_propagation_bulk_undo",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-07"
title = "Password reset ends sessions"
text = "An Admin's password reset of another person replaces their password and ends every session they hold in the same request, so their next request, even an exact Idempotency-Key replay, answers 401, their streams close and their open screens reach the sign-in screen within 5 seconds."
kind = "behavior"
primary = "pytest"
workflow = "access-admin"
tests = [
    "test_app.py::test_password_reset_ends_every_session",
    "test_app.py::test_wf_access_admin_password_reset",
]
criteria = []
parameter_cases = []

