weight = 5
description = "Recipe: from the server entrypoint, find where every setting listed under Configuration and secrets is read, and trace each construction of the database, object storage and mail clients, citing each literal found as file:line. The brief's documented defaults (port 4173, the base URL built from the port, the documented sender address and the five lifetime defaults) are allowed. Pass: every service address, credential and connection string comes from the environment read at start, with no other literal value in source."

