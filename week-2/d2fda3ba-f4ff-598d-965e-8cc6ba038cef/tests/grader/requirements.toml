]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-07"
title = "Revision push and pull"
text = "A push based on the current head records the vault's next revision number and stores its blob under the key pattern from Services, and every vault member pulls revisions in revision order."
kind = "behavior"
primary = "pytest"
workflow = "field-sync"
tests = [
