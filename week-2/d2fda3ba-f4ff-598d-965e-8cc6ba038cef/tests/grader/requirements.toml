[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "killbill-down"
port = 4175
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[requirements]]
id = "DP-01"
title = "Accounts with a home time zone"
text = "Creating an account records email, display name, password and an IANA time zone, signs the browser in as the account's first approved device, and answers the errors listed in API."
kind = "behavior"
primary = "pytest"
workflow = "account-devices"
tests = [
    "test_app.py::test_accounts_create_and_errors",
    "test_app.py::test_wf_account_devices_create_account",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "New-device approval email"
text = "Signing in from a new device on an account that already has an approved device sends one approval email to the account address, carrying the approval link and no note titles or note text."
kind = "behavior"
primary = "pytest"
workflow = "account-devices"
tests = [
    "test_app.py::test_new_device_approval_email",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Unapproved devices pull nothing"
text = "Until its approval link is used, a device is refused every vault key, revision list, blob and history request, and the approval link stops working after the expiry set in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "account-devices"
tests = [
    "test_app.py::test_unapproved_device_refused",
    "test_app.py::test_device_approval_link_expires",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Second-device sign-in journey"
text = "An investigator signs in on a second browser, sees the waiting-for-approval state, approves from the email, sees the Unlock vault dialog within the approval detection delay from Business rules, and after entering the vault passphrase sees the vault's notes within the unlock delay from Business rules."
kind = "behavior"
primary = "workflow"
workflow = "account-devices"
tests = [
    "test_app.py::test_wf_account_devices_second_device",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-05"
title = "Local notebook without an account"
text = "Without signing in, a person creates, links and reopens notes that persist in the browser across reloads, including with the network off after the first load, and the Backlinks tab lists every note that links to the open note."
kind = "behavior"
primary = "workflow"
workflow = "field-sync"
tests = [
