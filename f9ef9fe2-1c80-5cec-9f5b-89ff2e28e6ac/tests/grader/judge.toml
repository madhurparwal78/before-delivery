description = "Recipe: `playwright` at 1280x800. 1) Signed in as Dana, open the Rates screen. 2) In `form \"New rate card\"`, fill every field validly from the brief's seed terms: Effective from a date 30 days after today, Tier 2 to Tier 4 hourly rates `29.50`, `27.25` and `25.00`, each station's surcharge with its seed surcharge from the station table, Cancellation window (hours) `48` and Pack price `560.00`. 3) Enter `32.005` as the Tier 1 hourly rate, an amount every input type accepts but that is not dollars and cents, and press `button \"Add rate card\"`. Nothing is created. 4) Screenshot the form. 5) Probe the colours of the field error, the invalid field and its label, the form status region and the other text and controls on the page. Coral on the invalid field, its own label, its error text or the error copy in the form status region marks the error and is allowed. A browser's own validation bubble is not an app element, so if it blocks the submit, judge the page's colours as they stand. Pass: no heading, button, rule, valid field's label or other chrome unrelated to the error is coral."

