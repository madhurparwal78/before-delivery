weight = 5
description = "Recipe: `source` MCP. 1) Read the browser app source and its build configuration, including any compile-time define or environment prefix setting. 2) Read every API response serializer. 3) Read the server logging calls. 4) Cite each leak as `file:line`. Pass: no service URL, credential or environment-derived secret reaches browser code, a response body or a full log line."

