services:
  main:
    environment:
      FLAN_GRADE_KEY: flan-grading-77e0e9c372883912
      APP_PUBLIC_PORT: '4173'
      APP_PUBLIC_URL: http://127.0.0.1:4173
      DATABASE_URL: postgresql://gf_app:gf-app-dev-2b7d41@postgres:5432/gf_dev
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: gf-dev
      S3_FORCE_PATH_STYLE: 'true'
      S3_ACCESS_KEY_ID: gf-dev-root-71c3e0
      S3_SECRET_ACCESS_KEY: gf-dev-secret-4b8d92
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: gf-dev
      AUTH_ISSUER_URL: http://keycloak:8080/realms/gf-dev
      AUTH_CLIENT_ID: app
      AUTH_CLIENT_SECRET: gf-kc-app-dev-5e93c1a8
      WIREMOCK_URL: http://wiremock:8080
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      postgres-seed:
        condition: service_completed_successfully
      minio-seed:
        condition: service_completed_successfully
      keycloak-seed:
        condition: service_completed_successfully
      wiremock:
        condition: service_healthy
  postgres:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_USER: gf_admin
      POSTGRES_PASSWORD: gf-admin-dev-9e4a02
      POSTGRES_DB: postgres
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U gf_admin -d postgres
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  postgres-seed:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      PGHOST: postgres
      PGUSER: gf_admin
      PGPASSWORD: gf-admin-dev-9e4a02
      PGDATABASE: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - |
      psql -Atqc "SELECT 1 FROM pg_roles WHERE rolname = 'gf_app'" | grep -q 1 ||
        psql -qc "CREATE ROLE gf_app LOGIN PASSWORD 'gf-app-dev-2b7d41'"
      psql -Atqc "SELECT 1 FROM pg_database WHERE datname = 'gf_dev'" | grep -q 1 ||
        psql -qc "CREATE DATABASE gf_dev OWNER gf_app"
  minio:
    image: coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    environment:
      MINIO_ROOT_USER: gf-dev-root-71c3e0
      MINIO_ROOT_PASSWORD: gf-dev-secret-4b8d92
    command: server /data
    healthcheck:
      test:
      - CMD-SHELL
      - MC_HOST_local=http://$$MINIO_ROOT_USER:$$MINIO_ROOT_PASSWORD@localhost:9000 mc ready local >/dev/null
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  minio-seed:
    image: coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    environment:
      MINIO_ROOT_USER: gf-dev-root-71c3e0
      MINIO_ROOT_PASSWORD: gf-dev-secret-4b8d92
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - |
      export MC_HOST_local="http://$$MINIO_ROOT_USER:$$MINIO_ROOT_PASSWORD@minio:9000"
      mc mb --ignore-existing local/gf-dev
      mc anonymous set none local/gf-dev
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7@sha256:4388e2379b7e870a447adbe7b80bd61f5fbf04e925832b19669fda4957f05a81
    command:
    - start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: gf-kc-dev-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: gf-kc-dev-7d20b9e4
      KC_HEALTH_ENABLED: 'true'
    healthcheck:
      test:
      - CMD-SHELL
      - exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && timeout 5 cat <&3
        | grep -q UP
      interval: 5s
      timeout: 10s
      retries: 36
      start_period: 30s
  keycloak-seed:
    image: quay.io/keycloak/keycloak:26.0.7@sha256:4388e2379b7e870a447adbe7b80bd61f5fbf04e925832b19669fda4957f05a81
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: gf-kc-dev-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: gf-kc-dev-7d20b9e4
    depends_on:
      keycloak:
        condition: service_healthy
    restart: 'no'
    entrypoint:
    - /bin/bash
    - -ec
    command:
    - |
      kc=/opt/keycloak/bin/kcadm.sh
      $$kc config credentials --server http://keycloak:8080 --realm master \
        --user "$$KC_BOOTSTRAP_ADMIN_USERNAME" --password "$$KC_BOOTSTRAP_ADMIN_PASSWORD"
      $$kc get realms/gf-dev >/dev/null 2>&1 && exit 0
      $$kc create realms -s realm=gf-dev -s enabled=true -s sslRequired=none -s registrationAllowed=true
      $$kc create clients -r gf-dev -s clientId=app -s secret=gf-kc-app-dev-5e93c1a8 \
        -s publicClient=false -s standardFlowEnabled=true -s directAccessGrantsEnabled=true \
        -s serviceAccountsEnabled=true -s 'redirectUris=["*"]' -s 'webOrigins=["+"]'
      $$kc add-roles -r gf-dev --uusername service-account-app --cclientid realm-management \
        --rolename manage-users --rolename view-users --rolename query-users \
        --rolename manage-realm --rolename view-realm
  wiremock:
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    entrypoint:
    - sh
    - -c
    - if [ -n "$$WIREMOCK_STUBS" ]; then printf '%s' "$$WIREMOCK_STUBS" > /home/wiremock/mappings/baseline.json;
      fi; exec /docker-entrypoint.sh --port 8080 --disable-banner --max-request-journal-entries 20000 --admin-api-basic-auth
      gfkit-admin:gfkit-dev
    healthcheck:
      test:
      - CMD
      - curl
      - -sf
      - -u
      - gfkit-admin:gfkit-dev
      - http://127.0.0.1:8080/__admin/health
      interval: 2s
      timeout: 5s
      retries: 60
    environment:
      WIREMOCK_STUBS: '{"mappings": [{"request": {"method": "GET", "queryParameters": {"reference": {"equalTo":
        "ALD-A"}}, "urlPath": "/catalog/varieties"}, "response": {"headers": {"Content-Type": "application/json"},
        "jsonBody": {"image_path": "/catalog/images/ALD-A.svg", "issue": "Aldmere crown, 1911", "mintmark": "A",
        "reference": "ALD-A", "revision": 1}, "status": 200}}, {"request": {"method": "GET", "queryParameters":
        {"reference": {"equalTo": "ALD-K"}}, "urlPath": "/catalog/varieties"}, "response": {"headers": {"Content-Type":
        "application/json"}, "jsonBody": {"image_path": "/catalog/images/ALD-K.svg", "issue": "Aldmere crown, 1911",
        "mintmark": "K", "reference": "ALD-K", "revision": 1}, "status": 200}}, {"request": {"method": "GET", "queryParameters":
        {"reference": {"equalTo": "ALD-O"}}, "urlPath": "/catalog/varieties"}, "response": {"headers": {"Content-Type":
        "application/json"}, "jsonBody": {"image_path": "/catalog/images/ALD-O.svg", "issue": "Aldmere crown, 1911",
        "mintmark": "O", "reference": "ALD-O", "revision": 1}, "status": 200}}, {"priority": 10, "request": {"method":
        "GET", "urlPath": "/catalog/varieties"}, "response": {"headers": {"Content-Type": "application/json"}, "jsonBody":
        {"error": "unknown_reference"}, "status": 404}}, {"request": {"method": "GET", "queryParameters": {"set":
        {"equalTo": "ALD-CROWN"}}, "urlPath": "/catalog/albums"}, "response": {"headers": {"Content-Type": "application/json"},
        "jsonBody": {"holes": [{"label": "Mint A", "mintmark": "A", "reference": "ALD-A"}, {"label": "Mint K", "mintmark":
        "K", "reference": "ALD-K"}, {"label": "Mint O", "mintmark": "O", "reference": "ALD-O"}], "revision": 1,
        "set": "ALD-CROWN", "title": "Aldmere crown mints"}, "status": 200}}, {"request": {"method": "GET", "urlPath":
        "/catalog/images/ALD-A.svg"}, "response": {"body": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0
        0 1000 1000\" width=\"1000\" height=\"1000\"><rect width=\"1000\" height=\"1000\" fill=\"#d9d6cf\"/><circle
        cx=\"500\" cy=\"500\" r=\"430\" fill=\"#b8b2a6\" stroke=\"#6d675c\" stroke-width=\"40\"/><circle cx=\"500\"
        cy=\"500\" r=\"360\" fill=\"none\" stroke=\"#8a8478\" stroke-width=\"6\"/><text x=\"600\" y=\"400\" font-family=\"serif\"
        font-size=\"90\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"#4a463e\">A</text><text x=\"500\"
        y=\"640\" font-family=\"serif\" font-size=\"60\" text-anchor=\"middle\" fill=\"#4a463e\">ALDMERE</text></svg>",
        "headers": {"Content-Type": "image/svg+xml"}, "status": 200}}, {"request": {"method": "GET", "urlPath":
        "/catalog/images/ALD-K.svg"}, "response": {"body": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0
        0 1000 1000\" width=\"1000\" height=\"1000\"><rect width=\"1000\" height=\"1000\" fill=\"#d9d6cf\"/><circle
        cx=\"500\" cy=\"500\" r=\"430\" fill=\"#b8b2a6\" stroke=\"#6d675c\" stroke-width=\"40\"/><circle cx=\"500\"
        cy=\"500\" r=\"360\" fill=\"none\" stroke=\"#8a8478\" stroke-width=\"6\"/><text x=\"600\" y=\"400\" font-family=\"serif\"
        font-size=\"90\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"#4a463e\">K</text><text x=\"500\"
        y=\"640\" font-family=\"serif\" font-size=\"60\" text-anchor=\"middle\" fill=\"#4a463e\">ALDMERE</text></svg>",
        "headers": {"Content-Type": "image/svg+xml"}, "status": 200}}, {"request": {"method": "GET", "urlPath":
        "/catalog/images/ALD-O.svg"}, "response": {"body": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0
        0 1000 1000\" width=\"1000\" height=\"1000\"><rect width=\"1000\" height=\"1000\" fill=\"#d9d6cf\"/><circle
        cx=\"500\" cy=\"500\" r=\"430\" fill=\"#b8b2a6\" stroke=\"#6d675c\" stroke-width=\"40\"/><circle cx=\"500\"
        cy=\"500\" r=\"360\" fill=\"none\" stroke=\"#8a8478\" stroke-width=\"6\"/><text x=\"600\" y=\"400\" font-family=\"serif\"
        font-size=\"90\" text-anchor=\"middle\" dominant-baseline=\"central\" fill=\"#4a463e\">O</text><text x=\"500\"
        y=\"640\" font-family=\"serif\" font-size=\"60\" text-anchor=\"middle\" fill=\"#4a463e\">ALDMERE</text></svg>",
        "headers": {"Content-Type": "image/svg+xml"}, "status": 200}}]}'
x-minio-root:
  MINIO_ROOT_USER: gf-dev-root-71c3e0
  MINIO_ROOT_PASSWORD: gf-dev-secret-4b8d92
x-kc-admin:
  KC_BOOTSTRAP_ADMIN_USERNAME: gf-kc-dev-admin
  KC_BOOTSTRAP_ADMIN_PASSWORD: gf-kc-dev-7d20b9e4
