[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_kbdown"
S3_BUCKET = "${S3_BUCKET}-kbdown"

[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_s3down"
S3_BUCKET = "${S3_BUCKET}-s3down"

[[outages]]
id = "short-timer"
port = 4176
url_env = "APP_SHORT_URL"

[outages.env]
LINEBOARD_HOLD_TTL_SECONDS = "20"
LINEBOARD_NO_SHOW_GRACE_SECONDS = "60"
LINEBOARD_SWEEP_SECONDS = "300"
LINEBOARD_SIGNIN_WINDOW_SECONDS = "60"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
id = "DP-01"
title = "Role sessions"
text = "Each seeded person signs in with email and password and gets a fresh server-side session whose role (operator, shift lead or member) decides which screens and endpoints they reach, and signing out ends that session on the server for every copy of its cookie, as set out in API."
kind = "behavior"
primary = "pytest"
workflow = "sessions-and-tenancy"
tests = [
    "test_app.py::test_session_roles",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Kitchen-scoped records"
text = "Every record, list and lookup is limited to the signed-in person's kitchen, and an id from another kitchen answers 404 exactly as an unknown id does."
kind = "behavior"
primary = "pytest"
workflow = "sessions-and-tenancy"
tests = [
    "test_app.py::test_kitchen_scoped_ids",
]
criteria = []
parameter_cases = []

