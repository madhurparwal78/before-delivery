services:
  main:
    extra_hosts:
    - host.docker.internal:host-gateway
    security_opt:
    - seccomp=unconfined
    - systempaths=unconfined
    - apparmor=unconfined
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      killbill:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      wiremock:
        condition: service_healthy
  postgres:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_USER: gf_admin
      POSTGRES_PASSWORD: gf-admin-5c1e8a37
      POSTGRES_DB: postgres
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U gf_admin -d postgres
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  minio:
    image: coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    environment:
      MINIO_ROOT_USER: gf-root-6d29b4
      MINIO_ROOT_PASSWORD: gf-root-secret-a83f17c5
    command: server /data
    healthcheck:
      test:
      - CMD-SHELL
      - MC_HOST_local=http://gf-root-6d29b4:gf-root-secret-a83f17c5@localhost:9000 mc ready local >/dev/null
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  killbill-db:
    image: killbill/mariadb:0.24@sha256:8fddf7d564befcea3e3d762c01b3e65fb4b45fb8db077297998ad935468372fa
    environment:
      MYSQL_ROOT_PASSWORD: killbill
    healthcheck:
      test:
      - CMD-SHELL
      - mariadb-admin ping -h 127.0.0.1 -uroot -pkillbill --silent
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
  killbill:
    image: killbill/killbill:0.24.21@sha256:e6b6ab4a0e6287ebf57aafa2d5f22cfa6250dfa056682c74d7c208b4a39d0c9b
    environment:
      KB_org_killbill_dao_url: jdbc:mysql://killbill-db:3306/killbill
      KB_org_killbill_dao_user: root
      KB_org_killbill_dao_password: killbill
      KB_org_killbill_billing_osgi_dao_url: jdbc:mysql://killbill-db:3306/killbill
      KB_org_killbill_billing_osgi_dao_user: root
      KB_org_killbill_billing_osgi_dao_password: killbill
      KB_ADMIN_PASSWORD: password
    depends_on:
      killbill-db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS -o /dev/null http://127.0.0.1:8080/1.0/healthcheck
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s
  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    healthcheck:
      test:
      - CMD
      - /mailpit
      - readyz
      interval: 2s
      timeout: 5s
      retries: 30
  wiremock:
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    entrypoint:
    - sh
    - -c
    - if [ -n "$$WIREMOCK_STUBS" ]; then printf '%s' "$$WIREMOCK_STUBS" > /home/wiremock/mappings/baseline.json;
      fi; exec /docker-entrypoint.sh --port 8080 --disable-banner --max-request-journal-entries 20000 --admin-api-basic-auth
      gfkit-admin:gfkit-wm-4fce2a657cbe2442
    healthcheck:
      test:
      - CMD
      - curl
      - -sf
      - -u
      - gfkit-admin:gfkit-wm-4fce2a657cbe2442
      - http://127.0.0.1:8080/__admin/health
      interval: 2s
      timeout: 5s
      retries: 60
    environment:
      WIREMOCK_STUBS: '{"mappings": [{"priority": 1, "request": {"method": "GET", "queryParameters": {"postcode_area":
        {"equalTo": "ZE"}}, "urlPath": "/v1/carriage/quote"}, "response": {"fixedDelayMilliseconds": 2500, "jsonBody":
        {"band": "S3", "charge_minor": 695, "currency": "GBP", "valid_until": "2030-12-31T23:59:59Z"}, "status":
        200}}, {"priority": 1, "request": {"method": "GET", "queryParameters": {"postcode_area": {"equalTo": "IV"}},
        "urlPath": "/v1/carriage/quote"}, "response": {"fixedDelayMilliseconds": 5000, "jsonBody": {"band": "S2",
        "charge_minor": 395, "currency": "GBP", "valid_until": "2030-12-31T23:59:59Z"}, "status": 200}}, {"priority":
        1, "request": {"method": "GET", "queryParameters": {"postcode_area": {"equalTo": "HS"}}, "urlPath": "/v1/carriage/quote"},
        "response": {"status": 500}}, {"priority": 1, "request": {"method": "GET", "queryParameters": {"postcode_area":
        {"equalTo": "KW"}}, "urlPath": "/v1/carriage/quote"}, "response": {"body": "not json", "headers": {"Content-Type":
        "application/json"}, "status": 200}}, {"priority": 2, "request": {"method": "GET", "queryParameters": {"longest_side_mm":
        {"matches": "^[1-9][0-9]{3,}$$"}}, "urlPath": "/v1/carriage/quote"}, "response": {"jsonBody": {"band": "L1",
        "charge_minor": 2450, "currency": "GBP", "valid_until": "2030-12-31T23:59:59Z"}, "status": 200}}, {"priority":
        3, "request": {"method": "GET", "urlPath": "/v1/carriage/quote"}, "response": {"jsonBody": {"band": "S2",
        "charge_minor": 395, "currency": "GBP", "valid_until": "2030-12-31T23:59:59Z"}, "status": 200}}]}'
