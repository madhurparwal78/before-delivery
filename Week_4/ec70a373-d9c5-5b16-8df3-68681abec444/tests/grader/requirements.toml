text = "/app/THIRD_PARTY_NOTICES.md lists every shipped package with its version and licence; shipped packages are the production dependency tree reported by npm ls --omit=dev --all --json, plus the bundled fonts."
tests = [
    "test_app.py::test_if_third_party_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Every shipped package (as defined in IF-02) is licensed under MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD or BlueOak-1.0.0, and every font under OFL-1.1."
tests = [
    "test_app.py::test_if_licences",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "The app stores data only in PostgreSQL, Kill Bill and the S3 bucket, with no SQLite, no Redis, no in-memory store standing in for the database (sessions, throttles and idempotency records included), and no files on disk as a datastore."
tests = [
    "test_app.py::test_if_datastores",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "The provided development service configuration and its seeded credentials are left unchanged."
tests = [
    "test_app.py::test_if_service_config",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "Fonts and icons are bundled and served by the app, and the built pages load nothing from third-party hosts."
tests = [
    "test_app.py::test_if_no_third_party_hosts",
]
parameter_cases = []

[[if_rules]]
id = "IF-07"
text = "Application source, server and client, is written in TypeScript; the only JavaScript files are build output and tool configuration."
tests = [
    "test_app.py::test_if_typescript_only",
]
parameter_cases = []

