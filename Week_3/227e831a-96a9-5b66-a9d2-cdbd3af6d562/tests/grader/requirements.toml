[[requirements]]
id = "DP-53"
title = "Live workspace figures"
text = "After every pack, unpack, quantity or carry-mode change, each available-gear row's left count, the pack list's category headings, the strata band labels and the collapsed summary update in place without a reload and without moving focus, and the Trips base weight matches the server the next time Trips is shown, also after a resumed or chained change."
kind = "behavior"
primary = "pytest"
