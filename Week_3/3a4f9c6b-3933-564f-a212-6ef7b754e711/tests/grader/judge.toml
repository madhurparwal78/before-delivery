[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server configuration module and every place that constructs the Postgres pool, the S3 client and the SMTP transport. Search the whole source tree for credentials, endpoints, bucket names and SMTP hosts, skipping the provided service configuration, which the brief says stays as given (IF-05, L700). Cite each environment read and any literal as `file:line`. Only the defaults the brief documents (port 4173, the localhost public URL, the three TTL defaults) and the seed data it lists (seed people, the seed password hashed at seed time, the seeded agent tokens, which the brief calls seed data rather than service credentials) count as allowed literals. Pass: every database, storage or SMTP setting is read from its named environment variable with no hard-coded credential, endpoint or bucket."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-07",
]
evidence = "file_line"
cites = "L665-L675, L700"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 3
description = "Recipe: read the client source tree, the build configuration (bundler `define`, env prefixes, injected globals) and the handlers for `/api/status` and `/api/session`. Cite the build config and the status handler as `file:line`. Pass: no client file, build setting or API response carries the value of any database, storage or SMTP variable."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-07",
]
evidence = "file_line"
cites = "L34, L675, L357"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 5
description = "Recipe: read the client component that renders each `Promotion rail` edge and its capsule. Trace where `data-phase`, `data-progress` and the capsule position come from. Search the client for tables that turn a state into a progress value, `setInterval` and timer-driven increments of progress. A fixed list of the five segment labels and boundaries, and marking reached segments from the server's phase as the reduced-motion rail requires, are not such tables, and a tween that moves the drawn stroke or capsule to a newly received server value over the brief's lengths is not a timer that advances progress. Cite the source of each value as `file:line`. Pass: phase, progress and capsule target come only from the server graph edge fields, with no client mapping from state to a progress value and no timer that advances progress without a new server value."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-17",
]
evidence = "file_line"
cites = "L216-L222, L225, L520, L716"

[[criterion]]
id = "S4"
name = "S4"
type = "binary"
weight = 3
description = "Recipe: read the client code that renders `in sync <n>/<N>` on stage nodes and in the ledger, then read the server code that computes the counter. The count-up the brief requires (L218), which shows intermediate numbers on the way from the old server value to the new one, is display motion, not estimation. Cite the client render and the server computation as `file:line`. Pass: the client renders the server's counter values without counting health rows or estimating in-sync numbers itself."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-17",
]
evidence = "file_line"
cites = "L218, L500, L716"

[[criterion]]
id = "Q1"
name = "Q1"
type = "binary"
weight = 3
description = "Recipe: read `tsconfig.json` for `strict`. Search the TypeScript sources for `any`, `as any`, `@ts-ignore` and `@ts-expect-error`. Skim domain type and module names. Cite each violation as `file:line`. Pass: strict mode is on with no `any` or type-check suppression on domain data such as promotions, bundles, stages, windows, freeze policy versions, approvals, evidence snapshots, health rows or request keys."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L706"

[[criterion]]
id = "Q2"
name = "Q2"
type = "binary"
weight = 5
description = "Recipe: for each rule the brief lists (promotion transitions, stage lock, window check with the clock-change rule, policy version in force, approval expiry, in-sync counter, rail phase and progress mapping, redaction), find its deciding code. Search server and client for a second implementation. The clock-change rule may be applied once in the client's Check an instant conversion, which the brief requires (L179), and once on the server; that pair counts as its one home. The client's fixed rail drawing the brief requires (the five segment boundaries, marking reached segments from the server phase, showing the capsule only in the phases L146 lists) draws server values and is not a second rail mapping. Cite each home and any duplicate as `file:line`. Pass: each listed rule is decided in exactly one function or module."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L707-L715, L179, L146, L216, L225"

[[criterion]]
id = "Q3"
name = "Q3"
type = "binary"
weight = 3
description = "Recipe: find where error responses are built. Search route handlers and middleware for error bodies built outside it. The health endpoint's 503 `{\"status\":\"starting\"}`, which the brief places outside the error shape (L286, L684), is not an error body. Cite the builder and any bypass as `file:line`. Pass: every error response is built by one error-shape builder using only the codes the brief lists."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L717, L286-L307, L684"

[[criterion]]
id = "Q4"
name = "Q4"
type = "binary"
weight = 3
description = "Recipe: list the behavioural abstractions in the server and client: interfaces or types that declare methods meant to be implemented by classes or objects, abstract classes, and wrapper functions. A concrete class (a repository or service included) with no interface or abstract class over it is ordinary code, not an abstraction. Ignore interfaces and type aliases that only describe data shapes (domain records, request and response bodies, props, configuration), since strict typing needs them. For each behavioural abstraction, check for a second implementation, and for each wrapper, check whether it adds any logic. Cite each defect as `file:line`. Pass: no behavioural abstraction has a single implementation, with no wrapper that only forwards its arguments to another call."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L718, L706"

[[criterion]]
id = "Q5"
name = "Q5"
type = "binary"
weight = 3
description = "Recipe: search the source for commented-out code blocks, unused exports, unreachable branches and guards against promotion states the transition table makes impossible. Cite each instance as `file:line`. Pass: the source contains no commented-out code, unused export, unreachable branch or impossible-state guard."

[criterion.annotations]
channel = "quality"
