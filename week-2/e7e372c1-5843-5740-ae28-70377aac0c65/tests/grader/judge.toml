[judge]
judge = "codex"
model = "openai/gpt-5.6-sol"
version = "0.163.0"
cwd = "/judge-workspace"
timeout = 3600
mode = "batched"
samples = 3
guard = "penalize"
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "normal",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_press_key",
    "browser_resize",
    "browser_select_option",
    "browser_hover",
    "browser_drag",
    "browser_tabs",
    "browser_wait_for",
    "browser_mouse_wheel",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "reduced"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "reduced",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_press_key",
    "browser_resize",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "touch"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "touch",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_press_key",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "source"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "source-mcp",
]
allowed_tools = [
    "list_files",
    "read_file",
    "search_files",
]

[scoring]
aggregation = "weighted-mean"

[[criterion]]
id = "B1"
name = "B1"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800, open `/`, wait until the four figure tiles show numerals, then use browser_evaluate to read the computed background colour of the body (or of the html element if the body is transparent), then take a screenshot of the full viewport. A plain white or cool grey page ground fails. Pass: the page ground is a warm yellowed off-white with lightness above 85 percent, hue from 35 to 60 degrees and saturation of at least 10 percent."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-44",
]
evidence = "screenshot"
cites = "L526-L529, L544"

[[criterion]]
id = "B2"
name = "B2"
type = "binary"
weight = 3
description = "Recipe: `playwright` at 1280x800, open `/`, wait until the four figure tiles show numerals, then use browser_evaluate to read the computed text colour of the large numeral inside the Total ETH held tile, then take a screenshot of the tile row. Pure black or a mid grey fails. Pass: the numeral colour is a near-black ink with lightness below 20 percent and a blue channel above its red channel."

[criterion.annotations]
channel = "experience"
