services:
  main:
    extra_hosts:
    - host.docker.internal:host-gateway
    security_opt:
    - seccomp=unconfined
    - systempaths=unconfined
    - apparmor=unconfined
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      svix:
        condition: service_healthy
      wiremock:
        condition: service_healthy
  postgres:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_USER: gf_admin
      POSTGRES_PASSWORD: gf-admin-5c1e8a37
      POSTGRES_DB: postgres
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U gf_admin -d postgres
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  minio:
    image: coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    environment:
      MINIO_ROOT_USER: gf-root-6d29b4
      MINIO_ROOT_PASSWORD: gf-root-secret-a83f17c5
    command: server /data
    healthcheck:
      test:
      - CMD-SHELL
      - MC_HOST_local=http://gf-root-6d29b4:gf-root-secret-a83f17c5@localhost:9000 mc ready local >/dev/null
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  svix-db:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_USER: svix
      POSTGRES_PASSWORD: svix
      POSTGRES_DB: svix
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U svix -d svix
      interval: 2s
      timeout: 5s
      retries: 30
  svix:
    image: svix/svix-server:v1.104.0@sha256:fb0872f4d53e5ced46eef9349a15cc02e0ddae35d041a6f9f00fbee9dd1a0711
    command:
    - svix-server
    - --run-migrations
    - --wait-for
    - '60'
    environment:
      SVIX_JWT_SECRET: gfkit-svix-jwt-secret-5b8e1d2c7a940f36
      SVIX_DB_DSN: postgresql://svix:svix@svix-db:5432/svix
      SVIX_QUEUE_TYPE: memory
      SVIX_CACHE_TYPE: memory
      SVIX_WHITELIST_SUBNETS: '[0.0.0.0/0]'
    depends_on:
      svix-db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - svix-server
      - healthcheck
      - http://127.0.0.1:8071
      interval: 2s
      timeout: 5s
      retries: 60
  wiremock:
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    entrypoint:
    - sh
    - -c
    - if [ -n "$$WIREMOCK_STUBS" ]; then printf '%s' "$$WIREMOCK_STUBS" > /home/wiremock/mappings/baseline.json;
      fi; exec /docker-entrypoint.sh --port 8080 --disable-banner --max-request-journal-entries 20000 --admin-api-basic-auth
      gfkit-admin:gfkit-wm-4fce2a657cbe2442
    healthcheck:
      test:
      - CMD
      - curl
      - -sf
      - -u
      - gfkit-admin:gfkit-wm-4fce2a657cbe2442
      - http://127.0.0.1:8080/__admin/health
      interval: 2s
      timeout: 5s
      retries: 60
    environment:
      WIREMOCK_STUBS: '{"mappings": [{"request": {"method": "GET", "urlPath": "/git/v1/health"}, "response": {"jsonBody":
        {"status": "ok"}, "status": 200}}, {"request": {"method": "POST", "urlPathPattern": "/git/v1/repos/[^/]+/[^/]+/pulls"},
        "response": {"jsonBody": {"html_url": "https://git.example.test/larkspur-cycles/rider-app/pull/42", "number":
        42, "state": "open"}, "status": 201}}, {"request": {"method": "GET", "urlPathPattern": "/git/v1/repos/[^/]+/[^/]+/pulls/[0-9]+"},
        "response": {"jsonBody": {"merged": false, "number": 42, "state": "open"}, "status": 200}}, {"request":
        {"method": "GET", "urlPath": "/ai/v1/health"}, "response": {"jsonBody": {"status": "ok"}, "status": 200}},
        {"request": {"method": "POST", "queryParameters": {"target": {"equalTo": "de"}}, "urlPath": "/ai/v1/draft"},
        "response": {"jsonBody": {"draft": "Entwurf der Lexa-Testmaschine", "issues": [{"category": "fluency", "note":
        "Word order reads stiffly.", "severity": "minor"}]}, "status": 200}}, {"request": {"method": "POST", "queryParameters":
        {"target": {"equalTo": "fr"}}, "urlPath": "/ai/v1/draft"}, "response": {"jsonBody": {"draft": "\u00c9bauche
        de la machine d''essai Lexa", "issues": []}, "status": 200}}, {"request": {"method": "POST", "queryParameters":
        {"target": {"equalTo": "ja"}}, "urlPath": "/ai/v1/draft"}, "response": {"jsonBody": {"draft": "\u30ec\u30af\u30b5\u8a66\u9a13\u30a8\u30f3\u30b8\u30f3\u306e\u4e0b\u66f8\u304d",
        "issues": [{"category": "accuracy", "note": "Meaning drifts from the source.", "severity": "major"}]}, "status":
        200}}]}'
