[[criterion]]
id = "Q1"
name = "Q1"
type = "binary"
weight = 5
description = "Recipe: search server and browser source for the any type, casts through unknown, non-null assertions on parsed input, and ts-ignore or ts-expect-error comments. Read the domain modules for operations, locks, versions, subscriptions and seats. Cite each instance as file:line. Pass: domain logic contains zero instances of the patterns searched above that hide a real type mismatch."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L1139, L1143"

[[criterion]]
id = "Q2"
name = "Q2"
type = "binary"
weight = 5
description = "Recipe: find where the server decides whether a role or agent scope may perform an action (the permission table), then search route handlers for permission decisions made without that module: a handler that allows or refuses the caller by comparing the caller's own role or scope with values such as owner, editor or edit. Comparisons that serve other business rules, such as refusing to remove the owner or checking an invitee's role, are not permission decisions. A permission decision written inline in a handler or duplicated in a second module fails, cited as file:line. Pass: the permission table is encoded in exactly one module that every route consults."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L672-L686, L1145"

