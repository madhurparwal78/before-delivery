[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: open the module(s) that read the process environment, then search the source (excluding lockfiles) for literal connection strings, hostnames, access keys, secret keys, passwords and bucket names. The brief documents these literal defaults, which are allowed: the grading key, the default time zone, the link lifetime, the photo byte limit, the live delay, the From line, port 4173, and the seed users' passwords. Pass: every service address and credential in the source is read from an environment variable."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L88, L609-L622, L643"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: find the handler behind `POST /api/folios/:id/close` and trace it to the PDF render. Read the PDF client. A PDF body built locally, a canned or placeholder PDF, or a caught render error that still returns success fails. Pass: the invoice PDF bytes come from the reply of a real HTTP call to the Gotenberg convert route."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L88, L531, L544"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 5
description = "Recipe: in the same close-folio handler, find where the transaction that commits the invoice number and the `issued` state begins and ends, and the bucket upload call. An upload replaced by a stub, or a commit that happens before the upload call resolves, fails; a number taken inside a still-open transaction before the render is allowed. Pass: the invoice number and `issued` state are committed only after the real bucket upload has resolved."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
