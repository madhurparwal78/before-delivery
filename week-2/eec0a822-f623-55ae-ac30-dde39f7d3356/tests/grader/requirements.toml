schema_version = 1
id_prefix = "DP"
mandatory_count = 60
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "workspace-access",
    "public-fleet",
    "charter-holds",
    "passage-planner",
    "crew-rota",
    "berths-and-shore-power",
    "charter-invoicing",
    "guest-manifest",
    "energy-logbook",
    "ships-stores",
    "broker-pages",
    "yacht-profiles",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 82
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "minio", env = {} },
    { name = "killbill", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Tidewright <bookings@tidewright.example>" } },
]

[criterion_weights]
B1 = 3
B2 = 3
B3 = 3
B4 = 3
B5 = 3
B6 = 3
B7 = 5
B8 = 5
B9 = 5
B10 = 3
B11 = 3
B12 = 3
S1 = 5
S2 = 5
S3 = 3
Q1 = 3
Q2 = 5
Q3 = 5
Q4 = 5
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_kbdown"
S3_BUCKET = "${S3_BUCKET}-kbdown"

[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_s3down"
S3_BUCKET = "${S3_BUCKET}-s3down"

[[outages]]
id = "short-timer"
port = 4176
url_env = "APP_SHORT_URL"

[outages.env]
HOLD_SECONDS = "8"
BROKER_PAGE_SECONDS = "20"
MANIFEST_PAGE_SECONDS = "20"
MANIFEST_RETENTION_SECONDS = "15"
BROKER_RATE_WINDOW_SECONDS = "20"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[outages]]
id = "short-session"
port = 4177
url_env = "APP_SHORT_SESSION_URL"

[outages.env]
SESSION_SECONDS = "20"
DATABASE_URL = "${DATABASE_URL}_session"
S3_BUCKET = "${S3_BUCKET}-session"

[[requirements]]
id = "DP-01"
title = "Sign-in and sign-out without enumeration."
text = "A wrong password and an email that belongs to no member get the identical 401 status and body, the right password starts a session, and signing out ends it."
kind = "behavior"
primary = "pytest"
workflow = "workspace-access"
tests = [
    "test_app.py::test_sign_in_no_enumeration",
    "test_app.py::test_wf_workspace_access_sign_in",
    "test_app.py::test_wf_workspace_access_sign_out",
]
criteria = []
parameter_cases = []

