[[requirements]]
id = "DP-62"
title = "Board survives reload"
text = "The board's loaded move and search text and the agent's search text live in the page address, so a reload or a shared link restores them and a board refresh never changes it."
kind = "behavior"
primary = "pytest"
workflow = "board-layout"
tests = [
    "test_app.py::test_wf_board_layout_search_url",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-63"
title = "Retry after a lost reply"
text = "When an action's reply is lost after the server applied it, acting again on the same control with unchanged inputs shows the server's original result and never a refusal for the action already done, as qualified in Feedback states."
kind = "behavior"
primary = "pytest"
workflow = "outage-recovery"
tests = [
    "test_app.py::test_wf_outage_recovery_lost_reply",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-64"
title = "Notice cutoff in real elapsed time"
text = "Each move carries and shows its notice cutoff exactly 2 hours of real time before boarding with its UTC offset and zone abbreviation, across clock changes, as published in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "amend-cancel"
tests = [
    "test_app.py::test_notice_cutoff_dst",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-65"
title = "Latest live plan wins"
text = "The order form's clearances, window state, estimate and announcement come only from the plan reply for the form's current inputs and keep the last painted values while that reply is outstanding, a late reply for earlier inputs never paints or announces, and switching draught units sends no plan request."
kind = "behavior"
primary = "pytest"
workflow = "order-placement"
tests = [
    "test_app.py::test_wf_order_placement_latest_plan_wins",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-66"
title = "One assignment per key"
text = "A double-pressed, parallel or replayed assignment with one key yields one assignment, one version step, one history entry, one skip record per skipped pilot and one of each assignment mail."
kind = "behavior"
primary = "pytest"
workflow = "assignment-notices"
tests = [
