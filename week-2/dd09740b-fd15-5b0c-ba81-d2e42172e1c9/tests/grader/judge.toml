[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 5
description = "Recipe: source MCP. 1) Trace how sessions, sign-in attempts, idempotency and transition keys, hourly inquiry counts, notes, status events and the outbox are stored and read, citing the storing code as `file:line`. 2) Look for module-level dicts, lists, caches, files or SQLite used for any of them. Pass: each kind of state is read from and written to PostgreSQL tables with no process-memory or file store."

[criterion.annotations]
