<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070d0d">
<title>Holdfast Nights</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%23070d0d'/%3E%3Crect x='1' y='1' width='2' height='6' fill='%239fe6cf'/%3E%3Crect x='5' y='1' width='2' height='6' fill='%239fe6cf'/%3E%3Crect x='1' y='3' width='6' height='2' fill='%239fe6cf'/%3E%3C/svg%3E">
<link rel="preload" href="/fonts/chakra-petch-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="%STYLE%">
</head>
<body>
<div id="app">
  <canvas id="stage" role="img" aria-label="Block field"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="streaks" aria-hidden="true"></div>
  <div id="world"></div>
  <div id="banners">
    <div id="service-banner" role="status" aria-label="Service status"></div>
    <div id="room-banner" role="status" aria-label="Room paused"></div>
  </div>
  <div id="notices" role="status" aria-label="Notices"></div>
  <div id="stamp" role="status" aria-label="Build"></div>
  <div id="layers"><div id="scrim" aria-hidden="true"></div></div>
</div>
<noscript>Holdfast Nights needs JavaScript.</noscript>
<script type="module" src="%SCRIPT%"></script>
</body>
</html>
