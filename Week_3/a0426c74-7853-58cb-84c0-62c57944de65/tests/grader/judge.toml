weight = 3
description = "Recipe: Search the source for commented-out blocks, unused exports, unused files, unused parameters, unreachable branches after returns, throws or constant conditions, and guards or try-catch blocks for states the brief's rules make impossible. Each instance is a defect, cited as `file:line`. Pass: The source holds no dead, commented-out or unreachable code."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L1166-L1167"

[[criterion]]
