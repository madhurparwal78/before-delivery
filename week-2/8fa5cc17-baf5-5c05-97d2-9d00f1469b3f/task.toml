[task]
name = "oakgall/quire-commonplace"
version = "1.0.0"
description = "Quire, a personal commonplace workspace for doctoral students and self-directed learners: typed objects, merged multi-device block editing with remote carets, quoted blocks with the Margin Tether, block history with a word diff, a force-settled WebGL link graph, a collection board, a daily timeline, a ranked command palette, a saved-query language and scoped expiring share links, on PostgreSQL and MinIO."
authors = [
    { name = "Dishita Arya", email = "dishita.aryaint17@ethara.ai" },
    { name = "Kaustubh Dalvi", email = "kaustubh.dalvi@ethara.ai" },
]
