description = "Recipe: `playwright` at 1280x800, signed in as the front desk seed user on `/desk`. Click `button \"Next nights\"`, then screenshot the timeline. With `browser_evaluate`, read `getBoundingClientRect().left` of the first `rowheader` before and after the click. Pass: the room-number column with its condition chips keeps the same left edge after Next nights shifts the night columns."

