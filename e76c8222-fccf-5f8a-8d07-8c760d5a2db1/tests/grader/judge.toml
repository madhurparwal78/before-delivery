[[criterion]]
id = "S5"
name = "S5"
type = "binary"
weight = 1
description = "Recipe: `source`. 1) Open the client code behind the request form's Start and End textboxes and the timesheet's Actual start and Actual end textboxes, and trace each typed value to the body of the API call that saves it, citing the conversion as `file:line`. 2) Open the server code that validates `start`, `end`, `actual_start` and `actual_end` on those endpoints and cite the parser as `file:line`. 3) Treat as a defect a client that sends a valid typed value unchanged, a conversion that reads the typed value in the browser's or server's zone instead of agency time, and a server that refuses a time carrying an offset. Any offset is fine (`Z` or `±HH:MM`) as long as it names the same instant as the typed agency time; passing invalid text through so the server reports the field error is not a defect, and neither is a server that also accepts the textbox form. Pass: the client turns each valid typed agency-time value into an ISO 8601 time with an offset for the same instant before sending it, and the server accepts ISO 8601 times with an offset for all four fields."

[criterion.annotations]
channel = "source"
basis = "implicit"
importance = "somewhat_important"
requirements = []
evidence = "file_line"
cites = "L88: Date-and-time textboxes (Start, End, Actual start, Actual end) accept typed values of the form `YYYY-MM-DDTHH:MM` in agency time, L273: Times are ISO 8601 with offset."

