solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "minio", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Relay Bench <bench@lanternwork.test>" } },
]

[criterion_weights]
B1 = 5
B2 = 3
B3 = 5
B4 = 3
B5 = 3
B6 = 3
B7 = 3
B8 = 3
B9 = 3
B10 = 3
