[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: find the server's configuration reading and every Kill Bill, PostgreSQL, SMTP and session-signing client constructor, and trace each credential and service address to its source. The defaults the brief documents are allowed: port 4173, the published duration defaults, the published MAIL_FROM value and a randomly generated SESSION_SECRET. Cite each read and any literal as `file:line`. Pass: no credential, service host or service URL has a literal value or fallback beyond those documented defaults."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-08",
]
evidence = "file_line"
cites = "L1047, L1202-L1222, L1230"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: trace checkout, subscription start, every subscription change, refunds, goodwill credits, reconciliation accept and orphan refund from their route handlers to the outgoing HTTP calls. A stub, mock client, env switch or branch that records money without the call counts as failing. Cite each call and any bypass as `file:line`. Pass: no money action records a payment, refund or credit without a real HTTP request to KILLBILL_URL."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
