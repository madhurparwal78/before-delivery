name = "Q1"
type = "binary"
weight = 3
description = "Recipe: read tsconfig, then search server and client source for `any`, `as any`, `@ts-ignore`, `@ts-expect-error` and untyped exported signatures. Strict mode turned off counts as failing. Cite each instance as `file:line`. Pass: no `any` appears in an exported function, type, class member or module-level API."

[criterion.annotations]
