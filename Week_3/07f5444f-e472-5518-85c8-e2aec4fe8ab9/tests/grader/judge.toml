[judge]
judge = "codex"
model = "openai/gpt-5.6-sol"
version = "0.163.0"
cwd = "/judge-workspace"
timeout = 3600
mode = "batched"
samples = 3
guard = "penalize"
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "normal",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_press_key",
    "browser_resize",
    "browser_select_option",
    "browser_hover",
    "browser_drag",
    "browser_tabs",
    "browser_wait_for",
    "browser_mouse_wheel",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "reduced"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "reduced",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_press_key",
    "browser_resize",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "touch"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "touch",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_press_key",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "source"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "source-mcp",
]
allowed_tools = [
    "list_files",
    "read_file",
    "search_files",
]

[scoring]
aggregation = "weighted-mean"

[[criterion]]
id = "B1"
name = "B1"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800. 1. Sign in as the seeded principal librarian with the shared seed passcode. 2. Open Programme 01 from the works rail. 3. Use browser_evaluate to read the computed background colour of the page body, the works rail and the parts table pane, and for any that is transparent read its nearest ancestor with an opaque background instead. 4. Screenshot the desk. Pass: every sampled ground is a warm off-white paper colour with lightness of at least 80% and a hue between yellow and orange, never pure white or a cool grey."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-43",
]
evidence = "screenshot"
cites = "L79, L299-L300, L313, L719-L722"

[[criterion]]
id = "B2"
name = "B2"
type = "binary"
weight = 3
description = "Recipe: `playwright` at 1280x800. 1. Sign in as the seeded principal librarian. 2. Open Programme 01 from the works rail. 3. With browser_evaluate read the computed text colour of the level-1 programme heading, one parts-table part-name cell and one rail work title, then compute each one's contrast ratio against its own computed background. 4. Screenshot the desk. Pass: every sampled text is a warm near-black ink with lightness of at most 20% whose contrast ratio against its ground is at least 4.5 to 1."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "important"
requirements = [
    "DP-43",
]
evidence = "screenshot"
cites = "L301, L303, L306, L719-L722"

