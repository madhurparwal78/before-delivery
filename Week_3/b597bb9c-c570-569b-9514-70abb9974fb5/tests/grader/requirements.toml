[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
EXPORT_QUEUE = "gatecut.exports.minio-down"

[[outages]]
id = "rabbitmq-down"
port = 4175
url_env = "APP_RABBITMQ_DOWN_URL"

[outages.env]
AMQP_URL = "amqp://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4176
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"
EXPORT_QUEUE = "gatecut.exports.mailpit-down"

[[outages]]
id = "tight-allowance"
port = 4177
url_env = "APP_TIGHT_URL"

[outages.env]
DATABASE_URL = "${DATABASE_URL}_tight"
S3_BUCKET = "${S3_BUCKET}-tight"
STORAGE_ALLOWANCE_BYTES = "41212000000"
EXPORT_MINUTE_ALLOWANCE = "215"
EXPORT_QUEUE = "gatecut.exports.tight"

[[requirements]]
id = "DP-01"
title = "Run manifest and health"
text = "`/app/run.json` installs, builds and serves the app on port 4173 (or `APP_PUBLIC_PORT`), and `GET /api/health` answers 200 with `{\"status\":\"ok\"}` even when MinIO, RabbitMQ or SMTP is unreachable."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_health_every_instance",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Services wired from the environment"
text = "Every service URL and credential is read from the environment at start, the app really stores in Postgres, MinIO, Valkey and RabbitMQ and sends through SMTP, and none of it reaches the browser."
kind = "source"
primary = "rubric"
workflow = "cross-cutting"
tests = []
criteria = [
    "S1",
    "S2",
    "S4",
]
parameter_cases = []

