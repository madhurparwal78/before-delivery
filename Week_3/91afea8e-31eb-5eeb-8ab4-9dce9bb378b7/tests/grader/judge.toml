[[criterion]]
id = "Q4"
name = "Q4"
type = "binary"
weight = 5
description = "Recipe: For the shipment, return and payment state transitions, the tax split, the coupon allocation, the cash-on-delivery eligibility, the delivery promise, the EMI plan and the settlement line, find the one function that decides each. Then search for a second place that repeats the rule, such as the divide-by-(100 plus rate) tax formula, the half rule for SGST, a largest-remainder loop, the cash cap and fee literals, lane-day arithmetic, the 1.25 monthly rate, or the commission, TCS and TDS factors. A second implementation, or a caller that decides the rule itself, fails. Cite each as `file:line`. Pass: Each named rule is decided in exactly one function that every caller uses."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L942"

