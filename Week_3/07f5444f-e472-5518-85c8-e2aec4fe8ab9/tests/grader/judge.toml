description = "Recipe: read the scan filing path plus the notice and reminder sending path. A catalogue row inserted before the object is read back and matched, a missing object cleanup when the row fails, or a sent status set before SMTP acceptance fails, cite it as file:line. Pass: no catalogue row or sent status is written before its provider effect is confirmed."

