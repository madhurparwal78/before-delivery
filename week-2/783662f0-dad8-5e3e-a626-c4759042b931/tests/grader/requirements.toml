[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_STORAGE_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "mail-down"
port = 4176
url_env = "APP_MAIL_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[outages]]
id = "slow-billing"
port = 4177
url_env = "APP_SLOW_BILLING_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:4191"

[[outages]]
id = "storage-partial"
port = 4178
url_env = "APP_STORAGE_PARTIAL_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:4192"

[[outages]]
id = "short-timer"
port = 4179
url_env = "APP_SHORT_URL"

[outages.env]
BILLING_GRACE_SECONDS = "20"
INVITE_TTL_SECONDS = "20"
WEATHER_PERIOD_SECONDS = "15"
DAY_CYCLE_SECONDS = "120"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
id = "DP-01"
title = "Run manifest and health check"
text = "`/app/run.json` installs, builds and serves the app, and the health endpoint answers as specified in Deployment even when a provider is down."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_health_on_every_instance",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Configuration from the environment"
text = "Every Postgres, MinIO, Kill Bill and mail address and credential, the port and the public base address are read from the environment at start, as qualified in Configuration and secrets, and never appear in source, browser code or any response."
kind = "source"
primary = "rubric"
workflow = "cross-cutting"
tests = []
criteria = [
    "S1",
    "S2",
]
parameter_cases = []

