text = "Shipped packages and bundled assets use only MIT, Apache-2.0, BSD, ISC, OFL or CC0 licences."
tests = [
    "test_app.py::test_if_licences",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "The only datastores are Postgres and MinIO, and the only mail path is Mailpit; no other database, queue or cache is added."
tests = [
    "test_app.py::test_if_only_published_datastores",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "The page source references no remote script, font, image, model or sound."
tests = [
    "test_app.py::test_if_no_remote_assets",
]
parameter_cases = []

[[if_rules]]
id = "IF-07"
text = "No service worker, pointer lock, gamepad, WebXR or device sensor API appears in the source."
tests = [
    "test_app.py::test_if_no_forbidden_browser_apis",
]
parameter_cases = []

