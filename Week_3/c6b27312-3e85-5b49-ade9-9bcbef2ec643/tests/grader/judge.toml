description = "Recipe: read the save, copy, restore, fork and publish handlers, the storage module, the mail module, and the like, comment, approval and dashboard handlers. The grading routes the brief specifies are allowed. An in-memory record store, canned mail, a stored like count, a hard-coded response or a test-only route outside the brief fails. Cite `file:line`. Pass: every saved revision, mail, like count and dashboard row is written to or read from PostgreSQL, MinIO or Mailpit's SMTP port through client libraries."

