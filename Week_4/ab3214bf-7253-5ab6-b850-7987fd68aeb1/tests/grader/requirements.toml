schema_version = 1
id_prefix = "DP"
mandatory_count = 98
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "desk-access",
    "meter-intake",
    "gap-repair",
    "merit-order",
    "allocation-ledger",
    "break-the-month",
    "review-sample",
    "review-expiry",
    "cancellation",
    "sign-seal",
    "statement-check",
    "group-oversight",
    "wall-selection",
    "live-collaboration",
    "restatement-chain",
    "second-pass",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "S4",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 89
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "wiremock", env = {} },
    { name = "gotenberg", env = {} },
    { name = "minio", env = {} },
]

[criterion_weights]
B1 = 5
B2 = 3
B3 = 5
B4 = 3
B5 = 5
B6 = 5
B7 = 3
B8 = 3
B9 = 3
B10 = 5
B11 = 5
B12 = 3
