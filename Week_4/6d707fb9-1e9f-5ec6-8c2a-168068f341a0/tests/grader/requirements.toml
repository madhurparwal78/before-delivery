schema_version = 1
id_prefix = "DP"
mandatory_count = 60
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "desk-access",
    "public-site",
    "labels-and-styles",
    "bill-of-materials",
    "supplier-requests",
    "answer-page",
    "factory-visits",
    "footprint-and-factors",
    "scenarios",
    "textile-score",
    "product-passports",
    "dossier-and-sign-off",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "S4",
    "S5",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 90
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "minio", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Fio Contado Desk <desk@fio-contado.example>" } },
    { name = "gotenberg", env = {} },
    { name = "wiremock", env = {} },
]

[criterion_weights]
B1 = 5
B2 = 5
B3 = 3
B4 = 3
B5 = 3
B6 = 3
B7 = 5
B8 = 3
B9 = 5
B10 = 3
B11 = 3
B12 = 3
S1 = 5
S2 = 5
S3 = 5
S4 = 3
S5 = 3
Q1 = 3
Q2 = 3
Q3 = 5
Q4 = 3
Q5 = 3
Q6 = 5
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_storage"
S3_BUCKET = "${S3_BUCKET}-storage"

[[outages]]
id = "gotenberg-down"
port = 4175
url_env = "APP_GOTENBERG_DOWN_URL"

[outages.env]
GOTENBERG_URL = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_render"
S3_BUCKET = "${S3_BUCKET}-render"

[[outages]]
id = "short-timers"
port = 4176
url_env = "APP_SHORT_URL"

[outages.env]
ANSWER_PAGE_SECONDS = "20"
SIGN_OFF_PAGE_SECONDS = "20"
REMINDER_AFTER_SECONDS = "10"
REQUEST_RATE_WINDOW_SECONDS = "30"
FILE_RATE_WINDOW_SECONDS = "30"
CLOSURE_WAIT_SECONDS = "20"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[outages]]
id = "short-session"
port = 4177
url_env = "APP_SESSION_URL"

[outages.env]
SESSION_SECONDS = "20"
DATABASE_URL = "${DATABASE_URL}_session"
S3_BUCKET = "${S3_BUCKET}-session"

[[outages]]
id = "spare"
port = 4178
url_env = "APP_SPARE_URL"

[outages.env]
DATABASE_URL = "${DATABASE_URL}_spare"
S3_BUCKET = "${S3_BUCKET}-spare"

[[requirements]]
id = "DP-01"
title = "Starting a desk, signing in and out, changing the password."
text = "A new desk signs up, a wrong password gets 401, the right one signs in, signing out ends the session with 401 from the session endpoint, and changing the password ends that person's other sessions while the new password signs in."
kind = "behavior"
primary = "workflow"
workflow = "desk-access"
tests = [
    "test_app.py::test_wf_desk_access_passwords",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Labels on one desk."
text = "The assessor creates, reads, renames and deletes a label, a deleted label answers 404 from then on, and a label of another desk answers 404 exactly like an unknown id in the same shape."
kind = "behavior"
primary = "pytest"
workflow = "desk-access"
tests = [
