[task]
name = "deku/data-pipeline-console"
version = "1.0.0"
description = "Wayline Data Pipeline Console: a FastAPI and React console on PostgreSQL where a data platform team picks connectors, configures versioned connections with sync modes, cron schedules in a time zone and schema change policies, builds a sandboxed HTTP connector, and runs all-or-nothing syncs with live logs, keyset-paged history and records, a hash-chained audit log, role-gated workspace, and a public marketing site with a captioned film."
authors = [
    { name = "Atharv Mahalwar", email = "atharv.mahalwar@ethara.ai" },
    { name = "Sonu Sharma", email = "sonu.sharma@ethara.ai" },
]
keywords = [
    "data pipelines",
    "etl",
    "fastapi",
    "react",
    "postgresql",
    "idempotency",
    "optimistic concurrency",
    "server-sent events",
    "audit log",
    "accessibility",
]

