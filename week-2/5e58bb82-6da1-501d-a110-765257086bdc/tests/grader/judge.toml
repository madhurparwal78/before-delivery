[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server configuration and start-up code, plus every module that opens the Postgres pool, the S3 client and the SMTP transport. Trace each database URL, S3 setting, SMTP setting and mail sender back to its source. Search for literal hosts, ports, bucket names and key strings. Defaults the brief documents (port 4173, a 900-second sign-in window, a 300-second escalation delay) are allowed. Cite each violation as `file:line`. Pass: every service credential and service address the server uses is read from the environment with no hard-coded fallback."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-84",
]
evidence = "file_line"
cites = "L1104, L1129, L1436-L1442"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: read the browser source and the bundler configuration, including any `define` or env-prefix settings. Search browser code for imports of server config modules and for references to database, S3, SMTP or ingest-key settings. Read the vessel and status handlers to see what they return. Cite each leak as `file:line`. Pass: no secret or service address from configuration is reachable from browser code or a response body."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-84",
]
evidence = "file_line"
cites = "L1442-L1443, L1456"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 5
description = "Recipe: find the chart component used by the fleet board, mission console, planner preview and survey screen. Trace how it draws the survey area, geofence, lines and vessel markers. Search the assets for raster or pre-drawn chart images and for hard-coded coordinate sets or demo tracks. On the planner preview, geometry built from the typed form values and the plan-preview response is allowed. Cite each violation as `file:line`. Pass: the chart builds its geometry in SVG or canvas code from mission data or, on the planner, from the form values, never from a picture or fixed coordinates."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
