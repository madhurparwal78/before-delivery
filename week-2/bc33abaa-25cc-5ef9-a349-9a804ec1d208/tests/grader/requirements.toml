schema_version = 1
id_prefix = "DP"
mandatory_count = 60
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "public-site-trial",
    "members-seats",
    "agent-access",
    "scene-authoring",
    "object-locks",
    "op-log-rewind",
    "asset-uploads",
    "comments-review",
    "review-links",
    "scheduled-publish",
    "checkout-plans",
    "invoices-payments",
    "dunning",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "S4",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 85
services = [
    { name = "postgres", env = {} },
    { name = "pocketbase", env = {} },
    { name = "minio", env = {} },
    { name = "killbill", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Orrery Studio <studio@orrery-labs.test>" } },
]

[criterion_weights]
B1 = 5
B2 = 3
B3 = 5
B4 = 3
B5 = 3
B6 = 5
B7 = 3
B8 = 3
B9 = 5
B10 = 3
B11 = 3
B12 = 1
S1 = 5
S2 = 5
S3 = 5
S4 = 3
Q1 = 5
Q2 = 5
Q3 = 3
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "short-clock"
port = 4176
url_env = "APP_SHORT_CLOCK_URL"

[outages.env]
TRIAL_LENGTH_SECONDS = "20"
DUNNING_DAY_SECONDS = "5"
TOKEN_WARNING_LEAD_SECONDS = "15"

[[requirements]]
id = "DP-01"
title = "Public site and plan comparison"
text = "Show a public home page with numbered sections and a pricing page that compares the Team and Business plans for monthly and annual billing at the prices in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "public-site-trial"
tests = [
    "test_app.py::test_public_home_and_pricing",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Start a trial"
text = "A site visitor starts a trial from the public site, which creates a workspace, makes them its owner, signs them in and lands them on a dashboard that shows when the trial ends."
kind = "behavior"
primary = "workflow"
workflow = "public-site-trial"
tests = [
    "test_app.py::test_wf_public_site_trial_happy",
    "test_app.py::test_wf_public_site_trial_form_errors",
    "test_app.py::test_wf_public_site_trial_billing_down",
]
criteria = []
parameter_cases = []

