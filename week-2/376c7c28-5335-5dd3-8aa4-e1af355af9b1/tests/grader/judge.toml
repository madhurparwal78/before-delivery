weight = 5
description = "Recipe: read the fee quote and rounding code, the cubic-inch product, the footprint percent rounding, the dollar formatter used in receipts, CSV and UI, and the SQL column types for money. Cite each float use on a money path as `file:line`. A single conversion of the JSON dimensions to exact integer units, and display-only number animation, are not money paths. Pass: fees, charges, balances and ledger amounts are held and computed only as integer cents (or exact integer arithmetic such as eighths of a cubic inch times cents), with no float dollar value, `toFixed` on money or numeric float column on any money path."

