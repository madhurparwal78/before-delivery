[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server config and the Postgres, S3 and SMTP client setup, then search the source for connection strings, hostnames, ports, access keys and passwords. Defaults the brief documents are allowed: port 4173, an `http://localhost:<port>` public URL, the From line, the summary time, the quiet seconds, the event retention count and the session idle minutes. Cite each environment read and each violation as `file:line`. Pass: no database, object-store or mail service setting is hard-coded in source."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-50",
]
evidence = "file_line"
cites = "L1317-L1328"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: trace job, item, session, operation-log, event-log and outbox reads and writes from their route handlers to storage. Search for module-level Maps, arrays or objects holding records, file-based stores, SQLite, Redis, and test-only or debug routes. In-process subscriber lists for open streams are allowed. Any module-level record store or test-only route fails. Cite the storage path as `file:line`. Pass: every traced record is read back from Postgres as its source of truth."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-50",
]
evidence = "file_line"
cites = "L1149-L1163, L1354, L1377"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: trace the plan upload, plan revision upload and photo upload handlers to their S3 put to the configured bucket under the brief's key scheme. A write to local disk as the store fails. Cite the calls as `file:line`. Pass: each upload confirms its stored S3 object before its database record commits."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-50",
]
evidence = "file_line"
cites = "L1165-L1169, L968-L973"

[[criterion]]
id = "S4"
name = "S4"
type = "binary"
weight = 3
description = "Recipe: trace an assignment notice from the item change to delivery: the outbox insert, the claim of the entry in Postgres, the sender loop and the SMTP client. A console logger or no-op mailer in place of SMTP fails. Cite as `file:line`. Pass: the outbox sender delivers each claimed entry through a real SMTP client to the configured host."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-50",
]
evidence = "file_line"
cites = "L1177-L1178, L1218-L1222"

