[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[services]]
name = "postgres"

[services.env]
SPOOR_GRADING = "1"
SPOOR_CHECK_INTERVAL_MS = "60000"
SPOOR_PENDING_CHECKS = "2"
SPOOR_FLAP_CHANGES = "4"
SPOOR_FLAP_CHECKS = "10"
SPOOR_LIFECYCLE_INTERVAL_MS = "60000"
SPOOR_SNAPSHOT_TTL_MS = "300000"
SPOOR_PAGE_SIZE = "10"
SPOOR_TAIL_BUFFER = "50"
SPOOR_TAIL_RATE = "100000"
SPOOR_SSE_HEARTBEAT_MS = "2000"
SPOOR_QUERY_MAX_LEN = "2000"
SPOOR_QUERY_MAX_DEPTH = "8"
SPOOR_QUERY_WORK_MAX = "20000"
SPOOR_QUERY_BUDGET_MS = "3000"
SPOOR_RESULT_WINDOW = "200"
SPOOR_UPLOAD_MAX_BYTES = "200000"
SPOOR_UPLOAD_PROGRESS_LINES = "10"
SPOOR_UPLOAD_RATE = "100000"
SPOOR_LOGIN_RATE = "100000"
SPOOR_SEARCH_RATE = "100000"
SPOOR_TRACE_MAX_SPANS = "500"

[[services]]
name = "minio"

[services.env]

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_minio_down"

