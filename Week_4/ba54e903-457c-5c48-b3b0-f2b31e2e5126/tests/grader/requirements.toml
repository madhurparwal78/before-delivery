id = "DP-02"
title = "Sign-up and sign-in session"
text = "Sign-up stores the lowercased email and the trimmed display name and answers a bearer token with the self user at its stated defaults, login restores the same self user, and PATCH /api/users/@me updates and validates the profile."
kind = "behavior"
primary = "pytest"
workflow = "signup"
tests = [
