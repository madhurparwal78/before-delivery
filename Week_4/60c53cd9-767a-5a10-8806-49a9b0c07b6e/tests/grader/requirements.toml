schema_version = 1
id_prefix = "DP"
mandatory_count = 86
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "filter-homes",
    "page-results",
    "sweep-lens",
    "place-hold",
    "hold-race",
    "manage-hold",
    "share-hold",
    "withdraw-unit",
    "price-and-release",
    "view-photos",
    "search-outage",
    "finder-layouts",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B13",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 91
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "minio", env = {} },
    { name = "meilisearch", env = {} },
]

[criterion_weights]
B1 = 5
B2 = 3
B3 = 3
B4 = 3
B13 = 3
B5 = 5
B6 = 3
B7 = 5
B8 = 5
B9 = 5
B10 = 3
B11 = 3
B12 = 3
S1 = 5
S2 = 5
S3 = 3
Q1 = 5
Q2 = 5
Q3 = 3
Q4 = 5
Q5 = 5
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "meilisearch-down"
port = 4174
url_env = "APP_MEILISEARCH_DOWN_URL"

[outages.env]
MEILISEARCH_URL = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_searchdown"
S3_BUCKET = "${S3_BUCKET}-searchdown"
MEILISEARCH_INDEX = "units_searchdown"

[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_STORAGE_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "short-timer"
port = 4176
url_env = "APP_SHORT_URL"

[outages.env]
HOLD_SECONDS = "20"
HOLD_COOLDOWN_SECONDS = "40"
HOLD_ATTEMPT_WINDOW_SECONDS = "30"
SEARCH_RATE_LIMIT = "5"
MEDIA_URL_SECONDS = "15"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"
MEILISEARCH_INDEX = "units_short"

[[outages]]
id = "dst-clock"
port = 4177
url_env = "APP_DST_URL"

[outages.env]
APP_CLOCK_START = "2027-04-02T05:00:00Z"
DATABASE_URL = "${DATABASE_URL}_dst"
S3_BUCKET = "${S3_BUCKET}-dst"
MEILISEARCH_INDEX = "units_dst"

[[outages]]
id = "dst-late"
port = 4178
url_env = "APP_DST_LATE_URL"

[outages.env]
APP_CLOCK_START = "2027-04-03T15:00:00Z"
DATABASE_URL = "${DATABASE_URL}_dstlate"
S3_BUCKET = "${S3_BUCKET}-dstlate"
MEILISEARCH_INDEX = "units_dstlate"

[[outages]]
id = "short-session"
port = 4179
url_env = "APP_SHORT_SESSION_URL"

[outages.env]
SESSION_SECONDS = "20"
DATABASE_URL = "${DATABASE_URL}_session"
S3_BUCKET = "${S3_BUCKET}-session"
MEILISEARCH_INDEX = "units_session"

[[requirements]]
id = "DP-01"
title = "Faceted search"
text = "GET /api/search returns the released, non-withdrawn homes that match the buyer's text and filters, with a total, per-facet counts, price bounds and every matching unit code, as specified in API."
kind = "behavior"
primary = "pytest"
workflow = "filter-homes"
tests = [
    "test_app.py::test_search_facets",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Bounded search input"
text = "Over-long search text, too many values in one facet, unknown facet values and a price floor above the ceiling are rejected with a field-level message, both in the API and beside the control, before the search service is consulted, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "filter-homes"
tests = [
    "test_app.py::test_search_input_bounds",
    "test_app.py::test_wf_filter_homes_field_messages",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Live filter updates"
text = "Changing the search text, a facet chip or a price bound updates the facet counts, the result list, the live total and the lit tower cells in place without a page load, and the polite result-count region announces the new count."
kind = "behavior"
primary = "workflow"
workflow = "filter-homes"
tests = [
    "test_app.py::test_wf_filter_homes_newest_wins",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Anonymous search limit"
text = "Searches without a session beyond the configured per-client limit answer 429 with Retry-After and the published message, and the finder counts the wait down without sending searches, as qualified in Interactions."
kind = "behavior"
primary = "pytest"
workflow = "filter-homes"
tests = [
    "test_app.py::test_search_rate_limit",
]
criteria = []
parameter_cases = []

