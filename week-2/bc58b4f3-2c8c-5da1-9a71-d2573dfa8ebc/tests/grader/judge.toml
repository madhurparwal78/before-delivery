[[criterion]]
id = "Q2"
name = "Q2"
type = "binary"
weight = 5
description = "Recipe: for each domain rule the brief lists (each state transition, seat count, business-minute notice, fee decision, billable minutes, mileage, rate in force, uncovered minutes, role visibility), find every place in server and client source that computes it. A client that shows or hides a control from the status the API returned, or routes and builds navigation from the signed-in role as the brief's screen table asks, is not computing a rule. A second computation of any listed rule, including the client recomputing a fee, seat count, notice or uncovered total, fails. Cite both sites as `file:line`. Pass: each rule is decided in exactly one function or module, with callers only consuming its result."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L417"

[[criterion]]
id = "Q3"
name = "Q3"
type = "binary"
weight = 3
description = "Recipe: trace money from the rate-card input (dollars typed by the billing lead) through charge computation, storage and the statement to the Kill Bill amount. Search those paths for `parseFloat`, `Number(` on decimal amounts, `toFixed`, `/ 100` or `* 100` on non-integer values, and `Math.round` on fractional amounts. Formatting a stored integer for display only is out of scope. Cite each floating-point step as `file:line`. Pass: every amount on that path is held and computed as integer cents, with dollar conversions done by integer or string arithmetic."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L421, L294-L297"

[[criterion]]
