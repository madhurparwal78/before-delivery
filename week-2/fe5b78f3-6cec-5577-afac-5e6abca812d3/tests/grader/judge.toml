[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: `source`. Read the server configuration module and every place that builds the database pool, the billing client, the mail transport and the object-store client. Search the source for literal hosts, ports, usernames, passwords, API keys and bucket names, citing each environment read and each literal as `file:line`. Pass: every service URL and credential listed in Configuration and secrets is read from the environment at start, with no literal fallback beyond the brief's documented defaults (port 4173, clock rate 1)."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
