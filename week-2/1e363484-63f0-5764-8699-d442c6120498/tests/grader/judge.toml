type = "binary"
weight = 5
description = "Recipe: `reduced` at 1280x800. 1. Sign in as Hal Brennan. 2. Open `/projects/blackmere-moss?from=2026-06-01&to=2026-06-02&start=202606010000&end=202606030000&sensors=BM-S1,BM-S2,BM-S3,BM-S4,BM-T1,BM-T2`, a towers-only interval below the coverage floor. 3. Wait until `meter \"Coverage\"` reports a value. 4. Screenshot `group \"Coverage map\"`. A map with no hatching, or with one uniform fill across the boundary, fails. Pass: ground inside the two tower footprints shows a flat muted moss-green tint set against fine diagonal ink hatching over the rest of the boundary."

