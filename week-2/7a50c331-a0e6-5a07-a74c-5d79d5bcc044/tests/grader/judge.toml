weight = 5
description = "Recipe: locate where each domain rule the brief names as single-sourced is computed. The landing calculator script and the sign-in page script may each hold the one browser counterpart the brief documents. Any other duplicated computation counts as a defect; cite both copies. Pass: each named rule is computed in exactly one server function that every caller uses."

[criterion.annotations]
