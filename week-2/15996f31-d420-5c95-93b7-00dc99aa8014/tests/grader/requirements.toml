[[if_rules]]
id = "IF-01"
text = "/app/run.json exists with string install, build and serve commands and \"_schema\":\"run-manifest-v1\", and nothing else is required to start the app."
tests = [
    "test_app.py::test_if_run_manifest",
]
parameter_cases = []

[[if_rules]]
id = "IF-02"
text = "/app/THIRD_PARTY_NOTICES.md lists every shipped package (the production tree from npm ls --omit=dev --all --json) with version and licence, plus bundled fonts and icons."
tests = [
    "test_app.py::test_if_third_party_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Every shipped package is MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0 or 0BSD, and every bundled font is SIL Open Font License 1.1."
tests = [
    "test_app.py::test_if_licences",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "No datastore beyond the provided PostgreSQL and MinIO: no SQLite, Redis, embedded database or on-disk files used to keep application state."
tests = [
    "test_app.py::test_if_no_extra_datastore",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "The provided service configuration and seeded dev credentials are left untouched."
tests = [
    "test_app.py::test_if_service_config_untouched",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "All application source is TypeScript, and a committed package-lock.json matches package.json."
tests = [
    "test_app.py::test_if_typescript_and_lockfile",
]
parameter_cases = []

[[if_rules]]
id = "IF-07"
text = "No route, flag or environment switch exists only to change server state or the clock for testing."
tests = [
    "test_app.py::test_if_no_test_switches",
]
parameter_cases = []

