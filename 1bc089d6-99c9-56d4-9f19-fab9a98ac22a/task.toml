version = "1.0.0"
description = "Stillhour Wind-Down Planner: a cinematic single-page scroll story over one fixed WebGL canvas that ends in a planner for the hour before bed, with emailed one-time links, nightly reminder emails at the local start of each hour (DST-safe), share links for partners, an outbox for mail outages, idempotent saves and versioned edits, on PostgreSQL and Mailpit."
