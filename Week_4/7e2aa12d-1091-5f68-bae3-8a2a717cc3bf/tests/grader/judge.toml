id = "S2"
name = "S2"
type = "binary"
weight = 3
description = "Recipe: read the client entry, the bundler configuration (any `define`, `loadEnv` or `import.meta.env` use) and every server route that returns configuration, the health route and the layout object included. Limits may appear inside refusal messages, and the boolean `live` flag is allowed. Pass: no client source, bundler injection or JSON response carries the database URL, the Valkey URL, any credential or the grading key."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
