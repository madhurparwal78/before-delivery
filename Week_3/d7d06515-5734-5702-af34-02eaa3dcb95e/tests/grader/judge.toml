name = "Q3"
type = "binary"
weight = 3
description = "Recipe: list every interface, abstract class, factory and helper in the source and count the implementations or callers behind each. An abstraction with a single implementation, or a function that only forwards its arguments to another call, fails, so cite each as `file:line`. Pass: no abstraction has a single implementation and no wrapper only forwards calls."

