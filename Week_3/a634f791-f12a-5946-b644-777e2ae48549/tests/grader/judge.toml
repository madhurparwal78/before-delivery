type = "binary"
weight = 3
description = "Recipe: `playwright` at 1280x800, open `/contact`, scroll through the directory so its images load, probe each portrait's naturalWidth and the computed background and text colours of the area beneath it, then screenshot the directory. Pass: Each of the six cards shows a loaded portrait filling its top above a deep warm grey area carrying off-white text."

