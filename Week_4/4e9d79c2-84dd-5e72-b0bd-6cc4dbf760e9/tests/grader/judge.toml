description = "Recipe: Read the domain modules, data schema and main types for the concepts of enquiry, hire, run, bid, ledger line, rate table, duty ribbon and Journey ticket. A concept named by a substitute such as job for hire, shift for run, or transaction for ledger line is a defect. Cite each defect as `file:line`. Pass: Modules, types and tables name these concepts by the brief's terms."

[criterion.annotations]
