[[requirements]]
id = "DP-06"
title = "Email confirmation; confirmation link is a capability"
text = "The one-time confirmation token confirms the address once within its lifetime, a resend supersedes every earlier token so only the newest works, the /verify-email page shows the stated lines, and an email-level community refuses posts until the address is confirmed. The confirmation token is stored only as its SHA-256 digest, a plain request for the link never confirms, and the /verify-email page, sent with no-referrer, replaces its address with the bare /verify-email and confirms by its own request."
kind = "behavior"
primary = "pytest"
workflow = "signup"
tests = [
    "test_app.py::test_email_confirmation",
    "test_app.py::test_confirmation_capability",
    "test_app.py::test_wf_signup_confirm_link",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-07"
title = "Sign-in lockout; cross-site requests refused"
text = "Five failed logins for one email within the lockout period lock every login for that email with 429 and Retry-After, even when the attempts arrive at once, while other emails stay unaffected. Every POST, PUT, PATCH or DELETE and every live connection carrying a foreign or null Origin answers 403 forbidden before authentication, counting no lockout failure and changing nothing, on every instance, and the live connection never carries the session token in its URL."
kind = "behavior"
primary = "pytest"
workflow = "access"
tests = [
    "test_app.py::test_lockout",
    "test_app.py::test_cross_site",
]
criteria = []
parameter_cases = []

