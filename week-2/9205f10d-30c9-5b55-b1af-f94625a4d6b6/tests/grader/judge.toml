type = "binary"
weight = 5
description = "Recipe: trace the charge rule, the late fee, the stored amount, and the amount written to the API, CSV, email and billing posting. Any JavaScript number arithmetic, parseFloat, Number() conversion followed by arithmetic, Math.round on dollars or toFixed on a float that touches an amount or hourly rate counts as a defect; cite each as file:line. Pass: amounts are handled only as exact decimals or integer cents from input to every output."

