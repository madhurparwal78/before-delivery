solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "minio", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Tinework <noreply@tinework.example>" } },
    { name = "valkey", env = {} },
]

[criterion_weights]
B1 = 5
B2 = 3
B3 = 5
B4 = 3
B5 = 3
B6 = 3
B7 = 3
B8 = 5
B9 = 5
B10 = 5
B11 = 5
B12 = 3
