description = "Recipe: `playwright` at 1280x800. 1) Open `/p/lantern-and-tide?section=ST&seat=ST-A-15&tier=all` (invented seed performance Lantern & Tide). 2) Screenshot the seat map page. Pass: the Stalls seats are drawn as rows of concentric arcs fanning out beneath a labelled Stage band across the top of the map frame, so a rectangular seat grid or a stage at the bottom or side fails."

