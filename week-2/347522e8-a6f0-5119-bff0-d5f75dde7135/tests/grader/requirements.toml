[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[services]]
name = "postgres"

[services.env]

[[services]]
name = "killbill"

[services.env]

[[services]]
name = "mailpit"

[services.env]
MAIL_FROM = "Railside by Brigade & Bench <bookings@railside.example>"

[[services]]
name = "minio"

[services.env]

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"
MAILPIT_URL = "http://127.0.0.1:9"

[[outages]]
id = "short-timer"
port = 4176
url_env = "APP_SHORT_URL"

[outages.env]
HOLD_TTL_SECONDS = "30"
COMPLIANCE_SCAN_SECONDS = "5"
OUTBOX_RETRY_SECONDS = "5"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
