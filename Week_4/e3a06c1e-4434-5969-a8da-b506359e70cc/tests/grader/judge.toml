[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server code that turns received PCM into spectrum rows, tracing it from the live socket handler, the replay or tone feeder, and the public demo-spectrum route. Canned, random or hard-coded spectrum arrays fail, as does a demo spectrum not computed from the seed audio. Cite the FFT and band-mapping lines. Pass: every spectrum row is computed by a Hann-windowed real FFT over the most recent received samples."

