[[if_rules]]
id = "IF-01"
text = "Supply the working run manifest defined in Deployment."
tests = [
    "test_app.py::test_if_run_manifest",
]
parameter_cases = []

[[if_rules]]
id = "IF-02"
text = "Include THIRD_PARTY_NOTICES.md listing shipped packages and bundled font licences; shipped packages means the production dependency tree reported by npm ls --omit=dev --all --json."
tests = [
    "test_app.py::test_if_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Use only MIT, ISC, BSD-2-Clause, BSD-3-Clause or Apache-2.0 licences for shipped packages, SIL OFL-1.1 for bundled fonts and original procedural artwork."
tests = [
    "test_app.py::test_if_licences",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "Use only PostgreSQL, MinIO and Meilisearch as persistent services, without fallback datastores or fabricated provider success."
tests = [
    "test_app.py::test_if_real_providers",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "Preserve supplied service and evaluation configuration and do not use observer credentials."
tests = [
    "test_app.py::test_if_observer_credentials",
]
parameter_cases = []

