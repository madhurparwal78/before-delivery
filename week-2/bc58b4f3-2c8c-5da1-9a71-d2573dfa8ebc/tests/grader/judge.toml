type = "binary"
weight = 3
description = "Recipe: find the error helper or error type that builds the API error body, then search every route, middleware and upload handler for error responses built another way (direct status plus ad-hoc JSON or text bodies, framework default error pages). Cite each bypass as `file:line`. Pass: every API error response is produced through the one shared error construction."

