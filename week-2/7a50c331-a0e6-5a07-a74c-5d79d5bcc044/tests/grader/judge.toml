name = "S3"
type = "binary"
weight = 3
description = "Recipe: read `requirements.txt` and the import lines of every server module. Pass: no package or import for language processing, machine learning or a hosted model client appears in either."

[criterion.annotations]
channel = "source"
basis = "explicit"
