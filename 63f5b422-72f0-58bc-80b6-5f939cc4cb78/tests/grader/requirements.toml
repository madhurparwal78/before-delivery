text = "In the Navigator, the Alt+Arrow keys move, indent and outdent the focused node as defined in Interactions. Focus stays on the node's row, the canvas and the stored document update, and the moved notice or the refused-move notice is announced."
kind = "behavior"
primary = "pytest"
workflow = "place-reorder"
tests = [
