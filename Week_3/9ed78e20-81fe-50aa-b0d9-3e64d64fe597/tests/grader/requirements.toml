[[requirements]]
id = "DP-55"
title = "Candidate mail is addressed safely"
text = "Every candidate email has exactly one recipient, with the stored name as display name and the trimmed lowercased email as address, and a name or email carrying control characters or header delimiters is refused before anything is stored or sent."
kind = "behavior"
primary = "pytest"
