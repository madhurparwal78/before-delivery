title = "Operator isolation on every answer"
text = "Every list, search, count, review and map marker includes only records of the operator of the session that sent the request, however many sessions of however many operators are in flight at once on any app copy, and at 375 by 812 the signed-in screens show only that operator's name and figures."
kind = "behavior"
primary = "pytest"
workflow = "sign-in"
tests = [
    "test_app.py::test_operator_isolation_interleaved",
]
criteria = []
parameter_cases = []

