schema_version = "1.4"

[[artifacts]]
source = "/app"
exclude = [
    "node_modules",
    ".git",
]

[task]
name = "orrery-labs/orrery-studio"
version = "1.0.0"
description = "Orrery Studio: an enterprise browser workspace where brand and product teams author interactive 3D scenes with states and transitions, collaborate with people and governed AI agents under object locks and per-author undo, rewind an attributed operation log, review through capability links, schedule versioned publishes to embeds and exports, and pay through Kill Bill with trials, proration, seats and dunning."
authors = [
    { name = "Yash Handa", email = "yash.handaint17@ethara.ai" },
]
keywords = [
    "3d",
    "webgl",
    "scene-editor",
    "collaboration",
    "operation-log",
    "agents",
    "object-locks",
    "publishing",
    "billing",
    "killbill",
    "pocketbase",
    "minio",
    "multi-tenant",
    "typescript",
]

[metadata]
uuid_v5 = "bc33abaa-25cc-5ef9-a349-9a804ec1d208"
identity_namespace_url = "https://tasks.example/orrery-labs/orrery-studio/1.0.0"
category = "Greenfield"
domain = "enterprise 3D web scene authoring and publishing for product and brand teams"
archetype = "enterprise"
language = "typescript"
design_direction = "Drafted, tactile, exact: warm paper ground with a faint 8-pixel hairline grid behind every panel, near-black ink, cobalt for actions and selection, vermilion for alerts, putty rules; Space Grotesk display, IBM Plex Sans body, tabular mono numerals; heading steps a quarter larger each; compact density; pressed controls sink one pixel; editor as a three-column drafting table with a full-width operation-log ruler; public site on the same ruled grid with numbered margin rails."
created_at = "2026-10-28"
service_profile = "postgres+pocketbase+minio+killbill+mailpit"
harbor_version = "0.24.0"
grader_version = "rewardkit-0.2.3"
contract_version = "1.0.0"
requirements_registry = "tests/grader/requirements.toml"
mandatory_requirement_count = 60
workflow_count = 14
rubric_criterion_count = 23
rubric_total_weight = 85
if_constraint_count = 7
scoring_policy = "reward=pytest-outcome-pass-rate;if_score+rubric+quality+combined_score-separate;binary-rubric-5/3/1"
self_contained = true
builds_from_source = true
null_floor = 0.0
platforms = [
    "linux/amd64",
    "linux/arm64",
]

[agent]
timeout_sec = 21600.0
network_mode = "public"

[environment]
os = "linux"
cpus = 4
memory_mb = 4096
storage_mb = 20480
network_mode = "public"
build_timeout_sec = 3600.0

[verifier]
environment_mode = "separate"
timeout_sec = 21600.0

[verifier.env]
JUDGE_SECRET = "${JUDGE_SECRET:-}"
JUDGE_URL = "${JUDGE_URL:-http://host.docker.internal:8790}"
