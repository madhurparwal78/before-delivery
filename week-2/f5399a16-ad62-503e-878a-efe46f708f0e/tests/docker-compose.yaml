services:
  main:
    extra_hosts:
    - host.docker.internal:host-gateway
    security_opt:
    - seccomp=unconfined
    - systempaths=unconfined
    - apparmor=unconfined
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      wiremock:
        condition: service_healthy
  postgres:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_USER: gf_admin
      POSTGRES_PASSWORD: gf-admin-5c1e8a37
      POSTGRES_DB: postgres
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U gf_admin -d postgres
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  minio:
    image: coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    environment:
      MINIO_ROOT_USER: gf-root-6d29b4
      MINIO_ROOT_PASSWORD: gf-root-secret-a83f17c5
    command: server /data
    healthcheck:
      test:
      - CMD-SHELL
      - MC_HOST_local=http://gf-root-6d29b4:gf-root-secret-a83f17c5@localhost:9000 mc ready local >/dev/null
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    healthcheck:
      test:
      - CMD
      - /mailpit
      - readyz
      interval: 2s
      timeout: 5s
      retries: 30
  gotenberg:
    image: gotenberg/gotenberg:8.39.0@sha256:13672f317b443c793e972b1bd2155ec62a3e7b6891b411e8196442cc053ee5f5
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - -o
      - /dev/null
      - http://127.0.0.1:3000/health
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  wiremock:
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    entrypoint:
    - sh
    - -c
    - if [ -n "$$WIREMOCK_STUBS" ]; then printf '%s' "$$WIREMOCK_STUBS" > mappings/baseline.json; fi; exec /docker-entrypoint.sh
      --port 8080 --disable-banner --max-request-journal-entries 20000 --admin-api-basic-auth gfkit-admin:gfkit-wm-4fce2a657cbe2442
    healthcheck:
      test:
      - CMD
      - curl
      - -sf
      - -u
      - gfkit-admin:gfkit-wm-4fce2a657cbe2442
      - http://127.0.0.1:8080/__admin/health
      interval: 2s
      timeout: 5s
      retries: 60
    environment:
      WIREMOCK_STUBS: '{"mappings": [{"request": {"method": "GET", "urlPath": "/v2/tracks"}, "response": {"headers":
        {"Content-Type": "application/json"}, "jsonBody": {"nextCursor": null, "tracks": [{"composer": "Ilse Voss",
        "id": "hr-1001", "seconds": 30, "title": "Lantern Street"}, {"composer": "Joost Amani", "id": "hr-1002",
        "seconds": 15, "title": "Tidal Grid"}, {"composer": "Mina Oduya", "id": "hr-1003", "seconds": 60, "title":
        "Paper Harbour"}]}, "status": 200}}, {"request": {"method": "GET", "urlPath": "/v2/prices"}, "response":
        {"headers": {"Content-Type": "application/json"}, "jsonBody": {"prices": [{"perMarket": "120.00", "validFrom":
        "2026-01-01"}]}, "status": 200}}, {"request": {"method": "POST", "urlPath": "/v2/licences"}, "response":
        {"headers": {"Content-Type": "application/json"}, "jsonBody": {"licenceId": "lic-501"}, "status": 201}},
        {"request": {"method": "POST", "urlPath": "/v1/renders"}, "response": {"headers": {"Content-Type": "application/json"},
        "jsonBody": {"id": "rnd-1", "state": "queued"}, "status": 202}}, {"request": {"method": "GET", "urlPath":
        "/v1/renders/rnd-1"}, "response": {"headers": {"Content-Type": "application/json"}, "jsonBody": {"sha256":
        "a58537fe387c1985edd7165c243e84fec778a0c4e2766dabefe2157f966098ee", "size": 28, "state": "done", "url":
        "/files/rnd-1.bin"}, "status": 200}}, {"request": {"method": "GET", "urlPath": "/files/rnd-1.bin"}, "response":
        {"body": "QUAYMILL PREVIEW FILM rnd-1\n", "headers": {"Content-Type": "application/octet-stream"}, "status":
        200}}]}'
