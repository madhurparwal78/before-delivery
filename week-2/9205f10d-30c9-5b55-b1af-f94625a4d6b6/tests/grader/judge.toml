description = "Recipe: read type, function, module and table names across server and frontend source. An identifier that names one of the brief's domain concepts with a competing synonym (for example slot for seat, shift for segment, cert for credential, bill for charge, deadline for cutoff) counts as a defect; UI copy and paths that the brief itself specifies are not defects. Cite each as file:line. Pass: the code names its domain objects with the brief's terms throughout."

[criterion.annotations]
