[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "valkey-down"
port = 4174
url_env = "APP_VALKEY_DOWN_URL"

[outages.env]
VALKEY_URL = "redis://127.0.0.1:9/0"
DATABASE_URL = "${DATABASE_URL}_valkeydown"

[[outages]]
id = "gotenberg-down"
port = 4175
url_env = "APP_GOTENBERG_DOWN_URL"

[outages.env]
GOTENBERG_URL = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_gotenbergdown"

