[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "mailpit-down"
port = 4174
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[requirements]]
id = "DP-01"
title = "Run manifest and health check"
text = "`/app/run.json` installs, builds and serves the app on port 4173 or `APP_PUBLIC_PORT`, and `GET /api/health` answers as defined in API."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_health_and_manifest",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
