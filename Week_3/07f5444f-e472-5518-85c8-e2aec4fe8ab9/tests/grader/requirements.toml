id = "DP-51"
title = "Publish blockers from the server clock"
text = "Every programme read carries the publish blockers the server's own publish check finds at that moment, and the Publish folders dialog lists them and allows Publish only when the list is empty, whatever the browser's clock or time zone."
kind = "behavior"
primary = "pytest"
workflow = "publish-folders"
tests = [
    "test_app.py::test_wf_publish_folders_wrong_clock",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-52"
title = "Storage state updates screens in place"
text = "Each status check that reports the score store down or back up disables or re-enables upload buttons and swaps a player's Open marked part link for the unavailable copy in place, keeping the page, focus, open dialogs and typed values."
kind = "behavior"
primary = "pytest"
workflow = "store-outage"
tests = [
    "test_app.py::test_wf_store_outage_in_place",
]
criteria = []
parameter_cases = []

[[if_rules]]
id = "IF-01"
text = "/app/run.json exists, is valid JSON with exactly the keys _schema (value run-manifest-v1), install, build and serve, and every value is a string."
tests = [
    "test_app.py::test_if_run_manifest",
]
parameter_cases = []

[[if_rules]]
id = "IF-02"
text = "/app/THIRD_PARTY_NOTICES.md names every shipped package, meaning the production dependency tree reported by npm ls --omit=dev --all --json, with its version and licence, plus each bundled font and the Lucide icon set."
tests = [
    "test_app.py::test_if_third_party_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Every shipped package (the production dependency tree reported by npm ls --omit=dev --all --json), font and icon set is under MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD or SIL OFL 1.1."
tests = [
    "test_app.py::test_if_licences",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "Application state is stored only in the provided Postgres database and MinIO bucket: no SQLite, Redis, embedded database, or state files on local disk."
tests = [
    "test_app.py::test_if_no_extra_datastore",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "The provided service configuration (the compose files and the dev credentials in them) is left unchanged."
tests = [
    "test_app.py::test_if_service_config_untouched",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "Server and client source is TypeScript. JavaScript files appear only as build output or tool configuration."
tests = [
    "test_app.py::test_if_typescript_source",
]
parameter_cases = []

[[if_rules]]
id = "IF-07"
text = "The client loads no script, style, font or image from a third-party origin at run time."
tests = [
    "test_app.py::test_if_same_origin_assets",
]
parameter_cases = []

