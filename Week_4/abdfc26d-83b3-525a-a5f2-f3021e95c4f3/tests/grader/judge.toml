[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: Find where the server builds its configuration (search for `process.env`) and trace every connection to Postgres, Keycloak, Kill Bill, MinIO, RabbitMQ, the provider, SMTP and Gotenberg back to it. Search the whole source for host names, ports of those services, usernames, passwords, keys and secrets as literals. The documented app port 4173 and the timer and queue defaults are allowed. Cite each literal as `file:line`. Pass: every service URL and credential is read from its named environment variable without a literal fallback."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-05",
]
evidence = "file_line"
cites = "L685-L687, L696"

