weight = 5
description = "Recipe: find where booking, share, guarantee and match state transitions are decided, where the order of error checks is applied, where the idempotent answer kinds to store are chosen, where the return-path rule is applied, and where the error body is built from the catalogue. Each duplicated decision is a defect, cited as `file:line`. Pass: each of these rules has one deciding function or table that every caller uses."

