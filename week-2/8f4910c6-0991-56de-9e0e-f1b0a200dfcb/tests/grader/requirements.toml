[[if_rules]]
id = "IF-01"
text = "/app/run.json contains exactly the string keys _schema (value run-manifest-v1), install, build and serve."
tests = [
    "test_app.py::test_if_run_manifest",
]
parameter_cases = []

[[if_rules]]
id = "IF-02"
text = "/app/THIRD_PARTY_NOTICES.md names every shipped package with its version and licence; shipped packages means the production dependency tree from npm ls --omit=dev --all --json."
tests = [
    "test_app.py::test_if_third_party_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Every shipped package, and both fonts, use one of MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD or OFL-1.1; a package whose licence is an SPDX `OR` expression counts when any of its choices is on this list."
tests = [
    "test_app.py::test_if_licence_allowlist",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "The app uses no datastore other than the provided PostgreSQL database and MinIO bucket: no SQLite, no Redis, no data files written to disk."
tests = [
    "test_app.py::test_if_no_extra_datastore",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "Fraunces and Hanken Grotesk are bundled with the app, and no page requests fonts, scripts or styles from another host."
tests = [
    "test_app.py::test_if_fonts_bundled",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "`/app`, outside `node_modules`, ships no Docker Compose file of its own (no file named `compose*.yml`, `compose*.yaml`, `docker-compose*.yml` or `docker-compose*.yaml` at any depth) and no env file (no file named `.env` or `.env.*` at any depth other than `.env.example`)."
tests = [
    "test_app.py::test_if_service_config_unchanged",
]
parameter_cases = []

[[if_rules]]
id = "IF-07"
text = "package-lock.json is committed, and npm ci installs from it."
tests = [
    "test_app.py::test_if_lockfile",
]
parameter_cases = []

