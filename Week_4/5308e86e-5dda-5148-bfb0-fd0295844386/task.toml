[task]
name = "deku/tallwind-banking-cockpit"
version = "1.0.0"
description = "A calm business banking cockpit and companion-styled marketing site on PostgreSQL: integer-cent balances with approval holds, single and dual approvals with server-dated New York business-day expiry, per-method cutoffs and a server-decided settlement preview, a Send payment draft in the address that resumes after a forced sign-out, a live feed with literal latest-answer search, durable resumable streams on bounded connections, idempotent race-safe money movement, a database-enforced hash-chained audit trail, request-scoped signed-in state, and keyboard-complete, screen-reader-named interfaces."
authors = [
    { name = "Atharv Mahalwar", email = "atharv.mahalwar@ethara.ai" },
    { name = "Shivam Choudhary", email = "shivam.choudhary@ethara.ai" },
]
keywords = [
    "fintech",
    "dashboard",
    "banking",
    "payments",
    "approvals",
    "postgresql",
    "concurrency",
    "idempotency",
    "accessibility",
    "dst",
    "sse",
]

