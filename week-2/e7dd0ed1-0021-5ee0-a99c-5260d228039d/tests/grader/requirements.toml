Q3 = 5
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "short-timers"
port = 4175
url_env = "APP_SHORT_URL"

[outages.env]
FARSHORE_DAY_SECONDS = "4"
FARSHORE_LIFECYCLE_SWEEP_SECONDS = "1"
FARSHORE_WEBHOOK_BACKOFF_SECONDS = "1"
FARSHORE_STEP_UP_SECONDS = "20"
FARSHORE_KEY_ROTATION_OVERLAP_SECONDS = "8"
FARSHORE_TWO_STEP_PENDING_SECONDS = "90"
DATABASE_URL = "${DATABASE_URL}_short_timers"
S3_BUCKET = "${S3_BUCKET}-short-timers"

[[outages]]
id = "short-sessions"
port = 4176
url_env = "APP_SHORT_SESSIONS_URL"

[outages.env]
FARSHORE_SESSION_IDLE_SECONDS = "6"
FARSHORE_SESSION_LIFETIME_SECONDS = "20"
DATABASE_URL = "${DATABASE_URL}_short_sessions"
S3_BUCKET = "${S3_BUCKET}-short-sessions"

[[requirements]]
