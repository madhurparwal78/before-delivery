[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: find the server configuration module and every place that opens a connection to Postgres, MinIO, Kill Bill or SMTP. Trace each URL, host, port, bucket, region, key, username, password, API key, API secret and sender address back to `process.env`. The documented port default 4173 for APP_PUBLIC_PORT is allowed. Cite each read and each violation as `file:line`. Pass: every service location or credential value traces to its named environment variable with no literal host, URL, bucket, credential or sender address used as a value or fallback."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-55",
]
evidence = "file_line"
cites = "L84, L722, L797, L799-L808"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: read the browser source (components, client API helpers, build config such as a Vite `define` or `import.meta.env` usage) and the server handlers that render HTML or JSON. Check whether any service URL or credential, or the config object holding them, is imported into browser code, injected at build time or serialised into a page or response. Cite each config import site and any leak as `file:line`. Pass: no service location or credential can reach the browser."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-55",
]
evidence = "file_line"
cites = "L84, L808, L814"

