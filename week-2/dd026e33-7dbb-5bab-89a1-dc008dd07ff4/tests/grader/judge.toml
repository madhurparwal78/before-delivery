id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server configuration module and every `process.env` reference, then search all source (not lockfiles) for literal database URLs, S3 endpoints or keys, Kill Bill URLs, usernames, passwords, API keys or secrets, SMTP hosts or ports, and check whether any browser source imports server configuration or embeds environment values at build time. Pass: each credential or service URL is read only from the environment (literal defaults appear only for port 4173, an empty Kill Bill key prefix and the three documented timer defaults) with no path from browser source to those values."

[criterion.annotations]
