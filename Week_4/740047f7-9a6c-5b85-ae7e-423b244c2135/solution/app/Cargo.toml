[package]
name = "pensight"
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "macros", "tokio"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
deadpool-postgres = "0.14.2"
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "signal", "fs"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1", "with-chrono-0_4"] }
tokio-stream = { version = "0.1.19", features = ["sync", "time"] }
unicode-segmentation = "1.13.3"

[profile.release]
opt-level = 2
codegen-units = 16
debug = false
