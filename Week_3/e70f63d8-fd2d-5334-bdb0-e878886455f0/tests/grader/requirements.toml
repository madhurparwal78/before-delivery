[[requirements]]
id = "DP-01"
title = "Keyboard scoring"
text = "With focus anywhere on the scoring page outside a text field, select or open dialog, the keys of Scoring controls record runs, arm and disarm extras, open the Wicket and Retire batter dialogs and undo, exactly like the pad buttons."
