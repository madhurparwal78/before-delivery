description = "Recipe: 1. Find the frontend source root from the build config. 2. Grep that root for `process.env`, `import.meta.env`, `DATABASE_URL`, `KILLBILL_`, `S3_`, `SMTP_` and `MAIL_FROM`. 3. Read the server code that serves the HTML shell and check whether it injects configuration into the page. 4. Cite each defect as `file:line`. Pass: no frontend source file or server-rendered page reads or embeds a service URL or credential."

