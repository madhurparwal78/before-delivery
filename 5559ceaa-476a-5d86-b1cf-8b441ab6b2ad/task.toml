schema_version = "1.4"

[[artifacts]]
source = "/app"
exclude = [
    "node_modules",
    ".git",
    ".venv",
    "venv",
]

[task]
name = "lanternwork/relay-bench"
version = "1.0.0"
description = "Relay Bench, a live coding room for freelance coding mentors: a server-enforced single driver (the baton) with an animated handoff, provider-confirmed checkpoints in MinIO with byte-exact restore and damage checks, safe zip import plans with server-set expiry, rename propagation that keeps in-flight typing, private reviewer links, and learner erasure, on Postgres, MinIO and Mailpit."
authors = [
    { name = "Dishita Arya", email = "dishita.aryaint17@ethara.ai" },
]
keywords = [
    "collaborative-editor",
    "mentorship",
    "websocket",
    "concurrency",
    "object-storage",
    "checksums",
    "magic-link",
    "zip-import",
    "capability-links",
    "erasure",
    "responsive",
    "motion",
]

[metadata]
uuid_v5 = "5559ceaa-476a-5d86-b1cf-8b441ab6b2ad"
identity_namespace_url = "https://tasks.example/lanternwork/relay-bench/1.0.0"
category = "Greenfield"
domain = "independent coding mentorship"
archetype = "individual"
language = "typescript"
design_direction = "Nocturnal graphite ground over nine tenths of the surface, warm off-white ink, one amber accent reserved for whoever is driving, narrow literary serif for session titles, technical sans body and monospaced numerals; compact three-column workspace with a presence rail, an editor with a gutter write-stripe, and a hairline-ruled checkpoint ledger."
created_at = "2026-10-29"
seed = "prd"
service_profile = "postgres+minio+mailpit"
harbor_version = "0.24.0"
grader_version = "gfkit-0.1.0/rewardkit-0.2.3"
contract_version = "1.0.0"
requirements_registry = "tests/grader/requirements.toml"
mandatory_requirement_count = 45
workflow_count = 11
rubric_criterion_count = 23
rubric_total_weight = 79
if_constraint_count = 7
scoring_policy = "reward=pytest-outcome-pass-rate;if_score+rubric+quality+combined_score-separate;binary-rubric-5/3/1"
self_contained = true
builds_from_source = true
null_floor = 0.0
platforms = [
    "linux/amd64",
    "linux/arm64",
]

[agent]
timeout_sec = 36000.0
network_mode = "public"

[environment]
os = "linux"
cpus = 4
memory_mb = 4096
storage_mb = 20480
network_mode = "public"
build_timeout_sec = 3600.0

[verifier]
environment_mode = "separate"
timeout_sec = 36000.0

[verifier.env]
JUDGE_SECRET = "${JUDGE_SECRET:-}"
JUDGE_URL = "${JUDGE_URL:-http://host.docker.internal:8790}"
