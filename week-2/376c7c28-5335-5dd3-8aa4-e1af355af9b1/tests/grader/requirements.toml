parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "Every file under /app/src/, and every build or setup script the run manifest executes directly or through an npm script, is TypeScript (.ts, .tsx, .mts or .cts); plain JavaScript appears only in generated build output and in configuration files a tool reads itself."
