weight = 5
description = "Recipe: Read the server entry module and follow its four provider adapters: the roadworthiness-record pull, the object-store upload and file read, the PDF render and the phone alert, tracing each from its route handler to the outgoing call, and cite every defect as file:line. Pass: each of those four adapters sends a real network request to an address read from the process environment, so an inlined sample record, pre-made PDF bytes or a short-circuit that never calls the provider fails."

