schema_version = 1
id_prefix = "DP"
mandatory_count = 60
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "keyboard-finish",
    "notes-undo",
    "mistakes-second-chance",
    "hint-order",
    "highlight-selection",
    "clock-score-motion",
    "phone-pad",
    "daily-streak",
    "leaderboard-live",
    "duel-play",
    "duel-rejoin",
    "verified-results",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "S4",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 87
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "valkey", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Seam <atelier@seam.example>" } },
]

[criterion_weights]
B1 = 5
B2 = 5
B3 = 3
B4 = 5
B5 = 3
B6 = 5
B7 = 3
B8 = 5
B9 = 3
B10 = 3
B11 = 3
B12 = 3
S1 = 5
S2 = 5
S3 = 3
S4 = 3
Q1 = 5
Q2 = 3
Q3 = 5
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "valkey-down"
port = 4174
url_env = "APP_VALKEY_DOWN_URL"

[outages.env]
VALKEY_URL = "redis://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"
MAILPIT_URL = "http://127.0.0.1:9"

[[outages]]
id = "duel-short"
port = 4176
url_env = "APP_DUEL_SHORT_URL"

[outages.env]
DUEL_COUNTDOWN_MS = "1000"
DUEL_REJOIN_MS = "3000"
DUEL_TIE_MS = "4000"
DATABASE_URL = "${DATABASE_URL}_duelshort"

