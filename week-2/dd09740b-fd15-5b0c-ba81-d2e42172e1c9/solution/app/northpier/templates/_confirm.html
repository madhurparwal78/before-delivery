<div class="confirm" tabindex="-1">
  <h2 class="statement confirm-heading">Thanks, <span data-slot="first">{{ first_name }}</span>. We have your inquiry.</h2>
  <p class="body">Reference <span data-slot="reference">{{ sent.reference }}</span></p>
  <p class="body muted">Keep this link to follow your inquiry:</p>
  <div class="linkbox">
    <label class="sr-only" for="status-link">Status link</label>
    <input id="status-link" class="field-input" type="text" readonly value="{{ sent.status_url }}" data-slot="url">
    <button type="button" class="pillbutton solid copy">Copy link</button>
  </div>
  <p class="body"><a class="link solo" href="{{ sent.status_url }}" data-slot="href">Open status page</a></p>
</div>
