[[criterion]]
id = "Q6"
name = "Q6"
type = "binary"
weight = 3
description = "Recipe: list every TypeScript interface implemented by classes, every abstract class, wrapper module and factory function in the server and client, and count their implementations or products. A repository-style interface with one class, a factory class that produces only one concrete type, or a factory function whose only job is to return the sole implementation of an interface or abstract class counts as a fail, while a plain function that builds a concrete value from its arguments or the environment, such as a shared API error helper or a service client configured from env values, is not counted; cite each fail as file:line. Pass: no interface, wrapper or factory has only a single implementation."

[criterion.annotations]
