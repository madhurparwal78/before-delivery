description = "Recipe: `source` MCP. For each rule find every place that decides it: stage, tender, variation, snag and case-study transitions, the levelled total, retention, the store split, the review due date, the defects end date, revision lettering, the finishes matching. A rule re-implemented in a second route, the client or SQL counts as a fail; cite both copies as file:line. Rendering controls from server-provided state is not a second decision, and neither is a SQL lock or compare-and-set guard that enforces the rule function's decision. Pass: each listed rule is decided in exactly one function or module that every caller uses."

