[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_minio_down"
S3_BUCKET = "${S3_BUCKET}-minio-down"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"
DATABASE_URL = "${DATABASE_URL}_mail_down"
S3_BUCKET = "${S3_BUCKET}-mail-down"

[[outages]]
id = "short-timer"
port = 4176
url_env = "APP_SHORT_URL"

[outages.env]
ESCALATION_SECONDS = "20"
SIGN_IN_WINDOW_SECONDS = "60"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
id = "DP-01"
title = "Role landing after sign-in"
text = "Signing in lands the principal surveyor on `/fleet`, the launch technician on `/launch` and the client reviewer on `/surveys`, or on the user's restored last screen as qualified in Business rules, and reloading that address shows the same screen."
kind = "behavior"
primary = "workflow"
workflow = "sign-in"
tests = [
    "test_app.py::test_wf_sign_in_landing",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Sessions and role permissions"
text = "Sign-in, session refresh, sign-out and the current-user endpoints behave as listed in API, and every endpoint enforces the permission table in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "sign-in"
tests = [
    "test_app.py::test_dp02_sessions_and_permissions",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Deep links and safe return"
text = "Opening a screen address while signed out shows sign-in and then lands on that address only when the safe-return rule in Business rules accepts it, and every off-site, protocol-relative, backslash, encoded, API or forbidden address lands on the role's home."
kind = "behavior"
primary = "pytest"
workflow = "sign-in"
tests = [
    "test_app.py::test_dp03_safe_return",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Sign-in attempt limit"
text = "Five failed sign-ins for one email within the attempt window lock that email with 429 `too_many_attempts` until one window after the fifth failure, even with the right password, counted atomically and identically for unknown emails, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "sign-in"
tests = [
    "test_app.py::test_dp04_sign_in_limit",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-05"
title = "Switching accounts on a shared device"
text = "Sign-out revokes the session server-side, the browser drops every record, announcement and held dialog of the previous account, and the next account never sees a survey, count or name of the previous one, even from a late response or the Back button."
kind = "behavior"
primary = "pytest"
workflow = "sign-in"
tests = [
    "test_app.py::test_dp05_shared_device",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-06"
title = "Idle sign-out with a warning"
text = "After 28 minutes without input a signed-in screen warns with a two-minute countdown dialog that `Stay signed in` or Escape dismisses, and at zero signs out and returns to sign-in with the published copy, as qualified in Feedback states."
kind = "behavior"
primary = "pytest"
workflow = "sign-in"
tests = [
    "test_app.py::test_dp06_idle_sign_out",
]
criteria = []
parameter_cases = []

