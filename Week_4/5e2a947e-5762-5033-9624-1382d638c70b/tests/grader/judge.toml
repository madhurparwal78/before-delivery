weight = 3
description = "Recipe: `playwright` at 1280x800, open `/`, screenshot the top of the page and read the `banner` height with browser_evaluate, then scroll to the second feature block, screenshot again and read the `banner` height again. Pass: the shrinking top bar measures shorter after the scroll than at the top, with the Sprigmap logo link at its left and Sign in then Get started at its right."

