[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read `/app/run.json` and `package.json`, find the server entry, and list every `process.env` read and every literal that looks like a host, port, URL, key, password, bucket or database name. Allow every default the brief documents (the port and its override, the timer and limit defaults, the grading switch being off). The brief's fixed constants (`live_poll_ms` 1000, the 50-result search cap, the 500-entry console, the 24-hour idempotency retention) are not limits it puts in the environment, so they may be constants. A hard-coded address or credential, or one of the environment variables the brief names read from anywhere but the environment, is a defect, cited as `file:line`. Pass: every service address, credential, and every timer and limit the brief names as an environment variable, is read from the environment at start, with no hard-coded value besides the brief's documented defaults and constants."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-07",
]
evidence = "file_line"
cites = "L36, L667-L682, L733-L747"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: trace the save-version path from its route handler to the storage and database calls, then check restore, fork, the grading seed and export use the same snapshot code. A snapshot served from memory, a database column or the request body, a skipped read-back, or a hash computed from the submitted bytes instead of the bytes fetched back, is a defect, cited as `file:line`. Pass: a save writes the snapshot object to the bucket at its version key, reads it back, compares its hash, and only then inserts the version row."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-07",
]
evidence = "file_line"
cites = "L36, L537-L538, L671-L672"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: search the client source for preview-delay, search-debounce, draft-interval and loop-limit constants, for the code that renders like counts, fork counts, version labels and the verification banner, and for the config fetch. A numeric literal standing in for a configured timer or limit, or a displayed count or state that is set in the client and never confirmed by a server response or event, is a defect, cited as `file:line`. Pass: no timer, limit, count, version number or verification state shown by the client originates in client code rather than the server."

[criterion.annotations]
