id = "DP-12"
title = "Storage outage reported honestly"
text = "While storage is unreachable, pushes, restores, publishes, preview links and takedowns are refused with the storage-unavailable answer, a refused publish leaves the previously live dossier unchanged, a refused takedown leaves the dossier offline as qualified in Business rules, and the app shows the sync-paused copy with the queued revision count."
kind = "behavior"
primary = "pytest"
workflow = "provider-outages"
tests = [
    "test_app.py::test_storage_outage_refusals",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-13"
title = "Queued revisions resume by themselves"
text = "Revisions queued during a storage outage stay on the device across reloads and are pushed in order at the client's next retry once storage answers, with no server restart and no user action."
kind = "behavior"
primary = "pytest"
workflow = "provider-outages"
tests = [
    "test_app.py::test_wf_provider_outages_storage_resume",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-14"
title = "Billing outage keeps the last known plan"
text = "While Kill Bill is unreachable, plan changes are refused with the billing-unavailable answer and change nothing, and pushes and publishes use the account's last known entitlement, or get the billing-unavailable answer when none is known."
kind = "behavior"
primary = "pytest"
workflow = "provider-outages"
tests = [
    "test_app.py::test_billing_outage_last_known_plan",
    "test_app.py::test_wf_provider_outages_billing_ui",
]
criteria = []
parameter_cases = []

