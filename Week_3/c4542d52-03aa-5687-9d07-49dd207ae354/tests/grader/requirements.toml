[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "provider-down"
port = 4174
url_env = "APP_PROVIDER_DOWN_URL"

[outages.env]
WIREMOCK_URL = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_provider_down"
S3_BUCKET = "${S3_BUCKET}-provider-down"

[[outages]]
id = "vault-down"
port = 4175
url_env = "APP_VAULT_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_vault_down"

[[outages]]
id = "short-windows"
port = 4176
url_env = "APP_SHORT_URL"

[outages.env]
OFFER_WINDOW_SECONDS = "20"
LEAVER_WINDOW_SECONDS = "90"
OFFER_WARNING_SECONDS = "10"
LEAVER_WARNINGS_SECONDS = "60,30"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
id = "DP-01"
title = "Sign-in and holder portal"
text = "A seeded option holder signs in with email and password and lands on the two-by-two portal board, which shows their first name, their vested-today count out of total options and their next tranche date, all from the server."
kind = "behavior"
primary = "workflow"
workflow = "portal-vesting"
tests = [
    "test_app.py::test_wf_portal_vesting_board",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Vesting schedule on the server date"
text = "Accepted grants vest in whole options by the published floor rule (a one-year cliff then monthly, or monthly with no cliff), counted on Tidecraft's server date in Pacific time."
kind = "behavior"
primary = "pytest"
workflow = "portal-vesting"
tests = [
    "test_app.py::test_vesting_floor_rule",
]
criteria = []
parameter_cases = [
    "standard_before_cliff",
    "standard_after_cliff",
    "monthly_no_cliff",
]

[[requirements]]
id = "DP-03"
title = "Month-end tranche dates"
text = "A vesting start on the 29th, 30th or 31st vests on the last day of each shorter month, and every tranche date in the API and on the ribbon follows this rule."
kind = "behavior"
primary = "pytest"
workflow = "portal-vesting"
tests = [
    "test_app.py::test_month_end_tranche_dates",
]
criteria = []
parameter_cases = [
    "start_31st_seed",
    "start_30th",
    "start_29th",
]

[[requirements]]
id = "DP-04"
title = "Tranche ribbon"
text = "The grant page draws the whole ribbon on first load: one cliff cell spanning 12 months, then one cell per monthly tranche, each labelled with its true date, with server-vested cells filled red. A tranche that vests while the page is open fills without a reload."
kind = "behavior"
primary = "pytest"
workflow = "portal-vesting"
tests = [
    "test_app.py::test_wf_portal_vesting_ribbon",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-05"
title = "Projection marker"
text = "A slider moves month by month with the arrow keys, Page Up and Page Down, Home and End. It announces the marker date and shows the server's vested count, cost at strike and vested ownership for that month, while the server's today stays marked."
kind = "behavior"
primary = "pytest"
workflow = "portal-vesting"
tests = [
    "test_app.py::test_wf_portal_vesting_marker",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-06"
title = "Device clock never decides"
text = "With the browser clock or time zone set days away from the server's, every vested count, tranche state, offer status and countdown on screen equals what the API returns."
kind = "behavior"
primary = "pytest"
workflow = "portal-vesting"
tests = [
    "test_app.py::test_wf_portal_vesting_device_clock",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-07"
title = "Grant issue journey"
text = "The founder admin drafts a grant from the keyboard (holder, options, strike, vesting type radio group, typed start date) and submits it to the board. Two board members approve it, and the founder admin sends the offer."
kind = "behavior"
primary = "workflow"
workflow = "grant-board"
tests = [
    "test_app.py::test_wf_grant_board_issue_journey",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-08"
title = "Grant validation"
text = "Submitting a grant requires a whole positive number of options within the available pool, a strike at or above the current fair market value and a valid typed vesting start, with field errors as published in the API."
kind = "behavior"
primary = "pytest"
workflow = "grant-board"
tests = [
    "test_app.py::test_grant_validation",
]
criteria = []
parameter_cases = [
    "options_zero",
    "options_string",
    "pool_exhausted",
    "strike_below_fmv",
    "strike_equal_fmv",
    "start_impossible",
    "start_before_2015",
    "start_after_limit",
    "start_at_limit_ok",
    "holder_other_role",
    "holder_unknown",
    "vesting_type_bad",
]

[[requirements]]
id = "DP-09"
title = "Board quorum voting"
text = "Each board member votes once each time a grant is in the queue. A majority of approvals moves the grant to Approved and a majority of declines returns it to Draft, exactly once even under simultaneous votes."
kind = "behavior"
primary = "pytest"
workflow = "grant-board"
tests = [
    "test_app.py::test_board_quorum_voting",
    "test_app.py::test_board_simultaneous_votes",
]
criteria = []
parameter_cases = []

