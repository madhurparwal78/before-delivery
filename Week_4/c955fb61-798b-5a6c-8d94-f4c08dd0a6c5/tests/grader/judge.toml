cites = "L871"

[[criterion]]
id = "Q2"
name = "Q2"
type = "binary"
weight = 5
description = "Recipe: read the client source for the Gantt, List, Workload, Timeline and progress sheet code. Search for `new Date(`, `Date.now`, `getDay`, date addition, and any computation of critical, float, late, rollup, variance or moved count. A defect is the client deriving an end date, shown start, critical flag, late flag, group percent, variance or moved count, or reading its own clock for today. Turning a server date into a column offset for drawing is not a defect, and neither is the snapped start and end previewed in the drag tip and the in-flight bar while a drag or key edit waits for the server (the brief requires that preview). Cite each as `file:line`. Pass: the client derives no schedule value and reads no browser clock for dates."

