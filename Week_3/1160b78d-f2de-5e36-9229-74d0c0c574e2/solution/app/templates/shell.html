<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Switchlamp</title>
<link rel="preload" href="/assets/fonts/lexend-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/lexend-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/darker-grotesque-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="/assets/css/pages/{{.Page}}.css">
<script type="importmap">{"imports":{"preact":"/assets/vendor/preact.mjs","preact/hooks":"/assets/vendor/hooks.mjs","htm":"/assets/vendor/htm.mjs"}}</script>
</head>
<body class="app" data-page="{{.Page}}">
<a class="skip" href="#root">Skip to content</a>
<header class="topbar">
  <a class="brand" href="/oncall">Switchlamp</a>
  <nav aria-label="Main">
    <ul>{{range .Nav}}<li><a href="{{.Href}}"{{if .Current}} aria-current="page"{{end}}>{{.Label}}</a></li>{{end}}</ul>
  </nav>
  <button type="button" class="signout" data-sign-out>Sign out</button>
</header>
{{if .Staff}}<div role="status" aria-label="Notices for you" class="notices" id="notices">{{.Needing}} incidents need you</div>{{end}}
<div role="status" aria-live="polite" aria-label="Live updates" class="sr-only" id="live"></div>
<main id="root" class="page" data-page="{{.Page}}"></main>
<footer class="closing-field"><p>Tarecross Software · Switchlamp on-call desk</p></footer>
<script type="application/json" id="boot">{{.Boot}}</script>
<script type="module" src="/assets/js/main.js"></script>
</body>
</html>
