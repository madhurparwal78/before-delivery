description = "Recipe: 1. Trace where each rule is decided: the role permission table, visibility, first decision wins, share expiry, idle presence, suggestion crediting and the save state. 2. Check whether HTTP routes and socket handlers reach the same decision code. 3. For any rule re-implemented in a second place (for example an inline role check that duplicates the table), cite both locations as file:line. Pass: each of these rules is decided in exactly one place in the source."

[criterion.annotations]
