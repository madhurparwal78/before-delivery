description = "Recipe: trace the deposit credit, order placement with its hold, matching with fills and fees, cancel, liquidation and settlement payout paths to their database writes. A balance change committed outside the transaction that writes its journal entry, or an outgoing-queue row written in a separate transaction, is a defect; cite each. Pass: every balance-changing path writes its balances, journal entry and outgoing queue rows inside one database transaction."

