text = "An import is accepted only as diagram XML or SVG judged by content, and a file whose parsed and decoded document holds a DOCTYPE, script, event handler, foreign object, external reference, link-rewriting animation, unsafe link or style url or import is rejected before anything is stored or reaches the canvas."
