[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: `source` MCP. 1) Read the server configuration module. 2) Read every place that builds the database pool, the billing client, the photo storage client and the mail transport. 3) Trace each URL, host, port, username, password, API key, API secret, bucket, region and access key back to the environment variable names in Configuration and secrets, allowing the defaults the brief documents (port 4173, pickup window 172,800 seconds, reminder lead 86,400 seconds). 4) Cite each environment read and any literal credential or service address as `file:line`. Pass: every service URL and credential comes from those environment variables with no literal credential or service address in source."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
