[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: 1. Read the settings or start-up module. 2. Read each place that connects to PostgreSQL, Keycloak or SMTP. 3. Trace each service variable the brief lists to its environment read. 4. Allow the brief's documented defaults: port 4173, 86400 for IDEMPOTENCY_KEY_TTL_SECONDS and 300 for LOGIN_FAILURE_WINDOW_SECONDS, plus the listen address 0.0.0.0, the outbound placeholder addresses for Start for free, Book a demo and the plans' links, seeded press and resource links, the seeded password and seeded account emails in start-up seeding and the fixed Message-ID domain. 5. Cite any other literal host, port, secret, password or sender as file:line. Pass: each service URL, host, port, client id, secret and sender is read from its environment variable."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-59",
]
evidence = "file_line"
cites = "L171, L1164-L1167"

