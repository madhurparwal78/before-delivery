services:
  main:
    extra_hosts:
    - host.docker.internal:host-gateway
    security_opt:
    - seccomp=unconfined
    - systempaths=unconfined
    - apparmor=unconfined
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      mailpit:
        condition: service_healthy
  postgres:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_USER: gf_admin
      POSTGRES_PASSWORD: gf-admin-5c1e8a37
      POSTGRES_DB: postgres
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U gf_admin -d postgres
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  valkey:
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    command:
    - valkey-server
    - --requirepass
    - gfkit-valkey-admin
    - --save
    - ''
    - --appendonly
    - 'no'
    healthcheck:
      test:
      - CMD
      - valkey-cli
      - -a
      - gfkit-valkey-admin
      - --no-auth-warning
      - ping
      interval: 2s
      timeout: 5s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    healthcheck:
      test:
      - CMD
      - /mailpit
      - readyz
      interval: 2s
      timeout: 5s
      retries: 30
