description = "Recipe: Locate the functions that compute adjusted and indexed time (cone penalty, factor product, half-up rounding), the rank-change badge text, the season points, the CSV formula-character neutralisation and the protest-window open check. Search the source, client screens included, for the cone penalty constant, the badge prefixes `Up `, `Down `, `Holds P` and `New P`, the formula characters `=`, `+`, `-`, `@`, the 100-times points expression, and comparisons of server time with the window close time. Any second implementation fails, cite each as `file:line`. Pass: each of the five computations is written in exactly one function that all other code calls."

