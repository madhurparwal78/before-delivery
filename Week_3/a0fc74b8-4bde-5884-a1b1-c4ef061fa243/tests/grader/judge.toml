id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server configuration module and every place that opens the PostgreSQL pool, the S3 client and the SMTP transport, plus the grading-key check. The brief's documented port 4173 default and documented MAIL_FROM fallback are allowed. Cite each env read as file:line and cite any literal host, bucket or credential as a failure. Pass: every service address, credential, public URL and grading key is read from its published environment variable."

