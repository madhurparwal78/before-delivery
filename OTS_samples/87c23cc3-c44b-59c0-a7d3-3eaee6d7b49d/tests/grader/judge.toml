type = "binary"
weight = 3
description = "Recipe: 1. Search the source for every place that sets an error status or writes an object with `error` and `message` fields. 2. Check whether each goes through one builder. A route that writes its own error literal is a defect; cite each as `file:line`. Pass: every API error body is built by one function using the published shape."

