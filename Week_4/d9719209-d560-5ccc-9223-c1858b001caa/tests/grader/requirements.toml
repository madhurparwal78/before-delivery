[[requirements]]
id = "DP-01"
title = "Keyboard sign-up and email confirmation"
text = "At 375 px wide a visitor completes sign-up with the keyboard alone. They see field errors tied to their fields, with focus on the first invalid one, and reach the \"check your inbox\" screen. They cannot vote until they open the verification link from the mail; after that their vote counts and is announced."
kind = "behavior"
primary = "workflow"
workflow = "signup-verify"
tests = [
    "test_app.py::test_wf_signup_verify_keyboard_happy",
    "test_app.py::test_wf_signup_verify_invalid_recovery",
    "test_app.py::test_wf_signup_verify_resend",
    "test_app.py::test_wf_signup_verify_both_taken_focus",
    "test_app.py::test_wf_signup_verify_resend_limit_announced",
]
criteria = [
    "B9",
]
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Account and verification rules"
text = "Sign-up, verification, resend and the unverified gate follow the account rules in Business rules, and the verification mail is recorded in Mailpit as described in Services."
kind = "behavior"
primary = "pytest"
workflow = "signup-verify"
tests = [
    "test_app.py::test_signup_validation_and_conflicts",
    "test_app.py::test_unverified_gate_and_verification",
    "test_app.py::test_verify_resend_limit",
    "test_app.py::test_verify_link_expiry",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Voting across open tabs"
text = "A member votes by pointer and by keyboard (a, z, Enter, Space). They see aria-pressed and the score change at once, with the vote announcement, and can switch and undo. The state survives a reload, and a second member's open tab shows every new score within 3 seconds."
kind = "behavior"
primary = "workflow"
workflow = "vote-score"
tests = [
    "test_app.py::test_wf_vote_score_keyboard_across_tabs",
    "test_app.py::test_wf_vote_score_rate_limit_rollback",
    "test_app.py::test_wf_vote_score_signed_out_prompt",
]
criteria = [
    "B4",
    "B5",
]
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "One stored vote per member"
text = "Votes made with PUT keep one row per member per target, so repeating a vote changes nothing and switching moves the score by exactly 2. Score, comment count and hot rank change in the same transaction as the row, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "vote-score"
tests = [
