[[requirements]]
id = "DP-01"
title = "Offer a ride form"
text = "A driver with verified ID builds a ride on the `Offer a ride` page using only the keyboard: city comboboxes, stopovers that can be moved, removed and restored with Undo, the date grid, departure time, seat and price steppers and booking mode, with every announcement given in Interactions."
kind = "behavior"
primary = "workflow"
workflow = "publish-ride-keyboard"
tests = [
    "test_app.py::test_wf_publish_ride_keyboard_happy",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Recommended price range"
text = "The server computes the recommended range from route km and rejects a whole-route price outside it, or one that is not a multiple of 50 cents, with 422 `price_out_of_range`; the form shows the range and clamps its price stepper to it, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "publish-ride-keyboard"
tests = [
    "test_app.py::test_wf_publish_ride_keyboard_price_clamp",
    "test_app.py::test_price_range_api",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Publishing rules"
text = "Publishing stores a ride in state `published` with its legs, stop times and numbered seats, answers 403 to a driver whose ID is not `verified`, and answers 422 `too_many_stopovers` past the stopover limit."
kind = "behavior"
primary = "pytest"
workflow = "publish-ride-keyboard"
tests = [
    "test_app.py::test_publish_rules",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Search form by keyboard"
text = "A passenger fills the search form by keyboard alone (city comboboxes with an active option, the swap button, the date grid with day, week, month and week-end keys, and the seats stepper), focus returns to each opener, and every announcement is given in Interactions."
kind = "behavior"
primary = "workflow"
workflow = "search-keyboard"
tests = [
