[task]
name = "alder-quay/vireo-pace-story"
version = "1.0.0"
description = "A chapter-based, cinematic brand site for a plant-based daily drink stick. The content record (chapters, product, interviews and eight ON/OFF scenarios) lives in Postgres and is read through the site's API. Gotenberg prints the product information sheet PDF from the same stored product record. The site has keyboard, screen reader, touch and reduced-motion paths, and its scroll-led chapters and the ON/OFF Meridian keep their state in the address."
authors = [
    { name = "Divya", email = "divya@ethara.ai" },
    { name = "shivam choudhary", email = "shivam.choudhary@ethara.ai" },
]
