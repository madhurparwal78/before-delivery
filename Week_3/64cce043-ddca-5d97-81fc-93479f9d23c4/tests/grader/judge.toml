weight = 5
description = "Recipe: find where grading, the exposure computation (score, band, affected holdings, person-level merging, step order) and the step transition with its ordering check are implemented, then search every other module for a second copy. A duplicate rule match, score sum, step sort or ordering check in a route or SQL fragment counts as a defect. Cite each as `file:line`. Pass: each of grading, the exposure computation, the step transition is implemented in exactly one place that every caller uses."

