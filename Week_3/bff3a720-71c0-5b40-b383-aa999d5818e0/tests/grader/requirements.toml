[[if_rules]]
id = "IF-02"
text = "`THIRD_PARTY_NOTICES.md` at `/app` lists every shipped package (the production dependency tree from `npm ls --omit=dev --all --json`) with its name, version and licence."
tests = [
    "test_app.py::test_if_third_party_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Every shipped package is under MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD or, for a bundled font, OFL-1.1."
tests = [
    "test_app.py::test_if_licences",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "The app uses no datastore or service besides PostgreSQL, Valkey, MinIO and Mailpit, and no external network at runtime."
tests = [
    "test_app.py::test_if_no_extra_services",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "The provided service configuration (the development compose file and its credentials) stays unchanged."
tests = [
    "test_app.py::test_if_compose_unchanged",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "Server and browser source is TypeScript, and an npm lockfile is committed."
tests = [
    "test_app.py::test_if_typescript_lockfile",
]
parameter_cases = []

