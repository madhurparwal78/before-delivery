weight = 3
description = "Recipe: `playwright` at 1280x800, signed out. 1) Open `/` and screenshot the first screen without scrolling. 2) With browser_evaluate read the bounding rect, computed background colour and text colour of `link \"Start the build\"`. Pass: the whole labelled `Start the build` rectangle sits on the first screen beneath the brief's sentence with its rect bottom at or above y=800, in accent fill 255, 74, 31 with text in the ground values 24, 25, 27 with no motorcycle drawn."

