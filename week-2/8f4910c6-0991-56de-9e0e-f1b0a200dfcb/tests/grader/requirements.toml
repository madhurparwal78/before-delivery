[[requirements]]
id = "DP-20"
title = "Automatic release"
text = "Every unconfirmed option carries an automatic release instant: 12:00 office time on the business day before the job day, skipping weekends and that office's closure dates, correct across daylight-saving changes. The server releases each hold within 10 seconds of its release instant."
kind = "behavior"
primary = "pytest"
workflow = "option-deadlines"
tests = [
    "test_app.py::test_auto_release_instant",
]
criteria = []
parameter_cases = [
    "toronto_mon",
    "toronto_after_dst",
    "vancouver_mon",
    "closure_skip",
    "director_closure",
    "sweep_release",
]

[[requirements]]
id = "DP-21"
title = "Office-local hold-until"
text = "A booker's hold-until refuses spring-forward gap times, resolves a repeated autumn time to its first occurrence, and must be in the future and before the automatic release. A hold-until change that breaks two published rules at once answers the earlier one in the one error precedence."
kind = "behavior"
primary = "pytest"
workflow = "option-deadlines"
tests = [
