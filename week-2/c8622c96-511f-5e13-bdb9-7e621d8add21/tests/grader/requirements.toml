kind = "behavior"
primary = "pytest"
workflow = "contributor-submission"
tests = [
    "test_app.py::test_lift_resolution",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Original upload limits"
text = "Each uploaded original is accepted or refused by its content and size under the published per-file limits, never by its file name or declared type."
kind = "behavior"
primary = "pytest"
workflow = "contributor-submission"
tests = [
    "test_app.py::test_upload_sniffing",
]
criteria = []
parameter_cases = [
    "jpeg-named-png",
    "png-named-jpg",
    "gif-named-jpg",
    "tiff",
    "svg-with-script",
    "html",
    "text",
    "unreadable-jpeg",
    "jpeg-at-limit",
    "jpeg-over-limit",
    "path-traversal-name",
    "twenty-fifth-frame",
]

