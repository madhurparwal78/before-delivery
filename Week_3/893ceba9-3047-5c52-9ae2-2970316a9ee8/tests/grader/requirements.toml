[[if_rules]]
id = "IF-03"
text = "Every shipped package and bundled font is under MIT, BSD-2-Clause, BSD-3-Clause, Apache-2.0, ISC, 0BSD, MPL-2.0, Unicode-3.0 or OFL-1.1."
tests = [
    "test_app.py::test_if_licences_allowed",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "Postgres and MinIO are the only datastores. No SQLite, embedded key-value store, Redis or local files hold application state."
tests = [
    "test_app.py::test_if_no_extra_datastore",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "The provided service configuration and its credentials are left exactly as given."
tests = [
    "test_app.py::test_if_service_config_untouched",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "`go.sum` and the npm lockfile are committed, and the build installs only from them."
tests = [
    "test_app.py::test_if_lockfiles_committed",
]
parameter_cases = []

