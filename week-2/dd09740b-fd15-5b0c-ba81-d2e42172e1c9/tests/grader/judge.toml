weight = 3
description = "Recipe: source MCP. 1) Find each place a refusal response is produced, including 404, 405, 413 and 503 handlers. 2) Hand-built error JSON in a handler, or a bare exception left to the framework's default, is a defect; cite each as `file:line`. The health answer `{\"status\":\"unavailable\"}` and the HTML not-found and outage pages are not JSON refusals and are exempt. Pass: every JSON refusal goes through one error builder carrying status, field and message."

[criterion.annotations]
