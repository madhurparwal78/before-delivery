text = "The seeded call times of `NP-M3XB7R`, `NP-Q7LD4V` and `NP-W8DK5T` fall on the studio days Seed data names and are stored as the UTC instants of their stated Stockholm wall-clock times under the Stockholm daylight-saving rules of each call's own date."
kind = "behavior"
primary = "pytest"
workflow = "seeded_data_and_deployment_contract"
tests = [
