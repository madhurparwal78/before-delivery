    "field-service",
    "refrigeration",
    "hvac",
    "receipts",
    "versioning",
    "sse",
    "idempotency",
    "concurrency",
    "time-zones",
    "dst",
    "minio",
    "mailpit",
    "postgres",
    "accessibility",
]

