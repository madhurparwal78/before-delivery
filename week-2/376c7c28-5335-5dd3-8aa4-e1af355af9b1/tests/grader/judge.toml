description = "Recipe: for each rule named in the standard (fee quote and rounding, deck heights and headroom, footprint limit, piece and load transitions, charge funding, storage-day accrual, studio-day boundaries, CSV cell neutralisation) find every place in server and client source that computes or decides it. A second implementation, such as client-side headroom math or a duplicated transition table, fails; cite both copies as `file:line`. Pass: each rule is decided in exactly one module, with other code only calling it or showing server values."

