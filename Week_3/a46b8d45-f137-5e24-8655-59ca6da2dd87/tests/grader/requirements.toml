criteria = []
parameter_cases = []

[[requirements]]
id = "DP-14"
title = "Decided-claims count"
text = "The operator's decided-claims count rises by one at each identification, splits into inside and outside, and never falls."
kind = "behavior"
primary = "pytest"
workflow = "identify-and-rule"
tests = [
