type = "binary"
weight = 5
description = "Recipe: `source`, trace the auth middleware for bearer tokens and the session cookie, then every role check used by the API routes, pages and fragments; a role taken from the body, query, header, cookie payload, token payload or a cached copy fails. Pass: the role used by every check is read from the stored `members` row found through the session token on that same request."

[criterion.annotations]
