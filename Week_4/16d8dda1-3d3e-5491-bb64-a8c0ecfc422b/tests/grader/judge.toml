[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: Read the server entry from package.json, then trace the seat-claim route down to the Valkey calls that decide who gets a contested seat. Fail if the winner is decided by a process-local Map, array or variable, or by a read followed by a separate write; cite the file:line of each step you traced. Pass: The winner of a contested seat is decided by one atomic Valkey operation on the seat keys."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-45",
]
evidence = "file_line"
cites = "L417, L507-L509, L71"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: Find the client classroom scene module from the classroom page entry and read how the canvas is drawn. Fail if the room comes from prerendered images, video, an iframe or a 2D canvas imitation, and cite file:line of the renderer creation, the mesh builders and the render loop. Pass: The classroom canvas is drawn by a WebGL renderer from meshes and materials the app builds in code."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-45",
]
evidence = "file_line"
cites = "L71, L93, L163"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: List every registered HTTP and WebSocket route, then read the handlers behind the session snapshot, seats, hands, poll, breakout, file and review reads. The documented grading routes behind the grading key may create data. Fail on canned or hard-coded state, test-only endpoints, or in-memory or file stand-ins for Postgres, MinIO or Valkey, and cite each as file:line. Pass: Every state-returning endpoint reads its data from Postgres, Valkey or MinIO."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-45",
]
evidence = "file_line"
cites = "L71, L498-L526, L704"

[[criterion]]
id = "S4"
name = "S4"
type = "binary"
weight = 5
description = "Recipe: Find the Valkey module, then trace how an accepted seat, slide or hand change on one instance reaches the WebSocket pages on another instance. Fail if instances share live state by polling Postgres, by a file, or by a process-local emitter alone, and cite the publish and the subscribe as file:line. Pass: Each accepted live change is published on a Valkey channel that the other instances subscribe to and push to their own pages."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-45",
]
evidence = "file_line"
cites = "L71, L519, L337"

