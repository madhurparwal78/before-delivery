]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-58"
title = "Credentials from the environment"
text = "Every service URL and credential is read from the environment at start, never written into source and never sent to the browser."
kind = "source"
primary = "rubric"
workflow = "cross-cutting"
tests = []
criteria = [
    "S1",
    "S2",
    "S3",
    "S4",
]
parameter_cases = []

[[requirements]]
id = "DP-59"
title = "Server boundary"
text = "The server accepts state-changing requests and sockets from its own origin only, enforces the published body limits and never serves source files or credentials."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_wf_cross_cutting_boundary",
    "test_app.py::test_wf_cross_cutting_json_integers",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-60"
title = "Desk state in the address"
text = "A desk's chosen filter is part of its address, so reloading it, going Back to it or opening it in a second tab shows the same filter checked and the same rows."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_wf_cross_cutting_desk_state",
]
criteria = []
parameter_cases = []

[[if_rules]]
id = "IF-01"
text = "`/app/run.json` exists with string `install`, `build` and `serve` and `\"_schema\":\"run-manifest-v1\"`, and nothing else is needed to start the app."
tests = [
    "test_app.py::test_if_run_manifest",
]
parameter_cases = []

[[if_rules]]
id = "IF-02"
text = "`THIRD_PARTY_NOTICES.md` at `/app` lists every shipped package with its licence. Shipped packages are the Go modules the program imports and the front end's production dependency tree (`npm ls --omit=dev --all --json`), plus the two font families."
tests = [
    "test_app.py::test_if_third_party_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Every shipped package uses MIT, BSD-2-Clause, BSD-3-Clause, Apache-2.0, ISC or MPL-2.0. Fonts use OFL-1.1."
tests = [
    "test_app.py::test_if_licences",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "The only datastores are the provided PostgreSQL and Keycloak. No other database, cache, queue or file-based state store is used."
tests = [
    "test_app.py::test_if_datastores",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "The provided service configuration (the compose files and the seeded realm and client settings) is left untouched."
tests = [
    "test_app.py::test_if_service_config_untouched",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "The page loads no script, style or font from any third-party origin at runtime."
tests = [
    "test_app.py::test_if_no_third_party_origins",
]
parameter_cases = []

[[if_rules]]
id = "IF-07"
text = "`go.sum` and `package-lock.json` are committed and match the dependencies in use."
tests = [
    "test_app.py::test_if_lockfiles",
]
parameter_cases = []

