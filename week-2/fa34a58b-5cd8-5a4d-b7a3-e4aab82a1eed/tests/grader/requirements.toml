title = "One error shape"
text = "Every API error uses the one published JSON error shape and the single published precedence order."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_error_shape_and_precedence",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-56"
title = "Keyboard-complete sheets"
text = "Every sheet and drawer opens and works from the keyboard, keeps Tab and Shift+Tab inside while open, closes on Escape and returns focus to its opener."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_keyboard_sheets_trap_and_return",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-57"
title = "Readable, tappable controls"
text = "Every control is at least 44 by 44 pixels and all text and control edges meet WCAG 2.2 AA contrast on the dark ground."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_readable_tappable_controls",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-58"
title = "No decorative loops"
text = "Nothing on any page moves while the user is idle except changes the server pushes, and sheets open and close within the published time."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_no_idle_motion_and_sheet_timing",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-59"
title = "Nocturnal blueprint look"
text = "Every page sits on a near-black navy blueprint sheet with a faint grid, cyan hairlines, pale ink, warm lamp fills only for scenes and coral only for alerts, in the published typefaces with tabular mono numerals."
kind = "visual"
primary = "rubric"
workflow = "cross-cutting"
tests = []
criteria = [
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
]
parameter_cases = []

[[requirements]]
id = "DP-60"
title = "Honest service wiring"
text = "Clip state, notice state and schedule revisions come from real PostgreSQL, MinIO and SMTP calls, with no in-memory stand-ins or self-reported success."
kind = "source"
primary = "rubric"
workflow = "cross-cutting"
tests = []
criteria = [
    "S3",
    "S4",
]
parameter_cases = []

[[if_rules]]
id = "IF-01"
text = "/app/run.json exists with exactly the string keys install, build, serve and \"_schema\":\"run-manifest-v1\"."
tests = [
    "test_app.py::test_if_run_manifest",
]
parameter_cases = []

[[if_rules]]
id = "IF-02"
text = "/app/THIRD_PARTY_NOTICES.md names every shipped package with its version and licence, plus every bundled font and icon set. Shipped packages means the production dependency tree as npm ls --omit=dev --all --json reports it."
tests = [
    "test_app.py::test_if_third_party_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Shipped packages and bundled assets use only these licences: MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD, BlueOak-1.0.0, CC0-1.0 or OFL-1.1."
tests = [
    "test_app.py::test_if_allowed_licences",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "PostgreSQL and MinIO are the only datastores. No SQLite, Redis, embedded database or files used as a database."
tests = [
    "test_app.py::test_if_only_postgres_and_minio",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "The provided development service configuration and its credentials stay unchanged."
tests = [
    "test_app.py::test_if_provided_services_unchanged",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "/app/package-lock.json is committed and the install command uses npm ci."
tests = [
    "test_app.py::test_if_lockfile_and_npm_ci",
]
parameter_cases = []

[[if_rules]]
id = "IF-07"
text = "Pages load no resources from other origins. Fonts and icons are served by the app itself."
tests = [
    "test_app.py::test_if_same_origin_resources",
]
parameter_cases = []

