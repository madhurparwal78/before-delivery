[[if_rules]]
id = "IF-03"
text = "Every shipped package is licensed MIT, Apache-2.0, BSD or ISC, and the bundled fonts are SIL OFL."
tests = [
    "test_app.py::test_if_licences",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "The only datastores are the provided PostgreSQL and MinIO; there is no SQLite, embedded database, cache server, queue or state kept in local files."
tests = [
    "test_app.py::test_if_datastores",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "The browser loads nothing from another origin; fonts, scripts, styles and images are served by the app."
tests = [
    "test_app.py::test_if_same_origin",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "The provided service configuration and its credentials are left as given."
tests = [
    "test_app.py::test_if_service_config",
]
parameter_cases = []

[[if_rules]]
id = "IF-07"
text = "Server and browser source is written in TypeScript."
tests = [
    "test_app.py::test_if_typescript",
]
parameter_cases = []

[[if_rules]]
id = "IF-08"
text = "The PDF and PNG exports are produced by npm libraries inside the app, with no external renderer service."
tests = [
    "test_app.py::test_if_export_libraries",
]
parameter_cases = []

