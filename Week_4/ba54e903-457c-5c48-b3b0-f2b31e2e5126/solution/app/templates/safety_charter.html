{% extends "base.html" %}
{% block main %}
<section class="page-hero">
  <h1 class="display page-title">{{ page.title }}</h1>
  <p class="lede">{{ page.summary }} Press a card to turn it over.</p>
  <ul class="flip-grid">
    {% for title, text in cards %}
    <li>
      <button class="flip" type="button" aria-pressed="false">
        <span class="flip-inner">
          <span class="flip-face flip-front">{{ title }}</span>
          <span class="flip-face flip-back">{{ text }}</span>
        </span>
      </button>
    </li>
    {% endfor %}
  </ul>
</section>
{% endblock %}
{% block scripts %}<script src="/static/js/safety.js?v={{ version }}"></script>{% endblock %}
