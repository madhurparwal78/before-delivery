[task]
name = "kestrel-row/holdfast-register"
version = "1.0.0"
description = "Holdfast Register, an equity register for the option holders, leavers, investors, board members and founder admin of one robotics startup. Vesting, offer expiry, leaver windows and tender closes are all decided on the server clock. It has a PostgreSQL register of record, a MinIO document vault for sealed signatures and a WireMock-served payment provider for exercises."
authors = [
    { name = "raja.kumarint17", email = "raja.kumarint17@ethara.ai" },
    { name = "Sonu Sharma", email = "sonu.sharma@ethara.ai" },
]
