name = "Q1"
type = "binary"
weight = 3
description = "Recipe: read the request handlers, shared API types and browser data-fetching code. Each `any`, `as unknown as`, cast of parsed JSON or request bodies to a domain type without validation, non-null assertion on external data, or `@ts-ignore`/`@ts-expect-error` is a defect; cite each as `file:line`. Pass: the traced code has no unchecked type escape."

