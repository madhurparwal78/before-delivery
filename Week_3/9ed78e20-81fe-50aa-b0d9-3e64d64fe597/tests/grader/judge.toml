channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L1230, L646-L656, L812-L833"

[[criterion]]
id = "Q2"
name = "Q2"
type = "binary"
weight = 5
description = "Recipe: find where the London embargo conversion, read time, the recorded difference, grant activity and the audit hash are computed. Search for every caller plus any reimplementation of these same rules (a second wall-clock-to-instant embargo conversion, a second read-time word count, a second difference subtraction, a second active-grant test on granted_at, expires_at and revocation, a second SHA-256 over audit fields), in TypeScript or SQL. Any second computation of one of these rules fails, cited as `file:line`. These are separate rules the brief places elsewhere, and code for them is not a duplicate even though it uses the same operations: the benefits entry in force by London date, London display formats for times, the 30-word search highlight passage, the sign-off lapse window and the post-expiry 403, and the seven-day expiry notices. The browser also needs a London wall-clock to instant conversion for the Schedule dialog's live preview and the Grants form's `Expires (London)` input; one shared browser helper for that, besides the server's single conversion, is required by the brief and does not fail. Pass: each of the listed rules is computed in exactly one place that every caller uses."

