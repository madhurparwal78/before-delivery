[[requirements]]
id = "DP-01"
title = "Add menu insert"
text = "Pressing `A` in the canvas or Navigator, or pressing the Add button, opens the Add component menu. Choosing a type inserts a new node into the selected container (or after a selected leaf), moves focus to the new node's Navigator row (or the canvas while the Navigator drawer is closed) and announces the inserted notice."
kind = "behavior"
primary = "pytest"
workflow = "place-reorder"
tests = [
    "test_app.py::test_add_menu_insert",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Palette drag with drop indicator"
text = "Dragging a component type from the Add component menu, or a selected canvas node, over a frame or Navigator row shows the drop indicator with its target parent and index. Dropping inserts or moves the node exactly there."
kind = "behavior"
primary = "pytest"
workflow = "place-reorder"
tests = [
    "test_app.py::test_palette_drag_drop_indicator",
]
criteria = []
parameter_cases = []

