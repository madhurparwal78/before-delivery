{% extends "base.html" %}
{% block main %}
<section class="page-hero form-page">
  <h1 class="display page-title">SUBMIT A REQUEST</h1>
  <p class="lede">Describe the problem and we will reply by email.</p>
  <form class="form" id="support-form" novalidate>
    <div class="field">
      <label for="sp-email">Email</label>
      <input id="sp-email" name="email" type="email" autocomplete="email" aria-describedby="sp-email-error">
      <p class="field-error" id="sp-email-error" hidden></p>
    </div>
    <div class="field">
      <label for="sp-category">Category</label>
      <select id="sp-category" name="category" aria-describedby="sp-category-error">
        <option value="" selected>Select a category</option>
        <option value="account">Account</option>
        <option value="billing">Billing</option>
        <option value="safety">Safety</option>
        <option value="other">Other</option>
      </select>
      <p class="field-error" id="sp-category-error" hidden></p>
    </div>
    <div class="field">
      <label for="sp-subject">Subject</label>
      <input id="sp-subject" name="subject" type="text" aria-describedby="sp-subject-error">
      <p class="field-error" id="sp-subject-error" hidden></p>
    </div>
    <div class="field">
      <label for="sp-body">Description</label>
      <textarea id="sp-body" name="body" rows="6" aria-describedby="sp-body-error"></textarea>
      <p class="field-error" id="sp-body-error" hidden></p>
    </div>
    <button class="btn btn-accent" type="submit" id="sp-submit">Submit request</button>
    <p class="form-status" role="status" aria-label="Request status" id="sp-status"></p>
  </form>
</section>
{% endblock %}
{% block scripts %}<script src="/static/js/support.js?v={{ version }}"></script>{% endblock %}
