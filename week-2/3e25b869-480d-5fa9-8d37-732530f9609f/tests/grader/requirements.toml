[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"
MAILPIT_URL = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_maildown"

[[requirements]]
id = "DP-01"
title = "Run manifest and health"
text = "Ship /app/run.json with install, build and serve commands, serve on port 4173 (or APP_PUBLIC_PORT) on all interfaces, and answer GET /api/health with 200 {\"status\":\"ok\"} even while Kill Bill or the mail server is unreachable."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_health_answers_with_dependencies_down",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Server boundary and secrets"
text = "Accept only same-origin JSON within the published size limit, never serve source or configuration files, and never let a service credential reach the browser, an API body or an email, as set out in Server boundary."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_server_boundary_and_secrets",
]
criteria = []
parameter_cases = []

