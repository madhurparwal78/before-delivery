    "close_vs_move",
]

[[requirements]]
id = "DP-57"
title = "Re-send is throttled silently"
text = "At most three re-send emails are queued per email in any rolling re-send window, and throttled requests still answer the same 202, queue nothing and rotate no tokens."
kind = "behavior"
primary = "pytest"
workflow = "candidate-tracking"
