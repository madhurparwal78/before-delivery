[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "short-timer"
port = 4176
url_env = "APP_SHORT_URL"

[outages.env]
HOLD_TTL_SECONDS = "5"
INSPECTOR_LINK_TTL_SECONDS = "20"
SESSION_IDLE_SECONDS = "60"
SESSION_ABSOLUTE_SECONDS = "180"
SIGN_IN_THROTTLE_WINDOW_SECONDS = "30"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
id = "DP-01"
title = "Station availability"
text = "GET /api/sites/{site_id}/availability returns every station of the site for one site-local date with its booked, buffer, own and not-on-the-clock sectors, each buffer sized by the station's kind, as defined in API and Business rules."
kind = "behavior"
primary = "pytest"
workflow = "dial-claim"
tests = [
    "test_app.py::test_availability_sectors",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Burner Dial drag claim"
text = "Dragging clockwise by pointer or touch from an open point on a station's dial draws a claim arc that snaps to the booking step and stops where its own sanitation buffer would meet the next occupied sector, at the end of the day or at the member's available pack hours, shows the start, end and pack hours after this claim in the centre, never scrolls the page while a touch claim is in progress, and creates a hold on release under a fresh idempotency key, as qualified in Interactions."
kind = "behavior"
primary = "pytest"
workflow = "dial-claim"
tests = [
    "test_app.py::test_wf_dial_claim_touch",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Keyboard dial control"
text = "Each dial's Start time and End time spinbuttons move the window by a quarter hour with arrow keys and by an hour with Shift and an arrow key, drive the same arc, and let the member hold, confirm and release a window without a pointer, as qualified in Interactions."
kind = "behavior"
primary = "pytest"
workflow = "dial-claim"
tests = [
    "test_app.py::test_wf_dial_claim_keyboard",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Server hold"
text = "POST /api/bookings with an Idempotency-Key creates a held booking that moves its hours from available to committed and carries a server-set expiry instant, and refuses a member's fourth live hold with 422 hold_limit, as defined in API and Business rules."
kind = "behavior"
primary = "pytest"
workflow = "hold-contention"
tests = [
    "test_app.py::test_server_hold",
    "test_app.py::test_hold_rule_order_beats_overlap",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-05"
title = "Next-day cutoff"
text = "The server refuses a booking for the site's current or an earlier date, or for the site's next date once the site's own clock reaches the cutoff in Business rules, whatever time zone the browser uses."
kind = "behavior"
primary = "pytest"
workflow = "dial-claim"
tests = [
    "test_app.py::test_next_day_cutoff",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-06"
title = "Claim-to-ticket journey"
text = "A member drags a window on a dial while the dials keep reloading, confirms the hold, and sees the arc turn to the confirmed state, the centre numeral settle to the server balance and a new ticket on top of the spike."
kind = "behavior"
primary = "workflow"
workflow = "dial-claim"
tests = [
    "test_app.py::test_wf_dial_claim_pointer",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-07"
title = "One winner per window"
text = "Of several simultaneous claims that overlap one station's window or its sanitation buffer exactly one succeeds and every other answers 409 slot_taken with no ledger movement, and one member's simultaneous claims on different stations are judged one after another against that member's balance and hold limit."
kind = "behavior"
primary = "pytest"
workflow = "hold-contention"
tests = [
    "test_app.py::test_wf_hold_contention_parallel",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-08"
title = "Hold expiry"
text = "A held booking that reaches its hold_expires_at unconfirmed is expired on the server, returns its hours to the lots it drew from in one hold_release by Pilotlight, frees its window, and refuses a later confirm with 409 hold_expired, as defined in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "hold-contention"
tests = [
    "test_app.py::test_hold_expiry",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-09"
title = "Hold and rejection display"
text = "A held window shows a pulsing outline and a countdown measured to the server's hold expiry on the server clock, never the browser's, and a rejected or expired claim snaps the arc back to zero length while the Booking status region announces the reason copy from Feedback states."
kind = "behavior"
primary = "pytest"
workflow = "dial-claim"
tests = [
    "test_app.py::test_hold_countdown_and_rejection",
]
criteria = []
parameter_cases = []

