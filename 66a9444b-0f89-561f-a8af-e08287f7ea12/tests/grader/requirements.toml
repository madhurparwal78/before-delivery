    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "cross-cutting",
    "admin-settings",
    "programme-explore",
    "seats-waitlist",
    "checkout",
    "reduced-rate",
    "transfer-door",
    "curation",
    "artist-entries",
    "cancellation-refunds",
    "school-group-booking",
    "finance-close",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
