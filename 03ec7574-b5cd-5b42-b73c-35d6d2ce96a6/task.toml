[task]
name = "deku/treasury-quorum-console"
version = "1.0.0"
description = "Corvo, a treasury wallet console where an ordered, revisioned policy engine allows or denies every outgoing transfer by destination, amount, time and rolling spend totals, transfers at or above a wallet floor reserve funds and wait for a key quorum of distinct approvers, the deciding approval executes exactly once under races, money moves as paired ledger entries, and every write lands in a hash-chained audit trail and an HMAC-signed event log under strict roles, idempotency and organization isolation, plus a public landing, pricing and contact site."
authors = [
    { name = "Kaustubh Dalvi", email = "kaustubh.dalvi@ethara.ai" },
    { name = "raja.kumarint17", email = "raja.kumarint17@ethara.ai" },
]
keywords = [
    "treasury",
    "wallets",
    "policy-engine",
    "key-quorum",
    "approvals",
    "idempotency",
    "audit-chain",
    "hmac",
    "ledger",
    "postgres",
    "javascript",
]

