[[requirements]]
id = "DP-04"
title = "Triage to a clear inbox."
text = "The stage manager works the triage screen by keyboard, accepting, declining and merging each request until the clear-inbox empty state shows. Each decision dialog keeps Tab inside it while open, focus never lands on the page body, and after every decision exactly one triage row is current. Afterwards a carpentry task is set to block the accepted request from its details with Add blocked task. The stage manager first chooses who they are working as from the rail, and the cleared triage screen on a 375-pixel phone keeps the rail as an off-screen drawer with every tap target at least 44 pixels. Last, the stage manager adds three new sound notes with no owner, selects them with x and Shift, presses a and finishes the palette's Assign to command for Kofi Mensah, and Undo then gives all three their earlier owner back with the exact Undo notice."
kind = "behavior"
primary = "workflow"
workflow = "triage-intake"
tests = [
    "test_app.py::test_wf_triage_intake_clear_inbox",
    "test_app.py::test_wf_triage_intake_outage",
]
criteria = []
parameter_cases = []

