[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "mail-down"
port = 4175
url_env = "APP_MAIL_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[outages]]
id = "short-timer"
port = 4176
url_env = "APP_SHORT_URL"

[outages.env]
REJOIN_GRACE_SECONDS = "8"
MAIL_LINK_TTL_SECONDS = "20"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
id = "DP-01"
title = "Sign-up to hangar journey"
text = "A visitor picks a language, creates an account, confirms it through the emailed link, signs in and sees the hangar entirely in that language."
kind = "behavior"
primary = "workflow"
workflow = "account"
tests = [
    "test_app.py::test_wf_account_signup_to_hangar",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Name and password limits"
text = "Display names and hero names must be 3 to 20 characters and passwords 10 to 128 characters, counted as user-perceived characters, and both the form and the API enforce this with the localised limit message."
kind = "behavior"
primary = "pytest"
workflow = "account"
tests = [
    "test_app.py::test_wf_account_name_password_limits",
]
criteria = []
parameter_cases = []

[[requirements]]
