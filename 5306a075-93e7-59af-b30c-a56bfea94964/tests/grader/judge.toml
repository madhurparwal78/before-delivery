[judge]
judge = "codex"
model = "openai/gpt-5.6-sol"
version = "0.163.0"
cwd = "/judge-workspace"
timeout = 1200
mode = "batched"
samples = 3
guard = "penalize"
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "normal",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_press_key",
    "browser_resize",
    "browser_select_option",
    "browser_hover",
    "browser_drag",
    "browser_tabs",
    "browser_wait_for",
    "browser_mouse_wheel",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "reduced"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "reduced",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_press_key",
    "browser_resize",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "touch"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "touch",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_press_key",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "source"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "source-mcp",
]
allowed_tools = [
    "list_files",
    "read_file",
    "search_files",
]

[scoring]
aggregation = "weighted-mean"

[[criterion]]
id = "B1"
name = "B1"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800. 1. Sign in as the invented seed product manager pm@tallyrun.example and stay on the triage screen the app opens after sign-in. 2. Open the seeded note 'Weekly KPI pack' from the 'Notes' listbox. 3. Probe the computed background-color and background-image of html, body, the 'Notes' listbox, the 'Note' article and the 'Product hierarchy' complementary, treating a transparent background as showing the colour painted behind it. 4. Treat lightness above 90 percent with a yellow-orange hue as warm off-white for html and body, where pure #ffffff fails, and for each of the three panes accept either a warm paper tint with a yellow-orange hue and lightness above 85 percent or a white or near-white sheet with lightness above 95 percent; count any gradient image on a probed element as a fail. 5. Screenshot the full screen. Pass: every probed element meets its colour bar from step 4."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-43",
]
evidence = "screenshot"
cites = "L298-L301, L126"

[[criterion]]
id = "B2"
name = "B2"
type = "binary"
weight = 3
description = "Recipe: `playwright` at 1280x800. 1. Sign in as pm@tallyrun.example. 2. Open the seeded note 'Audit questions from clinic auditors' from the 'Notes' listbox. 3. Probe the computed color of a body paragraph inside the 'Note' article and of its level 2 heading. 4. Treat lightness below 25 percent with a blue hue as deep blue-black ink, and count pure #000000 or neutral grey as a fail. 5. Screenshot the reading column. Pass: both probed text colours are a deep blue-black ink."

[criterion.annotations]
channel = "experience"
