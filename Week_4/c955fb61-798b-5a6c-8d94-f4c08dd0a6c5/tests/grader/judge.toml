[[criterion]]
id = "Q1"
name = "Q1"
type = "binary"
weight = 5
description = "Recipe: in server source find where the working-day calendar, the forward and backward passes, the group rollup, the late flag, variance, workload hours, the loop check, the version check and the export state are each implemented. Then search the rest of the server and the client for a second copy: working-day stepping or duration counting outside the drag preview (a weekday test used only to shade header columns or to format a date is not a second copy), a second weighted-mean percent, variance subtraction, hour summation, export status strings. Cite each second copy as `file:line`; any one fails. Pass: each of the nine named rules is decided in exactly one module, with no second copy in server or client source."

