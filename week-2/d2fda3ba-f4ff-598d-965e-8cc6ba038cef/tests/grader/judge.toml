[judge]
judge = "codex"
model = "openai/gpt-5.6-sol"
version = "0.163.0"
cwd = "/judge-workspace"
timeout = 1200
mode = "batched"
samples = 3
guard = "penalize"
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "normal",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_press_key",
    "browser_resize",
    "browser_select_option",
    "browser_hover",
    "browser_drag",
    "browser_tabs",
    "browser_wait_for",
    "browser_mouse_wheel",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "reduced"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "reduced",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_press_key",
    "browser_resize",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "touch"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "touch",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_press_key",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "source"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "source-mcp",
]
allowed_tools = [
    "list_files",
    "read_file",
    "search_files",
]

[scoring]
aggregation = "weighted-mean"

[[criterion]]
id = "B1"
name = "B1"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800, signed in as the fresh judge account with Publish added and the sample case loaded (see test plan). 1) Open the note 'Port Ellery fuel contracts'. 2) Open `tab \"Publish\"` on the judge's own dossier. 3) Choose the hop-two radio in `radiogroup \"Hop\"` and wait for `status \"Boundary check\"` to show its match copy. 4) Use `browser_evaluate` to read the computed background colour of the ring canvas or its container. 5) Screenshot `group \"Exposure Ring\"`. A blank canvas, a plain list of notes or a light canvas counts as a fail. Pass: the canvas shows four concentric hop rings centred on the root node over a dark charcoal surface."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-25",
]
evidence = "screenshot"
cites = "L56, L204, L219"

[[criterion]]
id = "B2"
name = "B2"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800, signed in as the fresh judge account with Publish added and the sample case loaded, with the note 'Port Ellery fuel contracts' open and `tab \"Publish\"` showing the judge's own dossier, hop two chosen in `radiogroup \"Hop\"` and `status \"Boundary check\"` showing its match copy. 1) Take the accessibility snapshot of `group \"Exposure Ring\"` and list the node `img` names. 2) Screenshot the canvas. 3) Compare each node whose name ends in public with its drawn fill. A ring where every node shares one colour counts as a fail. Pass: every node whose name marks it public is filled with saturated amber (orange-yellow hue)."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-25",
]
evidence = "screenshot"
cites = "L56, L165, L205, L221"

