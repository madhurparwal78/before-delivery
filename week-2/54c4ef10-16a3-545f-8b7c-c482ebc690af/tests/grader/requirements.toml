[[requirements]]
id = "DP-12"
title = "PNG and TIFF judged by content"
text = "Strip uploads are accepted only when the bytes begin with a PNG or TIFF signature, whatever the file name or declared content type, and only in the pixel formats and TIFF layouts that Business rules allows."
kind = "behavior"
primary = "pytest"
workflow = "upload-safety"
tests = [
    "test_app.py::test_api_upload_content_judged",
