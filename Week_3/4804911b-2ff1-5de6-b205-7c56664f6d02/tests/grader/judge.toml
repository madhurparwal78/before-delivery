description = "Recipe: read the server's configuration module and every file that creates a Postgres, Svix, Gotenberg, RabbitMQ, Meilisearch or MinIO client, then search the whole source for literal keys, passwords, tokens, secrets and service addresses. The documented port, bind address and seeded demo accounts may be literals. Cite each defect as `file:line`. Pass: every service address, key and secret in the source is read from the environment."

[criterion.annotations]
