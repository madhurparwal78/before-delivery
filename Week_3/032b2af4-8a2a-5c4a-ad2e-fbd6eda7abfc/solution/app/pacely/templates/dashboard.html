{% extends "app_page.html" %}
{% set module = "dashboard" %}
{% set title = "Dashboard" %}
{% block app %}
<div class="dashboard-grid">
  <aside class="dash-side" aria-label="Your training">
    <section class="card athlete-card" data-athlete-card>
      <span class="skeleton" style="height:72px;width:72px;border-radius:50%"></span>
      <span class="skeleton" style="height:24px;width:60%"></span>
      <span class="skeleton" style="height:16px;width:80%"></span>
    </section>
    <section class="card" aria-labelledby="chart-title">
      <h2 id="chart-title" class="card-title">Last twelve weeks</h2>
      <div data-weekly-chart><span class="skeleton chart-skeleton"></span></div>
    </section>
    <section class="card" data-requests hidden aria-labelledby="requests-title">
      <h2 id="requests-title" class="card-title">Follow requests</h2>
      <ul class="request-list" data-request-list></ul>
    </section>
  </aside>
  <section class="dash-feed" aria-labelledby="feed-title">
    <h1 id="feed-title" class="page-title small-title">Your feed</h1>
    <div data-feed aria-live="off"></div>
    <div data-feed-end></div>
    <div data-feed-sentinel></div>
  </section>
</div>
{% endblock %}
