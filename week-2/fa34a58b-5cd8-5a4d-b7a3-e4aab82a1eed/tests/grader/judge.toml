description = "Recipe: `playwright` at 1280x800. 1) Open `/plan?day=2026-11-02&at=19:30-06:00`. 2) Screenshot region \"Floor plan\", zoomed or clipped so wall ends are legible. Pass: walls of at least four rooms carry short perpendicular tick marks at their ends with a small numeric length label set in a monospace face, in the manner of an architect's dimension line."

