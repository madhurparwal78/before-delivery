description = "Recipe: find where API error bodies are built, then search the routes for any other place that returns an error. A route-built error dict, a key beyond `code`, `message` and `fields`, or an unpublished code counts as a defect. A non-error body the brief prints verbatim (such as `GET /api/health` answering 503 `{\"status\":\"starting\"}` at boot) is the published contract and is not a defect. Cite each as `file:line`. Pass: every API error is produced by the one shared error shape with the published codes."

