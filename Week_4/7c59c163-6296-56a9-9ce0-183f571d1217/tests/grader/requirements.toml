schema_version = 1
id_prefix = "DP"
mandatory_count = 60
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "sign-in-and-roles",
    "card-deposits",
    "event-trading",
    "shared-book",
    "orderbook-orbit",
    "event-lifecycle",
    "margin-liquidation",
    "builder-api",
    "builder-billing",
    "builder-webhooks",
    "statements",
    "owner-venue",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "S4",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
    "Q8",
]
rubric_total_weight = 90
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "keycloak", env = {} },
    { name = "killbill", env = {} },
    { name = "valkey", env = {} },
    { name = "svix", env = {} },
    { name = "minio", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Plumtide Venue <venue@plumtide.example>" } },
]

[criterion_weights]
B1 = 5
B2 = 5
B3 = 3
B4 = 3
B5 = 5
B6 = 3
B7 = 5
B8 = 3
B9 = 3
B10 = 3
B11 = 3
B12 = 3
S1 = 5
S2 = 3
S3 = 5
S4 = 3
Q1 = 3
Q2 = 5
Q3 = 3
Q4 = 3
Q5 = 3
Q6 = 5
Q7 = 5
Q8 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "svix-down"
port = 4175
url_env = "APP_SVIX_DOWN_URL"

[outages.env]
SVIX_URL = "http://127.0.0.1:9"

[[outages]]
id = "minio-down"
port = 4176
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4177
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[outages]]
id = "short-timer"
port = 4178
url_env = "APP_SHORT_URL"

[outages.env]
DUNNING_FINAL_NOTICE_SECONDS = "5"
OVERDUE_POLL_SECONDS = "5"
INVITE_TTL_SECONDS = "5"
DATABASE_URL = "${DATABASE_URL}_short"

[[requirements]]
id = "DP-01"
title = "Keycloak sign-in"
text = "A person signs in through the deployment's Keycloak realm from the Sign in link and lands on their venue home, signed in, in the same browser that started the sign-in."
kind = "behavior"
primary = "workflow"
workflow = "sign-in-and-roles"
tests = [
    "test_app.py::test_wf_sign_in_and_roles_browser_sign_in",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Sign-in stays in its browser"
text = "Each sign-in attempt carries its own fresh state and proof key, and a callback with a missing, reused or foreign state shows the sign-in error page and creates no session."
kind = "behavior"
primary = "pytest"
workflow = "sign-in-and-roles"
tests = [
    "test_app.py::test_wf_sign_in_and_roles_callback_replay",
