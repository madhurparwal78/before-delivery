[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server configuration module and every place that creates the PostgreSQL pool, the Kill Bill client, the S3 client and the SMTP transport. Search the app's own source for literal hosts, ports, usernames, passwords, API keys or secrets of these services. Leave out the provided service configuration and seed definitions for PostgreSQL, Kill Bill, MinIO and Mailpit, which IF-05 keeps unmodified. Pass: every service URL and credential is taken from the process environment at start with no literal fallback value, where only the documented app port 4173 and hold time 600 seconds count as allowed defaults."

