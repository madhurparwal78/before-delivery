description = "Recipe: from the `POST /api/generations/{id}/cancel` handler, trace the status change and the refund entry to their SQL and the schema of `generations` and `credit_entries`. A status read in one statement followed by an unconditional refund insert fails, cited as `file:line`. Pass: the database itself allows at most one refund per generation, through a conditional status update or a unique constraint inside one transaction."

