schema_version = 1
id_prefix = "DP"
mandatory_count = 70
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "contributor-submission",
    "desk-review",
    "embargo-alerts",
    "feed-story",
    "exclusive-claim",
    "claim-outage",
    "standard-licence",
    "licence-mail",
    "window-expiry",
    "usage-export",
    "commission-rates",
    "royalty-statement",
    "takedown",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 78
services = [
    { name = "postgres", env = { APP_CLOCK_CONTROL = "on" } },
    { name = "minio", env = {} },
    { name = "killbill", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Saltprint Desk <desk@saltprint.example>" } },
]

[criterion_weights]
B1 = 5
B2 = 3
B3 = 5
B4 = 3
B5 = 3
B6 = 3
B7 = 3
B8 = 5
B9 = 3
B10 = 3
B11 = 5
B12 = 3
S1 = 5
S2 = 5
S3 = 3
Q1 = 3
Q2 = 3
Q3 = 3
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[requirements]]
id = "DP-01"
title = "Essay drafts with co-credits"
text = "A contributor photographer creates and edits a draft essay with title, caption, embargo lift, exclusive and standard window lengths, prices and an ordered list of co-credits with split shares, as defined in Business rules and API."
kind = "behavior"
primary = "pytest"
workflow = "contributor-submission"
tests = [
    "test_app.py::test_essay_draft_fields",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Split shares total exactly"
text = "The server rejects any essay whose co-credit split shares do not total the full essay, and the studio form shows the running total before saving."
kind = "behavior"
primary = "pytest"
workflow = "contributor-submission"
tests = [
    "test_app.py::test_credit_rules_and_share_total",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Embargo lift in co-op wall time"
