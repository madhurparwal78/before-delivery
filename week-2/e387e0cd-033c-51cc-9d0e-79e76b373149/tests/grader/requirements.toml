[[requirements]]
id = "DP-57"
title = "Accessible and keyboard-complete screens."
text = "Every staff journey works by keyboard, dialogs and sheets manage focus as published, closed ones are hidden and inert, and an automated WCAG 2.2 AA check passes on every screen, and with each of its dialogs, menus and sheets open at the viewports where that one exists."
