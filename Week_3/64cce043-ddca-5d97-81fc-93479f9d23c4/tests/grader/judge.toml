weight = 5
description = "Recipe: read the grant, narrow, revoke and password-change code and the identity client module they call. A stub, a flag, a database table standing in for realm users, or a success path that skips the call counts as not met. Cite each as `file:line`. Pass: each of grant, narrow, revoke, password change reaches the realm's admin interface through a real HTTP call made with the confidential client's service-account token."

[criterion.annotations]
