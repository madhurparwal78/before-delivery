]
parameter_cases = []

[[if_rules]]
id = "IF-02"
text = "THIRD_PARTY_NOTICES.md at /app names every shipped package, both fonts (Newsreader, Source Serif 4) and the icon set, each with its licence; shipped packages means the production dependency tree from npm ls --omit=dev --all --json."
tests = [
    "test_app.py::test_if_third_party_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Every shipped package (as defined in IF-02) uses one of MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0 or 0BSD, and fonts use OFL-1.1."
tests = [
    "test_app.py::test_if_licences",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "The app stores data only in the provided PostgreSQL database and the provided bucket; no other datastore, embedded database or on-disk state file is used."
tests = [
    "test_app.py::test_if_datastores",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "Application source, server and browser alike, is TypeScript, with a committed lockfile."
tests = [
