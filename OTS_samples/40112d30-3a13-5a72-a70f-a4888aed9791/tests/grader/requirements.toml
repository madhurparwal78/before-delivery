[[requirements]]
id = "DP-01"
title = "Form definition"
text = "The owner API stores, returns and validates forms in the published form definition shape, and refuses a malformed definition with 422 as listed in API."
kind = "behavior"
primary = "pytest"
workflow = "build-skip-keyboard"
tests = [
    "test_app.py::test_form_definition_owner_api",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Builder by keyboard"
text = "An owner adds questions through the Add question dialog and reorders them with Alt+ArrowUp and Alt+ArrowDown using only the keyboard, with the focus moves and announcements given in Interactions."
