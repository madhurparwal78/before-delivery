name = "S1"
type = "binary"
weight = 5
description = "Recipe: 1. Read the server's configuration module. 2. Read every place that builds the PostgreSQL pool, the S3 client, the Kill Bill client and the SMTP transport. 3. Treat any hard-coded credential or service URL as a defect, allowing only the brief's documented defaults (port 4173 or APP_PUBLIC_PORT, the localhost public URL fallback, the timer defaults). Cite each as file:line. Pass: every service URL, credential and bucket name is read from its environment variable."

[criterion.annotations]
