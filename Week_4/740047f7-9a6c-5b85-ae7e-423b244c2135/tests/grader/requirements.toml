[[requirements]]
id = "DP-47"
title = "Imports applied one at a time"
text = "Imports of one farm are applied one at a time in arrival order, so two simultaneous byte-identical uploads give one created import and one replay with the same import id, and a row shared by two simultaneous files creates its defect exactly once."
