[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 5
description = "Recipe: 1) Read the client code for the configurator summary, product cards, cart, checkout summary, order page and account registrations. 2) Search it for arithmetic on `_cents`, `ride_min`, `months`, `apr_bp`, `rate_pcm`, `battery_bars`, date additions and business-day logic. 3) Treat as allowed formatting cents as dollars, showing `rate_pcm` as a percentage, adding up the Discounts and Credits rows the brief has the client show, and the ride-time count stepping between two server values. 4) Cite each client-side computation as `file:line`. Pass: every price, payment, ride time, gauge, fee, tax, total, delivery date and warranty day count shown in the browser comes from an API response field."

