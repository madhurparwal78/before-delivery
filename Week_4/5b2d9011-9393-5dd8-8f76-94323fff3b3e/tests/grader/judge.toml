[judge]
judge = "codex"
model = "openai/gpt-5.6-sol"
version = "0.163.0"
cwd = "/judge-workspace"
timeout = 3600
mode = "batched"
samples = 3
guard = "penalize"
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "normal",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_press_key",
    "browser_resize",
    "browser_select_option",
    "browser_hover",
    "browser_drag",
    "browser_tabs",
    "browser_wait_for",
    "browser_mouse_wheel",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "reduced"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "reduced",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_press_key",
    "browser_resize",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "touch"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "touch",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_press_key",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "source"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "source-mcp",
]
allowed_tools = [
    "list_files",
    "read_file",
    "search_files",
]

[scoring]
aggregation = "weighted-mean"

[[criterion]]
id = "B1"
name = "B1"
type = "binary"
weight = 3
description = "Recipe: `playwright` at 1280x800, open `/`, press `button \"Enter\"` if the notice panel is open, then screenshot the title screen and zoom on `img \"Holdfast Nights\"`. Pass: the wordmark is lettering built from a grid of square pixels in light grey, with loose pixels breaking off its left edge and the small uppercase tracked word NIGHTS beneath it."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "important"
requirements = [
    "DP-60",
]
evidence = "screenshot"
cites = "L98, L224"

[[criterion]]
id = "B2"
name = "B2"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800, open `/` with the notice panel dismissed, then screenshot the whole title screen. Pass: one centred column places the wordmark in the upper third, the solid emerald `button \"Start a room\"` slab beneath it as the loudest element, two rows of small muted uppercase link labels below that, and the `status \"Build\"` stamp pinned in the bottom-right corner."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "screenshot"
cites = "L98, L215-L217, L223, L225"

[[criterion]]
id = "B3"
name = "B3"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800, use the first-load screenshot of `dialog \"Before you play\"` taken at test-plan step 1 (take a fresh one only if the panel is still open), and read the two button styles from it. Pass: a centred modal panel over a dimmed, blurred stage holds an uppercase title, two short paragraphs and a right-aligned button row with the grey-outlined ghost `button \"Calm effects\"` before the mint-outlined dark-green `button \"Enter\"`."

[criterion.annotations]
channel = "experience"
