text = "While a hold, purchase or cancel is pending or after it answers `billing_unavailable`, the page never shows Held, Released or Paid ahead of the server, keeps the dialog, typed card and focus as qualified in Feedback states, shows the published outage copy and shows the billing banner within 2 seconds."
