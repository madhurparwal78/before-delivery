weight = 3
description = "Recipe: `playwright` at 1280x800, signed in, open `/play?island=1&spot=2`, press Tab until `World view` has focus, press C. With `browser_evaluate` find the elements that show the zoom value and the focus value, and record their box widths. Read the computed `font-variant-numeric` of their digits on the innermost element whose own text is the number (for example a `b` or `span` inside the box), not on the box itself, because the digits may carry their own style. Press `+` twice, then F twice, recording the widths after each key, and screenshot the final readouts. A box that changes width when its digits change fails. Pass: each readout box keeps one width across zoom 1, 2, 4 and focus 4, 8, 16 and its digits compute to tabular figures."

