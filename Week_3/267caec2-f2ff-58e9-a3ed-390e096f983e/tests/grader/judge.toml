[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server config and every module that builds a Postgres, Kill Bill, S3 or SMTP client, then search all source (server and client) for URL literals, hostnames, ports, usernames, passwords, API keys and secrets. The documented port default 4173 and the brief's seed account passwords are allowed literals. A hard-coded service URL or credential, or a client-side file that reads these variables or imports the server config, fails; cite each as `file:line`. Pass: every service URL and credential is read from the brief's environment variables inside server-only modules."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-44",
]
evidence = "file_line"
cites = "L651, L655-L665, L669"

