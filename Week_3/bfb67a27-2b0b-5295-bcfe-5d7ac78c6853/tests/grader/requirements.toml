    "test_app.py::test_if_licences",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "The app uses no datastore other than the provided Postgres and MinIO: no SQLite, no file-based database, no in-memory store as a system of record, no extra containers."
tests = [
