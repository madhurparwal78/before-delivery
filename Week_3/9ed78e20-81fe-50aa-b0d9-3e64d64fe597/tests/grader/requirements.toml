[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[requirements]]
id = "DP-01"
title = "Public reading journey"
text = "A visitor with cookies refused reads the home essay of numbered theses, follows the \"Latest from the record\" rail into the newsroom, narrows it by subject and tag, and opens a post, all without an account."
kind = "behavior"
primary = "workflow"
workflow = "public-reading"
tests = [
    "test_app.py::test_wf_public_reading_journey",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Newsroom filters live in the URL"
text = "The newsroom's subject, tag and page selections are carried only in the address, so loading a shared newsroom address with cookies refused shows the same posts and facet counts that the API returns for those parameters, and back and forward restore earlier selections."
kind = "behavior"
primary = "pytest"
workflow = "public-reading"
tests = [
    "test_app.py::test_wf_public_reading_shared_newsroom",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Every surface lists the published record"
text = "The catalogue grid, the Models navigation menu, the home rail, the newsroom, search, the feed and the sitemap each list exactly the published items, in the order stated in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "public-reading"
tests = [
    "test_app.py::test_every_surface_lists_published_record",
]
criteria = []
parameter_cases = []

[[requirements]]
