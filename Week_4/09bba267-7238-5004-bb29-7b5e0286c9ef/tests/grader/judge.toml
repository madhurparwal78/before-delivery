[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: `source`. 1) Find where the server reads its configuration at start. 2) Search every server and browser source file for string literals that look like a Postgres connection string, a Kill Bill URL, username, password, API key or secret, or an SMTP host or port. Do not count the provided dev service definitions, and do not count the seeded owner passcode, which is seed data. 3) Cite each finding as `file:line`. Pass: every service URL and credential comes only from `process.env`, with no literal fallback other than the documented defaults (port 4173, hold 600 seconds, offer 900 seconds and the documented MAIL_FROM sender)."

[criterion.annotations]
channel = "source"
