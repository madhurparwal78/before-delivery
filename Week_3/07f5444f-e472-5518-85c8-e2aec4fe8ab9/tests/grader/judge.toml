]
evidence = "file_line"
cites = "L81, L496, L819"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: read the client components that render copy figures, running times, parts-to-mark counts, publish blockers and the rental Due, Overdue and Reminder cells. A client formula for copies needed or shortfall, or a device-clock comparison deciding overdue or a blocker, fails, cite it as file:line. The whole-second values the splice count shows between the old and the new server total are allowed. Pass: every displayed copy figure, settled running time, blocker or rental status is read from an API response field rather than computed in the client."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-45",
]
evidence = "file_line"
cites = "L81, L236, L332, L549, L854"

[[criterion]]
id = "S4"
name = "S4"
type = "binary"
weight = 3
description = "Recipe: trace the scan upload and download handlers plus the notice and reminder senders to the provider calls they make. A fake store, a file written to local disk or a mailer that records success without an SMTP send fails, cite it as file:line. Pass: scan storage reaches the environment-configured S3 client and mail reaches the environment-configured SMTP transport on every code path."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-45",
]
evidence = "file_line"
cites = "L81, L686, L694, L845"

[[criterion]]
id = "Q1"
name = "Q1"
type = "binary"
weight = 3
description = "Recipe: search server and client domain code for `any`, and for `as` or non-null assertions that turn request data into a domain type without checking it. Each instance in domain code fails, cite each as file:line. Pass: domain code has no `any` and no type assertion that hides a mismatch between request data and domain types."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L852"

[[criterion]]
id = "Q2"
name = "Q2"
type = "binary"
weight = 5
description = "Recipe: for each rule the brief lists as decided in one place (copies and shortfall, running time and cut saving, parts to mark, seating and folder visibility, publish guards, programme and rental transitions, single-line text, upload file-name decoding, download file-name encoding, London wall-clock conversion, overdue, reminder date), find every place in server and client source that decides it. A second implementation fails, cite both locations as file:line. A client lookup that only chooses which status buttons to show, while the server enforces the transition, is not a second implementation. Pass: each listed rule is decided in exactly one function or SQL definition that every caller uses."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L159, L175, L854"

[[criterion]]
id = "Q3"
name = "Q3"
type = "binary"
weight = 5
description = "Recipe: read the schema plus the handlers that create cuts, store marks, publish, save check-in counts and mark a rental set returned. A select-then-insert or select-then-update guarded only in application memory fails, cite it as file:line. Pass: each concurrency rule is enforced by a database constraint, conditional write or row lock inside a transaction."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L613-L614, L667, L670-L671, L855"

[[criterion]]
id = "Q4"
name = "Q4"
type = "binary"
weight = 3
description = "Recipe: search the source for commented-out code, unused exports, unreachable branches, interfaces or base classes with a single implementation, guards for states the schema makes impossible, and features beyond the brief. Each instance fails, cite each as file:line. Pass: the source contains no commented-out code, unused export, unreachable branch, single-implementation abstraction or impossible-state guard."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L856, L859"

[[criterion]]
id = "Q5"
