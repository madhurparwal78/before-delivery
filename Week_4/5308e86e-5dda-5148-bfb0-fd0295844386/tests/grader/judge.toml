[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 3
description = "Recipe: read the global stylesheet or theme tokens and the button, link and focus-outline styles in the marketing and cockpit sources. A second hard-coded blue on an action's resting state counts as a fail. The brief's slightly darker button hover and press, pale accent-wash menu hover and the muted violet or deeper sand link hover on tinted pages are allowed. Navigation chrome is not an action link: the accounts rail's rows and page links (the active account is a raised near-black row with near-white text) and the marketing header's menu triggers and Pricing, Dashboard and Log in links may rest in the ink colour; they fail only if they use a blue other than the shared token. Cite the token definition and three uses as `file:line`. Pass: every primary action, content link and focus-outline rule that rests in blue reads one shared action-blue token, and no second blue appears on any action, link or focus outline."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-41",
]
evidence = "file_line"
cites = "L179, L243, L959, L965, L1012, L2071"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 3
description = "Recipe: trace how `/credit`, `/business-payments` and `/spend-management` get their tint and how cockpit routes get their surfaces. A tint rule reaching any cockpit route counts as a fail. Cite each tint definition and its attachment point as `file:line`. Pass: the lavender and sand tints attach only through page-scoped classes or themes on their own marketing routes."

[criterion.annotations]
channel = "source"
