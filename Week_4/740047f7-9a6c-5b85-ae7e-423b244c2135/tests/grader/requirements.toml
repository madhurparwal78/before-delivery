[[requirements]]
id = "DP-41"
title = "Dialogs and focus"
text = "Every dialog keeps Tab and Shift+Tab inside it, closes on Escape and returns focus to the control that opened it, and every action works by keyboard with a visible focus ring. A dialog opened from inside another dialog closes alone on Escape, and every download link saves a file with exactly the stored bytes without leaving the page. The Keyboard shortcuts dialog that ? opens on the report link page follows the same rules."
