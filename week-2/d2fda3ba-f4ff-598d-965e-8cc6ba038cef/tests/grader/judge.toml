type = "binary"
weight = 3
description = "Recipe: search server and browser source for commented-out code, unused exports, unreachable branches, plus null or type checks on values the types already guarantee. Each instance counts as a fail, cited as `file:line`. Pass: no commented-out code, unused export, unreachable branch or impossible-state check exists."

[criterion.annotations]
channel = "quality"
