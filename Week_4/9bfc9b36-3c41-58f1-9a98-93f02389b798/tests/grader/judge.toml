[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server configuration module and every place that builds a Postgres, Keycloak or MinIO client, then search server code for connection strings, hostnames, client secrets, access keys and passwords. The brief's documented defaults (port 4173, hold seconds 1200, owner limits 10 and 30, window 3600) and the seeded accounts in the seed module are allowed. A hard-coded service URL or secret outside those defaults is a defect; cite each as `file:line`. Pass: every Postgres, Keycloak and MinIO address and credential in server code is read from the environment."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-65",
]
evidence = "file_line"
cites = "L123, L1316-L1324, L1499, L1507-L1514"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 3
description = "Recipe: read the browser source (pages, components, request module) and list every `fetch`, XHR and `EventSource` target, then search it for Keycloak, MinIO and Postgres addresses and seeded passwords. A direct service call or an embedded secret is a defect; cite each as `file:line`. Pass: every network call in the browser source targets a same-origin `/api` address."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-65",
]
evidence = "file_line"
cites = "L123, L1319, L1324, L1518, L1535"

