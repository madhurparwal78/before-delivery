text = "Fonts and icons ship inside the app and load from its own origin, with no CDN or third-party request at runtime."
tests = [
    "test_app.py::test_if_assets_same_origin",
]
parameter_cases = []

[[if_rules]]
id = "IF-07"
text = "Server and browser code is TypeScript compiled with strict mode enabled, and npx tsc --noEmit passes."
