text = "Permission-log labels, event streams and write replies never carry a card or board the reader cannot see, and a person whose write meets a newly hidden card sees it leave their board with the published notice."
kind = "behavior"
primary = "pytest"
workflow = "privacy"
tests = [
    "test_app.py::test_hidden_cards_never_reach_copies",
    "test_app.py::test_wf_privacy_write_meets_hidden_card",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-57"
title = "Literal, bounded search"
text = "Search treats every character literally, ignores case across Unicode, counts length in code points from 2 to 100, and reports totals above 50 with the published sentence."
kind = "behavior"
primary = "pytest"
workflow = "search-and-isolation"
tests = [
    "test_app.py::test_wf_search_and_isolation_literal",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-58"
title = "Opaque errors"
text = "No response, header, event or on-screen message reveals a service address, driver error, stack or environment value, unexpected errors answer the published 500, and malformed ids answer the plain not-found."
kind = "behavior"
primary = "pytest"
workflow = "live-outage"
tests = [
    "test_app.py::test_opaque_errors",
    "test_app.py::test_unexpected_error_notice",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-59"
title = "Exact accessible names"
text = "List tabs, card buttons, the lock icon, the owner chip and the Boards button carry exactly the published accessible names and states at every viewport."
kind = "behavior"
primary = "pytest"
workflow = "phone-board"
tests = [
    "test_app.py::test_accessible_names",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-60"
title = "Server decides due dates"
text = "The browser never derives a due date or label from its own clock or time zone, and a workspace time-zone change shows on open boards at their next minute re-read."
kind = "behavior"
primary = "pytest"
workflow = "card-lifecycle"
tests = [
    "test_app.py::test_wf_card_lifecycle_due",
]
criteria = []
parameter_cases = []

