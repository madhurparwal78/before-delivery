description = "Recipe: for each of the version-number and conflict check, the canonical hash, the visibility check with the not-found answer, the like and fork counts, the diff counting and the console formatting, find every place the rule is implemented, including routes, the grading seed, fork and restore paths, the client, and the preview frame's script. A second implementation or a copy of the rule's logic is a defect, cited as `file:line` for both places. Pass: each of the six rules is decided in exactly one function that every caller uses."

