[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "postgres-down"
port = 4174
url_env = "APP_POSTGRES_DOWN_URL"

[outages.env]
DATABASE_URL = "postgresql://gf_app:down@127.0.0.1:9/gf_down"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"
MAILPIT_URL = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_mail"
S3_BUCKET = "${S3_BUCKET}-mail"

[[outages]]
id = "minio-down"
port = 4176
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "killbill-down"
port = 4177
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "short-timer"
port = 4178
url_env = "APP_SHORT_URL"

[outages.env]
INVITE_TTL_SECONDS = "5"
KNOCK_TTL_SECONDS = "4"
PRESENCE_AWAY_SECONDS = "5"
STREAM_GRACE_SECONDS = "4"
OUTBOX_RETRY_SECONDS = "2"
IDEMPOTENCY_TTL_SECONDS = "30"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[outages]]
id = "short-twin"
port = 4179
url_env = "APP_SHORT_TWIN_URL"

[outages.env]
INVITE_TTL_SECONDS = "5"
KNOCK_TTL_SECONDS = "4"
PRESENCE_AWAY_SECONDS = "5"
STREAM_GRACE_SECONDS = "4"
OUTBOX_RETRY_SECONDS = "2"
IDEMPOTENCY_TTL_SECONDS = "30"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[outages]]
id = "shifted-clock"
port = 4180
url_env = "APP_SHIFTED_CLOCK_URL"

[outages.env]
SERVER_CLOCK_START = "2026-11-03T07:58:00+13:00"
OUTBOX_RETRY_SECONDS = "2"
DATABASE_URL = "${DATABASE_URL}_clock"
S3_BUCKET = "${S3_BUCKET}-clock"

