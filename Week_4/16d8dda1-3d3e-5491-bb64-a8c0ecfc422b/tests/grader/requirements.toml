health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[services]]
name = "postgres"

[services.env]
GRADING_KEY = "slatehall-grading-4e82a1"
TZ = "UTC"
BREAKOUT_SECONDS = "480"
BREAKOUT_WARNING_SECONDS = "30"
BREAKOUT_EXTEND_SECONDS = "120"
LATE_AFTER_MINUTES = "5"
LEFT_EARLY_MINUTES = "10"
RECONNECT_GRACE_SECONDS = "90"
SLIDE_MAX_BYTES = "5000000"
MODEL_MAX_BYTES = "10000000"
SLIDES_MAX_PER_LESSON = "40"
CHAT_MAX_CHARS = "300"

[[services]]
name = "minio"

[services.env]

[[services]]
name = "valkey"

[services.env]

[[outages]]
id = "second-instance"
port = 4174
url_env = "APP_SECOND_URL"

[outages.env]
INSTANCE_NAME = "b"

[[outages]]
id = "short-timers"
port = 4175
url_env = "APP_TIMERS_URL"

[outages.env]
BREAKOUT_SECONDS = "20"
BREAKOUT_WARNING_SECONDS = "5"
RECONNECT_GRACE_SECONDS = "3"

[[outages]]
id = "minio-down"
port = 4176
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "valkey-down"
port = 4177
url_env = "APP_VALKEY_DOWN_URL"

[outages.env]
VALKEY_URL = "redis://127.0.0.1:9"

