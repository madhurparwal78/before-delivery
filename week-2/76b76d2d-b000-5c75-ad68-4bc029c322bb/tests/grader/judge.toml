[[criterion]]
id = "S4"
name = "S4"
type = "binary"
weight = 3
description = "Recipe: Read the configuration loader. Search the source for literal URLs, hosts, user names, passwords, API keys and connection strings. The documented defaults are allowed: port 4173, the `0.0.0.0` listen address, the `APP_PUBLIC_URL` localhost fallback, the `MAIL_FROM` sender value and the four time-rule defaults. The seed accounts' published emails and passwords, and hashes of those passwords, are also allowed in seed code. Any other hard-coded credential or service address fails. Cite each as `file:line`. Pass: every credential or service address the app uses is read from the environment."

