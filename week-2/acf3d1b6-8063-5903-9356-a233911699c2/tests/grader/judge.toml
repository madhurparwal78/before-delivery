type = "binary"
weight = 5
description = "Recipe: from the `POST /api/generations` handler, trace the balance check, the parallel-limit check, the generation insert, the charge entry insert and the balance update down to the SQL they run. A balance read in one statement and written in another with no row lock, conditional update or constraint between them fails, cited as `file:line`. Pass: the checks and writes run in one database transaction that serialises concurrent starts for the same workspace."

[criterion.annotations]
