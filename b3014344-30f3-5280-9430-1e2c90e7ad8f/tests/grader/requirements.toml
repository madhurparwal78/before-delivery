allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "explore-work",
    "pricing-quote",
    "checkout-deposit",
    "price-change",
    "launch-balance",
    "refunds-credits",
    "care-change",
    "care-pause-cancel",
    "dunning",
    "portal-files",
    "teammates",
    "contractor-access",
    "outage-recovery",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "S4",
    "S5",
    "S6",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 95
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "minio", env = {} },
    { name = "pocketbase", env = {} },
    { name = "killbill", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Pampero Build Co. <ledger@pampero.test>" } },
]

[criterion_weights]
B1 = 5
B2 = 3
B3 = 5
B4 = 5
B5 = 5
B6 = 3
B7 = 5
B8 = 3
B9 = 3
B10 = 5
B11 = 3
B12 = 3
