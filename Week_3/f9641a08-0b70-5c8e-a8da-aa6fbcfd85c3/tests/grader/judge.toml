[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: open the config module and the server entrypoint, then search the application source (outside seed data) for connection strings, hostnames, passwords, access keys, tokens and quoted secrets, and note any place a credential is logged or placed in a page or API response. Defaults the brief documents (port, sender address, timer and limit values) are allowed. Pass: every credential and service address in the source is read from the environment."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L1086-L1113, L1129-L1130"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: search the source for module-level Map, Set or array stores, file writes, JSON or SQLite files and cache or queue clients, then read how carts, holds, wishlists, sessions, checkouts, idempotency keys, stock movements and the live-event sequence are stored (the set of open stream connections is not a record and is allowed). Pass: none of those records is kept only in process memory or in files."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
