{% extends "app_page.html" %}
{% set module = "upload" %}
{% set title = "Upload" %}
{% block app %}
<div class="upload-wrap">
  <h1 class="page-title small-title">Upload an activity</h1>
  <form class="card upload-form" novalidate data-upload-form>
    <div class="dropzone" data-dropzone>
      <svg class="icon dropzone-icon" aria-hidden="true" focusable="false"><use href="#i-route"/></svg>
      <p class="dropzone-text">Drag a GPX file here</p>
      <p class="muted small">or choose one from your device</p>
    </div>
    <div class="field">
      <label for="gpx-file">GPX file</label>
      <input class="input file-input" id="gpx-file" name="gpx" type="file" accept=".gpx,application/gpx+xml,text/xml,application/xml">
    </div>
    <div class="preview" data-preview aria-live="polite"></div>
    <div class="field"><label for="activity-name">Name</label><input class="input" id="activity-name" name="name" type="text" maxlength="100" autocomplete="off"></div>
    <div class="form-row">
      <div class="field"><label for="activity-sport">Sport</label>
        <select class="select" id="activity-sport" name="sport_type"><option value="run">Run</option><option value="ride">Ride</option><option value="walk">Walk</option><option value="hike">Hike</option></select></div>
      <div class="field"><label for="activity-visibility">Visibility</label>
        <select class="select" id="activity-visibility" name="visibility"><option value="everyone">Everyone</option><option value="followers">Followers</option><option value="only_me">Only You</option></select></div>
    </div>
    <div class="live" aria-live="polite" data-upload-result></div>
    <button class="btn btn-primary btn-pill btn-lg" type="submit">Save activity</button>
  </form>
</div>
{% endblock %}
