[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: With the source MCP find where the server reads configuration at start (search for `process.env`). Confirm that every external-service address, credential, key, token, timer and limit in the brief's configuration list is read there. Search the whole source tree for string literals that look like host or port addresses, passwords, access keys or the grading route token. The defaults the brief documents (the serving port, the public port override and each timer or limit default) are allowed, and any other literal fails. Cite each defect as `file:line`. Pass: Every service address, credential, key and token is read only from the environment, with no literal in the source other than the defaults the brief documents."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-04",
]
evidence = "file_line"
cites = "L584-L601, L819, L823-L830"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 3
description = "Recipe: With the source MCP find what the server hands to browser code: any config endpoint or inlined bootstrap script, the client source that reads configuration, and the serialisers behind the API responses and live events. Cite each defect as `file:line`. Pass: The only configuration values that reach browser code are the toast duration, the minimum pay report count and the search page size, with no credential, key, token or service address in client source or in any payload it builds."

