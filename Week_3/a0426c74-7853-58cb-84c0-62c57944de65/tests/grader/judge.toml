name = "Q1"
type = "binary"
weight = 5
description = "Recipe: Read the tsconfig files for strict mode, then search server, client and shared source for `any` annotations, `as any`, `as unknown as`, `as` casts on domain values, non-null `!` assertions, `@ts-ignore` and `@ts-expect-error`. Each instance on a domain value such as an entity, operation, version or role is a defect, cited as `file:line`. Pass: No domain value is typed any or forced through an assertion that hides a mismatch."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L1163"

[[criterion]]
id = "Q2"
name = "Q2"
type = "binary"
weight = 3
description = "Recipe: Read the type definitions, database schema and operation handlers, then list the identifiers used for operation, base revision, group, handle, layer state, block insert, xref, viewport, version, markup, issue, RFI, ball in court and review step. A synonym standing in for one of those terms, such as `patch`, `rev` or `owner`, in any of server, client or schema is a defect, cited as `file:line`. Pass: Identifiers for these domain terms match the brief's wording across server, client and schema."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L1164"

[[criterion]]
id = "Q3"
name = "Q3"
type = "binary"
weight = 5
description = "Recipe: For each rule, find where it is decided and who imports it: the transitions for versions, issues, RFIs, exports and reviews, the trim, fillet, offset and mirror formulas, the conflict rules, the error order, dimension values, hatch areas and compare counts. The same rule written once on the server and again in the client, or twice on one side, is a defect, cited with both `file:line` locations. Pass: Each listed rule is decided in exactly one source location, imported by every side that uses it."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L1165"

[[criterion]]
