[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: Read the server's configuration code and every place that builds the database pool, the object-storage client and the mail transport. Trace each connection string, endpoint, region, bucket, access key, secret, SMTP host, port and From line back to its source. The brief's documented defaults (port 4173, the public URL falling back to `http://localhost:<port>`, the 30000 ms presence timeout, grading routes off unless `on`) are allowed. Cite each env read and each literal as `file:line`. Pass: every service credential and URL is read from `process.env` with no literal credential, host or bucket in source."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L90, L683, L688-L699"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: Trace the image upload handler from its route to the object-storage calls. An in-memory map, local-disk folder or no-op stand-in that replaces object storage fails, as does a confirmation that skips the read-back. Cite the write and read-back calls as `file:line`. Pass: the upload handler marks an image confirmed only after reading its object back through a real S3-compatible client."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L90, L570, L622-L627, L722"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: Trace the invitation route and the mention-mail path to the mail transport. A transport that only logs, writes files or is swapped for a fake when not configured fails. Cite the send calls and the store-after-accept ordering as `file:line`. Pass: both mail paths send through an SMTP transport built from the environment, with the invitation stored only after the server accepts the mail."

[criterion.annotations]
