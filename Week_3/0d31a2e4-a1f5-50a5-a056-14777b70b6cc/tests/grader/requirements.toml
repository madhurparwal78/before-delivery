[[requirements]]
id = "DP-01"
title = "Sign-up with verification email"
text = "Visitors create an account with email, handle and password, and the server sends a verification link to that address through Mailpit, as qualified in Business rules and Services."
kind = "behavior"
primary = "pytest"
workflow = "account"
tests = [
    "test_app.py::test_signup_sends_verification_link",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Single-use expiring links"
text = "Verification and reset links work once, expire after the published lifetime measured on the server process's own clock, and stop working once a newer link of the same kind is issued, as qualified for overlapping requests in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "account"
tests = [
    "test_app.py::test_links_single_use_and_replaced",
    "test_app.py::test_links_expire_on_server_process_clock",
]
criteria = []
parameter_cases = []

