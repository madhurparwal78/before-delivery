[[criterion]]
id = "Q5"
name = "Q5"
type = "binary"
weight = 3
description = "Recipe: read how the app works out each final ML and ML/day figure it stores, returns or shows as settled: placement, quote, ration, restriction pro-rating, capacity saves, totals and the pack document. Decide for each whether the figure always equals the exact decimal result, rounded once to three decimals with halves up (the ration's published round-down excepted). Cite as `file:line` any final figure whose result can differ from that, such as one added, multiplied, divided, rounded or stored in binary floating point. Judge the figure, not the function names or number types used to reach it. Reading a request value that the brief allows as a JSON number with at most three decimals into an exact value is correct and never a defect, and so are the in-between frames of the 0.6 second figure animation, which are not final figures, provided the figure it settles on is the exact one. Pass: every final ML and ML/day figure is exact in this way."

