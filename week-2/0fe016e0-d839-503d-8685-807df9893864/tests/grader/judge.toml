weight = 5
description = "Recipe: `playwright` at 1280x800. 1. Open `/console`. 2. In `region \"Extended telemetry upload\"`, locate the rung 1 card's state word. 3. With `browser_evaluate`, read the computed text colour, background colour and border colours of the element holding that word and of its badge or card. 4. Screenshot the card. Pass: the printed word `Active` sits inside or directly beside a green-hued mark (hue 90 to 160 degrees, as text colour, fill or edge) on that card."

[criterion.annotations]
