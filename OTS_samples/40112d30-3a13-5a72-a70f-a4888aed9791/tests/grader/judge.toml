description = "Recipe: read the configuration module and search the source for `process.env`, then search the app's own source (not the provided dev compose service files and their environment, which IF-07 keeps unchanged) for literal connection strings, hosts, credentials, keys, expiry hours, shuffle seed, size caps, formula caps, export minutes and rate limits, allowing the brief's documented defaults (port 4173 and the base-URL fallbacks) and the numbers the brief fixes without a variable (such as the 1,000,000-byte JSON body cap), and noting each hard-coded value as `file:line`. Pass: no value of a variable listed in Configuration and secrets is hard-coded in source."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-59",
]
evidence = "file_line"
cites = "L86, L895-L916, L952"

