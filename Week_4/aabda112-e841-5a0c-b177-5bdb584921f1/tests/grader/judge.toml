weight = 3
description = "Recipe: in the browser-side source and in every server route that serves configuration or a page shell, search for environment values, credentials, tokens and service endpoints being injected into served pages, bundles or JSON bodies. A plain setting value the brief shows or uses in the UI (such as VAT_PERCENT, UPLOAD_MAX_MB or SLOT_MINUTES) is allowed. Cite each leak as `file:line`. Pass: no credential, token, service endpoint or connection setting reaches the browser."

