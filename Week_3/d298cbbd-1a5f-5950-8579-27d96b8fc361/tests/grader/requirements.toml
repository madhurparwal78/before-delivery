schema_version = 1
id_prefix = "DP"
mandatory_count = 76
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "timed-test",
    "correction-rules",
    "restart-and-command-line",
    "text-view-warnings",
    "phone-typing",
    "quote-and-custom",
    "carbon-replay",
    "signup-to-history",
    "tampered-log",
    "live-board",
    "private-race",
    "race-rejoin",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "B13",
    "S1",
    "S2",
    "S3",
    "S4",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 90
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Strikeproof <proofs@strikeproof.test>" } },
]

[criterion_weights]
B1 = 5
B2 = 3
B3 = 5
B4 = 3
B5 = 3
B6 = 3
B7 = 5
B8 = 3
B9 = 5
B10 = 3
B11 = 3
B12 = 3
B13 = 3
S1 = 5
S2 = 5
S3 = 3
S4 = 3
Q1 = 5
Q2 = 5
Q3 = 3
Q4 = 3
Q5 = 3
Q6 = 5
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "mail-down"
port = 4174
url_env = "APP_MAIL_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[outages]]
id = "short-timer"
port = 4175
url_env = "APP_SHORT_URL"

[outages.env]
TICKET_TTL_SECONDS = "8"
RACE_COUNTDOWN_SECONDS = "1"
RACE_REJOIN_SECONDS = "4"
RACE_TIME_LIMIT_SECONDS = "20"
VERIFY_TTL_SECONDS = "8"
TEXT_SEED = "777"
DATABASE_URL = "${DATABASE_URL}_short"

[[requirements]]
id = "DP-01"
title = "Server-issued tickets"
text = "Every test, signed in or not, starts from a ticket the server issues through the tickets endpoint with its exact words, seed, quote id and expiry, as specified in API."
kind = "behavior"
primary = "pytest"
workflow = "timed-test"
tests = [
    "test_app.py::test_tickets_endpoint",
]
criteria = []
parameter_cases = []

