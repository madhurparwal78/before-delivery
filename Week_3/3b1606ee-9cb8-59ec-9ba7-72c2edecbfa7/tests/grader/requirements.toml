[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
GRADING = "1"

[[outages]]
id = "short"
port = 4175
url_env = "APP_SHORT_URL"

[outages.env]
GRADING = "1"
ATTACHMENT_MAX_BYTES = "524288"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
id = "DP-01"
title = "Username rules"
text = "Usernames are 3 to 32 characters of lowercase letters, digits, underscores and dots, start with a letter, do not end with a dot, compare case-insensitively, are unique, and the availability check answers with the reasons in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "signup"
tests = [
    "test_app.py::test_username_rules",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Sealed sign-up"
text = "Signing up takes only a username, a public identity key, a recovery verifier and a sealed key backup, sets a session cookie, and stores no plaintext private key, recovery code, display name or photo."
kind = "behavior"
primary = "pytest"
workflow = "signup"
tests = [
    "test_app.py::test_sealed_signup",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Sign-up journey"
text = "On a 375 by 812 phone, a new person picks a username with the live availability chip, writes down and checks their recovery code, sets a display name and optional photo, and lands on the empty letters list, all by keyboard."
kind = "behavior"
primary = "workflow"
workflow = "signup"
tests = [
    "test_app.py::test_wf_signup_keyboard",
    "test_app.py::test_wf_signup_mistakes",
    "test_app.py::test_wf_signup_touch_phone",
    "test_app.py::test_wf_signup_chip_debounce",
    "test_app.py::test_wf_signup_photo_keyboard",
]
criteria = []
parameter_cases = []

