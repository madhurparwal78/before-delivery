S3 = 3
S4 = 3
Q1 = 3
Q2 = 3
Q3 = 5
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 5

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "wiremock-down"
port = 4174
url_env = "APP_WIREMOCK_DOWN_URL"

[outages.env]
WIREMOCK_URL = "http://127.0.0.1:9"

[[outages]]
id = "gotenberg-down"
port = 4175
url_env = "APP_GOTENBERG_DOWN_URL"

[outages.env]
GOTENBERG_URL = "http://127.0.0.1:9"

[[outages]]
id = "short-review"
port = 4176
url_env = "APP_SHORT_REVIEW_URL"

[outages.env]
REVIEW_SECONDS = "15"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[outages]]
id = "late-clock"
port = 4177
url_env = "APP_LATE_CLOCK_URL"

[outages.env]
SETTLEMENT_CLOCK_START = "2026-12-03T00:00:00Z"
DATABASE_URL = "${DATABASE_URL}_late"
S3_BUCKET = "${S3_BUCKET}-late"

[[outages]]
id = "year-end-clock"
port = 4178
url_env = "APP_YEAR_END_CLOCK_URL"

[outages.env]
SETTLEMENT_CLOCK_START = "2026-12-31T12:00:00Z"
DATABASE_URL = "${DATABASE_URL}_yearend"
S3_BUCKET = "${S3_BUCKET}-yearend"

