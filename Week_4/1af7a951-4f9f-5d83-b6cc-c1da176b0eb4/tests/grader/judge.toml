type = "binary"
weight = 5
description = "Recipe: read the server start-up path and its configuration module, then search all source for literal service hosts, ports, usernames, passwords, API keys, secrets, bucket names, connection strings and the mail sender, citing each environment read and each offending literal as `file:line`. Pass: every Postgres, Kill Bill, MinIO and mail setting comes only from the environment, with port 4173 as the only literal default."

