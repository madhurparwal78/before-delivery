[[requirements]]
id = "DP-01"
title = "Account sign-up"
text = "Signing up answers the same accepted response and queues exactly one confirmation-subject mail whether or not the address is already registered, as qualified in Business rules and Services."
kind = "behavior"
primary = "pytest"
workflow = "onboarding"
tests = [
    "test_app.py::test_signup_same_answer_one_mail",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Email verification"
text = "A confirmation link verifies its account once, and only while it is within the verification lifetime; used, superseded or expired links answer invalid_token."
kind = "behavior"
primary = "pytest"
workflow = "onboarding"
tests = [
    "test_app.py::test_verification_link_lifetime",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Sign-in and session"
text = "Signing in with the right password starts a session cookie and returns a fresh CSRF token, a wrong password or unknown email gets the identical invalid_credentials answer, and signing out ends the session."
kind = "behavior"
primary = "pytest"
workflow = "onboarding"
tests = [
    "test_app.py::test_signin_and_signout",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Password reset"
text = "A reset request answers identically for any address, the reset link works once and only within the reset lifetime, and completing it ends every existing session of that account."
kind = "behavior"
primary = "pytest"
workflow = "onboarding"
tests = [
    "test_app.py::test_password_reset",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-05"
title = "Sign-in and mail throttles"
text = "Sign-in attempts, reset requests and confirmation resends beyond the limits in Business rules answer rate_limited with a Retry-After header, and exactly the limit succeeds even when the requests arrive at the same instant."
kind = "behavior"
primary = "pytest"
workflow = "onboarding"
tests = [
    "test_app.py::test_auth_throttles",
]
criteria = []
parameter_cases = [
    "signin",
    "forgot",
    "resend",
]

[[requirements]]
id = "DP-06"
title = "One live link per account"
text = "When several confirmation or reset links for one account are issued at the same instant, exactly one of each kind works afterwards, the one issued last, and every other answers invalid_token."
kind = "behavior"
primary = "pytest"
workflow = "onboarding"
tests = [
    "test_app.py::test_one_live_link",
]
criteria = []
parameter_cases = [
    "confirmation",
    "reset",
]

