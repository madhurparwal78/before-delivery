schema_version = "1.4"

[[artifacts]]
source = "/app"
exclude = [
    "node_modules",
    ".git",
]

[task]
name = "gf/stillhour"
version = "1.0.0"
description = "Stillhour Wind-Down Planner: a cinematic single-page scroll story over one fixed WebGL canvas that ends in a planner for the hour before bed, with emailed one-time links, nightly reminder emails at the local start of each hour (DST-safe), share links for partners, an outbox for mail outages, idempotent saves and versioned edits, on PostgreSQL and Mailpit."
authors = [
    { name = "Mohd Rafey", email = "mohd.rafey@ethara.ai" },
]
keywords = [
    "sleep",
    "wind-down",
    "scroll storytelling",
    "webgl",
    "reminders",
    "time zones",
    "daylight saving",
    "email outbox",
    "idempotency",
    "typescript",
]

[metadata]
uuid_v5 = "1bc089d6-99c9-56d4-9f19-fab9a98ac22a"
identity_namespace_url = "https://tasks.example/gf/stillhour/1.0.0"
category = "Greenfield"
domain = "personal sleep routines and evening wind-down planning (bedtime reminders by email)"
archetype = "individual"
language = "typescript"
design_direction = "Dusky, cinematic, hushed: the page ground darkens chapter by chapter from pale lilac to near-black over one fixed 3D canvas, one warm ember accent for light sources and actions, Fraunces display with Hanken Grotesk body, airy spacing."
created_at = "2026-10-26"
seed = "prd"
service_profile = "postgres+mailpit"
harbor_version = "0.24.0"
grader_version = "gfkit-0.1.0/rewardkit-0.2.3"
contract_version = "1.0.0"
requirements_registry = "tests/grader/requirements.toml"
mandatory_requirement_count = 60
workflow_count = 12
rubric_criterion_count = 23
rubric_total_weight = 81
if_constraint_count = 7
scoring_policy = "reward=pytest-outcome-pass-rate;if_score+rubric+quality+combined_score-separate;binary-rubric-5/3/1"
self_contained = true
builds_from_source = true
null_floor = 0.0
platforms = [
    "linux/amd64",
    "linux/arm64",
]

[agent]
timeout_sec = 36000.0
network_mode = "public"

[environment]
os = "linux"
cpus = 4
memory_mb = 4096
storage_mb = 20480
network_mode = "public"
build_timeout_sec = 3600.0

[verifier]
environment_mode = "separate"
timeout_sec = 36000.0

[verifier.env]
JUDGE_SECRET = "${JUDGE_SECRET:-}"
JUDGE_URL = "${JUDGE_URL:-http://host.docker.internal:8790}"
