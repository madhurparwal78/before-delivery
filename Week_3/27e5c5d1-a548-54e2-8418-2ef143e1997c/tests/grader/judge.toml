description = "Recipe: 1. Search the source for imports of the Valkey or relay client library and of the S3 client library. 2. Read the module found for each and note where connection setup, retry, backoff and outage detection are written. 3. Search other files for their own connection setup, retry loops or outage flags for those services. Cite each stray use as file:line. Pass: each service's connection, retry and outage handling is written in exactly one module."

[criterion.annotations]
