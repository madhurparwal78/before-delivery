[services.env]
GRADING_KEY = "hearthtile-grading-7d31c9"
STEP_MIN_INTERVAL_MS = "0"
DROP_GRACE_SECONDS = "30"
VOTE_WINDOW_SECONDS = "60"
INVITE_TTL_SECONDS = "604800"
REMINDER_LEAD_MINUTES = "60"
CHAT_MAX_CHARS = "300"
