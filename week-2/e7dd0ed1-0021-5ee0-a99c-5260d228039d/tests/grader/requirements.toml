rubric_total_weight = 95
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "minio", env = {} },
    { name = "killbill", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Farshore <no-reply@farshore.test>" } },
]

[criterion_weights]
B1 = 5
B2 = 5
B3 = 3
B4 = 5
B5 = 5
B6 = 5
B7 = 5
B8 = 3
B9 = 3
B10 = 3
B11 = 3
