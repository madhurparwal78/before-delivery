description = "Recipe: List the type, function, table and column names for the parcel and shipment, quote, payment leg, settlement line, landed price, promise date, listing and half-signed-in session concepts. A second name for the same concept, such as package, sub-order, estimate or pending-session used beside the brief's term, fails. Cite each as `file:line`. Pass: Each of those concepts is named with the brief's own term throughout the source."

[criterion.annotations]
