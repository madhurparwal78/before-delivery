[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: In the source, find where the environment is read (search `process.env`) and trace each of the fifteen timer and limit variables from the brief's configuration table to the code that enforces it (vote and post rates, lockout, link lifetimes, resend limit and window, report deadline, archive age, community account age, edit window, lock hour, two-factor threshold, image size). A limit whose number is repeated as a literal inside an enforcing path is a defect, and the documented defaults in the table are allowed. Cite each defect as `file:line`. Pass: each of the fifteen variables is read from the environment with its documented default."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-45",
]
evidence = "file_line"
cites = "L702-L731, L745"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: Search the source for connection strings, hosts, ports, user names, passwords, access keys and secrets used for the database, object storage, Valkey, SMTP, the mail sender, the public URL and the grading key. Allowed literals are only what the brief documents: the listening port, the default mail sender, the public URL fallback, the default key prefix, and the seed accounts' published passwords and secret. Cite each defect as `file:line`. Pass: every service URL, credential and key comes only from environment variables with no literal fallback beyond those documented defaults."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-45",
]
evidence = "file_line"
cites = "L702-L710, L731"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: Read what the server hands to the browser: the HTML shell or template, any client config or bootstrap object, the handlers for `/api/me` and `/api/health`, and the client source directory. Look for environment values (including the server-side limits and timers set by environment variables), service addresses or credentials being serialised or imported into client code. The browser's own page timers that the brief states (toast lifetime, highlight, live retry, admin refetch) are expected in client code and are not defects. Cite each defect as `file:line`. Pass: no environment value, service address or credential reaches the browser through the HTML shell, the client source or the two API handlers."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-45",
]
evidence = "file_line"
cites = "L702, L74"

