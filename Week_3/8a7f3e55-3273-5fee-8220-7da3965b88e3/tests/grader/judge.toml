type = "binary"
weight = 5
description = "Recipe: with the `source` MCP, search the whole source tree (seed data and the seeded demo password are exempt) for URL, host, port, credential, key and bucket literals, then trace each service URL, credential and bucket setting named in the brief configuration section to where it is consumed. Pass: every service URL, credential, key and bucket name used at runtime comes from the process environment, with no literal fallback except the documented port, time-setting defaults and seed data."

