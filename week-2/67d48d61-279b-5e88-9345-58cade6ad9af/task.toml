version = "1.0.0"
description = "Promptside, a keyboard-driven theatre production work tracker for one show from first rehearsal to opening night, with triage of rehearsal-room requests written back to a PocketBase intake, derived blocking with an ordered unblock cascade, sub-task roll-up, exact undo, versioned concurrent edits, rehearsal-week cycles with rollover, and MinIO-stored plots and sketches."
