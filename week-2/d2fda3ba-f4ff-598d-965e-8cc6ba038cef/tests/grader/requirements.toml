title = "Retried pushes record once"
text = "Repeating a push with the same Idempotency-Key and body returns the original response and records no second revision, blob or cursor step, while the same key with a different body is refused as stated in API."
kind = "behavior"
primary = "pytest"
workflow = "field-sync"
tests = [
