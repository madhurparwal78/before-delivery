[[requirements]]
id = "DP-23"
title = "Quote a claim"
text = "On an identified claim the operator presses Get quote once, the button stays disabled until the answer, and the address bar moves to the new quote revision's address with the part line, carriage line, total and dispatch promise on the slip."
