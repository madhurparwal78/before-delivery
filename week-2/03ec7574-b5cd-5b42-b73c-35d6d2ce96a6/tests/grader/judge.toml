[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: find where amount strings are matched against the pinned pattern and scaled by asset decimals, and where raw integers are formatted for display. Trace the callers from transfers, batch lines, deposits, the wallet approval floor, the evaluate route, the wallet and intent serialisers, the CSV export and the payroll batch running total. A page script may import a shared module served to the browser. Policy condition values are raw non-negative integers with their own grammar (a JSON integer or a digit string), so a separate check of them is not a copy of amount parsing. A second copy of the pattern, the decimal scaling or the trailing-zero trim is a defect; cite each as `file:line`. Pass: every listed caller parses and formats amounts through one shared module."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-63",
]
evidence = "file_line"
cites = "L144, L591-L602, L680, L1072"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: find the code implementing the five evaluation steps and the aggregation value computation. Trace the transfer route, each batch line check and the evaluate route to it. Any route that re-implements rule matching, DENY-before-ALLOW ordering, default deny or an aggregation sum or count is a defect; cite each as `file:line`. Pass: transfers, batch lines and the evaluate route all reach one shared policy evaluator."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-63",
]
evidence = "file_line"
cites = "L144, L694-L725, L1072"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: find every place that writes an intent's `status`. Trace approve, reject, cancel, execution, the expiry sweep, single-intent reads, the intents list and the approvals inbox. Creating an intent as `executed` or `pending_approval` (at creation or in the seed) is not a status change, and a query filter that only selects candidate rows (for example `expires_at <= now()`) before handing them to the shared expiry code is not a second rule. A status change outside the shared transition code, or a second place that decides whether an intent is expired, is a defect; cite each as `file:line`. Pass: every intent status change, expiry included, goes through one shared transition module."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-63",
]
evidence = "file_line"
cites = "L144, L727-L743, L804-L812, L1072"

[[criterion]]
id = "S4"
name = "S4"
type = "binary"
weight = 3
description = "Recipe: find the canonical JSON serialisation, the audit hash and the signed-event HMAC. Trace the audit append path, the seed's chain writer, the verify route and the signed log writer. A second canonicaliser, hash computation or signature builder in verify, seed or any route is a defect; cite each as `file:line`. Pass: the audit hash and the event signature are each computed in exactly one function shared by every caller."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-63",
]
evidence = "file_line"
cites = "L144, L878-L882, L898-L909, L1072"

[[criterion]]
id = "Q1"
name = "Q1"
type = "binary"
weight = 3
description = "Recipe: read every server and page-script source file. Count `require` against `import`/`export` usage, and search for `.then(` chains and callback-style asynchronous APIs. A mix of module styles, or a `.then` chain or callback where async/await fits, is a defect. Cite each as `file:line`. Pass: the source uses one module style throughout with async/await for all asynchronous work."

