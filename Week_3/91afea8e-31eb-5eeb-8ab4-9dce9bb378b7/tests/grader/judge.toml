description = "Recipe: Read tsconfig and the domain modules for money, cart, checkout, refunds, EMI and settlement. Search for `any`, `as any` and `: any` on domain values, and check that strict mode is on. Any domain value typed `any` fails. Cite each as `file:line`. Pass: No domain value in the source is typed `any`."

[criterion.annotations]
channel = "quality"
basis = "explicit"
