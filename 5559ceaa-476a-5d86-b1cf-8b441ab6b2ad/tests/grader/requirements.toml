    "path_traversal",
    "absolute_path",
    "path_too_long",
    "symlink",
    "disallowed_type",
    "content_mismatch",
    "unsafe_svg",
    "duplicate_path",
    "file_too_large",
    "total_too_large",
    "too_many_entries",
    "ratio_exceeded",
    "not_a_zip",
]

[[requirements]]
id = "DP-30"
title = "Import plan"
text = "An accepted zip produces an import plan that matches each entry to the project by normalised path as new, changed or unchanged, lists project files missing from the zip, changes no file, and carries a server-set expiry after which the server deletes the quarantined zip on its own within 10 seconds."
kind = "behavior"
