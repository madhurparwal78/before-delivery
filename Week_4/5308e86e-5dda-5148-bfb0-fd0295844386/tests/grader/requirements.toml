[[requirements]]
id = "DP-01"
title = "Snapshot from integer cents"
text = "Every balance and amount is stored and returned as integer cents. GET /api/snapshot reports total cash and total available equal to the sums over the accounts, with each account's balance, available balance and a thirty-day sparkline of end-of-day New York balances ending at its current balance."
kind = "behavior"
primary = "pytest"
workflow = "cockpit-snapshot"
tests = [
    "test_app.py::test_snapshot_seeded_state",
]
criteria = []
parameter_cases = []

