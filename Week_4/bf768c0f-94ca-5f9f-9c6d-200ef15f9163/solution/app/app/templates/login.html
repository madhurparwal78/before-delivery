{% extends "base.html" %}
{% block title %}Sign in — {{ club_name }}{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Sign in</h1>
  <p class="muted">Your username or the email you joined with.</p>
  <form id="login-form" novalidate>
    <div class="field">
      <label for="login-id">Username</label>
      <input id="login-id" name="email" type="text" autocomplete="username" required
             aria-describedby="login-id-error">
      <p class="field-error" id="login-id-error" role="alert"></p>
    </div>
    <div class="field">
      <label for="login-pw">Password</label>
      <input id="login-pw" name="password" type="password" autocomplete="current-password" required
             aria-describedby="login-pw-error">
      <p class="field-error" id="login-pw-error" role="alert"></p>
    </div>
    <input type="hidden" id="next-url" value="{{ next_url }}">
    <button class="button primary" type="submit" id="login-submit">Sign in</button>
    <p class="field-error" id="login-error" role="alert"></p>
  </form>
  <p class="form-note">New here? <a href="/join">Join the hall</a>.</p>
</div>
{% endblock %}
{% block scripts %}<script type="module" src="/static/js/auth.js"></script>{% endblock %}
