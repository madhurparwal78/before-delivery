importance = "critically_important"
requirements = [
    "DP-11",
]
evidence = "file_line"
cites = "L7, L39, L310, L462"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: in the server source, open the configuration loader, search for connection strings, hosts, ports, keys, passwords and `process.env`, and check how each setting in the brief's settings table is read. Defaults the brief itself documents (port 4173, the bind address, the `MAIL_FROM` default, the settings-table defaults, the clinic time zone, the demo seed emails and password) are allowed. Cite each hard-coded endpoint or credential as `file:line`. Pass: every service URL, credential and setting in the server source is read from the environment at start."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
