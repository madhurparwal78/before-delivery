type = "binary"
weight = 5
description = "Recipe: source view. 1. From the server entrypoint named by `run.json`, open the code that reads configuration. 2. Search the app source, tests excluded, for literal database, object store, mail and provider addresses, access keys and secrets. 3. The port and timer defaults the brief documents, the published sender value and the seeded sign-in passwords are not defects. Pass: Every service credential and address the brief's configuration section lists comes from its environment variable at start, with no literal value or undocumented fallback in the source, citing each read as `file:line`."

[criterion.annotations]
