schema_version = 1
id_prefix = "DP"
mandatory_count = 60
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "account-trial",
    "dashboard-files",
    "command-drafting",
    "object-properties",
    "layers",
    "locked-layer",
    "blocks-osnap",
    "dimensions",
    "layouts-export",
    "trace-review",
    "live-sync",
    "share-links",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B15",
    "B3",
    "B4",
    "B14",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "B13",
    "S1",
    "S2",
    "S3",
    "S4",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
]
rubric_total_weight = 89
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "minio", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Corbel Draft <no-reply@corbelworks.example>" } },
    { name = "valkey", env = {} },
]

[criterion_weights]
B1 = 5
B2 = 3
B15 = 3
B3 = 3
B4 = 3
B14 = 3
B5 = 5
B6 = 3
B7 = 3
B8 = 3
B9 = 3
B10 = 3
B11 = 5
B12 = 5
B13 = 3
S1 = 5
S2 = 3
S3 = 5
S4 = 3
Q1 = 5
Q2 = 3
Q3 = 3
Q4 = 3
Q5 = 3
Q6 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "valkey-down"
port = 4174
url_env = "APP_VALKEY_DOWN_URL"

[outages.env]
VALKEY_URL = "redis://127.0.0.1:9/0"

[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4176
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[outages]]
id = "short-timers"
port = 4177
url_env = "APP_SHORT_TIMERS_URL"

[outages.env]
VERIFY_LINK_SECONDS = "20"
PRESENCE_IDLE_SECONDS = "8"
SIGNIN_LOCK_SECONDS = "20"
INVITE_COOLDOWN_SECONDS = "10"
UPLOAD_MAX_BYTES = "20000"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
id = "DP-01"
title = "Account sign-up and confirmation."
text = "A visitor creates an account from the landing page with the Create account form, opens the confirmation email in Mailpit and, after its link confirms the address, signs in to an empty My Drawings dashboard."
kind = "behavior"
primary = "workflow"
workflow = "account-trial"
tests = [
    "test_app.py::test_wf_account_trial_signup",
    "test_app.py::test_wf_account_trial_invalid_signup",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Confirmation link lifetime."
text = "A confirmation link works until its published lifetime ends on the server clock, an expired or replaced link shows its published page, and Send a new link emails a fresh link that becomes the only working one."
kind = "behavior"
primary = "pytest"
workflow = "account-trial"
tests = [
    "test_app.py::test_verify_link_lifetime",
]
criteria = []
parameter_cases = []

