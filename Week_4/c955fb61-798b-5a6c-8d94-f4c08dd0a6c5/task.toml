[task]
name = "slackwater-instruments/slackwater"
version = "1.0.0"
description = "Slackwater Plan, a Gantt-chart planner for small teams: tasks, milestones and groups on a working-day calendar with holidays, four dependency types with lag, chosen and shown starts, critical path, baseline variance, percent rollup, cross-project workload, a keyboard list grid, live co-editing with version conflicts, delayed assignment mail through Mailpit and CSV and PDF exports stored in MinIO, with the Knock-on cascade motion."
authors = [
    { name = "Mohd Rafey", email = "mohd.rafey@ethara.ai" },
    { name = "Kaustubh Dalvi", email = "kaustubh.dalvi@ethara.ai" },
]
