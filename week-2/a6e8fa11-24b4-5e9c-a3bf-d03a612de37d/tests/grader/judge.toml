[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 5
description = "Recipe: Trace `POST /api/workbooks/<id>/sync`, `GET /api/workbooks/<id>` and the restore handler from route to storage, and find where cell values are computed. Accepting a client-sent `value` instead of rejecting the op as `invalid_op` fails. A module-level map, array or file acting as the authoritative workbook store fails. Cite the derivation path and any defect as `file:line`. Pass: cell values are derived only by evaluating the ordered op record from PostgreSQL together with version snapshots."

