]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-59"
title = "Offline quantity conflicts are refused"
text = "An offline quantity change replayed over a quantity that another device changed meanwhile is refused as changed elsewhere instead of overwriting it."
