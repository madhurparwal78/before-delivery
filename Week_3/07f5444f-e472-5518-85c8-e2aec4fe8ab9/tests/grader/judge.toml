[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: starting from run.json and the server entrypoint, find where the server builds its Postgres connection, S3 client and SMTP transport, then search all server source for connection strings, hostnames, access keys, secrets, bucket names and sender addresses. The documented defaults (port 4173, sweep interval 30 seconds) are allowed. A literal storage key, bucket name, database URL, SMTP host or sender address fails, cite each as file:line. Pass: every service URL, credential, bucket name or sender address in server source comes from an environment variable the brief names."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-45",
]
evidence = "file_line"
cites = "L805, L811-L819"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: read the client source, the bundler configuration (define and env-prefix settings) and every API handler that returns configuration or status. Any reference to a service variable in client code or build config fails, cite each as file:line. Pass: no client module, bundler setting or API response exposes a database, storage or mail URL, credential or bucket name."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
