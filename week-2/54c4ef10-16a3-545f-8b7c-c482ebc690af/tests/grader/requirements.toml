]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-13"
title = "Size and pixel limits before decoding"
text = "Uploads above the byte limit, and images whose PNG header or first TIFF image directory declares dimensions beyond the published pixel limits, are refused before any pixels are decoded or any frame detection runs."
kind = "behavior"
primary = "pytest"
workflow = "upload-safety"
tests = [
    "test_app.py::test_api_size_and_dimension_limits",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-14"
title = "All-or-nothing uploads"
text = "A refused, failed or interrupted upload leaves neither a scan record nor any stored object, so a roll never points at a missing negative."
kind = "behavior"
primary = "pytest"
workflow = "scan-upload"
tests = [
    "test_app.py::test_api_refused_uploads_leave_nothing",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-15"
title = "Honest storage outage"
text = "When storage is unreachable, uploads and every action that reads an original are refused with the storage error and banner, while rolls, notes, alignments, frames and pinned readings stay readable, and stay editable wherever no original is needed."
