version = "1.0.0"
description = "Relay Bench, a live coding room for freelance coding mentors: a server-enforced single driver (the baton) with an animated handoff, provider-confirmed checkpoints in MinIO with byte-exact restore and damage checks, safe zip import plans with server-set expiry, rename propagation that keeps in-flight typing, private reviewer links, and learner erasure, on Postgres, MinIO and Mailpit."
