[task]
name = "greenfield/pilotlight-kitchen-ledger"
version = "1.0.0"
description = "Pilotlight, a booking and compliance ledger for shared commercial kitchen incubators: a radial Burner Dial for claiming station time against expiring prepaid hour-pack lots, a paired attributed hour ledger, Kill Bill pack purchases and committed overage invoices, byte-exact compliance documents in MinIO, a server-decided food-truck commissary visit log with revocable inspector links, effective-dated site rates, tenant-scoped reports, and a hardened session and audit layer."
authors = [
    { name = "Adarsh Raghuwanshi", email = "adarsh.raghuwanshi@ethara.ai" },
    { name = "Utsav Jain", email = "utsav.jain@ethara.ai" },
]
keywords = [
    "shared-kitchen",
    "booking",
    "ledger",
    "killbill",
    "minio",
    "mailpit",
    "postgres",
    "typescript",
    "accessibility",
    "time-zones",
    "idempotency",
    "concurrency",
]

