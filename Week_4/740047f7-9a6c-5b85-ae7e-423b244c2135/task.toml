version = "1.0.0"
description = "Haldvik Subsea Pensight: a Rust inspection console for a one-person ROV net-pen inspection business, with a live three.js pen twin and Pen Unwrap chart, server-computed defect geometry and grades, forecast-cleared dives, a tool-calling findings copilot, legacy CSV import, immutable report revisions and revocable read-only report links, backed by Postgres, MinIO, Valkey and WireMock."
