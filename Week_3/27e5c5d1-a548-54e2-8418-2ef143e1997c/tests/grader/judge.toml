type = "binary"
weight = 3
description = "Recipe: 1. Find the client module that holds board state and read how remote events, minute re-reads and own-action replies reach it. 2. Search client components for a second copy of board, notice or draft state kept in parallel. 3. Cite each defect as file:line. Pass: no client component keeps its own copy of board state beside the one board-state module."

[criterion.annotations]
channel = "quality"
