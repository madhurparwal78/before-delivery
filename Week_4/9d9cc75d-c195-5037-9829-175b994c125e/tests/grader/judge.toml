[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: Start from the server entrypoint named by the `serve` script and the module that builds the settings. List every place the database URL, the object storage endpoint, region, bucket, path-style flag and keys, the public port and URL, and each published setting is read. Search all non-lockfile source for literal connection strings, hostnames, access keys, secrets and numeric limits that stand in for those values. Allowed defaults: the documented port when none is given and the defaults in the brief's settings table. Cite each defect as `file:line`. Pass: Every service URL, credential and published setting is read from the environment at start, with no literal fallback for any URL or credential."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-44",
]
evidence = "file_line"
cites = "L748-L756, L761-L774, L71"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: Read the handler for the configuration endpoint, the code that serves the HTML shell, and the browser's configuration loader. Search browser sources for `process.env`, `import.meta.env`, storage or database names, keys and secrets, and read the HTML template for inline scripts that embed JSON. Cite each defect as `file:line`. Pass: No environment value or credential reaches the browser, because client code reads configuration only from the endpoint's published fields and no server template writes values into an inline script."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-44",
]
evidence = "file_line"
cites = "L255, L755-L756, L779"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: Read where the `/api/grading/*` routes are registered and what gates them. Search all source for other test-only switches: test-mode environment checks, hidden headers or query flags, special usernames that bypass access checks, and canned data returned in place of database or object storage reads. Cite each defect as `file:line`. Pass: The grading routes exist only behind the grading switch and no other test-only switch, special account or canned response exists."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-44",
]
evidence = "file_line"
cites = "L326, L761"

[[criterion]]
id = "S4"
name = "S4"
type = "binary"
weight = 3
description = "Recipe: Search every logger or console call and every error handler that serialises errors, configuration or request headers. Trace what is written when the database or object storage connection fails and when a request fails. Cite each defect as `file:line`. Pass: No log line or error response includes the database URL, storage credentials or session secrets."

[criterion.annotations]
channel = "source"
