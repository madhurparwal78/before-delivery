[task]
name = "harrow-gilt/gavelhouse"
version = "1.0.0"
description = "Gavelhouse, the own timed online saleroom of an invented Rotterdam auction house for vintage wristwatches and film cameras: catalogue, maximum bidding on a published increment table, per-lot soft close on server time, spending limits, second-chance and default offers, invoices with buyer's premium and VAT on the premium, cashier settlement and locked seller statements, with Keycloak sign-in and one live socket per page over a Postgres change feed."
authors = [
    { name = "Raja Kumar", email = "raja.kumarint17@ethara.ai" },
    { name = "Utsav Jain", email = "utsav.jain@ethara.ai" },
]
keywords = [
    "auction",
    "timed-sale",
    "soft-close",
    "proxy-bidding",
    "keycloak",
    "oidc",
    "pkce",
    "postgres",
    "listen-notify",
    "websocket",
    "invoicing",
    "vat",
    "go",
]

