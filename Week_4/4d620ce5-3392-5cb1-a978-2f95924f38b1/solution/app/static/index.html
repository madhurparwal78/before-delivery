<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Tailboard</title>
  <link rel="preload" href="/assets/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/ibm-plex-sans-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/app.css">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <script type="module" src="/assets/js/main.js"></script>
</head>
<body>
  <div id="app" class="app" data-screen="loading">
    <p class="boot">Loading Tailboard…</p>
  </div>
  <div class="readout" id="readout">
    <div role="status" aria-live="polite" aria-label="Action status" id="action-status" class="readout__status"></div>
    <div role="alert" aria-live="assertive" aria-label="Action error" id="action-error" class="readout__error"></div>
    <div role="status" aria-live="polite" aria-label="Live updates" id="live-updates" class="readout__live"></div>
  </div>
  <div id="overlays"></div>
</body>
</html>
