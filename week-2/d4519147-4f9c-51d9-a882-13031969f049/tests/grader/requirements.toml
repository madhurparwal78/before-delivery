id = "DP-05"
title = "Diagram list and creation"
text = "A signed-in person sees exactly the diagrams they own or hold an active share on, each with their role, and can create a new diagram that they then own."
kind = "behavior"
primary = "pytest"
workflow = "diagram-access"
tests = [
