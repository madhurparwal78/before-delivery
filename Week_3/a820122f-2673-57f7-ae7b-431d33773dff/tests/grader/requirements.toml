schema_version = 1
id_prefix = "DP"
mandatory_count = 45
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "vessel-setup-and-clock",
    "crew-daily-log",
    "offline-sync",
    "day-closure-and-signing",
    "rota-planning",
    "rule-sets-and-verdicts",
    "hour-fold",
    "record-integrity",
    "month-sealing",
    "inspection-link",
    "voyage-review-layout",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "B13",
    "B14",
    "B15",
    "B16",
    "S1",
    "S2",
    "S3",
    "S4",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 103
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "minio", env = {} },
]

[criterion_weights]
B1 = 5
B2 = 5
B3 = 5
B4 = 5
B5 = 3
B6 = 3
B7 = 5
B8 = 3
B9 = 5
B10 = 5
B11 = 5
B12 = 3
B13 = 3
B14 = 3
B15 = 3
B16 = 3
