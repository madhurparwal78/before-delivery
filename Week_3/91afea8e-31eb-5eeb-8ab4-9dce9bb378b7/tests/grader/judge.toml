weight = 5
description = "Recipe: Open `playwright` at 1280x800 and go to `/search`. Screenshot the results. With `browser_evaluate`, read the computed font-family and font-weight of the level 1 heading and of the price text on the first product card, then run `document.fonts.check(\"900 32px 'Darker Grotesque'\")`. Pass: The level 1 heading and the first card's price both compute to Darker Grotesque at weight 900 with that face loaded."

