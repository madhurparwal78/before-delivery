[[requirements]]
id = "DP-50"
title = "No optimistic success and no silent exit"
text = "An export row never shows Ready or a download link, a failed import never adds a page tab, the save state never shows Saved before the server confirms the save, and leaving the editor waits for the pending save and stays on the page if it fails."
kind = "behavior"
primary = "pytest"
workflow = "storage-outage"
