name = "Q3"
type = "binary"
weight = 3
description = "Recipe: search for every place an error answer is built, including framework handlers for unknown routes, wrong methods, oversized bodies and malformed JSON. A second error shape, a framework-default error body or an inline copy of a catalogue message counts as a defect. Pass: every refusal is built by one envelope builder that reads its message from one catalogue mapping."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
