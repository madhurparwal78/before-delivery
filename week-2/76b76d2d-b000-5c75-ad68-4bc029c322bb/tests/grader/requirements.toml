id = "DP-02"
title = "Iris Pull scroll mapping"
text = "Within each season's 1000-pixel scroll segment, the iris openness, blade rotation, f-stop readout, schedule rail fade and ground tint follow the published formulas of scroll position exactly, in both scroll directions."
kind = "behavior"
primary = "pytest"
workflow = "programme-browse"
tests = [
    "test_app.py::test_iris_scroll_mapping",
]
criteria = []
parameter_cases = []

