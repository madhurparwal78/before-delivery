[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: Start from /app/run.json and the server entry it serves, then find the module that reads the database connection setting and the six object-storage settings. Search all server, client and shared source for literal connection strings, access keys, secret keys, bucket names and storage hosts outside environment reads, ignoring the provided compose files and seed configuration. Default port 4173, APP_PUBLIC_PORT and the defaults the brief lists for the PLOT_ settings are allowed. Pass: Every service credential and URL is read from its environment variable."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-10",
]
evidence = "file_line"
cites = "L1108-L1135"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: Trace everything the server sends to the browser at start, meaning the HTML shell, any inline script, any settings endpoint and the client code that reads them. List each key delivered and search the client source for any environment-derived value. Pass: The only settings that reach the browser are the toast lifetime, the margin and the ceiling."

[criterion.annotations]
channel = "source"
