[task]
name = "brickfield-lane/shelfmark"
version = "1.0.0"
description = "Shelfmark for Brickfield Lane Clayhouse: firing operations for a community clay studio. Phone intake with photo and live per-cubic-inch fee, true-scale keyboard-complete kiln shelf packing with collision, height and cone rules, server-timed firing and cool-down, pickup notices and reminders, guest drop-off with provider-confirmed payment and revocable tracking links, and shelf-damage settlement against byte-exact photo evidence, on Postgres, Kill Bill, MinIO and Mailpit."
authors = [
    { name = "tanmay bhadoria", email = "tanmay.bhadoria@ethara.ai" },
    { name = "Shivam Choudhary", email = "shivam.choudhary@ethara.ai" },
]
