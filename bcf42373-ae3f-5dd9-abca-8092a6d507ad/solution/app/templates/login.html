{% extends "base.html" %}
{% block title %}Studio sign-in - Ivo Kastrel{% endblock %}
{% block body_class %}page-login{% endblock %}
{% block scripts %}<script src="/static/studio.js" defer></script>{% endblock %}
{% block main %}
<section class="login" aria-labelledby="login-title">
  <p class="eyebrow">Owner only</p>
  <h1 class="display" id="login-title">Studio</h1>
  <form class="login-form" data-sign-in novalidate>
    <div class="form-errors" role="alert" aria-label="Sign-in errors"></div>
    <div class="field">
      <label for="login-email">Email</label>
      <input id="login-email" name="email" type="email" autocomplete="username" aria-describedby="login-email-error">
      <p class="field-error" id="login-email-error"></p>
    </div>
    <div class="field">
      <label for="login-password">Password</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" aria-describedby="login-password-error">
      <p class="field-error" id="login-password-error"></p>
    </div>
    <button class="submit" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
