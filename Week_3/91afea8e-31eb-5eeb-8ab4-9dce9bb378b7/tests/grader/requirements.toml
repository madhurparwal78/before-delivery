schema_version = 1
id_prefix = "DP"
mandatory_count = 60
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "signin",
    "search-browse",
    "product-page",
    "compare-offers",
    "cart",
    "checkout",
    "orders-returns",
    "sharing",
    "seller-listings",
    "seller-fulfilment",
    "support",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "S4",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
    "Q8",
]
rubric_total_weight = 90
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "minio", env = {} },
    { name = "killbill", env = {} },
    { name = "meilisearch", env = {} },
    { name = "wiremock", env = {} },
]

[criterion_weights]
B1 = 5
B2 = 3
B3 = 5
B4 = 5
B5 = 3
B6 = 3
B7 = 5
B8 = 3
B9 = 3
B10 = 3
B11 = 3
B12 = 3
S1 = 5
S2 = 5
S3 = 3
S4 = 3
Q1 = 5
Q2 = 5
Q3 = 3
Q4 = 5
Q5 = 3
Q6 = 3
Q7 = 3
Q8 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "meilisearch-down"
port = 4175
url_env = "APP_MEILISEARCH_DOWN_URL"

[outages.env]
MEILISEARCH_URL = "http://127.0.0.1:9"

[[outages]]
id = "killbill-down"
port = 4176
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "wiremock-down"
port = 4177
url_env = "APP_WIREMOCK_DOWN_URL"

[outages.env]
WIREMOCK_URL = "http://127.0.0.1:9"

[[outages]]
id = "short-timer"
port = 4178
url_env = "APP_SHORT_URL"

[outages.env]
OTP_TTL_SECONDS = "10"
CODE_WINDOW_SECONDS = "30"
CODE_RESEND_SECONDS = "5"
ACCESS_TTL_SECONDS = "5"
UPI_EXPIRY_SECONDS = "10"
SHARE_TTL_SECONDS = "10"
RATE_WINDOW_SECONDS = "10"
SEARCH_INDEX = "listings_short"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
id = "DP-01"
title = "Sign-up and sign-in by password and SMS code"
text = "Shoppers and sellers sign up and sign in with a password followed by a 6-digit SMS code sent through the SMS gateway, and the session is full only after the code, as qualified in Business rules and Services."
kind = "behavior"
primary = "pytest"
workflow = "signin"
tests = [
    "test_app.py::test_dp01_signup_and_signin_by_sms_code",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Half-signed-in sessions reach nothing"
text = "After the password step and before the code, every page and API other than the code step answers as signed out, no session cookie exists, and the session id changes when the code passes."
kind = "behavior"
primary = "pytest"
workflow = "signin"
tests = [
    "test_app.py::test_dp02_half_signed_in_reaches_nothing",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Same reply for every account probe"
text = "Sign-up, sign-in, code and forgot-password requests return the same status and body whether or not the email or phone belongs to an account."
kind = "behavior"
primary = "pytest"
workflow = "signin"
tests = [
    "test_app.py::test_dp03_same_reply_for_every_probe",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Code tries, sends and expiry"
text = "A code is accepted only before its server-decided expiry and within 5 tries, at most 3 send requests per identifier are accepted per code window whether or not an account exists, and the resend countdown keeps counting through dialogs, tab switches and rerenders."
kind = "behavior"
primary = "pytest"
workflow = "signin"
tests = [
    "test_app.py::test_dp04_code_tries_sends_and_expiry",
    "test_app.py::test_wf_signin_resend_countdown",
]
criteria = []
parameter_cases = []

