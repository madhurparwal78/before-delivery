weight = 3
description = "Recipe: find every place the server writes a 4xx or 5xx `/api` response, including framework error handlers, body-parser or size-limit failures, plus the not-found fallback. A response body in any other shape, or a framework default error page left on an `/api` path, counts as a fail, cited as `file:line`. Building the shape in more than one place is allowed. Pass: every `/api` error response uses the brief's one error shape."

[criterion.annotations]
