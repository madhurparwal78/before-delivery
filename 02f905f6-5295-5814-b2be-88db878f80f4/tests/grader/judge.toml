[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: trace where the server builds the Postgres pool, the S3 client, the Kill Bill client and the SMTP transport, and where it reads the public URL, port and timer settings. Defaults the brief documents (port 4173, hour length 3600, day length 86400) are allowed. A literal host, URL, username, password, access key, API key or secret for any service in source or committed config fails, cite each as `file:line`. Pass: every service URL and credential is read from its named environment variable."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-06",
]
evidence = "file_line"
cites = "L34, L499, L511, L609, L622"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 3
description = "Recipe: read the browser source and the server error handler and response serialisers. Any client module that imports server config or reads a service variable, or any error path that sends a raw provider error, stack or config value to the client, fails, cite each as `file:line`. Pass: no service URL or credential can reach anything sent to the browser."

[criterion.annotations]
channel = "source"
