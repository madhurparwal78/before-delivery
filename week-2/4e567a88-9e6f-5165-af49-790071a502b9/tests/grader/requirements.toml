schema_version = 1
id_prefix = "DP"
mandatory_count = 60
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "api-submit",
    "concurrency-dispatch",
    "playground-run",
    "metered-pricing",
    "rate-change",
    "webhooks",
    "topups",
    "storage-outage",
    "admin-policy",
    "retention-deletion",
    "budget-caps",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 80
services = [
    { name = "postgres", env = { OUTBOUND_ALLOWED_HOSTS = "main" } },
    { name = "minio", env = {} },
    { name = "killbill", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Lumenfold Dispatch <dispatch@lumenfold.example>" } },
]

[criterion_weights]
B1 = 5
B2 = 5
B3 = 3
B4 = 3
B5 = 3
B6 = 3
B7 = 5
B8 = 3
B9 = 3
B10 = 3
B11 = 3
B12 = 3
S1 = 5
S2 = 5
S3 = 3
Q1 = 3
Q2 = 5
Q3 = 5
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "storage-down"
port = 4174
url_env = "APP_STORAGE_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:1999"
DATABASE_URL = "${DATABASE_URL}_nostore"

[[outages]]
id = "killbill-down"
port = 4175
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:1999"
DATABASE_URL = "${DATABASE_URL}_nobill"

[[outages]]
id = "fast-clock"
port = 4176
url_env = "APP_FAST_URL"

[outages.env]
JOB_RUN_SECONDS = "2"
LEASE_SECONDS = "6"
RETENTION_DAY_SECONDS = "2"
WEBHOOK_RETRY_BASE_SECONDS = "1"
DATABASE_URL = "${DATABASE_URL}_fast"
S3_BUCKET = "${S3_BUCKET}-fast"

[[requirements]]
id = "DP-01"
title = "Job submission over the API"
text = "A member's `POST /api/jobs` with a Bearer key and an Idempotency-Key creates one queued job and one reservation of its estimated cost, answering 201 with the job."
kind = "behavior"
primary = "pytest"
workflow = "api-submit"
tests = [
    "test_app.py::test_submit_job",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Replay returns the original response"
text = "Repeating a submission with the same Idempotency-Key and the same body in the same team returns the stored first response and creates no job, reservation or ledger movement."
kind = "behavior"
primary = "pytest"
workflow = "api-submit"
tests = [
    "test_app.py::test_replay_returns_original",
    "test_app.py::test_replay_outlives_refusals",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Reused key with a different body"
text = "Reusing a team's Idempotency-Key with a different model, input or priority is refused with the `idempotency_key_reused` conflict and changes nothing."
kind = "behavior"
primary = "pytest"
workflow = "api-submit"
tests = [
    "test_app.py::test_key_reused_with_other_body",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Simultaneous retries make one job"
text = "Parallel submissions that share one Idempotency-Key and body produce exactly one job and one reservation, and every response names that job."
kind = "behavior"
primary = "pytest"
workflow = "api-submit"
tests = [
    "test_app.py::test_parallel_retries_make_one_job",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-05"
title = "Inputs checked against the model schema"
text = "Each submission's input is validated against the model's published input schema, and a failure answers 422 with one message per offending field."
kind = "behavior"
primary = "pytest"
workflow = "api-submit"
tests = [
