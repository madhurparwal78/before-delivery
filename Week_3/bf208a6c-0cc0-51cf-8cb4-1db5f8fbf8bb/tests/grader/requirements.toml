[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[services]]
name = "postgres"

[services.env]
GRADING_KEY = "pinsheet-grading-key"
VERIFY_CODE_TTL_SECONDS = "30"
INVITE_TTL_SECONDS = "30"

[[services]]
name = "minio"

[services.env]
UPLOAD_MAX_BYTES = "200000"

[[services]]
name = "mailpit"

[services.env]
MAIL_FROM = "Pinsheet <boards@pinsheet.test>"

[[services]]
name = "ntfy"

[services.env]

[[outages]]
id = "storage-down"
port = 4174
url_env = "STORAGE_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "mail-down"
port = 4175
url_env = "MAIL_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[outages]]
id = "push-down"
port = 4176
url_env = "PUSH_DOWN_URL"

[outages.env]
NTFY_URL = "http://127.0.0.1:9"

[[requirements]]
id = "DP-01"
title = "Keyboard pick-up, drop and cancel"
text = "A person who may move a post picks it up with Space, moves it with the arrow keys, drops it with Space or cancels with Escape, with focus kept on the frame and each step announced with the move lines from Feedback states."
kind = "behavior"
primary = "workflow"
workflow = "keyboard_moves"
tests = [
    "test_app.py::test_wf_keyboard_moves_drop",
    "test_app.py::test_wf_keyboard_moves_cancel",
    "test_app.py::test_wf_keyboard_moves_not_movable",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Arrow targets follow the layout"
text = "In columns layout ArrowUp and ArrowDown change the position within a section and ArrowLeft and ArrowRight change section, rows layout swaps the two pairs, and edges and clamping behave as stated in Interactions."
kind = "behavior"
primary = "pytest"
workflow = "keyboard_moves"
tests = [
    "test_app.py::test_arrow_targets_follow_layout",
]
criteria = []
parameter_cases = [
    "columns",
    "rows",
]

