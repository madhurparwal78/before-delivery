[[requirements]]
id = "DP-17"
title = "Vested-only exercise"
text = "An exercise is refused when it asks for more than the grant's exercisable options (vested minus those already exercised, cancelled or in open orders)."
kind = "behavior"
primary = "pytest"
workflow = "exercise"
tests = [
    "test_app.py::test_vested_only_exercise",
]
