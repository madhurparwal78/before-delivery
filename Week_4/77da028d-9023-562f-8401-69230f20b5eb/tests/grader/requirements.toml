]
parameter_cases = []

[[if_rules]]
id = "IF-02"
text = "THIRD_PARTY_NOTICES.md at /app lists every shipped package with its licence; shipped packages means the production dependency tree (the packages install puts into /app/.venv, as .venv/bin/python -m pip list --format json reports them) plus every vendored browser file (three.js, Sora)."
tests = [
    "test_app.py::test_if_notices_list_shipped",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Shipped packages use only MIT, BSD-2-Clause, BSD-3-Clause, Apache-2.0, ISC, PSF-2.0 or, for fonts, OFL-1.1 licences."
tests = [
    "test_app.py::test_if_licences_allowed",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "No datastore other than the provided PostgreSQL, MinIO and ntfy: no SQLite files, no Redis, no file-based records outside MinIO."
tests = [
    "test_app.py::test_if_no_extra_datastore",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "All browser assets, including three.js and the Sora fonts, are served from the app's own origin; no CDN or third-party URL appears in any served page."
tests = [
    "test_app.py::test_if_same_origin_assets",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "Python dependencies live in /app/.venv and the manifest calls tools through .venv/bin/ or python -m."
tests = [
    "test_app.py::test_if_venv_manifest_tools",
]
parameter_cases = []

