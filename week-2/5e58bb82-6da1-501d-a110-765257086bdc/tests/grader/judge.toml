name = "Q1"
type = "binary"
weight = 3
description = "Recipe: read every `tsconfig*.json` to confirm `strict` is enabled. Search the domain and server source for `any`, `as any`, `as unknown as`, `@ts-ignore`, `@ts-expect-error` and non-null `!` on domain values. A disabled `strict` flag fails. Cite each instance as `file:line`. Pass: the domain code contains no untyped escape hatch."

