[[requirements]]
id = "DP-29"
title = "Zip safety"
text = "A starter-project zip with a path escaping the project, an absolute path, an over-long path, a symlink, a disallowed or unreadable file, an unsafe SVG, a duplicate path, or any size, count or ratio over the published limits is rejected whole with every offending entry listed, and nothing reaches the project."
kind = "behavior"
primary = "pytest"
workflow = "import"
tests = [
    "test_app.py::test_zip_rejected",
]
criteria = []
