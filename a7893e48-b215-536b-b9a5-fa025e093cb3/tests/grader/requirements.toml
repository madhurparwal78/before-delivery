[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"
MAILPIT_URL = "http://127.0.0.1:9"

[[requirements]]
id = "DP-01"
title = "Station day dial"
text = "Show each site's local day as a dial of station rings whose booked, held and your-own segments come from the day endpoint for that site and date."
