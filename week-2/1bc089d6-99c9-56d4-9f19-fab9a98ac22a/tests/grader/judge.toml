[[criterion]]
id = "Q3"
name = "Q3"
type = "binary"
weight = 5
description = "Recipe: find where the server decides each of these: field validation for new and edited hours, hour state transitions, reminder due-time and night calculation including clock changes, link expiry with used-before-expired, the live count, idempotent replay, and the save and sign-in request limits. A defect is the same rule computed independently in a second server place, for example a second route or the scheduler re-implementing the due-time arithmetic, the expiry comparison, the count's filter or the limit's window. Browser code is out of scope for this check. Not defects: database mechanisms that enforce the brief's concurrency guarantees alongside the rule code, such as a unique constraint on key, hour-and-night or token, `ON CONFLICT` handling, a row lock, or a conditional `UPDATE ... WHERE version = $n` that the one deciding module issues. Cite each duplicate as `file:line`. Pass: each listed decision is made in exactly one server place."

