[judge]
judge = "codex"
model = "openai/gpt-5.6-sol"
version = "0.163.0"
cwd = "/judge-workspace"
timeout = 3600
mode = "batched"
samples = 3
guard = "penalize"
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "normal",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_press_key",
    "browser_resize",
    "browser_select_option",
    "browser_hover",
    "browser_drag",
    "browser_tabs",
    "browser_wait_for",
    "browser_mouse_wheel",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "reduced"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "reduced",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_press_key",
    "browser_resize",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "touch"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "touch",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_press_key",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "source"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "source-mcp",
]
allowed_tools = [
    "list_files",
    "read_file",
    "search_files",
]

[scoring]
aggregation = "weighted-mean"

[[criterion]]
id = "B1"
name = "B1"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800, open `http://127.0.0.1:4173/` signed out, scroll from the top to the footer taking a screenshot of each band, and read each band's computed background colour with `browser_evaluate`. Pass: the landing page is a stack of full-width bands in the brief's landing order that alternate between white and very light grey above the footer."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-07",
]
evidence = "screenshot"
cites = "L81-L96, L244"

[[criterion]]
id = "B2"
name = "B2"
type = "binary"
weight = 3
description = "Recipe: `playwright` at 1280x800, open `http://127.0.0.1:4173/` signed out, screenshot the workspace header with menus at the top of the page, open `button \"Resources\"` and screenshot again, and read the header's computed background and bottom border. Pass: the signed-out workspace header with menus is a white bar with a thin light grey rule under it, plain unboxed text menu items and a small caret on Resources."

[criterion.annotations]
channel = "experience"
