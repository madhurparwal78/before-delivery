    "test_app.py::test_dp28_import_type_and_unsafe_content",
]
criteria = []
parameter_cases = [
    "DOCTYPE external entity",
    "billion laughs",
    "svg:script prefix",
    "SCRIPT upper case",
    "onload attribute",
    "&#x6A;avascript: href",
    "java&#9;script: href",
    "use href to another document",
    "foreignObject",
    "set attributeName=href",
    "animate values data:",
    "style url(javascript:)",
    "style @import",
    "png bytes named .svg",
    "benign href=#local accepted",
]

