[[requirements]]
id = "DP-01"
title = "Exact starting seed"
text = "A fresh install shows exactly the farms, sites, pens, defects, repair, dive, report revision and devices listed in Seed data, with the derived values printed there, and nothing else."
kind = "behavior"
primary = "pytest"
workflow = "first-open"
tests = [
    "test_app.py::test_seed_exact_records",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Pen condition cards"
text = "The Pens page shows one full-width card for the open pen, then one square card per pen, each with a procedural still of its own twin, its name and its server grade line, and the hover and keyboard-focus reveal described in Motion and effects. Cards change in place when the other device changes a pen, the card or button with keyboard focus keeps it, and an erased farm's row and cards leave the page in place."
kind = "behavior"
primary = "pytest"
workflow = "first-open"
tests = [
    "test_app.py::test_pen_condition_cards",
    "test_app.py::test_cards_follow_other_device",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Live pen twin"
text = "The workspace stage renders a live 3D twin of the selected pen (net wall, collar, moorings, light shafts, particles, at most 60 fish and the ROV) with one pin button per defect, and falls back to the flat chart without WebGL, as described in Motion and effects."
kind = "behavior"
primary = "pytest"
workflow = "first-open"
tests = [
    "test_app.py::test_live_twin_renders",
    "test_app.py::test_first_open_focus_survives_tablet_work_edit",
    "test_app.py::test_first_open_focus_survives_tablet_work_lock",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Pen Unwrap and Wrap"
text = "Unwrap lays the net wall flat into the metre-true chart over elapsed time, ending with every pin at its server chart position and the Scene status reading the flat-chart view, and Wrap reverses the same path back to the cylinder. Pressing the opposite control mid-run plays the progress made so far back at the pace it was made, so a run reversed 0.5 seconds after it started is back in its starting view 0.3 to 0.8 seconds later."
kind = "behavior"
primary = "pytest"
workflow = "first-open"
tests = [
    "test_app.py::test_unwrap_wrap_motion",
    "test_app.py::test_wf_first_open_reversal",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-05"
title = "Keyboard pen twin"
text = "The published shortcuts orbit, zoom, unwrap, wrap, step through defects with a camera fly-to and open the editor from any focused control in the workspace, and are ignored while typing, while a dialog is open and, for the arrow, Home and End keys, while focus is on a tab. Tab follows the published workspace order at the laptop and tablet sizes, and Escape, Close editor or a successful delete closes the editor and returns focus to the pin or row that opened it, or to the placeholder row after a delete."
kind = "behavior"
primary = "pytest"
workflow = "pen-twin-input"
tests = [
    "test_app.py::test_wf_pen_twin_input_keyboard",
    "test_app.py::test_editor_focus_returns",
    "test_app.py::test_workspace_tab_order",
    "test_app.py::test_editor_focus_returns_after_save_pin",
    "test_app.py::test_editor_focus_returns_after_save_row",
    "test_app.py::test_tab_order_after_live_insert_skarvholmen_02",
    "test_app.py::test_tab_order_after_live_insert_kalamos_04",
]
criteria = []
parameter_cases = []

