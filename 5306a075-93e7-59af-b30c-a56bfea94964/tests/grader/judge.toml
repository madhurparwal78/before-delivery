weight = 3
description = "Recipe: read every tsconfig, then search the server and client source for explicit `any`, `as any`, `@ts-ignore`, `@ts-expect-error`, `@ts-nocheck` and lint disables that silence type rules. A tsconfig covering application source without strict mode counts as a fail, as does each suppression; cite each instance as file:line. Pass: the application source has zero type-safety escapes."

