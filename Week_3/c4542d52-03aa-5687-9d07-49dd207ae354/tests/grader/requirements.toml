    "before_cliff",
    "zero",
    "not_integer",
    "after_held_order",
    "offered_grant",
]

[[requirements]]
id = "DP-18"
title = "Idempotent exercise orders"
text = "Every exercise carries an idempotency key. Five simultaneous requests with one key create exactly one order and one provider payment, the other four receive the stored response, and a reused key with a different body is refused."
kind = "behavior"
primary = "pytest"
workflow = "exercise"
tests = [
    "test_app.py::test_idempotent_exercise_orders",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-19"
title = "Provider-confirmed issuance"
text = "Shares are issued only after the server has fetched the provider's payment record and it reads confirmed with the order's amount and reference."
kind = "behavior"
primary = "pytest"
workflow = "exercise"
tests = [
    "test_app.py::test_provider_confirmed_issuance",
]
criteria = []
parameter_cases = [
    "amount_mismatch",
    "reference_mismatch",
    "status_failed",
    "confirmed_matching",
]

[[requirements]]
id = "DP-20"
title = "Slow and unreachable provider"
text = "A provider that accepts the payment but has not confirmed after five seconds leaves the order Pending until it confirms. A provider that is unreachable, or does not answer the payment request within five seconds, leaves the order Held for retry under the same key, and shares are never issued twice."
kind = "behavior"
primary = "pytest"
workflow = "exercise"
tests = [
    "test_app.py::test_wf_exercise_provider_recovery",
]
criteria = []
parameter_cases = [
    "connection_reset",
    "server_error",
    "no_answer",
    "pending_then_confirmed",
]

[[requirements]]
id = "DP-21"
title = "Cancel wins over in-flight confirmation"
text = "Cancelling a Pending or Held order always wins. A confirmation that arrives afterwards issues nothing, and the server cancels that payment at the provider."
kind = "behavior"
primary = "pytest"
workflow = "exercise"
tests = [
    "test_app.py::test_cancel_wins",
]
criteria = []
parameter_cases = [
    "pending",
    "held",
    "issued",
]

