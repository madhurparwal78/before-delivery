description = "Recipe: `source` MCP. 1) Search the server source for module-level maps, arrays or objects holding holds, loans, sessions, idempotency keys, cursors or queued emails. 2) Search for embedded or in-memory database imports and for file writes that persist records. 3) Trace where the session-signing and cursor secret is created and read, treating a secret generated only in process memory as a defect. 4) Cite each defect as `file:line`. Pass: every record and the shared signing secret live in PostgreSQL or the other named services."

