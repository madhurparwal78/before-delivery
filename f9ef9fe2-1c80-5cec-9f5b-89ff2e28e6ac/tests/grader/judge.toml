[judge]
judge = "codex"
model = "openai/gpt-5.6-sol"
version = "0.163.0"
cwd = "/judge-workspace"
timeout = 1200
mode = "batched"
samples = 3
guard = "penalize"
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "normal",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_press_key",
    "browser_resize",
    "browser_select_option",
    "browser_hover",
    "browser_drag",
    "browser_tabs",
    "browser_wait_for",
    "browser_mouse_wheel",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "reduced"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "reduced",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_press_key",
    "browser_resize",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "touch"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "touch",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_press_key",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "source"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "source-mcp",
]
allowed_tools = [
    "list_files",
    "read_file",
    "search_files",
]

[scoring]
aggregation = "weighted-mean"

[[criterion]]
id = "B1"
name = "B1"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800. 1) Sign in as the invented seed member Priya (ember@pilotlight.test). 2) Open `/loom`. 3) Screenshot. 4) The brief does not say which element paints the ground: it may be `html`, `body` or a root wrapper. Walk from the loom frame up through its ancestors to `html` and take the first opaque computed background colour as the painted ground. Pass: the page ground is a near-black with a faint warm cast (its red channel above its blue channel), not a neutral grey, a cool blue-black or pure #000000."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-07",
]
evidence = "screenshot"
cites = "L34, L93, L206"

[[criterion]]
id = "B2"
name = "B2"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800. 1) Signed in as Priya, open `/loom` on a date eight days ahead with all stations shown. 2) Open `/loom?date=<that date>&sel=st-deck-1..st-chiller@04:00-05:15` to restore an unheld brush over Deck oven 1, Deck oven 2, Convection oven, 60-quart mixer and Blast chiller from 04:00 to 05:15. Do not press Enter, so nothing is held. 3) Wait for the total to settle, then screenshot. 4) Probe the computed colours of the quote total, the navigation links, the date controls and the loom header labels. Owed or outstanding amounts may be amber under the brief and are not judged here. Pass: the quote total is amber-hued while no navigation link, date control or loom header label is amber-hued."

[criterion.annotations]
