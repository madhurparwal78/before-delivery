[[criterion]]
id = "Q2"
name = "Q2"
type = "binary"
weight = 3
description = "Recipe: source MCP. 1) Search for the logic of each of these rules: studio hours, closure days, quarter hours, overlap, reopen window, Stockholm conversion, character counting, hourly limit, sign-in limit, invitation sequence and queue counts. 2) A rule computed in two places is a defect; cite both as `file:line`. Showing the current Stockholm time (the contact greetings, the footer year) is display, not the call-time Stockholm conversion. The composer's live counter and its send-control gating, which the brief requires in the browser, mirror the server and are not a defect. Pass: each rule is decided in exactly one function or module that its callers share."

[criterion.annotations]
channel = "quality"
