[[requirements]]
id = "DP-01"
title = "Plate lookup."
text = "Entering a plate normalises it to the country's published format, rejects an invalid one with no registry request, and otherwise reads the registry and shows the donor or the published not-found or not-catalogued result, with only the latest lookup able to change anything on screen."
kind = "behavior"
primary = "pytest"
workflow = "donor-lookup"
tests = [
    "test_app.py::test_plate_lookup_api",
    "test_app.py::test_donor_lookup_invalid_plate_no_call",
    "test_app.py::test_donor_lookup_latest_lookup_wins",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Hand-entered frame details."
text = "A rider can enter frame details by hand and try the fit, and the result is always marked unconfirmed."
kind = "behavior"
primary = "pytest"
workflow = "donor-lookup"
tests = [
    "test_app.py::test_wf_donor_lookup_hand_entry",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Feeler Sweep rail drive."
text = "Selecting the pack or hub flies it out along its assembly axis, fades the blocking panels, and lets drag or arrow keys drive it along its rail while the Clearance readout publishes travel and station gaps and the rail handle stays on the part's projected leading edge."
kind = "behavior"
primary = "pytest"
workflow = "feeler-sweep"
tests = [
    "test_app.py::test_feeler_sweep_keyboard_at_375",
    "test_app.py::test_feeler_flight_fade_and_handle",
]
criteria = []
parameter_cases = []

