description = "Recipe: With the `source` MCP, read the modules for wallet, match, table and tournament logic. List each identifier that renames a domain concept with a generic or different term, such as a hold for escrow or a transaction for a ledger line, as `file:line`. Pass: Modules, types and functions use the brief's domain terms for these concepts."

[criterion.annotations]
channel = "quality"
