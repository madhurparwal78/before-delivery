[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: 1. Open /app/run.json and follow the serve script to the server entry and the module that reads configuration. 2. Search the server source for string literals shaped like service URLs, host:port pairs, access keys, secrets or bucket names, and open every place the datastore, file-storage and relay settings are consumed. 3. Cite each literal found as file:line. Pass: every service URL, credential and bucket name is read from the environment at start, with literals limited to the documented defaults (app port 4173, listen address 0.0.0.0) and the seeded sign-in accounts."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-03",
]
evidence = "file_line"
cites = "L860, L867-L868"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 3
description = "Recipe: 1. Open the browser-side source folder and the bundler or build configuration. 2. Search them for any read of process environment values, define or env-prefix injection, and any reference to a service setting or service host. 3. Open the module that builds API responses and error bodies and look for environment values or service addresses placed into them. Cite each hit as file:line. Pass: no browser-side file, build configuration or response builder carries a service setting or service address."

[criterion.annotations]
channel = "source"
