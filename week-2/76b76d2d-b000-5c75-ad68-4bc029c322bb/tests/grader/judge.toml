description = "Recipe: Read the code for tax, totals, credit, cost split, refund amounts, reconciliation and CSV amounts. Search it for `parseFloat`, `toFixed` and `Math.round` on amounts, and for float division of amounts. Any float computation that decides an amount fails. Cite each as `file:line`. Pass: every amount that is stored, compared, summed or sent to Kill Bill is computed as integer cents."

