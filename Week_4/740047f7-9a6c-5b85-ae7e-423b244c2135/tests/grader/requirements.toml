title = "Tabs and collapsed panels"
text = "The phone 'Pen panels' and 'Report panels' tab lists follow the published arrow-key, Home and End behaviour without orbiting the camera, and every unselected tab panel, collapsed footer column and closed menu is hidden, unfocusable and absent from the accessibility tree."
