[[requirements]]
id = "DP-11"
title = "Booking state machine"
text = "Booking status changes only along the legal transitions in Business rules, exactly one of several simultaneous transitions on one booking commits, and every other transition is refused with the 409 the state machine gives without changing the booking or the ledger."
