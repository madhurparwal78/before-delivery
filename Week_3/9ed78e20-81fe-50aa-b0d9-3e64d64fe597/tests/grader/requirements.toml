text = "Escape or a second activation undoes the tether steps in reverse order, loading an address that carries a claim restores the tethered state directly, reduced-motion visitors get each end state without animation, and below 720 pixels wide the leader line becomes a labelled bracket."
kind = "behavior"
primary = "pytest"
workflow = "claim-tether"
