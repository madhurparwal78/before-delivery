[[requirements]]
id = "DP-19"
title = "Model name matching"
text = "Each import row's model name matches exactly one catalogue model under the published normalisation, code-suffix and retired-name rules, or is reported as unknown or ambiguous."
kind = "behavior"
primary = "pytest"
workflow = "catalogue-and-editions"
tests = [
    "test_app.py::test_model_name_matching",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-20"
title = "Import report and re-import"
text = "Every invalid row is reported with its line number and published reason, and importing the same file again creates and changes nothing."
kind = "behavior"
primary = "pytest"
workflow = "catalogue-and-editions"
tests = [
    "test_app.py::test_import_report_and_reimport",
