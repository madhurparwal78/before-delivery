[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "short-hold"
port = 4175
url_env = "APP_SHORT_HOLD_URL"

[outages.env]
CLAIM_HOLD_SECONDS = "5"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[outages]]
id = "minute-hold"
port = 4176
url_env = "APP_MINUTE_HOLD_URL"

[outages.env]
CLAIM_HOLD_SECONDS = "65"
DATABASE_URL = "${DATABASE_URL}_minute"
S3_BUCKET = "${S3_BUCKET}-minute"

[[outages]]
id = "twin-a"
port = 4177
url_env = "APP_TWIN_A_URL"

[outages.env]
DATABASE_URL = "${DATABASE_URL}_twin"
S3_BUCKET = "${S3_BUCKET}-twin"

[[outages]]
id = "twin-b"
port = 4178
url_env = "APP_TWIN_B_URL"

[outages.env]
DATABASE_URL = "${DATABASE_URL}_twin"
S3_BUCKET = "${S3_BUCKET}-twin"

[[requirements]]
id = "DP-01"
title = "Run manifest and health"
text = "The app installs, builds and serves from `/app/run.json` on the published port and answers the health address as qualified in Technical requirements."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_wf_cross_cutting_health",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Recovery without restart"
text = "With Postgres or Keycloak unreachable the app answers the published unavailable bodies, and it recovers within the Server boundary limit after the dependency returns, with no restart and with every missing seeded account re-created."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_wf_cross_cutting_recovery",
]
criteria = []
parameter_cases = [
    "database",
    "identity",
]

[[requirements]]
id = "DP-03"
title = "Sign-in and session cookie"
text = "Signing in with email and password sets the published session cookie and returns a bearer token, and a write carrying only the cookie is refused as unauthenticated."
kind = "behavior"
primary = "pytest"
workflow = "security"
tests = [
    "test_app.py::test_session_cookie",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Bearer token verification"
text = "Unsigned, tampered, wrongly signed, expired and deleted-account tokens all receive the identical unauthenticated refusal."
kind = "behavior"
primary = "pytest"
workflow = "security"
tests = [
    "test_app.py::test_bearer_tokens_refused",
]
criteria = []
parameter_cases = [
    "unsigned",
    "tampered",
    "wrong-key",
    "expired",
    "deleted",
]

[[requirements]]
id = "DP-05"
title = "Role, ownership and authority from stored records"
text = "Every call takes the caller's role, ownership and cutting authority from the stored records, never from token claims, so an owner only ever reaches their own boats and granted drawings, and a deletion or authority withdrawal by the sailmaker takes effect on the caller's very next request."
kind = "behavior"
primary = "pytest"
workflow = "security"
tests = [
    "test_app.py::test_roles_from_stored_records",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-06"
title = "Uniform not-found"
text = "A record that belongs to someone else and a record that never existed answer the byte-identical not-found body with the identical set of response headers at every address, nested addresses included."
kind = "behavior"
primary = "pytest"
workflow = "security"
tests = [
    "test_app.py::test_wf_security_not_found",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-07"
title = "One refusal ladder"
text = "Every endpoint ranks its refusals in the single published order, so a request that breaks two rules receives only the higher-ranked status."
kind = "behavior"
primary = "pytest"
workflow = "security"
tests = [
    "test_app.py::test_refusal_ladder",
