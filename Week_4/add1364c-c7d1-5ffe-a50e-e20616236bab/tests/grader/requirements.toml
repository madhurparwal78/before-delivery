[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_kbdown"
OFFICE_KEY = "blkd"

[[outages]]
id = "feed-down"
port = 4175
url_env = "APP_FEED_DOWN_URL"

[outages.env]
WIREMOCK_URL = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_feeddown"
OFFICE_KEY = "blfd"

[[outages]]
id = "evening"
port = 4176
url_env = "APP_EVENING_URL"

[outages.env]
LOCKSET_CLOCK_START = "2026-11-05T23:40:00-06:00"
DATABASE_URL = "${DATABASE_URL}_evening"
OFFICE_KEY = "blev"

[[outages]]
id = "midnight"
port = 4177
url_env = "APP_MIDNIGHT_URL"

[outages.env]
LOCKSET_CLOCK_START = "2026-12-31T23:53:00-06:00"
DATABASE_URL = "${DATABASE_URL}_midnight"
OFFICE_KEY = "blmn"

[[outages]]
id = "closing"
port = 4178
url_env = "APP_CLOSING_URL"

[outages.env]
LOCKSET_CLOCK_START = "2026-11-05T18:58:00-06:00"
DATABASE_URL = "${DATABASE_URL}_closing"
OFFICE_KEY = "blcl"

[[outages]]
id = "short-timers"
port = 4179
url_env = "APP_SHORT_URL"

[outages.env]
REVEAL_SESSION_SECONDS = "40"
SIGN_IN_LOCK_SECONDS = "30"
BREACH_CHECK_SECONDS = "5"
DATABASE_URL = "${DATABASE_URL}_short"
OFFICE_KEY = "blst"

