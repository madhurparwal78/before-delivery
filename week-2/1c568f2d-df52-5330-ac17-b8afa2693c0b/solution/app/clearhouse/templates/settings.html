{% extends "_staff.html" %}
{% block title %}Settings{% endblock %}
{% block main %}
<div class="settings">
  <section class="sheet" aria-labelledby="settings-title">
    <h1 id="settings-title">Preferences</h1>
    <div class="alert" role="alert" data-panel-alert hidden></div>
    <div class="pref">
      <label for="rows-per-page">Rows per page</label>
      <select id="rows-per-page" class="mono" data-pref="rows_per_page">
        {% for n in (25, 50, 100) %}<option value="{{ n }}"{% if prefs.rows_per_page == n %} selected{% endif %}>{{ n }}</option>{% endfor %}
      </select>
    </div>
    <div class="pref" role="radiogroup" aria-labelledby="date-display-label">
      <p id="date-display-label" class="pref__label">Date display</p>
      <label class="choice__option"><input type="radio" name="date_display" value="relative" data-pref="date_display"{% if prefs.date_display == "relative" %} checked{% endif %}> Relative</label>
      <label class="choice__option"><input type="radio" name="date_display" value="absolute" data-pref="date_display"{% if prefs.date_display == "absolute" %} checked{% endif %}> Absolute</label>
    </div>
    <div class="pref">
      <span class="pref__label" id="contrast-label">High contrast</span>
      <button type="button" class="switch" role="switch" aria-checked="{{ 'true' if prefs.high_contrast else 'false' }}" aria-labelledby="contrast-label" data-pref="high_contrast"><span class="switch__knob"></span></button>
    </div>
  </section>
  {% if account.role == "lead" %}
  <section class="sheet" aria-labelledby="pack-title">
    <h2 id="pack-title">Clearance pack</h2>
    <p class="muted">Every piece as one document, or a pack applied completely in one go.</p>
    <div class="pack-actions">
      <button type="button" class="btn" data-export-pack>Export pack</button>
      <label class="file"><span>Import pack</span><input type="file" accept="application/json,.json" data-import-pack></label>
    </div>
  </section>
  {% endif %}
</div>
{% endblock %}
