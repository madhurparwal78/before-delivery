[judge]
judge = "codex"
model = "openai/gpt-5.6-sol"
version = "0.163.0"
cwd = "/judge-workspace"
timeout = 3600
mode = "batched"
samples = 3
guard = "penalize"
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "normal",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_press_key",
    "browser_resize",
    "browser_select_option",
    "browser_hover",
    "browser_drag",
    "browser_tabs",
    "browser_wait_for",
    "browser_mouse_wheel",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "reduced"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "reduced",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_press_key",
    "browser_resize",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "touch"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "touch",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_press_key",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "source"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "source-mcp",
]
allowed_tools = [
    "list_files",
    "read_file",
    "search_files",
]

[scoring]
aggregation = "weighted-mean"

[[criterion]]
id = "B1"
name = "B1"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800, open `/` (the hero). Probe with `browser_evaluate` the computed background-color and background-image of `body` and of the element that wraps the heading. Take a full-page screenshot of the hero. Pass: the field behind the headline is one uniform dark aubergine colour (lightness under 30%, red-purple hue) with no gradient, photo or pattern anywhere in the viewport."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-57",
]
evidence = "screenshot"
cites = "L85, L177-L179, L183"

[[criterion]]
id = "B2"
name = "B2"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800, open `/`. Read the accessibility snapshot for the level 1 heading and `img \"Zuiderhal demo wall\"`. Probe the heading's computed colour, font-family and text-transform, run `document.fonts.check` with the heading's own computed weight, size and family, and read the canvas height. Screenshot the headline. Pass: the headline reads MEASURE THE, then a letter-height live canvas of a lit building front in place of the word WALL, then BEFORE THE LIGHT on a second line, all in light blush (lightness above 80%) Imbue capitals."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-57",
]
evidence = "screenshot"
cites = "L85, L125-L126, L183"

[[criterion]]
id = "B3"
name = "B3"
type = "binary"
weight = 3
description = "Recipe: `playwright` at 1280x800, open `/`. Probe the computed transform of the three chip elements that carry `slider \"Output\"`, `slider \"Throw\"` and `switch \"Capitals\"` (or of their wrappers), and read their bounding boxes against the heading's bounding box. Screenshot the hero. Pass: the three chips each have a non-zero rotation off horizontal and each one overlaps the headline's letter area."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "important"
requirements = [
    "DP-57",
]
evidence = "screenshot"
cites = "L85, L171, L183"

