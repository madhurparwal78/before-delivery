[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_storage"
S3_BUCKET = "${S3_BUCKET}-storage"
CLOSURE_WAIT_SECONDS = "5"

[[outages]]
id = "gotenberg-down"
port = 4175
url_env = "APP_GOTENBERG_DOWN_URL"

[outages.env]
GOTENBERG_URL = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_render"
S3_BUCKET = "${S3_BUCKET}-render"

[[outages]]
id = "ntfy-down"
port = 4176
url_env = "APP_NTFY_DOWN_URL"

[outages.env]
NTFY_URL = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_push"
S3_BUCKET = "${S3_BUCKET}-push"

[[outages]]
id = "short-timers"
port = 4177
url_env = "APP_SHORT_URL"

[outages.env]
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"
ENQUIRY_RATE_WINDOW_SECONDS = "30"
BID_WINDOW_SECONDS = "20"
QUOTE_VALID_SECONDS = "20"
FILE_RATE_WINDOW_SECONDS = "30"
CLOSURE_WAIT_SECONDS = "20"
HOLIDAY_CACHE_SECONDS = "5"
DAILY_RUN_AT = "any"

[[outages]]
id = "short-session"
port = 4178
url_env = "APP_SESSION_URL"

[outages.env]
DATABASE_URL = "${DATABASE_URL}_session"
S3_BUCKET = "${S3_BUCKET}-session"
SESSION_SECONDS = "20"

[[requirements]]
id = "DP-01"
title = "Desk access journey"
text = "A new desk signs up, signs in and out, changes its password so that the person's other sessions end, and creates, reads, renames and deletes a customer, with the status codes published in API."
kind = "behavior"
primary = "workflow"
workflow = "desk-access"
tests = [
    "test_app.py::test_wf_desk_access_statuses",
    "test_app.py::test_wf_desk_access_password_ends_other_sessions",
    "test_app.py::test_wf_desk_access_deleted_customer_gone",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Desks kept apart"
text = "One desk naming another desk's customer, hire, file, invoice or run by its identifier, in an address or inside a request body, gets the not-found answer and nothing from it, however many requests from two desks interleave."
kind = "behavior"
primary = "pytest"
workflow = "desk-access"
tests = [
    "test_app.py::test_desks_kept_apart",
]
criteria = []
parameter_cases = []

