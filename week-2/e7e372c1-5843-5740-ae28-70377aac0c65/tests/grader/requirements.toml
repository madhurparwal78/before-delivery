[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "vault-down"
port = 4174
url_env = "APP_VAULT_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "short-timers"
port = 4175
url_env = "APP_SHORT_URL"

[outages.env]
ETH_STALE_SECONDS = "10"
STAFF_SESSION_IDLE_SECONDS = "20"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

