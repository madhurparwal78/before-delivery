weight = 3
description = "Recipe: Read the TypeScript configuration, then search domain code for `any`, `as any`, `@ts-ignore` and `@ts-expect-error`. Any instance in domain code, or strict mode switched off, fails. Cite each defect as `file:line`. Pass: Strict settings are on with no `any` or type suppression in domain code."

