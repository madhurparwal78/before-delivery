[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "valkey-down"
port = 4175
url_env = "APP_VALKEY_DOWN_URL"

[outages.env]
VALKEY_URL = "redis://127.0.0.1:9"

[[outages]]
id = "short-timer"
port = 4176
url_env = "APP_SHORT_URL"

[outages.env]
HOLD_SECONDS = "5"
OFFER_SECONDS = "5"
VALKEY_KEY_PREFIX = "short:"
DATABASE_URL = "${DATABASE_URL}_short"

[[outages]]
id = "clock"
port = 4177
url_env = "APP_CLOCK_URL"

[outages.env]
APP_CLOCK_CONTROL = "1"
VALKEY_KEY_PREFIX = "clock:"
DATABASE_URL = "${DATABASE_URL}_clock"

[[outages]]
id = "flap"
port = 4178
url_env = "APP_FLAP_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:18080"
VALKEY_URL = "redis://127.0.0.1:16379"
VALKEY_KEY_PREFIX = "flap:"
DATABASE_URL = "${DATABASE_URL}_flap"

