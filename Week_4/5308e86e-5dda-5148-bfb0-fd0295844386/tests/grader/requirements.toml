[[requirements]]
id = "DP-17"
title = "Federal Reserve business days"
text = "A scheduled ACH, wire or check payment takes effect on the first Federal Reserve business day on or after its chosen date, with Sunday holidays observed on Monday and Saturday holidays not moved to Friday. A scheduled RTP payment takes effect on its chosen date. Either kind can be cancelled until it posts."
kind = "behavior"
primary = "pytest"
workflow = "send-payment"
tests = [
    "test_app.py::test_scheduled_business_days",
]
criteria = []
parameter_cases = []

