schema_version = 1
id_prefix = "DP"
mandatory_count = 60
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "deck-authoring",
    "question-images",
    "room-opening",
    "run-the-night",
    "answering",
    "player-controller",
    "scoring",
    "reveal",
    "reconnect",
    "valkey-fallback",
    "night-end",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B13",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B14",
    "B12",
    "S1",
    "S2",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 85
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "valkey", env = {} },
    { name = "minio", env = {} },
]

[criterion_weights]
B1 = 5
B13 = 3
B2 = 3
B3 = 5
B4 = 5
B5 = 3
B6 = 3
B7 = 3
B8 = 3
B9 = 5
B10 = 5
B11 = 3
B14 = 3
B12 = 3
S1 = 5
S2 = 5
Q1 = 3
Q2 = 3
Q3 = 5
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "valkey-down"
port = 4174
url_env = "APP_VALKEY_DOWN_URL"

[outages.env]
VALKEY_URL = "redis://127.0.0.1:9/0"
DATABASE_URL = "${DATABASE_URL}_valkeydown"

[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_miniodown"

[[outages]]
id = "short-timers"
port = 4176
url_env = "APP_SHORT_URL"

[outages.env]
ROOM_IDLE_SECONDS = "5"
IMAGE_URL_TTL_SECONDS = "3"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
id = "DP-01"
title = "Quizmaster accounts"
text = "A quizmaster creates an account, signs in and signs out with email and password, and every host screen and host endpoint requires a signed-in session, as detailed in API."
kind = "behavior"
primary = "pytest"
workflow = "deck-authoring"
tests = [
    "test_app.py::test_wf_deck_authoring_accounts",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Decks stay with their quizmaster"
text = "A quizmaster sees, edits and opens rooms only from their own decks, and another quizmaster's deck, question, room or night answers as if it did not exist."
kind = "behavior"
primary = "pytest"
workflow = "deck-authoring"
tests = [
    "test_app.py::test_wf_deck_authoring_foreign_invalid",
    "test_app.py::test_wf_deck_authoring_malformed_id",
    "test_app.py::test_decks_isolated_by_owner",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Question types and their rules"
text = "A deck holds multiple-choice, estimate and sequence questions, each saved only when it meets the field rules in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "deck-authoring"
tests = [
    "test_app.py::test_question_rules",
]
criteria = []
parameter_cases = [
    "mc_two_options",
    "mc_one_option",
    "mc_five_options",
    "mc_correct_index_outside",
    "mc_option_at_limit",
    "mc_option_too_long",
    "prompt_empty",
    "prompt_at_limit",
    "prompt_too_long",
    "time_below_min",
    "time_at_min",
    "time_at_max",
    "time_above_max",
    "time_fractional",
    "est_min_not_below_max",
    "est_step_zero",
    "est_answer_outside",
    "est_tolerance_negative",
    "est_tolerance_full_range",
    "est_tolerance_beyond_range",
    "est_unit_at_limit",
    "est_unit_too_long",
    "seq_two_items",
    "seq_six_items",
    "seq_seven_items",
    "seq_duplicate_ignoring_case",
    "deck_title_blank",
    "deck_title_at_limit",
    "deck_title_too_long",
    "deck_full",
]

