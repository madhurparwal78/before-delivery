[[criterion]]
id = "S4"
name = "S4"
type = "binary"
weight = 3
description = "Recipe: search the source, config files, client sources and `run.json` for database credentials, connection strings and secrets. The documented defaults (port 4173, the lockout, inquiry and quote windows) and the brief's published seed password for the demo users are allowed. A hard-coded credential, or any credential reaching browser code, counts as a fail. Cite the config reader as `file:line`. Pass: the database connection string comes only from the `DATABASE_URL` environment variable read at start."

[criterion.annotations]
