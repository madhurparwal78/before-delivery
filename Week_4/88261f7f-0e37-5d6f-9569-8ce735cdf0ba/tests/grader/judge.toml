weight = 3
description = "Recipe: in the close-folio handler, read the error paths of the Gotenberg render call and of the bucket upload call, and follow what happens to the invoice number allocation on each. A failure path that leaves the number consumed, or a caught error that still returns success, fails. Pass: a failed render or a failed upload rolls the number allocation back so no invoice number is consumed."

[criterion.annotations]
