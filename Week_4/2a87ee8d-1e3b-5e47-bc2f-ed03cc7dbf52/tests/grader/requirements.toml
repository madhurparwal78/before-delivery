schema_version = 1
id_prefix = "DP"
mandatory_count = 71
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "session-lifecycle",
    "join-link",
    "invites",
    "silent-round",
    "reveal",
    "image-notes",
    "concurrent-edit",
    "clustering",
    "dot-voting",
    "trash-restore",
    "facilitator-only",
    "recap",
    "billing",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "B13",
    "S1",
    "S2",
    "S3",
    "S4",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 90
solo_criteria = [
    "B12",
]
services = [
    { name = "postgres", env = {} },
    { name = "minio", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Lanternfold Rooms <rooms@lanternfold.test>" } },
    { name = "killbill", env = {} },
]

[criterion_weights]
B1 = 5
B2 = 5
B3 = 3
B4 = 3
B5 = 3
B6 = 3
B7 = 5
B8 = 3
B9 = 5
B10 = 3
B11 = 3
B12 = 5
B13 = 3
S1 = 5
S2 = 3
S3 = 3
S4 = 3
Q1 = 5
Q2 = 5
Q3 = 5
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[outages]]
id = "killbill-down"
port = 4176
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "replica-b"
port = 4177
url_env = "APP_REPLICA_URL"

[outages.env]
INSTANCE_ID = "b"

[[outages]]
id = "short-purge"
port = 4178
url_env = "APP_SHORT_PURGE_URL"

[outages.env]
TRASH_PURGE_SECONDS = "6"
DELIVERY_RETRY_SECONDS = "300"

[[outages]]
id = "short-grace"
port = 4179
url_env = "APP_SHORT_GRACE_URL"

[outages.env]
PAYMENT_GRACE_SECONDS = "5"

[[requirements]]
id = "DP-01"
title = "Facilitator sign-in"
text = "Each seeded facilitator signs in with email and password and gets a session cookie, and every facilitator endpoint rejects requests without it, as stated in API."
kind = "behavior"
primary = "pytest"
workflow = "session-lifecycle"
tests = [
    "test_app.py::test_signin_sessions",
    "test_app.py::test_wf_session_lifecycle_signin",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Workshop from a template"
text = "A signed-in facilitator creates a workshop with a client fee from one of four templates in the New workshop dialog and lands on its board in Draft, with that template's frames in the rail."
kind = "behavior"
primary = "pytest"
workflow = "session-lifecycle"
tests = [
    "test_app.py::test_workshop_templates_api",
    "test_app.py::test_wf_session_lifecycle_create",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Session state machine"
text = "The workshop moves only along the legal edges in Business rules and only on the facilitator's command. Every other edge is rejected with `illegal_transition`, except that any edge out of `closed` or `archived` is rejected with `workshop_closed`, which comes first in the 409 order."
kind = "behavior"
primary = "pytest"
workflow = "session-lifecycle"
tests = [
    "test_app.py::test_state_machine",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "One advance wins"
text = "When the same transition is sent several times at once with different operation ids, on one instance or several, exactly one succeeds. The rest are rejected with `illegal_transition`, or with `workshop_closed` when the winning move entered `closed` or `archived`."
kind = "behavior"
primary = "pytest"
workflow = "session-lifecycle"
tests = [
    "test_app.py::test_one_advance_wins",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-05"
title = "Server-held timers"
text = "Silent rounds and voting end at a deadline the server sets, and notes or dots that arrive after it are rejected with `deadline_passed`, whatever the browser clock says."
kind = "behavior"
primary = "pytest"
workflow = "silent-round"
tests = [
    "test_app.py::test_deadline_server_side",
]
criteria = []
parameter_cases = []

