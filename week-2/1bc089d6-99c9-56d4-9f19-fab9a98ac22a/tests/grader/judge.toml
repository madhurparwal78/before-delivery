id = "Q2"
name = "Q2"
type = "binary"
weight = 3
description = "Recipe: for each of these ten concepts, find the main type, table and module that hold it: hour, draft, ritual, bedtime, time zone, reminder, night, share link, outbox, live count. Accepted names are the brief's term in any casing or separator style, alone or combined with other words (such as `night_date` or `reminder_night`), plus `plan` for the hour because the brief's API uses it. Only these substitutions, used without the brief's term in the same name, are defects: `routine`, `habit` or `task` for ritual; `alarm`, `notification` or `alert` for reminder; `day` or `date` as the name of the night key; `invite`, `public link` or `guest link` for share link; `queue`, `jobs` or `mail_jobs` as the outbox table or module; `subscriber`, `user_count` or `active_count` for the live count. Cite each defect as `file:line`. Pass: none of the listed substitutions names one of the ten concepts."

