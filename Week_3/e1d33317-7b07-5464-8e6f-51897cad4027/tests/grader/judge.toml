description = "Recipe: read the server start-up and configuration code, search the whole source for each variable named in the Configuration table, for connection-string literals (postgres://, redis://, http:// endpoints) and for key or password literals, then trace whether any environment value reaches a browser-bound response, injected script or bundler define. The documented defaults (port 4173, presence window 15, retry 30) and the seed tokens are allowed, and a literal fallback credential fails, so cite each defect as `file:line`. Pass: no service URL or credential is written into source or passed to browser-bound code."

