title = "Lineage corrections"
text = "Re-measuring or regrading a board changes it and its open descendants parent before child in one transaction with paired adjustment movements, never changes retired boards or sales, rolls back entirely on any refusal, serialises concurrent corrections in one lineage, and refuses a re-parenting cycle with `lineage_cycle`."
