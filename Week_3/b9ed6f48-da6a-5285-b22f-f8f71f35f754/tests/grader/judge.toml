weight = 5
description = "Recipe: `playwright` at 1280x800, open `/`, use `browser_evaluate` to read one chapter card's computed border width and border colour and the computed font-family of its catalogue-number line, then screenshot the first row of cards. Pass: every visible chapter card is a museum card ruled by a 1 to 2 pixel dark grey-olive border, with its `HRR-<numeral>` catalogue number set in JetBrains Mono at the top of the card."

