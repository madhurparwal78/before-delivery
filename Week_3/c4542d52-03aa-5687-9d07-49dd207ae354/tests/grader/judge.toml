type = "binary"
weight = 3
description = "Recipe: search the server and browser source for `any` types, `as any`, non-null assertions (postfix `!`), `@ts-ignore` and `@ts-expect-error`. Cite every instance as `file:line`. Pass: no source line bypasses the type checker with any of these constructs."

[criterion.annotations]
channel = "quality"
