description = "Recipe: 1. Trace money from price-list input, line-sheet import and line pricing to API output, CSV, email and the billing item amount. 2. Cite as `file:line` any money value stored in the database, or returned in a JSON field ending in `Minor`, as a non-integer, and any `parseFloat`, float division or `toFixed` result that is then stored, returned in a `Minor` field or used to compute another amount (net, VAT, line total or total). These steps are allowed: rounding the 25% VAT half up to a whole minor unit, turning a typed or imported decimal amount into an integer of minor units, and writing an integer of minor units out in major units, as on-screen, CSV or email text in the brief's Money format or as the Kill Bill item amount, so long as that text or amount is not stored as the money value or computed with again. Pass: money is stored, computed and returned as integers in minor units, apart from those allowed steps."

