weight = 3
description = "Recipe: Review the behavioural interfaces, abstract classes, factories and service or repository layers in the server source, then the shared modules in the browser source. Types that only describe data shapes do not count. An abstraction with one implementation fails, and so does a layer that only forwards calls; cite each as file:line. Pass: No abstraction has a single implementation and no wrapper layer only forwards calls."

