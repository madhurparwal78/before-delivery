[[criterion]]
id = "Q6"
name = "Q6"
type = "binary"
weight = 3
description = "Recipe: find where error responses are built and read every handler's failure responses (4xx and 5xx JSON bodies), whether built by a shared helper or written inline. Health answers (`{\"status\":\"starting\"}` and `{\"status\":\"unavailable\"}`), which the brief defines separately, are not error bodies and are left out. The extra keys the brief publishes on an error-code body, `latest` on `stale_task` and `holder` on `held_by_other`, belong to the `{\"error\":\"<code>\"}` shape and are never cited. Cite each other error body of a different shape as `file:line`. Pass: every error response body has one of the two published shapes, `{\"error\":\"<code>\"}` or `{\"errors\":{\"<field>\":\"<message>\"}}`."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L624, L375"

[[criterion]]
id = "Q7"
name = "Q7"
type = "binary"
weight = 3
description = "Recipe: read the TypeScript config, then sample the server rule modules and the client list, board and timeline modules for `any` and for casts or non-null assertions that hide a real type mismatch (a value that can be missing at that point, or a double cast through `unknown`). A narrow assertion on an element the code just created or a DOM node it just looked up is idiomatic and is not a defect. A config without strict mode fails. Cite each defect as `file:line`. Pass: the sampled modules contain no `any` or cast or non-null assertion that hides a real type mismatch."

