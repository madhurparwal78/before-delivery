[task]
name = "gimbrel/tinework-gallery"
version = "1.0.0"
description = "Tinework by Gimbrel Works: a public gallery of code-defined parametric 3D parts with live re-evaluation, pre-flight checks against a print or cut process, immutable revisions with conditional writes, voxel compare, a stored-snapshot build tape, archives, and live review rooms with digest-bound approvals, built on PostgreSQL, MinIO, Mailpit and Valkey under eight house rules for numbers, ordering, storage outages, paint counting, derived markers, layout and write replay."
authors = [
    { name = "Aniket Tyagi", email = "aniket.tyagi24@ethara.ai" },
    { name = "Kaustubh Dalvi", email = "kaustubh.dalvi@ethara.ai" },
]
