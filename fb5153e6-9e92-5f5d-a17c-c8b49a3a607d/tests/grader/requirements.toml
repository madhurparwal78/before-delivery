    "staff-refunds",
    "limited-edition",
    "visibility-sharing",
    "plan-change",
    "contributor-review",
    "collections-export",
    "read-api",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
