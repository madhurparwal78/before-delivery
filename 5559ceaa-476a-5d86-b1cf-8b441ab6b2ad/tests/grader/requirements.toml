[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
CHECKPOINT_UPLOAD_DEADLINE_SECONDS = "30"
DATABASE_URL = "${DATABASE_URL}_nostore"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[outages]]
id = "short-timer"
port = 4176
url_env = "APP_SHORT_URL"

[outages.env]
MAGIC_LINK_TTL_SECONDS = "5"
REVIEWER_LINK_HOUR_SECONDS = "5"
CHECKPOINT_UPLOAD_DEADLINE_SECONDS = "5"
IMPORT_PLAN_TTL_SECONDS = "5"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
id = "DP-01"
title = "Magic-link sign-in"
text = "Requesting a sign-in link answers 202 with the same body whether or not the address has an account and sends exactly one email, and a link signs in once, only before it expires, and returns the landing path defined in API, as qualified in Services."
kind = "behavior"
primary = "pytest"
workflow = "onboarding"
tests = [
    "test_app.py::test_magic_link_request_and_verify",
    "test_app.py::test_sign_in_link_expiry",
    "test_app.py::test_wf_onboarding_mail_outage",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Sample workspace on first sign-in"
text = "A new mentor's first sign-in creates the sample project from Seed data with its exact four files, the checkpoints \"Starter\" and \"Minute 40\", the demo learner Robin Vale and one scheduled session."
kind = "behavior"
primary = "pytest"
workflow = "onboarding"
tests = [
    "test_app.py::test_sample_workspace_seed",
]
criteria = []
parameter_cases = []

