services:
  main:
    environment:
      MAIL_FROM: Noor Bakker Boards <desk@noorbakkerboards.example>
      APP_PUBLIC_PORT: '4173'
      APP_PUBLIC_URL: http://127.0.0.1:4173
      DATABASE_URL: postgresql://gf_app:gf-app-dev-2b7d41@postgres:5432/gf_dev
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: gf-dev
      S3_FORCE_PATH_STYLE: 'true'
      S3_ACCESS_KEY_ID: gf-dev-root-71c3e0
      S3_SECRET_ACCESS_KEY: gf-dev-secret-4b8d92
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      MAILPIT_URL: http://mailpit:8025
      GOTENBERG_URL: http://gotenberg:3000
      WIREMOCK_URL: http://wiremock:8080
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      postgres-seed:
        condition: service_completed_successfully
      minio-seed:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      wiremock:
        condition: service_healthy
  postgres:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_USER: gf_admin
      POSTGRES_PASSWORD: gf-admin-dev-9e4a02
      POSTGRES_DB: postgres
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U gf_admin -d postgres
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  postgres-seed:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      PGHOST: postgres
      PGUSER: gf_admin
      PGPASSWORD: gf-admin-dev-9e4a02
      PGDATABASE: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - |
      psql -Atqc "SELECT 1 FROM pg_roles WHERE rolname = 'gf_app'" | grep -q 1 ||
        psql -qc "CREATE ROLE gf_app LOGIN PASSWORD 'gf-app-dev-2b7d41'"
      psql -Atqc "SELECT 1 FROM pg_database WHERE datname = 'gf_dev'" | grep -q 1 ||
        psql -qc "CREATE DATABASE gf_dev OWNER gf_app"
  minio:
    image: coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    environment:
      MINIO_ROOT_USER: gf-dev-root-71c3e0
      MINIO_ROOT_PASSWORD: gf-dev-secret-4b8d92
    command: server /data
    healthcheck:
      test:
      - CMD-SHELL
      - MC_HOST_local=http://$$MINIO_ROOT_USER:$$MINIO_ROOT_PASSWORD@localhost:9000 mc ready local >/dev/null
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  minio-seed:
    image: coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    environment:
      MINIO_ROOT_USER: gf-dev-root-71c3e0
      MINIO_ROOT_PASSWORD: gf-dev-secret-4b8d92
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - |
      export MC_HOST_local="http://$$MINIO_ROOT_USER:$$MINIO_ROOT_PASSWORD@minio:9000"
      mc mb --ignore-existing local/gf-dev
      mc anonymous set none local/gf-dev
  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    healthcheck:
      test:
      - CMD
      - /mailpit
      - readyz
      interval: 2s
      timeout: 5s
      retries: 30
  gotenberg:
    image: gotenberg/gotenberg:8.39.0@sha256:13672f317b443c793e972b1bd2155ec62a3e7b6891b411e8196442cc053ee5f5
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - -o
      - /dev/null
      - http://127.0.0.1:3000/health
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  wiremock:
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    entrypoint:
    - sh
    - -c
    - if [ -n "$$WIREMOCK_STUBS" ]; then printf '%s' "$$WIREMOCK_STUBS" > mappings/baseline.json; fi; exec /docker-entrypoint.sh
      --port 8080 --disable-banner --max-request-journal-entries 20000 --admin-api-basic-auth gfkit-admin:gfkit-dev
    healthcheck:
      test:
      - CMD
      - curl
      - -sf
      - -u
      - gfkit-admin:gfkit-dev
      - http://127.0.0.1:8080/__admin/health
      interval: 2s
      timeout: 5s
      retries: 60
    environment:
      WIREMOCK_STUBS: '{"mappings": [{"request": {"method": "GET", "urlPath": "/v2/tracks"}, "response": {"headers":
        {"Content-Type": "application/json"}, "jsonBody": {"nextCursor": null, "tracks": [{"composer": "Ilse Voss",
        "id": "hr-1001", "seconds": 30, "title": "Lantern Street"}, {"composer": "Joost Amani", "id": "hr-1002",
        "seconds": 15, "title": "Tidal Grid"}, {"composer": "Mina Oduya", "id": "hr-1003", "seconds": 60, "title":
        "Paper Harbour"}]}, "status": 200}}, {"request": {"method": "GET", "urlPath": "/v2/prices"}, "response":
        {"headers": {"Content-Type": "application/json"}, "jsonBody": {"prices": [{"perMarket": "120.00", "validFrom":
        "2026-01-01"}]}, "status": 200}}, {"request": {"method": "POST", "urlPath": "/v2/licences"}, "response":
        {"headers": {"Content-Type": "application/json"}, "jsonBody": {"licenceId": "lic-501"}, "status": 201}},
        {"request": {"method": "POST", "urlPath": "/v1/renders"}, "response": {"headers": {"Content-Type": "application/json"},
        "jsonBody": {"id": "rnd-1", "state": "queued"}, "status": 202}}, {"request": {"method": "GET", "urlPath":
        "/v1/renders/rnd-1"}, "response": {"headers": {"Content-Type": "application/json"}, "jsonBody": {"sha256":
        "a58537fe387c1985edd7165c243e84fec778a0c4e2766dabefe2157f966098ee", "size": 28, "state": "done", "url":
        "/files/rnd-1.bin"}, "status": 200}}, {"request": {"method": "GET", "urlPath": "/files/rnd-1.bin"}, "response":
        {"body": "QUAYMILL PREVIEW FILM rnd-1\n", "headers": {"Content-Type": "application/octet-stream"}, "status":
        200}}]}'
x-minio-root:
  MINIO_ROOT_USER: gf-dev-root-71c3e0
  MINIO_ROOT_PASSWORD: gf-dev-secret-4b8d92
