[[requirements]]
id = "DP-01"
title = "Start a household"
text = "Anyone without a session can create a household by naming it, its ISO 4217 currency, themselves as its planning parent and the other parent, and is then signed in as the planning parent."
kind = "behavior"
primary = "pytest"
workflow = "onboarding"
tests = [
    "test_app.py::test_start_household",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Sessions"
text = "Both parents sign in with email and password to an opaque bearer token; signing out ends that session at once on every process, and every private page and endpoint refuses a missing or ended session."
kind = "behavior"
primary = "pytest"
workflow = "onboarding"
tests = [
    "test_app.py::test_sessions",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Shared sign-in limit"
text = "Failed sign-ins for one email are limited in a sliding window shared by every app process on the database, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "onboarding"
tests = [
    "test_app.py::test_sign_in_limit",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Invite the other parent"
text = "The planning parent emails the other parent a single-use join link whose lifetime comes from the environment, and sending again kills every earlier link."
kind = "behavior"
primary = "pytest"
workflow = "onboarding"
tests = [
    "test_app.py::test_invite_links",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-05"
title = "Join by invite"
text = "The other parent opens the join link, sets a password and lands on the Calendar signed in; a used, replaced or expired link shows the dead-link page, and two simultaneous joins give exactly one success."
kind = "behavior"
primary = "pytest"
workflow = "onboarding"
tests = [
    "test_app.py::test_join_by_invite",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-06"
title = "Onboarding journey"
text = "The planning parent is refused for giving the other parent the same email in different case, lands on the Plan editor with its landing copy, adopts a first plan and invites twice; failed sign-ins split across two processes lock the email, the replaced link is refused on the join screen already holding it open, two browsers racing the newest link give one join, a signed-out request link returns to Requests while a hostile return path lands on the Calendar, and both Calendars show the same year digest."
kind = "behavior"
primary = "workflow"
workflow = "onboarding"
tests = [
    "test_app.py::test_wf_onboarding_landing",
    "test_app.py::test_wf_onboarding_session_routes",
]
criteria = []
parameter_cases = []

