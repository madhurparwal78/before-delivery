[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: 1. Use the `source` MCP to find the module the server reads its settings from at start and every other place that reads the environment. 2. Search the whole source tree for literal connection strings, hosts, access keys, passwords and bucket names, allowing only the defaults the brief documents. A fallback for a setting that is neither a credential nor a URL, such as the sender address or a port number, is not a defect. 3. Read what configuration the server passes to the page. A hard-coded credential, or any credential sent to the browser, is a defect; cite each as `file:line`. Pass: every service URL and credential comes only from the environment."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L93, L1408, L1537, L1541-L1564"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: 1. Use the `source` MCP to find the export-save handler and the storage module it calls. 2. Trace the code that moves an export record to `stored`. A status set without a real storage call, an in-memory object store, or a missing size and SHA-256 comparison is a defect; cite the lines. Pass: an export record becomes stored only after the object write succeeds and the metadata read back from storage matches the bytes written."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L93, L1285, L1394-L1398"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: 1. Use the `source` MCP to find the code that sends sign-in codes and share invitations. 2. Trace where an invitation's `queued`, `sent` and `failed` states are set. A sent state set before the send call returns, a code or invitation that skips the mail call, or a stub standing in for the mail service is a defect; cite the lines. Pass: the sign-in and invitation senders report success only after the mail server accepts the message."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L93, L1162, L1404-L1408"

[[criterion]]
id = "S4"
name = "S4"
type = "binary"
weight = 3
description = "Recipe: 1. Use the `source` MCP to find the health and status routes and the probes they run. 2. Find where the page's status strip message is chosen. 3. List every route the server registers. A stub, a mock, a browser-computed service state, or a test-only route other than the published grading setup route is a defect; cite the lines. The published status route reports storage and mail only, and the page picks the strip copy from those two values with the published table, so neither is a defect. Pass: the health route, status route and studio status strip report only states that come from probes the server makes."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L93, L506-L513, L668-L669, L814-L817"

[[criterion]]
id = "Q1"
name = "Q1"
type = "binary"
weight = 3
description = "Recipe: 1. Read every TypeScript config file in the source and note whether strict mode is on; a file marked `@ts-nocheck` counts as not strict. 2. Search the source tree for `any` used as the type of a domain value (an entity, column, choice, link, group, layout, revision, unit, version, share, member, export or import), written as `: any`, `as any`, `<any>` or `any[]`. Each instance, or a config without strict mode, is a defect; cite each as `file:line`. Other casts, `@ts-expect-error` comments and `any` in glue code that holds no domain value are not defects for this criterion. Pass: domain values in the strict-mode TypeScript carry precise types rather than `any`."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L1592"

[[criterion]]
id = "Q2"
name = "Q2"
type = "binary"
weight = 3
description = "Recipe: 1. List the type, function, module, route and database table names in the source. 2. Compare them with the domain terms the engineering standards name. A synonym used for one of those concepts is a defect; cite each as `file:line`. Pass: every domain type, function and module is named with the brief's own term."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L1593"

[[criterion]]
id = "Q3"
name = "Q3"
type = "binary"
weight = 5
description = "Recipe: 1. For each domain rule the engineering standards say must be decided in one place, search the source for where it is implemented. 2. Check whether browser code or a second server module re-implements it. A second implementation of any listed rule is a defect; cite each as `file:line`. Pass: each listed domain rule is implemented in exactly one module that both server and browser code import where they need it."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L1594"

[[criterion]]
id = "Q4"
name = "Q4"
type = "binary"
weight = 3
description = "Recipe: 1. Search the source for every abstract class, every interface that a class implements, and every factory, adapter or wrapper type that chooses between implementations. 2. For each, count the implementations. A construct with exactly one implementation is a defect; cite each as `file:line`. Interfaces and type aliases that only describe the shape of data are not abstractions. Pass: no abstraction in the source has only one implementation."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L1595"

[[criterion]]
id = "Q5"
name = "Q5"
type = "binary"
weight = 3
description = "Recipe: 1. Search the source for commented-out code blocks, unused exports, unused functions and variables, branches after `return` or `throw`, and flags that are always false. Any instance is a defect; cite each as `file:line`. Pass: the source contains no commented-out code, unused export or unreachable branch."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L1596"

[[criterion]]
id = "Q6"
name = "Q6"
type = "binary"
weight = 3
description = "Recipe: 1. Read the request handlers and the code that parses their bodies, queries and path parameters. 2. Read the domain code those handlers call and look for null, shape or range checks on values the boundary already checked. Any inner check for a state the boundary rules out is a defect; cite each as `file:line`. Pass: every route validates its input at the request boundary."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L1597"

[[criterion]]
id = "Q7"
