[[criterion]]
id = "Q2"
name = "Q2"
type = "binary"
weight = 3
description = "Recipe: read every API handler's error path and the frontend code that turns an error code into visible copy. A handler building its own error JSON outside the shared builder, or published copy for one code written in two frontend modules, fails, so cite each as `file:line`. Pass: every API error leaves through one error-shape builder and the frontend maps error codes to published copy in one module."

[criterion.annotations]
channel = "quality"
