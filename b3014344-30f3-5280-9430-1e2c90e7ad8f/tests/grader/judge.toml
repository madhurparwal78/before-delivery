[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: Search the server source for `DATABASE_URL`, `S3_`, `POCKETBASE_`, `KILLBILL_`, `SMTP_`, `MAIL_FROM` and `APP_PUBLIC_URL`. Read every place that builds the Postgres pool, the S3 client, the PocketBase client, the Kill Bill client and the SMTP transport. Allowed literals are the brief's documented defaults: port 4173 and the four duration defaults. Seeded user passwords from the brief are seed data, not service credentials. Pass: every service credential and service address comes from `process.env`, with no literal host, port, username, password or API key used as a value or a fallback, so each such literal fails (cite it as `file:line`)."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L90, L650, L654-L664"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: Trace the handlers for `GET /api/plan` and `GET /api/invoices`, and the code that returns the plan after pause, cancel and change, down to their data sources. Pass: every plan status, plan date, failed-attempt count or invoice status the handlers return is taken from a Kill Bill HTTP response made during that request, so a ledger-stored copy or a date the app computes itself (for example the purchase date plus one month) fails."

[criterion.annotations]
channel = "source"
