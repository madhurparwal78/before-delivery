{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}Sign in · Mela{% endblock %}
{% block main_class %}center-main{% endblock %}
{% block main %}
<div class="auth-card" x-data="signIn" data-target="{{ target }}">
  <span class="auth-icon">{{ icon("door", 28) }}</span>
  <h1 class="auth-title">Sign in to Mela</h1>
  <p class="auth-lede">Use your email to sign in or create an account.</p>
  <form class="auth-form" novalidate @submit.prevent="submit()">
    <div class="field">
      <label for="signin-email">Email</label>
      <input id="signin-email" name="email" type="email" autocomplete="email" placeholder="you@email.com" x-model="email"
             :readonly="step !== 'email'" @input="step === 'email' || reset()" :aria-invalid="(!!errors.email).toString()"
             aria-describedby="signin-email-error" required>
      <p class="field-error" id="signin-email-error" x-show="errors.email" x-text="errors.email" hidden></p>
    </div>
    <template x-if="step === 'create'">
      <div class="field">
        <label for="signin-name">Name</label>
        <input id="signin-name" name="name" type="text" autocomplete="name" x-model="name" x-init="$el.focus()"
               :aria-invalid="(!!errors.name).toString()" aria-describedby="signin-name-error">
        <p class="field-error" id="signin-name-error" x-show="errors.name" x-text="errors.name"></p>
      </div>
    </template>
    <template x-if="step !== 'email'">
      <div class="field">
        <label for="signin-password">Password</label>
        <input id="signin-password" name="password" type="password" x-model="password"
               :autocomplete="step === 'create' ? 'new-password' : 'current-password'"
               x-init="step === 'password' && $el.focus()" :aria-invalid="(!!errors.password).toString()"
               aria-describedby="signin-password-error">
        <p class="field-error" id="signin-password-error" x-show="errors.password" x-text="errors.password"></p>
      </div>
    </template>
    <template x-if="failed"><p class="form-alert" role="alert">Incorrect email or password</p></template>
    <template x-if="outage"><p class="form-alert" role="alert" x-text="outageMessage"></p></template>
    <button type="submit" class="pill-button dark wide" :disabled="busy" x-text="label">Continue with Email</button>
    <button type="button" class="text-button" x-show="step !== 'email'" x-cloak @click="reset()">Use a different email</button>
  </form>
</div>
{% endblock %}
