text = "Seeded staff sign in with email and password and receive an HTTP-only session cookie, and API calls without a valid session are refused, as qualified in API."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_sessions",
