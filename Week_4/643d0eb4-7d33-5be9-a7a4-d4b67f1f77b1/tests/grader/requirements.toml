[[requirements]]
id = "DP-83"
title = "Retention ranks and read-time expiry"
text = "A snapshot whose rank by `published_at` is at or below its tier's retention count answers `200`, the rank one above it answers `410` and is absent from `GET /api/snapshots`, and that expiry is computed at the read with no sweep process."
kind = "behavior"
primary = "pytest"
workflow = "governance-limits"
tests = [
    "test_app.py::test_the_retention_rank_boundary_retains_and_expires_exactly",
    "test_app.py::test_an_expired_snapshot_answers_gone_and_leaves_the_list",
    "test_app.py::test_an_expired_snapshot_keeps_its_row_in_the_store",
    "test_app.py::test_the_retained_flag_ranks_itself_at_every_read",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-84"
title = "The session lifetime boundary is exclusive"
text = "A fresh session's `expires_at` is exactly twelve hours after its `created_at` to the second, and a session is refused at and after that moment rather than before it."
kind = "behavior"
primary = "pytest"
workflow = "governance-limits"
tests = [
    "test_app.py::test_a_fresh_session_lasts_exactly_twelve_hours_to_the_second",
    "test_app.py::test_a_session_past_its_expiry_is_refused_and_not_deleted",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-85"
title = "Content size is derived and floored"
text = "A table answer's `content_bytes` sums the published per-column contributions over its rows and `content_kilobytes` floors that figure by `1024`, both computed at the read, and the store keeps neither column."
kind = "behavior"
primary = "pytest"
workflow = "governance-limits"
tests = [
    "test_app.py::test_the_volume_table_content_size_recomputes_from_the_recipe",
    "test_app.py::test_content_kilobytes_floors_the_byte_figure",
    "test_app.py::test_the_store_keeps_no_content_size_column",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-86"
title = "The content allowance refuses the next write"
text = "A write to a table whose `content_kilobytes` has reached its tier's `content_allowance_kilobytes` is refused `422` naming the tier, the allowance and `content_kilobytes`, and appends no change log entry."
kind = "behavior"
primary = "pytest"
workflow = "governance-limits"
tests = [
    "test_app.py::test_a_table_at_its_content_allowance_refuses_the_next_write",
