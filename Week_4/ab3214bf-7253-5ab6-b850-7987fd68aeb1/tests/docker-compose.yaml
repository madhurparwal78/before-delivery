services:
  main:
    extra_hosts:
    - host.docker.internal:host-gateway
    security_opt:
    - seccomp=unconfined
    - systempaths=unconfined
    - apparmor=unconfined
    depends_on:
      postgres:
        condition: service_healthy
      wiremock:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      minio:
        condition: service_healthy
  postgres:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_USER: gf_admin
      POSTGRES_PASSWORD: gf-admin-5c1e8a37
      POSTGRES_DB: postgres
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U gf_admin -d postgres
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  wiremock:
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    entrypoint:
    - sh
    - -c
    - if [ -n "$$WIREMOCK_STUBS" ]; then printf '%s' "$$WIREMOCK_STUBS" > /home/wiremock/mappings/baseline.json;
      fi; exec /docker-entrypoint.sh --port 8080 --disable-banner --max-request-journal-entries 20000 --admin-api-basic-auth
      gfkit-admin:gfkit-wm-4fce2a657cbe2442
    healthcheck:
      test:
      - CMD
      - curl
      - -sf
      - -u
      - gfkit-admin:gfkit-wm-4fce2a657cbe2442
      - http://127.0.0.1:8080/__admin/health
      interval: 2s
      timeout: 5s
      retries: 60
    environment:
      WIREMOCK_STUBS: '{"mappings": [{"priority": 9, "request": {"method": "GET", "queryParameters": {"account":
        {"equalTo": "KG-HOLD-01"}}, "urlPath": "/registry/v2/holdings"}, "response": {"jsonBody": {"account": "KG-HOLD-01",
        "bundles": []}, "status": 200}}, {"priority": 9, "request": {"method": "POST", "urlPath": "/registry/v2/cancellations"},
        "response": {"jsonBody": {"status": "PENDING"}, "status": 202}}, {"priority": 9, "request": {"method": "GET",
        "urlPathPattern": "/registry/v2/cancellations/.+"}, "response": {"jsonBody": {"confirmed_at": "2026-11-09T12:00:00Z",
        "status": "CONFIRMED"}, "status": 200}}, {"priority": 9, "request": {"method": "GET", "urlPath": "/hub/v1/readings"},
        "response": {"jsonBody": {"runs": []}, "status": 200}}, {"priority": 8, "request": {"method": "GET", "queryParameters":
        {"from": {"equalTo": "2026-10-31T23:00:00Z"}, "meter": {"equalTo": "NL-RTM-01"}}, "urlPath": "/hub/v1/readings"},
        "response": {"jsonBody": {"runs": [{"count": 480, "interval_minutes": 60, "start": "2026-10-31T23:00:00Z",
        "unit": "kWh", "value": "1000.000"}, {"count": 960, "interval_minutes": 15, "start": "2026-11-20T23:00:00Z",
        "unit": "kWh", "value": "250.000"}]}, "status": 200}}, {"priority": 9, "request": {"method": "GET", "urlPath":
        "/hub/v1/corrections"}, "response": {"jsonBody": {"corrections": []}, "status": 200}}, {"priority": 9, "request":
        {"method": "GET", "urlPath": "/grid/v1/factors"}, "response": {"jsonBody": {"runs": []}, "status": 200}},
        {"priority": 8, "request": {"method": "GET", "queryParameters": {"zone": {"equalTo": "NL"}}, "urlPath":
        "/grid/v1/factors"}, "response": {"jsonBody": {"runs": [{"count": 17520, "g_per_kwh": "328.4125", "start":
        "2026-01-01T00:00:00Z"}], "zone": "NL"}, "status": 200}}, {"priority": 8, "request": {"method": "GET", "queryParameters":
        {"zone": {"equalTo": "FI"}}, "urlPath": "/grid/v1/factors"}, "response": {"jsonBody": {"runs": [{"count":
        17520, "g_per_kwh": "61.0365", "start": "2026-01-01T00:00:00Z"}], "zone": "FI"}, "status": 200}}]}'
  gotenberg:
    image: gotenberg/gotenberg:8.39.0@sha256:13672f317b443c793e972b1bd2155ec62a3e7b6891b411e8196442cc053ee5f5
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - -o
      - /dev/null
      - http://127.0.0.1:3000/health
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  minio:
    image: coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    environment:
      MINIO_ROOT_USER: gf-root-6d29b4
      MINIO_ROOT_PASSWORD: gf-root-secret-a83f17c5
    command: server /data
    healthcheck:
      test:
      - CMD-SHELL
      - MC_HOST_local=http://gf-root-6d29b4:gf-root-secret-a83f17c5@localhost:9000 mc ready local >/dev/null
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
