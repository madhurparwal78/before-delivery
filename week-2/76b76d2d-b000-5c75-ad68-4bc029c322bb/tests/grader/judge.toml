[[criterion]]
id = "Q2"
name = "Q2"
type = "binary"
weight = 5
description = "Recipe: Locate where the source decides each of these rules: per-line tax, the cost split, the season state derivation, the refund cutoff, the check-in window, hold liveness, the step-up requirement, the safe-path check, the locale rule and the retry schedule. Search for second copies of each, such as a two-hour or 45-minute constant, the QST rate or a hold expiry comparison. Code the brief itself requires outside that function is not a second copy: the checkout countdown that disables pay at 0:00, the membership and gift screens showing or hiding `Verify with a code` under the step-up rule, the client taking the page locale from the path prefix, swapping it on the language switch, setting `html lang` and sending `X-Halide-Locale`, and published copy or labels that print a rule's constant (the refund-cutoff message, the GST and QST row labels). Any other duplicated decision fails. Cite both sites as `file:line`. Pass: each listed rule is decided in exactly one function that every caller uses."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L154-L155, L193, L324, L355, L372, L484, L533, L578, L832"

