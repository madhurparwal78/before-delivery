{% extends "base.html" %}
{% block title %}Community · Keystone Tables{% endblock %}
{% block main %}
<section class="band"><div class="frame stack-lg">
  <h1>Community</h1>
  <p class="lede">Stewards, analysts and editors who keep their tables honest, in one place.</p>
</div></section>
<section class="band alt" aria-labelledby="note-title"><div class="frame stack">
  <h2 id="note-title">A note from the founder</h2>
  <figure class="prose stack">
    <blockquote style="margin:0"><p>We built Keystone Tables because a report is only as good as the controls behind it. Every amendment is recorded, every period can be closed, and every number you read has a reason you can trace.</p></blockquote>
    <figcaption class="muted">Ines Okafor, founder</figcaption>
  </figure>
</div></section>
<section class="band" aria-labelledby="news-title"><div class="frame stack">
  <h2 id="news-title">Hear when something ships</h2>
  <form id="subscribe-form" method="post" action="/api/subscribers" novalidate class="stack" style="max-width: 420px">
    <input type="hidden" name="form_token" value="{{ form_token }}">
    <div class="field"><label for="sub-email">Email</label><input class="input" id="sub-email" name="email" type="email" autocomplete="email" required aria-required="true"><p class="error" id="err-email" hidden></p></div>
    <div class="btn-row"><button type="submit" class="btn btn-primary" id="subscribe-send">Subscribe</button></div>
  </form>
  <div class="notice affirm" id="subscribe-status" role="status" hidden></div>
</div></section>
{% endblock %}
{% block scripts %}<script src="{{ asset('public.js') }}" defer></script>{% endblock %}
