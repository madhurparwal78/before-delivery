tests = [
    "test_app.py::test_wf_identify_and_rule_keyboard",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-16"
title = "Publish an aftercare edition"
text = "On the editions page the operator saves a dated edition whose start date the server accepts as later than today's London date, and sees it listed with its start date."
kind = "behavior"
primary = "workflow"
workflow = "catalogue-and-editions"
tests = [
    "test_app.py::test_wf_catalogue_and_editions_publish_edition",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-17"
title = "Editions never reach back"
text = "Saving an edition changes no existing ruling, and an edition rules only claims confirmed from 00:00 Europe/London on its start date."
kind = "behavior"
primary = "pytest"
workflow = "catalogue-and-editions"
tests = [
    "test_app.py::test_editions_never_reach_back",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-18"
title = "Import the supplier parts file"
text = "On the imports page the operator uploads the supplier CSV and sees counts of new, updated, unchanged and unmatched rows, with each unmatched row listed by line number and reason."
kind = "behavior"
primary = "pytest"
workflow = "catalogue-and-editions"
tests = [
