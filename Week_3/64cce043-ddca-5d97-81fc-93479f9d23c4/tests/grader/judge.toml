id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the configuration loader and every place a database connection string, realm address, issuer, client id, client secret or password is used. The brief's documented defaults (port 4173, grant hour 3600, idle 1800, pending 600, seeded account passwords) are permitted literals. Any other literal secret or address counts as not met. Cite each as `file:line`. Pass: every credential and service address in the source is read from the environment, with the brief's documented defaults as the only literals."

[criterion.annotations]
