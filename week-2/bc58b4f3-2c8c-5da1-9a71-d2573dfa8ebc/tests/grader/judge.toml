[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: from the server entrypoint, find where configuration is read and trace every service URL and credential listed in the brief (database, SMTP, Kill Bill, S3) to its use. Search all source, config and script files for literal hosts, ports, usernames, passwords, API keys and secrets of these services, including fallbacks such as `process.env.X ?? \"<literal>\"`. The documented defaults (port 4173, billing retry 10 seconds, session TTL 43,200 seconds, the stated MAIL_FROM value), the brief's seeded demo password in seed data, and the provided service compose files with their dev credentials (which the brief says stay unchanged) are allowed. Cite each offending literal as `file:line`. Pass: every service URL, host, port and credential comes only from `process.env` at start, with no literal value or fallback for any of them in the source."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-45",
]
evidence = "file_line"
cites = "L75, L389, L393, L305, L311, L335"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: read the client source tree, the bundler config (for example `define`, `envPrefix`, `import.meta.env` use) and every API handler that returns configuration or diagnostics. Cite each path that exposes one as `file:line`. Pass: no service URL or credential variable can reach the browser through client code, bundler injection, an HTML template or an API response."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-45",
]
evidence = "file_line"
cites = "L75, L393, L397"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: search the source for `_OBSERVER_` and for spreads or iteration over `process.env`, then trace where the config object goes. Cite each instance as `file:line`. Pass: no source file reads an `_OBSERVER_` variable or forwards the whole environment or config object into an API response or client payload."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-45",
]
evidence = "file_line"
cites = "L393"

[[criterion]]
id = "S4"
name = "S4"
type = "binary"
weight = 3
description = "Recipe: open the Kill Bill client, the S3 client and the SMTP transport, and trace how each is constructed from the env-read configuration through to the request that reaches the service (Kill Bill basic auth plus API key and secret headers, S3 access key and secret, SMTP host and port). Cite the construction and call sites as `file:line`. Pass: each of the three clients sends real requests built from the env-read values, with no stub, in-memory fake or test-only switch that bypasses the service."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
