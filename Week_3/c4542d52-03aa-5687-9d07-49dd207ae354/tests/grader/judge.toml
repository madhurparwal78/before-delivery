[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server start-up and configuration code, find where the database URL, the vault settings, the payment provider URL, both window lengths and the port are obtained, then search the whole source for literal service addresses, access keys, secrets and passwords. The brief documents these defaults, which are allowed: port 4173, window lengths 2592000 and 7776000 seconds, the seeded demo login password and the seeded people. Cite every other literal as `file:line`. Pass: every service address, credential or window length is read from the process environment, with no other literal address, key or password in the source."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-51",
]
evidence = "file_line"
cites = "L91, L748-L760"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: read the browser source tree, the API handlers and serializers (session, me, portal, documents, health) and the socket message builders, then search the browser code for environment reads and for any import of the server configuration module. The document `vault_key` field the brief lists is allowed. Cite every leak as `file:line`. Pass: no configuration value, service address or credential reaches browser code, an API response or a socket message."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-51",
]
evidence = "file_line"
cites = "L91, L395, L760"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: read the configuration code, then trace how `offer_expires_at`, `window_ends_at`, the offer-expiry scheduling and the window-end cancellation obtain their durations, including in the seed code. The environment variables must carry the defaults 2592000 and 7776000 seconds. Cite every stray 30-day or 90-day literal or second duration constant as `file:line`. Pass: every offer and leaver deadline in the server code is computed from the two environment-read window lengths."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-51",
]
evidence = "file_line"
cites = "L91, L495, L503, L591, L754-L755"

