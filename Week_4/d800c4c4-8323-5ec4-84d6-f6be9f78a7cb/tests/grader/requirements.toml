    "join-membership",
    "holds",
    "checkout",
    "shadow-board-checkin",
    "partial-returns",
    "late-fees",
    "fee-settlement",
    "photo-evidence",
    "storage-outage",
    "billing-outage",
    "opening-calendar",
    "mobile-board",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
