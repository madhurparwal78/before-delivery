[[requirements]]
id = "DP-01"
title = "Run manifest and health."
text = "Ship the run manifest and bind as Deployment states, and answer the health route as API states, including its 200 unavailable body when Valkey or MinIO is out of reach."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_health_routes",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Grading setup and worlds."
text = "`POST /api/grading/setup` creates a complete world from one JSON body and answers every created id by its key, and lists, counts, presence and search only ever include the caller's world."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_grading_setup_and_worlds",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Grading clock and outage."
text = "`POST /api/grading/clock` holds a world's clock and runs everything that has become due before it answers, and `POST /api/grading/outage` makes only the receiving instance treat a service as unreachable until set false."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_grading_clock_and_outage",
]
criteria = []
parameter_cases = []

