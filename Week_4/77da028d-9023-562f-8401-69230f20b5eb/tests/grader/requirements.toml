schema_version = 1
id_prefix = "DP"
mandatory_count = 60
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "site-setup",
    "tonight-plan",
    "night-scrub",
    "sky-conditions",
    "session-logging",
    "frame-upload",
    "session-amend-restore",
    "calibration-library",
    "project-ledger",
    "sharing",
    "pushes",
    "reminders",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "S4",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 85
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "minio", env = {} },
    { name = "ntfy", env = {} },
]

[criterion_weights]
B1 = 5
B2 = 5
B3 = 3
B4 = 3
B5 = 5
B6 = 3
B7 = 3
B8 = 3
B9 = 5
B10 = 5
B11 = 3
B12 = 3
S1 = 5
S2 = 5
S3 = 3
S4 = 3
Q1 = 5
Q2 = 3
Q3 = 3
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "ntfy-down"
port = 4174
url_env = "APP_NTFY_DOWN_URL"

[outages.env]
NTFY_URL = "http://127.0.0.1:9"
PUSH_RETRY_SECONDS = "2"
DATABASE_URL = "${DATABASE_URL}_ntfydown"
S3_BUCKET = "${S3_BUCKET}-ntfydown"

[[outages]]
id = "short-timer"
port = 4175
url_env = "APP_SHORT_URL"

[outages.env]
CONDITIONS_STALE_SECONDS = "5"
DRAFT_LOCK_SECONDS = "5"
PUSH_RETRY_SECONDS = "2"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
id = "DP-01"
title = "Workspace creation and unlock"
text = "Creating a workspace returns a one-time workspace key, and every private API call and screen requires that key as a bearer token or the unlock cookie, as specified in API."
kind = "behavior"
primary = "pytest"
workflow = "site-setup"
tests = [
    "test_app.py::test_workspace_creation_and_unlock",
    "test_app.py::test_unlock_screen_redirect_and_wrong_key",
]
criteria = []
parameter_cases = []

