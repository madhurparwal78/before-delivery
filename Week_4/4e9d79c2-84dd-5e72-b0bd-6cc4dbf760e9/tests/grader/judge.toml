name = "Q5"
type = "binary"
weight = 3
description = "Recipe: List interfaces, base classes and factories with their implementations, then read module-level mutable variables in server code. An abstraction with one implementation away from a provider boundary fails, as does a desk, session or request value held in module or process scope. Cite each defect as `file:line`. Pass: Every single-implementation abstraction sits at a provider boundary, with no request-specific value in module or process scope."

[criterion.annotations]
