type = "binary"
weight = 5
description = "Recipe: Locate where status edges, counted days, the calendar in effect on a date, cycle boundaries, clock-change marks and the unread derivation are decided, then search every caller and browser module for a second copy of each rule. A shared module imported by server and browser counts as one place. Any duplicated decision fails; cite both places as file:line. Pass: Each of these issue, calendar, cycle and unread rules is decided in exactly one place that every caller uses."

[criterion.annotations]
channel = "quality"
