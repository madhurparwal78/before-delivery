    "test_app.py::test_if_licences",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "The app stores data only in the provided PostgreSQL database, object storage bucket and mail sink; there are no other databases, caches, embedded stores, or data files written to disk."
tests = [
    "test_app.py::test_if_data_stores",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
