[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[services]]
name = "postgres"

[services.env]
PLOT_GRADING = "1"
PLOT_PRESENCE_TIMEOUT_MS = "3000"
PLOT_LINK_TTL_MS = "3600000"
PLOT_REVIEW_TTL_MS = "3600000"
PLOT_OP_WINDOW = "1000"
PLOT_DOM_MARGIN_PX = "200"
PLOT_DOM_CEILING = "500"
PLOT_UNDERLAY_MAX_BYTES = "200000"
PLOT_DRAWING_QUOTA_BYTES = "500000"
PLOT_TEXT_MAX_BYTES = "1000000"
PLOT_EXPORT_STEP_MS = "200"
PLOT_OP_RATE = "100000"
PLOT_LOGIN_RATE = "1000"
PLOT_TOAST_MS = "5000"
PLOT_UNDO_DEPTH = "100"

[[services]]
name = "minio"

[services.env]

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[requirements]]
