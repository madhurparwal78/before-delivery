id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the configuration module and search all source files, excluding lockfiles, for string literals that look like passwords, API keys, tokens, secrets or service addresses, and trace every variable the brief lists as configuration to its read from the environment, including that no env value is exposed to client code. Documented defaults are allowed: port 4173, the published numeric settings, the sandbox gateway callback secret, the published charity signing secret, and the seeded staff names and passwords used only to create seeded staff. Any other hard-coded credential or service address fails, cited as `file:line`. Pass: every credential and service address the app uses is read from the environment with no hard-coded literal beyond the documented defaults."

