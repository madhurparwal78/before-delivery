[task]
name = "deku/haunted-ctf-leaderboard-vb"
version = "1.0.0"
description = "A free five-day defensive security CTF event site on PostgreSQL. Blue team players sign up, form or join a team of up to twenty with a rotating invite code, and work eight haunted-network scenarios. Flags score once per team, earn personal raffle tickets, unlock a team certificate and reorder a live leaderboard whose page lives in the address, on every app instance. Sign-ups, team departures and wrong-flag locks stay exact under cross-instance races, and every refusal is a published JSON error."
authors = [
    { name = "Atharv Mahalwar", email = "atharv.mahalwar@ethara.ai" },
    { name = "Sonu Sharma", email = "sonu.sharma@ethara.ai" },
]
keywords = [
    "ctf",
    "leaderboard",
    "teams",
    "invite-code",
    "concurrency",
    "postgresql",
    "sse",
    "rate-limit",
    "python",
    "accessibility",
]

