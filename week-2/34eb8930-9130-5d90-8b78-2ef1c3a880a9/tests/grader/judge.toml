[[criterion]]
id = "Q2"
name = "Q2"
type = "binary"
weight = 3
description = "Recipe: 1. Read module, type and function names in server and browser source. 2. Compare them with the brief's domain terms (proposal, share, Owner, Editor, Commenter, Viewer, mode, suggestion card, comment, anchor, revision, notice, presence, saved revision). 3. Cite each domain name that substitutes another term (for example collaborator for share, annotation for comment, version for revision) as file:line. A word the brief itself uses for a thing is the brief's own term, not a substitute: \"document\" is the brief's word for a proposal in its routes, fields and screens (/api/documents, documentId, documentTitle, the documents home, the Documents heading, the Document status region), so names built on it are not cited. Pass: no domain name in the source substitutes another term for one of the brief's terms."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L559"

