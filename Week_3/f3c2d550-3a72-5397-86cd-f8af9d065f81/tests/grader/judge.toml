[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read `/app/run.json`, the server entry it starts and every module that builds the Postgres, MinIO, Meilisearch or Gotenberg client, then search the server source for string literals that hold a host, URL, key or password. Provided service configuration files are outside this check, and the defaults the brief documents (port 4173 or `APP_PUBLIC_PORT`, bind address `0.0.0.0`, index name `references`, the 2,592,000-second restore window, the real clock when `STOWDECK_NOW` is unset) are allowed. Pass: each of the four service clients takes its address and credentials only from the environment variables the brief names, with no other hard-coded host, URL, key or password in server source."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-51",
]
evidence = "file_line"
cites = "L125, L896-L905, L914"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: read the capture handler and the storage module it calls, and trace the order of the MinIO upload, the confirmation and the insert of the reference row. A success reported without MinIO's own answer, or an in-memory map or local file standing in for the bucket, fails. Pass: the reference row is created only after the original uploaded to MinIO has been confirmed from MinIO itself at the same byte count and SHA-256."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
