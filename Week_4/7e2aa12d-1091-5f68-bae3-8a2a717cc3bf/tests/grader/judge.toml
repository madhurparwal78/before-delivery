[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: search the server source for `process.env` and read the start-up configuration module. Search all source files for literal connection strings (`postgres://`, `redis://`, `valkey://`), literal passwords, and the literal grading key. The documented defaults (presence 30, tracks 12, breakpoints 3, port 4173) are allowed, and the grading key must have no fallback value. A hard-coded connection string or key anywhere in source fails. Pass: each of the seven variables listed in the brief's Configuration and secrets section is read from the environment once at start, and no source file holds a literal connection string, credential or grading key."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-56",
]
evidence = "file_line"
cites = "L951-L961"

