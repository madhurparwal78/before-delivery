[[criterion]]
id = "Q6"
name = "Q6"
type = "binary"
weight = 3
description = "Recipe: search the Python and browser source for commented-out blocks, unused functions or exports, unreachable branches, base classes or protocols with a single implementation, and checks for states the rules make impossible. An example of the last is re-validating a status the transition table already guarantees. Each instance is a defect. Pass: none of these defects exist, with each one found cited as file:line."

[criterion.annotations]
channel = "quality"
