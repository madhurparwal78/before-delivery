description = "Recipe: `playwright` at 1280x800, shot stage-q1. Read each of the four answer tiles in the screenshot, zoomed in if needed. Pass: each of the four tiles shows its letter next to a tally mark drawn as separate strokes, with one stroke on A rising to four on D."

