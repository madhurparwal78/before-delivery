[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: find where the server reads configuration (search the source for `process.env` and for literal hosts, ports, bucket names, usernames, passwords, API keys and secrets such as `localhost`, `127.0.0.1`, `:9000`, `:8080`, `admin`, `password`, `minioadmin`). Trace each Postgres, MinIO, Kill Bill and SMTP address and credential, `MAIL_FROM`, `APP_PUBLIC_PORT` and `PUBLIC_BASE_URL` to its read. Cite each read and each offending literal as `file:line`. Pass: every one of those values comes from the environment with a missing one stopping the start with an error naming it, and no literal fallback exists other than the brief's four tunable duration defaults and the `APP_PUBLIC_URL` fallback for the public base address."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-02",
]
evidence = "file_line"
cites = "L1740-L1761"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 3
description = "Recipe: identify the browser source tree (the client entry and every module it imports) and the server's response builders. Search the client tree for imports of the server configuration module, `process.env`, `import.meta.env` or any credential name, and search response and health builders for configuration values being serialised. Cite each hit as `file:line`. Pass: no browser module reads or embeds any service address or credential, and no response body or header includes one."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
