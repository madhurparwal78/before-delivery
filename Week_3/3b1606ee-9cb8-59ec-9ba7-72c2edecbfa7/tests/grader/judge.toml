description = "Recipe: search client and server source for `crypto.subtle`, `createCipheriv`, `createDecipheriv` and crypto package imports, and trace where letter bodies, profiles and attachments are sealed and opened. Sealing or opening in server code is a defect, cited as `file:line`. Pass: letters, profiles and attachments are sealed and opened only in client code through `crypto.subtle`."

[criterion.annotations]
channel = "source"
