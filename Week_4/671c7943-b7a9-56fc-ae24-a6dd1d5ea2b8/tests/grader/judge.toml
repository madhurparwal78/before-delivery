weight = 5
description = "Recipe: `playwright` at 1280x800, open `/`. 1. Run `browser_evaluate` on the level-1 heading to read `font-family`, `font-size`, `font-weight` and, for each `[data-line]` element, the right edge of its rendered text: the largest right edge of a Range over each of its non-blank text nodes (`const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); while (w.nextNode()) { if (!w.currentNode.data.trim()) continue; const r = document.createRange(); r.selectNodeContents(w.currentNode); right = Math.max(right, r.getBoundingClientRect().right); }`; a Range over the element itself measures any block box inside it, not the text), and the computed `font-size` of every level-2 heading on the page, then call `document.fonts.check` for Instrument Serif at the level-1 heading's own computed weight and size. 2. Screenshot the intro. Pass: the three-line intro heading is set in loaded Instrument Serif at a computed size larger than every level-2 heading on the page, with a ragged right edge, meaning its three lines end at different right edges."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "critically_important"
