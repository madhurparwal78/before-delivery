weight = 3
description = "Recipe: 1. Search application source for commented-out code, unused exports and parameters, unreachable branches and files nothing imports. 2. Search for interfaces, factories or wrapper classes with exactly one implementation. 3. Search for null or range checks on values the database schema or types already rule out, and for routes or screens the brief does not describe. Cite each as file:line. Pass: none of these defects appears anywhere in the application source."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L924-L925"

