title = "Sheet uploads judged by content and size"
text = "Each sheet file is accepted or refused by its content signature as PDF, PNG, JPEG or script-free SVG within the published byte limit, and SVGs are served inert. A storage outage answers 503 and adds no register row."
kind = "behavior"
primary = "pytest"
workflow = "drawing-register"
tests = [
    "test_app.py::test_sheet_uploads_content",
]
criteria = []
parameter_cases = []

