type = "binary"
weight = 3
description = "Recipe: search server and client source for commented-out code blocks, unused exports, unreachable branches and checks for states the types or state machines already exclude. Cite each as `file:line`. Pass: no commented-out block, unused export, unreachable branch or impossible-state check exists."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L1258"

[[criterion]]
id = "Q6"
name = "Q6"
type = "binary"
weight = 3
description = "Recipe: trace money from request input through prices, taxes, refund allocation, Kill Bill request bodies and email formatting, searching for `parseFloat`, `toFixed`, floating division and decimal dollar amounts held in variables. Turning integer cents into a decimal string at the moment a Kill Bill request body or a displayed amount is serialized is allowed. A floating-point dollar value carried between functions or stored counts as failing. Cite each violation as `file:line`. Pass: every money value on that path is carried as integer cents up to its point of serialization."

[criterion.annotations]
channel = "quality"
