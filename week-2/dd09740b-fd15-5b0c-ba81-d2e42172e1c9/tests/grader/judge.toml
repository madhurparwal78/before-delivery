[[criterion]]
id = "Q3"
name = "Q3"
type = "binary"
weight = 5
description = "Recipe: source MCP. 1) Read the transition, booking, inquiry key claim and transition key claim code paths with their outbox writes. 2) A read followed by an unguarded write, such as a SELECT of the version or overlapping calls then a plain UPDATE or INSERT, is a defect; cite it as `file:line`. Pass: each path takes its decision and writes inside one database transaction guarded by a version predicate, row lock, constraint, advisory lock or SERIALIZABLE isolation with retry."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L857, L607, L636"

[[criterion]]
id = "Q4"
name = "Q4"
type = "binary"
weight = 3
description = "Recipe: source MCP. 1) Read the request parsing for inquiries, transitions, notes and sign-in. 2) Defects: `int(...)`, `str(...)` or `bool(...)` that converts a JSON body value of another type, an `isinstance(x, int)` that admits `bool`, or a schema library in coercing mode; cite each as `file:line`. Parsing the `{id}` path segment and the form-encoded no-script `/start` fields, which arrive as strings, is not a defect. Pass: every JSON field's type is checked before use with no coercion across types."

[criterion.annotations]
channel = "quality"
