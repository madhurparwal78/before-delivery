[[if_rules]]
id = "IF-04"
text = "The app uses no datastore beyond PostgreSQL, Meilisearch and MinIO: no SQLite, Redis, file-based database or in-memory store used as a source of truth."
tests = [
    "test_app.py::test_if_no_extra_datastore",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "No source or built file references an external origin for scripts, styles, fonts or images."
tests = [
    "test_app.py::test_if_no_external_origins",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "The provided service configuration and its environment values are not changed."
tests = [
    "test_app.py::test_if_service_config_untouched",
]
parameter_cases = []

[[if_rules]]
id = "IF-07"
text = "Application source is TypeScript compiled with strict type checking turned on."
tests = [
    "test_app.py::test_if_strict_typescript",
]
parameter_cases = []

