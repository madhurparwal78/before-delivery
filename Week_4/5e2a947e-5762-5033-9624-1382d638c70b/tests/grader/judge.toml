type = "binary"
weight = 5
description = "Recipe: trace each place that records a stored-object state, namely an attachment becoming stored, an uploaded outline kept before parsing, an export job becoming ready and a version snapshot written before its version is recorded. A state set before the call, on a timer, from an in-memory flag or after a swallowed store error fails. Cite each defect as `file:line`. Pass: each stored-object state changes only after the real object-store call has returned success."

[criterion.annotations]
channel = "source"
