type = "binary"
weight = 3
description = "Recipe: read the server's module names, table names, classes and public functions. A core concept named by a generic or foreign synonym, such as tenant, document store, item, record or namespace, counts as a defect; cite each as `file:line`. Pass: every core concept in those names uses the brief's own domain term."

[criterion.annotations]
