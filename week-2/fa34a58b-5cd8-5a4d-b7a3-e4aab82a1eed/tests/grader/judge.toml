[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: 1) Read the server entrypoint and its configuration module. 2) Trace every PostgreSQL pool, S3 client and SMTP transport constructor back to its inputs. 3) Cite each environment read and any literal host, credential or bucket fallback as `file:line`, treating any such literal as a failure. Pass: every service address, credential and the mail sender is read only from the published environment variables with no literal fallback other than the documented port 4173."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-53",
]
evidence = "file_line"
cites = "L92, L683, L689-L696"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 3
description = "Recipe: 1) Read the browser source directory for imports of server configuration or references to the published service variables. 2) Read every logging call and status or error response builder in the server. 3) Cite each instance found as `file:line`. Pass: no browser module, log statement or API response references a service address, credential or published service variable."

