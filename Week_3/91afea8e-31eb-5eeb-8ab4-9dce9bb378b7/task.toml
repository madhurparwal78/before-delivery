[task]
name = "chauraha/chauraha-bazaar"
version = "1.0.0"
description = "Chauraha Bazaar, a multi-seller Indian marketplace where one cart becomes one parcel per seller and every rupee, unit and pincode is decided once on the server: two-step SMS sign-in, faceted search with pincode promises, product, offer and EMI comparison, a GST-exact cart, idempotent last-unit-safe checkout across UPI, card, net banking, EMI, balance split and cash on delivery, prorated returns, share links, a seller console with stored labels and invoices and a deduction-by-deduction settlement statement, and a support view."
authors = [
    { name = "Rishabh Tiwari", email = "rishabh.tiwari@ethara.ai" },
    { name = "Kaustubh Dalvi", email = "kaustubh.dalvi@ethara.ai" },
]
