parameter_cases = []

[[requirements]]
id = "DP-52"
title = "Immediate role changes"
text = "A role change or removal applies to the member's next request and reaches their open session, without a reload, within the limit in Accounts. A downgraded editor's next edit is refused with the role notice, and their session switches to comment mode."
kind = "behavior"
primary = "pytest"
workflow = "roles-invites"
tests = [
