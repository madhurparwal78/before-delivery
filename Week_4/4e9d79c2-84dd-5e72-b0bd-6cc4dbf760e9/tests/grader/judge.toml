type = "binary"
weight = 5
description = "Recipe: Locate the enquiry state change, half-up money rounding, deposit limit, UK-date day count, hours breach and payment allocation, then search for a second implementation of each. A rule restated in another module, handler or browser-side file fails. Cite each rule's home and any copy as `file:line`. Pass: Each of these rules is decided in exactly one place in the source."

[criterion.annotations]
channel = "quality"
