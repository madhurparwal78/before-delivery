weight = 5
description = "Recipe: `playwright` at 1280x800. 1) Sign in as the seeded analyst and open the Corridors list. 2) With `browser_evaluate`, read the computed font-family, font-weight, font-style and font-size of the level-1 heading and of a table body cell, then call `document.fonts.check` with each element's own weight, style and size against Fraunces and IBM Plex Sans respectively. 3) Screenshot the list. Pass: the level-1 heading renders in a loaded Fraunces face while the table body text renders in a loaded IBM Plex Sans face."

[criterion.annotations]
