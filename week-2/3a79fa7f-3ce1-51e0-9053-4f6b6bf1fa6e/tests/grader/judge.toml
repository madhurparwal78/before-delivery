type = "binary"
weight = 3
description = "Recipe: 1) Read the client code that renders configurator options, the product dialog, the `/boards` size badges and the order and trade-in action buttons. 2) Read the server's compatibility table, stock reads and transition tables. 3) Offering the action the brief names for an order or trade-in status, or showing an action only inside a time window the brief states (protection window, booking open, unexpired demo credit), is allowed; any client copy of the compatibility table, stock numbers, or a table of which status may move to which, fails. 4) Cite each client copy as `file:line`. Pass: the browser decides disabled options, Out of Stock badges and offered actions from server fields alone."

