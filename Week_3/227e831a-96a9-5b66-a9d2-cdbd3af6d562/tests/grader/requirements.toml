[[requirements]]
id = "DP-54"
title = "Retry-safe retirement"
text = "A retirement repeated with the same Idempotency-Key replays its stored answer and changes nothing, a reused key with a different body or a key still in progress is refused, and the Retire dialog resends its one key after a lost answer."
kind = "behavior"
primary = "pytest"
workflow = "retire-gear"
tests = [
    "test_app.py::test_wf_retire_gear_lost_answer",
    "test_app.py::test_retire_idempotency",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-55"
title = "Cross-site writes refused"
text = "Every API write carrying a foreign or null Origin or a cross-site Sec-Fetch-Site header is refused with 403 before any check other than the body limit and content type, and writes nothing."
kind = "behavior"
primary = "pytest"
workflow = "retire-gear"
tests = [
    "test_app.py::test_cross_site_writes_refused",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-56"
title = "The losing device shows the server's state"
text = "A device whose list state change or line write is refused because another device changed the list announces the refusal and switches to the list's real state from the server, never showing a state the server has not confirmed."
kind = "behavior"
primary = "pytest"
