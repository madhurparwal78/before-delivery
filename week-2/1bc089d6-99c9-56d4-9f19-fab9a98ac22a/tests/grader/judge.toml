[judge]
judge = "codex"
model = "openai/gpt-5.6-sol"
version = "0.163.0"
cwd = "/judge-workspace"
timeout = 2400
mode = "batched"
samples = 3
guard = "penalize"
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "normal",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_press_key",
    "browser_resize",
    "browser_select_option",
    "browser_hover",
    "browser_drag",
    "browser_tabs",
    "browser_wait_for",
    "browser_mouse_wheel",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "reduced"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "reduced",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_press_key",
    "browser_resize",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "touch"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "touch",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_press_key",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "source"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "source-mcp",
]
allowed_tools = [
    "list_files",
    "read_file",
    "search_files",
]

[scoring]
aggregation = "weighted-mean"

[[criterion]]
id = "B1"
name = "B1"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800, open `/`, poll until the gate buttons appear, then press \"Begin in silence\". 1) Scroll `region \"The hour nobody plans.\"` into view so that part of its panel ground away from text is on screen, then screenshot it. 2) Do the same for `region \"Breathe in for four, hold for seven, out for eight.\"` and `region \"Plan your Stillhour.\"`. 3) In each screenshot, judge the painted ground in an empty margin area of the chapter, away from text, buttons and cards. In chapter six, sample outside the planner's own dusk-violet form panel. If that panel fills the chapter's full width, sample the ground beside or above the chapter heading instead. A colour, gradient, layered background or pseudo-element all count, and only what is painted matters. The panel's height does not matter. Middle chapters may share one dusk-violet ground, so chapter three may match its neighbours. Pass: going from chapter one's pale cool lavender ground through chapter three's ground to chapter six's near-black violet ground, the lightness never rises."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-57",
]
evidence = "screenshot"
cites = "L85, L109-L111, L231-L232, L236"

[[criterion]]
id = "B2"
name = "B2"
type = "binary"
weight = 3
description = "Recipe: `playwright` at 1280x800, open `/`, poll until the gate buttons appear, press \"Begin in silence\". 1) Screenshot a body paragraph in chapter one, \"The hour nobody plans.\". 2) Scroll to `region \"Plan your Stillhour.\"` and screenshot the planner's live summary line that begins \"Your hour starts at\". 3) For the paragraph and the summary line, read the computed text colour, font-size and font-weight with `browser_evaluate`. 4) Take the ground colour from the screenshot pixels directly beside each text, wherever that ground is painted from. 5) Compute the WCAG contrast ratio for each pair. Text of at least 24 px, or at least 18.66 px at weight 700 or more, is large text and needs 3:1, while other text needs 4.5:1. Pass: both texts reach the WCAG 2.2 AA contrast ratio for their size against the ground painted behind them."

