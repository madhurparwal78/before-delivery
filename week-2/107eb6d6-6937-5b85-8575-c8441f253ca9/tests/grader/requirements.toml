[[requirements]]
id = "DP-01"
title = "Seeded sign-in"
text = "Each seeded member exchanges their email and password at `POST /api/auth/login` for a bearer token and their user, `GET /api/auth/me` describes them, and `POST /api/auth/logout` revokes the token."
kind = "behavior"
primary = "pytest"
workflow = "sign-in"
tests = [
    "test_app.py::test_seeded_sign_in",
]
criteria = []
parameter_cases = [
    "admin",
    "dispatcher",
    "manager",
    "milo",
]

