evidence = "file_line"
cites = "L651"

[[criterion]]
id = "Q2"
name = "Q2"
type = "binary"
weight = 5
description = "Recipe: locate the code that decides each placement check (stage, clay, cone, height, edge, post, overlap), each piece and firing status transition, the fee arithmetic with its one rounding, fill percent and the cool-down decision. A single shared module imported by both the server and the browser counts as one place, so the board showing refusals live by calling that shared module is not a defect. Then search for a second independent implementation of any of these rules, in another server module or written separately in browser code, or a second rounding step. Each such duplicate fails, cite each as `file:line`. Pass: each rule is decided in exactly one source location that every caller uses."

[criterion.annotations]
channel = "quality"
