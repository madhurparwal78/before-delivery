[task]
name = "plumb-and-pencil/snaglight-walkthrough"
version = "1.0.0"
description = "Snaglight, a punch-list and job-notes workspace for small residential remodelers: plan-pinned items on rectilinear room polygons, plan revisions with affine pin mapping, collaborative note editing with a published character model and personal undo, recurring working-hours site visits with time-limited access codes, exact punch-list costing with effective-dated change orders, blocked-by links with all-or-nothing bulk actions, offline walkthroughs with a per-field merge policy, a commit-ordered live job event stream, and code-free email through an outbox, on Postgres, MinIO and Mailpit."
authors = [
    { name = "Dishita Arya", email = "dishita.aryaint17@ethara.ai" },
    { name = "Utsav Jain", email = "utsav.jain@ethara.ai" },
]
keywords = [
    "punch-list",
    "remodeling",
    "offline-sync",
    "collaborative-editing",
    "recurrence",
    "dst",
    "affine-transform",
    "event-stream",
    "exact-money",
    "outbox",
    "minio",
    "mailpit",
    "postgres",
    "typescript",
]

