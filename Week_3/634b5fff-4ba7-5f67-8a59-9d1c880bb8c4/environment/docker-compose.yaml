        {"priority": 9, "request": {"method": "POST", "urlPath": "/v1/authorisations"}, "response": {"headers":
        {"Content-Type": "application/json"}, "jsonBody": {"declineCode": "do_not_honor", "status": "declined"},
        "status": 402}}, {"request": {"bodyPatterns": [{"matchesJsonPath": {"equalTo": "1234", "expression": "$$.code"}}],
        "method": "POST", "urlPathPattern": "/v1/challenges/[^/]+"}, "response": {"headers": {"Content-Type": "application/json"},
        "jsonBody": {"confirmation": "immediate", "status": "authorised"}, "status": 200}}, {"priority": 9, "request":
        {"method": "POST", "urlPathPattern": "/v1/challenges/[^/]+"}, "response": {"headers": {"Content-Type": "application/json"},
        "jsonBody": {"declineCode": "challenge_failed", "status": "declined"}, "status": 402}}, {"request": {"method":
        "POST", "urlPathPattern": "/v1/payments/pay_cb_[^/]+/capture"}, "response": {"headers": {"Content-Type":
        "application/json"}, "jsonBody": {"confirmation": "callback", "status": "pending"}, "status": 202}}, {"request":
        {"method": "POST", "urlPathPattern": "/v1/payments/pay_capfail_[^/]+/capture"}, "response": {"headers":
        {"Content-Type": "application/json"}, "jsonBody": {"declineCode": "authorisation_lost", "status": "capture_failed"},
        "status": 402}}, {"priority": 9, "request": {"method": "POST", "urlPathPattern": "/v1/payments/[^/]+/capture"},
        "response": {"headers": {"Content-Type": "application/json"}, "jsonBody": {"confirmation": "immediate",
        "status": "captured"}, "status": 200}}, {"request": {"method": "POST", "urlPathPattern": "/v1/payments/[^/]+/void"},
        "response": {"headers": {"Content-Type": "application/json"}, "jsonBody": {"status": "voided"}, "status":
        200}}, {"request": {"method": "POST", "urlPathPattern": "/v1/payments/pay_cb_[^/]+/refunds"}, "response":
