[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server's configuration module and every place the server builds its database pool, billing client, mail transport and object-storage client, then search all app source (excluding the provided service configuration, which IF-05 leaves untouched) for literal hostnames, ports, URLs, usernames, passwords, API keys and secrets for those services. A literal fallback such as `env.X ?? 'http://...'` or a hard-coded password counts as a defect; cite each as file:line. Pass: every service URL and credential is read at start from the environment variables listed in Configuration and secrets, with no literal value or fallback other than the documented port 4173 and the localhost public-URL default."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-05",
]
evidence = "file_line"
cites = "L5, L605-L613, L602"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 3
description = "Recipe: read the frontend source, the frontend build configuration (for example define blocks or exposed env prefixes), the HTML templates and every server response or header writer. Any frontend reference to the configuration variables, any service hostname or credential embedded in client code, or any API body or header that carries one counts as a defect; cite each as file:line. Pass: no service URL or credential can reach the browser except the signed certificate link returned to coordinators by the file-link endpoint."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-05",
]
evidence = "file_line"
cites = "L613, L405, L548"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: trace three paths in the server source: a close or late-cancellation charge to the billing client call, a queued email to the mail transport send, and a certificate upload and file link to the object-storage client. A mock, in-memory, no-op or fake-success branch chosen by an environment flag, NODE_ENV or a test mode counts as a defect; cite each as file:line. Pass: each path performs a real network call through a client configured from the environment variables in Configuration and secrets."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-05",
]
evidence = "file_line"
cites = "L3, L529-L531, L534, L546-L548, L606-L611"

