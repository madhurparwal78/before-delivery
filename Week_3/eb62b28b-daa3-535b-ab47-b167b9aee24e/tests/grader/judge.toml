weight = 3
description = "Recipe: `playwright` at 1280x800. 1) Open `/plans`. 2) With `browser_evaluate`, read the computed text colour of the level-one heading and convert it to HSL. 3) Screenshot the page top. Pass: the heading ink is a deep navy with lightness 25% or lower and hue from 200° to 245°."

