[judge]
judge = "codex"
model = "openai/gpt-5.6-sol"
version = "0.163.0"
cwd = "/judge-workspace"
timeout = 1200
mode = "batched"
samples = 3
guard = "penalize"
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "normal",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_press_key",
    "browser_resize",
    "browser_select_option",
    "browser_hover",
    "browser_drag",
    "browser_tabs",
    "browser_wait_for",
    "browser_mouse_wheel",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "reduced"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "reduced",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_press_key",
    "browser_resize",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "touch"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "touch",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_press_key",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "source"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "source-mcp",
]
allowed_tools = [
    "list_files",
    "read_file",
    "search_files",
]

[scoring]
aggregation = "weighted-mean"

[[criterion]]
id = "B1"
name = "B1"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800. 1) Run the prompt's step A to create a fresh 90-minute ASL hospital request as the invented seed scheduler Tomas Herrera, then step B to release it as the invented seed dispatcher Dana Whitcombe. 2) On /board press Next week until the week heading contains the request's date. 3) Take a full-page screenshot of the board. Pass: the board is a sheet ruled with thin lines whose left gutter lists the five seeded languages in seed order beside seven Monday-to-Sunday day columns, with the fresh capsule in the ASL row under its own day."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-44",
]
evidence = "screenshot"
cites = "L95, L160, L337"

[[criterion]]
id = "B2"
name = "B2"
type = "binary"
weight = 5
description = "Recipe: `touch` at 375x812. 1) Run step A for a fresh 480-minute ASL request, then step B to release it. 2) Sign in as the dispatcher, open /board, tap Next week until the heading contains the request's date, then tap that day in `tablist \"Days\"`. 3) Probe the computed background of each `group \"Seat <n>\"` in the fresh capsule. 4) Take an element screenshot of that capsule. A flat orange fill without stripes, or an `open` label lost in the stripes, fails. Pass: each of the two seat lanes shows visible 45-degree stripes in a burnt orange-red (medium-to-low lightness, red-orange hue) over paper, carrying the word `open` on a paper-coloured chip readable over the stripes."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-44",
]
evidence = "screenshot"
cites = "L95, L157, L161"

[[criterion]]
id = "B3"
name = "B3"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800. 1) Run step A for an ASL request (any length; a shorter one overlaps fewer of Jordan's seats), then step B. 2) Run step C so the invented seed interpreter Jordan Fairweather claims seat 1; if the claim cannot be completed, use instead any request on the board whose seat 1 Jordan Fairweather already holds (its capsule shows `J.F.`). 3) Sign in as the dispatcher, open /board, press Next week until the heading contains the request's date, and wait until the capsule shows `J.F.`. 4) Take an element screenshot of that capsule. A seat 1 lane still striped or still labelled `open` after the claim succeeded fails. Pass: seat 1's lane is a solid deep forest green (low lightness, green hue) without stripes, labelled `J.F.` in place of `open`."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-44",
]
evidence = "screenshot"
cites = "L95, L157, L170-L174"

