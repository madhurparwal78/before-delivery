[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[outages]]
id = "minio-down"
port = 4176
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "pocketbase-down"
port = 4177
url_env = "APP_POCKETBASE_DOWN_URL"

[outages.env]
POCKETBASE_URL = "http://127.0.0.1:9"

[[outages]]
id = "second-instance"
port = 4178
url_env = "APP_SECOND_URL"

[outages.env]
MEDIA_LINK_SECONDS = "300"

[[outages]]
id = "short-dunning"
port = 4179
url_env = "APP_DUNNING_URL"

[outages.env]
DUNNING_RETRY_SECONDS = "5"
DATABASE_URL = "${DATABASE_URL}_dunning"
S3_BUCKET = "${S3_BUCKET}-dunning"

[[requirements]]
id = "DP-01"
title = "Sightline orbit and alignment readout"
text = "The sightline scene on each chapter page turns its camera between -60° and +60° by drag, by scroll inside the scene or by arrow keys, and shows the alignment percentage from Business rules both on screen and as the scene's aria-valuenow."
kind = "behavior"
primary = "pytest"
workflow = "sightline"
tests = [
    "test_app.py::test_sightline_orbit_readout",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Sightline resolution"
text = "When the camera comes within the resolve window of the chapter's sightline, or the visitor uses Align, the title appears as a real heading, the readout locks at 100% in the accent colour, Enter chapter becomes enabled and the resolution is announced."
