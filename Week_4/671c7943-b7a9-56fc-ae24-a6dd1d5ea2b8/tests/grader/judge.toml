id = "B5"
name = "B5"
type = "binary"
weight = 3
description = "Recipe: `playwright` at 1280x800, open `/`. 1. Scroll to the statistics, run `browser_evaluate` to read `font-variant-numeric` and `font-feature-settings` of the visible `[data-count]` number with the most digits once its count has finished, then screenshot. 2. Scroll to `Selected work`, read the same properties of the year text in the first gallery item, then screenshot. 3. If an element does not compute to tabular figures, measure its rendered digits: walk its text nodes in order and, for each digit character, take a Range over that one character (`r.setStart(node, i); r.setEnd(node, i + 1)`) and the centre of its box (`left + width / 2`); any other character ends a run of digits. The steps between neighbouring centres within a run are that element's figure spacing. Pass: both the statistic number and the gallery year render equal-width figures (tabular computed style, or every figure step in that element equal within 0.5 px)."

