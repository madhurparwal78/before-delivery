[task]
name = "fathomwright/swathdeck"
version = "1.0.0"
description = "Swathdeck: one console for a small hydrographic survey contractor running several uncrewed survey boats, covering line and crossline planning by survey order, live fleet telemetry, coverage, holidays and crossline agreement while surveying, bridge-style attributed alerts, raw line files kept as recorded, maintenance that blocks unsafe assignments, and client-scoped survey review."
authors = [
    { name = "Rishabh Tiwari", email = "rishabh.tiwari@ethara.ai" },
    { name = "Kaustubh Dalvi", email = "kaustubh.dalvi@ethara.ai" },
]
keywords = [
    "hydrography",
    "bathymetry",
    "uncrewed-surface-vessels",
    "survey-planning",
    "coverage",
    "crosslines",
    "alerts",
    "telemetry",
    "object-storage",
    "email",
    "typescript",
]

