description = "Recipe: 1) Read the server config module. 2) Read every module that constructs the PostgreSQL pool, the S3 client for MinIO or the Kill Bill client, citing each construction as `file:line`. 3) Cite any literal service URL or credential as `file:line`. Pass: every service URL or credential is read from the environment variables the brief lists, with no literal URL, username, password, key or secret beyond the documented port 4173 or 172800 hold seconds."

