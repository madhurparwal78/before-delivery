[task]
name = "northcoil/rimewire"
version = "1.0.0"
description = "Rimewire by Northcoil Works: a job-centred team messenger for commercial refrigeration and HVAC crews, with versioned edits, per-version read receipts and a read-by-version scrubber, resumable live events, derived send limits, clean photo storage in MinIO with a durable removal queue, and invite and per-zone mention digest email through Mailpit, on PostgreSQL."
authors = [
    { name = "nishant.dubey", email = "nishant.dubey@ethara.ai" },
    { name = "Sonu Sharma", email = "sonu.sharma@ethara.ai" },
]
