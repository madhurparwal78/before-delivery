S3 = 3
S4 = 3
Q1 = 3
Q2 = 3
Q3 = 5
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "archive-down"
port = 4174
url_env = "APP_ARCHIVE_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_archive"
S3_BUCKET = "${S3_BUCKET}-archive"

[[outages]]
id = "short-close"
port = 4175
url_env = "APP_SHORT_CLOSE_URL"

[outages.env]
DAY_CLOSE_SECONDS = "5"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
id = "DP-01"
title = "Named sign-in."
text = "Let owner-masters sign up and let owner-masters and crew sign in with an email and passcode, with every protected page and endpoint refused without a session as stated in API."
kind = "behavior"
primary = "pytest"
workflow = "vessel-setup-and-clock"
tests = [
    "test_app.py::test_sign_up_and_sign_in_api",
    "test_app.py::test_protected_pages_and_endpoints_refused_signed_out",
]
criteria = []
parameter_cases = []

