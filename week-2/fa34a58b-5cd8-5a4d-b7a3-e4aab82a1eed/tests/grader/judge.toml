[[criterion]]
id = "S4"
name = "S4"
type = "binary"
weight = 3
description = "Recipe: 1) Trace notice delivery from the outbox insert through the claim, the SMTP send and the sent mark. 2) Treat a sent mark set before or without the SMTP result, or an in-memory queue, as a failure; a send call that resolves counts as acceptance, and the per-recipient accepted list need not be inspected. 3) Cite the path as `file:line`. Pass: the PostgreSQL outbox row becomes sent only after the send call of the real SMTP transport resolves."

[criterion.annotations]
