title = "Foreign ids answer as never existing"
text = "Any shop, product, order, hold or return id that belongs to another operator, or that the person may not see, gets exactly the not-found answer of an id that never existed, in status, body, headers apart from Date and response time, and opening such an order or shop address shows the not-found screen with focus on its heading."
