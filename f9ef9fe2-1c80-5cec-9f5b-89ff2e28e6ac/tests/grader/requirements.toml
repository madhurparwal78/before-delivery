allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "cross-cutting",
    "brush-and-hold",
    "confirm-booking",
    "prepaid-pack",
    "cancel-booking",
    "rates-and-policy",
    "recurring-slot",
    "compliance-documents",
    "compliance-gate",
    "operator-day",
    "member-records",
    "bookkeeper-report",
    "outage-recovery",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
