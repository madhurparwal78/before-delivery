[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: list the server source files and read the export, project and snapshot routes, then search the server code for mesh building, boolean geometry, circuit solving, block-program running and STL, OBJ or SVG writing. Checking the length, closedness or parse-ability of an uploaded export file, and storing snapshots, are allowed. Pass: the server code contains no mesh generation, boolean geometry, circuit solving, block-program running or export-file writing, only validation and storage of what the browser uploads."

