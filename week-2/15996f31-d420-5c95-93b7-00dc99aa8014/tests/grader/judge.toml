[[criterion]]
id = "Q3"
name = "Q3"
type = "binary"
weight = 5
description = "Recipe: locate where each of these rules is decided: the order, drop and link transitions, the server's block average and tier, the commit check, the Pacific delivery date and the largest-remainder allocation. The browser's provisional average that starts the Add sample roll, the browser's Pacific default and display of dates, and the Hives field maximum are required by the brief and are not duplicates; summing server payout_cents, or payable_cents minus commission_cents, for the 'Beekeeper payouts' and 'My expected pay' rows is display, not duplicated logic; the server alone decides delivered_on and the commit check. Deciding a tier, a payable or a settlement figure in client code, re-deriving a tier or average in the email or PDF code instead of reusing the server's result, or checking a transition inline in a route is a defect. Cite each duplicate as `file:line`. Pass: each listed rule has exactly one server implementation that every caller reuses."

