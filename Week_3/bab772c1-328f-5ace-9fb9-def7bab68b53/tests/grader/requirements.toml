[[requirements]]
id = "DP-01"
title = "Missions with an epoch"
text = "Create a mission with a name and an ISO 8601 UTC epoch through the API, rejecting bad input with the field errors in API."
kind = "behavior"
primary = "pytest"
workflow = "capture-upload"
tests = [
    "test_app.py::test_create_mission_api",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Empty mission console"
text = "A mission with no parsed samples shows the empty-mission heading and line from Feedback states in place of the lunar disc, on the author console and on the share page."
kind = "behavior"
