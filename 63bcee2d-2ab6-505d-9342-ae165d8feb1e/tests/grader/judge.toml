description = "Recipe: `playwright` at 1280x800 for the page steps and the read-only `source` MCP for step 3. 1. On /, take a screenshot of the level-1 heading and read its computed font-family, font-weight and font-style. 2. With browser_evaluate, list the document.fonts entries for the first family name (any alias is acceptable) and their status, and run document.fonts.check with that heading's own weight, style and family. 3. In the read-only source, find where that family name is registered, by whatever mechanism the build uses (a CSS @font-face rule, a FontFace API call, an embedded data URL or a font package import), and identify the typeface of the asset it registers from its file name, package name or font metadata. 4. Repeat steps 1 and 2 for the level-1 heading on /work/kestrel-causeway-bay, an invented seed case study. A heading drawn in a system or generic fallback serif fails. Pass: both headings render in a loaded face that the source registers from an Instrument Serif font asset."

