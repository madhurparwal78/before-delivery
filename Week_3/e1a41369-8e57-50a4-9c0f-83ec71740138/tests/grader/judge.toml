description = "Recipe: with the `source` MCP, follow `npm start` from package.json to the server entry, open the module that reads process.env at start, then search the whole source tree for literal connection strings, access keys, secrets and endpoint URLs. The documented defaults (port 4173, the four game-setting defaults, an unset grading token) are allowed, and the seeded demo password is seed data rather than a service credential. Pass: the database URL, object store endpoint, region, bucket and keys are read from process.env at start with no literal fallback value anywhere in the source."

