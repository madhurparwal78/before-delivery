[[requirements]]
id = "DP-15"
title = "Keyboard and narrow windows"
text = "Every page works by keyboard alone at 375x812, 768x1024 and 1280x800 without horizontal scrolling, in the published tab order, and nothing depends on a hover a keyboard cannot reproduce."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_wf_cross_cutting_keyboard",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-16"
title = "Runtime contract"
text = "Serve the pages and the JSON API from one Go process on one origin, answer `GET /api/health` with 200 once ready, answer every list route with a top-level array, accept on every write route only the fields of its published request shape while listing every failing field at once, and load the seed exactly once so a restart neither re-seeds nor duplicates a row."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_api_runtime_contract",
    "test_app.py::test_promotion_strict_shape",
    "test_app.py::test_adverse_event_validation",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-17"
title = "Read-time derivation and agreement"
text = "Compute every derived figure and state word at read time from the records it cites, store none as a column, make every surface that shows a count, rate or state agree, and let a refused request change no record and consume no promotion code."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_refusals_change_nothing",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-18"
title = "Reader and operator separation"
text = "Reader pages show only published records rendered from live state, and no reader route ever exposes an operator control."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_wf_cross_cutting_reader_pages",
]
criteria = []
parameter_cases = []

[[if_rules]]
id = "IF-01"
text = "Every duration on a page reads as whole minutes with the word minutes beside it, and every rate reads as basis points with the words basis points beside it."
tests = [
    "test_app.py::test_if_units_beside_figures",
]
parameter_cases = []

[[if_rules]]
id = "IF-02"
text = "No promotion row is ever deleted, and no table carries a stored highest-rung, gap, rate or state column."
tests = [
    "test_app.py::test_if_no_deleted_rows_or_stored_figures",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Demotions caused by one breach are recorded from the highest rung downward, so their instants strictly increase as the rung index decreases."
tests = [
    "test_app.py::test_if_cascade_instants_descend",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "The application writes exactly the three named deliverables into the working directory root, and no other file at run time."
tests = [
    "test_app.py::test_if_only_deliverables_written",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "/app/run.json is a JSON object with string install, build and serve fields and \"_schema\":\"run-manifest-v1\"."
tests = [
    "test_app.py::test_if_run_manifest",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "/app/THIRD_PARTY_NOTICES.md names every shipped package with its licence. Shipped packages means the modules the production binary links, as listed by go version -m on the built server."
tests = [
    "test_app.py::test_if_third_party_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-07"
text = "Every shipped package is under the MIT, BSD-2-Clause, BSD-3-Clause, Apache-2.0, ISC or MPL-2.0 licence."
tests = [
    "test_app.py::test_if_licence_allowlist",
]
parameter_cases = []

[[if_rules]]
id = "IF-08"
text = "The PostgreSQL database named by DATABASE_URL is the only datastore, so there is no embedded database, cache server or state file."
tests = [
    "test_app.py::test_if_postgres_only_datastore",
]
parameter_cases = []

