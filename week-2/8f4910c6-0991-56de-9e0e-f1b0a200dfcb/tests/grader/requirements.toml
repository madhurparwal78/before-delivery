[[requirements]]
id = "DP-19"
title = "Board by keyboard and phone"
text = "A booker places, releases and confirms options either by keyboard alone (arrow keys across days, Enter to open a day, the published focus targets) or by touch at 375x812 in a bottom sheet with a sticky action bar. Every rare state announces its exact copy, and a session that ends mid-dialog keeps the typed values for after signing in again."
