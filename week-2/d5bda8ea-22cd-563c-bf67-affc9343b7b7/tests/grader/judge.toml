[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: starting from the app entrypoint named in `run.json`'s `serve`, read the modules that run SQL and trace the queries for register, guest decisions, event create and edit, discover filters, sign-in and contact. Column or table names chosen in code from a fixed allow-list (for example the SET list of a partial PATCH) are allowed. A value the request supplied (text, number, slug, email, id, status, filter value) placed into SQL text by f-string, `%`, `.format` or concatenation counts as a fail; cite each as `file:line`. Pass: every request-supplied value on the traced paths reaches SQL through a driver placeholder."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-51",
]
evidence = "file_line"
cites = "L714, L920"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: trace the register, cancel, host approve, host remove and promoting capacity PATCH request paths from their per-event serialization (lock or equivalent) to their commit. Schema setup and seeding are outside this check. Within one of these request paths, a change that touches more than one row (for example a cancellation and the promotions it triggers) split across commits, or run in autocommit between its steps, counts as a fail; cite each as `file:line`. Pass: each traced request path commits its row changes in one database transaction."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-51",
]
evidence = "file_line"
cites = "L686-L706, L920"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: list the files under the static and template folders, search templates, CSS and JS for `http://`, `https://`, `@import`, `url(` and `<img` sources, then read the code that renders covers and avatars. A bundled raster cover, a font file or an external asset URL counts as a fail; cite each as `file:line`. Pass: the source ships no photograph, logo, map tile, avatar image or font file from elsewhere."

