[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read /app/run.json and package.json, find the server entry, then search the application source for `process.env` and for literal URLs, hostnames, access keys, passwords and secrets for the database, object storage, billing, mail and search providers. Every default the brief itself documents (the listening port, the index name, the studio instance name, the retry delays) is allowed. Pass: no provider URL, host, key or password the brief lists for configuration appears as a literal or fallback value in application source."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L111, L893-L905"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: find how the app separates browser code from server code (client entry points, client-marked modules, a public or static folder, HTML templates, inline scripts), then check each browser-bound file for imports of the config module or a provider client, and check every template or page renderer for interpolation of provider URLs or credential values. Pass: no provider URL or credential value reaches a page, inline script, JSON sent to the browser or browser-bound module."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
