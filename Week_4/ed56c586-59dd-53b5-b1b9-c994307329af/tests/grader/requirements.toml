text = "Each counter block starts at the published 75% line moment, also after a jump or a resize and without `IntersectionObserver`. It then shows the published floor figures on the page clock until its target at 1,500 ms."
kind = "behavior"
primary = "pytest"
workflow = "achievement-counters"
tests = [
    "test_app.py::test_counter_start_and_figures",
]
criteria = []
parameter_cases = []

