weight = 5
description = "Recipe: trace POST /api/sketches/:sid/constraints from its route into the solver and the slack and point-freedom computation. A per-kind freedom table used in place of a rank, a seed-specific literal or a sketch-name branch fails. Pass: slack is computed from a numeric rank of the constraint equations evaluated at the solved geometry."

[criterion.annotations]
