[[requirements]]
id = "DP-01"
title = "Starting a desk and signing in."
text = "A new desk signs up; a wrong password gets 401 and the right one signs in; signing out gets 401 from the session endpoint; changing the password gets 401 on that person's other session and the new password signs in; and the browser's sign-in form lands on the published route with a live session and signs out."
kind = "behavior"
primary = "workflow"
workflow = "desk-access"
tests = [
    "test_app.py::test_wf_desk_access_sign_in_journey",
    "test_app.py::test_wf_desk_access_password_ends_other_sessions",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Keeping clients."
text = "The artist creates, reads, renames and deletes a client, a deleted client answers 404 from then on, and a client of another desk answers 404 exactly like an unknown id in the same shape."
kind = "behavior"
primary = "workflow"
workflow = "desk-access"
tests = [
    "test_app.py::test_wf_desk_access_client_lifecycle",
    "test_app.py::test_wf_desk_access_other_desk_is_unknown",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Public site journey."
text = "Each page's heading reveals line by line with one whole accessible name; routes change by the two-phase wipe with the old page inert, focus on the new heading and the new title, Back during a wipe ending on the newest address and Back restoring scroll, with no wipe under reduced motion; the reel filter is a radio group in the URL whose items move as the same elements, with the reel grid's columns as published on each side of 1100 px and at 768x1024 and 375x812; the client strip passes, pauses, stops and wraps as published; accordions open one at a time with the open one in the URL; city links land below the sticky header with focus on the heading; Copy address works with the clipboard allowed and refused; the header is solid from its published scroll depth, also straight after a reload; and its own screen and enquiry endpoint are checked for the earlier error of the ladder, whole-second instants and SR1 to SR24 with its accordion, a keyboard-only journey and a 375x812 touch journey with the per-action checks, its rare-state copy verbatim and its precision rule (the enquiry limit and the width at which columns change), and its screen meets the screen rules."
kind = "behavior"
primary = "workflow"
workflow = "public-site"
tests = [
    "test_app.py::test_wf_public_site_wipe_and_heading",
    "test_app.py::test_wf_public_site_reel_grid_and_strip",
    "test_app.py::test_wf_public_site_accordion_city_copy",
    "test_app.py::test_wf_public_site_enquiry_keyboard_touch",
]
criteria = []
parameter_cases = []

