{% extends "base.html" %}
{% import "_icons.html" as icons %}
{% block title %}{{ t[heading_key] }}{% endblock %}
{% block main %}
<div class="error-page">
  <p class="wordmark"><span>Northfall</span></p>
  <h1 class="display-xl" data-arrive>{{ t[heading_key] }}</h1>
  {%- if heading_key == "unavailable" %}
  <p class="lede">{{ t.unavailable_lede }}</p>
  {%- endif %}
  <p class="error-links">
    <a class="text-link" href="{{ prefix or '/' }}">{{ t.go_home }}{{ icons.arrow() }}</a>
  </p>
</div>
{% endblock %}
