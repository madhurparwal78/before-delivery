[[requirements]]
id = "DP-01"
title = "Upload and page view"
text = "A sender uploads a PDF with Upload PDF and gets a draft whose original is stored byte for byte, whose `originalSha256` matches the file and whose every page shows as a `Page <n> of <count>` group with its own filmstrip button."
kind = "behavior"
primary = "workflow"
workflow = "upload-pages"
tests = [
    "test_app.py::test_wf_upload_pages_happy",
    "test_app.py::test_wf_upload_pages_draft_page",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Page navigation"
text = "The filmstrip moves between pages with ArrowUp, ArrowDown and Enter, and at 768 px wide and narrower a `Page` combobox replaces it, with no sideways scroll at any width."
kind = "behavior"
primary = "pytest"
workflow = "upload-pages"
tests = [
    "test_app.py::test_wf_upload_pages_navigation",
    "test_app.py::test_wf_upload_pages_scroll_current",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Upload refusals and limits"
text = "Uploads are judged by their bytes and refused with the published status, body and alert for non-PDFs, password-protected, scripted, rotated, over-60-page and over-25,000,000-byte files, storing nothing and returning focus to Upload PDF."
kind = "behavior"
primary = "pytest"
workflow = "upload-pages"
tests = [
    "test_app.py::test_wf_upload_pages_refusals",
]
criteria = []
parameter_cases = [
    "renamed_image",
    "encrypted",
    "scripted",
    "rotated",
    "pages_61",
    "bytes_25000001",
    "storage_down",
    "pages_60_allowed",
    "bytes_25000000_allowed",
]

