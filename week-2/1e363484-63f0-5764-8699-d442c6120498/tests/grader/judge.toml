name = "S1"
type = "binary"
weight = 5
description = "Recipe: trace where the server builds its Postgres pool, S3 client, SMTP transport, public URL, port and the link, idempotency and session durations. Literals other than the brief's documented defaults (port 4173, the three duration defaults, the MAIL_FROM fallback) fail, including a hard-coded host, bucket, access key, secret, password or connection string; cite each as `file:line`. Pass: each of these values is read from its listed environment variable, with literals limited to the brief's documented defaults."

