id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server's configuration loading and every Postgres, Kill Bill, S3 and SMTP client construction, then search the source for literal URLs, hosts, usernames, passwords, API keys, secrets and bucket names. The brief's documented defaults (port 4173, REMINDER_SWEEP_SECONDS 60, SESSION_IDLE_SECONDS 1800, the published MAIL_FROM) are allowed. Cite each offending literal as `file:line`. Pass: no provider URL, credential or bucket name appears as a literal in the source."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-44",
]
evidence = "file_line"
cites = "L1409-L1421, L1403"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: read the browser app's source, the bundler configuration (for example `define`, public env prefixes or injected globals) and any server route that serializes config to the page. A client-side provider SDK or a config endpoint exposing provider details fails. Cite each as `file:line`. Pass: no browser-bound file or bundler setting references a provider variable, credential, URL or bucket name."

[criterion.annotations]
channel = "source"
basis = "explicit"
