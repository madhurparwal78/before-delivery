schema_version = "1.4"

[[artifacts]]
source = "/app"
exclude = [
    "node_modules",
    ".git",
]

[task]
name = "kitefold/parcel-moon"
version = "1.0.0"
description = "Parcel Moon, a browser courier game on a tiny walkable planet with a server-held save, paired stamp ledger, guest-save claim by email, rush-parcel races, stored photo postcards, moderated presence and a live founder console, backed by Postgres, MinIO and Mailpit, with tested 3D camera rigs, motion and reduced-motion behaviour."
authors = [
    { name = "raja.kumarint17", email = "raja.kumarint17@ethara.ai" },
]
keywords = [
    "browser-game",
    "webgl",
    "three-d",
    "multiplayer-presence",
    "idempotency",
    "concurrency",
    "stamp-ledger",
    "magic-link",
    "postcards",
    "png-validation",
    "moderation",
    "time-zones",
    "reduced-motion",
    "accessibility",
    "typescript",
]

[metadata]
uuid_v5 = "3ed42748-a0d7-5e33-9be1-4dca2c953439"
identity_namespace_url = "https://tasks.example/kitefold/parcel-moon/1.0.0"
category = "Greenfield"
domain = "indie browser games (small persistent multiplayer web worlds)"
archetype = "solo founder"
language = "typescript"
design_direction = "Tactile, sunlit, hushed risograph stamp-cards with perforated ticket-stub edges on warm paper over a full-bleed WebGL planet; ink type, riso pink accents, a teal route ribbon only, sun-yellow awards; Fraunces display and Atkinson Hyperlegible body; comfortable density; cards pinned to the corners with a horizon compass ring along the bottom; signature Horizon thread camera pull-back, ribbon unspool and return with a live reduced-motion readout."
created_at = "2026-10-29"
seed = "url"
service_profile = "postgres+mailpit+minio"
harbor_version = "0.24.0"
grader_version = "gfkit-0.1.0/rewardkit-0.2.3"
contract_version = "1.0.0"
requirements_registry = "tests/grader/requirements.toml"
mandatory_requirement_count = 78
workflow_count = 13
rubric_criterion_count = 23
rubric_total_weight = 87
if_constraint_count = 6
scoring_policy = "reward=pytest-outcome-pass-rate;if_score+rubric+quality+combined_score-separate;binary-rubric-5/3/1"
self_contained = true
builds_from_source = true
null_floor = 0.0
platforms = [
    "linux/amd64",
    "linux/arm64",
]

[agent]
timeout_sec = 36000.0
network_mode = "public"

[environment]
os = "linux"
cpus = 4
memory_mb = 4096
storage_mb = 20480
network_mode = "public"
build_timeout_sec = 3600.0

[verifier]
environment_mode = "separate"
timeout_sec = 36000.0

[verifier.env]
JUDGE_SECRET = "${JUDGE_SECRET:-}"
JUDGE_URL = "${JUDGE_URL:-http://host.docker.internal:8790}"
