text = "The seeded closure dates are not open days anywhere: hold dates, walk-in and renewal due dates, the day a unit is back and late-day counting all skip them."
kind = "behavior"
primary = "pytest"
workflow = "late-fees"
tests = [
    "test_app.py::test_closure_dates",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-52"
title = "Borrowing limit"
text = "A member never has more than 4 holds and loans active at once, even under simultaneous requests, and a slot frees the instant a hold is cancelled, a loan is checked in or a pickup deadline passes, as set out in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "borrowing-pause"
tests = [
    "test_app.py::test_borrowing_limit",
    "test_app.py::test_wf_borrowing_pause_limit_ui",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-53"
title = "Free count at commit"
text = "Each successful hold reports the free count for its dates right after its own claim, so racing winners report distinct counts ending at zero and the catalogue and lanes agree afterwards."
kind = "behavior"
primary = "pytest"
workflow = "reserve-unit"
tests = [
    "test_app.py::test_hold_race_for_last_units",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-54"
title = "Photo cap under simultaneous uploads"
text = "Simultaneous uploads never take a stage past 4 photos, the bucket holds exactly one object per photo record, and a refused upload leaves no object and no record."
kind = "behavior"
primary = "pytest"
workflow = "condition-photos"
tests = [
    "test_app.py::test_photo_cap_race",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-55"
title = "One check-in and one inspection"
text = "Among simultaneous check-ins or inspections of the same loan exactly one succeeds, the stored values are the winner's, and every other attempt gets the invalid-transition conflict."
kind = "behavior"
primary = "pytest"
workflow = "check-in-inspection"
tests = [
    "test_app.py::test_one_check_in_race",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-56"
title = "Late days across the spring clock change"
text = "Each late day's closing instant uses that date's own offset, so a return after the 18:00 daylight-time closing on the Tuesday after the March clock change counts that Tuesday as late."
kind = "behavior"
primary = "pytest"
workflow = "late-fees"
tests = [
    "test_app.py::test_wf_late_fees_spring_clock_change",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-57"
title = "Damage beyond the deposit"
text = "A damage charge up to the replacement value takes what it can from the deposit and bills the remainder once as a separate charge, with the released, kept and extra amounts adding up exactly."
kind = "behavior"
primary = "pytest"
workflow = "settlement"
tests = [
    "test_app.py::test_damage_beyond_deposit",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-58"
title = "Settlements one at a time"
text = "Simultaneous settlement attempts for one loan with different Idempotency-Keys are decided one after another, so billing, the ledger and the receipt email each record the settlement once."
kind = "behavior"
primary = "pytest"
workflow = "settlement"
tests = [
    "test_app.py::test_settlements_one_at_a_time",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-59"
title = "Honest Cancel hold"
text = "A member's hold row changes only after the server answers Cancel hold, and a refused cancel shows the hold's real state with the reason, never Cancelled."
kind = "behavior"
primary = "pytest"
workflow = "member-records"
tests = [
    "test_app.py::test_wf_member_records_honest_cancel",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-60"
title = "Opaque outage answers"
text = "Every outage answer carries only the published code and message with no provider address or error text, and a refused checkout or walk-in changes no free count, lane, span or deposits-held figure."
kind = "behavior"
primary = "pytest"
workflow = "billing-outage"
tests = [
    "test_app.py::test_opaque_outage_answers",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-61"
title = "Renew once"
text = "The borrower or staff can renew a loan that is out once, to an open day at most 7 days after its due date, never billed, and a renewal racing another member's hold for the extension days has exactly one winner."
kind = "behavior"
primary = "pytest"
workflow = "walk-in-reminders"
tests = [
    "test_app.py::test_renewal",
    "test_app.py::test_wf_walk_in_reminders_busy_renewal",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-62"
title = "Reminder per due time"
text = "A renewed loan receives one due reminder naming its new due time when that time comes within the reminder lead time, and the old due time's reminder is never sent again."
kind = "behavior"
primary = "pytest"
workflow = "walk-in-reminders"
tests = [
    "test_app.py::test_reminder_per_due_time",
]
criteria = []
parameter_cases = []

