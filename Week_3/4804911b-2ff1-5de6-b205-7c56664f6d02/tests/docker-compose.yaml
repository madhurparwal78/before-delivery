services:
  main:
    extra_hosts:
    - host.docker.internal:host-gateway
    security_opt:
    - seccomp=unconfined
    - systempaths=unconfined
    - apparmor=unconfined
    depends_on:
      postgres:
        condition: service_healthy
      svix:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      minio:
        condition: service_healthy
  postgres:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_USER: gf_admin
      POSTGRES_PASSWORD: gf-admin-5c1e8a37
      POSTGRES_DB: postgres
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U gf_admin -d postgres
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  svix-db:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_USER: svix
      POSTGRES_PASSWORD: svix
      POSTGRES_DB: svix
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U svix -d svix
      interval: 2s
      timeout: 5s
      retries: 30
  svix:
    image: svix/svix-server:v1.104.0@sha256:fb0872f4d53e5ced46eef9349a15cc02e0ddae35d041a6f9f00fbee9dd1a0711
    command:
    - svix-server
    - --run-migrations
    - --wait-for
    - '60'
    environment:
      SVIX_JWT_SECRET: gfkit-svix-jwt-secret-5b8e1d2c7a940f36
      SVIX_DB_DSN: postgresql://svix:svix@svix-db:5432/svix
      SVIX_QUEUE_TYPE: memory
      SVIX_CACHE_TYPE: memory
      SVIX_WHITELIST_SUBNETS: '[0.0.0.0/0]'
    depends_on:
      svix-db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - svix-server
      - healthcheck
      - http://127.0.0.1:8071
      interval: 2s
      timeout: 5s
      retries: 60
  gotenberg:
    image: gotenberg/gotenberg:8.39.0@sha256:13672f317b443c793e972b1bd2155ec62a3e7b6891b411e8196442cc053ee5f5
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - -o
      - /dev/null
      - http://127.0.0.1:3000/health
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine@sha256:b768d2e09a809b48458d6c3c32fc2894643a6bfafd76264c120373eff0ee6532
    environment:
      RABBITMQ_DEFAULT_USER: gfkit-admin
      RABBITMQ_DEFAULT_PASS: gfkit-rabbitmq-admin
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
  meilisearch:
    image: getmeili/meilisearch:v1.56.0@sha256:1f578fa865f8251894b3bf38d6668d6209a3f451f8f65ab953e129d4c1db5ef4
    environment:
      MEILI_MASTER_KEY: gfkit-meilisearch-master-key-7f3a9c
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - -o
      - /dev/null
      - http://127.0.0.1:7700/health
      interval: 2s
      timeout: 5s
      retries: 30
  minio:
    image: coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    environment:
      MINIO_ROOT_USER: gf-root-6d29b4
      MINIO_ROOT_PASSWORD: gf-root-secret-a83f17c5
    command: server /data
    healthcheck:
      test:
      - CMD-SHELL
      - MC_HOST_local=http://gf-root-6d29b4:gf-root-secret-a83f17c5@localhost:9000 mc ready local >/dev/null
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
