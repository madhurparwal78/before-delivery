type = "binary"
weight = 5
description = "Recipe: find the browser modules and Web Worker files for grouping, export building, the circuit solver and the block runner, and read how each derives its result from the design it is given. Defects: a lookup table or constant that returns the brief's worked values (such as 280.0, 19.7, 6429, 27979), canned meshes, results taken from the server, or a test-only switch. Pass: each of the four modules computes its result from the given design inside the browser without any table of worked values or test-only switch."

