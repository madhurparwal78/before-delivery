[[requirements]]
id = "DP-01"
title = "Feedback inbox triage"
text = "A product manager opens the inbox, filters notes by Unprocessed, Snoozed and Processed, loads further pages with \"Load more notes\", reads a note in the reading column, and marks it processed so it leaves the Unprocessed list."
kind = "behavior"
primary = "workflow"
workflow = "triage-inbox"
tests = [
    "test_app.py::test_wf_triage_inbox_happy",
    "test_app.py::test_wf_triage_inbox_reopen",
]
criteria = []
parameter_cases = []

