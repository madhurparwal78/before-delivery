weight = 3
description = "Recipe: locate the objective fit and priority formula, its two-decimal rounding and the rank tie-break, then search server SQL, server TypeScript and client code for any second computation of them. A copy in the client, a parallel SQL and TypeScript version, or a copy in another handler counts as a fail, while showing an already-rounded API value with two decimals in the client or the CSV is formatting, not a second rounding; cite both locations as file:line. Pass: none of the priority formula, its rounding or the rank tie-break is computed in more than one place."

