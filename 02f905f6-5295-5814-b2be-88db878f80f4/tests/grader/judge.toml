description = "Recipe: trace quote, intake, drop-off, rate set, damage charge and payment code for money values. A money value held, accumulated or compared as a binary float fails, cite each as `file:line`; converting at the provider or display boundary does not fail. Pass: money is held as integer cents or exact decimals on every path, never as binary floating point."

[criterion.annotations]
