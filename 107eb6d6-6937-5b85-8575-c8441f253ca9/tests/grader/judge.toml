[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: `source`, start at the `serve` command in `run.json`, find where the PostgreSQL pool or client is created, then search the tree for `postgres://`, `postgresql://` and database passwords; the documented defaults of port 4173 and a 900-second lockout window are allowed and are not connection settings. Pass: the PostgreSQL client is created only from `process.env.DATABASE_URL` with no connection string or database password literal anywhere in source."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
