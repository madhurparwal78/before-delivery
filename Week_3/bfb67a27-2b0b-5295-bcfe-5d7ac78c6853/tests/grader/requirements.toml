[[requirements]]
id = "DP-01"
title = "Catalogue availability"
text = "The renter catalogue lists every kit on its rental sheet under its category and, once dates are set, shows on each sheet how many complete kits are free for those dates and their server-quoted hire price, as qualified in Business rules."
kind = "behavior"
primary = "workflow"
workflow = "browse-and-price"
tests = [
    "test_app.py::test_wf_browse_and_price_catalogue",
]
criteria = []
parameter_cases = []

