type = "binary"
weight = 5
description = "Recipe: Trace amounts from the price rows through quote, split, refund cap, proration display and formatting, on the server and in the browser. Search for `parseFloat`, `Number(`, `toFixed`, `Math.round` and arithmetic on amount values. Leave out the in-between frames of the counting quote numerals, which may step from the old figure to the new one with a float progress value as long as each frame is whole minor units and the last frame is the server's figure. Pass: every amount that is stored, sent, compared, summed or shown settled is held as an exact decimal or integer minor units end to end, so floating-point arithmetic or conversion that produces such an amount fails (cite it)."

