    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 81
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "minio", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Nightplan <nightplan@alder-lane.test>" } },
]

[criterion_weights]
B1 = 5
B2 = 3
B3 = 3
B4 = 5
B5 = 3
B6 = 5
B7 = 3
B8 = 3
B9 = 3
B10 = 3
B11 = 3
B12 = 3
