weight = 5
description = "Recipe: for each of these rules find its implementation, then search for a second copy: arithmetic with 48 for vesting, half-up rounding of cost, largest-remainder ownership, pro rata tender allocation, round scenario arithmetic, each grant and order state assignment, each comparison against a window end, offer expiry or tender close, and any status or remaining time that browser code decides from the device clock (the published countdown, `window_ends_at` or `closes_at` minus the latest server time received, is the one allowed browser calculation and is not a duplicate). Cite every duplicate as `file:line`. Pass: each listed rule is decided in exactly one function that every caller uses."

[criterion.annotations]
