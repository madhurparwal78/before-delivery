[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: 1. Read the server configuration module and every place the PostgreSQL pool and S3 client are built. 2. List every literal used as a value or fallback for DATABASE_URL and each S3_* setting. 3. The documented defaults APP_PUBLIC_PORT 4173 and PRESENCE_IDLE_SECONDS 60 are allowed, and so is a default for S3_REGION or S3_FORCE_PATH_STYLE. 4. Cite any literal access key, secret, endpoint, connection string or bucket name as file:line. Pass: no literal access key, secret, endpoint URL, connection string or bucket name is used as a value or fallback for DATABASE_URL or any S3_* setting."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-59",
]
evidence = "file_line"
cites = "L522, L528-L531, L59"

