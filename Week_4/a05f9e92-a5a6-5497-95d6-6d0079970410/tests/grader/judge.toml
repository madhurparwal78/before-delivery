weight = 3
description = "Recipe: 1. In `playwright` at 1280x800, signed out, open `/`. 2. Take a zoomed screenshot of the six portraits (the `img` elements named Mail portrait, Project files portrait, Payroll portrait, Remote access portrait, Printing portrait and Sign-in portrait). 3. Probe each tile's rendered width and height. A plain colour block, an emoji, a stock photograph or one tile repeated six times fails. Pass: each of the six portraits is an upright 2:3 tile drawn as a mosaic of simple glyph shapes on its own flat background."

