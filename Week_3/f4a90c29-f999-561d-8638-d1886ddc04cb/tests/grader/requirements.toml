[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "gotenberg-down"
port = 4174
url_env = "APP_GOTENBERG_DOWN_URL"

[outages.env]
GOTENBERG_URL = "http://127.0.0.1:9"

[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "gotenberg-returns"
port = 4176
url_env = "APP_GOTENBERG_RETURNS_URL"

[outages.env]
GOTENBERG_URL = "http://127.0.0.1:4190"

[[outages]]
id = "short-timers"
port = 4177
url_env = "APP_SHORT_URL"

[outages.env]
TRASH_RETENTION_SECONDS = "8"
SHARE_LINK_TTL_SECONDS = "8"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[outages]]
id = "fast-clock"
port = 4178
url_env = "APP_FAST_CLOCK_URL"

[outages.env]
CLOCK_START = "2027-03-08T00:00:00Z"
CLOCK_RATE = "3600"
DATABASE_URL = "${DATABASE_URL}_fast"
S3_BUCKET = "${S3_BUCKET}-fast"

[[outages]]
id = "reminder-clock"
port = 4179
url_env = "APP_REMINDER_CLOCK_URL"

[outages.env]
CLOCK_START = "2027-03-08T08:00:00Z"
CLOCK_RATE = "60"
DATABASE_URL = "${DATABASE_URL}_reminder"
S3_BUCKET = "${S3_BUCKET}-reminder"

[[requirements]]
id = "DP-01"
title = "Clock time kept."
text = "An event keeps its clock time in its own zone across every daylight change, and viewers in other zones see the instant shift only for the weeks the changes differ."
kind = "behavior"
primary = "pytest"
workflow = "time-zones-daylight"
tests = [
    "test_app.py::test_wf_time_zones_daylight_weekly_across_change",
    "test_app.py::test_wf_time_zones_daylight_keys_across_change",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Gaps and repeated hours."
text = "A local time that does not exist on a change day moves forward for that occurrence only, and a local time that happens twice uses the first, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "time-zones-daylight"
tests = [
    "test_app.py::test_wf_time_zones_daylight_gaps_and_repeats",
]
criteria = []
parameter_cases = []

