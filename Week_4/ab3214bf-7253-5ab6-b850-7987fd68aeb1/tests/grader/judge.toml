[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: open the settings module under `/app`, then search the source for every database, WireMock, Gotenberg and object-store setting and for literal keys, passwords, connection strings and provider URLs. Allowed defaults are port 4173, the public port override, the settlement clock start, the review seconds, the seeded demo password and firm keys generated at first serve. Cite each violation as `file:line`. Pass: every service credential and endpoint is read from the environment with no literal copy in the source."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L764, L762-L766"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: trace each provider call from where it is made to where its answer is stored or shown, covering holdings sync, cancellation request, confirmation polling, meter pull, corrections pull and grid-factor fetch. Search for fixtures, canned JSON, mock switches, default confirmations and fallback factors. Showing the published banner and leaving state unchanged on an unreachable provider is allowed. A hard-coded Confirmed status, a made-up `confirmed_at` or a default grid factor used after a failed call fails. Cite each defect as `file:line`. Pass: every registry, meter hub and grid-factor value the desk stores or shows is parsed from an HTTP response received at that call."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L795, L88, L660-L661"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: trace the seal path from signing through rendering, storing, reading back and digest comparison, then the PDF download route and the public statement check. Search for local PDF libraries, cached PDF bytes and a stored boolean standing in for the signature result. A locally generated PDF, a cached copy served instead of a fresh read or a hard-coded signature result fails. Cite each defect as `file:line`. Pass: `signature_valid` is computed from a verification over bytes read from the object store on that request."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L609, L616, L678"

[[criterion]]
id = "S4"
name = "S4"
type = "binary"
weight = 3
description = "Recipe: list every route the server registers and every environment flag or header the code reads. The served surface is graded by deterministic checks, so read only for test-only or fake-data switches. A debug route, a seed-reset route or a mock-provider flag fails. Cite each defect as `file:line`. Pass: no route, flag or header enables canned provider answers or bypasses sign-in or role checks."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L795, L88"

[[criterion]]
id = "Q1"
name = "Q1"
type = "binary"
weight = 3
description = "Recipe: open the application entry module, the largest backend module and the database access module, and read every function signature. A function with a missing parameter annotation or a missing return annotation is a defect, and so is a blanket `Any`. Cite each as `file:line`. Pass: every function signature in the sampled modules is fully type-annotated."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L789"

[[criterion]]
id = "Q2"
name = "Q2"
type = "binary"
weight = 3
description = "Recipe: read the names of modules, classes, functions and variables across the backend, searching for the terms window, lot, bundle, line, grain, merit order, ledger movement and seal and for their stand-ins. A generic name such as `item`, `record`, `data`, `manager`, `helper` or `utils` for a domain concept, or a synonym such as batch for bundle, period for window or resolution for grain, is a defect. Cite each as `file:line`. Pass: domain concepts carry the brief terms in their names throughout the sampled code."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L790"

[[criterion]]
id = "Q3"
name = "Q3"
type = "binary"
weight = 5
description = "Recipe: locate the window state transitions, the score computation, the gap-repair rule and the opinion decision, then search backend and browser code for a second copy of each by the state strings, the Qualified comparison, the seven-days-earlier lookup and the matched-over-consumed formula. A duplicated transition table, a second opinion test or a score computed in browser code is a defect. Cite each as `file:line`. Pass: each of those four rules is decided in exactly one place in the source."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L791, L251"

[[criterion]]
id = "Q4"
name = "Q4"
type = "binary"
weight = 3
description = "Recipe: search for abstract base classes, protocols, factories, registries and plugin hooks and count the implementations behind each. An interface with one class behind it is a defect. Cite each as `file:line`. Pass: no abstraction in the source has a single implementation."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L792"

[[criterion]]
id = "Q5"
name = "Q5"
type = "binary"
weight = 3
description = "Recipe: search the source for commented-out blocks, unused imports and functions, branches after a return or raise, None checks on values that cannot be None and `except` blocks that swallow errors. Cite each instance as `file:line`. Pass: the source holds no dead, commented-out or unreachable code."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L793"

[[criterion]]
id = "Q6"
name = "Q6"
type = "binary"
weight = 3
description = "Recipe: find the shared error type and handler, then search every route and handler for responses with status 400 or above built any other way, including the 404, 413, 422 and 503 paths. A hand-built error dict, a framework default error body or a second error class family is a defect. Cite each as `file:line`. Pass: every API error is produced through one shared builder emitting the published error shape."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L794, L406"

[[criterion]]
id = "Q7"
name = "Q7"
type = "binary"
weight = 5
description = "Recipe: search backend and browser code for `float(`, float literals, true division `/`, `round(`, `math.`, `Math.round`, `parseFloat` and `Number(` on values that are watt-hours, grams, basis points or target percents. Exact Decimal or integer arithmetic is allowed. A float conversion of a target percent, a `round(` call or a true division in a score or emission path is a defect. Cite each as `file:line`. Pass: no binary floating-point operation touches a watt-hour, gram or basis-point value."

[criterion.annotations]
