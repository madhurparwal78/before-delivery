description = "Recipe: trace the tier walk, line amounts, totals, pack price, refunds, invoice totals and Kill Bill amount conversion both ways, including the Kill Bill invoice amount read back for `billing_amount_cents`. Search for `parseFloat`, `toFixed` and dollar-valued arithmetic. Pass: every money computation and storage uses integer cents, with dollars produced only when formatting display strings, the CSV export or the billing payload, a Kill Bill dollar amount read back converted to integer cents once at that boundary (for example `Math.round(amount * 100)`), with any other floating-point dollar arithmetic failing cited as `file:line`."

