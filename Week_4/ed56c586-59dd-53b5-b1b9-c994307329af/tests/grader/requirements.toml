[[if_rules]]
id = "IF-01"
text = "`/app/run.json` exists, is valid JSON with string fields `install`, `build` and `serve` and `\"_schema\":\"run-manifest-v1\"`, and its commands install, build and serve the site."
tests = [
    "test_app.py::test_if_run_manifest",
]
parameter_cases = []

[[if_rules]]
id = "IF-02"
text = "`/app/THIRD_PARTY_NOTICES.md` lists every shipped package and the three font families (Fraunces, IBM Plex Sans, IBM Plex Mono), each with its licence. Shipped packages means the production dependency tree reported by `npm ls --omit=dev --all --json`."
tests = [
    "test_app.py::test_if_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Every shipped package uses the MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0 or 0BSD licence, and every font file uses the SIL Open Font License 1.1."
tests = [
    "test_app.py::test_if_licences",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "The site uses no datastore, broker, queue or service other than the provided mail server and media library, and no database, file-based ones included."
tests = [
    "test_app.py::test_if_no_datastore",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "The shipped packages contain no animation library, and no page loads a font, script, style, image or video from another origin."
tests = [
    "test_app.py::test_if_no_animation_library_same_origin",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "Every colour in the style sheets is written as a plain hexadecimal or red-green-blue value (alpha allowed), never as a colour-mixing or other colour function."
tests = [
    "test_app.py::test_if_plain_colours",
]
parameter_cases = []

[[if_rules]]
id = "IF-07"
text = "The provided service configuration and its development credentials stay unchanged."
tests = [
    "test_app.py::test_if_service_config",
]
parameter_cases = []

[[if_rules]]
id = "IF-08"
text = "All artwork is original and made for the site, and the covers and preview frames reach the media library only through the app's own storing at start or on recovery."
tests = [
    "test_app.py::test_if_original_media",
]
parameter_cases = []

