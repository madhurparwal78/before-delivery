[[requirements]]
id = "DP-01"
title = "Write log numbering"
text = "Each accepted source becomes exactly one write log entry with the next log sequence number of its database, in request order, starting at 1 and never reused or skipped, and ingesting an existing id creates its next version."
kind = "behavior"
primary = "pytest"
workflow = "write-log"
tests = [
    "test_app.py::test_wf_write_log_numbering",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Reads see pending writes"
text = "Every read sees every accepted write at once, folded or pending, and compaction never changes a search result, graph answer, relation or history list."
kind = "behavior"
primary = "pytest"
