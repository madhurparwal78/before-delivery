[task]
name = "greenfield/tidemark-planner"
version = "1.0.0"
description = "Tidemark Daybook, a subscription daily-planning workspace where members pull tasks into five ruled day columns, estimate them against a personal workload threshold shown as the Waterline gauge, timebox them onto a calendar strip and shut the day down with a digest email, backed by PostgreSQL, Kill Bill seat billing and SMTP mail."
authors = [
    { name = "Khushi Tyagi", email = "khushi.tyagi@ethara.ai" },
    { name = "Kaustubh Dalvi", email = "kaustubh.dalvi@ethara.ai" },
]
