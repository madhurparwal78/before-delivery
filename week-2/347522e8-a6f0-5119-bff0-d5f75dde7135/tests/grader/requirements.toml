[[if_rules]]
id = "IF-01"
text = "`/app/run.json` exists and contains exactly the keys `_schema`, `install`, `build` and `serve`, all strings, with `_schema` equal to `run-manifest-v1`."
tests = [
    "test_app.py::test_if_run_manifest",
]
parameter_cases = []

[[if_rules]]
id = "IF-02"
text = "`/app/THIRD_PARTY_NOTICES.md` lists every shipped package with its version and licence, plus each bundled font and icon set. Shipped packages are the production dependency tree reported by `npm ls --omit=dev --all --json`."
tests = [
    "test_app.py::test_if_third_party_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Every shipped package (as defined in IF-02), font and icon set is licensed under MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD or OFL-1.1."
tests = [
    "test_app.py::test_if_licences_allowed",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "App state lives only in the provided Postgres database, Kill Bill tenant and MinIO bucket. The app uses no other database, cache server, embedded datastore or state files on disk."
tests = [
    "test_app.py::test_if_no_extra_datastore",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "The provided service configuration (compose files and dev environment values) is left unchanged."
tests = [
    "test_app.py::test_if_service_config_untouched",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "Source is TypeScript with `\"strict\": true` in the TypeScript config."
tests = [
    "test_app.py::test_if_typescript_strict",
]
parameter_cases = []

[[if_rules]]
id = "IF-07"
text = "`package-lock.json` is committed and the `install` command installs from it."
tests = [
    "test_app.py::test_if_lockfile_install",
]
parameter_cases = []

