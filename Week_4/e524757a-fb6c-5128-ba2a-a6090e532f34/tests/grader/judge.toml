[judge]
judge = "codex"
model = "openai/gpt-5.6-sol"
version = "0.163.0"
cwd = "/judge-workspace"
timeout = 3600
mode = "batched"
samples = 3
guard = "penalize"
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "normal",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_press_key",
    "browser_resize",
    "browser_select_option",
    "browser_hover",
    "browser_drag",
    "browser_tabs",
    "browser_wait_for",
    "browser_mouse_wheel",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "reduced"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "reduced",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_press_key",
    "browser_resize",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "touch"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "touch",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_press_key",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "source"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "source-mcp",
]
allowed_tools = [
    "list_files",
    "read_file",
    "search_files",
]

[scoring]
aggregation = "weighted-mean"

[[criterion]]
id = "B1"
name = "B1"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800, signed out, open `/` and do not scroll. With `browser_evaluate` read the bounding boxes of the text `Walk softly`, of the right headline half and of the live viewfinder frame between them, which must contain a `canvas`. Then take a screenshot of the first screen. A flat image or an empty box in place of the canvas fails. Any content on the first screen beyond the header, the two headline halves and the viewfinder fails. Pass: the 16:9 viewfinder sits in one row between the left headline half and the right headline half and measures 30 to 40 percent of the viewport width."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-92",
]
evidence = "screenshot"
cites = "L122, L148, L330-L332"

[[criterion]]
id = "B2"
name = "B2"
type = "binary"
weight = 3
description = "Recipe: `playwright` at 1280x800, signed out, open `/`, scroll down until the first element carrying a `data-ui` attribute is in view and screenshot it, then scroll to the next two such elements and screenshot each. With `browser_evaluate` list the `[data-ui]` elements with their widths and whether each holds text or buttons rather than only an `img`. A fragment that is only a flat picture of an interface fails. A fragment wider than half the viewport fails. Pass: each of the first three `data-ui` fragments contains text or buttons in its DOM."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "important"
requirements = [
    "DP-92",
]
evidence = "screenshot"
cites = "L122, L148, L330"

[[criterion]]
id = "B3"
name = "B3"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800, signed in with the fresh judge account, open `/play?island=1&spot=2&gfx=full`, wait until `application \"World view\"` reports `data-state=\"ready\"`, read its `data-world-hour`, `data-weather` and `data-preset`, then screenshot the scene. The judge cannot move the clock, so grade only the hour and weather that are shown. A `data-state` of `still` or an unrendered scene fails. Pass: the sky and light colour suit the shown hour and weather: light near midday, dark after midnight, a warmer or dimmer tone at other hours, and grey allowed under rain."

[criterion.annotations]
channel = "experience"
