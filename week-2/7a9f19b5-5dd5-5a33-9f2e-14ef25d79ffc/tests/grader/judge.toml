description = "Recipe: Find the pool diameter, own lux and centre lux calculations used by the server (placements, comparison, fitting readout) and by the browser (fitting readout, room, light-pools table). A second implementation of the tan or cos-cubed formula on either side fails; cite each as file:line. Pass: one shared module defines the light-pool formula and both the server and the browser import it."

