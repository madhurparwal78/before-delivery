]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-06"
title = "Ciphertext-only sync"
text = "Every synced revision reaches the server as an encrypted envelope, so no vault-blobs object and no database row contains a note's title, alias, frontmatter or body text."
kind = "behavior"
primary = "pytest"
workflow = "field-sync"
tests = [
    "test_app.py::test_ciphertext_only_sync",
