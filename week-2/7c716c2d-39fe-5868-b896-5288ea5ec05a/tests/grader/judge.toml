[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: Start at the billing route handlers and the seat check, then trace the seat limit read, the raise and the scheduled reduction to their outbound Kill Bill HTTP calls. Storing the last confirmed limit, reporting it while Kill Bill is down and writing the seed limit into the seats field during registration are allowed. A local value that acts as the limit with no Kill Bill read behind it fails, and so does a raise counted before its read-back. Cite each call as file:line. Pass: Every seat limit the app enforces or counts, raises included, comes from a Kill Bill read of the subscription's seats field."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-59",
]
evidence = "file_line"
cites = "L142, L1000-L1009, L1017, L1179"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: Find where configuration is read at start, then search the server, browser and seed source for literal service hosts, usernames, passwords, API keys and access keys. Defaults the brief itself documents are allowed, such as the app port, the bind address, the timer defaults, the sender address and the seeded people's password. The provided service configuration and dev compose files are out of scope. Any other literal service credential or address fails, and so does any credential reaching browser code. Cite each as file:line. Pass: Every service credential exists only in the server's environment."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-59",
]
evidence = "file_line"
cites = "L142, L1102, L1112-L1119, L1130, L1158"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: Trace the outbox sender to its SMTP transport and the attachment upload, download and deletion queue to their S3 client calls. Read the routes for test-only endpoints. The outbox row itself is written before delivery by design and is not a defect. An in-process stand-in for mail or file storage fails, and so does a test-only route, an attachment row written before MinIO accepts its object, or an outbox message marked sent before SMTP accepts it. Cite each as file:line. Pass: Attachment rows and the outbox sent mark are each recorded only after a real provider client reports that MinIO or SMTP accepted the work."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-59",
]
evidence = "file_line"
cites = "L142, L908, L956, L958, L992, L1020, L1179"

[[criterion]]
id = "S4"
name = "S4"
type = "binary"
weight = 3
description = "Recipe: Read the startup path and the background jobs. Trace how the database connection, schema and seed, the Kill Bill catalog and account registration, the MinIO bucket and the mail sender recover when their dependency was unreachable at boot. A step attempted only once at start fails, and so does a path that exits the process or needs a restart. Cite each loop or retry as file:line. Pass: Running code retries each unreachable dependency until it returns and then applies its owed setup without a restart."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-59",
]
evidence = "file_line"
cites = "L142, L990, L998, L1001, L1135-L1142"

