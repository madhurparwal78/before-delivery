solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "minio", env = {} },
    { name = "gotenberg", env = {} },
    { name = "wiremock", env = {} },
]

[criterion_weights]
B1 = 5
B2 = 5
B3 = 3
B4 = 3
B5 = 3
B6 = 3
B7 = 5
B8 = 3
B9 = 3
B10 = 5
B11 = 3
B12 = 3
