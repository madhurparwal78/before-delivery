    "json_at_limit",
]

[[requirements]]
id = "DP-07"
title = "Idempotency keys"
text = "A repeated request with the same idempotency key and content returns the first success without repeating its effect, the same key with different content returns 409, a duplicate that arrives on any app copy while the first is still in progress returns 409 `idempotency_in_flight`, each key is scoped to its method and path, and no error answer is ever recorded against a key."
kind = "behavior"
primary = "pytest"
workflow = "capture"
tests = [
    "test_app.py::test_idempotency_replay_conflict_and_scope",
    "test_app.py::test_wf_capture_replay_in_flight_across_copies",
]
criteria = []
parameter_cases = []

