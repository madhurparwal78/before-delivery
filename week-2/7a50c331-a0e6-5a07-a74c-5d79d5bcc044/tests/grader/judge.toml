evidence = "file_line"
cites = "L718, L1527"

[[criterion]]
id = "Q4"
name = "Q4"
type = "binary"
weight = 5
description = "Recipe: read the code that decides the concurrency winners the brief lists, plus lsn assignment and idempotency keys. A threading or asyncio lock, a process-level dict or set, or an unlocked read-then-write deciding any of them counts as a defect. Pass: each listed winner is decided inside PostgreSQL by a row lock, a constraint, an advisory lock or a serializable transaction."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L1080-L1097, L1528"

[[criterion]]
