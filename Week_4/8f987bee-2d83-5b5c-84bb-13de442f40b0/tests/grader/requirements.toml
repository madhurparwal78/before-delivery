[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "db-down"
port = 4174
url_env = "APP_DB_DOWN_URL"

[outages.env]
DATABASE_URL = "postgresql://wayline:unreachable@127.0.0.1:9/wayline"

[[outages]]
id = "short-timers"
port = 4175
url_env = "APP_SHORT_URL"

[outages.env]
DATABASE_URL = "${DATABASE_URL}_short"
WAYLINE_IDEMPOTENCY_TTL_SECONDS = "6"
WAYLINE_INVITE_TTL_SECONDS = "3"
WAYLINE_LOCKOUT_SECONDS = "20"

