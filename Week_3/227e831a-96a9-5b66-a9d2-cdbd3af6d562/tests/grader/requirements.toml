[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "gotenberg-down"
port = 4174
url_env = "APP_GOTENBERG_DOWN_URL"

[outages.env]
GOTENBERG_URL = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_gotenberg_down"
S3_BUCKET = "${S3_BUCKET}-gotenberg-down"

[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_minio_down"

[[requirements]]
id = "DP-01"
title = "Closet ledger"
text = "The Closet page lists every active closet item with its name, category, weight in the hiker's display unit, units owned, ready photo and packed-in count, grouped in the published category order, with retired gear in its own section."
kind = "behavior"
primary = "pytest"
workflow = "closet-keeping"
tests = [
    "test_app.py::test_wf_closet_keeping_add_gear",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Empty closet"
text = "When the hiker owns no active gear, the Closet page shows the empty-closet copy from Feedback states with the Add gear and Import gear list actions."
kind = "behavior"
primary = "pytest"
workflow = "closet-keeping"
tests = [
    "test_app.py::test_wf_closet_keeping_empty",
]
criteria = []
parameter_cases = []

