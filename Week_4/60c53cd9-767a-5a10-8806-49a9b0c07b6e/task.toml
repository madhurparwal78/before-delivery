[task]
name = "gfkit/highwater-window-lens"
version = "1.0.0"
description = "Highwater Unit Finder for Orrin & Vale Developments: a pre-construction tower sales app where home buyers filter a live duotone WebGL tower, sweep a Window Lens to see each unit's real view, place refundable, price-locked, idempotent holds with server-decided lapse and re-hold cooldown, share private-data-free read-only hold links in Sydney sales-office time, and where a sales coordinator releases bands, versions prices, uploads byte-exact view photographs and withdraws units, all over Postgres, MinIO and Meilisearch with provider-confirmed state."
