[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server configuration module, then every place the server builds a PostgreSQL, MinIO, Kill Bill or SMTP client. Allowed literals are the documented defaults: port 4173, APP_PUBLIC_URL as localhost on the port, and the timer defaults. A fallback for a port, region or bucket name is allowed. Any hard-coded service credential (database, storage, billing or mail), service host or fallback service URL counts as a fail, cited as `file:line`. The seed accounts' passwords that the brief prints are allowed. Pass: every service URL and credential the server uses comes from a brief-named environment variable."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-43",
]
evidence = "file_line"
cites = "L74, L841-L850"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 3
description = "Recipe: trace what reaches the browser: the browser source with its build config (define or env injection), the app shell route, every `/api` response serializer, plus every logger call that receives config. Any bundled env secret, config echo endpoint or logged connection string counts as a fail, cited as `file:line`. Pass: no service URL, credential or env-derived secret reaches browser code, any route response or any log line."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-43",
]
evidence = "file_line"
cites = "L74, L850"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 5
description = "Recipe: read the browser encryption code from where a revision is queued to where it is pushed, then the pull path that decrypts it. A third-party or hand-rolled cipher, a fixed or reused IV, base64 or JSON passed off as encryption, a vault key not wrapped through PBKDF2-SHA-256, or encryption performed on the server counts as a fail, cited as `file:line`. Pass: browser note encryption uses Web Crypto AES-GCM with a fresh random IV for every revision."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-44",
]
evidence = "file_line"
cites = "L75, L591-L596"

[[criterion]]
id = "S4"
name = "S4"
type = "binary"
weight = 5
description = "Recipe: trace the vault creation, unlock and invite flows from the browser request bodies into the server handlers, then into the schema. Any request body, handler parameter, header, log line or table column holding the passphrase or the unwrapped key counts as a fail, cited as `file:line`. Pass: the server receives only the wrapped key envelope, never the raw vault key or vault passphrase."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-44",
]
evidence = "file_line"
cites = "L75, L595, L747"

[[criterion]]
id = "Q1"
name = "Q1"
type = "binary"
weight = 3
description = "Recipe: read the tsconfig files, then search server and browser source for `any`, `as any`, `@ts-ignore`, `@ts-expect-error` and untyped JSON passed through as domain data (add-on states, dossier states, revisions, envelopes, badge states). Strict mode off counts as a fail, as does each `any` on a domain value, cited as `file:line`. Pass: no domain value is typed as any under a strict compiler configuration."

[criterion.annotations]
channel = "quality"
