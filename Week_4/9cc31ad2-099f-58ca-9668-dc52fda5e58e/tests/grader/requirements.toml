text = "The server verifies only replay files inside the published bounds, rejects every other file with the invalid-inputs reason while keeping its bytes stored as submitted, and answers every finish request within the published time."
kind = "behavior"
primary = "pytest"
workflow = "verification"
tests = [
    "test_app.py::test_bounded_replay_files",
]
