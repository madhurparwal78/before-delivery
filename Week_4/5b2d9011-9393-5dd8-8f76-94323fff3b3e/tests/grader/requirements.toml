schema_version = 1
id_prefix = "DP"
mandatory_count = 60
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "session-and-title",
    "room-lobby",
    "siege-combat",
    "report-replay",
    "waves-and-boss",
    "downed-and-revive",
    "intermission-shop",
    "host-migration",
    "convoy-race",
    "night-schedule",
    "price-schedule",
    "night-signup",
    "pause-and-settings",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 78
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "valkey", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Holdfast Nights <nights@cinderlatch.example>" } },
]

[criterion_weights]
B1 = 3
B2 = 5
B3 = 5
B4 = 3
B5 = 3
B6 = 3
B7 = 3
B8 = 5
B9 = 3
B10 = 3
B11 = 3
B12 = 3
S1 = 5
S2 = 3
S3 = 3
Q1 = 3
Q2 = 3
Q3 = 5
Q4 = 5
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "valkey-down"
port = 4174
url_env = "APP_VALKEY_DOWN_URL"

[outages.env]
VALKEY_URL = "redis://127.0.0.1:9/0"
DATABASE_URL = "${DATABASE_URL}_valkeydown"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"
HOLDFAST_CLOCK_CONTROL = "on"
DATABASE_URL = "${DATABASE_URL}_maildown"

[[outages]]
id = "clock-control"
port = 4176
url_env = "APP_CLOCK_URL"

[outages.env]
HOLDFAST_CLOCK_CONTROL = "on"
DATABASE_URL = "${DATABASE_URL}_clock"

