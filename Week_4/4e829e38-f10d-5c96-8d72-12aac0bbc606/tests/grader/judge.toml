weight = 3
description = "Recipe: read the route handlers, the rule engine and the list and board handlers for null checks, try/catch blocks and fallbacks that guard states the design rules out, such as a task with no section or a session already checked by earlier middleware. Cite each as `file:line`. Pass: no check guards a state that the published design makes impossible."

