[[requirements]]
id = "DP-01"
title = "Sign in and accept an invitation"
text = "A member signs in with email and password, recovers from a wrong password on the same screen and signs out, and an invitee joins from the emailed link, as described in Feedback states."
kind = "behavior"
primary = "workflow"
workflow = "workspace-access"
tests = [
    "test_app.py::test_wf_workspace_access_sign_in",
    "test_app.py::test_wf_workspace_access_join",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Members, roles and approval limits"
text = "The studio director invites members, changes roles and approval limits and removes members, and any other role calling those member actions gets 403."
kind = "behavior"
primary = "pytest"
workflow = "workspace-access"
tests = [
    "test_app.py::test_member_admin",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Role-shaped responses"
text = "The member directory returns only the fields published for the caller's role, so contractors and client approvers never receive other members' emails or phones."
kind = "behavior"
primary = "pytest"
workflow = "workspace-access"
tests = [
    "test_app.py::test_member_projection",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Brand and company scoping"
text = "A client approver or contractor who asks for a project outside their brand or company, or for a sheet, tender, variation or certificate inside one, gets the same 404 as for a record that does not exist."
kind = "behavior"
primary = "pytest"
workflow = "workspace-access"
tests = [
    "test_app.py::test_scoping",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-05"
title = "Stage gate sequence"
text = "Stages run Groundwork to Aftercare in order, each fee-bearing stage moves from requested to signed off or returned, and every illegal step is refused with 409."
kind = "behavior"
primary = "pytest"
workflow = "stage-gates"
tests = [
    "test_app.py::test_stage_sequence",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-06"
title = "Sign-off is one record, one invoice, one receipt"
text = "A client approver's sign-off records the sign-off, raises exactly one Kill Bill invoice for the stage fee and sends exactly one receipt with no internal notes. When Kill Bill is unreachable it does none of these and answers 503."
kind = "behavior"
primary = "pytest"
workflow = "stage-gates"
tests = [
    "test_app.py::test_sign_off_effects",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-07"
title = "One approver wins a sign-off race"
text = "When approvers sign the same stage off at once, exactly one succeeds and every other gets 409 naming who signed and when."
kind = "behavior"
primary = "pytest"
workflow = "stage-gates"
tests = [
    "test_app.py::test_sign_off_race",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-08"
title = "Stage sign-off by keyboard and phone"
text = "A project lead requests a stage and a client approver signs it off by keyboard alone, with the published focus targets and announced copy. An approver who loses a sign-off race or meets a billing outage sees that copy, and the stage panel works as a bottom sheet at 375x812. Every screen and dialog in this journey passes the automated WCAG 2.2 AA audit."
kind = "behavior"
primary = "workflow"
workflow = "stage-gates"
tests = [
    "test_app.py::test_wf_stage_gates_keyboard_sign_off",
    "test_app.py::test_wf_stage_gates_lost_race",
    "test_app.py::test_wf_stage_gates_billing_outage_phone",
]
criteria = []
parameter_cases = []

