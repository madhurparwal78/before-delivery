id = "DP-05"
title = "Unauthenticated and revoked tokens"
text = "A missing, forged or logged-out token is refused with 401 unauthorized, a wrong password with 401 invalid_credentials, and logout revokes the presented token."
kind = "behavior"
primary = "pytest"
workflow = "access"
tests = [
