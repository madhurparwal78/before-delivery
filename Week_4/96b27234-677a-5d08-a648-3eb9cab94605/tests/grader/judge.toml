description = "Recipe: (1) In `reduced` at 1280x800, sign in as invented seed person Wren Okafor and open the Quilt Loft room hosted by her from `/sessions`. (2) Hold the page's long timers with `browser_evaluate` running `() => window.__JUDGE_HOLD_TIMERS__('hold')`, so the 2-second outline is still there when you look. (3) Type a message with a unique text such as `ripple-check-<random>` into `textbox \"Say something nearby\"` and press Enter. (4) Confirm `region \"Room\"` reads `data-ripple=\"outline\"`, then screenshot the canvas. (5) Release the timers with `() => window.__JUDGE_HOLD_TIMERS__('release')`. Pass: floor tiles tinted or outlined in muted teal (green-blue hue, mid lightness) form a square centred on the speaker's tile that reaches the full chat distance on each side and is clipped at the room's edge."

