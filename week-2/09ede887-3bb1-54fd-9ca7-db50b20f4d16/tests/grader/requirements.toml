text = "Sign-in answers an unknown email and a wrong password with the same status, byte-identical body, the same header names, comparable timing and the same throttle, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "accounts"
tests = [
    "test_app.py::test_signin_does_not_disclose_accounts",
