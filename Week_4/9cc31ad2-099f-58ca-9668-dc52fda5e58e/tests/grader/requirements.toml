[[requirements]]
id = "DP-49"
title = "Paused and restarted races keep their state"
text = "While the Paused dialog is open nothing in the race, the ghost or the HUD advances, and after a restart no timer or request from the abandoned run changes the page or submits a finish."
kind = "behavior"
primary = "pytest"
workflow = "time-trial-ghost"
tests = [
    "test_app.py::test_wf_time_trial_ghost_pause",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-50"
title = "League totals stay true under concurrency"
text = "A league total always equals the sum of its event bests, and completion, unlocks and the finals reward happen exactly once and reach open pages without a reload, even when the runs that cross 50 points verify at the same moment."
kind = "behavior"
primary = "pytest"
workflow = "championship"
tests = [
    "test_app.py::test_wf_championship_concurrent_completion",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-51"
title = "Unconfirmed purchase"
text = "A purchase whose response never arrives leaves pips, stats, PI and balance unchanged with the published unconfirmed copy, Check again resends the same idempotency key and bytes so the purchase charges at most once and plays at most one sweep, and any answer other than success or insufficient coins closes the dialog and shows the committed garage, as qualified in Interactions."
kind = "behavior"
primary = "pytest"
workflow = "upgrade-purchase"
tests = [
    "test_app.py::test_wf_upgrade_purchase_unconfirmed",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-52"
title = "Interrupted sweep"
text = "A purchase confirmed, a car or reference map change, or leaving the garage while a sweep plays makes that sweep jump to its end state at once, and nothing from the ended sweep changes the page afterwards."
kind = "behavior"
primary = "pytest"
workflow = "reference-sweep"
tests = [
    "test_app.py::test_wf_reference_sweep_interrupted",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-53"
title = "Latest board filter wins"
text = "Only the board for the newest filters may render, any response for earlier filters is discarded, and a live push changes only the board on screen when it matches that board."
kind = "behavior"
primary = "pytest"
workflow = "leaderboards"
tests = [
    "test_app.py::test_wf_leaderboards_latest_filter",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-54"
title = "Runs and pushes stay with their player"
text = "Runs from different players that verify at the same moment each use only their own run's car, stages, layout, seed and inputs, and balance, run and championship pushes reach only the connections of the player they concern."
kind = "behavior"
primary = "pytest"
workflow = "verification"
tests = [
    "test_app.py::test_wf_verification_isolation",
]
criteria = []
parameter_cases = []

