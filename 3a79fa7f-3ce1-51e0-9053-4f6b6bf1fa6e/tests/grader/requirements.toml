[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"
MAILPIT_URL = "http://127.0.0.1:9"

[[requirements]]
id = "DP-01"
title = "Quiz scores and tie break."
text = "POST /api/match scores exactly five answers from the points table, picks the winner with the published tie break and two reasons, stores the result for GET /api/match/<id>, and refuses a wrong count or an unknown key with 422 validation_error."
kind = "behavior"
primary = "pytest"
workflow = "rider-match-build-save"
tests = [
    "test_app.py::test_match_scoring_and_storage",
]
criteria = []
parameter_cases = []

