    "S4",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 77
services = [
    { name = "postgres", env = {} },
    { name = "minio", env = {} },
    { name = "killbill", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Kerf Frequencies <tickets@kerf.example>" } },
]

[criterion_weights]
B1 = 3
B2 = 3
B3 = 3
B4 = 3
B5 = 5
B6 = 3
B7 = 3
B8 = 3
B9 = 3
B10 = 3
B11 = 3
B12 = 3
S1 = 5
S2 = 3
S3 = 5
S4 = 3
Q1 = 3
Q2 = 3
Q3 = 5
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"
MAILPIT_URL = "http://127.0.0.1:9"

[[outages]]
id = "minio-down"
port = 4176
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[requirements]]
id = "DP-01"
title = "Run manifest and health check"
text = "The app ships the run manifest described in Deployment and answers the health check stated there, including while Kill Bill, Mailpit or MinIO is down."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_health_on_every_instance",
]
criteria = []
parameter_cases = []

