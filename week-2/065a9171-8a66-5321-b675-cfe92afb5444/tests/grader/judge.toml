importance = "important"
requirements = []
evidence = "file_line"
cites = "L836, L837"

[[criterion]]
id = "Q7"
name = "Q7"
type = "binary"
weight = 3
description = "Recipe: list every API route and SPA route in the source and compare them with the brief's endpoint and screen tables. Then skim module, class and function names for the domain terms floor, shortfall, gap, cover, punch, attendance, missed clock-out, accrual, ledger, pay period, sick-covered and fit note. Names the brief itself uses (such as ghost slot, or record for an attendance or sickness record) are allowed. An extra endpoint or screen is a defect. So is a domain concept named with a generic substitute the brief never uses (for example 'doc' for fit note, 'entry' for punch, 'deficit' for shortfall). Pass: the routes match the brief with domain concepts named in its terms, cited as file:line."

