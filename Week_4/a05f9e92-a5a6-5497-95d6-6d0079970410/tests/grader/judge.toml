[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the configuration module and the server entry point, then search all source (not lockfiles) for the literals `postgres://`, `http://`, `https://`, `minio`, access-key-like strings and `switchyard-grading-local`, and check that no client source imports server configuration. Allowed literals are only the brief's documented defaults (port 4173, the setting defaults including the grading key and Europe/Berlin) and the seeded user passwords. A fallback literal for the database URL, the storage endpoint, the region, the bucket or the storage keys fails. Cite each defect as `file:line`. Pass: the database URL, storage endpoint, region, bucket, storage keys and grading key are read only from environment variables, with only the brief's documented defaults and seed passwords as literals."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-11",
]
evidence = "file_line"
cites = "L70, L1538-L1551, L1577"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: open the expression module (tokenizer, parser, interpreter) and trace how business rule conditions, SLA start, pause and stop conditions, assignment rules, form policies, workflow conditions and filter text reach it. Search the whole source for `eval(`, `new Function`, `Function(`, `vm.` and `import(` with a variable argument. A filter turned into SQL by concatenating user text also fails. Cite each defect as `file:line`. Pass: every condition is tokenised, parsed into a tree and interpreted from that tree through one module, with no path that turns user text into executable code."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-11",
]
evidence = "file_line"
cites = "L70, L823-L844, L1598, L1606"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: find where SLA percent and remaining seconds, impact and people totals, the risk score, vote tallies, group counts and dashboard aggregates are computed on the server, then read the client sources for the same formulas (floor of elapsed times 100 over target, impact traversal, risk weights, tally arithmetic, group count loops). The brief allows the browser only to add its monotonic elapsed delta to the last server SLA values and to re-apply form policies. Cite each client-side recomputation as `file:line`. Pass: no client source recomputes an SLA percent, impact total, risk score, vote tally, group count or dashboard aggregate."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
