[[requirements]]
id = "DP-01"
title = "Member sign-in"
text = "A seeded member signs in with email and password and gets a session cookie, and every endpoint except health refuses requests without a session, as specified in API."
kind = "behavior"
primary = "pytest"
workflow = "first-run"
tests = [
    "test_app.py::test_sign_in_issues_session_cookie",
    "test_app.py::test_endpoints_refuse_without_session",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Exact sample product"
text = "On first boot against an empty database the workspace holds exactly the records in Seed data and nothing else, with every seeded part that has extrudes Stored and its body object present once storage confirms the boot write, and the Switch Cover reading No body."
kind = "behavior"
primary = "pytest"
workflow = "first-run"
tests = [
    "test_app.py::test_seed_records_exact",
]
criteria = []
parameter_cases = []

