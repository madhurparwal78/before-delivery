description = "Recipe: `playwright` at 1280x800. 1. Open `/` and read the computed font-family, font-weight and font-size of the level-1 hero heading. 2. Run `document.fonts.check` with that exact weight and size for `Inter`. 3. Repeat steps 1 and 2 for a session title heading on `/agenda`. 4. Read the network requests for font files. 5. Screenshot both texts. Pass: both texts resolve to a loaded Inter face whose font file was requested from `http://127.0.0.1:4173`."

