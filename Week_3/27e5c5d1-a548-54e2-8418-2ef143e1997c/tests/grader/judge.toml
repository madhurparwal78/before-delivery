evidence = "file_line"
cites = "L919"

[[criterion]]
id = "Q2"
name = "Q2"
type = "binary"
weight = 5
description = "Recipe: 1. For each rule find where it is decided: effective board access, card status edges, the stale-version check, rank placement, response shaping per role, the published request keys, due state, the last-admin guard, the safe return-path check, the open-card count, the attachment content check and the download file-name header. 2. Search for a second implementation of each, such as a copied status table, a repeated role predicate, a second query for the open count or a second path check. 3. Cite both locations of every duplicate as file:line. Pass: each listed rule is decided in exactly one place in the source."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L920"

[[criterion]]
id = "Q3"
name = "Q3"
type = "binary"
weight = 3
description = "Recipe: 1. Find the module that builds error responses and compare its shapes with the error catalogue. 2. Search every route and middleware for status codes sent with an inline error body. 3. Cite each hit as file:line. Pass: every error response is built by the one error module."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L921"

[[criterion]]
id = "Q4"
name = "Q4"
type = "binary"
weight = 3
description = "Recipe: 1. Find every code path that adds, re-roles or removes workspace or board members, changes board visibility or changes a card's private members. 2. For each, read whether the permission-log insert runs inside the same database transaction as the change. 3. Search the whole source for UPDATE or DELETE statements and ORM calls that touch the permission-log table. Cite each defect as file:line. Pass: no code path touches a permission-log row except the insert that runs in its change's own database transaction."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L922"

[[criterion]]
