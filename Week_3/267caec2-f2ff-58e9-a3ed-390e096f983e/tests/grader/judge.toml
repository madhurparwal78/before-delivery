description = "Recipe: trace the submit and withdraw handlers into the billing code, following account creation, the external-charge invoice, the PURCHASE payment and the REFUND. A stub, mock, feature flag or code path that records a payment or refund without a Kill Bill response fails; cite it as `file:line`. Pass: every paid or refunded entry state is written only after a successful HTTP response from the configured Kill Bill."

[criterion.annotations]
