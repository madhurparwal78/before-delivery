type = "binary"
weight = 3
description = "Recipe: Read the Kill Bill client and trace how every outgoing request (account, authorise, capture, refund, invoice, payment) builds its base URL and headers. A request that skips tenant headers, uses literal credentials, or a code path that returns a made-up Kill Bill result instead of calling it fails; cite each as file:line. Pass: every Kill Bill request is sent to the environment-loaded base URL with tenant and auth headers built from environment-loaded values."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L574-L581, L713"

[[criterion]]
