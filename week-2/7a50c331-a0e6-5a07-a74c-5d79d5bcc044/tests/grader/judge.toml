[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the route registration and every code path that inserts into `members` or `organizations`, including page form handlers. A sign-up page, route or form handler counts as a defect, as does any anonymous path that creates a member. Pass: rows enter those tables only through the idempotent seed or the owner-gated member-add handler."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-68",
]
evidence = "file_line"
cites = "L19, L49, L176, L1509"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: trace every write to the `facts` table from the ingest handler, the import handler, restore and the seed. Code that derives any fact field from a source title or text counts as a defect. Pass: every inserted fact takes all its fields from a declared fact in a request, an import document or the seed list."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
