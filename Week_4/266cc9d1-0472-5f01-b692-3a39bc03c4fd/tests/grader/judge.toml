description = "Recipe: search the source for interfaces or abstract classes with exactly one implementation, wrappers that only forward to one target, commented-out code blocks, unused exports and unreachable branches. Cite each instance as `file:line`. Pass: the source holds no single-implementation abstraction, forwarding-only wrapper, commented-out block, unused export or unreachable branch."

[criterion.annotations]
channel = "quality"
