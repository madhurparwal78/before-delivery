id = "B4"
name = "B4"
type = "binary"
weight = 3
description = "Recipe: `playwright` at 1280x800, open `/`, poll until the gate buttons appear, press \"Begin in silence\". 1) Sample the level-1 hero heading (or one of its letter elements if the title is split), one level-2 chapter heading and `timer \"Story clock\"`. 2) For each, read the computed font-family and take its first family name. 3) With `browser_evaluate`, first await `document.fonts.ready`, then iterate `document.fonts` and look for at least one FontFace whose family matches that first name, ignoring case and quotes, and whose `status` is `loaded`. The family may be registered under any name, such as `Fraunces`, `Fraunces Variable` or an alias, as long as that face's family name or source file identifies Fraunces. The loaded face's weight and style need not match the sample's, because the browser renders with the nearest loaded weight and style of that family. Do not rely on `document.fonts.check` alone, because it reports true for a family with no registered face. 4) Screenshot the hero. A Fraunces name in CSS with no loaded Fraunces face behind it fails. Pass: each of the three display samples' first computed family resolves to at least one loaded Fraunces face."

