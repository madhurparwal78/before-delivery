name = "S4"
type = "binary"
weight = 3
description = "Recipe: read the billing status machine and the Kill Bill client. Trace checkout, Approve payment, the settler and the background check to their real HTTP calls to Kill Bill (accounts, tags, subscriptions, invoices, payments), and trace every assignment of an active status to a server or a paid state to a purchase. Cite each as `file:line`; a stubbed or canned provider response, or a status set from a client action, redirect or query string, fails. Pass: every assignment of an active or paid state follows a balance or payment read back from Kill Bill in the same code path."

