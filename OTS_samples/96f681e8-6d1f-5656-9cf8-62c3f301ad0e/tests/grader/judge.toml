type = "binary"
weight = 3
description = "Recipe: list the names of the main types, functions, constants and schema columns for each brief term: hold, guarantee, guarantee refresh, final capture, share, settlement, covered, owed void, open match, place reservation, cut-off, grace time, credit, late capture, notice, lesson series, pricing version, effective date, saved by. Each competing synonym for one of these terms is a defect, cited as `file:line`. Pass: each brief term is the name used in the code for the thing it describes."

[criterion.annotations]
