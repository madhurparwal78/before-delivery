[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_STORAGE_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "pocketbase-down"
port = 4175
url_env = "APP_DIRECTORY_DOWN_URL"

[outages.env]
POCKETBASE_URL = "http://127.0.0.1:9"

[[outages]]
id = "clock-control"
port = 4176
url_env = "APP_CLOCK_URL"

[outages.env]
LINTEL_CLOCK_CONTROL = "on"
DATABASE_URL = "${DATABASE_URL}_clock"
S3_BUCKET = "${S3_BUCKET}-clock"

[[requirements]]
