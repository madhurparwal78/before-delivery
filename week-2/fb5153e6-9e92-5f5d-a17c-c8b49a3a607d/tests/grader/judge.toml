[[criterion]]
id = "Q3"
name = "Q3"
type = "binary"
weight = 5
description = "Recipe: for each of legal state moves, plan entitlements, the money computation and rounding, the within-plan ranking, idempotent replay, the edition claim and the visibility filter for derived surfaces, find the code that decides it and search for a second place that re-decides it (a duplicated edge table, a second rounding expression, a second plan-limit table, a second visibility predicate). A client reading a value the server already decided is not a second copy. Pass: each of the seven rules has exactly one deciding implementation that every caller uses."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L937"

[[criterion]]
