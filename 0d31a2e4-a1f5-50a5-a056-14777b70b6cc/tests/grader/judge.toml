id = "B2"
name = "B2"
type = "binary"
weight = 3
description = "Recipe: `playwright` at 1280x800. 1. Sign in at `/signin` as the invented seed player pip_bounce. 2. On `/`, wait for `list \"Friends\"` to show juniper_jolt. 3. Zoom the screenshot on the friend handles in `complementary \"Friends\"`. Pure black, mid grey or blue-link text fails. Pass: the friend handle text is a deep violet-navy of low lightness in a blue-violet hue."

[criterion.annotations]
channel = "experience"
