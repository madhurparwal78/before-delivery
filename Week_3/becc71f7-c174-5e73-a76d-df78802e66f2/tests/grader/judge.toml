description = "Recipe: `playwright` at 1280x800. 1. Open `/`, click a card's description link to reach its public piece page. 2. Read with `browser_evaluate` the computed font-family, font-weight and font-style of the level-1 heading and of the brand line or a body paragraph. 3. Run `document.fonts.check` for each, using that element's own weight and style with the first family its computed font-family lists, where a registered name with an added `Variable` or build-hash suffix stands for the same family. 4. Screenshot. Pass: the heading renders in a loaded Familjen Grotesk face and the body text in a loaded Hanken Grotesk face, with no Inter in either computed stack."

