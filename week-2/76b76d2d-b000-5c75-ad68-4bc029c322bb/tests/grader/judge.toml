[[criterion]]
id = "B6"
name = "B6"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800. 1) Open `/en/?season=cinema-direct`. 2) Probe the level-2 season heading's computed `font-family`, `font-weight` and `font-style`. 3) List the faces in `document.fonts` whose family is the heading's first computed family name as the page registers it, with each face's weight, style and `status`, and find that family's font file in `document.styleSheets` where shown. 4) Take a screenshot of the title. The brief names a typeface, not a CSS family string, so a self-hosted face registered under an alias such as `InstrumentSerif` or `Instrument Serif Variable` counts when its family name or font file names Instrument Serif. Instrument Serif comes in a regular weight only, so a heading whose computed weight is heavier, drawn by the browser as a synthesised bold of a loaded Instrument Serif face, counts too. Pass: the season title's first computed family is a loaded Instrument Serif face under any alias, at a weight the face ships or as its synthesised bold."

