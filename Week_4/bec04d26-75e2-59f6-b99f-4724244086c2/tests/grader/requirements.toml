[[requirements]]
id = "DP-01"
title = "Practice sign-up and sign-in."
text = "A bookkeeper creates a practice at `/sign-up`, which starts with the six-state catalogue from Seed data, and anyone with an account signs in at `/sign-in` and lands on their role's home screen."
kind = "behavior"
primary = "workflow"
workflow = "registration_setup"
tests = [
    "test_app.py::test_wf_registration_setup_signup",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
