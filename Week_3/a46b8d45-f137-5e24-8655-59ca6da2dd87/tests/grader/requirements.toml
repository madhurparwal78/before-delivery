[[requirements]]
id = "DP-01"
title = "Start a claim without an account"
text = "From a phone with no account, the owner fills in the claim form, picks the model and the broken or missing part on the fitting fan, adds 1 to 4 damage photos, presses Start claim and the address bar moves to the claim's sent page."
kind = "behavior"
primary = "workflow"
workflow = "claim-start"
tests = [
    "test_app.py::test_wf_claim_start_happy",
    "test_app.py::test_claim_form_breakpoints",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Damage photos judged by their bytes"
text = "Each photo is accepted or refused only by its leading bytes and its size, with the edges in Business rules, and every refused file is named in its published message in the owner's language."
kind = "behavior"
primary = "pytest"
workflow = "claim-start"
tests = [
    "test_app.py::test_photo_bytes_rules",
    "test_app.py::test_wf_claim_start_photo_refusal",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "All-or-nothing claim start"
text = "A claim start stores the claim row, every photo and the reference together, or stores none of them, including when storage, mail or the claim records fail partway."
kind = "behavior"
primary = "pytest"
workflow = "claim-start"
tests = [
    "test_app.py::test_claim_start_all_or_nothing",
    "test_app.py::test_wf_claim_start_minio_outage",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Carriage estimate while claiming"
text = "The claim form's carriage estimate comes only from the carrier's answer and shows the published state for a slow, failing or malformed answer without stopping the claim."
kind = "behavior"
primary = "pytest"
workflow = "claim-start"
tests = [
    "test_app.py::test_carriage_estimate",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-05"
title = "Confirmation email"
text = "Within 10 seconds of a claim start, Mailpit holds one message to the owner with the published subject, a one-time confirmation link and the link's closing time as the server set it."
kind = "behavior"
primary = "pytest"
workflow = "claim-start"
tests = [
    "test_app.py::test_confirmation_email",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-06"
title = "Confirm from the email"
text = "Opening the emailed link and pressing Confirm my claim confirms the claim and moves the address bar to its share page, which shows the same state after a cold reload."
kind = "behavior"
primary = "workflow"
workflow = "confirm-claim"
tests = [
    "test_app.py::test_wf_confirm_claim_happy",
    "test_app.py::test_wf_confirm_claim_records_outage",
    "test_app.py::test_wf_confirm_claim_polish",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-07"
title = "Confirmation link edges"
text = "The server accepts a confirmation link up to one second before its closing instant and refuses it at and after that instant, on a second use, and at once when the link lifetime setting is zero, each with its published status and message."
kind = "behavior"
primary = "pytest"
workflow = "confirm-claim"
tests = [
    "test_app.py::test_confirm_link_edges",
    "test_app.py::test_wf_confirm_claim_lapsed_edge",
    "test_app.py::test_wf_confirm_claim_zero_ttl",
    "test_app.py::test_wf_confirm_claim_reused_link",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-08"
title = "Operator sign-in"
text = "The seeded operator signs in and lands on the claim queue, and every operator page and endpoint refuses a caller without a live session, with the session edges in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "identify-and-rule"
tests = [
    "test_app.py::test_operator_sign_in",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-09"
title = "Identify the claimed part"
text = "The operator opens a confirmed claim, selects the part on the fitting fan, sets the quantity, presses Identify part and the address bar moves to the claim's quote stage with the ruling and deciding edition on the claim slip."
kind = "behavior"
primary = "workflow"
workflow = "identify-and-rule"
tests = [
    "test_app.py::test_wf_identify_and_rule_happy",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-10"
title = "Aftercare term"
text = "The server rules a claim inside aftercare only when its confirmation instant is before the end of the term worked out from the purchase date, club membership and the deciding edition, with the edges and zero settings in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "identify-and-rule"
tests = [
    "test_app.py::test_aftercare_term",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-11"
title = "Workshop business day"
text = "Every purchase date, term end, edition start, working day and dispatch cut-off is counted on the Europe/London calendar, never on UTC or the owner's device."
kind = "behavior"
primary = "pytest"
workflow = "identify-and-rule"
tests = [
    "test_app.py::test_london_business_day",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-12"
title = "Clock-change Sundays"
text = "A claim confirmed on a day when Europe/London gains or loses an hour, or whose term ends on such a day, is ruled once under the published local-date rule."
kind = "behavior"
primary = "pytest"
workflow = "identify-and-rule"
tests = [
    "test_app.py::test_clock_change_sundays",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-13"
title = "Deciding edition"
text = "Each identified claim is ruled by the one edition in force at its confirmation instant, stores that edition's code, and shows it on every surface."
kind = "behavior"
primary = "pytest"
workflow = "identify-and-rule"
tests = [
