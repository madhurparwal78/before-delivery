description = "Recipe: Read the event stream handler, the download handler and each transaction helper, following every exit path including client abort, then search module scope for request-specific state. A shared connection pool, and a registry of open streams that drops each entry on close, are allowed. A session, listener or transaction left open on any path fails, and so does per-request state in module or process scope; cite each as file:line. Pass: No stream, transaction, database session or per-request state outlives its request on any exit path."

