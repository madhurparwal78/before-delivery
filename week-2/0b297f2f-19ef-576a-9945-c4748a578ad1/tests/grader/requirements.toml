[services.env]

[[services]]
name = "mailpit"

[services.env]
MAIL_FROM = "Ashgrove Museum previews <previews@ashgrove-museum.example>"

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_IMAGE_STORE_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_imgdown"
PREVIEW_PUBLISH_DELAY_SECONDS = "20"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAIL_RELAY_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"
DATABASE_URL = "${DATABASE_URL}_maildown"
S3_BUCKET = "${S3_BUCKET}-maildown"
PREVIEW_PUBLISH_DELAY_SECONDS = "20"

[[outages]]
id = "postgres-down"
port = 4176
url_env = "APP_DATABASE_DOWN_URL"

[outages.env]
DATABASE_URL = "postgresql://gf_app:unreachable@127.0.0.1:9/hangline"

[[outages]]
id = "fast-publish"
port = 4177
url_env = "APP_FAST_PUBLISH_URL"

[outages.env]
PREVIEW_PUBLISH_DELAY_SECONDS = "30"
DATABASE_URL = "${DATABASE_URL}_fastpub"
S3_BUCKET = "${S3_BUCKET}-fastpub"

[[requirements]]
id = "DP-01"
title = "Place a work on a wall"
text = "A curator places an unplaced object on a wall with `POST /api/placements` and gets `201` with the stored placement in millimetres, its planned lux, planned lux-hours and lux status, as defined in API."
kind = "behavior"
primary = "pytest"
workflow = "place-work"
tests = [
    "test_app.py::test_place_work_api",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Hang geometry rules"
text = "A placement or move is saved only when it passes the hang rules in Business rules (whole work on the wall, on the centre line or marked as an exception, clear of neighbours), and each rejection returns its published reason."
kind = "behavior"
primary = "pytest"
workflow = "place-work"
tests = [
    "test_app.py::test_hang_rules",
]
criteria = []
parameter_cases = [
    "off_wall",
    "off_centre_line",
    "too_close",
    "gap_exactly_200",
    "exception_off_line",
    "move_off_wall",
]

[[requirements]]
id = "DP-03"
title = "Light limit gates placement"
text = "A curator cannot place or move a work onto a wall lit above the work's lux limit; the server rejects it with the too-bright reason."
kind = "behavior"
primary = "pytest"
workflow = "place-work"
tests = [
    "test_app.py::test_light_limit_gates_placement",
]
criteria = []
parameter_cases = []

