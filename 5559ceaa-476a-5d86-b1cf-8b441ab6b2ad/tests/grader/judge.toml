description = "Recipe: locate where session transitions, the baton version check, the write rule and the revision check are decided, then search HTTP routes, socket handlers, restore, undo and import code for any re-implementation of them. A second inline copy of any of them counts as a fail; cite both places as `file:line`. Pass: each of those four rules is decided in exactly one function or module that every HTTP or socket path calls."

