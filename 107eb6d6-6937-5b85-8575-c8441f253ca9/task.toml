[task]
name = "gigfreight/tour-freight-desk"
version = "1.0.0"
description = "The dispatch desk of an entertainment trucking crew. Tour managers submit three-step logistics requests with four ordered stops, dispatchers assign trucks from one shared fleet and confirm or decline with a note, and admins run truck maintenance and member roles, with every count, state and permission decided on the server from PostgreSQL rows under simultaneous writes and stale pages."
authors = [
    { name = "Adhya Agarwal", email = "adhya.agarwal@ethara.ai" },
]
