type = "binary"
weight = 3
description = "Recipe: read the client source tree, the client build config and every API handler that returns configuration or status. Cite each client import of server configuration, embedded service URL or credential, or response field carrying one as file:line. Pass: no client source file or API response carries a service URL or credential."

[criterion.annotations]
