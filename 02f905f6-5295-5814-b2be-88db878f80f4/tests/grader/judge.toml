description = "Recipe: `playwright` at 1280x800, sign in as the invented seed owner, open /studio. 1) Probe the computed border widths, border colours and box-shadow of the Amounts owed, Kilns, Awaiting pickup and Damage reports panes and of two rows in the Amounts owed table. 2) Screenshot the full screen. Pass: panes and table rows are divided by 1 px dark umber lines at reduced strength (alpha or lightness lighter than body text) with box-shadow none on every pane."

