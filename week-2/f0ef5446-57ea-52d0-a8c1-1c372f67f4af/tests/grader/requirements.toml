[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "mailpit-down"
port = 4174
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[outages]]
id = "short-windows"
port = 4175
url_env = "APP_SHORT_WINDOWS_URL"

[outages.env]
IDEMPOTENCY_KEY_TTL_SECONDS = "6"
LOGIN_FAILURE_WINDOW_SECONDS = "8"

[[requirements]]
