[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "mail-down"
port = 4175
url_env = "APP_MAIL_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[outages]]
id = "short-links"
port = 4176
url_env = "APP_SHORT_URL"

[outages.env]
LINK_TTL_SECONDS = "5"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
id = "DP-01"
title = "Run manifest, health and start-up"
text = "The app installs, builds and serves from /app/run.json on port 4173, answers the health check, and applies its schema and seed data idempotently on every start, including when two instances start at once."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_run_manifest_health_and_idempotent_start",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Configuration from environment"
text = "Every service URL, credential and duration setting is read from the environment variables listed in Configuration and secrets, and none is hard-coded or sent to the browser."
kind = "source"
primary = "rubric"
workflow = "cross-cutting"
tests = []
criteria = [
