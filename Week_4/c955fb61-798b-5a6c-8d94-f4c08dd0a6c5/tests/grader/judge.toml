id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: with the `source` MCP open `package.json`, find the server entry, then the module that reads configuration. Search server source for `process.env`, `postgres://`, `postgresql://`, `http://`, `https://`, `password`, `secret` and `accessKey`. Any literal credential or service URL fails; cite each as `file:line`. The defaults the brief documents are allowed: port 4173, the UTC zone, the mail sender, the notice delay, presence timeout and motion values, and `http://localhost:<port>` as the public URL. Pass: every database, object-store, mail and grading-key value in server source is read from the environment."

