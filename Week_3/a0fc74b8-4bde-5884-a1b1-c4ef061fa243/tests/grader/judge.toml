description = "Recipe: read where link expiry, reminder cooldown, mail retry and seal retry are computed and scheduled. A timer constant written into the scheduling code fails. Cite each read as file:line. Pass: the four timers are read at start from their published environment variables with only the brief's defaults as fallbacks."

[criterion.annotations]
