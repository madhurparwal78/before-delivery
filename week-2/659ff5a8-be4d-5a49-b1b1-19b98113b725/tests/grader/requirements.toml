schema_version = 1
id_prefix = "DP"
mandatory_count = 60
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "club-onboarding",
    "event-setup",
    "driver-registration",
    "check-in-waiver",
    "work-rota",
    "timing-entry",
    "live-results",
    "corrections-audit",
    "protests-finalize",
    "publish-results",
    "index-tables",
    "season-standings",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 80
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "gotenberg", env = {} },
    { name = "minio", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Conecount Paddock <paddock@pylonworks.test>" } },
]

[criterion_weights]
B1 = 5
B2 = 3
B3 = 5
B4 = 3
B5 = 3
B6 = 5
B7 = 3
B8 = 3
B9 = 3
B10 = 3
B11 = 3
B12 = 3
S1 = 5
S2 = 5
S3 = 3
Q1 = 3
Q2 = 5
Q3 = 5
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "gotenberg-down"
port = 4174
url_env = "APP_GOTENBERG_DOWN_URL"

[outages.env]
GOTENBERG_URL = "http://127.0.0.1:9"

[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4176
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[outages]]
id = "short-window"
port = 4177
url_env = "APP_SHORT_WINDOW_URL"

[outages.env]
PROTEST_WINDOW_SECONDS = "5"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
id = "DP-01"
title = "Health check"
text = "GET /api/health answers 200 with {\"status\":\"ok\"} whenever Postgres is reachable, even while the PDF renderer, object storage or mail server is down."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_wf_cross_cutting_health",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
