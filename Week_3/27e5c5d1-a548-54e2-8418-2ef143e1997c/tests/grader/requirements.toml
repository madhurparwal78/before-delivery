[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "storage-down"
port = 4174
url_env = "APP_STORAGE_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "live-down"
port = 4175
url_env = "APP_LIVE_DOWN_URL"

[outages.env]
VALKEY_URL = "redis://127.0.0.1:9"

