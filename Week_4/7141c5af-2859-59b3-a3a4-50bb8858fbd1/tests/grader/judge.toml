[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server's configuration module and each client for the database, object store, mail, WireMock, PDF and search providers, then search the browser-side source for those addresses, keys and environment reads. Defaults the brief itself documents (the port, the search prefix, the mail sender and the timers) and the seeded conservators' published passwords are allowed. A hard-coded provider address or credential fails, and so does one passed to a page. Cite each as `file:line`. Pass: Provider addresses or credentials exist only as server-side environment reads."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L98, L1057, L1064, L1188, L1206-L1215, L1235, L867-L878"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: trace the GET /api/search handler to its outgoing call, and read the search box's browser code. A SQL query, an in-memory filter or a canned list used to produce or fall back to results fails, and so does a browser call that goes straight to the engine. Cite the call as `file:line`. Pass: The search endpoint's results come only from a real Meilisearch query filtered to the session's desk."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L98, L889, L892, L1064"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 5
description = "Recipe: trace the code that computes the material line, labour line, tax, milestones and hides from decimal strings to minor units, and the used-leather figure from the hide rules. `parseFloat`, `Number(...)` on a decimal string, `Math.round` on a fractional amount or `toFixed` on a binary value in those paths fails. Cite each as `file:line`. Pass: Money and decimal arithmetic is computed in exact integer or decimal form with no binary floating-point value in its path."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L98, L654, L944, L954, L1256"

[[criterion]]
id = "S4"
name = "S4"
type = "binary"
weight = 5
description = "Recipe: trace where a photograph becomes `stored`, a collection `booked`, a dossier `stored`, a client `erased`, a hold `held` and a library refresh counted. A state written before its awaited provider call has succeeded fails, and so does a test-only route, a canned provider answer or a branch that fakes success when a provider is unreachable. The rows the published seed data writes at start-up are exempt. Cite each path as `file:line`. Pass: Outside those seed rows, each of these states is written only after every provider call it depends on has succeeded."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L98, L901, L922, L1009, L1049, L1055, L1062, L1064, L1144, L1159, L1219"

[[criterion]]
id = "Q1"
name = "Q1"
type = "binary"
weight = 3
description = "Recipe: read the TypeScript configuration at the app root, then search the source for `: any`, `as any`, `<any>` and `any[]`. Each use where a domain type exists is a defect, cited as `file:line`. Pass: Strict mode is on and no any type stands where a domain type exists."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L1253"

[[criterion]]
id = "Q2"
name = "Q2"
type = "binary"
weight = 3
description = "Recipe: read the module, type and main function names for pieces, pins, holds, layouts, estimates, client pages, bench jobs, collections and dossiers. A generic name such as `item`, `record` or `job2`, or a synonym such as `order` for a piece or `reservation` for a hold, is a defect, cited as `file:line`. Pass: Names in the source match the brief's domain terms."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L1254"

[[criterion]]
id = "Q3"
name = "Q3"
type = "binary"
weight = 3
description = "Recipe: find where a hold's end, a placement refusal, a milestone split and a client state move are decided. A second copy of any of these rules is a defect, cited as `file:line` for both places. Pass: Each of these domain rules is decided in exactly one place in the source."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L1255"

[[criterion]]
id = "Q4"
name = "Q4"
type = "binary"
weight = 3
description = "Recipe: search the source for interfaces, abstract classes, factories and repositories, then count the implementations of each. A plain client module for one provider is not an abstraction. One with a single implementation and no language boundary demanding it is a defect, cited as `file:line`. Pass: No abstraction has a single implementation unless a language boundary demands it."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L1257"

[[criterion]]
id = "Q5"
name = "Q5"
type = "binary"
weight = 3
description = "Recipe: search the source for commented-out blocks, unused exports, unreachable branches and checks for states the types or the prior code already rule out. Any instance is a defect, cited as `file:line`. Pass: The source holds no dead, commented-out or unreachable code and no defensive check for an impossible state."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L1258"

[[criterion]]
id = "Q6"
name = "Q6"
type = "binary"
weight = 3
description = "Recipe: read the API's error helper and error middleware, then search the route handlers for error responses built by hand. A handler that writes its own error body, or an uncaught path that bypasses the helper, is a defect, cited as `file:line`. Pass: All API errors are produced through one consistent error shape in the source."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L1259"

[[criterion]]
