{% extends "base.html" %}
{% block main %}
<div class="frame">
  <nav class="console-nav" aria-label="Console">
    {% for href, label in console_links %}<a href="{{ href }}"{% if path.startswith(href) %} aria-current="page"{% endif %}>{{ label }}</a>{% endfor %}
  </nav>
  {% block head %}{% endblock %}
  <div class="updates" id="updates" role="status" aria-live="polite" aria-label="Workspace updates"></div>
  {% block body %}{% endblock %}
</div>
{% endblock %}
