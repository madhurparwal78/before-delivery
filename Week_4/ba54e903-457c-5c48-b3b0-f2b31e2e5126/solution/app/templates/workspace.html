<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace - Community Hub</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/tokens.css?v={{ version }}">
<link rel="stylesheet" href="/static/css/workspace.css?v={{ version }}">
<script src="/static/js/core.js?v={{ version }}"></script>
<script type="module" src="/static/js/workspace.js?v={{ version }}"></script>
</head>
<body class="ws" data-community="{{ community_id }}" data-channel="{{ channel_id }}">
<a class="skip-link" href="#stream">Skip to main content</a>
<div class="ws-app" id="app">
  <div class="ws-scrim" id="scrim"></div>
  <div class="ws-side" id="side">
    <nav class="ws-rail" id="rail" aria-label="Communities"><ul id="rail-list" role="list"></ul></nav>
    <div class="ws-sidebar">
      <p class="ws-community" id="community-name"></p>
      <nav class="ws-channels" id="channels" aria-label="Channels"></nav>
      <div class="ws-user" id="user-bar"></div>
    </div>
  </div>
  <div class="ws-center" id="center">
    <div class="ws-col">
      <header class="ws-head">
        <button type="button" class="icon-btn" id="open-channels" aria-expanded="false" aria-controls="side" aria-label="Open channels"></button>
        <h1 id="title" hidden></h1>
        <p class="ws-slowmode" id="slowmode"></p>
        <div class="ws-tools">
          <div class="ws-search"><input type="search" id="search" aria-label="Search messages" placeholder="Search" autocomplete="off" maxlength="200" enterkeyhint="search"></div>
          <button type="button" class="icon-btn" id="bell" aria-label="Notifications" aria-expanded="false" aria-controls="notifications"></button>
          <button type="button" class="icon-btn" id="show-members" aria-label="Show members" aria-expanded="false" aria-controls="members"></button>
        </div>
      </header>
      <div class="ws-stream-wrap">
        <main class="ws-stream" id="stream" tabindex="-1">
          <p class="ws-start" id="start" hidden>This is the start of the channel.</p>
          <div class="msgs" id="messages" role="log" aria-relevant="additions"></div>
        </main>
        <button type="button" class="jump" id="jump" hidden>Jump to new messages</button>
      </div>
      <div class="ws-status" id="status" role="status" aria-label="Workspace status"></div>
      <form class="composer" id="composer-form" autocomplete="off">
        <ul class="pending" id="pending" role="list" aria-label="Pending attachments" hidden></ul>
        <ul class="mentions" id="mentions" role="listbox" aria-label="Mention a member" hidden></ul>
        <div class="composer-row">
          <textarea id="composer" rows="1" disabled aria-label="Message #" aria-autocomplete="list" aria-controls="mentions" placeholder="" enterkeyhint="send" maxlength="20000"></textarea>
          <button type="button" class="attach" id="attach" aria-label="Attach files" disabled></button>
          <input type="file" id="file-input" multiple hidden>
        </div>
      </form>
    </div>
    <aside class="ws-panel" id="thread" aria-label="Thread" hidden>
      <header class="panel-head"><h2>Thread</h2><button type="button" class="icon-btn" id="close-thread" aria-label="Close thread"></button></header>
      <div class="panel-body" id="thread-body"></div>
      <div class="panel-foot"><textarea id="thread-reply" rows="1" aria-label="Thread reply" placeholder="Reply" enterkeyhint="send"></textarea></div>
    </aside>
    <aside class="ws-panel" id="search-panel" aria-label="Search results" hidden>
      <header class="panel-head"><h2 id="search-heading"></h2><button type="button" class="icon-btn" id="close-search" aria-label="Close search"></button></header>
      <div class="panel-body" id="search-body"></div>
    </aside>
    <section class="ws-panel" id="notifications" role="region" aria-label="Notifications" hidden>
      <header class="panel-head"><h2>Notifications</h2><button type="button" class="text-btn" id="read-all">Mark all as read</button></header>
      <div class="panel-body" id="notifications-body">
        <ul id="notification-list" role="list"></ul>
        <button type="button" class="text-btn wide" id="older" hidden>Show older notifications</button>
      </div>
    </section>
  </div>
  <aside class="ws-members" id="members" aria-label="Members">
    <div class="members-scroll" id="members-body"></div>
  </aside>
</div>
</body>
</html>
