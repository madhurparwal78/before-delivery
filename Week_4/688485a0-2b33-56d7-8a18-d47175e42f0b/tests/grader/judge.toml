id = "B3"
name = "B3"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800, open the Documents screen of the fresh Judge Jar project and run the empty query. Then move the pointer to an empty spot of the page background away from every control and wait half a second, so no control shows its hover or press colour. With browser_evaluate list the visible elements whose computed background colour is acid lime (hue 65 to 90 degrees, saturation above 60 percent, lightness above 50 percent) with their tag and accessible name, then take a screenshot. Pass: the only lime elements are the Run button and the current collection link in the rail."

[criterion.annotations]
channel = "experience"
