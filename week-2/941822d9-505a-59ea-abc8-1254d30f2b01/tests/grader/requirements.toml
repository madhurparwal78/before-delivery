title = "Hospital-only totals and search"
text = "Dashboard totals, nurse search, the monthly report and exports include only the coordinator's own hospital's nurses and seats, grouped and filtered by each certificate's provider-time issue date."
kind = "behavior"
primary = "pytest"
workflow = "sponsor-reporting"
tests = [
    "test_app.py::test_hospital_isolation",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-54"
title = "Safe completions export"
text = "The completions CSV is stored under the hospital's folder in object storage and neutralises every cell that a spreadsheet would read as a formula."
kind = "behavior"
primary = "pytest"
workflow = "sponsor-reporting"
tests = [
    "test_app.py::test_safe_completions_export",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-55"
title = "Coordinator record access"
text = "A sponsor coordinator can open certificates and nurse records only for enrolments their hospital funded, and any other id answers as not found."
kind = "behavior"
primary = "pytest"
workflow = "sponsor-reporting"
tests = [
    "test_app.py::test_coordinator_record_access",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-56"
title = "Draft, review and publish a course"
text = "A course author drafts a course and submits it, and the nurse planner returns it with a note or publishes it, then later withdraws it."
kind = "behavior"
primary = "workflow"
workflow = "course-authoring"
tests = [
    "test_app.py::test_wf_course_authoring_release",
    "test_app.py::test_wf_course_authoring_withdrawn",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-57"
title = "Course lifecycle"
text = "Courses move only along the legal edges in Business rules, each edge only by its permitted role, every accepted move raises the version by one, and withdrawn courses keep their certificates valid."
kind = "behavior"
primary = "pytest"
workflow = "course-authoring"
tests = [
    "test_app.py::test_course_lifecycle",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-58"
title = "Stale course edits"
text = "Saving or moving a course with a version someone else has already changed is rejected with the current version number, and nothing changes."
kind = "behavior"
primary = "pytest"
workflow = "course-authoring"
tests = [
    "test_app.py::test_stale_course_edits",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-59"
title = "Effective-dated coverage"
text = "A sponsor coordinator sets a tuition-coverage percentage effective today or from a later date, and a checkout whose quoted learner share no longer matches the policy in effect is refused with the new quote and nothing charged."
kind = "behavior"
primary = "pytest"
workflow = "self-paced-checkout"
tests = [
    "test_app.py::test_coverage_effective_dating",
    "test_app.py::test_wf_self_paced_checkout_quote_changed",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-60"
title = "Close instant in provider time"
text = "Every cohort publishes its close instant as 23:59:59.999 on its close date in the provider's time zone, correct across daylight-saving changes, and shows it in Central Time."
kind = "behavior"
primary = "pytest"
workflow = "cohort-enrolment"
tests = [
    "test_app.py::test_close_instant_provider_time",
]
criteria = []
parameter_cases = [
    "dst-start-eve",
    "dst-start-day",
    "dst-end-day",
    "winter",
]

[[requirements]]
id = "DP-61"
title = "Unaccepted fields refused"
text = "A request body carrying a field its endpoint does not name answers 422 naming each such field and changes nothing, as qualified in API."
kind = "behavior"
primary = "pytest"
workflow = "module-player"
tests = [
    "test_app.py::test_unaccepted_fields_refused",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-62"
title = "Exact link expiry"
text = "Verification links and emailed download links stop working at exactly their server-side expiry instant, an expired verification link is listed as expired rather than revoked, and every capability response is served uncached and without a referrer."
kind = "behavior"
primary = "pytest"
workflow = "transcript-share"
tests = [
    "test_app.py::test_exact_link_expiry",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-63"
title = "Attributed refund decisions"
text = "Each refund decision is written once with the deciding planner, time and note and never changes, and every Kill Bill write names the acting Credwell user, as stated in Services."
kind = "behavior"
primary = "pytest"
workflow = "refunds"
tests = [
    "test_app.py::test_attributed_refund_decisions",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-64"
title = "Copies carry the version's name"
text = "Every certificate copy carries the nurse name of the certificate's current version rather than the live display name, and the version history keeps every earlier name."
kind = "behavior"
primary = "pytest"
workflow = "certificate-reissue"
tests = [
    "test_app.py::test_copies_carry_version_name",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-65"
title = "Bounded literal search"
text = "Nurse and certificate searches match text literally and accept at most 100 characters, and a completions export spans at most 366 days, as stated in API."
kind = "behavior"
primary = "pytest"
workflow = "sponsor-reporting"
tests = [
    "test_app.py::test_bounded_literal_search",
]
criteria = []
parameter_cases = []

[[if_rules]]
id = "IF-01"
text = "/app/run.json exists and holds exactly the string keys _schema (value run-manifest-v1), install, build and serve."
tests = [
    "test_app.py::test_if_run_manifest",
]
parameter_cases = []

[[if_rules]]
id = "IF-02"
text = "/app/THIRD_PARTY_NOTICES.md names every shipped package (the production dependency tree from npm ls --omit=dev --all --json) and every bundled font, with its licence."
tests = [
    "test_app.py::test_if_third_party_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Every shipped package (the production dependency tree from npm ls --omit=dev --all --json) uses MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD, BlueOak-1.0.0 or CC0-1.0, and bundled fonts use OFL-1.1."
tests = [
    "test_app.py::test_if_licence_allowlist",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "The app stores data only in the provided Postgres, Kill Bill, MinIO and Mailpit services, with no SQLite, Redis, in-process persistent store or local files as a record store."
tests = [
    "test_app.py::test_if_no_extra_datastore",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "The provided service definitions and their credential values stay unchanged."
tests = [
    "test_app.py::test_if_services_unchanged",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "All application source is TypeScript; plain JavaScript appears only in tool configuration files."
tests = [
    "test_app.py::test_if_typescript_only",
]
parameter_cases = []

[[if_rules]]
id = "IF-07"
text = "The running app makes no browser requests to third-party origins (no font, script or analytics CDNs)."
tests = [
    "test_app.py::test_if_no_third_party_requests",
]
parameter_cases = []

