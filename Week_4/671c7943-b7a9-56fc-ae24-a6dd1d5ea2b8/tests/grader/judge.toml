[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server start-up and configuration code, starting from the `serve` command in `run.json`, then search the source for `process.env`, the database pool creation, the mail transport creation, the call that reaches the PDF renderer and the grading-key check. Defects: a literal host, port, address, connection string, sender, studio recipient or grading key used as a value or as a fallback for any of the seven environment variables the brief lists, grading routes that answer when the key variable is unset, or any of those values reaching a browser-served file. The documented listening port default and the published page copy showing the studio email do not count. Pass: every one of the seven variables is read from the environment with no literal fallback."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-58",
]
evidence = "file_line"
cites = "L87, L469, L713, L720-L731"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: read the enquiry creation route, the mail module and the brief route. Trace the order: store the enquiry, send the studio copy, then the acknowledgement through an SMTP client, and set the mail outcome from the transport result. Trace the brief route: it must send HTML built from the stored enquiry to the PDF renderer's Chromium HTML conversion. Defects: a stub, mocked transport or in-memory queue, a fixed `sent` outcome not derived from the transport result, a PDF produced by a local library, or a brief read from a file. Pass: the enquiry route delivers both messages through an SMTP client and the brief route posts HTML to the renderer, with no stand-in for either."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-58",
]
evidence = "file_line"
cites = "L87, L526-L529, L542-L574"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: find the module that draws plates and every place that renders a cover, hero, showcase screen or swatch. Defects: image files or per-slug hard-coded SVG markup for any seeded project, plate parameters that do not come from the stored project's hue and motif, or separate drawing code for the tile and the hero. Pass: every cover, hero and showcase screen is computed from the stored project's hue and motif, and the tile and the hero draw the same plate from one shared drawing function."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-58",
]
evidence = "file_line"
cites = "L77, L87, L321-L328"

