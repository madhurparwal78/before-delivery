id = "DP-52"
title = "Invitation links are capabilities"
text = "Invitation tokens are long random values stored only as hashes, served with no referrer and no caching, accepted exactly once even under simultaneous clicks, dead once replaced, limited to the published number of new invitations per diagram per hour, and guarded by the published limit on failed lookups per IP."
