    "S4",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 80
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "killbill", env = {} },
    { name = "minio", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Saltmoon Practice <hello@saltmoon.example>" } },
]

[criterion_weights]
B1 = 5
B2 = 3
B3 = 5
B4 = 3
B5 = 3
B6 = 3
B7 = 3
B8 = 3
B9 = 3
B10 = 3
B11 = 3
B12 = 3
B13 = 3
