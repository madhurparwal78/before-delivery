[[if_rules]]
id = "IF-02"
text = "/app/THIRD_PARTY_NOTICES.md names every shipped package and every bundled font with its licence, where shipped packages means the production dependency tree from npm ls --omit=dev --all --json."
tests = [
    "test_app.py::test_if_third_party_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Every shipped package (same definition) is under MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD, BlueOak-1.0.0 or CC0-1.0, and every font is under OFL-1.1."
tests = [
    "test_app.py::test_if_licences",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "The app keeps state only in Postgres and MinIO: no SQLite, Redis, embedded databases or state files on disk."
tests = [
    "test_app.py::test_if_no_extra_datastore",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "The provided service configuration and environment files are left untouched."
tests = [
    "test_app.py::test_if_service_config_untouched",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "All application source is TypeScript compiled with strict enabled."
tests = [
    "test_app.py::test_if_typescript_strict",
]
parameter_cases = []

[[if_rules]]
id = "IF-07"
text = "Neither the server nor the browser loads anything from third-party hosts at run time, so fonts, scripts and styles are served by the app itself."
tests = [
    "test_app.py::test_if_no_third_party_hosts",
]
parameter_cases = []

