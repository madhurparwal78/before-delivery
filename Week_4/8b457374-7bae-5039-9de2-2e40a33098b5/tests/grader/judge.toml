[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: 1) Start at `/app/run.json` and the server entrypoint. 2) Find the config module. 3) Find every place that builds the database pool, the payment client, the mail transport, the object-store client and the document-render request, and trace each URL and credential back to its source. Cite each finding as `file:line`. The brief's documented defaults (the app port and the four timing defaults) are allowed as fallbacks, and any other literal fallback counts as a defect. Pass: every service client takes its URL and credentials from environment variables alone."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-58",
]
evidence = "file_line"
cites = "L85, L506, L508-L519"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: search all source, including scripts and seed code, for literal service hosts, ports, URLs, usernames, passwords, access keys, API keys and secrets. Cite each finding as `file:line`. The brief's seeded person keys, the mail sender value and the `0.0.0.0` bind address are not service credentials or hosts. Pass: no source file contains a literal service host or credential."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-58",
]
evidence = "file_line"
cites = "L85, L466-L469, L506, L519"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: 1) List the browser-side source, HTML templates and bundler configuration, for example `define`, `import.meta.env` or `process.env` substitution. 2) Trace imports from browser code into server config. 3) Read the handlers for status, health and error responses, including any path that relays a provider error message. Cite each finding as `file:line`. Env values exposed to the bundle, a status body naming hosts and an error body echoing a provider URL or message each count as a defect. Pass: no browser source file or server response carries a service URL or credential."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-58",
]
evidence = "file_line"
cites = "L85, L519, L523"

[[criterion]]
id = "S4"
name = "S4"
type = "binary"
weight = 3
description = "Recipe: search the source for every logging call (`console` methods, logger methods, startup banners, error handlers that print config or connection objects) and read what each one prints. Cite each finding as `file:line`. Logging the whole config object, the environment or a client options object that holds secrets counts as a defect. Pass: no log statement prints a credential or service URL."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-58",
]
evidence = "file_line"
cites = "L85, L519"

[[criterion]]
id = "Q1"
name = "Q1"
type = "binary"
weight = 3
description = "Recipe: 1) Read every tsconfig used for the server and browser builds. 2) Search the TypeScript source, outside tool configuration, for `any` used as a type: `: any`, `as any`, `any[]`, `Record<string, any>` and generic arguments of `any`. Cite each finding as `file:line`. Pass: every tsconfig turns strict mode on, and domain code contains no `any` type."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L545"

[[criterion]]
id = "Q2"
name = "Q2"
type = "binary"
weight = 5
description = "Recipe: find and read the parsing of pounds typed into money fields, the pledge amount, total, quote and fee computations, the settlement sums, and the conversion of pence to the payment service's two-decimal amount and to display strings. Cite each finding as `file:line`. Each of these counts as a defect: `parseFloat` or `Number()` on a whole pounds-and-pence string, multiplying such a parsed number by 100, summing or storing amounts as pounds, and a pounds value from dividing pence that feeds further arithmetic. Converting the typed pound digits and pence digits to integers separately and combining them as pounds times 100 plus pence is not a defect. Pass: the reading finds none of these defects."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L3, L331, L547"

[[criterion]]
id = "Q3"
name = "Q3"
type = "binary"
weight = 3
description = "Recipe: 1) Locate the fee rule (platform fee, processing fee, to-creator) and the pledge amount rule (price plus zone shipping plus add-on). 2) Search the quote, pledge, change, close-out, statement and settlement code, including SQL and HTML templates, for any other place that computes either rule, for example a repeated percentage expression or an inline price-plus-shipping sum. Cite each finding as `file:line`. Pass: each of the two rules is computed in exactly one function."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L341, L399-L404, L547"

[[criterion]]
id = "Q4"
name = "Q4"
type = "binary"
weight = 3
description = "Recipe: search the source for every write of a campaign status or pledge state (SQL updates that set status or state, object assignments) and every refusal code tied to state (`campaign_not_draft`, `not_live`, `campaign_closed`, `pledge_not_active`). Cite each finding as `file:line`. A route or background job that writes a state directly, or repeats a refusal check that the transition code already makes, counts as a defect. Pass: each campaign or pledge transition is decided in exactly one place."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L361-L379, L548"

[[criterion]]
id = "Q5"
name = "Q5"
type = "binary"
weight = 3
description = "Recipe: search the source for commented-out code blocks, exported symbols with no importer, branches after an unconditional return or throw, and defensive checks for states the rules make impossible, such as re-checking a status the transition code already guarantees. Cite each finding as `file:line`. Each instance counts as a defect. Pass: the search finds none of these defects."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L550"

[[criterion]]
id = "Q6"
name = "Q6"
type = "binary"
weight = 3
description = "Recipe: 1) On the server, find how error responses are produced across routes and middleware: body limits, bad JSON, auth, not-found, validation and provider failures. 2) In the browser code, find every place that reads a failed response. Cite each finding as `file:line`. A hand-built error object in a route, a second error format, and a client branch on HTTP status text or raw provider messages each count as a defect. Pass: the reading finds none of these defects."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L250, L551"

[[criterion]]
id = "Q7"
name = "Q7"
type = "binary"
weight = 3
description = "Recipe: list every TypeScript interface or abstract class describing behaviour (not plain data shapes), every base class and every module whose functions only forward to another client, for example a repository or gateway layer. For each, count the classes or modules that implement or extend it. Cite each finding as `file:line`. Pass: no behavioural interface, base class or pass-through wrapper has only one implementation."

[criterion.annotations]
channel = "quality"
