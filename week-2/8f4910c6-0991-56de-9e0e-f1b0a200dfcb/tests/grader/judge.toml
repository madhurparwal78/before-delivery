[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: `source` MCP. 1. Read the configuration module. 2. Read every place that builds the PostgreSQL pool, the S3 client, the Kill Bill client and the SMTP transport. 3. Treat any literal credential or service address as a defect, and allow only the defaults the brief documents for the port, the link base and the four timing settings. 4. Cite each read as `file:line`. Pass: every service URL and credential is read from the environment with no hard-coded fallback beyond the brief's documented defaults."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L95, L620, L721, L725-L731"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: `source` MCP. 1. Trace the confirm, Issue invoice, licence extension and booking reversal handlers into the Kill Bill client: confirm adds uncommitted external charges, Issue invoice commits the booking's stored invoice, extension adds a committed external charge, reversal records a credit on the client's account. 2. For confirm and extension only, check that the `killbillInvoiceId` saved on the booking or extension comes from the Kill Bill response. 3. Treat an invoice that exists only in the app as a defect: an invoice id the app generates or fills with a placeholder instead of taking it from Kill Bill, a booking marked invoiced without the matching Kill Bill commit, or a stubbed Kill Bill client in production code. The records the brief asks the app to keep are not a defect: storing the fee lines and totals, `killbillInvoiceId`, the booking state, `issuedBy` and `issuedAt`, and an extension's `amountCents`, `extendedBy` and `extendedAt`, in the app's own tables follows the brief. Do not require any stored id for Issue invoice or reversal. 4. Cite each Kill Bill call as `file:line`. Pass: all four handlers make real Kill Bill REST calls, with confirm and extension persisting the invoice id that Kill Bill returns."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L95, L420, L427, L458, L532, L611-L618"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 5
description = "Recipe: `source` MCP. 1. Trace email creation from a cast request and from a booking confirm into the PostgreSQL outbox. 2. Trace the delivery worker to its send call. 3. Treat mail written to disk, a console logger, an in-memory list or a test-only inbox endpoint as a defect. 4. Cite the outbox write and the send as `file:line`. Pass: every email is queued in a PostgreSQL outbox table and delivered through an SMTP transport built from the SMTP settings."

[criterion.annotations]
