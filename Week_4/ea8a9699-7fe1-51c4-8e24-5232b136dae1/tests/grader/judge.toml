description = "Recipe: 1) Read the client stylesheets and font declarations. 2) Find how Familjen Grotesk, IBM Plex Sans and IBM Plex Mono reach the client: @font-face rules pointing at delivered or generated font files, a self-hosting font package (such as @fontsource) declared in package.json and imported by the client, or an install/build integration that obtains and emits self-hosted fonts. 3) Treat a missing family, a third-party font host URL used at runtime or a declared font with no delivered file or install/build path that supplies it for self-hosting as a fail, citing each as `file:line`. Pass: all three families ship as self-hosted fonts through delivered files, packages or install/build generation, without requests to a third-party font host at runtime."

