[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: start at the serve command in `/app/run.json`, read the server's start-up and configuration module, then search the whole source tree (server and browser code) for the service address, credential, token and timer variables named in the brief's configuration list and for literal hostnames, passwords, keys or tokens. The brief's own documented defaults are allowed as literals: the port, the grading token default, the five timer defaults, the join rate limit default and the verification lifetime default. Pass: every service address, credential and token is read from its named environment variable, with only the brief's documented defaults as literals."

