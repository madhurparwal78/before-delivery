title = "Leg Span"
text = "The ride page shows the Leg Span: stops placed by km, one band per seat filled where taken, and boarding and alighting handles that move by pointer, touch or arrow keys, snap to stops, tint the span and announce its km, free seats and price, as described in Interactions and Motion and effects."
