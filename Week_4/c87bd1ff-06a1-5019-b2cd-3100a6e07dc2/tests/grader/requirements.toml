schema_version = 1
id_prefix = "DP"
mandatory_count = 60
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "consign-and-place",
    "register-and-limit",
    "proxy-ladder",
    "equal-maximums",
    "reserve-jump",
    "staggered-closes",
    "close-edge",
    "second-chance",
    "invoice-premium-vat",
    "payment-default",
    "bid-removal",
    "watch-list",
    "seller-statements",
    "privacy",
    "catalogue-keyboard-phone",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "S4",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 91
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "keycloak", env = {} },
]

[criterion_weights]
B1 = 5
B2 = 3
B3 = 5
B4 = 3
B5 = 5
B6 = 3
B7 = 3
B8 = 5
B9 = 5
B10 = 3
B11 = 5
B12 = 5
S1 = 5
S2 = 5
S3 = 3
S4 = 3
Q1 = 5
Q2 = 3
Q3 = 3
Q4 = 3
Q5 = 5
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "keycloak-down"
port = 4174
url_env = "APP_KEYCLOAK_DOWN_URL"

[outages.env]
KEYCLOAK_URL = "http://127.0.0.1:9"
AUTH_ISSUER_URL = "http://127.0.0.1:9"

[[outages]]
id = "short-timers"
port = 4175
url_env = "APP_SHORT_URL"

[outages.env]
DATABASE_URL = "${DATABASE_URL}_short"
LOT_GAP_SECONDS = "5"
SOFT_CLOSE_SECONDS = "10"
PAYMENT_DUE_SECONDS = "20"
OFFER_SECONDS = "10"
WATCH_NOTICE_SECONDS = "8"

[[requirements]]
id = "DP-01"
title = "Keycloak sign-in"
text = "Signing in goes through Keycloak with a fresh state and PKCE for every attempt, and the callback creates a session only once and only in the browser that started that attempt, as qualified in Server boundary."
kind = "behavior"
primary = "pytest"
workflow = "register-and-limit"
tests = [
    "test_app.py::test_keycloak_sign_in",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Role-gated desks"
text = "Each desk page and each member or staff API answers only to the realm role that owns it, and every other signed-in role gets the 403 set out in API."
kind = "behavior"
primary = "pytest"
workflow = "privacy"
tests = [
    "test_app.py::test_role_gated_desks",
