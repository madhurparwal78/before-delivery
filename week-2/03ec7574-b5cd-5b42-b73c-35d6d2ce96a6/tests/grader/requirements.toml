title = "Accessibility contract."
text = "Public and console pages meet WCAG 2.2 AA, every exposed image has a name, focus is visible on every control, dialogs trap and return focus, and status badges carry their words at AA contrast."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_wf_cross_cutting_accessibility",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-53"
title = "Phone layouts."
text = "At 375 pixels wide no page scrolls sideways, the header Menu opens the links, and Approve stays inside the screen in a stacked console row."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_wf_cross_cutting_phone_layouts",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-54"
title = "Health and boot."
text = "GET /api/health answers 200 {\"status\":\"ok\"} once the schema and seed are ready, sign in works the moment it does, and the server answers 503 instead of exiting while PostgreSQL is unreachable, recovering without a restart."
kind = "behavior"
primary = "pytest"
workflow = "deployment-storage"
tests = [
    "test_app.py::test_wf_deployment_storage_boot_recovery",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-55"
title = "Envelope, request ids and timestamps."
text = "Every /api response except the plain health route carries the envelope with a fresh lowercase version 4 request id, refusals carry an empty details object unless named, and every timestamp reads YYYY-MM-DDTHH:MM:SSZ."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_wf_cross_cutting_envelope",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-56"
title = "PostgreSQL holds every record."
text = "Every pinned table lives in PostgreSQL, no password, token or key secret is stored readable, and the public pages reference no outside host."
kind = "behavior"
primary = "pytest"
workflow = "deployment-storage"
tests = [
    "test_app.py::test_wf_deployment_storage_tables",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-57"
title = "Core actions answer quickly."
text = "A transfer, an approval and a policy evaluation over the seed data each answer within 500 milliseconds."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_performance",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-58"
title = "Paired ledger."
text = "Every money movement writes exactly two ledger entries that sum to zero, and every wallet's balance equals the sum of its entries after every write."
kind = "behavior"
primary = "pytest"
workflow = "payout-quorum"
tests = [
    "test_app.py::test_paired_ledger",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-59"
title = "Formula-safe intents export."
text = "The intents CSV export lists the filtered intents with every cell that starts with a formula character neutralised, and the console shows such names and memos as plain text."
kind = "behavior"
primary = "pytest"
workflow = "wallet-console"
tests = [
    "test_app.py::test_wf_wallet_console_csv_export",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-60"
title = "Audit verification."
text = "The audit verify route recomputes the organization's chain and names the first broken seq, and the audit page shows its result."
kind = "behavior"
primary = "pytest"
workflow = "audit-trail"
tests = [
    "test_app.py::test_wf_audit_trail_verify",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-61"
title = "Payroll batch builder."
text = "On the wallet page an operator adds and removes batch lines, reads an exact running total, sees a refused line marked by its number with focus on its field, and submits the batch as one intent."
kind = "behavior"
primary = "workflow"
workflow = "payroll-batch"
tests = [
    "test_app.py::test_wf_payroll_batch_builder",
    "test_app.py::test_wf_payroll_batch_refused_line",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-62"
title = "Request limits."
text = "A body over 1,000,000 bytes is 413 PAYLOAD_TOO_LARGE, a body that is not JSON is refused with its pinned code, and nothing is written."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_wf_cross_cutting_request_limits",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-63"
title = "Rules decided once."
text = "Each domain rule, from amount parsing to policy decisions, intent transitions, expiry and audit hashing, is decided in exactly one place in the source and reused by every route and page that needs it."
kind = "source"
primary = "rubric"
workflow = "cross-cutting"
tests = []
criteria = [
    "S1",
    "S2",
    "S3",
    "S4",
]
parameter_cases = []

