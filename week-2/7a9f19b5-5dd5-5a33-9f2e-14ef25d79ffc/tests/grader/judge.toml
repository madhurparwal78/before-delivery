[[criterion]]
id = "Q3"
name = "Q3"
type = "binary"
weight = 3
description = "Recipe: Find the definition of the allowed order state changes (the card and account (from, to) pairs) and every handler that changes a stored order status (authorise, place on account, dispatch, refund, record payment), and trace whether each handler's change is accepted or refused by that definition before it is saved. A handler may pick its target status from data it holds (the Kill Bill reply, the refund amount) and save it with its own database write; reading a status to find, filter or label an order, and reporting overdue at read time from the due date, are not state changes. A second list of allowed changes, or a handler that saves a new status or answers invalid_state without consulting the definition, fails; cite each as file:line. Pass: one definition of the allowed (from, to) order state changes is consulted by every status-changing handler."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L474-L485, L763"

