[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[services]]
name = "postgres"

[services.env]
GRADING_ROUTES = "on"
PRESENCE_TIMEOUT_MS = "4000"
VERSION_INTERVAL_MS = "6000"

[[services]]
name = "minio"

[services.env]

[[services]]
name = "mailpit"

[services.env]
MAIL_FROM = "Linewell <hello@linewell.test>"

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"
MAILPIT_URL = "http://127.0.0.1:9"

[[outages]]
id = "invite-ttl-short"
port = 4176
url_env = "APP_INVITE_TTL_URL"

[outages.env]
INVITE_TTL_MS = "8000"
DATABASE_URL = "${DATABASE_URL}_invite_ttl"
S3_BUCKET = "${S3_BUCKET}-invite-ttl"

[[requirements]]
id = "DP-01"
title = "Snap to grid"
text = "With Snap to grid on, a move lands the moved selection's left and top edges on multiples of 8 and a corner resize lands the dragged edges on multiples of 8 while the opposite corner stays fixed, as qualified in Geometry rules, Alt skips snapping for that drag, and the document JSON agrees."
kind = "behavior"
primary = "workflow"
workflow = "drag-snap-align"
tests = [
    "test_app.py::test_wf_drag_snap_align_drag",
]
criteria = []
parameter_cases = []

