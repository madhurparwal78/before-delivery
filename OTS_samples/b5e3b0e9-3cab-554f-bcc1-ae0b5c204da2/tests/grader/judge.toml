name = "S3"
type = "binary"
weight = 3
description = "Recipe: search the whole source for database URLs, S3 keys, SMTP settings, the grading key and passwords written as string literals, and read the config module that reads the environment at start. Documented defaults (listen port, `SIM_CLOCK`, `APP_TIME_ZONE`, and each timer and limit default in the configuration table) are allowed. Fallback values written into the config module for a credential or a service address (for example a default public URL, database URL or SMTP port) count as literal copies. Pass: every credential and service address is read from the environment with no literal copy in the source."

[criterion.annotations]
