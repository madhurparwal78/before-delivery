weight = 3
description = "Recipe: trace how audit entries, export CSVs and outbox messages capture names when they are written, and how they are later read. A history record that re-reads or re-joins the current name after it was written is a defect. Pass: audit, export and outbox records keep the name copied at write time, cited as file:line."

[criterion.annotations]
channel = "quality"
