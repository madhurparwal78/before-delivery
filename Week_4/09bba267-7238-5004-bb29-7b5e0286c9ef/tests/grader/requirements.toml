[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[services]]
name = "postgres"

[services.env]

[[services]]
name = "killbill"

[services.env]

[[services]]
name = "mailpit"

[services.env]
MAIL_FROM = "Halyard Hall Box Office <boxoffice@halyardhall.example>"

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAIL_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[outages]]
id = "short-timer"
port = 4176
url_env = "APP_SHORT_URL"

[outages.env]
HOLD_SECONDS = "5"
OFFER_SECONDS = "8"
DATABASE_URL = "${DATABASE_URL}_short"

[[requirements]]
