solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Tallyframe <invites@harbourlane.test>" } },
    { name = "minio", env = {} },
]

[criterion_weights]
B1 = 5
B2 = 5
B3 = 5
B4 = 5
B5 = 5
B6 = 3
B7 = 3
B8 = 3
B9 = 3
B10 = 3
