description = "Recipe: `touch` at 375x812. 1) Sign in at /login as admin@example.com (invented seed data). 2) Open /requests, where the rows render as cards. 3) Use browser_evaluate to read the computed background colour, text colour and border of one chip of each of the four states. 4) Compare each with the brief's chip tone table (light vivid orange, light soft teal, deep vivid red with white text, near-white neutral). 5) Screenshot the cards showing these chips. Pass: the four state chips show four different fills, each matching the tone role the brief gives its state."

