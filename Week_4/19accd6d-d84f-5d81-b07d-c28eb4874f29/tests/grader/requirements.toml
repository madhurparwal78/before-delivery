[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
WRINGBENCH_GRADING = "1"

[[outages]]
id = "meilisearch-down"
port = 4175
url_env = "APP_MEILISEARCH_DOWN_URL"

[outages.env]
MEILISEARCH_URL = "http://127.0.0.1:9"
WRINGBENCH_GRADING = "1"

[[outages]]
id = "short-limits"
port = 4176
url_env = "APP_SHORT_URL"

[outages.env]
WRINGBENCH_GRADING = "1"
WRINGBENCH_OUTPUT_DISPLAY_BYTES = "64"
WRINGBENCH_VERSIONS_KEPT = "3"
WRINGBENCH_TEAM_MAX = "2"
WRINGBENCH_FILE_MAX_BYTES = "1024"
WRINGBENCH_INPUT_MAX_BYTES = "2048"
WRINGBENCH_SHARE_TTL_CHOICES = "30s,1h"
WRINGBENCH_SEARCH_INDEX = "recipes_short"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
id = "DP-01"
title = "Run manifest and health"
text = "The app installs, builds and serves from /app/run.json on port 4173 (or APP_PUBLIC_PORT), and GET /api/health always answers 200 with the status body defined in API."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_health_reports_storage",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Published limits from the environment"
text = "Every limit in Configuration and secrets is read from its environment variable at start, and GET /api/config returns the client-side ones so the page obeys the configured values."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_config_from_env",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Grading routes"
text = "With WRINGBENCH_GRADING=1, POST /api/grading/seed creates users, teams, recipes, versions, files and snapshots in one call and POST /api/grading/outage simulates an outage of storage, search or the live channel, and both answer 404 otherwise."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_grading_routes",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "One error shape and precedence"
text = "Every API error uses the single error body and the precedence order stated in API, so another person's or another team's resource is never revealed."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
