schema_version = "1.4"

[[artifacts]]
source = "/app"
exclude = [
    "node_modules",
    ".git",
]

[task]
name = "northfold/teamseat"
version = "1.0.0"
description = "Teamseat: interpreter dispatch and billing for a regional on-site ASL and spoken-language interpreting agency, with team seats, race-safe claims, business-hour late-cancellation fees, dated rate cards, private verification forms in MinIO, Kill Bill invoicing with outage queueing and Mailpit notices."
authors = [
    { name = "aditya jha", email = "aditya.jha@ethara.ai" },
]
keywords = [
    "interpreting",
    "dispatch",
    "scheduling",
    "billing",
    "killbill",
    "mailpit",
    "minio",
    "postgres",
    "concurrency",
    "idempotency",
    "business-time",
    "accessibility",
]

[metadata]
uuid_v5 = "bc58b4f3-2c8c-5da1-9a71-d2573dfa8ebc"
identity_namespace_url = "https://tasks.example/northfold/teamseat/1.0.0"
category = "Greenfield"
domain = "interpreter dispatch and billing for a regional on-site interpreting agency"
archetype = "enterprise"
language = "typescript"
design_direction = "Accountable, calm, legible paper dispatch sheet: warm paper ground, near-black ink, warm grey hairline rules, burnt orange-red gap hatching, deep forest green covered fill; Archivo display, Atkinson Hyperlegible body at about 17px with 1.5 leading; tabular mono numerals with units; rigid 12-column sheet with language gutter, 06:00-22:00 day columns, capsules split into seat lanes, right-hand drawer; signature Hatch Seam sweep tied to server-confirmed claims."
created_at = "2026-10-28"
service_profile = "postgres+mailpit+killbill+minio"
harbor_version = "0.24.0"
grader_version = "rewardkit-0.2.3"
contract_version = "1.0.0"
requirements_registry = "tests/grader/requirements.toml"
mandatory_requirement_count = 45
workflow_count = 10
rubric_criterion_count = 23
rubric_total_weight = 87
if_constraint_count = 7
scoring_policy = "reward=pytest-outcome-pass-rate;if_score+rubric+quality+combined_score-separate;binary-rubric-5/3/1"
self_contained = true
builds_from_source = true
null_floor = 0.0
platforms = [
    "linux/amd64",
    "linux/arm64",
]

[agent]
timeout_sec = 36000.0
network_mode = "public"

[environment]
os = "linux"
cpus = 4
memory_mb = 4096
storage_mb = 20480
network_mode = "public"
build_timeout_sec = 3600.0

[verifier]
environment_mode = "separate"
timeout_sec = 36000.0

[verifier.env]
JUDGE_SECRET = "${JUDGE_SECRET:-}"
JUDGE_URL = "${JUDGE_URL:-http://host.docker.internal:8790}"
