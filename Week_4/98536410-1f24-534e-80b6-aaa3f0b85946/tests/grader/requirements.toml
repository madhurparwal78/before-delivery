    "S2",
    "S3",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 78
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "minio", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Tramela Estate <encomendas@tramela.example>" } },
]

[criterion_weights]
B1 = 5
B2 = 5
B3 = 3
B4 = 3
B5 = 3
B6 = 3
B7 = 3
B8 = 5
B9 = 3
B10 = 3
B11 = 3
B12 = 3
S1 = 5
S2 = 5
S3 = 3
Q1 = 3
Q2 = 3
Q3 = 5
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_minio_down"

[[outages]]
id = "short-hold"
port = 4175
url_env = "APP_SHORT_HOLD_URL"

[outages.env]
HOLD_SECONDS = "5"
HOLD_SWEEP_SECONDS = "2"
DATABASE_URL = "${DATABASE_URL}_short_hold"
S3_BUCKET = "${S3_BUCKET}-short-hold"

[[outages]]
id = "short-session"
port = 4176
url_env = "APP_SHORT_SESSION_URL"

[outages.env]
SESSION_SECONDS = "40"
DATABASE_URL = "${DATABASE_URL}_session"
S3_BUCKET = "${S3_BUCKET}-session"

[[outages]]
id = "twin"
port = 4177
url_env = "APP_TWIN_URL"

[outages.env]

[[requirements]]
id = "DP-01"
title = "Sign-in lands on the role route"
text = "Signing in by keyboard or tap at 375 by 812, 768 by 1024 and 1280 by 800, and switching shop as a manager, puts the role's published route in the address bar, and reloading or opening that address shows the same screen, as qualified in Screens and layout."
kind = "behavior"
primary = "workflow"
workflow = "sign-in"
tests = [
    "test_app.py::test_wf_sign_in_landing_routes",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Session API and fixed lifetime"
text = "The session endpoints sign in, report and end a session that lasts a fixed time from sign-in, signed-out and expired API calls answer the unauthenticated error, and signed-out page visits go to the sign-in screen with the requested address kept in next."
kind = "behavior"
primary = "pytest"
workflow = "sign-in"
tests = [
    "test_app.py::test_session_api_and_lifetime",
]
criteria = []
parameter_cases = []

