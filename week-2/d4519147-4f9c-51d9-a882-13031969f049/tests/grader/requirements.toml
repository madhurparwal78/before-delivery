title = "Access checked on every object id"
text = "Every diagram, page, shape, zone, connector, share, export, import, original, download and audit endpoint checks the caller's live role on that exact diagram, including nested ids and ids inside request bodies, answers not-found for anything the caller cannot see, and changes nothing when any item of a batch fails."
kind = "behavior"
primary = "pytest"
workflow = "diagram-access"
tests = [
    "test_app.py::test_dp06_object_level_access",
]
criteria = []
parameter_cases = [
    "page of diagram A under diagram B",
    "share id of another diagram",
    "export pageIds with a foreign page",
    "PUT body id differs from path",
    "viewer forbidden on PUT",
    "editor forbidden on audit",
]

