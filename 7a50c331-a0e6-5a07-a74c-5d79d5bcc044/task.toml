schema_version = "1.4"

[[artifacts]]
source = "/app"
exclude = [
    "node_modules",
    ".git",
]

[task]
name = "deku/governed-context-graph"
version = "1.0.0"
description = "Tessel, a governed context graph console: role-gated organizations provision databases, ingest sourced facts into a numbered write log, ask keyword and as-of graph questions, and manage keys, plans, bills, exports and an attributed audit log, on PostgreSQL with mail through Mailpit."
authors = [
    { name = "raja.kumarint17", email = "raja.kumarint17@ethara.ai" },
]
keywords = [
    "knowledge-graph",
    "temporal-facts",
    "write-log",
    "rbac",
    "multi-tenant",
    "idempotency",
    "audit-log",
    "billing",
    "postgres",
    "mailpit",
]

[metadata]
uuid_v5 = "7a50c331-a0e6-5a07-a74c-5d79d5bcc044"
identity_namespace_url = "https://tasks.example/deku/governed-context-graph/1.0.0"
category = "Greenfield"
domain = "developer tools / context graph database"
archetype = "governed-context-graph"
language = "python"
design_direction = "night engineering notebook, near-black hairline grid, monospaced type, one signal orange"
created_at = "2026-10-27"
seed = "url"
service_profile = "postgres+mailpit"
harbor_version = "0.24.0"
grader_version = "gfkit-0.1.0/rewardkit-0.2.3"
contract_version = "1.0.0"
requirements_registry = "tests/grader/requirements.toml"
mandatory_requirement_count = 99
workflow_count = 23
rubric_criterion_count = 19
rubric_total_weight = 71
if_constraint_count = 6
scoring_policy = "reward=pytest-outcome-pass-rate;if_score+rubric+quality+combined_score-separate;binary-rubric-5/3/1"
self_contained = true
builds_from_source = true
null_floor = 0.0
platforms = [
    "linux/amd64",
    "linux/arm64",
]

[agent]
timeout_sec = 21600.0
network_mode = "public"

[environment]
os = "linux"
cpus = 4
memory_mb = 4096
storage_mb = 20480
network_mode = "public"
build_timeout_sec = 3600.0

[verifier]
environment_mode = "separate"
timeout_sec = 21600.0

[verifier.env]
JUDGE_SECRET = "${JUDGE_SECRET:-}"
JUDGE_URL = "http://host.docker.internal:8790"
