type = "binary"
weight = 3
description = "Recipe: read the search module and the capture, facts edit, swatch, trash, restore and purge handlers that call it, and trace what the app waits on before it answers. A success reported without the Meilisearch task's own status, or an in-process list standing in for the index, fails. Pass: every write to the search index waits on that Meilisearch task's own succeeded status before the action is reported done."

[criterion.annotations]
