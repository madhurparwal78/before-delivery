id = "B3"
name = "B3"
type = "binary"
weight = 3
description = "Recipe: `playwright` at 1280x800. 1. Sign in as the seeded principal librarian. 2. Open Programme 01 from the works rail with The Weir selected. 3. Tab until the bar ruler has focus, then hold Shift and press ArrowRight ten times so a span stays selected. 4. With browser_evaluate read the computed fill, background and border colours of the selected span element, taking a translucent tint's colour before its opacity is applied. 5. Screenshot the bar ruler. Pass: the selected span is drawn in a deep oxblood accent (a red hue leaning towards brown or purple at lightness 15% to 40%), not a bright red or a blue."

[criterion.annotations]
channel = "experience"
basis = "explicit"
