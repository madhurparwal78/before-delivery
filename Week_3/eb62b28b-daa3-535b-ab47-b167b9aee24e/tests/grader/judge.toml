[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server's configuration loading and every place that builds the database pool, the S3 client, the Kill Bill client and the mail transport. Any hard-coded host, URL, key, secret, username or password for a service is a defect, while the published port default and the published timer defaults are allowed; cite each defect as `file:line`. Pass: every service credential and address in the brief's configuration list is read from the environment with no literal fallback beyond the published defaults."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L934-L950, L928, L93"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 3
description = "Recipe: read the browser-side source and every server handler that renders HTML or returns configuration. A browser file that reads server environment values or imports the server configuration module, or a response or injected page script that carries a service value, is a defect; cite each as `file:line`. Pass: no browser-side file or server response carries a service credential or service address."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L934, L93"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 5
description = "Recipe: trace the join, cadence change, cancel and membership read from their route handlers to the Kill Bill client. A mock, stub, in-memory fake, environment-gated test mode, hard-coded date, or test-only endpoint that sets membership state is a defect; cite each as `file:line`. Pass: every traced membership path takes its state and dates from a real HTTP call to Kill Bill."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L756-L759, L572-L577, L93"

[[criterion]]
id = "S4"
name = "S4"
type = "binary"
weight = 3
description = "Recipe: trace report storage, attachment storage and mail delivery from their handlers to the storage and SMTP clients. A local-disk or in-memory stand-in, a branch that skips the real call, or a fake success path is a defect; cite each as `file:line`. Pass: reports and attachments reach a real S3-protocol client, with mail sent by a real SMTP transport fed from the Postgres pending-mail list."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L764-L777, L986, L93"

[[criterion]]
