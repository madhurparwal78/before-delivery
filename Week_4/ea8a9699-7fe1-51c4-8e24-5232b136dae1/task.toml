[task]
name = "oxbow-assembly/rushes"
version = "1.0.0"
description = "Rushes is a multi-brand visual reference curation workspace for in-house design teams. Its features are sealed brand workspaces, a masonry reference wall, frame plucking from video clips with server timecodes, ordered clusters, expiring freelancer review links, embargoed public releases in brand time with follower digests, a stable discovery feed, and pro seat plans billed through Kill Bill. It is backed by Postgres, MinIO, Kill Bill and Mailpit."
authors = [
    { name = "kunal.singh.int5", email = "kunal.singh.int5@ethara.ai" },
    { name = "Sonu Sharma", email = "sonu.sharma@ethara.ai" },
]
keywords = [
    "typescript",
    "multi-tenant",
    "video-frames",
    "embargo",
    "dst",
    "killbill",
    "minio",
    "mailpit",
    "concurrency",
    "accessibility",
    "responsive",
]

