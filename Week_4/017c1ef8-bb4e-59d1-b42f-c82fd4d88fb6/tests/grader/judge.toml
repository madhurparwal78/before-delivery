weight = 5
description = "Recipe: open the route that serves `/api/live`, then trace three changes (a stored message, a stored reaction and an application status change) from their write handlers to the stream, and search client code for `setInterval`, `setTimeout` loops and repeated `fetch` calls that re-read state. Allowed: relative-time label ticks, advancing the server's instant by elapsed time, typing and retry timers, and the server's own per-second time check. Pass: each traced change is pushed over the stream by the server from the write path after it is stored, with no client timer re-fetching it to guess at changed state."

