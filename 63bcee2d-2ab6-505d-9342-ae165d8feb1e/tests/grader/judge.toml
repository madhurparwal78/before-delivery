[judge]
judge = "codex"
model = "openai/gpt-5.6-sol"
version = "0.163.0"
cwd = "/judge-workspace"
timeout = 1200
mode = "batched"
samples = 3
guard = "penalize"
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "normal",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_press_key",
    "browser_resize",
    "browser_select_option",
    "browser_hover",
    "browser_drag",
    "browser_tabs",
    "browser_wait_for",
    "browser_mouse_wheel",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "reduced"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "reduced",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_press_key",
    "browser_resize",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "touch"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "touch",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_press_key",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "source"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "source-mcp",
]
allowed_tools = [
    "list_files",
    "read_file",
    "search_files",
]

[scoring]
aggregation = "weighted-mean"

[[criterion]]
id = "B1"
name = "B1"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800. 1. Sign in at /sign-in as the invented seed director avery.tsang@marrowhall.example with password Marrow-Hall-2026. 2. On /office (Rollouts), take a screenshot. 3. Use browser_evaluate to walk up from the table of projects to the page root (the html element) and read every non-transparent computed background-color on the way; panels and tables may carry their own fill, so the office ground is the outermost of them, nearest the root. Pass: the office ground is a warm plaster, a light off-white whose red channel is above its blue channel, rather than pure white or a neutral grey."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-59",
]
evidence = "screenshot"
cites = "L100, L443, L446"

[[criterion]]
id = "B2"
name = "B2"
type = "binary"
weight = 3
description = "Recipe: `playwright` at 1280x800, signed in as the seed director. 1. From Rollouts open MH-2601 and choose the Stages tab. 2. Take a screenshot. 3. Use browser_evaluate to list the grid rules along the edges of the Stages panel (the region that opens with the PL-01 Stages title block), where the panel meets the grid, the tab strip or another panel: each border, outline, box shadow, separator element or 1 px gap showing a background that runs along the panel's outer edge, with its width and computed colour. Lines inside the panel, such as those between its title block, sections or stage rows, and borders that outline a single control (buttons, tabs, text fields, badges), status shapes, notice bars and focus outlines are not grid rules. An edge with no rule drawn is not judged. Pass: every grid rule along the panel's edges is a hairline no wider than 1 px in a near-black ink with lightness below 40%."

[criterion.annotations]
