[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[services]]
name = "postgres"

[services.env]

[[services]]
name = "killbill"

[services.env]

[[services]]
name = "minio"

[services.env]

[[services]]
name = "mailpit"

[services.env]
MAIL_FROM = "Stationkeeper at Larder Row Kitchen <bookings@larderrow.test>"

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

