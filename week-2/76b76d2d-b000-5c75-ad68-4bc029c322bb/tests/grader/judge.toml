[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: Start from the checkout route handler and trace it to the calls that create the booking's invoice and PURCHASE payment. If the app writes its own HTTP client, read where that client builds its requests. If it uses a client package from npm, whose own code is outside the source view, read how the app configures that client and which of its calls checkout makes, and judge it on equal terms. A branch that returns a synthesised invoice or payment fails. Cite each finding as `file:line`. Pass: checkout's invoice and PURCHASE payment come only from Kill Bill requests sent to the base URL read from `KILLBILL_URL`."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L3, L696-L711, L795-L796"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: Trace the mail outbox worker from the point where it picks the head message to the point where it sends that message. A console logger, file writer or in-memory transport standing in for delivery fails. Cite each finding as `file:line`. Pass: outbox messages are delivered by a real SMTP client connecting to the host read from `SMTP_HOST`."

[criterion.annotations]
channel = "source"
