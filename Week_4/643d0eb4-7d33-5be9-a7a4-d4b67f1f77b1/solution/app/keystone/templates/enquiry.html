{% extends "base.html" %}
{% block title %}Sales enquiry · Keystone Tables{% endblock %}
{% block main %}
<section class="band"><div class="frame stack-lg">
  <h1>Sales enquiry</h1>
  <p class="prose">Tell us about your reporting tables. We record your enquiry against your work email and answer there.</p>
  <form id="enquiry-form" class="form-grid two narrow-none" method="post" action="/api/enquiries" novalidate style="max-width: 720px">
    <input type="hidden" name="form_token" value="{{ form_token }}">
    <div class="field"><label for="full_name">Full name</label><input class="input" id="full_name" name="full_name" autocomplete="name" required aria-required="true"><p class="error" id="err-full_name" hidden></p></div>
    <div class="field"><label for="work_email">Work email</label><input class="input" id="work_email" name="work_email" type="email" autocomplete="email" required aria-required="true"><p class="error" id="err-work_email" hidden></p></div>
    <div class="field"><label for="phone">Phone number</label><input class="input" id="phone" name="phone" type="tel" autocomplete="tel"><p class="error" id="err-phone" hidden></p></div>
    <div class="field"><label for="company">Company name</label><input class="input" id="company" name="company" autocomplete="organization" required aria-required="true"><p class="error" id="err-company" hidden></p></div>
    <div class="field"><label for="role">Role</label><input class="input" id="role" name="role" autocomplete="organization-title"><p class="error" id="err-role" hidden></p></div>
    <div class="field wide"><label for="message">Message</label><textarea class="textarea" id="message" name="message" maxlength="1200" required aria-required="true" aria-describedby="hint-message"></textarea><p class="hint" id="hint-message">Up to 1000 characters.</p><p class="error" id="err-message" hidden></p></div>
    <div class="wide btn-row"><button type="submit" class="btn btn-primary" id="enquiry-send">Send enquiry</button></div>
  </form>
  <div class="notice affirm" id="enquiry-status" role="status" hidden></div>
</div></section>
{% endblock %}
{% block scripts %}<script src="{{ asset('public.js') }}" defer></script>{% endblock %}
