name = "B4"
type = "binary"
weight = 3
description = "Recipe: `touch` at 375x812. 1) Sign in as the invented seed yard hand `hand@kerfwell.test` / `rack-hand-2026` and open `/yard`. 2) Type 2400 in `Length (mm)`, then enter Defect start 600, Defect end 900, choose `check` in `combobox \"Defect kind\"` and press `Add defect` (do not press Tag board). 3) Run browser_evaluate on the `[data-defect]` element inside `img \"Intake strip\"` to read its fill, stroke or pattern colours. 4) Take a screenshot of the strip. Pass: the zone is drawn as diagonal hatch lines in a dusty bark brown with medium-to-low lightness, orange-brown hue, lower saturation than the orange-red accent, not a flat solid block."

