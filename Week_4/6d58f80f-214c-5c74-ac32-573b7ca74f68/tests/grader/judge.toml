[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: find where the server reads its configuration and every place it builds a PostgreSQL, S3 or PocketBase client, then search the source for literal URLs, hosts, passwords, access keys and admin emails. The defaults the brief documents (port 4173, quota 100,000,000,000, upload TTL 86,400) are allowed, and so are the seed people's demo password and emails that Seed data publishes, in seed code only. Any hard-coded service URL, password, access key or admin email fails, cited as `file:line`. Pass: every service URL and credential is read from the environment variables the brief names."

