criteria = []
parameter_cases = []

[[requirements]]
id = "DP-58"
title = "Edits over a newer version are refused"
text = "Every closet item carries a version that rises on each write to it, an edit sent without the current version is refused with 428 or 412 and changes nothing, and the Edit dialog says so."
kind = "behavior"
primary = "pytest"
workflow = "edit-conflicts"
