id = "DP-56"
title = "Capacity edits and queue order"
text = "A capacity edit never drops below the going count and never loses a concurrent edit, and promotions take only the earliest guests in a queue where a guest who rejoins goes to the back."
kind = "behavior"
primary = "pytest"
workflow = "waitlist"
tests = [
    "test_app.py::test_wf_waitlist_capacity_edits",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-57"
title = "Access code lockout"
text = "Five wrong access codes from one member on one event within the lockout window answer every further attempt with 429 and `Retry-After`, counted atomically across instances."
kind = "behavior"
primary = "pytest"
workflow = "registration-rules"
tests = [
    "test_app.py::test_wf_registration_rules_lockout",
    "test_app.py::test_wf_registration_rules_lockout_ui",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-58"
title = "Guest records belong to their event"
text = "A guest decision acts only on a registration of the event in its path, and a guest id from another event or not a canonical positive whole number answers JSON not found and changes nothing."
kind = "behavior"
primary = "pytest"
workflow = "authorization"
tests = [
    "test_app.py::test_wf_authorization_foreign_guest",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-59"
title = "One message per send"
text = "A contact or report sent again with the same `Idempotency-Key` and body returns the first id and stores nothing new even under simultaneous sends, the same key with a different body is refused with 422, and the dialog resends its key after a failed send."
kind = "behavior"
primary = "pytest"
workflow = "communities"
tests = [
    "test_app.py::test_wf_communities_idempotent_send",
    "test_app.py::test_contact_dialog_retry",
]
criteria = []
parameter_cases = []

[[if_rules]]
id = "IF-01"
text = "Ship /app/run.json with \"_schema\": \"run-manifest-v1\" and string install, build and serve, where serve starts a production WSGI server in the foreground: not flask run, no debug or reload flag, and no nohup, setsid, disown or trailing &."
tests = [
    "test_app.py::test_if_run_manifest",
]
parameter_cases = []

[[if_rules]]
id = "IF-02"
text = "Write the three seeded logins and their shared password to /app/USER_README.md."
tests = [
    "test_app.py::test_if_user_readme",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Declare Flask as a dependency and ship no datastore client other than PostgreSQL's (no MongoDB, MySQL, SQLite, Redis, Supabase or Firebase client) among the shipped packages, meaning the production dependency tree: every package in requirements.txt, or the lockfile's non-dev group, together with their transitive dependencies."
tests = [
    "test_app.py::test_if_datastore_clients",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "Ship /app/THIRD_PARTY_NOTICES.md naming Alpine.js and every shipped package with its licence and where it came from; each licence is one of MIT, BSD-2-Clause, BSD-3-Clause, Apache-2.0, ISC, PSF-2.0, MPL-2.0 or LGPL-3.0."
tests = [
    "test_app.py::test_if_third_party_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "Pin every Python dependency to one exact version: every line of /app/requirements.txt reads name==version (extras allowed), or ship pyproject.toml with its lockfile (uv.lock, poetry.lock, pdm.lock or Pipfile.lock)."
tests = [
    "test_app.py::test_if_pinned_dependencies",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "Do not download, install or start a database or any other service while building; use only the PostgreSQL at DATABASE_URL."
tests = [
    "test_app.py::test_if_no_extra_services",
]
parameter_cases = []

