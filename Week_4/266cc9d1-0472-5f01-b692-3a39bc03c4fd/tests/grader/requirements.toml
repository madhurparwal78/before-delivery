[[requirements]]
id = "DP-50"
title = "One effect per press"
text = "Double-pressing Confirm submit, Resend link, New link, Withdraw link or Send decisions performs the action once, the button stays disabled while its request is pending, one submit dialog opening reuses one Idempotency-Key, and the announcement is the first request's outcome."
kind = "behavior"
primary = "pytest"
workflow = "submit-and-mail"
tests = [
    "test_app.py::test_wf_submit_and_mail_double_confirm",
    "test_app.py::test_wf_submit_and_mail_link_buttons",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-51"
title = "Honest decision state"
text = "A forester's Accept or Dispute shows as pressed only after the server stores it, a failed save keeps the stored decision and announces the published failure copy, a revoked or expired link replaces the page with its link-problem message, and a review closed elsewhere shows the decisions-final state."
kind = "behavior"
primary = "pytest"
workflow = "forester-decisions"
tests = [
    "test_app.py::test_wf_forester_decisions_failed_save",
    "test_app.py::test_review_link_problems_replace_page",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-52"
title = "Status checks preserve work"
text = "Status checks and the asset refreshes they trigger never close dialogs, clear typed values, move focus, collapse sheets, switch rail tabs or expanded rows, and never insert the storage alert more than once per outage."
kind = "behavior"
primary = "pytest"
workflow = "storage-outage"
tests = [
    "test_app.py::test_wf_storage_outage_work_survives",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-53"
title = "Live email state"
text = "Each review link reports whether its latest email is queued or sent, and the workspace link line switches from Email queued to Email sent in place on a status check once any app process delivers it."
kind = "behavior"
primary = "pytest"
