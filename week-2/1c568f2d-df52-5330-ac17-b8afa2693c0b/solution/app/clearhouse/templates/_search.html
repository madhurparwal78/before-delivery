{% from "_macros.html" import icon %}
{% macro search_well(name, id, value, placeholder, attr) -%}
<div class="well" role="search">
  {{ icon("search") }}
  <label class="sr-only" for="{{ id }}">{{ name }}</label>
  <input type="search" id="{{ id }}" name="q" value="{{ value }}" placeholder="{{ placeholder }}" autocomplete="off" {{ attr }}>
  <button type="button" class="well__clear tip" aria-label="Clear search" data-tip="Clear search" data-clear-search{% if not value %} hidden{% endif %}>{{ icon("cross") }}</button>
</div>
{%- endmacro %}
