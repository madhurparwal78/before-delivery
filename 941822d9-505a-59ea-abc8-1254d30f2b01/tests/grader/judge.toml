[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: 1. Read the server bootstrap and configuration modules, and every module that builds the Postgres pool, the Kill Bill client, the S3 client and the SMTP transport. 2. Grep the application source, excluding the provided service definitions and the seed users' shared password, for `process.env`, `localhost`, `127.0.0.1`, `5432`, `8080`, `9000`, `1025`, `minioadmin`, `admin`, `password`, `bob`, `lazar` and `credwell.test`. 3. Cite each defect as `file:line`. Pass: every service URL, credential and the mail From line come from the brief's environment variables with no literal fallback beyond the documented port 4173."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-05",
]
evidence = "file_line"
cites = "L559, L641-L649"

[[criterion]]
