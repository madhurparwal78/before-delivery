description = "Recipe: read the handlers, services, store functions and workers, and search for `panic(` and `log.Fatal` on any request path, and for errors from a store, provider or network call returned without any added context anywhere on their way up. Each such instance is a defect, and each defect is cited as `file:line`. Pass: every error on a request path is returned with wrapped context."

