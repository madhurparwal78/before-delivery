title = "Verification email in the account's language"
text = "Sign-up sends one verification email to Mailpit whose subject, body and language attribute are in the account's language, whatever the browser's language, and which holds exactly one link."
kind = "behavior"
primary = "pytest"
workflow = "language-roundtrip"
tests = [
    "test_app.py::test_wf_language_roundtrip_verification_email",
]
criteria = []
parameter_cases = [
    "en",
    "ja",
    "es",
]

