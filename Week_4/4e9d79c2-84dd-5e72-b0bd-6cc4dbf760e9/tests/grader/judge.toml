[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: Read the server's configuration code, then search the whole source, including browser-side code and committed configuration, for database, object-store and push credentials and connection addresses. The settings defaults the brief documents, its documented port and its seeded arranger passwords are not defects. A literal credential, or one reachable from browser-side code, fails. Cite each read and defect as `file:line`. Pass: Every credential and provider address is read from the environment at start."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L91, L983-L994, L1009, L1024"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: Trace the code paths behind storing a paper, sending a mail, rendering a document and telling a driver, down to the outgoing client call. A success path that records a result without that call fails, as does a stored or told state written before the provider confirms. The seeded invoice's record, which the brief writes at seed, is not a defect. Cite each call as `file:line`. Pass: Each of these paths makes a real network call to its provider, with no in-memory or local-disk stand-in."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L91, L855-L873, L963"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: Trace address lookup, routing, flight status, bank holidays and the operator directory from their callers to the outgoing request, then search browser-side code for those provider paths. A canned reply standing in for a provider fails, as does a browser-side provider call. Cite each call as `file:line`. Pass: Each of the five provider reads is made by server code against the configured base address with a wait capped at 5 seconds."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L91, L875-L881, L1009"

[[criterion]]
id = "S4"
name = "S4"
type = "binary"
weight = 3
description = "Recipe: Find where the bid window, quote end, short notice, deposit, hours breach and cancellation days are decided, then search browser-side code for device clock reads. Measuring `secondsAgo` for a queued press is the brief's published use of the phone's time and is not a defect, and neither is an early message from the server's clock while the server decides again. Cite each rule as `file:line`. Pass: Each of these rules is decided in server code, and no browser-side code decides one from the device clock."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L91, L372, L702, L822"

[[criterion]]
