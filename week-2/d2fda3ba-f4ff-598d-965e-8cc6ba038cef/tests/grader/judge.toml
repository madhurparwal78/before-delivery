[[criterion]]
id = "Q2"
name = "Q2"
type = "binary"
weight = 3
description = "Recipe: read the modules for revisions, cursors, envelopes, dossiers, boundary, preview links, billing and sweep. Synonyms that blur meaning, such as 'version' for revision, 'snapshot' for envelope or 'depth' for hop, count as a fail, cited as `file:line`. The brief's own wording, such as 'version history' or 'winning version', is not a blurring synonym. Pass: every domain identifier uses the brief's term for its concept."

[criterion.annotations]
channel = "quality"
