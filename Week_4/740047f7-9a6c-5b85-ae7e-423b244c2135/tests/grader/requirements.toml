title = "Farm erasure"
text = "Erasing a farm after typing its name removes it and everything under it from the console, search, exports, report links and MinIO, and an open report link page of that farm shows the does-not-exist message at its next re-check. The Erase farm dialog opens with focus on Cancel, Escape closes only that dialog and returns focus to Erase farm in Farm details, and the other device's Pens page drops the farm's row and cards in place."
