<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Flat drawing of the city for browsers without WebGL: a night skyline of lit windows. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0a1e"/>
      <stop offset=".7" stop-color="#3a2f66"/>
      <stop offset="1" stop-color="#0d0a1e"/>
    </linearGradient>
    <pattern id="lit" width="22" height="30" patternUnits="userSpaceOnUse">
      <rect x="6" y="8" width="9" height="12" fill="#ffc27a" opacity=".85"/>
    </pattern>
    <pattern id="dim" width="22" height="30" patternUnits="userSpaceOnUse">
      <rect x="6" y="8" width="9" height="12" fill="#f4a259" opacity=".35"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <g fill="#1d1840">
    <rect x="120" y="470" width="150" height="530"/><rect x="300" y="380" width="120" height="620"/>
    <rect x="450" y="520" width="170" height="480"/><rect x="660" y="240" width="110" height="760"/>
    <rect x="800" y="420" width="160" height="580"/><rect x="990" y="330" width="130" height="670"/>
    <rect x="1150" y="500" width="180" height="500"/><rect x="1360" y="400" width="140" height="600"/>
  </g>
  <g fill="url(#lit)">
    <rect x="120" y="470" width="150" height="530"/><rect x="660" y="240" width="110" height="760"/>
    <rect x="990" y="330" width="130" height="670"/><rect x="1360" y="400" width="140" height="600"/>
  </g>
  <g fill="url(#dim)">
    <rect x="300" y="380" width="120" height="620"/><rect x="450" y="520" width="170" height="480"/>
    <rect x="800" y="420" width="160" height="580"/><rect x="1150" y="500" width="180" height="500"/>
  </g>
  <g fill="#0c0a1d">
    <rect x="0" y="700" width="240" height="300"/><rect x="380" y="760" width="300" height="240"/>
    <rect x="860" y="720" width="260" height="280"/><rect x="1280" y="780" width="320" height="220"/>
  </g>
</svg>
