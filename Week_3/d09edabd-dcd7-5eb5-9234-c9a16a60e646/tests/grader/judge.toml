name = "S1"
type = "binary"
weight = 5
description = "Recipe: Start from the server entry named by the serve script and the config module it imports. Trace each published environment variable from where it is read to where each database, object-store, cache and mail client is built. Documented defaults are allowed: port 4173, the public-address fallback, the three timing defaults, instance label a, the mail From line and the seeded demo accounts. A literal connection string, endpoint, key or password outside those defaults is a defect, cited as `file:line`. Pass: Every database, object-store, cache and mail setting is read from its published environment variable."

