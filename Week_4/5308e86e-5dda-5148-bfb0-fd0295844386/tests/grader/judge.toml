name = "Q5"
type = "binary"
weight = 5
description = "Recipe: trace direct send, final approval, rejection, expiry, mark-paid, draw, transfer and recipient removal on the server. An in-process mutex, Map or cache standing in for database serialisation, or a write outside the transaction, counts as a fail. Cite each path as `file:line`. Pass: each money-moving path writes its balance change, feed row, status change and audit event in one database transaction."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L2093"

[[criterion]]
id = "Q6"
name = "Q6"
type = "binary"
weight = 3
description = "Recipe: search the source for commented-out blocks, unused exports, unreachable branches, interfaces or base classes with a single implementation, and routes or features not in the brief, including debug, seed or reset endpoints. The brief's own 'Nothing here yet' pages for Cards, Treasury and Bill Pay are in the brief. Each instance counts as a fail. Cite each as `file:line`. Pass: the source holds no dead, commented-out, unreachable or out-of-brief code."

[criterion.annotations]
