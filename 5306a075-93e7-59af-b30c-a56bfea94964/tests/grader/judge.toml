type = "binary"
weight = 3
description = "Recipe: find where the object storage client is constructed and every call that names a bucket. A literal bucket name, endpoint, region, access key, secret key or forced path-style value counts as a fail, while the brief's fixed object key prefixes are allowed; cite it as file:line. Pass: every storage client setting, bucket references included, comes from the S3_* environment values."

[criterion.annotations]
