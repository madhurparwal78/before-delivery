[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: open the server configuration code and list every variable of the configuration table, service addresses and credentials included. Search the other server files for literal copies of their default values. Constants the brief fixes without a variable are allowed, such as the custom text limits, the room seat count, the board row count, the resend gap and the fast-gap share. Cite each defect as `file:line`. Pass: every variable of the configuration table is read from the environment at start with no hard-coded copy of its value elsewhere in the server."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-67",
]
evidence = "file_line"
cites = "L813, L873-L896"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: read the handler of `GET /api/config`. Search the client source for `process.env`, the grading key, the database address, mail settings and key, password or token literals. Check the bundle definitions for server settings injected into the page. Cite each defect as `file:line`. Pass: no credential or server-only setting reaches client code or the `/api/config` response."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-67",
]
evidence = "file_line"
cites = "L610, L873, L911"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: read the two `/api/grading/` handlers and every place the grading key is compared. Search the server for other routes, flags or branches that exist only for tests, such as a debug route, a bypass header, a fake clock or a skipped check. The documented default grading key is allowed as the fallback. Cite each defect as `file:line`. Pass: the only test-oriented server paths are the two grading routes, each guarded by the `X-Grading-Key` comparison."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-67",
]
evidence = "file_line"
cites = "L631-L632, L646-L649, L882"

[[criterion]]
id = "S4"
name = "S4"
type = "binary"
weight = 3
description = "Recipe: find where the verification and reset mail bodies are composed and trace how each link is built. A link built from a request header or a literal host is a defect. The documented default for the public URL setting is allowed. Cite each defect as `file:line`. Pass: every mailed link is built from the public URL setting."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-67",
]
evidence = "file_line"
cites = "L828-L830, L880"

[[criterion]]
id = "Q1"
name = "Q1"
type = "binary"
weight = 5
description = "Recipe: find the module that applies a keystroke log to words (letters, Space, Backspace, CtrlBackspace, test end, accuracy, raw speed, per-second values). Trace its importers. Search client and server for a second copy of these rules, such as another Backspace handler or another accuracy formula. Cite each second copy as `file:line`. Pass: the typing rules exist in one module imported by the sheet, the carbon replay, the race page and the server replay."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L653, L938"

[[criterion]]
id = "Q2"
name = "Q2"
type = "binary"
weight = 5
description = "Recipe: locate where each of these rules is decided: run check order, run state changes, personal best, board eligibility, seat claims, lobby release, host handover, room state changes. Look for a second place that re-decides any of them, such as eligibility filtered in both a query and a route. Cite each duplicate as `file:line`. Pass: each of those rules is decided in exactly one place."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L938"

[[criterion]]
id = "Q3"
name = "Q3"
type = "binary"
weight = 3
description = "Recipe: read the `tsconfig` files for strict mode. Search the source for `any`, `as any`, `@ts-ignore`, `@ts-nocheck`, `@ts-expect-error` and non-null assertions on domain values such as ticket, keystroke log, verdict, proof key, room and racer. Cite each defect as `file:line`. Pass: no domain value is typed `any` or has a suppressed type check."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L936"

[[criterion]]
id = "Q4"
name = "Q4"
type = "binary"
weight = 3
description = "Recipe: search the source for commented-out blocks, unused exports and unreachable branches. Treat a guard for a state the brief rules make impossible as unreachable. Treat a route or screen the brief does not list as unused. Cite each instance as `file:line`. Pass: the source holds no commented-out, unreachable or unused code."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L939-L940"

[[criterion]]
id = "Q5"
name = "Q5"
type = "binary"
weight = 3
description = "Recipe: search the source for interfaces, base classes, factories, registries and wrappers, then count the implementations of each. Cite each abstraction with one implementation as `file:line`. Pass: no abstraction in the source has only one implementation."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L939"

[[criterion]]
id = "Q6"
name = "Q6"
type = "binary"
weight = 5
description = "Recipe: read the code for seat claims, ticket submissions and sign-in failure counts. Look for read-then-write sequences, sleeps, retries or in-memory flags that stand in for a lock. Cite each defect as `file:line`. Pass: seat claims, ticket submissions and sign-in failure counts are each made safe by a visible database constraint, transaction or single-process guard."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L751, L780, L792, L942"

[[criterion]]
id = "Q7"
name = "Q7"
type = "binary"
weight = 3
description = "Recipe: in the client, find where a test starts its timers (end, readout tick, focus warning, resend loop) and requests (ticket, run submission, settings save), and where they are cancelled on restart, Next test, command line and navigation away. Look for timers started outside that owner and for stale responses handled by timing. Cite each defect as `file:line`. Pass: the timers and requests of a test are cancelled in one visible place with stale responses discarded by an explicit check."

[criterion.annotations]
