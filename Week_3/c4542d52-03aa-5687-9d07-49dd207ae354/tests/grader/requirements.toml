    "portal-vesting",
    "grant-board",
    "grant-offer",
    "exercise",
    "leaver-window",
    "tender",
    "cap-table",
    "round-scenario",
    "valuations",
    "access",
    "live-sync",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
