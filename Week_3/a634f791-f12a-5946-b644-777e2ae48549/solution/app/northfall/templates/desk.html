{% import "_icons.html" as icons -%}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>The reference desk · Northfall</title>
  <link rel="icon" href="/static/img/monogram.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/inter-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <style>{{ stylesheet }}</style>
</head>
<body class="desk-page" data-public-url="{{ public_url }}" data-text-fields="{{ text_fields|join(' ') }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="desk-bar">
    <a class="monogram" href="/"><span class="monogram-mark" aria-hidden="true">N</span><span class="monogram-word">Northfall</span></a>
    <p class="desk-bar-label">Reference desk</p>
  </header>
  <main id="main" class="desk" tabindex="-1">
    <h1 class="desk-title">The reference desk</h1>
    <div class="desk-messages" role="status" aria-label="Desk messages"></div>

    <section class="sign-in" aria-labelledby="sign-in-heading">
      <h2 id="sign-in-heading" class="desk-heading">Sign in to the desk</h2>
      <form class="sign-in-form" aria-label="Sign in" novalidate>
        <div class="field">
          <label for="sign-in-email">Email</label>
          <input id="sign-in-email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="sign-in-password">Password</label>
          <input id="sign-in-password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p class="form-alert" role="alert"></p>
        <button class="button" type="submit"><span class="button-label">Sign in</span>{{ icons.arrow() }}</button>
      </form>
    </section>

    <div class="workspace" hidden>
      <div class="desk-grid">
        <section class="desk-references" aria-labelledby="references-heading">
          <div class="desk-section-head">
            <h2 id="references-heading" class="desk-heading" tabindex="-1">References</h2>
            <p class="desk-totals"></p>
            <button class="button button-quiet" type="button" data-action="new">New reference{{ icons.arrow() }}</button>
          </div>
          <ul class="desk-list" aria-label="References"></ul>
        </section>
        <div class="editor-slot"><p class="editor-hint">Choose Edit on a row, or New reference, to open the editor here.</p></div>
      </div>
      <section class="desk-enquiries" aria-labelledby="enquiries-heading">
        <div class="desk-section-head">
          <h2 id="enquiries-heading" class="desk-heading" tabindex="-1">Enquiries</h2>
          <p class="enquiry-count"></p>
        </div>
        <ul class="enquiry-list" aria-label="Enquiries"></ul>
      </section>
    </div>
  </main>

  <template id="editor-template">
    <section class="editor">
      <form class="editor-form" aria-label="Reference editor" novalidate>
        <h3 class="editor-heading"></h3>
        <div class="editor-fields">
          <div class="field field-wide"><label for="edit-title">Title</label><input id="edit-title" name="title" type="text" aria-describedby="edit-title-error"><p class="field-error" id="edit-title-error" data-error-for="title"></p></div>
          <div class="field"><label for="edit-sector">Sector</label><input id="edit-sector" name="sector" type="text" autocapitalize="none" aria-describedby="edit-sector-error"><p class="field-error" id="edit-sector-error" data-error-for="sector"></p></div>
          <div class="field"><label for="edit-customer">Customer</label><input id="edit-customer" name="customer" type="text" aria-describedby="edit-customer-error"><p class="field-error" id="edit-customer-error" data-error-for="customer"></p></div>
          <div class="field field-wide"><label for="edit-summary">Summary</label><textarea id="edit-summary" name="summary" rows="3" aria-describedby="edit-summary-error"></textarea><p class="field-error" id="edit-summary-error" data-error-for="summary"></p></div>
          <div class="field field-wide"><label for="edit-challenge">Challenge</label><textarea id="edit-challenge" name="challenge" rows="3" aria-describedby="edit-challenge-error"></textarea><p class="field-error" id="edit-challenge-error" data-error-for="challenge"></p></div>
          <div class="field field-wide"><label for="edit-work">Work</label><textarea id="edit-work" name="work" rows="3" aria-describedby="edit-work-error"></textarea><p class="field-error" id="edit-work-error" data-error-for="work"></p></div>
          <fieldset class="field-wide figure-fields">
            <legend>Result figures</legend>
            <p class="figure-count"></p>
            <div class="figure-rows"></div>
            <p class="field-error" id="edit-figures-error" data-error-for="figures"></p>
            <button class="button button-quiet" type="button" data-action="add-figure" aria-describedby="edit-figures-error">Add a figure{{ icons.arrow() }}</button>
          </fieldset>
          <div class="field field-wide"><label for="edit-quote">Quote</label><textarea id="edit-quote" name="quote" rows="2" aria-describedby="edit-quote-error"></textarea><p class="field-error" id="edit-quote-error" data-error-for="quote"></p></div>
          <div class="field"><label for="edit-quote-speaker">Quote speaker</label><input id="edit-quote-speaker" name="quote_speaker" type="text" aria-describedby="edit-quote_speaker-error"><p class="field-error" id="edit-quote_speaker-error" data-error-for="quote_speaker"></p></div>
          <div class="field"><label for="edit-quote-role">Quote role</label><input id="edit-quote-role" name="quote_role" type="text" aria-describedby="edit-quote_role-error"><p class="field-error" id="edit-quote_role-error" data-error-for="quote_role"></p></div>
          <div class="field field-wide"><label for="edit-title-fi">Finnish title</label><input id="edit-title-fi" name="title_fi" type="text" lang="fi" aria-describedby="edit-title_fi-error"><p class="field-error" id="edit-title_fi-error" data-error-for="title_fi"></p></div>
          <div class="field field-wide"><label for="edit-body-fi">Finnish body</label><textarea id="edit-body-fi" name="body_fi" rows="4" lang="fi" aria-describedby="edit-body_fi-error"></textarea><p class="field-error" id="edit-body_fi-error" data-error-for="body_fi"></p></div>
        </div>
        <div class="editor-actions">
          <button class="button" type="submit"><span class="button-label"></span>{{ icons.arrow() }}</button>
        </div>
        <div class="clearance"></div>
      </form>
    </section>
  </template>

  <template id="clearance-steward-template">
    <fieldset class="clearance-fields">
      <legend>Clearance window</legend>
      <div class="field"><label for="clearance-from">Cleared from</label><input id="clearance-from" name="clearance_from" type="text" placeholder="YYYY-MM-DD" aria-describedby="clearance-from-error"><p class="field-error" id="clearance-from-error" data-error-for="clearance_from"></p></div>
      <div class="field"><label for="clearance-until">Cleared until</label><input id="clearance-until" name="clearance_until" type="text" placeholder="YYYY-MM-DD" aria-describedby="clearance-until-error"><p class="field-error" id="clearance-until-error" data-error-for="clearance_until"></p></div>
      <button class="button" type="button" data-action="save-window">Save the clearance window{{ icons.arrow() }}</button>
    </fieldset>
  </template>

  <template id="figure-template">
    <div class="figure-row">
      <div class="field"><label></label><input type="text" data-figure="label" aria-describedby="edit-figures-error"></div>
      <div class="field"><label></label><input type="text" data-figure="value" aria-describedby="edit-figures-error"></div>
      <button class="button button-quiet" type="button" data-action="remove-figure">Remove{{ icons.arrow() }}</button>
    </div>
  </template>

  <template id="arrow-template">{{ icons.arrow() }}</template>
  <script src="/static/desk.js"></script>
</body>
</html>
