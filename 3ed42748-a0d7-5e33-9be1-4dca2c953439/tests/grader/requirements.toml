port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[outages]]
id = "short-holds"
port = 4176
url_env = "APP_SHORT_HOLDS_URL"

[outages.env]
RUSH_HOLD_SECONDS = "4"
POSTBOX_KEY_TTL_SECONDS = "5"
POSTCARD_MAIL_WINDOW_SECONDS = "20"

[[requirements]]
