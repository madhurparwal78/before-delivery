id = "DP-02"
title = "Seed data"
text = "On first start the app seeds the two studio accounts, the eight cases and the seven inquiries of Seed data with their fixture status tokens into PostgreSQL exactly once, with each seeded inquiry's history and version consistent with its status, and seeding sends no email."
