criteria = []
parameter_cases = []

[[requirements]]
id = "DP-15"
title = "Keyboard-only identify and quote"
text = "The operator completes sign-in, identification, quoting and the decline dialog with the keyboard alone, with a visible focus ring on every focused control and Shift+Tab retracing each step."
kind = "behavior"
