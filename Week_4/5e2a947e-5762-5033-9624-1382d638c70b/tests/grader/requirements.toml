[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[services]]
name = "postgres"

[services.env]
SPRIG_GRADING = "1"
SPRIG_PRESENCE_TIMEOUT_MS = "3000"
SPRIG_VERSION_INTERVAL_MS = "3600000"
SPRIG_PRESENTER_GRACE_MS = "3000"
SPRIG_SESSION_TTL_MS = "604800000"
SPRIG_OP_WINDOW = "1000"
SPRIG_VIRTUAL_FROM = "300"
SPRIG_DOM_MARGIN_PX = "200"
SPRIG_DOM_CEILING = "400"
SPRIG_ATTACH_MAX_BYTES = "200000"
SPRIG_MAP_QUOTA_BYTES = "500000"
SPRIG_OUTLINE_MAX_BYTES = "1000000"
SPRIG_EXPORT_STEP_MS = "200"
SPRIG_OP_RATE = "100000"
SPRIG_LOGIN_RATE = "1000"
SPRIG_TOAST_MS = "5000"
SPRIG_UNDO_DEPTH = "100"

[[services]]
name = "minio"

[services.env]

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

