]
evidence = "file_line"
cites = "L949, L1148"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 5
description = "Recipe: read the search handler and indexer, the image and evidence upload handlers and the mail sender. Search must call a Meilisearch client with the request's filters, uploads must write an object through an S3 client and read its size back before inserting the record, and mail must go through an SMTP transport (the documented PostgreSQL fallback listing is allowed). A stub, mock or in-memory stand-in fails. Pass: each of search, object storage, mail runs through a real client library call."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L950-L978"

