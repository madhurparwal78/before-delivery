schema_version = "1.4"

[[artifacts]]
source = "/app"
exclude = [
    "node_modules",
    ".git",
]

[task]
name = "deku/efoil-build-checkout-vb"
version = "1.0.0"
description = "Storefront and order system for an invented electric hydrofoil maker: a fit quiz kept in the address, a WebGL board configurator with pinned camera poses, a ride-time estimator and part swap choreography, exact integer pricing and financing, a capped and shareable cart, checkout to six countries with split dangerous goods fees and Canadian provincial tax components, idempotent orders with itemised and attributed Kill Bill invoices, warehouse ship-by dates, races for the last unit, board registration and warranty, trade-ins that expire to the second, demo days across time zones, callbacks queued while mail is down, guarded lookups, paged staff lists and role-based staff screens."
authors = [
    { name = "raja.kumarint17", email = "raja.kumarint17@ethara.ai" },
]
keywords = [
    "ecommerce",
    "configurator",
    "webgl",
    "three-d",
    "checkout",
    "tax",
    "dangerous-goods",
    "financing",
    "idempotency",
    "concurrency",
    "time-zones",
    "killbill",
    "mailpit",
    "postgres",
    "accessibility",
    "motion",
]

[metadata]
uuid_v5 = "3a79fa7f-3ce1-51e0-9053-4f6b6bf1fa6e"
identity_namespace_url = "https://tasks.example/deku/efoil-build-checkout-vb/1.0.0"
category = "Greenfield"
domain = "ecommerce"
archetype = "storefront-with-configurator-and-staff-console"
language = "TypeScript"
design_direction = "calm monochrome storefront with one shallow-water teal accent, drawn hero, studio-lit 3D configurator"
created_at = "2026-10-29"
service_profile = "postgres+mailpit+killbill"
harbor_version = "0.24.0"
grader_version = "rewardkit-0.2.3"
contract_version = "1.0.0"
requirements_registry = "tests/grader/requirements.toml"
mandatory_requirement_count = 84
workflow_count = 15
rubric_criterion_count = 23
rubric_total_weight = 83
if_constraint_count = 6
scoring_policy = "reward=pytest-outcome-pass-rate;if_score+rubric+quality+combined_score-separate;binary-rubric-5/3/1"
self_contained = true
builds_from_source = true
null_floor = 0.0
platforms = [
    "linux/amd64",
    "linux/arm64",
]

[agent]
timeout_sec = 21600.0
network_mode = "public"

[environment]
os = "linux"
cpus = 4
memory_mb = 4096
storage_mb = 20480
network_mode = "public"
build_timeout_sec = 3600.0

[verifier]
environment_mode = "separate"
timeout_sec = 21600.0

[verifier.env]
JUDGE_SECRET = "${JUDGE_SECRET:-}"
JUDGE_URL = "${JUDGE_URL:-http://host.docker.internal:8790}"
