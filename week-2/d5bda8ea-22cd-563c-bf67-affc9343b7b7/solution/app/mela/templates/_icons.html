{# Original thin line icons, drawn in the current text colour at the size of the text beside them. #}
{% macro icon(name, size=18, label=None) -%}
<svg class="icon icon-{{ name }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
     {%- if label %} role="img" aria-label="{{ label }}"{% else %} aria-hidden="true" focusable="false"{% endif %}>
  {%- if name == "pin" %}<path d="M12 21.5c-4.2-4.6-6.8-8.3-6.8-11.6a6.8 6.8 0 0 1 13.6 0c0 3.3-2.6 7-6.8 11.6Z"/><circle cx="12" cy="9.8" r="2.4"/>
  {%- elif name == "chevron" %}<path d="m9.5 5.5 6.5 6.5-6.5 6.5"/>
  {%- elif name == "sparkle" %}<path d="M12 2.5c.7 5.6 3.9 8.8 9.5 9.5-5.6.7-8.8 3.9-9.5 9.5-.7-5.6-3.9-8.8-9.5-9.5 5.6-.7 8.8-3.9 9.5-9.5Z"/>
  {%- elif name == "hash" %}<path d="M9.5 3.5 7.5 20.5M16.5 3.5l-2 17M4 8.5h16.5M3.5 15.5H20"/>
  {%- elif name == "arrow" %}<path d="M7 17 17 7M8.5 7H17v8.5"/>
  {%- elif name == "door" %}<path d="M5 21V4.5c0-.6.4-1 1-1h9.5c.6 0 1 .4 1 1V21M3 21h18M16.5 6.5l3 .8V21"/><circle cx="13" cy="12.5" r=".9"/>
  {%- elif name == "calendar" %}<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10.5h17"/>
  {%- elif name == "clock" %}<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
  {%- elif name == "users" %}<circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19.5c.6-3.2 2.7-5 5.5-5s4.9 1.8 5.5 5M15.5 5.6a3 3 0 0 1 0 5.8M17.5 14.8c1.6.7 2.6 2.3 3 4.7"/>
  {%- elif name == "close" %}<path d="M6 6l12 12M18 6 6 18"/>
  {%- elif name == "check" %}<path d="m5 12.5 4.5 4.5L19 7.5"/>
  {%- elif name == "flag" %}<path d="M5.5 21V4M5.5 4.5h11l-2 4 2 4h-11"/>
  {%- elif name == "mail" %}<rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="m4.5 7 7.5 6 7.5-6"/>
  {%- elif name == "lock" %}<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>
  {%- elif name == "globe" %}<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.3 2.4 3.4 5.2 3.4 8.5s-1.1 6.1-3.4 8.5c-2.3-2.4-3.4-5.2-3.4-8.5S9.7 5.9 12 3.5Z"/>
  {%- endif %}
</svg>
{%- endmacro %}

{% macro mark(size=22) -%}
<svg class="mark" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <path fill="currentColor" d="M12 1.5c.8 6.3 4.2 9.7 10.5 10.5-6.3.8-9.7 4.2-10.5 10.5C11.2 16.2 7.8 12.8 1.5 12 7.8 11.2 11.2 7.8 12 1.5Z"/>
</svg>
{%- endmacro %}
