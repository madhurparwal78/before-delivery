[[criterion]]
id = "B11"
name = "B11"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800. 1) Sign in at `/signin` as the seeded islander Marrow Quay (marrow@lowtide.test, password Saltpan-Marrow-27), who is already verified. 2) On that signed-in page, run this script once in the page (for example with the browser's evaluate tool). It scouts a match through the app's own API, locks it, deploys two Saltjacks at tick 0 on tidal-ring cell (0, 19) and finalizes, all within seconds: `async () => { const s = await (await fetch('/api/session')).json(); const h = k => ({'Content-Type': 'application/json', 'X-CSRF-Token': s.csrfToken, 'Idempotency-Key': 'judge-' + k + '-' + Date.now()}); const m = (await (await fetch('/api/scout/next')).json()).match; const r = await (await fetch('/api/raids', {method: 'POST', headers: h('lock'), body: JSON.stringify({villageId: m.villageId})})).json(); await fetch('/api/raids/' + r.id + '/deploys', {method: 'POST', headers: h('deploy'), body: JSON.stringify({deploys: [{tick: 0, unit: 'saltjack', x: 0, y: 19}, {tick: 0, unit: 'saltjack', x: 0, y: 19}]})}); const f = await (await fetch('/api/raids/' + r.id + '/finalize', {method: 'POST', headers: h('finalize'), body: '{}'})).json(); return {raidId: r.id, state: f.state, destruction: f.result && f.result.destruction}; }`. 3) It returns `raidId` and `state`. If it throws or `state` is not `resolved`, sign out and redo steps 1 and 2 as Tamsin Rook (tamsin@lowtide.test, password Saltpan-Tamsin-27), then as Wren Sallow (wren@lowtide.test, password Saltpan-Wren-27). 3b) Open `/raids/<raidId>/replay`. 4) On the replay screen, wait for the ready notice and screenshot the full viewport. Pass: the Wake dial is a ring centred at the bottom with one orange bead on it and an orange monospaced tick counter inside it."

