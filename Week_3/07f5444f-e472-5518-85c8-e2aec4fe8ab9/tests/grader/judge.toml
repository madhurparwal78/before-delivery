type = "binary"
weight = 3
description = "Recipe: trace how API handlers produce errors, from the boundary checks through authentication, lookup, role checks, replay, state conflicts and validation. A handler that writes its own error JSON, or validates before lookup, fails, cite it as file:line. Pass: every API error is produced through one shared error helper applied in the brief's single error order."

[criterion.annotations]
channel = "quality"
