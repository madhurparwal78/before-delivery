id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server start-up and configuration code and the database and object-store client setup, then search every source file for literal connection strings, endpoints, keys, secrets and bucket names; the published port default and the settings-table defaults are allowed. Cite each defect as `file:line`. Pass: every service credential and URL is read from the process environment at start."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-11",
]
evidence = "file_line"
cites = "L1109-L1138"

