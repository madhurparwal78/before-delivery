[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server configuration module and every place that builds a client for PostgreSQL, PocketBase, the S3 store, Kill Bill and SMTP. Search the source for process.env, localhost, 127.0.0.1, minioadmin and literal passwords or secrets. The documented defaults are allowed: port 4173 or APP_PUBLIC_PORT, the APP_PUBLIC_URL default, the three time-rule defaults and the documented MAIL_FROM value. Seeded member passwords, agent token secrets and signing secrets are seed data, not service credentials. Cite each violation as file:line. Pass: every service setting is read from the environment with no hard-coded fallback beyond the documented defaults listed above."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-57",
]
evidence = "file_line"
cites = "L1079-L1081, L1085-L1098, L987"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: trace the billing plan preview, plan change and seats routes from their handlers to the Kill Bill client. Any day-count, price-ratio or price-table calculation that produces a shown or charged amount fails, cited as file:line. Pass: every proration amount these routes return comes from a Kill Bill invoice response fetched over HTTP from KILLBILL_URL."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-57",
]
evidence = "file_line"
cites = "L863-L864, L977-L979"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 5
description = "Recipe: find the browser code for the editor Viewport, the review page and the embed page. Trace from the fetched graph (the scene graph endpoint, the review endpoint and the embed endpoint) to the render loop. A static image, a canned scene, CSS 3D transforms or a 2D canvas in place of WebGL fails. Cite the rendering path as file:line. Pass: all three views draw 3D objects built from the fetched graph's nodes through a WebGL renderer."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
