[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "search-down"
port = 4174
url_env = "APP_SEARCH_DOWN_URL"

[outages.env]
MEILISEARCH_URL = "http://127.0.0.1:9"

[[outages]]
id = "storage-down"
port = 4175
url_env = "APP_STORAGE_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "printing-down"
port = 4176
url_env = "APP_PRINTING_DOWN_URL"

[outages.env]
GOTENBERG_URL = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_printdown"
S3_BUCKET = "${S3_BUCKET}-printdown"
MEILISEARCH_INDEX = "references_printdown"

[[outages]]
id = "twin"
port = 4177
url_env = "APP_TWIN_URL"

[outages.env]

[[outages]]
id = "clock-dawn"
port = 4178
url_env = "APP_CLOCK_DAWN_URL"

