[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 5
description = "Recipe: Read the database module and the persistence code for holds, bookings, step-up state, idempotency records and the outbox. Search for module-level `Map`, `Set`, array or object stores holding these records. A store that the app treats as the record of truth for any of them fails. Per-instance scheduling state that only times this instance's own outbox delivery and retries, such as a retry timer or an in-flight marker for its head message, is not authoritative and does not count while each message's state lives in Postgres. Cite each failing store as `file:line`. Pass: no in-process store keeps authoritative hold, booking, step-up, idempotency or outbox state outside Postgres."

[criterion.annotations]
