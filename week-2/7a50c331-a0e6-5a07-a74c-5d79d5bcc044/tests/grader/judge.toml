name = "Q5"
type = "binary"
weight = 3
description = "Recipe: read the ingest, restore and delete write paths and two audited actions, member add and key rotation. Separate commits for writes that belong together count as a defect. Pass: each write log entry and each audit event commits in the same transaction as the change it belongs to."

[criterion.annotations]
