type = "binary"
weight = 5
description = "Recipe: read `package.json` and search the browser source for animation code: Motion imports, other animation packages (GSAP, anime.js, react-spring, velocity, direct popmotion), CSS `@keyframes`, CSS `transition` or `animation` declarations, `element.animate(` and `requestAnimationFrame` tweens. Any animation path outside Motion and the three.js render loop counts as a failure; cite each as `file:line`. Pass: every browser animation runs through the Motion library apart from the three.js render loop."

