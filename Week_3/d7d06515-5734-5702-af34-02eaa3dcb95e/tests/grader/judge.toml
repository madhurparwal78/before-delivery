[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the source for DXF upload, version restore, export rendering, Pro quote, invite, confirmation and trace-submitted mail. For each, find the line that sets the Stored, Ready, sent or Notice sent state and the line that awaits the provider answer (MinIO put plus size check, SMTP acceptance). A state set before that answer, a catch that still reports success or a constant status fails, so cite each as `file:line`. Pass: each Stored, Ready, sent and Notice sent state is written only after the provider answer confirms the object or message."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L1201, L1336, L1412-L1413, L1562"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 3
description = "Recipe: search the source for provider URLs, keys, passwords, bucket names and mail addresses, then read the configuration module and the code that serves pages and API responses. A literal credential, a provider value sent to the browser or a configuration variable of the brief that is ignored fails, so cite each as `file:line`. Defaults the brief documents are allowed: port 4173, the APP_PUBLIC_URL fallback to localhost on the port, the timer and limit defaults, UTC and mm, and ignoring any observer variable. Pass: every provider URL, key and credential, and every variable in the Time and limits table, is read from the environment with no secret in the source or sent to the browser."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L1511-L1525, L1397, L1535-L1536"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 5
description = "Recipe: start from the event stream handlers and the presence code, then trace a saved base change, a link status change and a presence update to the Valkey publish, subscribe and key calls. Per-connection lists of open streams in memory are allowed. Presence kept only in process memory, a fan-out that skips Valkey, a file written for state or a second datastore fails, so cite each as `file:line`. Pass: live sync and presence run through Valkey with no application state kept on the local file system or in another datastore."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L1415-L1421, L1549, L1562"

[[criterion]]
id = "S4"
name = "S4"
type = "binary"
weight = 3
description = "Recipe: search the source for direct system time reads and read the clock module, the grading routes and the code for trial days left, link expiry, confirmation lifetime, lockout, invite cooldown, presence idle and issue date. A time rule that reads system time instead of the workspace clock, or a grading route not gated by the grading switch, fails, so cite each as `file:line`. Pass: every time rule reads one workspace clock source and the grading routes exist only behind the grading switch."

[criterion.annotations]
channel = "source"
