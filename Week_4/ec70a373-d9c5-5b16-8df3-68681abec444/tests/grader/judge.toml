[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: search the server source for environment reads and for literal hosts, ports, user names, passwords and keys tied to PostgreSQL, Kill Bill, S3 and SMTP. The defaults the brief documents (the public port, the hold, link, session and sign-in window lifetimes, and the sender address) are allowed. Cite each read and each defect as file:line. Pass: every service URL and credential listed in Configuration and secrets is read from its environment variable with no hard-coded fallback value."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L161, L1487, L1653-L1670"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: trace the pack purchase and the check-out overage code to their Kill Bill calls. Cite the account lookup by external key, the PURCHASE payment, the external-charge invoice creation, the commit and the read-back of the committed invoice as file:line. A stub, a fake client or an app-generated payment or invoice id fails. Pass: both flows send real authenticated HTTP requests to the configured Kill Bill URL and take every payment and invoice id from Kill Bill's responses."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L161, L1436-L1458"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: trace document upload, document file download and visit-log snapshot code to the storage client. Cite the client construction and the put, head, get and delete calls as file:line. Writing files to local disk or an in-memory map instead fails. Pass: an S3 client built from the configured storage settings performs every object write, HEAD confirmation, read and cleanup against the configured bucket."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L161, L1462-L1483"

[[criterion]]
id = "S4"
name = "S4"
type = "binary"
weight = 3
description = "Recipe: trace one email event (booking confirmed) from its outbox insert to delivery. Cite the insert in the event's transaction and the SMTP send as file:line. Logging, writing files or marking messages sent without an SMTP call fails. Pass: messages are written to a PostgreSQL outbox and delivered by a real SMTP transport to the configured SMTP host and port from the configured sender."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
