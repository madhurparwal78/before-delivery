]
rubric_total_weight = 76
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "minio", env = {} },
    { name = "killbill", env = {} },
]

[criterion_weights]
B1 = 3
B2 = 3
B3 = 5
B4 = 3
B5 = 5
B6 = 3
B7 = 3
B8 = 3
B9 = 3
B10 = 3
B11 = 3
