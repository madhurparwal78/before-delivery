[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server config module and every file that builds the Postgres pool, the Kill Bill client, the S3/MinIO client and the SMTP transport. Search the server source for literal hosts, ports and secrets such as 'postgres://', 'localhost', '127.0.0.1', ':8080', ':9000', ':1025' and 'minioadmin'. Defaults the brief documents are allowed: port 4173, HOLD_TTL_SECONDS 600 and BINDER_LINK_TTL_SECONDS 604800. A fallback such as `process.env.KILLBILL_URL ?? 'http://localhost:8080'` counts as a defect, cite each as file:line. Pass: every service URL and credential is read from process.env with no literal fallback value."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-58",
]
evidence = "file_line"
cites = "L141, L839-L849"

