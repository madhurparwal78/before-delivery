[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server configuration module and every place that builds a Kill Bill, S3 or SMTP client. Search the source for provider host names, ports, access keys, passwords, API keys and secrets as string literals, treating the app's own port default with its environment override and the documented detention length default as allowed. Cite each environment read and each violation as `file:line`. Pass: every provider URL, host, port and credential is read from the environment variables the brief names, with no literal fallback value in the repository."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L88, L930-L939, L964"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: trace the billing code from a billing event to charge posting, then from the issue route to invoice commit. Treat a state set before or without the provider call, a stubbed client or a locally generated invoice number as a failure. Cite the provider calls and state writes as `file:line`. Pass: the invoice's `posted` charge state, its `issued` state, number plus balance are each written only after a successful Kill Bill HTTP response that supplies them."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L88, L771-L788"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 5
description = "Recipe: trace the photo and pilot-card upload routes to the object store, then the download routes back. Treat a record written before the put, a local-disk or in-memory substitute, or a checksum taken from anything other than the submitted bytes as a failure. Cite as `file:line`. Pass: a photo or card record with its id is created only after a confirmed S3 put to the configured bucket, with its SHA-256 computed over the submitted bytes."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L88, L656-L664, L790-L797"

[[criterion]]
