[[requirements]]
id = "DP-17"
title = "Clear-light calibration"
text = "Marking a clear-light patch calibrates a scan so that density is the base-10 log of the patch's mean linear value over the point's linear value, with linear values read from the stored original at full bit depth through its own transfer as defined in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "calibration"
tests = [
    "test_app.py::test_api_clear_light_calibration",
    "test_app.py::test_wf_calibration_clear_light",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-18"
title = "Step-wedge calibration"
text = "Marking a scanned 21-step wedge calibrates a scan through a piecewise-linear fit of its linear step means at the published nominal step densities, and a wedge whose steps do not darken in order is rejected."
kind = "behavior"
primary = "pytest"
workflow = "calibration"
tests = [
    "test_app.py::test_api_step_wedge_calibration",
    "test_app.py::test_wf_calibration_step_wedge",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-19"
title = "Frame detection and width flags"
text = "Find frames locates frames between the brighter inter-frame gaps of the linear values at the format's published pitch and the scan's DPI, drops cut frames at the strip ends, inserts blank slots for unexposed frames, and flags any frame outside the published width tolerance until it is accepted or nudged into range."
kind = "behavior"
primary = "pytest"
workflow = "frame-detection"
tests = [
    "test_app.py::test_api_frame_detection",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-20"
title = "Boundary nudges"
text = "Moving a frame's left or right edge saves new scan-pixel boundaries and recomputes that frame's density, its width flag and the scan's base plus fog, and edges that leave the scan or overlap a neighbour are rejected."
kind = "behavior"
primary = "pytest"
workflow = "frame-detection"
tests = [
    "test_app.py::test_api_boundary_nudges",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-21"
title = "Keyboard frame handles"
text = "Every frame edge handle is a focusable slider with a visible gold focus outline that the arrow keys nudge and Enter saves, and flagged frames can be accepted by keyboard."
