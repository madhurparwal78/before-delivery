text = "Pressing \"Invoice milestone <n>\" shows the milestone as invoicing at once, before the server answers, confirms it on a 201 and on any other outcome rolls the view back to the server's state with the copy in Feedback states, and a second console tab showing the enquiry reflects an invoice within three seconds."
