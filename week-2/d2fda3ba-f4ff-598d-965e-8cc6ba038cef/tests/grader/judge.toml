[[criterion]]
id = "Q3"
name = "Q3"
type = "binary"
weight = 5
description = "Recipe: locate where each of these is decided: boundary with severed count, rendering allowlist, dossier transitions, add-on state with deadline math, repeated-request handling. Check that the workbench counters import the same boundary module the manifest preview and publish use. A second copy of any rule, such as a separate browser hop calculator or transition checks spread through route handlers, counts as a fail, citing both locations. Pass: each listed rule lives in exactly one module, imported by every browser or server caller."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L888"

[[criterion]]
id = "Q4"
name = "Q4"
type = "binary"
weight = 3
description = "Recipe: search for interfaces and abstract classes that some class implements or extends, then count the implementing classes for each. Then search for functions or methods whose body only calls one other function with the same arguments. Data-shape interfaces and type aliases that no class implements are exempt, since the brief asks for domain values typed as interfaces. An implemented interface or abstract class with exactly one implementation, or a forwarding-only wrapper, counts as a fail, cited as `file:line`. Pass: no class-implemented abstraction has a single implementation and no forwarding-only wrapper exists."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L886, L889"

[[criterion]]
