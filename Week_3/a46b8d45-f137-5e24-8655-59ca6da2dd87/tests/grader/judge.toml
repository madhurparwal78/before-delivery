description = "Recipe: read the operator quote handler, the billing client code that creates the invoice, and the code that builds the claim view, the share view and the quoted notice (search for total_minor, part_line_minor and carriage_minor). A figure that reaches any view, stored quote row or notice from desk-side arithmetic or a literal, instead of from what Kill Bill returned for the created invoice, fails. Pass: every shown, stored or emailed part line, carriage line and total figure comes from the Kill Bill invoice read back after creation."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L136, L996-L1002, L1167-L1171"

