[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read `package.json` and list every production dependency, then find the source modules that build the term index, analyze text and compute scores, and trace one search from the search route down to the score. A dependency that is a search engine, full-text index or ranking library fails, and so does any tokenizer, stemmer or BM25 helper imported from a package. Pass: the term index, the text analysis and the scoring are implemented in the app's own source files with no package doing any of them."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-06",
]
evidence = "file_line"
cites = "L34, L958"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: search the source for the Postgres and MinIO credential variables (database URL, access key id, secret access key) and for literal credential strings, then read the handler behind the config endpoint and the client source for any use of those names or any inline script that embeds JSON. The documented defaults (port 4173 and the published settings defaults) are allowed. Pass: every service credential is read from the server environment only, with none hard-coded or sent to the browser."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-06",
]
evidence = "file_line"
cites = "L34, L901-L906, L935"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: search every SQL string and migration for `tsvector`, `to_tsquery`, `plainto_tsquery`, `ts_rank`, `pg_trgm`, `similarity(` and GIN full-text indexes, then read the table definitions the search path queries for postings or terms. Any hit used for matching or ranking fails, and a scan of event text with `ILIKE` in place of the term index also fails. Pass: matching and ranking run through term and posting tables the app builds itself, with no Postgres full-text feature involved."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
