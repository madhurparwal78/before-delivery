[[if_rules]]
id = "IF-01"
text = "/app/run.json exists with string install, build and serve commands and \"_schema\":\"run-manifest-v1\", and nothing else is needed to start the app."
tests = [
    "test_app.py::test_if_run_manifest",
]
parameter_cases = []

[[if_rules]]
id = "IF-02"
text = "THIRD_PARTY_NOTICES.md at /app lists every shipped package (the production dependency tree from npm ls --omit=dev --all --json) and every bundled font, each with its licence."
tests = [
    "test_app.py::test_if_third_party_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Every shipped package and font uses one of these licences: MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD, CC0-1.0 or OFL-1.1."
tests = [
    "test_app.py::test_if_licences_allowed",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "No datastore other than the provided PostgreSQL, MinIO and Meilisearch holds application state. There is no SQLite, Redis, local files or in-memory store that outlives a request, except presence, locks and live connections."
tests = [
    "test_app.py::test_if_no_extra_datastore",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "The pages load no asset, font or script from any other origin at runtime."
tests = [
    "test_app.py::test_if_same_origin_assets",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "No user cell code is evaluated on the server in any form."
tests = [
    "test_app.py::test_if_no_server_evaluation",
]
parameter_cases = []

[[if_rules]]
id = "IF-07"
