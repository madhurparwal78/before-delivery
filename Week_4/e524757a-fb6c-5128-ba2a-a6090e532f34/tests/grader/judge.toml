description = "Recipe: open the handler for `POST /api/photos`, the module that computes creature positions and weather, and the board entry handler, and trace where size, centring, facing, sharpness, total, weather, creature position and the board total come from. Reading the explorer's pose (island, tile, camera, heading, zoom, focus, tick) from the request is required by the brief and allowed. A handler that takes a score, total, weather or creature position from the request body or headers fails, and each is cited as `file:line`. Pass: each score figure, the weather, the creature positions and the board total are computed on the server from the pose and server state, with no client-sent score, total, weather or creature position read."

