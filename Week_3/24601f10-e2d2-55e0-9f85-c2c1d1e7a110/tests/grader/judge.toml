weight = 5
description = "Recipe: trace how the client pages load tournaments, matches, standings and history and read the server handlers behind them, then search client and server for fixture arrays, in-memory Maps used as stores, localStorage and sessionStorage. Cite each violation as `file:line`. Pass: every tournament, match, standing and history row shown is read from Postgres through the API."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
