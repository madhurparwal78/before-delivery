cites = "L73, L1217, L1219-L1230, L1236"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: trace every write of print state, delivery state, search state and stored-object state, from the render, send, index and storage code through to the database update. A Printable, Failed, Delivered, Redelivered, Current or Stored state set from a timer, a queue acknowledgement, a handover or a sent request is a defect. The states the brief itself sets (print state pending on publish, behind from the commit of a change, delivery pending before handover, cancelled on endpoint removal) are not defects. Cite each defect as `file:line`. Pass: each print, delivery, search and stored-object state is written only from a Gotenberg, Svix, Meilisearch or MinIO result."

[criterion.annotations]
channel = "source"
basis = "explicit"
