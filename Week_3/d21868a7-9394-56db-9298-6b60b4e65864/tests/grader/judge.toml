[judge]
judge = "codex"
model = "openai/gpt-5.6-sol"
version = "0.163.0"
cwd = "/judge-workspace"
timeout = 3600
mode = "batched"
samples = 3
guard = "penalize"
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "normal",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_press_key",
    "browser_resize",
    "browser_select_option",
    "browser_hover",
    "browser_drag",
    "browser_tabs",
    "browser_wait_for",
    "browser_mouse_wheel",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "reduced"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "reduced",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_press_key",
    "browser_resize",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "touch"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "touch",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_press_key",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "source"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "source-mcp",
]
allowed_tools = [
    "list_files",
    "read_file",
    "search_files",
]

[scoring]
aggregation = "weighted-mean"

[[criterion]]
id = "B1"
name = "B1"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800. 1. Sign in as the invented seed grower Mara Ellison and open `/grower`. 2. In `table \"Your orders\"` open the link of her oldest seeded order to reach its `/orders/<order number>` page. 3. With `browser_evaluate`, read the vertical position and computed font size of the window's remaining-ML figure and of the order detail text (turnout, volume, rate lines). 4. Screenshot the page. Pass: the window's remaining-ML figure is the first content below the top bar at a larger computed font size than the order detail text."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-09",
]
evidence = "screenshot"
cites = "L107, L195-L200, L230-L236"

[[criterion]]
id = "B2"
name = "B2"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800. 1. Sign in as the invented seed dispatcher Hal Whitcombe and open `/board`. 2. With `browser_evaluate`, read the computed background colour of `document.documentElement`, of `document.body` and of every element that fills the whole viewport, outermost first, take the first of them that is not transparent as the page ground, ignoring any pane or panel that covers only part of the viewport, and convert it to HSL. 3. Screenshot the board. A pure white or neutral grey page ground fails. Pass: the page ground is a warm paper off-white: a light, warm tint, not pure white and not a neutral grey."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-09",
]
evidence = "screenshot"
cites = "L107, L444-L446"

[[criterion]]
id = "B3"
name = "B3"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800. 1. Sign in as the invented seed grower Lin Barrow, open `/grower` and follow the order link of the first Lateral 4 window in the window list whose listed server status is `Open` or `Not yet open`, skipping every other window, so that Place order is live; if Place order still carries `aria-disabled`, follow the order link of the next such window instead. 2. Choose Lin's Lateral 4 turnout, type a small volume in `textbox \"Volume (ML)\"`, choose any Gate worked by operator, and do not press Place order. 3. With `browser_evaluate`, list every visible element whose computed text, background or border colour is a saturated blue (hue 205 to 245 degrees, saturation at least 50%). 4. Screenshot. Default blue links, comboboxes or navigation fail. Pass: Place order is the only element on the page drawn in a saturated blue."

