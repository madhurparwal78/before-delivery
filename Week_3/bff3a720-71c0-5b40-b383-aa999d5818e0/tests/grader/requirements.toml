[[requirements]]
id = "DP-16"
title = "Per-leg seat accounting"
text = "A booking takes the lowest-numbered seats that are free on every leg of its span, no leg ever holds more seats than the ride has, and cancelling or expiring a segment booking frees only its own legs."
