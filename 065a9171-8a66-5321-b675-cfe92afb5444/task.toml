schema_version = "1.4"

[[artifacts]]
source = "/app"
exclude = [
    "node_modules",
    ".git",
]

[task]
name = "greenfield/tallow-cover"
version = "1.0.0"
description = "Tallow Cover: attendance, leave and bank-cover service for a multi-site UK residential care-home group, with rota-aware leave approval against safe-staffing floors, bank-cover claiming, DST-correct night shifts, 12.07% irregular-hours accrual, missed clock-outs, versioned attendance corrections, private fit notes and payroll exports, backed by Postgres, Mailpit and MinIO."
authors = [
    { name = "Mohd Rafey", email = "mohd.rafey@ethara.ai" },
]
keywords = [
    "care homes",
    "attendance",
    "leave",
    "rota",
    "safe staffing",
    "bank cover",
    "holiday accrual",
    "python",
    "postgres",
    "mailpit",
    "minio",
]

[metadata]
uuid_v5 = "065a9171-8a66-5321-b675-cfe92afb5444"
identity_namespace_url = "https://tasks.example/greenfield/tallow-cover/1.0.0"
category = "Greenfield"
domain = "workforce attendance and leave for multi-site UK residential care-home groups"
archetype = "enterprise"
language = "python"
design_direction = "Steady, clinical and warm: a fixed left rail and a grid that never shifts, hairline rules and equal-width numerals, a candle-wax off-white ground with near-black ink, deep sea-teal floor line and actions, rust red for breaches always paired with hatching and labels, muted old-gold for posted cover; Fraunces display with IBM Plex Sans body at a one-fifth step scale; compact three-column queue whose seven-day, 21-cell staffing strip carries one continuous floor rule."
created_at = "2026-10-28"
seed = "prd"
service_profile = "postgres+mailpit+minio"
harbor_version = "0.24.0"
grader_version = "gfkit-0.1.0/rewardkit-0.2.3"
contract_version = "1.0.0"
requirements_registry = "tests/grader/requirements.toml"
mandatory_requirement_count = 69
workflow_count = 14
rubric_criterion_count = 22
rubric_total_weight = 80
if_constraint_count = 6
scoring_policy = "reward=pytest-outcome-pass-rate;if_score+rubric+quality+combined_score-separate;binary-rubric-5/3/1"
self_contained = true
builds_from_source = true
null_floor = 0.0
platforms = [
    "linux/amd64",
    "linux/arm64",
]

[agent]
timeout_sec = 36000.0
network_mode = "public"

[environment]
os = "linux"
cpus = 4
memory_mb = 4096
storage_mb = 20480
network_mode = "public"
build_timeout_sec = 3600.0

[verifier]
environment_mode = "separate"
timeout_sec = 36000.0

[verifier.env]
JUDGE_SECRET = "${JUDGE_SECRET:-}"
JUDGE_URL = "${JUDGE_URL:-http://host.docker.internal:8790}"
