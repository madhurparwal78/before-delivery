[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: `source`. 1) From the `serve` script in `/app/run.json`, trace to the server entry and its configuration module. 2) Search the hand-written source for literal service hosts, ports and credentials (for example `localhost:5432`, `:8080`, `:9000`, `:1025`, `minioadmin`, `lazar`) and for each variable named in Configuration and secrets. 3) Check browser-side modules for imports of the server configuration, `process.env` reads, `import.meta.env` values or bundler `define` entries that carry those values. The documented defaults (port 4173, `HOLD_TTL_SECONDS` 600, `REMINDER_SWEEP_SECONDS` 60) are allowed. Cite each hard-coded value or client exposure as `file:line`. Pass: every service URL and credential reaches the code only through `process.env` in server-only modules."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-06",
]
evidence = "file_line"
cites = "L34, L698, L701-L712, L719"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: `source`. Trace the handlers for confirm with account payment, check-out with billed hold-over, cancel of an account booking, fee refund, hour-pack purchase, invoice issue and invoice payment down to their billing calls. A mock client, an environment flag that skips Kill Bill, a success path that ignores a failed response, or a local table reported as the charge or payment record fails. Cite each as `file:line`. Pass: each of these actions reaches a real HTTP request to the Kill Bill REST API at the configured base URL."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-07",
