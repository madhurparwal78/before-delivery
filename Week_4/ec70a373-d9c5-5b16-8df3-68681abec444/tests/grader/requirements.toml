title = "Cancellation forfeit window"
text = "Cancelling a held booking returns its hours, and cancelling a confirmed booking, by its member or by a kitchen manager of its site, refunds all, splits or forfeits its quarter hours by elapsed notice as defined in Business rules, with the refunded and forfeited hours stated in the response."
