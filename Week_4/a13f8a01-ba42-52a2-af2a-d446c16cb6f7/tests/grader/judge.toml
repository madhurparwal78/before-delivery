name = "B3"
type = "binary"
weight = 3
description = "Recipe: `playwright` at 1280x800 as a signed-out visitor, open `/`, read the header links from the accessibility snapshot, probe the background colour of each header link, then screenshot the first screen. Pass: the five header links sit in one row on the right with only Start a pen filled in the lichen-green accent."

