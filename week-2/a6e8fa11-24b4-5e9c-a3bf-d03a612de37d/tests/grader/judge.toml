[judge]
judge = "codex"
model = "openai/gpt-5.6-sol"
version = "0.163.0"
cwd = "/judge-workspace"
timeout = 2400
mode = "batched"
samples = 3
guard = "penalize"
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "normal",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_press_key",
    "browser_resize",
    "browser_select_option",
    "browser_hover",
    "browser_drag",
    "browser_tabs",
    "browser_wait_for",
    "browser_mouse_wheel",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "reduced"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "reduced",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_press_key",
    "browser_resize",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "touch"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "touch",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_press_key",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "source"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "source-mcp",
]
allowed_tools = [
    "list_files",
    "read_file",
    "search_files",
]

[scoring]
aggregation = "weighted-mean"

[[criterion]]
id = "B1"
name = "B1"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800. 1) Sign in at `/signin` as the seeded trial lead tomas@ridgeback.example. 2) On the workbook list `/`, pick an empty point of page ground below the last list row or beside the main column. Use `browser_evaluate` with `document.elementFromPoint` at that point, then walk up from that element through its ancestors to `html`, and take the first computed background colour that is not transparent (alpha above 0) as the page ground. It does not matter which element paints it. 3) Also read the computed background colour of the top bar and the `list 'Workbooks'` region. A transparent value or a dark fill is not a defect; only a surface computed as pure white (#FFFFFF) fails. 4) Screenshot the full page. Pass: the page ground computes to a warm off-white paper tone with high lightness and a yellow-to-orange hue, and no probed surface computes to pure white."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-57",
]
evidence = "screenshot"
cites = "L57, L266-L267"

[[criterion]]
id = "B2"
name = "B2"
type = "binary"
weight = 3
description = "Recipe: `playwright` at 1280x800. 1) Sign in as tomas@ridgeback.example. 2) Open the seeded workbook '2026 Soybean Variety Trial RB-SOY-26' from the list. 3) On the Plots sheet, scroll the grid down past row 20 so empty cells fill the view. 4) Use `browser_evaluate` to read the grid ground's background-image and background-size, or the colours and positions of neighbouring rule lines, so line spacing and line colours come from computed values rather than from the eye. A fifth line whose computed colour is even slightly lower in lightness than the others counts as darker. 5) Take a zoomed screenshot of the empty grid ground. Pass: the empty grid ground carries thin khaki graph-paper lines 8 px apart whose every fifth line computes to a darker colour than the lines between."

