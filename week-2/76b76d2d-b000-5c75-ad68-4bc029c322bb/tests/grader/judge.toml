[[criterion]]
id = "Q7"
name = "Q7"
type = "binary"
weight = 3
description = "Recipe: List the interfaces, abstract classes, factories and strategy-style indirections in application code. A TypeScript `interface` or `type` that only describes the shape of data, such as a booking, hold or quote record, is a type declaration rather than an indirection and is not counted. A plain constructor function that reads configuration and returns the app's single client or service, such as a `createKillBillClient(config)` or `createMailer(env)` wiring function, is configuration wiring rather than a factory abstraction and is not counted either. Count the implementations of each remaining abstraction. Any abstraction with one implementation fails. Cite each as `file:line`. Pass: every abstraction in the source has two or more implementations."

