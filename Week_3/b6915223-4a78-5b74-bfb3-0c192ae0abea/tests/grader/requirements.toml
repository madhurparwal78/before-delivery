schema_version = 1
id_prefix = "DP"
mandatory_count = 60
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "accounts-and-notices",
    "squad-build",
    "pick-team",
    "transfers",
    "money-and-prices",
    "chips",
    "deadline-lock",
    "snapshots",
    "live-scoring",
    "points-relay",
    "gameweek-close",
    "mini-leagues",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "S4",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 83
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "minio", env = {} },
    { name = "pocketbase", env = {} },
]

[criterion_weights]
B1 = 5
B2 = 3
B3 = 5
B4 = 3
B5 = 3
B6 = 5
B7 = 5
B8 = 3
B9 = 3
B10 = 3
B11 = 3
B12 = 3
S1 = 5
S2 = 3
S3 = 5
S4 = 3
Q1 = 3
Q2 = 5
Q3 = 3
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_minio_down"

[[outages]]
id = "pocketbase-down"
port = 4175
url_env = "APP_POCKETBASE_DOWN_URL"

[outages.env]
POCKETBASE_URL = "http://127.0.0.1:9"

[[outages]]
id = "fresh-season"
port = 4176
url_env = "APP_FRESH_URL"

[outages.env]
DATABASE_URL = "${DATABASE_URL}_fresh"
S3_BUCKET = "${S3_BUCKET}-fresh"

[[requirements]]
id = "DP-01"
title = "Manager accounts"
text = "Visitors create an account with email, password and team name, then sign in and out. PocketBase holds the accounts, the server keeps the sessions, and the seeded operator account has the only operator role, as qualified in API."
kind = "behavior"
primary = "pytest"
workflow = "accounts-and-notices"
tests = [
    "test_app.py::test_accounts",
    "test_app.py::test_wf_accounts_and_notices_signup_signin",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "PocketBase outage"
text = "While PocketBase is unreachable, sign-up and sign-in answer 503 with the outage copy, existing sessions keep working, and the Notices dialog shows the delayed-notices copy, as qualified in Services."
kind = "behavior"
primary = "pytest"
workflow = "accounts-and-notices"
tests = [
    "test_app.py::test_pocketbase_outage",
