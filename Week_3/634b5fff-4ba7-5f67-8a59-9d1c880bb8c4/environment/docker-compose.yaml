services:
  main:
    environment:
      MAIL_FROM: Svovlstik Press <press@svovlstik.example>
      APP_PUBLIC_PORT: '4173'
      APP_PUBLIC_URL: http://127.0.0.1:4173
      KILLBILL_URL: http://killbill:8080
      KILLBILL_USERNAME: admin
      KILLBILL_PASSWORD: password
      KILLBILL_API_KEY: gfkit-dev
      KILLBILL_API_SECRET: gfkit-dev-secret
      DATABASE_URL: postgresql://gf_app:gf-app-dev-2b7d41@postgres:5432/gf_dev
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: gf-dev
      AUTH_ISSUER_URL: http://keycloak:8080/realms/gf-dev
      AUTH_CLIENT_ID: app
      AUTH_CLIENT_SECRET: gf-kc-app-dev-5e93c1a8
      VALKEY_URL: redis://app:gfkit-dev@valkey:6379/0
      AMQP_URL: amqp://gfkit:gfkit-dev@rabbitmq:5672/%2F
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: gfkit-dev-master-key-0123456789
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: gf-dev
      S3_FORCE_PATH_STYLE: 'true'
      S3_ACCESS_KEY_ID: gf-dev-root-71c3e0
      S3_SECRET_ACCESS_KEY: gf-dev-secret-4b8d92
      GOTENBERG_URL: http://gotenberg:3000
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      MAILPIT_URL: http://mailpit:8025
      SVIX_URL: http://svix:8071
      SVIX_API_KEY: eyJhbGciOiAiSFMyNTYiLCAidHlwIjogIkpXVCJ9.eyJpYXQiOiAxNzkzNTAwMDAwLCAibmJmIjogMTc5MzUwMDAwMCwgImV4cCI6IDQxMDI0NDQ4MDAsICJpc3MiOiAic3ZpeC1zZXJ2ZXIiLCAic3ViIjogIm9yZ19nZmtpdERldjAwMDAwMDAwMDAwMDAwMDAwMDAifQ.q5nmv_FJWaemmYCi7Kt9XjVkpj6bwf2JoPcKHyCBP3Q
      NTFY_URL: http://ntfy
      NTFY_USERNAME: app
      NTFY_PASSWORD: gfkit-dev
      WIREMOCK_URL: http://wiremock:8080
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      killbill-seed:
        condition: service_completed_successfully
      postgres-seed:
        condition: service_completed_successfully
      keycloak-seed:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      minio-seed:
        condition: service_completed_successfully
      gotenberg:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      svix:
        condition: service_healthy
      ntfy:
        condition: service_healthy
      wiremock:
        condition: service_healthy
  killbill-db:
    image: killbill/mariadb:0.24@sha256:8fddf7d564befcea3e3d762c01b3e65fb4b45fb8db077297998ad935468372fa
    environment:
      MYSQL_ROOT_PASSWORD: killbill
    healthcheck:
      test:
      - CMD-SHELL
      - mariadb-admin ping -h 127.0.0.1 -uroot -pkillbill --silent
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
  killbill:
    image: killbill/killbill:0.24.21@sha256:e6b6ab4a0e6287ebf57aafa2d5f22cfa6250dfa056682c74d7c208b4a39d0c9b
    environment:
      KB_org_killbill_dao_url: jdbc:mysql://killbill-db:3306/killbill
      KB_org_killbill_dao_user: root
      KB_org_killbill_dao_password: killbill
      KB_org_killbill_billing_osgi_dao_url: jdbc:mysql://killbill-db:3306/killbill
      KB_org_killbill_billing_osgi_dao_user: root
      KB_org_killbill_billing_osgi_dao_password: killbill
      KB_ADMIN_PASSWORD: password
    depends_on:
      killbill-db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS -o /dev/null http://127.0.0.1:8080/1.0/healthcheck
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s
  killbill-seed:
    image: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
    environment:
      KILLBILL_URL: http://killbill:8080
      KILLBILL_USERNAME: admin
      KILLBILL_PASSWORD: password
      KILLBILL_API_KEY: gfkit-dev
      KILLBILL_API_SECRET: gfkit-dev-secret
    depends_on:
      killbill:
        condition: service_started
    restart: 'no'
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - |
      auth="$$KILLBILL_USERNAME:$$KILLBILL_PASSWORD"
      curl -fsS -o /dev/null --retry 120 --retry-delay 5 --retry-all-errors --retry-max-time 600 \
        "$$KILLBILL_URL/1.0/healthcheck"
      curl -sS -o /dev/null -u "$$auth" -H 'Content-Type: application/json' \
        -H 'X-Killbill-CreatedBy: gfkit-seed' \
        -d "{\"apiKey\":\"$$KILLBILL_API_KEY\",\"apiSecret\":\"$$KILLBILL_API_SECRET\"}" \
        "$$KILLBILL_URL/1.0/kb/tenants"
      curl -fsS -o /dev/null -u "$$auth" "$$KILLBILL_URL/1.0/kb/tenants?apiKey=$$KILLBILL_API_KEY"
  postgres:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_USER: gf_admin
      POSTGRES_PASSWORD: gf-admin-dev-9e4a02
      POSTGRES_DB: postgres
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U gf_admin -d postgres
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  postgres-seed:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      PGHOST: postgres
      PGUSER: gf_admin
      PGPASSWORD: gf-admin-dev-9e4a02
      PGDATABASE: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - |
      psql -Atqc "SELECT 1 FROM pg_roles WHERE rolname = 'gf_app'" | grep -q 1 ||
        psql -qc "CREATE ROLE gf_app LOGIN PASSWORD 'gf-app-dev-2b7d41'"
      psql -Atqc "SELECT 1 FROM pg_database WHERE datname = 'gf_dev'" | grep -q 1 ||
        psql -qc "CREATE DATABASE gf_dev OWNER gf_app"
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7@sha256:4388e2379b7e870a447adbe7b80bd61f5fbf04e925832b19669fda4957f05a81
    command:
    - start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: gf-kc-dev-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: gf-kc-dev-7d20b9e4
      KC_HEALTH_ENABLED: 'true'
    healthcheck:
      test:
      - CMD-SHELL
      - exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && timeout 5 cat <&3
        | grep -q UP
      interval: 5s
      timeout: 10s
      retries: 36
      start_period: 30s
  keycloak-seed:
    image: quay.io/keycloak/keycloak:26.0.7@sha256:4388e2379b7e870a447adbe7b80bd61f5fbf04e925832b19669fda4957f05a81
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: gf-kc-dev-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: gf-kc-dev-7d20b9e4
    depends_on:
      keycloak:
        condition: service_healthy
    restart: 'no'
    entrypoint:
    - /bin/bash
    - -ec
    command:
    - |
      kc=/opt/keycloak/bin/kcadm.sh
      $$kc config credentials --server http://keycloak:8080 --realm master \
        --user "$$KC_BOOTSTRAP_ADMIN_USERNAME" --password "$$KC_BOOTSTRAP_ADMIN_PASSWORD"
      $$kc get realms/gf-dev >/dev/null 2>&1 && exit 0
      $$kc create realms -s realm=gf-dev -s enabled=true -s sslRequired=none -s registrationAllowed=true
      $$kc create clients -r gf-dev -s clientId=app -s secret=gf-kc-app-dev-5e93c1a8 \
        -s publicClient=false -s standardFlowEnabled=true -s directAccessGrantsEnabled=true \
        -s serviceAccountsEnabled=true -s 'redirectUris=["*"]' -s 'webOrigins=["+"]'
      $$kc add-roles -r gf-dev --uusername service-account-app --cclientid realm-management \
        --rolename manage-users --rolename view-users --rolename query-users \
        --rolename manage-realm --rolename view-realm
  valkey:
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    command:
    - valkey-server
    - --requirepass
    - gfkit-dev-admin
    - --save
    - ''
    - --appendonly
    - 'no'
    - --user
    - app
    - 'on'
    - '>gfkit-dev'
    - ~*
    - '&*'
    - +@all
    - -@admin
    - -flushall
    - -flushdb
    healthcheck:
      test:
      - CMD
      - valkey-cli
      - -a
      - gfkit-dev-admin
      - --no-auth-warning
      - ping
      interval: 2s
      timeout: 5s
      retries: 30
  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine@sha256:b768d2e09a809b48458d6c3c32fc2894643a6bfafd76264c120373eff0ee6532
    environment:
      RABBITMQ_DEFAULT_USER: gfkit
      RABBITMQ_DEFAULT_PASS: gfkit-dev
    healthcheck:
      test:
      - CMD-SHELL
      - '[ -f /var/lib/rabbitmq/.erlang.cookie ] && rabbitmq-diagnostics -q ping'
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
  meilisearch:
    image: getmeili/meilisearch:v1.56.0@sha256:1f578fa865f8251894b3bf38d6668d6209a3f451f8f65ab953e129d4c1db5ef4
    environment:
      MEILI_MASTER_KEY: gfkit-dev-master-key-0123456789
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: 'true'
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - -o
      - /dev/null
      - http://127.0.0.1:7700/health
      interval: 2s
      timeout: 5s
      retries: 30
  minio:
    image: coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    environment:
      MINIO_ROOT_USER: gf-dev-root-71c3e0
      MINIO_ROOT_PASSWORD: gf-dev-secret-4b8d92
    command: server /data
    healthcheck:
      test:
      - CMD-SHELL
      - MC_HOST_local=http://$$MINIO_ROOT_USER:$$MINIO_ROOT_PASSWORD@localhost:9000 mc ready local >/dev/null
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  minio-seed:
    image: coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    environment:
      MINIO_ROOT_USER: gf-dev-root-71c3e0
      MINIO_ROOT_PASSWORD: gf-dev-secret-4b8d92
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - |
      export MC_HOST_local="http://$$MINIO_ROOT_USER:$$MINIO_ROOT_PASSWORD@minio:9000"
      mc mb --ignore-existing local/gf-dev
      mc anonymous set none local/gf-dev
  gotenberg:
    image: gotenberg/gotenberg:8.39.0@sha256:13672f317b443c793e972b1bd2155ec62a3e7b6891b411e8196442cc053ee5f5
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - -o
      - /dev/null
      - http://127.0.0.1:3000/health
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    healthcheck:
      test:
      - CMD
      - /mailpit
      - readyz
      interval: 2s
      timeout: 5s
      retries: 30
  svix-db:
    image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
    environment:
      POSTGRES_USER: svix
      POSTGRES_PASSWORD: svix
      POSTGRES_DB: svix
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U svix -d svix
      interval: 2s
      timeout: 5s
      retries: 30
  svix:
    image: svix/svix-server:v1.104.0@sha256:fb0872f4d53e5ced46eef9349a15cc02e0ddae35d041a6f9f00fbee9dd1a0711
    command:
    - svix-server
    - --run-migrations
    - --wait-for
    - '60'
    environment:
      SVIX_JWT_SECRET: gfkit-dev-svix-jwt-secret-0123456789
      SVIX_DB_DSN: postgresql://svix:svix@svix-db:5432/svix
      SVIX_QUEUE_TYPE: memory
      SVIX_CACHE_TYPE: memory
      SVIX_WHITELIST_SUBNETS: '[0.0.0.0/0]'
    depends_on:
      svix-db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - svix-server
      - healthcheck
      - http://127.0.0.1:8071
      interval: 2s
      timeout: 5s
      retries: 60
  ntfy:
    image: binwiederhier/ntfy:v2.36.0@sha256:fb48c413eb11d50339962b5d62cddce0f800e7f77c626d638a7c20cb7e9c4465
    command:
    - serve
    environment:
      NTFY_AUTH_FILE: /tmp/ntfy-auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_VISITOR_REQUEST_LIMIT_EXEMPT_HOSTS: 0.0.0.0/0
      NTFY_VISITOR_TOPIC_CREATION_LIMIT_BURST: '100000'
      NTFY_AUTH_USERS: gfkit-admin:$$2a$$10$$HZJkmBS/HmPoMWwBJGIcY.3HYVfyY4Y4L3f0FS9QcvimLh2AHZYha:admin,app:$$2a$$10$$gM/OVEm10tjKt0mPbgWUfO8o6CUjyndt1oQMQC.PMQMuNeFuj6eMy:user
      NTFY_AUTH_ACCESS: app:*:rw
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1/v1/health
      interval: 2s
      timeout: 5s
      retries: 30
  wiremock:
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
