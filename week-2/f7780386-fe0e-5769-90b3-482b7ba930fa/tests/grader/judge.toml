weight = 5
description = "Recipe: `source`. 1) Find where the server reads configuration. 2) Search the whole source for process.env, literal URLs, hostnames, ports, usernames, passwords and access keys. 3) The 4173 port and the 600-second hold defaults the brief documents are allowed. 4) The seed password prep-shift-2026 (or its hash) and the sender address passboard@halsted-kitchen.test the brief fixes are seed data, not credentials, and are allowed. 5) Cite each other literal credential or service URL as `file:line`. Pass: every service URL, credential or port setting comes from its environment variable, with no other literal credential or service URL in the source."

