title = "Same-day cutoffs by method"
text = "A direct send or a final approval stamps the payment's effective date from its posting instant in New York local time, on either side of a daylight-saving change: today for ACH before 16:00 and for wires before 17:00 on a business day, otherwise the next business day; always today for RTP; and the next business day for checks. A scheduled payment keeps the effective date set when it was scheduled, as stated in DP-17."
