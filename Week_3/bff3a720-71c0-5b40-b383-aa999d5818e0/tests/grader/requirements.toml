title = "Request expiry"
text = "A request that is still unanswered at the earlier of `REQUEST_EXPIRY_HOURS` after it was made or `REQUEST_CUTOFF_MINUTES` before boarding expires on the server, refunds 100% and frees its seats, and a late accept answers 409 `request_expired`."
