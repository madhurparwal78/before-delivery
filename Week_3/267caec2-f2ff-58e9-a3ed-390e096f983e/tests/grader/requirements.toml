KILLBILL_URL = "http://127.0.0.1:9"

[[requirements]]
id = "DP-01"
title = "Studio accounts and sign-in"
text = "A studio entrant creates a studio account or signs in with email and password, and every seeded director, juror and studio can sign in, with the session held in an HttpOnly cookie as set out in API."
kind = "behavior"
primary = "pytest"
workflow = "entry-drafts"
tests = [
    "test_app.py::test_studio_accounts_and_sign_in",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "One error order for every endpoint"
text = "Every protected endpoint answers by the single error-precedence rule and error shapes in API, and unauthenticated calls to protected endpoints answer 401."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_error_precedence",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Programs and categories"
text = "The program director creates programs with a time zone, early-bird and entry deadline dates and two fees, edits those dates, and adds categories with a shortlist size and finalist count, all validated as stated in API."
kind = "behavior"
primary = "pytest"
workflow = "entry-drafts"
tests = [
    "test_app.py::test_programs_and_categories",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Deadlines in the program's time zone"
text = "Entry, early-bird and withdrawal-refund cutoffs are judged on the server against the end of 23:59 in the program's time zone, and every deadline an entrant sees, on screen or in email, carries the label format from Business rules regardless of the browser's zone."
kind = "behavior"
primary = "pytest"
workflow = "entry-payment"
tests = [
    "test_app.py::test_deadlines_in_program_zone",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-05"
title = "Entry drafts"
text = "A studio entrant creates, edits and deletes draft entries in an open category, and deleting a draft removes its case-study images from storage."
kind = "behavior"
primary = "pytest"
workflow = "entry-drafts"
tests = [
    "test_app.py::test_entry_drafts",
    "test_app.py::test_wf_entry_drafts_happy",
    "test_app.py::test_wf_entry_drafts_reject_and_delete",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-06"
title = "Case-study image checks"
text = "Uploads are judged by their content, size and pixel dimensions with the limits, order and rejections in Business rules, and an accepted image is stored with its detected type, width, height and byte size."
kind = "behavior"
primary = "pytest"
workflow = "entry-drafts"
tests = [
    "test_app.py::test_image_checks",
]
criteria = []
parameter_cases = [
    "accepted_png",
    "accepted_max_side",
    "accepted_exact_limit",
    "path_in_name",
    "too_large",
    "too_large_checked_before_type",
    "gif_rejected",
    "svg_named_png",
    "html_declared_png",
    "truncated_png",
    "too_narrow",
    "too_wide",
    "seventh_image",
]

[[requirements]]
id = "DP-07"
title = "Re-encoded images served back"
text = "Only server re-encoded image bytes are ever served, from storage keys the server chooses, to callers allowed to see the entry."
kind = "behavior"
primary = "pytest"
workflow = "entry-drafts"
tests = [
