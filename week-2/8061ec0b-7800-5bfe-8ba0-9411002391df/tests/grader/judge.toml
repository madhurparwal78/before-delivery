[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server configuration and every module that connects to Postgres, Kill Bill, SMTP and S3, then search the server source for literal hosts, ports, usernames, passwords, API keys, tenant secrets and bucket names. The brief's documented values are allowed: the bind address 0.0.0.0, port 4173, a hold of 172800 seconds, a link lifetime of 86400 seconds and the origin http://localhost:<port>. The brief's published seed data (seeded users' emails and passwords) and the documented MAIL_FROM value are seed content, not service credentials, and are allowed. Cite every other literal as `file:line` and count it as a failure. Pass: every service URL and credential is read from its published environment variable at start."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-54",
]
evidence = "file_line"
cites = "L141, L1218, L1356-L1368"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 3
description = "Recipe: read the browser source, the bundler configuration (`define`, `envPrefix` and similar) and the API serializers for user, contract and school bodies. A client reference to a service variable through `process.env` or `import.meta.env`, or a serializer returning config, counts as a failure; cite each as `file:line`. Pass: no browser module, bundler injection or API response carries a service URL or credential."

[criterion.annotations]
