weight = 5
description = "Recipe: `reduced` at 1280x800, open `/` signed out. With browser_evaluate read the left edge of `heading` level 1 and the viewport width. Screenshot the title below the mosaic. Pass: the two-line title's left edge sits within 16 pixels of 42% of the viewport width."

