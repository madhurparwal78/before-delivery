[[if_rules]]
id = "IF-01"
text = "/app/run.json exists with string fields install, build and serve and \"_schema\":\"run-manifest-v1\", and its commands run the app as described in Deployment."
tests = [
    "test_app.py::test_if_run_manifest",
]
parameter_cases = []

[[if_rules]]
id = "IF-02"
text = "/app/THIRD_PARTY_NOTICES.md names every shipped package with its version and licence, and every bundled font with its licence. Shipped packages means the production dependency tree as npm ls --omit=dev --all --json reports it."
tests = [
    "test_app.py::test_if_third_party_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Every shipped package and bundled font uses one of the MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD, BlueOak-1.0.0, CC0-1.0 or OFL-1.1 licences."
tests = [
    "test_app.py::test_if_licences",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "The app keeps records only in Postgres and objects only in MinIO. No other database, cache server, SQLite file or data file under /app holds app records."
tests = [
    "test_app.py::test_if_no_other_datastore",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "A lockfile at /app (package-lock.json, pnpm-lock.yaml or yarn.lock) pins the dependency tree, and the install command uses it."
tests = [
    "test_app.py::test_if_lockfile",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "Fonts, scripts and styles are files of the app itself, and no page references another origin."
tests = [
    "test_app.py::test_if_same_origin",
]
parameter_cases = []

[[if_rules]]
id = "IF-07"
text = "The source contains no credential values. Service credentials (the Postgres, MinIO, Kill Bill and SMTP values) appear only as environment variable names; the brief's published seed password and MAIL_FROM default are not service credentials."
tests = [
    "test_app.py::test_if_no_credentials_in_source",
]
parameter_cases = []

