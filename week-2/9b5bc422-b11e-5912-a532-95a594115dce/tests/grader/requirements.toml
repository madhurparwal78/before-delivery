schema_version = 1
id_prefix = "DP"
mandatory_count = 76
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "first-open",
    "block-editing",
    "doc-list",
    "trash",
    "page-canvas",
    "canvas-arrange",
    "records",
    "records-board",
    "journal",
    "templates",
    "sign-in-sync",
    "both-kept",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 82
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "minio", env = {} },
]

[criterion_weights]
B1 = 5
B2 = 5
B3 = 3
B4 = 3
B5 = 3
B6 = 3
B7 = 5
B8 = 5
B9 = 3
B10 = 3
B11 = 5
B12 = 3
S1 = 5
S2 = 5
S3 = 3
Q1 = 3
Q2 = 3
Q3 = 3
Q4 = 5
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "postgres-down"
port = 4175
url_env = "APP_POSTGRES_DOWN_URL"

[outages.env]
DATABASE_URL = "http://127.0.0.1:9"

[[outages]]
id = "short-limits"
port = 4176
url_env = "APP_SHORT_URL"

[outages.env]
SHARE_LINK_SECONDS = "3"
ACCOUNT_STORAGE_BYTES = "1000"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
id = "DP-01"
title = "First open main journey: exact seed on the list."
text = "With no account, opening the landing route in a new browser shows the document list of a starter workspace holding exactly the Seed data records, with no sign-in screen and no spinner."
kind = "behavior"
primary = "workflow"
workflow = "first-open"
tests = [
    "test_app.py::test_wf_first_open_seed",
]
criteria = []
parameter_cases = []

