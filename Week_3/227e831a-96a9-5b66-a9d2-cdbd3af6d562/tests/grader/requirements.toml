[[requirements]]
id = "DP-64"
title = "Adjust a line before its pack is confirmed"
text = "Quantity, carry-mode and unpack inputs made on a just-packed line before the server confirms it are held in input order and sent against the new line, and all of them are dropped with one announcement when the pack is refused."
kind = "behavior"
primary = "pytest"
