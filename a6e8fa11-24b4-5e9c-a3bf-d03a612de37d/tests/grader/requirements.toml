[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[services]]
name = "postgres"

[services.env]

[[services]]
name = "minio"

[services.env]

[[services]]
name = "mailpit"

[services.env]
MAIL_FROM = "Furrowbook by Tilth & Tally <furrowbook@tilth-tally.example>"

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[requirements]]
id = "DP-01"
title = "Sign in with station accounts"
text = "Members sign in with email and password and get a session for their one station, and every other API call without a session answers 401, as defined in API."
kind = "behavior"
primary = "pytest"
workflow = "workbook-list"
tests = [
    "test_app.py::test_sign_in_and_sessions",
    "test_app.py::test_sign_in_screen",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Station-scoped workbook list and search"
text = "The workbook list and its name search show only the signed-in member's station's workbooks, with the search text bounded as stated in API."
kind = "behavior"
primary = "pytest"
workflow = "workbook-list"
tests = [
    "test_app.py::test_station_scoped_list_and_search",
]
criteria = []
parameter_cases = []

