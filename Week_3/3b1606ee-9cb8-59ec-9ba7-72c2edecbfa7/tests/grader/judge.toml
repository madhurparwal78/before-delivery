[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: in the client source, search for `generateKey`, `importKey`, `extractable`, `indexedDB`, `localStorage` and `sessionStorage`, and trace where the identity key pair is created and kept. A private key in localStorage, sessionStorage, a cookie or a request body is a defect, as is any persisted private key with extractable true, and each defect is cited as `file:line`. Pass: the persisted identity private key is a non-extractable CryptoKey held in IndexedDB."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-45",
]
evidence = "file_line"
cites = "L72, L531-L533"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: read the server entry and config modules, search the whole source for `DATABASE_URL`, `S3_`, `postgres://`, `minioadmin`, access keys and secrets, and read the `GET /api/config` handler. A hard-coded, logged or browser-visible credential or connection string is a defect, cited as `file:line`, while the defaults the brief documents (port 4173, the timer defaults, the 26,214,400-byte cap) are allowed and the provided compose files are out of scope. Pass: every database and object-storage credential is read from the environment."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-45",
]
evidence = "file_line"
cites = "L72, L760-L781"

