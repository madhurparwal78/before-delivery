    "plan-sweep",
    "live-house",
    "fall-back-night",
    "day-log",
    "effective-edit",
    "weekend-conflict",
    "scene-authoring",
    "guest-scene",
    "motion-clips",
    "notices",
    "cross-cutting",
]
criterion_ids = [
    "B1",
