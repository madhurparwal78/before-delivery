[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "short-timers"
port = 4176
url_env = "APP_SHORT_URL"

[outages.env]
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"
BILLING_RETRY_SECONDS = "2"
REMINDER_SWEEP_SECONDS = "2"
SIGNIN_LOCK_SECONDS = "20"
INVITE_TTL_SECONDS = "20"
SESSION_TTL_SECONDS = "600"

[[outages]]
id = "slow-billing"
port = 4177
url_env = "APP_SLOW_BILLING_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:18091"
DATABASE_URL = "${DATABASE_URL}_slow"
S3_BUCKET = "${S3_BUCKET}-slow"
BILLING_RETRY_SECONDS = "2"
REMINDER_SWEEP_SECONDS = "2"

[[outages]]
id = "switchable-billing"
port = 4178
url_env = "APP_SWITCHABLE_BILLING_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:18092"
DATABASE_URL = "${DATABASE_URL}_switch"
S3_BUCKET = "${S3_BUCKET}-switch"
BILLING_RETRY_SECONDS = "2"
REMINDER_SWEEP_SECONDS = "2"

[[outages]]
id = "pickup-due"
port = 4179
url_env = "APP_PICKUP_DUE_URL"

[outages.env]
DATABASE_URL = "${DATABASE_URL}_pickup"
S3_BUCKET = "${S3_BUCKET}-pickup"
APP_CLOCK_START = "2026-11-14T02:59:00Z"
BILLING_RETRY_SECONDS = "2"
REMINDER_SWEEP_SECONDS = "2"

