[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server source and every config file shipped in /app, then trace how the database, billing, mail and object-storage clients get their URLs, hosts, ports, usernames, passwords, API keys, secrets, bucket and region; defaults the brief documents (port 4173 and the four timing defaults) are allowed, and any literal service URL or credential written as a value or fallback is a defect to cite as `file:line`. Pass: every service URL, host, credential, key and bucket comes from process.env with no literal value or fallback in source."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L254, L2071-L2082"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: read the browser source and the bundler configuration, searching for process.env, import.meta.env, define or env-injection settings, absolute URLs and any service environment variable name; any env value or third-party service URL reaching browser code is a defect to cite as `file:line`. Pass: browser code calls only same-origin relative /api paths with no environment value or service URL compiled into it."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L254, L2082, L2148"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: read the billing, mail and object-storage client modules and the code that delivers outbox work; a stub, mock or in-memory branch that reports success without calling the service, or a client that treats a failed connection as permanent, is a defect to cite as `file:line`. Pass: each client calls its configured service address over the network on every attempt with no stub or fake success branch."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L1970, L2071-L2082, L2126"

[[criterion]]
id = "Q1"
name = "Q1"
type = "binary"
weight = 5
description = "Recipe: trace five domain rules in the server source (the cross-site decision, the booking state transitions with automatic lapse and no-show, the offered actions of a booking, block pricing with rounding, and the 48-hour cutoff); any second copy of one of these decisions, such as re-derived transitions, a second rounding routine or a cutoff computed inline, is a defect to cite as `file:line`. Pass: each of the five rules is decided in exactly one function or module that every caller uses."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L2154-L2186"

[[criterion]]
id = "Q2"
name = "Q2"
type = "binary"
weight = 3
description = "Recipe: search server and browser source for money handling, including parseFloat or Number on amounts, division of cents followed by further arithmetic, toFixed on floating values, and amount fields whose names do not end in Cents. Converting between integer cents and two-decimal dollars at the edges the brief sets in dollars (Kill Bill item amounts, rates typed in dollars, display), rounded once to a whole cent, is not a defect, nor is the brief's own quarter-hour price and half-charge fee rounded once from integer cents; any other floating-point arithmetic on an amount is a defect to cite as `file:line`. Pass: every amount outside those edges stays integer cents."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L1060, L1881, L2190"

[[criterion]]
id = "Q3"
name = "Q3"
type = "binary"
weight = 3
description = "Recipe: read every tsconfig in /app and search the TypeScript source for `any`, `as any`, `as unknown as`, `@ts-ignore`, `@ts-expect-error` and `@ts-nocheck`; strict mode off, or an escape over a value that has a domain type, is a defect to cite as `file:line`. Pass: strict type checking is on for server and browser code with no `any` escape over a domain value."

[criterion.annotations]
