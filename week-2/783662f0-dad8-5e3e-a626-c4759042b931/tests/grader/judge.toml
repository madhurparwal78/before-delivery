[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 5
description = "Recipe: locate the server modules for chess, four in a row and card-game move legality, the turn clock, the shuffle and the settlement split, then search the browser tree for move-legality logic (check detection, castling rights, follow-suit tests, column-full checks), random shuffles, deadline expiry decisions and payout arithmetic. Cite the server module for each rule and every client-side instance as `file:line`. Pass: no browser module computes move legality, a shuffle, a deadline expiry or a payout."

