tests = [
    "test_app.py::test_dp11_cross_site_refused",
]
criteria = []
parameter_cases = [
    "foreign Origin",
    "Origin null",
    "Sec-Fetch-Site cross-site without Origin",
    "cross-site form post",
    "missing token",
    "token of another session",
    "OPTIONS preflight",
]

