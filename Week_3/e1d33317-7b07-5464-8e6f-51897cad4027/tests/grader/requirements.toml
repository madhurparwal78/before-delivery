[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "valkey-down"
port = 4175
url_env = "APP_VALKEY_DOWN_URL"

[outages.env]
VALKEY_URL = "redis://127.0.0.1:9/0"

[[outages]]
id = "gotenberg-down"
port = 4176
url_env = "APP_GOTENBERG_DOWN_URL"

[outages.env]
GOTENBERG_URL = "http://127.0.0.1:9"

[[outages]]
id = "short-timer"
port = 4177
url_env = "APP_SHORT_URL"

[outages.env]
AWARENESS_TTL_SECONDS = "4"
PDF_RETRY_SECONDS = "3"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
id = "DP-01"
title = "Run manifest and health"
text = "The app installs, builds and serves from `/app/run.json` as specified in Deployment, and its health endpoint answers 200 while any of Valkey, MinIO or Gotenberg is unreachable."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_health_on_every_instance",
]
criteria = []
parameter_cases = [
    "primary",
    "minio-down",
    "valkey-down",
    "gotenberg-down",
]

