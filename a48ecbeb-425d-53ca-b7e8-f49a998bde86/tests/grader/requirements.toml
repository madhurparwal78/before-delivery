]
parameter_cases = []

[[if_rules]]
id = "IF-02"
text = "`THIRD_PARTY_NOTICES.md` at `/app` lists every shipped package, font and icon set with its licence. \"Shipped packages\" means the production dependency tree reported by `npm ls --omit=dev --all --json`."
tests = [
    "test_app.py::test_if_third_party_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Every shipped package is under MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD, BlueOak-1.0.0 or CC0-1.0, and every font is under OFL-1.1."
tests = [
    "test_app.py::test_if_licences_allowed",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "No datastore beyond Postgres, PocketBase, MinIO, Kill Bill and Mailpit holds app state: no SQLite, Redis, local JSON files or in-memory state that must survive a restart."
tests = [
    "test_app.py::test_if_no_extra_datastore",
]
parameter_cases = []

