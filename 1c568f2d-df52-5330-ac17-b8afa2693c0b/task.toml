schema_version = "1.4"

[[artifacts]]
source = "/app"
exclude = [
    "node_modules",
    ".git",
]

[task]
name = "greenfield/exhibit-clearance-desk"
version = "1.0.0"
description = "Clearhouse, Fenwick Science Centre's clearance desk: makers submit small interactive exhibit pieces citing licensed catalogue objects, two distinct reviewers check licensing and accessibility, a clearance lead clears against a quarter budget, books one featured day, publishes and withdraws, with an append-only audit trail, on Postgres and Keycloak."
authors = [
    { name = "tanmay bhadoria", email = "tanmay.bhadoria@ethara.ai" },
]
keywords = [
    "clearance",
    "workflow",
    "state-machine",
    "audit-trail",
    "rbac",
    "concurrency",
    "keycloak",
    "postgres",
    "accessibility",
    "python",
]

[metadata]
uuid_v5 = "1c568f2d-df52-5330-ac17-b8afa2693c0b"
identity_namespace_url = "https://tasks.example/greenfield/exhibit-clearance-desk/1.0.0"
category = "Greenfield"
domain = "cultural institutions and public exhibits"
archetype = "enterprise"
language = "python"
design_direction = "Paper-white institutional calm so the exhibits are the only colourful thing on screen; one blue for pressable, one green for cleared, one red for refused, a warm cream field reserved for pieces on the public wall; dense staff queue, two-column decision desk, proportional cut-out board, month schedule grid and a quiet public wall; signature clearance stamp that lands with a short overshoot."
created_at = "2026-10-27"
service_profile = "postgres+keycloak"
harbor_version = "0.24.0"
grader_version = "rewardkit-0.2.3"
contract_version = "1.0.0"
requirements_registry = "tests/grader/requirements.toml"
mandatory_requirement_count = 51
workflow_count = 11
rubric_criterion_count = 24
rubric_total_weight = 82
if_constraint_count = 7
scoring_policy = "reward=pytest-outcome-pass-rate;if_score+rubric+quality+combined_score-separate;binary-rubric-5/3/1"
self_contained = true
builds_from_source = true
null_floor = 0.0
platforms = [
    "linux/amd64",
    "linux/arm64",
]

[agent]
timeout_sec = 36000.0
network_mode = "public"

[environment]
os = "linux"
cpus = 4
memory_mb = 4096
storage_mb = 20480
network_mode = "public"
build_timeout_sec = 3600.0

[verifier]
environment_mode = "separate"
timeout_sec = 36000.0

[verifier.env]
JUDGE_SECRET = "${JUDGE_SECRET:-}"
JUDGE_URL = "${JUDGE_URL:-http://host.docker.internal:8790}"
