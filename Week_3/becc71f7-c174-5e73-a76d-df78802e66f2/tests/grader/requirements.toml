schema_version = 1
id_prefix = "DP"
mandatory_count = 60
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "shop-access",
    "public-rail",
    "intake-and-tags",
    "markdown-ladder",
    "shopper-holds",
    "till",
    "payout-runs",
    "consignor-page",
    "intake-appointments",
    "old-spreadsheet",
    "sales-book",
    "period-end-and-erasure",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
    "Q8",
]
rubric_total_weight = 83
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "minio", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Atelier Ourlet <desk@atelier-ourlet.example>" } },
]

[criterion_weights]
B1 = 5
B2 = 3
B3 = 5
B4 = 3
B5 = 3
B6 = 5
B7 = 3
B8 = 5
B9 = 5
B10 = 3
B11 = 3
B12 = 1
S1 = 5
S2 = 3
S3 = 3
Q1 = 5
Q2 = 5
Q3 = 3
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 3
Q8 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_STORAGE_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_storage"
S3_BUCKET = "${S3_BUCKET}-storage"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAIL_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"
MAILPIT_URL = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_mail"
S3_BUCKET = "${S3_BUCKET}-mail"

[[outages]]
id = "short-timers"
port = 4176
url_env = "APP_SHORT_URL"

[outages.env]
HOLD_SECONDS = "20"
PORTAL_PAGE_SECONDS = "20"
APPOINTMENT_RATE_WINDOW_SECONDS = "30"
BOOK_FILE_RATE_WINDOW_SECONDS = "30"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[outages]]
id = "short-session"
port = 4177
url_env = "APP_SESSION_URL"

[outages.env]
SESSION_SECONDS = "20"
DATABASE_URL = "${DATABASE_URL}_session"
S3_BUCKET = "${S3_BUCKET}-session"

[[outages]]
id = "spare"
port = 4178
url_env = "APP_SPARE_URL"

[outages.env]
DATABASE_URL = "${DATABASE_URL}_spare"
S3_BUCKET = "${S3_BUCKET}-spare"

[[requirements]]
id = "DP-01"
title = "Staff sign-in"
text = "Signing in with a wrong password and with an email that belongs to no member answer the same status, the right password starts a session, and signing out ends it so the session endpoint answers 401."
kind = "behavior"
primary = "pytest"
workflow = "shop-access"
tests = [
    "test_app.py::test_sign_in_no_enumeration",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Members belong to the owner"
text = "Only the shop owner lists, adds, re-roles and removes members, as set out in API; a removed member can no longer sign in, a role change applies from that member's next request, and an id that is not a current member answers 404 exactly like an unknown id."
kind = "behavior"
primary = "pytest"
workflow = "shop-access"
tests = [
    "test_app.py::test_members_owner_only",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Sign-in journey"
text = "Filling the sign-in form lands each staff role on its published home route with a live session, and signing out from there ends the session."
kind = "behavior"
primary = "workflow"
workflow = "shop-access"
tests = [
    "test_app.py::test_wf_shop_access_sign_in_each_role",
    "test_app.py::test_wf_shop_access_refusals",
]
criteria = []
parameter_cases = []

