text = "Each marketing header menu opens with Enter, Space or Down Arrow. It moves and wraps through its links with the arrow keys, Home and End, and closes on Escape, on Tab past its last link or on an outside click. Only one menu is open at a time, and no link of a closed panel can be reached or clicked."
