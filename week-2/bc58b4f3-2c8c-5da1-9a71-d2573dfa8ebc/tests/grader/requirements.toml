[[requirements]]
id = "DP-01"
title = "Request an interpreter"
text = "A clinic scheduler fills the request form and submits it, and sees exactly one new assignment in their organisation's request list with the status label for a draft, even after a double-click or a retry after a timeout."
kind = "behavior"
primary = "workflow"
workflow = "request-intake"
tests = [
    "test_app.py::test_wf_request_intake_double_click",
    "test_app.py::test_wf_request_intake_retry_after_timeout",
    "test_app.py::test_wf_request_intake_invalid_recovery",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Request validation"
text = "POST /api/assignments creates a draft assignment with the next assignment number and rejects each invalid field with the validation error listed in API."
kind = "behavior"
primary = "pytest"
workflow = "request-intake"
tests = [
    "test_app.py::test_create_validation",
]
criteria = []
parameter_cases = [
    "valid",
    "language",
    "setting",
    "start-too-soon",
    "start-too-far",
    "start-off-quarter",
    "start-not-a-time",
    "start-before-06",
    "end-after-22",
    "duration-step",
    "duration-short",
    "duration-long",
    "street-empty",
    "street-long",
    "city-empty",
    "city-long",
    "initials-lower",
    "initials-four",
    "notes-long",
]

