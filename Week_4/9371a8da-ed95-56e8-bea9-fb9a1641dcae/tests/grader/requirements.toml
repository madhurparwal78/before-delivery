[[requirements]]
id = "DP-01"
title = "Sign-in and project list"
text = "Seeded and invited people sign in with email and password to receive a session cookie, every API call without a valid session answers the unauthenticated error in API, and the project list shows exactly the projects where the person currently holds a membership, each with their role."
kind = "behavior"
primary = "pytest"
workflow = "project-start"
tests = [
    "test_app.py::test_sign_in_and_project_list",
]
criteria = []
parameter_cases = []

