type = "binary"
weight = 3
description = "Recipe: list the routes, screens and top-level features in the source and compare them with the brief's published routes and endpoints. A debug route, an extra endpoint, an extra screen or a feature the brief does not publish is a defect, cited as `file:line`. Pass: No feature, endpoint or screen in the source exists beyond the brief."

