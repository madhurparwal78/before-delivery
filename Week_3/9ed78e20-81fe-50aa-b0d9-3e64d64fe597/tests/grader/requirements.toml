]

[[requirements]]
id = "DP-52"
title = "Sign-offs lapse with the signer's authority"
text = "A sign-off on a release record that is not yet cleared is voided in the revoking transaction or within 60 seconds of its signer's grant expiry, the record falls back to the remaining sign-off's state, and clearing in the gap is refused with 409 signoff_lapsed."
kind = "behavior"
primary = "pytest"
workflow = "responsible-release"
tests = [
    "test_app.py::test_wf_responsible_release_signoff_lapse",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-53"
title = "Derived surfaces stay consistent after withdrawal"
text = "After a withdrawal every derived public value (newsroom total, pages, subject and tag facets and the tag list, the five-item home rail, the feed's updated time, and linked_news and linked_model references) equals a fresh recount in the same transaction."
kind = "behavior"
primary = "pytest"
workflow = "withdrawal"
tests = [
    "test_app.py::test_derived_values_after_withdrawal",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-54"
title = "Careers text limits and real dates"
text = "Requisition titles and descriptions, benefits summaries and close reasons are limited in Unicode code points after trimming with exactly the limit accepted, benefits dates must be real calendar dates, and stored text round-trips exactly."
kind = "behavior"
primary = "pytest"
