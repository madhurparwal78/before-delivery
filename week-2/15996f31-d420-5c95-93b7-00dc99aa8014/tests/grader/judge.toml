description = "Recipe: read the configuration module, then every place that builds a PostgreSQL, Kill Bill, SMTP or S3 client, then the client code sent to the page and the logging calls. Cite each violation as `file:line`. Pass: every service URL and credential is read from `process.env` at start, with no literal fallback beyond the brief's documented defaults and no copy in client code or logs."

