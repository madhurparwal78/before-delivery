{{template "top" .}}
<main id="main" class="page reader">
  <h1>{{.Title}}</h1>
  <p class="count"><span class="figure">{{.Total}}</span> records</p>
  <div class="table-frame" tabindex="0" role="group" aria-label="{{.Title}} table, scrolls sideways">
    <table class="data" aria-label="{{.Title}}">
      <thead><tr>{{range .Columns}}<th scope="col">{{.}}</th>{{end}}</tr></thead>
      <tbody>{{range .Rows}}<tr>{{range .}}<td>{{.}}</td>{{end}}</tr>{{end}}</tbody>
    </table>
  </div>
</main>
{{template "bottom" .}}
