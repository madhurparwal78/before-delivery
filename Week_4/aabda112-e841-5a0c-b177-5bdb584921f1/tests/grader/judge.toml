[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: in the browser-side source only, search for `Date.now`, `new Date(`, `performance.now`, `getTimezoneOffset`, `Intl.DateTimeFormat`, `toLocale`, `setInterval` and `setTimeout`, open every hit and read what decides the outcome. Formatting a server instant with an explicit clinic time zone, and a toast timer built from the server's `undoUntil` minus the `now` returned with the same cancel, are allowed, while any comparison against the browser clock or zone that decides a time-dependent state is a defect, so cite each as `file:line`. Pass: no browser code derives due, overdue, late, waiting minutes, booking windows, batch expiry, reminder sending, undo lifetime or the clinic date from the browser's own clock or zone."

[criterion.annotations]
channel = "source"
