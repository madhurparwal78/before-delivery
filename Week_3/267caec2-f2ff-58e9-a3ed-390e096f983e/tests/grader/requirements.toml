]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-09"
title = "All-or-nothing submission"
text = "An entry becomes submitted only when its fee is paid in Kill Bill, its images are in storage and its receipt email is sent; any failure leaves an unpaid draft with no successful charge, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "entry-payment"
tests = [
    "test_app.py::test_submission_all_or_nothing",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-10"
title = "One payment per idempotency key"
text = "Repeating a submission with the same idempotency key returns the stored response with exactly one invoice, one payment and one receipt, and reusing the key for a different entry answers 409."
kind = "behavior"
primary = "pytest"
workflow = "entry-payment"
tests = [
    "test_app.py::test_idempotent_submission",
    "test_app.py::test_idempotent_submission_concurrent",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-11"
title = "Billing outage keeps the draft"
text = "When Kill Bill is unreachable the desk still starts, answers payment and refund attempts with the payments-paused 503, keeps the draft or entry unchanged, and accepts the payment on the next attempt once billing answers, with no restart."
kind = "behavior"
primary = "pytest"
workflow = "billing-outage"
tests = [
    "test_app.py::test_billing_outage_keeps_draft",
    "test_app.py::test_wf_billing_outage_pay_paused",
    "test_app.py::test_wf_billing_outage_refund_paused",
]
criteria = []
parameter_cases = []

