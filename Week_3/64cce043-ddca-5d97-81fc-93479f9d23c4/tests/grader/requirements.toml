schema_version = 1
id_prefix = "DP"
mandatory_count = 85
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "sign-in",
    "ledger-holdings",
    "search-facets",
    "grading-rules",
    "rule-reorder",
    "breach-logging",
    "breach-detail",
    "next-steps",
    "holding-deletion",
    "grant-access",
    "narrow-revoke",
    "grant-expiry",
    "account-security",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B13",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "S4",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 90
solo_criteria = []
services = [
    { name = "keycloak", env = {} },
    { name = "postgres", env = {} },
]

[criterion_weights]
B1 = 5
B2 = 5
B3 = 5
B13 = 5
B4 = 3
B5 = 3
B6 = 3
B7 = 3
B8 = 3
B9 = 3
B10 = 3
B11 = 3
B12 = 3
S1 = 5
S2 = 5
S3 = 5
S4 = 3
Q1 = 3
Q2 = 3
Q3 = 5
Q4 = 3
Q5 = 5
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "keycloak-down"
port = 4174
url_env = "APP_KEYCLOAK_DOWN_URL"

[outages.env]
KEYCLOAK_URL = "http://127.0.0.1:9"
AUTH_ISSUER_URL = "http://127.0.0.1:9"

[[outages]]
id = "short-grant"
port = 4175
url_env = "APP_SHORT_URL"

[outages.env]
GRANT_HOUR_SECONDS = "1"
SESSION_IDLE_SECONDS = "20"
DATABASE_URL = "${DATABASE_URL}_short"

[[requirements]]
id = "DP-01"
title = "Sign in through the realm"
text = "The owner signs in on the realm's sign-in page from link \"Sign in\" and lands on /vault (a trusted contact on /shared), or on the screen they first asked for as DP-61 allows."
kind = "behavior"
primary = "workflow"
workflow = "sign-in"
tests = [
    "test_app.py::test_wf_sign_in_return_to_page",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Browser-bound sign-in"
text = "Each sign-in attempt carries a fresh state and PKCE challenge bound to the browser that started it, and a callback with a missing, reused, expired or foreign state shows the sign-in failure page and creates no session."
kind = "behavior"
primary = "pytest"
workflow = "sign-in"
tests = [
    "test_app.py::test_wf_sign_in_state_bound",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Unfinished sign-in reaches nothing"
text = "A browser holding only a pending sign-in, or a contact who has not finished the realm's password step, gets the signed-out answer from every API route and sees no vault or grant data."
kind = "behavior"
primary = "pytest"
workflow = "account-security"
tests = [
    "test_app.py::test_unfinished_sign_in",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "A new account gets an empty vault"
text = "A realm account that is neither seeded nor a trusted contact gets its own empty vault with the default grading rules on its first sign-in, once only as DP-75 qualifies."
kind = "behavior"
primary = "pytest"
workflow = "sign-in"
tests = [
