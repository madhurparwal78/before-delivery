[task]
name = "gfkit/ourlet-consignment-desk"
version = "1.0.0"
description = "Ourlet Consignment Desk for Atelier Ourlet, a founder-run consignment boutique for good pre-owned clothing in Brussels: staff sign-in and members, a public rail with filters in the URL, intake with Luhn tag codes and cleaned photos, an effective-dated markdown ladder in Brussels days, shopper holds, a till with exact shares and Belgian VAT, monthly SEPA payout runs with statements, a private consignor page, intake appointments, a legacy spreadsheet import, a sales book export, period end and erasure, on Postgres, MinIO and Mailpit."
authors = [
    { name = "Sankalp Goel", email = "sankalp.goel5@ethara.ai" },
    { name = "Utsav Jain", email = "utsav.jain@ethara.ai" },
]
keywords = [
    "consignment",
    "second-hand",
    "markdown",
    "sepa",
    "pain.001",
    "brussels",
    "minio",
    "mailpit",
    "postgres",
    "typescript",
]

