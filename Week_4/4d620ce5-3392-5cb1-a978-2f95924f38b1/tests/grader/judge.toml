[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: in the front-end source, find the handler for the `revision` live event and for the ingesting planner's own success, and trace the splice code both reach. The phases are the header split, the top-to-bottom row stagger capped at 24 rows, and the count roll. Any single time-driven routine that schedules these phases in the brief's order passes, whether it chains them on completion or schedules them on one timeline with precomputed delays, provided the count roll is started from the end of the last animated cell (a completion callback, promise or finished event). Separate code paths for the two triggers, a missing phase, a count roll started without waiting for the last cell to settle, a phase that touches cells outside the spliced column, a scroll-linked driver, a replay on 'Back to current' or a looping animation fails. Cite file:line for each phase. Pass: one time-driven routine plays all splice phases on the affected column alone, in the brief's order, exactly once."

[criterion.annotations]
