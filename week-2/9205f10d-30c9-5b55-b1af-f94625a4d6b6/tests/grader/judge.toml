type = "binary"
weight = 3
description = "Recipe: search the source for interfaces or abstract classes with a single implementation, unused exports, commented-out code blocks, unreachable branches, and defensive checks for states the brief's rules make impossible (for example re-checking a status the transition guard already rejected). Cite each instance as file:line. Pass: the source contains none of these defects."

