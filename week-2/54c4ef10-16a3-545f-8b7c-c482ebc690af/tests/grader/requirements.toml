id = "DP-50"
title = "Curves follow every edit"
text = "Curve figures, readiness, meter bias and every reading's log H and zone are derived on read and follow every entry, EI, reciprocity exponent, frame, calibration and alignment edit, while a pinned reading's point, gross, net, calibration and entry never change after pinning, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "test-roll-curve"
tests = [
    "test_app.py::test_api_curves_follow_edits",
    "test_app.py::test_wf_test_roll_curve_correct",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-51"
title = "Published landing routes"
text = "Signed-out deep links return to the exact requested route after sign-in or sign-up when the next value is safe and to the archive otherwise, and every roll, log and sign-out action lands on its published route."
kind = "behavior"
primary = "pytest"
workflow = "archive-browse"
tests = [
    "test_app.py::test_wf_archive_browse_saved_link",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-52"
title = "Latest loupe cell wins"
text = "The loupe readout, curve dot and zone show only the reading for the cell the loupe currently rests on, discarding late responses for cells it has left, and a pin always stores that current cell."
kind = "behavior"
primary = "pytest"
workflow = "loupe"
tests = [
    "test_app.py::test_loupe_latest_cell_wins",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-53"
title = "Versioned alignment saves"
text = "Saving an alignment names the version it was based on, a save against any other version answers the stale-alignment conflict, and of simultaneous saves on one version exactly one succeeds, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "alignment"
tests = [
    "test_app.py::test_api_alignment_versions",
    "test_app.py::test_wf_alignment_stale_tab",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-54"
title = "Request-scoped records"
text = "Every response and screen comes only from the requesting session's account, so concurrent requests from two accounts never cross and a second account signing in after Sign out without a reload sees only its own records."
kind = "behavior"
primary = "pytest"
workflow = "access-isolation"
tests = [
    "test_app.py::test_api_concurrent_accounts",
    "test_app.py::test_wf_access_isolation_switch_account",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-55"
title = "Expired-session drafts"
text = "When Log exposure or Save note meets an expired session, the unsent fields are kept, the browser goes to sign in, and the same account gets every field back with nothing sent until it presses the button again, while any other account starts clean."
kind = "behavior"
primary = "pytest"
workflow = "shooting-log"
tests = [
    "test_app.py::test_wf_shooting_log_expired_session",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-56"
title = "Released when an upload is cut off"
text = "An upload cut off mid-body leaves no object and releases its duplicate guard and database connection within 2 seconds, so the same bytes re-uploaded at once are stored, while the health check keeps answering."
kind = "behavior"
primary = "pytest"
workflow = "scan-upload"
tests = [
    "test_app.py::test_api_cut_off_upload_released",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-57"
title = "Honest refusals during an outage"
text = "During a storage outage a refused edge nudge springs back to its saved column, a refused pin draws no marker and lists nothing, and a frame update that changes an edge saves no part of itself, title included."
kind = "behavior"
primary = "pytest"
workflow = "storage-outage"
tests = [
    "test_app.py::test_outage_refusals_spring_back",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-58"
title = "Loupe by touch"
text = "On touch, a first tap on the strip opens the loupe on that cell, a tap on another cell moves it without pinning, a second tap on the same cell pins it, and vertical swipes from the strip still scroll the page."
kind = "behavior"
primary = "pytest"
workflow = "loupe"
tests = [
    "test_app.py::test_loupe_by_touch",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-59"
title = "Owner-only derived surfaces"
text = "Curve from test roll options, Curves, the hero's latest aligned frame, Recent exposures and each roll's strongest frame are built only from the signed-in account's records, even when another account owns a newer record with the same name."
kind = "behavior"
primary = "pytest"
workflow = "test-roll-curve"
tests = [
    "test_app.py::test_api_owner_only_derived_surfaces",
]
criteria = []
parameter_cases = []

