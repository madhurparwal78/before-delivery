schema_version = "1.4"

[[artifacts]]
source = "/app"
exclude = [
    "node_modules",
    ".git",
]

[task]
name = "gfkit/saltprint-desk"
version = "1.0.0"
description = "Licensing desk for a photojournalist co-operative selling embargoed photo essays to newsrooms, with exclusive-window claims, standard licences, co-op-time embargoes, effective-dated commission rates, exact royalty splits, payouts and legal takedowns, on Postgres, MinIO, Kill Bill and Mailpit."
authors = [
    { name = "nishant.dubey", email = "nishant.dubey@ethara.ai" },
]
keywords = [
    "photojournalism",
    "syndication",
    "embargo",
    "exclusive-window",
    "licensing",
    "royalties",
    "takedown",
    "time-zones",
    "concurrency",
    "typescript",
]

[metadata]
uuid_v5 = "c8622c96-511f-5e13-bdb9-7e621d8add21"
identity_namespace_url = "https://tasks.example/gfkit/saltprint-desk/1.0.0"
category = "Greenfield"
domain = "media and publishing (photojournalism syndication co-operative, embargoed photo-essay licensing)"
archetype = "solo founder"
language = "typescript"
design_direction = "darkroom, newsprint, forensic; warm paper ground, ink type, hairline column rules, mono numerals, safelight red reserved for embargo and claim states, fixer green for granted states; Newsreader display, IBM Plex Sans body, IBM Plex Mono numerals; three-column contact sheet with full-viewport story viewer and ledger rail or bottom sheet; grease-pencil claim ring signature"
created_at = "2026-10-28"
service_profile = "postgres+minio+killbill+mailpit"
harbor_version = "0.24.0"
grader_version = "rewardkit-0.2.3"
contract_version = "1.0.0"
requirements_registry = "tests/grader/requirements.toml"
mandatory_requirement_count = 70
workflow_count = 14
rubric_criterion_count = 22
rubric_total_weight = 78
if_constraint_count = 6
scoring_policy = "reward=pytest-outcome-pass-rate;if_score+rubric+quality+combined_score-separate;binary-rubric-5/3/1"
self_contained = true
builds_from_source = true
null_floor = 0.0
platforms = [
    "linux/amd64",
    "linux/arm64",
]

[agent]
timeout_sec = 36000.0
network_mode = "public"

[environment]
os = "linux"
cpus = 4
memory_mb = 4096
storage_mb = 20480
network_mode = "public"
build_timeout_sec = 3600.0

[verifier]
environment_mode = "separate"
timeout_sec = 36000.0

[verifier.env]
JUDGE_SECRET = "${JUDGE_SECRET:-}"
JUDGE_URL = "${JUDGE_URL:-http://host.docker.internal:8790}"
