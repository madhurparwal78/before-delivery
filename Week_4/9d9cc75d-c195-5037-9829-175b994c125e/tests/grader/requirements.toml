[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[services]]
name = "postgres"

[services.env]
LOZ_GRADING = "1"
LOZ_FORMULA_MAX_CHARS = "2000"
LOZ_FORMULA_MAX_DEPTH = "16"
LOZ_MARK_MAX = "2000"
LOZ_QUERY_WORK_MAX = "5000000"
LOZ_QUERY_BUDGET_MS = "5000"
LOZ_ROW_MAX = "50000"
LOZ_CSV_MAX_BYTES = "20000000"
LOZ_FORMULA_DEBOUNCE_MS = "100"
LOZ_STALE_MS = "7200000"
LOZ_EXPORT_STEP_MS = "20"
LOZ_SSE_HEARTBEAT_MS = "2000"
LOZ_LOGIN_RATE = "1000"
LOZ_FORMULA_RATE = "100000"
LOZ_QUERY_RATE = "100000"

[[services]]
name = "minio"

[services.env]

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[requirements]]
id = "DP-01"
title = "Uploading a source"
text = "A creator chooses a CSV file on the upload page, sees a preview of its first 20 rows with each column's inferred type, uploads it, and adds a second table to the same source, as qualified in Data sources."
kind = "behavior"
primary = "workflow"
workflow = "data-upload"
tests = [
    "test_app.py::test_wf_data_upload_happy",
    "test_app.py::test_wf_data_upload_errors",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
