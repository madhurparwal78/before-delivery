text = "Of simultaneous identical links exactly one succeeds and the rest get 409 duplicate_insight, and simultaneous distinct links, importance changes and unlinks leave every counter equal to a recomputation."
kind = "behavior"
primary = "pytest"
workflow = "evidence-thread"
tests = [
    "test_app.py::test_simultaneous_links_exact",
]
criteria = []
parameter_cases = []

[[if_rules]]
id = "IF-01"
text = "/app/run.json exists with string fields install, build, serve and \"_schema\":\"run-manifest-v1\", and those commands are the only way the app is installed, built and started."
tests = [
    "test_app.py::test_if_run_manifest",
]
parameter_cases = []

[[if_rules]]
id = "IF-02"
text = "/app/THIRD_PARTY_NOTICES.md names every shipped package with its version and licence. Shipped packages are the production dependency tree reported by npm ls --omit=dev --all --json (the lockfile's non-dev group)."
tests = [
    "test_app.py::test_if_third_party_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Every shipped package and bundled font uses MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD, BlueOak-1.0.0, CC0-1.0 or OFL-1.1."
tests = [
    "test_app.py::test_if_licences_allowed",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "The only datastores are the provided PostgreSQL database and object storage bucket. No SQLite, embedded key-value store, Redis or data files are used as storage."
tests = [
    "test_app.py::test_if_no_extra_datastore",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "Provided service configuration (compose fragments, service images, seeded credentials) is used as given and left unmodified."
tests = [
    "test_app.py::test_if_provided_services_untouched",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "Application source, server and client, is TypeScript. JavaScript files appear only as build output or tool configuration."
tests = [
    "test_app.py::test_if_typescript_source",
]
parameter_cases = []

[[if_rules]]
id = "IF-07"
text = "Icons come from Lucide, and all illustration is SVG generated by the app. No stock or downloaded imagery."
tests = [
    "test_app.py::test_if_lucide_and_generated_art",
]
parameter_cases = []

[[if_rules]]
id = "IF-08"
text = "Pages load no scripts, styles or fonts from other hosts."
tests = [
    "test_app.py::test_if_same_origin_assets",
]
parameter_cases = []

