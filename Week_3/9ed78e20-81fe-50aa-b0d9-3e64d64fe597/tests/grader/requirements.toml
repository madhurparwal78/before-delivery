title = "Claim tether activation"
text = "Activating a claim marker by click, tap, Enter or hover puts the claim in the address, fills the marker with the accent, draws a leader line to the chart, fades every uncited row, counts the difference label up to the recorded difference and announces the claim in a polite live region."
