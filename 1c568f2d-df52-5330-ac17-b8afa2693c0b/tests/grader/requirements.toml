KEYCLOAK_URL = "http://127.0.0.1:9"

[[requirements]]
id = "DP-01"
title = "Deployment and health"
text = "The app serves from its run manifest on `0.0.0.0` at `APP_PUBLIC_PORT`, answers `GET /api/health` with `200` and the health body the API section defines, including its `identity` key, and answers every page and API route whatever host name the request carries."
kind = "behavior"
primary = "pytest"
workflow = "deployment"
tests = [
    "test_app.py::test_wf_deployment_health_and_hosts",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Server-rendered surfaces"
text = "Every staff surface and both public surfaces answer their own address with their headings, copy and data already in the first HTML response, and every staff route opened without a session redirects to `/login`."
kind = "behavior"
primary = "pytest"
workflow = "deployment"
tests = [
    "test_app.py::test_wf_deployment_server_rendered",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Sign in"
text = "`POST /api/auth/login` exchanges a seeded work email and passphrase with the identity provider server-side and returns the app's own opaque `access_token`, and `GET /api/auth/me` answers `{ id, email, name, role }` with the role the seed gave that account."
kind = "behavior"
primary = "pytest"
workflow = "access"
tests = [
    "test_app.py::test_wf_access_sign_in",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Sign out"
text = "`Sign out` and `POST /api/auth/logout` end the session server-side, so the revoked token is refused on every later read and write."
kind = "behavior"
primary = "pytest"
workflow = "access"
tests = [
    "test_app.py::test_sign_out",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-05"
title = "Credential refusal and lockout"
text = "Every failed sign-in gets the same status and byte-identical body whether or not the email belongs to an account, and the fifth failure for one trimmed, lower-cased email within the lockout window locks that email out, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "access"
tests = [
    "test_app.py::test_wf_access_lockout",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-06"
title = "Sign-in redirects"
text = "A staff route opened without a session redirects to `/login?next=<PATH>`, `next` is honoured only for a same-origin path beginning with a single `/`, and the public wall and plaque never redirect."
kind = "behavior"
primary = "pytest"
workflow = "access"
tests = [
    "test_app.py::test_sign_in_redirects",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-07"
title = "Role permissions and draft privacy"
text = "Every write is checked server-side against the role table and refused with `403` when the role may not act, every signed-in role reads every staff surface, and a maker naming another maker's draft on any route gets `404`."
kind = "behavior"
primary = "pytest"
workflow = "access"
tests = [
    "test_app.py::test_wf_access_draft_privacy",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-08"
title = "Auditor read-only"
text = "An `auditor` opens every piece by its id but is refused every write with `403`, its own preferences being the one exception, and no refused write changes anything stored."
kind = "behavior"
primary = "pytest"
workflow = "access"
tests = [
    "test_app.py::test_wf_access_auditor_read_only",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-09"
title = "Own-piece rule"
text = "The account that created a piece may not record either review on it, clear it or publish it, refused with `403` and the own-piece message, and the refusal writes nothing."
kind = "behavior"
primary = "pytest"
workflow = "review-rules"
tests = [
    "test_app.py::test_wf_review_rules_own_piece",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-10"
title = "Second-reviewer rule"
text = "The account that recorded a piece's licence review may not record its accessibility review, refused with `403` and the second-reviewer message, while a different accessibility reviewer may."
kind = "behavior"
primary = "pytest"
workflow = "review-rules"
tests = [
    "test_app.py::test_second_reviewer",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-11"
title = "Citation checks"
text = "Submitting a piece that cites no object, or cites an unusable object, is refused on `object_ids` with one line per offending object naming one of the three pinned reasons."
kind = "behavior"
primary = "pytest"
workflow = "review-rules"
tests = [
    "test_app.py::test_citation_checks",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-12"
title = "Duplicate acknowledgement"
text = "A licence review cannot pass while any flagged duplicate of a cited object is unacknowledged in the current review round, and each acknowledgement is stored once with who made it, for which piece and when."
kind = "behavior"
primary = "pytest"
workflow = "review-rules"
tests = [
    "test_app.py::test_wf_review_rules_duplicate_ack",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-13"
title = "Legal steps"
text = "A piece moves only along the rows of the state table, each successful step raising `version` and appending exactly one audit entry, with `Import pack` as the one stated exception that creates pieces directly in a state."
kind = "behavior"
primary = "pytest"
workflow = "state-machine"
tests = [
    "test_app.py::test_wf_state_machine_legal_steps",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-14"
title = "Illegal steps"
text = "Any step or `action` value outside the state table is refused with `409` and the illegal-step message, leaving the piece and the audit trail unchanged."
kind = "behavior"
primary = "pytest"
workflow = "state-machine"
tests = [
    "test_app.py::test_wf_state_machine_illegal_steps",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-15"
title = "Revision resets the round"
text = "Revising a piece back to `draft` is the owning maker's step alone and discards both review records and every duplicate acknowledgement for that piece, so the next round starts from nothing."
kind = "behavior"
primary = "pytest"
workflow = "review-rules"
tests = [
    "test_app.py::test_wf_review_rules_revise_round",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-16"
