name = "S2"
type = "binary"
weight = 5
description = "Recipe: read the browser-side source tree and every server route handler that serialises configuration, health, system status or assets. Look for any credential or service URL (including the storage endpoint) that reaches browser code or a response body, other than the signed media links. Any instance fails; a non-secret setting such as the run duration does not. Cite it as `file:line`. Pass: no browser code or API response carries a credential or service URL beyond the signed media links."

