evidence = "file_line"
cites = "L42, L1046-L1103"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: find every place that sends or prepares a customer email and trace it to the transport. A direct send from a route handler or use of Mailpit's HTTP API to inject messages counts as failing. Cite the enqueue, worker and transport as `file:line`. Pass: every customer email reaches the mail server only through the outbox worker's SMTP send to SMTP_HOST:SMTP_PORT."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
