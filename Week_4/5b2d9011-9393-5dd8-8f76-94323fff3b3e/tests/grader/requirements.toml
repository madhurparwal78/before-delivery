[[if_rules]]
id = "IF-01"
text = "/app/run.json exists with string install, build and serve fields and \"_schema\":\"run-manifest-v1\", and the app runs only through it."
tests = [
    "test_app.py::test_if_run_manifest",
]
parameter_cases = []

[[if_rules]]
id = "IF-02"
text = "THIRD_PARTY_NOTICES.md at /app lists every shipped package with its licence, where shipped packages are the Go modules the program imports plus the frontend production dependency tree (npm ls --omit=dev --all --json), and the fonts."
tests = [
    "test_app.py::test_if_third_party_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Every shipped package and font uses MIT, BSD-2-Clause, BSD-3-Clause, Apache-2.0, ISC, MPL-2.0, Zlib, CC0-1.0, Unlicense or OFL-1.1, and nothing GPL, LGPL, AGPL or SSPL ships."
tests = [
    "test_app.py::test_if_licences_allowed",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "The only datastores are the provided Postgres, Valkey and Mailpit; there is no SQLite, embedded database, or file used as a database."
tests = [
    "test_app.py::test_if_datastores_only_provided",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "The seed records (studio, studio key, prices, series and maps) match Seed data exactly and are not altered by migrations or code."
tests = [
    "test_app.py::test_if_seed_records",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "go.sum and the frontend lockfile are committed, and the build works offline from them after install."
tests = [
    "test_app.py::test_if_lockfiles_committed",
]
parameter_cases = []

[[if_rules]]
id = "IF-07"
text = "Fonts are Pixelify Sans and Chakra Petch, loaded from Google Fonts or vendored OFL files, and no art, audio, models or text comes from another game or website."
tests = [
    "test_app.py::test_if_fonts",
]
parameter_cases = []

