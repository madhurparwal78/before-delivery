primary = "workflow"
workflow = "sign-in-board"
tests = [
    "test_app.py::test_wf_sign_in_board_roles",
    "test_app.py::test_wf_sign_in_board_wrong_password",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "One server clock in kitchen time"
text = "The server keeps a single clock, real or started from `PASSBOARD_NOW`, and reports now, the kitchen's today and its published settings in the kitchen's time zone."
