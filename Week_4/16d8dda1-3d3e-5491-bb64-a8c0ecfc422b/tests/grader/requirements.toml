[[if_rules]]
id = "IF-03"
text = "Every shipped package (the production dependency tree from npm ls --omit=dev --all --json) is licensed MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD or BlueOak-1.0.0."
tests = [
    "test_app.py::test_if_licences_allowed",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "The app uses only Postgres, MinIO and Valkey as backing services: no other database, cache, broker, mail or PDF service, and no file or in-memory stand-in for them."
tests = [
    "test_app.py::test_if_backing_services",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "The provided service configuration and its dev credentials are left untouched, and the app reads every service setting from the environment."
tests = [
    "test_app.py::test_if_service_config_from_environment",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "The browser loads nothing from outside the app's origin: no CDN scripts, web fonts, analytics or remote images."
tests = [
    "test_app.py::test_if_same_origin_assets",
]
parameter_cases = []

[[if_rules]]
id = "IF-07"
text = "A committed npm lockfile pins the dependency tree that install uses."
tests = [
    "test_app.py::test_if_lockfile_pins_tree",
]
parameter_cases = []

