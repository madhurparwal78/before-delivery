[[requirements]]
id = "DP-62"
title = "Background jobs with retries and dead letters"
text = "Outbound mail, résumé erasure and sample uploads run as database-held jobs claimed only by instances that can reach their service, with backoff retries, and jobs refused too many times move to a dead-letter list that administrators can inspect and retry."
