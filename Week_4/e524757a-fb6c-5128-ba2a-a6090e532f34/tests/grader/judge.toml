weight = 3
description = "Recipe: `playwright` at 1280x800, signed in, open `/play?island=1&spot=1&gfx=full`, press Tab until `World view` has focus, press Home (camera behind the explorer, who faces east on the dock) and then `-` once (widest view), so the sea behind the dock shows along the bottom of the view; if no water shows, press Q or E until water is in view. Screenshot. Reload the same address with `gfx=light`, press the same keys, and screenshot again. Read `data-preset` in each. Two screenshots with the same uniform water fill fail. Pass: the water in the full screenshot shows a mirrored sky gradient or a reflected silhouette of a tree, the dock or the explorer that the flat-filled water in the light screenshot lacks."

