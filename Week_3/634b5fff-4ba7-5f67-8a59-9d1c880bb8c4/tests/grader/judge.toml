[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: from the route handlers and event consumers, trace the authorisation, capture, void, refund, courier booking, certificate render and store, statement render and store, receipt and gift mail, charity webhook, maker push alert, search index update and staff sign-in to the outgoing client call for each provider. Look for in-memory fakes, flags that swap a provider for a stub, and any route that mutates state for testing such as reset, force-settle or time travel; the brief gateway callback route is allowed. A success state set without the provider call, or a test-only mutation route, fails, cited as `file:line`. Pass: each effect named in the brief reaches its provider through a real client call."

