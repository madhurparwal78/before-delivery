type = "binary"
weight = 5
description = "Recipe: read the server configuration module and every place that connects to Postgres, MinIO and SMTP or builds the sign-in link. Treat as allowed literals only the brief's documented defaults: port 4173, the localhost sign-in link fallback and the four timing defaults. Cite every hard-coded credential, endpoint, bucket, host or sender as file:line. Pass: every service URL, credential, sender and public URL is read from the environment at start with no literal beyond those documented defaults."

[criterion.annotations]
channel = "source"
