weight = 3
description = "Recipe: read the request-body handling of every POST route and the error responses. A body spread or `Object.assign` into a stored record, or an error body built outside the one shared error helper, counts as a fail. Cite the helper and each violation as `file:line`. Pass: every route reads its body through an explicit accepted-key list with checked types."

[criterion.annotations]
