type = "binary"
weight = 5
description = "Recipe: locate the implementation of derived staffing status, claim eligibility, schedule overlap, the free-cancellation cutoff, the charge rule and the per-role field lists, then search routes, workers, SQL and the frontend for any second computation of each. A duplicated rule (for example the fee recomputed in the cancel route separately from the quote, or the frontend re-deriving status from seats) counts as a defect; cite each as file:line. Pass: each of the six rules has exactly one implementation that every caller uses."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
