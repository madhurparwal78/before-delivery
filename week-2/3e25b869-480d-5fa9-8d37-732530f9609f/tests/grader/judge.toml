name = "S4"
type = "binary"
weight = 3
description = "Recipe: open the client module that renders figure 'Loaf' and trace how it draws the loaf, slices, swirl, wire and wraps. A bitmap, video or pre-rendered sprite standing in for the loaf counts as failing. Cite the context creation, geometry, shaders, swirl seeding and any image asset use as `file:line`. Pass: the loaf is drawn by WebGL shaders from geometry built in code."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
