[[criterion]]
id = "Q5"
name = "Q5"
type = "binary"
weight = 5
description = "Recipe: `source` MCP. 1. Read the levelling, retention, half-release, store split and invoice-amount code paths. 2. Fail any money value held as a fractional JavaScript number: parseFloat, Number division yielding a fraction, Math.round on a fractional result, toFixed used for arithmetic, or percent multiplication on floats. Cite each as file:line. 3. Allow exact integer or BigInt quotient and remainder (floor division with the remainder kept) in the largest-remainder store split, which the brief says is allocated, not rounded, and in the integer half-up rounding of the levelling contingency, the retention held with its cap and the half release (rounding up when twice the remainder reaches the divisor), whether that rounding lives in one helper or at each of the three values. Converting cents to a two-decimal string only for display, CSV or the Kill Bill payload is allowed. Pass: no money value passes through floating-point arithmetic."

