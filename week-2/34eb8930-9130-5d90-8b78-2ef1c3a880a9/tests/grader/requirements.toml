schema_version = 1
id_prefix = "DP"
mandatory_count = 60
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "home-search",
    "create-share",
    "live-co-editing",
    "suggesting",
    "settle-cards",
    "comments-mentions",
    "role-change",
    "timed-access",
    "revoke-delete",
    "saving",
    "keyboard-review",
    "mobile-review",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "S4",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
    "Q8",
]
rubric_total_weight = 84
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "minio", env = {} },
]

[criterion_weights]
B1 = 5
B2 = 3
B3 = 3
B4 = 5
B5 = 3
B6 = 3
B7 = 5
B8 = 3
B9 = 3
B10 = 5
B11 = 3
B12 = 3
S1 = 5
S2 = 3
S3 = 3
S4 = 3
Q1 = 3
Q2 = 3
Q3 = 5
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 3
Q8 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_minio_down"

[[outages]]
id = "short-idle"
port = 4175
url_env = "APP_SHORT_IDLE_URL"

[outages.env]
PRESENCE_IDLE_SECONDS = "3"
DATABASE_URL = "${DATABASE_URL}_short_idle"
S3_BUCKET = "${S3_BUCKET}-short-idle"

