description = "Recipe: read the database schema, the shared types and the route handlers, and list the identifiers that stand for the brief's domain concepts (model, revision, upload, stage, visibility, licence, edition copy, plan, quota, collection, embed, share link, read key). Pass: each concept uses the brief's term throughout, with no synonym for the same concept (such as asset or item for model, tier for plan, job for upload) in any type, table or function name."

