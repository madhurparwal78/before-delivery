[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read /app/run.json to find the serve entrypoint. Then read the configuration code and every module that opens the Postgres connection, the SMTP client and the S3 client. Search the whole source for literal database URLs, SMTP or S3 hostnames and endpoint URLs, access keys, passwords and secrets used to reach a service. Seed account passwords and the defaults the brief documents (port 4173, the session, idempotency and escalation defaults, the stated MAIL_FROM) are allowed, and so are non-secret defaults such as a port number or bucket name. Pass: every service URL and credential comes from its named environment variable with no literal URL, host or credential fallback, citing each read as file:line."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-05",
]
evidence = "file_line"
cites = "L29, L424, L609, L702, L706, L708, L726, L803, L807"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: from the entrypoint, read the HTML shell, the browser source, every response serialiser, error handler and header-setting code, and the health endpoint. Look for a service credential, secret, database URL, SMTP host or S3 endpoint URL placed into a page, script, JSON body or header. The S3 host inside a presigned download URL is allowed, because the brief requires that link, and so are non-secret values such as a cookie Max-Age derived from the session TTL. Pass: no credential, secret or service URL other than the presigned link reaches the browser, and any instance fails cited as file:line."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-05",
]
evidence = "file_line"
cites = "L730-L733, L807"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: search the source for every read of the process environment (os.environ, os.getenv, settings loaders, dotenv). Find where each variable the brief names is read, and any place where a variable whose name contains OBSERVER is read or influences configuration or behaviour. Pass: each named variable the server uses is read from the environment by its name and no OBSERVER variable influences the server, cited as file:line."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-05",
]
evidence = "file_line"
cites = "L807"

[[criterion]]
id = "Q1"
name = "Q1"
type = "binary"
weight = 5
description = "Recipe: find where the server computes the on-duty and senior counts, the effective floor lookup and the breach labels, and where the browser builds breach-label text for strip cells and the Today status cell. Then trace Today, the preview, the approval check and the floor_breach details back to the server definitions, and every browser label render back to the browser definition. The brief has the browser compute shown shortfalls itself while preview is off, so one implementation per tier is allowed. A second implementation within the same tier is a defect, for example a Today count computed apart from the preview's count, or label text built in two browser components. Pass: within the server and within the browser, every caller of these rules uses a single shared definition, cited as file:line."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L833, L484-L489, L497, L501-L515, L572-L577"

[[criterion]]
id = "Q2"
name = "Q2"
type = "binary"
weight = 5
description = "Recipe: find the code deciding these rules, then trace their callers: whether an attendance is open or a missed clock-out, the late flag, the attendance version check, a request's cost and booked hours, each leave-request transition, the shared Idempotency-Key rule for punches and claims, the accrual formula, CSV cell neutralising, email header neutralising and the signed-download disposition. Any rule decided in two places is a defect. Examples: a missed clock-out tested inline in a query and again in Python, or separate idempotency code for punches and claims. Pass: each of these rules lives in exactly one place, cited as file:line."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L833, L529-L547, L597-L618, L663, L693, L718-L723, L735-L739"

[[criterion]]
id = "Q3"
name = "Q3"
type = "binary"
weight = 3
description = "Recipe: read the error type or helper and the global error handlers. Search every endpoint for responses built by hand with an error or message key, and find where each endpoint's published body keys are declared. An endpoint that returns its own error dict is a defect. So is one that checks unknown body keys with its own ad hoc list outside the one declaration mechanism. Pass: every API error is produced through one error shape helper, cited as file:line."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L835, L833, L274-L276"

[[criterion]]
id = "Q4"
name = "Q4"
type = "binary"
weight = 3
description = "Recipe: trace how rota entries, queue items, leave requests, covers, attendance and Today's lists read a person's name. A live view that reads a stored snapshot name, or a shared helper that switches name source by a flag, is a defect. Pass: every live view joins the person's current display name at read time, cited as file:line."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
