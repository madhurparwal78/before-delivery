type = "binary"
weight = 3
description = "Recipe: Search server source for every logging call (console methods and any logger) and every error handler, and trace what each prints: config objects, connection strings, environment values, provider request headers or raw provider errors that embed them. Cite each offending call as file:line. Pass: no log statement can print a service URL, credential or connection string."

[criterion.annotations]
channel = "source"
