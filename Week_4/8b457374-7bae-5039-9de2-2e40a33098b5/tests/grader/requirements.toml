[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_kbdown"
S3_BUCKET = "${S3_BUCKET}-kbdown"
MIN_CAMPAIGN_SECONDS = "20"
FINAL_WINDOW_SECONDS = "30"
FIX_WINDOW_SECONDS = "40"
FIX_NOTICE_SECONDS = "15"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAIL_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"
MAILPIT_URL = "http://127.0.0.1:9"
