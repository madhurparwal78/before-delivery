weight = 3
description = "Recipe: search the server source for every logging call (console.*, logger methods, error handlers that print) and trace what values reach them, including startup banners and connection error handlers. Cite each offending call as `file:line`. Pass: no logging call prints the database URL, an S3 credential, the SMTP settings or a whole config or environment object."

