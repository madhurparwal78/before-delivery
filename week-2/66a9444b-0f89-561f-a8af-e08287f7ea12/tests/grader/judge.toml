[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server configuration module and every place that connects to Postgres, Kill Bill, SMTP/Mailpit and MinIO, then search the server source for literal service hosts, ports, usernames, passwords, API keys, secrets and bucket names. Values the brief itself prints are allowed literals: the port fallback, the time-rule lengths, the seed data (including the seed account password and emails), the mail sender and Message-ID domain, and the object key layouts (such as `passes/<order ref>/<pass code>.pdf`) filled in at runtime. Any literal service URL, service credential, tenant key, bucket name or complete object key counts as a defect cited as `file:line`. Pass: every service URL and credential is read from the environment variables the brief names."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-02",
]
evidence = "file_line"
cites = "L37, L921, L926, L757-L763, L788-L790, L815-L820, L828"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 3
description = "Recipe: read the browser entry and every module it imports, the build configuration (any env exposure such as `define` or public env prefixes), the health handler, the error handler and the file-link handlers. Any credential, service URL or object key found there counts as a defect cited as `file:line`. Pass: no browser-bundled module or API response carries a credential, service URL or MinIO object key."

