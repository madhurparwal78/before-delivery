[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "killbill-down"
port = 4175
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "mailpit-down"
port = 4176
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[outages]]
id = "short-timer"
port = 4177
url_env = "APP_SHORT_URL"

[outages.env]
SESSION_LIFETIME_SECONDS = "90"
STARTUP_OVERDUE_SECONDS = "60"
ESTIMATE_EXPIRY_SECONDS = "40"
KILLBILL_KEY_PREFIX = "short"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
id = "DP-01"
title = "Sessions and roles"
text = "Seeded staff and owners sign in with email and password, every other API route except health and service status answers 401 without a live session, and each role reaches only the actions the role table in Business rules grants, with 403 otherwise."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_wf_cross_cutting_roles",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "One error shape and order"
text = "Every API error uses the single error shape and the single precedence order defined in API, so the same fault always yields the same status and body."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_wf_cross_cutting_error_order",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Owners reach only their own cars"
text = "An owner reaches only their own cars and those cars' bay billing, condition reports, photos, sent jobs, invoices and releases on every page, endpoint, search result, total and email, and any other id, including one inside a request body or edited into a URL, answers 404."
kind = "behavior"
primary = "pytest"
workflow = "owner-portal"
tests = [
    "test_app.py::test_owner_isolation",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Idempotent submissions"
text = "Release requests, invoice issues, care-round entries and bank transfers carry an idempotency key whose record lives in Postgres, so a replay on any app process returns the original response without a second effect, a failed attempt may be retried with the same key on any process, and a reused key with a different body answers 409."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_idempotent_submissions",
]
criteria = []
parameter_cases = []

