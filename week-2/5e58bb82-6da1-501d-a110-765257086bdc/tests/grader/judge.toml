name = "S4"
type = "binary"
weight = 3
description = "Recipe: in the chart code, find where swaths are filled. Trace the fill colour back to its inputs. A single fixed tint counts as a fail. Cite the computation as `file:line`. Pass: the swath fill colour is computed from each fix's `depth_m` with deeper water drawn darker."

[criterion.annotations]
