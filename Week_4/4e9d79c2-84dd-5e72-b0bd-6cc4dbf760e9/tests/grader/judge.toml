[[criterion]]
id = "Q4"
name = "Q4"
type = "binary"
weight = 5
description = "Recipe: Trace selling price, VAT, deposit, waiting charge, per-head split, cancellation charge and allocation through their arithmetic, then search those paths for `parseFloat`, `Number(`, `toFixed` and float-typed money columns. Any of these applied to a pounds-and-pence amount before its final display fails. Whole pennies held in an integer or a safe-integer number are exact and are not a defect, and neither is a decimal library's own method, a percentage used for a bar's width or a validity check on typed text. Cite each defect as `file:line`. Pass: Money is computed in exact pennies or decimals throughout, never in binary floating point."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
