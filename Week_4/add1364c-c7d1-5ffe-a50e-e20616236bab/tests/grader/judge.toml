description = "Recipe: read the server configuration code, then search the whole source (server and client) for `process.env`, `http://`, `https://`, host names, user names, API keys and client secrets. Literals the brief itself fixes are not defects: the bind host `0.0.0.0`, port 4173 and `APP_PUBLIC_PORT`, office key `bl`, the 28,800, 60 and 900 second settings, the key derived from the client secret, the seed password `KeysKept-2026`, the generated Keycloak email domain, and the seeded vendor domains. Pass: every Postgres, Keycloak, Kill Bill and breach-feed URL or credential is read from its published environment variable."

