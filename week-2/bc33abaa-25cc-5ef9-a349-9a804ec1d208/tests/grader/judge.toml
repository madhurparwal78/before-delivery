type = "binary"
weight = 3
description = "Recipe: trace the lock claim and lock takeover routes from handler to storage. An in-process map or a PostgreSQL table as the lock source of truth fails, cited as file:line. Pass: lock claims write the object_locks record through PocketBase's HTTP API configured from the POCKETBASE environment settings."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-57",
]
evidence = "file_line"
