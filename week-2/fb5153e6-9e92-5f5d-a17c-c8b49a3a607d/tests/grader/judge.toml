type = "binary"
weight = 3
description = "Recipe: read the state machine, queue, checkout and plan code for null guards, try/catch blocks and fallback branches, and judge each against whether the domain rules allow that state (for example a model with no revision after creation, a stage name outside the union, a state outside the four). Guards on request input and on provider failures are allowed because those states are possible. Pass: no guard, catch or fallback exists for a state the domain rules make impossible."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L939"

[[criterion]]
