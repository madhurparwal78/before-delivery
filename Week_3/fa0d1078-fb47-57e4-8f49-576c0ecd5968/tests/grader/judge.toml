weight = 5
description = "Recipe: `playwright` at 1280x800, freshly load `/` as a visitor, take a screenshot, and read the bounding boxes of the four level buttons and of `#specimen` with browser_evaluate. Pass: the specimen tile sits to the right of the stacked level names with its vertical extent overlapping theirs."

[criterion.annotations]
channel = "experience"
