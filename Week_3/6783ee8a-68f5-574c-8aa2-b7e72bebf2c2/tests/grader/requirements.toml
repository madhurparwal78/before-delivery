[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
BRACKENPAD_GRADING = "1"

[[outages]]
id = "tight-limits"
port = 4175
url_env = "APP_TIGHT_LIMITS_URL"

[outages.env]
BRACKENPAD_OUTPUT_LINE_CAP = "5"
BRACKENPAD_OUTPUT_BYTE_CAP = "2000"
BRACKENPAD_TABLE_PAGE_ROWS = "3"
BRACKENPAD_IMPORT_MAX_BYTES = "4000"
BRACKENPAD_CHECKPOINTS_KEPT = "3"
BRACKENPAD_PRESENCE_TIMEOUT_MS = "3000"
BRACKENPAD_EXEC_LIMIT_MS = "1500"
DATABASE_URL = "${DATABASE_URL}_tight"
S3_BUCKET = "${S3_BUCKET}-tight"
BRACKENPAD_GRADING = "1"

[[requirements]]
