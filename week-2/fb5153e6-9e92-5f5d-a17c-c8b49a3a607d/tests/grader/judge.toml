type = "binary"
weight = 3
description = "Recipe: find the function that builds API error responses, then search every route handler and middleware for hand-built error bodies (an object literal with an `error` key, or a status call followed by a literal JSON body). Pass: every API error response is produced by that one function in the published shape and codes, with no handler hand-building an error body."

[criterion.annotations]
channel = "quality"
