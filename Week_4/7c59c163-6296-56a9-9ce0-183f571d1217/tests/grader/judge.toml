weight = 3
description = "Recipe: search the source for commented-out code blocks, unused exports, unreachable branches, endpoints, screens or settings the brief does not list. Any instance fails; cite each as `file:line`. Pass: the source carries no dead, commented-out or unreachable code and no feature beyond the brief."

