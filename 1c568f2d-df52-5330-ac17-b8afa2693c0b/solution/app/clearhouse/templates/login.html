{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body_class %}signin{% endblock %}
{% block page %}
<main id="main" class="signin-main">
  <section class="sheet signin-card" aria-labelledby="signin-title">
    <p class="brand brand--lone">Clearhouse <span class="brand__org">Fenwick Science Centre</span></p>
    <h1 id="signin-title">Sign in to the clearance desk</h1>
    <div class="summary" role="alert" tabindex="-1" data-summary hidden>
      <h2>There is a problem</h2>
      <ul></ul>
    </div>
    <form class="form" data-signin data-next="{{ next_path }}" novalidate>
      <div class="field">
        <label for="email">Work email</label>
        <p class="field__error" id="email-error" hidden></p>
        <input id="email" name="email" type="email" autocomplete="username" spellcheck="false">
      </div>
      <div class="field">
        <label for="password">Passphrase</label>
        <p class="field__error" id="password-error" hidden></p>
        <input id="password" name="password" type="password" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn--primary btn--wide">Sign in</button>
    </form>
  </section>
</main>
{% endblock %}
