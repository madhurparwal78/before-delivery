name = "Q4"
type = "binary"
weight = 3
description = "Recipe: search every route and middleware for error responses, citing as `file:line` any error reply whose body is neither the `{\"error\":\"<code>\",\"message\":\"<text>\"}` shape nor the 422 `{\"errors\":{\"<field>\":\"<message>\"}}` shape, and any error reply sent as a bare status with no body. One helper per published shape is correct. Pass: every error reply carries one of the brief's two published error shapes."

[criterion.annotations]
