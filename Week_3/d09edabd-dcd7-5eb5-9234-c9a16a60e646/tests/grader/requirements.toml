[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "valkey-down"
port = 4174
url_env = "APP_VALKEY_DOWN_URL"

[outages.env]
VALKEY_URL = "redis://127.0.0.1:9/0"
INSTANCE_NAME = "valkey-down"

[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
INSTANCE_NAME = "minio-down"

[[outages]]
id = "mailpit-down"
port = 4176
url_env = "APP_MAIL_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"
INSTANCE_NAME = "mail-down"

[[outages]]
id = "peer"
port = 4177
url_env = "APP_PEER_URL"

[outages.env]
INSTANCE_NAME = "b"

[[outages]]
id = "short-timer"
port = 4178
url_env = "APP_SHORT_URL"

[outages.env]
PLAYTEST_DURATION_SECONDS = "20"
HINT_COOLDOWN_SECONDS = "5"
LOCK_TTL_SECONDS = "5"
INSTANCE_NAME = "short"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
id = "DP-01"
title = "Run manifest and health"
text = "The app installs, builds and serves from the run manifest on port 4173, and its health endpoint answers 200 with status ok and each service's state, as specified in Deployment."
kind = "behavior"
primary = "pytest"
workflow = "cross-cutting"
tests = [
    "test_app.py::test_health_reports_services",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Accounts and sign-in"
text = "A visitor can create a venue workspace (an owner account plus the five starter rooms) or sign in with email and password, and every workspace endpoint refuses signed-out requests with 401."
