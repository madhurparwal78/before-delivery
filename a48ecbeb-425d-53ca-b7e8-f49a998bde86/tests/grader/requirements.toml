]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "Fonts, icons and scripts are served from the app itself, and no page loads a resource from a third-party host at runtime."
tests = [
    "test_app.py::test_if_same_origin_assets",
]
parameter_cases = []

[[if_rules]]
id = "IF-07"
text = "The repository holds no imported 3D model files (`.glb`, `.gltf`, `.obj`, `.fbx`). The can is generated in code."
tests = [
    "test_app.py::test_if_no_model_files",
]
parameter_cases = []

