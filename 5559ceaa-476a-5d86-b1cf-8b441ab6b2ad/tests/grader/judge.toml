id = "B3"
name = "B3"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800. 1) Sign in as a fresh mentor using the sign-in script in the test plan. 2) On Projects, press \"New project\", enter a unique title such as \"Judge Group <random>\", choose \"Group\" and press \"Create project\". 3) In the new workspace open \"Members\", invite a fresh learner (email `judge-<random>@example.com`, name \"Judge Learner <random>\"), then close the dialog with Escape. 4) Press \"Schedule session\", enter a unique session title and a start time later today, press \"Schedule\", then press \"Start session\". 5) Use browser_evaluate to read the ring colour (border, outline or box-shadow colour) of the mentor's and the learner's avatars and the fill colour of `img \"Baton\"`. 6) Take a screenshot of the presence rail. Pass: the mentor's avatar ring and the baton glyph are a warm amber (orange-yellow hue, medium-high saturation) while the learner's ring is a cool mid-grey with no amber."

[criterion.annotations]
