    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 82
services = [
    { name = "postgres", env = {} },
    { name = "killbill", env = {} },
    { name = "minio", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Pilotlight <no-reply@pilotlight.test>" } },
]

[criterion_weights]
B1 = 5
B2 = 5
B3 = 3
B4 = 3
B5 = 3
B6 = 3
B7 = 3
B8 = 5
B9 = 5
B10 = 3
B11 = 3
B12 = 3
S1 = 5
S2 = 5
S3 = 3
Q1 = 3
Q2 = 5
Q3 = 5
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "killbill-down"
port = 4174
url_env = "APP_KILLBILL_DOWN_URL"

[outages.env]
KILLBILL_URL = "http://127.0.0.1:9"

[[outages]]
id = "minio-down"
port = 4175
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

