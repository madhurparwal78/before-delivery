[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the entry named by `serve` in run.json and the modules it loads, then find where each variable of the brief's configuration list is read and where each service URL, credential, limit, timer and clock setting is used. A literal connection string, bucket name, access key, grading key or timer length in non-test source is a defect, so cite each as `file:line`. Pass: every such value comes from `process.env` through the configuration module, with only the brief's documented defaults as fallbacks."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-45",
]
evidence = "file_line"
cites = "L71, L641-L658"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: search the client source (browser entry, components, any settings object the page loads), the HTML templates and the API response builders for values read from the environment. Credentials, secrets, the grading key, database or storage URLs and storage settings embedded in client code, page HTML or a response body are defects, so cite each as `file:line`. The server's today date served by `/api/me` and the chart animation duration shown in the chart's `data-animation-ms` attribute are the only environment-derived values the brief lets the browser receive. Pass: no credential, secret, service URL or limit read from the environment reaches the browser."

[criterion.annotations]
channel = "source"
