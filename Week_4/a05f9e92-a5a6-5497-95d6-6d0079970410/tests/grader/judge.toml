name = "Q1"
type = "binary"
weight = 3
description = "Recipe: read the TypeScript in the server and client source directories and the tsconfig. Search for `any`, `as any`, `@ts-ignore`, `@ts-expect-error` and `JSON.parse` results that flow into record, SLA, change or rule values without a type. Cite each defect as `file:line`. Pass: no domain data is typed `any`."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L1604"

[[criterion]]
id = "Q2"
name = "Q2"
type = "binary"
weight = 5
description = "Recipe: for each of the transition tables, the priority matrix, the SLA elapsed-time and threshold formulas, impact traversal, the risk score, each quorum rule, access evaluation and the expression grammar, grep for its characteristic constants (the priority table values, the risk weights, the quorum rule names, the transition state pairs) and read which modules decide it. Cite any second place that re-decides the same rule as `file:line`. Pass: each of those domain rules is decided in exactly one module that every route, background job and view calls."

[criterion.annotations]
channel = "quality"
