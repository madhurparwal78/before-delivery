description = "Recipe: `source`. 1) In the decision transaction, read how the request row, the raiser's approvals in that month and the trail tail are locked before they are checked and written. 2) A guarantee resting only on an in-memory mutex or a check before writing fails. 3) Cite the lock statement, such as SELECT ... FOR UPDATE or an advisory lock, as file:line. Pass: the transaction takes a database lock that serialises simultaneous approvals for one raiser."

