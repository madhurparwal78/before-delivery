[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "mail-down"
port = 4175
url_env = "APP_MAIL_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[outages]]
id = "minio-denied"
port = 4176
url_env = "APP_MINIO_DENIED_URL"

[outages.env]
S3_SECRET_ACCESS_KEY = "wrong-secret-value-7e21c4"

[[outages]]
id = "short-timers"
port = 4177
url_env = "APP_SHORT_URL"

[outages.env]
LOCKOUT_SECONDS = "6"
STEP_UP_TTL_SECONDS = "6"
SESSION_TTL_SECONDS = "45"
BREAK_GLASS_SECONDS = "20"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[outages]]
id = "idle-timers"
port = 4178
url_env = "APP_IDLE_URL"

[outages.env]
SESSION_IDLE_SECONDS = "12"
DATABASE_URL = "${DATABASE_URL}_idle"
S3_BUCKET = "${S3_BUCKET}-idle"

[[outages]]
id = "tamper"
port = 4179
url_env = "APP_TAMPER_URL"

[outages.env]
DATABASE_URL = "${DATABASE_URL}_tamper"
S3_BUCKET = "${S3_BUCKET}-tamper"

[[requirements]]
id = "DP-01"
title = "Sign-in refusal and lockout."
text = "Refuse a failed sign-in with the same status, body, wording and comparable response time whether or not the account exists, and lock an identity after repeated failures for the period stated in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "sign-in-and-landing"
tests = [
    "test_app.py::test_sign_in_refusal_indistinguishable",
    "test_app.py::test_sign_in_lockout",
    "test_app.py::test_wf_sign_in_and_landing_refused_then_recovers",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Role landing routes."
text = "Land each role on its published route after sign-in, and keep that screen on reload and on opening that address directly."
kind = "behavior"
