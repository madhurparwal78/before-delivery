parameter_cases = []

[[if_rules]]
id = "IF-02"
text = "/app/THIRD_PARTY_NOTICES.md lists every shipped package (the production dependency tree from npm ls --omit=dev --all --json) with its licence, plus the bundled fonts and icons with theirs."
tests = [
    "test_app.py::test_if_third_party_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Every shipped package (the production dependency tree from npm ls --omit=dev --all --json) is licensed MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD or Zlib, and fonts are SIL OFL 1.1. A licence given as an SPDX OR expression passes when at least one option is on that list, and an AND expression passes only when every part is."
tests = [
    "test_app.py::test_if_licences",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "The only datastores are the provided PostgreSQL database and object storage bucket; there is no SQLite, Redis, embedded database or local file holding application state."
tests = [
    "test_app.py::test_if_datastores",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "The provided service configuration and its development credentials are used as given and not modified."
tests = [
    "test_app.py::test_if_service_config",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "All terrain, meshes, textures and flight tracks are generated by code in the repository, nothing is fetched from the public internet at runtime, and fonts are self-hosted."
tests = [
    "test_app.py::test_if_generated_assets",
]
parameter_cases = []

[[if_rules]]
id = "IF-07"
