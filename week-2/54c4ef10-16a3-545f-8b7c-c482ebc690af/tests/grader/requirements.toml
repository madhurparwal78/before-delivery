[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "short-session"
port = 4175
url_env = "APP_SHORT_SESSION_URL"

[outages.env]
SESSION_TTL_SECONDS = "3"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
id = "DP-01"
title = "Accounts and sessions"
text = "Visitors create an account with an email and password, sign in and sign out, and every archive page and API call except the public ones named in API needs a session that lasts as set in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "access-isolation"
tests = [
    "test_app.py::test_api_accounts_and_sessions",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Owner-only records"
text = "A roll, log entry, scan, frame, calibration, pinned reading, original download or loupe reading that belongs to another account answers not-found exactly as an unknown id does, including ids inside request bodies."
kind = "behavior"
primary = "pytest"
workflow = "access-isolation"
tests = [
    "test_app.py::test_api_foreign_ids_not_found",
    "test_app.py::test_wf_access_isolation_foreign_record",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Rolls"
text = "You create and edit rolls with name, stock, format, EI, push or pull, reciprocity exponent, development note, kind (normal or test) and an optional linked test-roll curve, validated as in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "shooting-log"
tests = [
    "test_app.py::test_api_rolls",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Shooting log entries"
text = "Each roll holds shooting-log entries keyed by a unique frame-counter number, with aperture, shutter, metered EV, note and a misfire flag, and the server rejects unmarked apertures and shutter strings it cannot parse."
kind = "behavior"
primary = "pytest"
workflow = "shooting-log"
tests = [
    "test_app.py::test_api_entries",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-05"
title = "Relative exposure"
text = "Every entry reports its relative exposure in stops and in relative log H, derived on every read from the roll's current EI and reciprocity exponent, with apertures read as exact third-stop values, exposures longer than one second corrected for reciprocity failure and rounding as defined in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "shooting-log"
tests = [
    "test_app.py::test_api_exposure_maths",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-06"
title = "Note and title limits"
text = "Exposure notes, development notes and frame titles have published character limits that the form and the server enforce identically, counting each Unicode code point as one character."
kind = "behavior"
primary = "pytest"
workflow = "shooting-log"
tests = [
    "test_app.py::test_wf_shooting_log_note_limit",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-07"
title = "Log a roll while shooting"
text = "The film photographer signs in, starts a roll from the Log screen, logs exposures one after another including a misfire and a long night exposure, and sees each entry with its computed stops in the roll's shooting log."
kind = "behavior"
primary = "workflow"
workflow = "shooting-log"
tests = [
