type = "binary"
weight = 3
description = "Recipe: 1. Find the sign-in, password-change and seed code. 2. Read how passwords are hashed and compared, and cite each place as file:line. 3. Look for plain-text storage and for fast digests such as bare SHA or MD5 used for passwords. Pass: passwords are stored only as salted slow hashes from a dedicated password-hashing function."

[criterion.annotations]
