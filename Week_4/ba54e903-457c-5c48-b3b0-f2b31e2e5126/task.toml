[task]
name = "deku/discord-com"
version = "1.0.0"
description = "Community Hub, a real-time community messaging product in Python on PostgreSQL and Mailpit: a public marketing site, published-community directory, trending games, listening room and safety library, plus a signed-in three-column workspace with live channels, reactions, threads with live quoted parents, mentions, a permission-filtered inbox, live search results, byte-exact media, ranked roles, channel overwrites, server-timed time-outs and a paid membership tier with emailed receipts, served by any number of instances sharing one database, refusing cross-origin writes and never answering a server error to any input."
authors = [
    { name = "Atharv Mahalwar", email = "atharv.mahalwar@ethara.ai" },
    { name = "Shivam Choudhary", email = "shivam.choudhary@ethara.ai" },
]
