[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: start at the server entrypoint and its configuration module, list every read of the published environment variables, then search all source for literal service hosts, ports and credentials (database URLs, service usernames, passwords, API keys, secrets, bucket keys). Defaults the brief documents (port 4173, OVERDUE_POLL_SECONDS 15, DUNNING_FINAL_NOTICE_SECONDS 259,200, INVITE_TTL_SECONDS 604,800, the published MAIL_FROM sender) and the invented seed password are allowed. Pass: every service URL and credential comes only from the published environment variables read at start, with no hard-coded value or fallback for any of them."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-59",
]
evidence = "file_line"
cites = "L89, L553, L563, L577, L591, L595, L606, L614, L712, L719-L729"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 3
description = "Recipe: read the frontend source tree and the server code that builds HTML, config or JSON for the browser, and the logging calls. A client bundle that imports environment values, embeds a provider URL, or a response or log line that carries a credential fails; cite each as `file:line`. The server-built sign-in redirect and presigned document or statement links are allowed. Pass: no credential or service URL is written to logs or reaches browser code or responses."

[criterion.annotations]
