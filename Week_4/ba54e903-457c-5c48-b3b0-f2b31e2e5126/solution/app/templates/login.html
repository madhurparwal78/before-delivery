{% extends "base.html" %}
{% block main %}
<section class="page-hero form-page">
  <h1 class="display page-title">LOG IN</h1>
  <div class="form-alert" role="alert" id="login-alert"></div>
  <form class="form" id="login-form" novalidate>
    <div class="field">
      <label for="login-email">Email</label>
      <input id="login-email" name="email" type="email" autocomplete="email">
    </div>
    <div class="field">
      <label for="login-password">Password</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password">
    </div>
    <button class="btn btn-accent" type="submit" id="login-submit">Log in</button>
  </form>
  <p class="form-switch">New here? <a id="login-switch" href="/register">Create an account</a></p>
</section>
{% endblock %}
{% block scripts %}<script src="/static/js/account.js?v={{ version }}"></script>{% endblock %}
