description = "Recipe: read the event page template, its base layout and the stylesheet, and trace how the event's `theme` value reaches the page. Any single mechanism qualifies (a class or data attribute, a set of CSS custom properties, a per-theme stylesheet or equivalent). Templates or CSS that branch on the theme name separately for individual parts count as a fail; cite each as `file:line`. Pass: the event's one theme setting is applied at one place, and the wash, ink, accent, meter and primary button take their colours from it."

