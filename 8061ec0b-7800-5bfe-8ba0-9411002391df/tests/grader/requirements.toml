[[requirements]]
id = "DP-01"
title = "Reserve from live availability"
text = "A parent reserves an instrument type and size for their own child, and the server assigns the available serial that sorts first and places a hold, as qualified in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "reservation"
tests = [
    "test_app.py::test_reserve_assigns_first_serial",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "One winner for the last unit"
text = "When several reservations race for the last available unit of a type and size, exactly one succeeds and every other gets the unavailable answer with alternatives, and no serial is ever on two open contracts."
kind = "behavior"
primary = "pytest"
workflow = "reservation"
tests = [
    "test_app.py::test_last_unit_race",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Delivery day by store cutoff"
text = "Each reservation's delivery day is its school's next delivery day whose cutoff in the store's time zone is later than the server's clock when the reservation arrives, whatever the device clock or zone says."
kind = "behavior"
primary = "pytest"
workflow = "reservation"
tests = [
    "test_app.py::test_reservation_delivery_day",
]
criteria = []
parameter_cases = []

