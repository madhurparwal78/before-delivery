[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: Start from `/app/run.json`'s serve command, follow it to the server entrypoint, then read the config module and every client that connects to PostgreSQL, object storage and SMTP. Grep the source tree, excluding lockfiles, for literal credentials, service URLs and bucket names, including hard-coded fallbacks after `process.env` such as a default database URL, a default S3 endpoint URL, a default key or a default bucket name. Bare host names and port numbers are not credentials, URLs or bucket names and are not defects. The seeded member password `tally-field-2026` or its hash in seed code, and the sender display text or address in mail code or templates, are not defects. Cite each defect as `file:line`. Pass: no credential, service URL or bucket name appears as a literal in source."

