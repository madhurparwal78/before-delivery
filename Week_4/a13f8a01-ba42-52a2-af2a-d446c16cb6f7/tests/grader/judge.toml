type = "binary"
weight = 3
description = "Recipe: search the server for every place a 4xx or 5xx JSON body is produced and for the code that orders the checks (size, sign-in, not-found, forbidden, conflict, validation, storage). A hand-written error body or status outside the one error builder, or a handler that decides its checks in its own order, is a defect, cited as `file:line`. Pass: every API error is built by one error body function and its checks follow one shared precedence."

