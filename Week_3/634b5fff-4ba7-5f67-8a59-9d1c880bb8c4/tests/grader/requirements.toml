[[requirements]]
id = "DP-01"
title = "Live shelf state."
text = "The server publishes every box's public state and whether sales are open, and pushes each change to every open shelf within 2 seconds."
kind = "behavior"
primary = "pytest"
workflow = "hold-number"
tests = [
    "test_app.py::test_shelf_lists_and_pushes_changes",
    "test_app.py::test_edition_close_reported_and_refused",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "One winner per number."
text = "Of any number of simultaneous reaches for one box exactly one gets the hold, every other gets the published refusal, and a box never carries two live claims."
kind = "behavior"
primary = "pytest"
workflow = "hold-number"
tests = [
    "test_app.py::test_simultaneous_reaches_one_winner",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Hold ends on its own."
text = "A hold ends at its published edge on the server with no page open and no app code needing to run, and is never extended by a decline, a retry or a repeat request."
kind = "behavior"
primary = "pytest"
workflow = "hold-number"
tests = [
    "test_app.py::test_hold_ends_at_edge_unextended",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Server decides remaining time."
text = "The countdown and match length come only from the server's remaining time, so a wrong device clock or a reload never gains a second."
kind = "behavior"
primary = "pytest"
workflow = "hold-number"
tests = [
    "test_app.py::test_countdown_ignores_device_clock",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-05"
title = "The held match burns down."
text = "A real 3D match on the held box shortens linearly with the server's remaining time and, at zero, the flame dies, the box darkens on every open shelf and the hold bar shows the published line."
kind = "behavior"
primary = "pytest"
workflow = "hold-number"
tests = [
    "test_app.py::test_held_match_draws_in_scene",
    "test_app.py::test_wf_hold_number_match_burns_out",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-06"
title = "Hold a number journey."
text = "A collector chooses a number on the shelf, sees it held with the time left, can put it back, and sees it return to sale for everyone."
kind = "behavior"
primary = "workflow"
workflow = "hold-number"
tests = [
    "test_app.py::test_wf_hold_number_choose_and_put_back",
    "test_app.py::test_wf_hold_number_second_collector_refused",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-07"
title = "Card checkout with 3-D Secure."
text = "A collector completes checkout through the bank's challenge and ends on an order page showing the card authorised, with the box claimed, a Kill Bill authorisation and one authorisation notice."
kind = "behavior"
primary = "workflow"
workflow = "card-checkout"
tests = [
    "test_app.py::test_wf_card_checkout_challenge",
    "test_app.py::test_wf_card_checkout_invalid_fields",
]
criteria = [
    "B10",
    "B11",
]
parameter_cases = []

[[requirements]]
id = "DP-08"
title = "Declines, challenge limit and the second try."
text = "Each published decline shows its exact copy and allows another try on the same unextended hold, and a challenge ends at its own limit or the hold's end, whichever comes first."
kind = "behavior"
primary = "pytest"
workflow = "card-checkout"
tests = [
    "test_app.py::test_wf_card_checkout_decline_then_second_card",
    "test_app.py::test_declines_keep_the_same_hold",
    "test_app.py::test_challenge_ends_at_limit",
]
criteria = []
parameter_cases = []

[[requirements]]
