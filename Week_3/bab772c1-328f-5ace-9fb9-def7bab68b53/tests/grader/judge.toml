[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server's configuration code and every provider client, then search the whole source for URL string literals, user names, passwords, API keys and secrets, and for `??` or `||` fallbacks on environment reads, against the environment variables listed in the brief's configuration section. Cite each literal service address, credential or fallback as `file:line` (XML namespace identifiers and URL path suffixes are not service addresses). Pass: every service URL and credential is read from the environment with no literal value or fallback beyond the brief's documented defaults (port 4173, a 5-second dependency retry interval, request-origin share URLs when the public URL is unset)."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-45",
]
evidence = "file_line"
cites = "L171, L1700, L1703-L1720"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: for each of the ten services, trace the code on the path that serves its feature (object storage reads and writes, search tasks, broker publish and consume, ephemeris vectors with paging, PDF rendering through the renderer, rate limit and reader keys in the cache, plan catalogue, account and subscription in billing, signed messages through the webhook service, push alerts) and confirm a real client call to that service. Cite as `file:line` any local text filter replacing search, PDF built without the renderer, webhook posted straight to a subscriber URL, counter in process memory, or next invoice date, balance, invoice amount or proration computed by the app in place of billing's answer. The catalogue upload to billing and the fixed Plan radio-label copy may hold plan prices, so they are not defects. Pass: each of the ten services is reached through a real client call on its feature path, with no in-memory stand-in or locally computed substitute for what it owns."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
