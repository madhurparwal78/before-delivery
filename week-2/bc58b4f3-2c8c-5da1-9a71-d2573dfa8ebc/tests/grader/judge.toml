description = "Recipe: `playwright` at 1280x800. 1) Run step A for a fresh 90-minute ASL request, then sign in as the dispatcher and open /board. 2) For `heading \"Week of <Ddd D Mon YYYY>\"` read its computed font-family, weight, style and size, then run `document.fonts.check(\"<style> <weight> <size> Archivo\")` with those values. 3) Sign in as Tomas Herrera, open /requests, and for the setting word (the hospital option's label) in the fresh request's row of `table \"Requests\"` do the same with Atkinson Hyperlegible and record its computed font-size. 4) Screenshot both screens. Pass: the heading renders in a loaded Archivo face while the row's setting word renders in a loaded Atkinson Hyperlegible face at a computed size of 17 pixels or more."

