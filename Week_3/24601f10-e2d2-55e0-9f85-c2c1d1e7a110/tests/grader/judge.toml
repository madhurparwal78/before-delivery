type = "binary"
weight = 5
description = "Recipe: with the source MCP, read the configuration module and the code that builds the database pool, the object-store client and the HTTP listener, then search the server source for hostname, bucket, access key, password and connection-string literals, allowing the defaults the brief documents (port 4173 and the timer and limit defaults). Cite each violation as `file:line`. Pass: every service address and credential is read from the environment."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-60",
]
evidence = "file_line"
cites = "L88, L939-L940, L975-L1001"

