[[if_rules]]
id = "IF-01"
text = "/app/run.json exists with exactly the string keys install, build and serve plus \"_schema\":\"run-manifest-v1\"."
tests = [
    "test_app.py::test_if_run_manifest",
]
parameter_cases = []

[[if_rules]]
id = "IF-02"
text = "/app/THIRD_PARTY_NOTICES.md names every shipped package and every bundled font with its licence; shipped packages are the production dependency tree (npm ls --omit=dev --all --json, or the lockfile's non-dev packages)."
tests = [
    "test_app.py::test_if_third_party_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Every shipped package and font uses one of MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD or OFL-1.1."
tests = [
    "test_app.py::test_if_licences",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "The app stores data only in PostgreSQL, MinIO, Kill Bill and Mailpit: no SQLite, Redis, in-memory store standing in for a service, or file written under /app at runtime."
tests = [
    "test_app.py::test_if_datastores",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "/app contains a committed npm lockfile and no .env file or credential values."
tests = [
    "test_app.py::test_if_lockfile_and_secrets",
]
parameter_cases = []

