]
rubric_total_weight = 89
solo_criteria = []
services = [
    { name = "postgres", env = {} },
    { name = "keycloak", env = {} },
    { name = "killbill", env = {} },
    { name = "minio", env = {} },
    { name = "rabbitmq", env = {} },
    { name = "wiremock", env = {} },
    { name = "mailpit", env = { MAIL_FROM = "Phosphene Yard <studio@brightmoss.example>" } },
    { name = "gotenberg", env = {} },
]

