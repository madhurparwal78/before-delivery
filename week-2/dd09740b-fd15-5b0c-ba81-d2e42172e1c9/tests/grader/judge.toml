[[criterion]]
id = "Q1"
name = "Q1"
type = "binary"
weight = 5
description = "Recipe: source MCP. 1) Find the definition of the transitions (action, from statuses, to status, roles). 2) Trace how `allowed_actions`, the inquiry detail's buttons, the lead-only refusal and the apply path decide their answers. 3) A second list of actions, statuses per action or lead-only actions is a defect; cite each as `file:line`. A map from an action to its button label or panel, which the pinned labels need, is not such a list. Pass: one definition of the table, including roles, feeds all four decisions."

[criterion.annotations]
