[[criterion]]
id = "Q1"
name = "Q1"
type = "binary"
weight = 5
description = "Recipe: locate the definitions of the content, requisition and application lifecycle legal moves (which from-state may move to which to-state), then search every handler and job that changes a status for its own transition checks. A second hard-coded table, list or switch of legal moves, or a handler that decides a from-to move itself instead of consulting the definition, fails, cited as `file:line`. Status checks that the brief states as separate rules are not transition checks and do not fail: only draft and returned items are editable, comments are allowed in draft through approved, sign-offs only while the item is in review or approved, linked_to_model only while the route is scheduled, close declines submitted through final_review applications, only published items are public, the withdraw control shows while the application is active, and status predicates inside conditional writes. Pass: each lifecycle's legal moves are defined in exactly one place that every status change consults."

