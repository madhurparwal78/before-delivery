[[if_rules]]
id = "IF-01"
text = "/app/run.json exists and is JSON with string fields install, build and serve and \"_schema\":\"run-manifest-v1\"."
tests = [
    "test_app.py::test_if_run_manifest",
]
parameter_cases = []

[[if_rules]]
id = "IF-02"
text = "THIRD_PARTY_NOTICES.md at /app lists every shipped package and the bundled Fraunces and Instrument Sans fonts, each with its licence; shipped packages means the production dependency tree (npm ls --omit=dev --all --json, or the lockfile's non-dev packages)."
tests = [
    "test_app.py::test_if_third_party_notices",
]
parameter_cases = []

[[if_rules]]
id = "IF-03"
text = "Every shipped package and bundled asset is licensed under MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD, CC0-1.0, BlueOak-1.0.0 or, for fonts only, OFL-1.1."
tests = [
    "test_app.py::test_if_licences_allowed",
]
parameter_cases = []

[[if_rules]]
id = "IF-04"
text = "PostgreSQL is the only datastore; no SQLite, Redis, file-based store, or in-memory store used as the source of truth."
tests = [
    "test_app.py::test_if_postgres_only",
]
parameter_cases = []

[[if_rules]]
id = "IF-05"
text = "The provided service configuration (the development compose files and their seed steps) is left unchanged."
tests = [
    "test_app.py::test_if_service_config_untouched",
]
parameter_cases = []

[[if_rules]]
id = "IF-06"
text = "The application's server and client source is TypeScript; plain JavaScript appears only in configuration files."
tests = [
    "test_app.py::test_if_typescript_source",
]
parameter_cases = []

