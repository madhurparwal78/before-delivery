[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[services]]
name = "postgres"

[services.env]
GRADING_ROUTES = "on"
INVITE_TTL_MS = "20000"
PREVIEW_LINK_TTL_MS = "6000"
PRESENCE_TIMEOUT_MS = "4000"

[[services]]
name = "minio"

[services.env]

[[services]]
name = "mailpit"

[services.env]
MAIL_FROM = "Galley <docs@galley.test>"
MAIL_RETRY_MS = "2000"

[[outages]]
id = "minio-down"
port = 4174
url_env = "APP_MINIO_DOWN_URL"

[outages.env]
S3_ENDPOINT = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_minio_down"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"
MAILPIT_URL = "http://127.0.0.1:9"
DATABASE_URL = "${DATABASE_URL}_mailpit_down"
S3_BUCKET = "${S3_BUCKET}-mailpit-down"

