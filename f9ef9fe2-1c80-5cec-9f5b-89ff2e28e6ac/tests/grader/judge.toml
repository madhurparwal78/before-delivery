[[criterion]]
id = "Q3"
name = "Q3"
type = "binary"
weight = 5
description = "Recipe: locate where the source decides the tier walk and rounding, the hold liveness edge, the cancellation window, compliance cover, the booking, hold and document transitions, and the error precedence. Follow every caller of each. The brief has the browser show the cancel dialog's in-window or late preview with no preview endpoint, and the day sheet offer Check in, Mark no-show and Mark completed by booking status, so a browser judges these from the booking's own fields: that browser display logic is required, not a second copy. The brief also has the browser run the hold's countdown bar to `expires_at` from `server_now`; that countdown is the required held-until display, not a second copy of the hold liveness edge. Only a second decision of a rule that server code acts on counts. Pass: each of these rules is decided in exactly one server function or module that all server callers use, with the browser cancel preview or day-sheet action choice each made in one browser place, any other second copy failing cited as `file:line`."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L152, L198, L199, L230, L273, L357, L404, L668"

