type = "binary"
weight = 3
description = "Recipe: `playwright` at 1280x800. 1. Open `/boards/women`. 2. Read the computed font-family, weight, style and size of the search field's label, the sort control's text and one portrait card's office text, and run `document.fonts.check` with that registered family name at each sample's own weight, style and size. Compare names after lower-casing them and removing spaces, hyphens and underscores: `hankengrotesk`, optionally followed by `variable` or `var`, then optionally by a 4 to 12 character hexadecimal hash, names Hanken Grotesk, and no name containing `fallback` does. 3. Screenshot the controls row and the first portrait row. Pass: every sampled label and control renders in a loaded Hanken Grotesk face at a computed size from 12 to 17 pixels."

