type = "binary"
weight = 3
description = "Recipe: 1) Read the browser entry, every client-side source file, the HTML template and the bundler config (`define`, `envPrefix`, injected globals). 2) Trace any server code that embeds configuration into pages or API responses. 3) Cite each violation as `file:line`. Pass: no browser-side file or server-rendered page references a service variable or its value."

