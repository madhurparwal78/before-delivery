[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server configuration module and every place that builds the Postgres pool, the object-store client and the mail transport, then search the whole source (excluding compose files) for literal service hosts, ports, bucket names, access keys, passwords and connection strings. Any hard-coded host, key, password, bucket or connection string fails, cited as `file:line`, while the brief's documented app port default is allowed. Pass: every service address and credential is read from the environment variables the brief lists."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-06",
]
evidence = "file_line"
cites = "L1033-L1041, L1027, L106"

