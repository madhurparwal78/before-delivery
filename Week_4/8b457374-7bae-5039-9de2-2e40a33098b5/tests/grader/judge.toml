[judge]
judge = "codex"
model = "openai/gpt-5.6-sol"
version = "0.163.0"
cwd = "/judge-workspace"
timeout = 3600
mode = "batched"
samples = 3
guard = "penalize"
prompt_template = "prompt.md"

[[judge.mcp_servers]]
name = "playwright"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "normal",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_press_key",
    "browser_resize",
    "browser_select_option",
    "browser_hover",
    "browser_drag",
    "browser_tabs",
    "browser_wait_for",
    "browser_mouse_wheel",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "reduced"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "reduced",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_press_key",
    "browser_resize",
    "browser_click",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "touch"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "browser-mcp",
    "touch",
]
allowed_tools = [
    "browser_navigate",
    "browser_snapshot",
    "browser_take_screenshot",
    "browser_click",
    "browser_press_key",
    "browser_type",
    "browser_fill_form",
    "browser_evaluate",
    "browser_console_messages",
    "browser_network_requests",
]

[[judge.mcp_servers]]
name = "source"
transport = "stdio"
command = "/usr/local/bin/python3"
args = [
    "-B",
    "/opt/judge/judge.py",
    "source-mcp",
]
allowed_tools = [
    "list_files",
    "read_file",
    "search_files",
]

[scoring]
aggregation = "weighted-mean"

[[criterion]]
id = "B1"
name = "B1"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800. 1) Open `/` and do not scroll. 2) Probe the bounding box of the hero disc element (or its SVG shape) against `window.innerWidth` and `window.innerHeight`. 3) Take a screenshot of the first screen. A disc wholly inside the viewport counts as a miss, as does a rectangle, gradient panel or photo in its place. Pass: the flat teal hero disc runs off the viewport on every side except the left."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-56",
]
evidence = "screenshot"
cites = "L171"

[[criterion]]
id = "B2"
name = "B2"
type = "binary"
weight = 5
description = "Recipe: `playwright` at 1280x800. 1) Open `/` and do not scroll. 2) Take a screenshot of the first screen. 3) Take a second screenshot cropped to the disc's left edge. A blurred, feathered or gradient edge without separate dots counts as a miss. Pass: the disc's left edge breaks into separate teal dots that shrink toward the left until bare paper remains."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-56",
]
evidence = "screenshot"
cites = "L167, L171"

[[criterion]]
id = "B3"
name = "B3"
type = "binary"
weight = 3
description = "Recipe: `playwright` at 1280x800. 1) Open `/`. 2) Probe the level-1 heading's computed font-family, font-weight and text-transform. 3) Run `document.fonts.check` with that heading's own computed weight and size and the Jost family, for example `700 96px Jost`. 4) Take a screenshot of the first screen. A system-font fallback counts as a miss. Pass: the level-1 headline renders in bold uppercase Jost that the font check reports as loaded."

[criterion.annotations]
channel = "experience"
basis = "explicit"
importance = "important"
requirements = [
    "DP-56",
]
evidence = "screenshot"
cites = "L117, L169, L171"

[[criterion]]
id = "B4"
name = "B4"
type = "binary"
weight = 3
description = "Recipe: `touch` at 375x812. 1) Open `/` and do not scroll. 2) Probe the top edge of the hero disc and the bottom edge of the Start a campaign link. 3) Take a screenshot of the first screen. The desktop composition squeezed to phone width, with the disc on the right or behind the text, counts as a miss. Pass: the whole hero text block sits on bare paper above the top edge of the teal disc."

[criterion.annotations]
channel = "experience"
