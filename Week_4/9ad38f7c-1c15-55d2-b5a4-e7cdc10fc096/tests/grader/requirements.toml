[[requirements]]
id = "DP-01"
title = "Deployment"
text = "Start from /app/run.json on the port in APP_PUBLIC_PORT bound to 0.0.0.0, serving the event page at /downtime and the JSON interface under /api on one origin."
kind = "behavior"
primary = "pytest"
workflow = "deployment"
tests = [
    "test_app.py::test_deployment_one_origin",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Health and readiness"
text = "GET /api/health checks the database on every call, answering 503 starting until that instance has its schema and complete seed, including while the database is unreachable from start, 200 ok from then on, and 503 unavailable when the database becomes unreachable after that."
kind = "behavior"
primary = "pytest"
workflow = "deployment"
tests = [
    "test_app.py::test_health_readiness",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Seeded exactly once"
text = "Two instances started together on an empty database both become healthy with the seed written exactly once, and a restart neither duplicates nor resets any row."
kind = "behavior"
primary = "pytest"
workflow = "deployment"
tests = [
    "test_app.py::test_seed_written_once",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Shared state in PostgreSQL"
text = "Data lives in PostgreSQL in the named collections, and sessions, throttles, locks and live events hold across every running instance, so a token, a lockout or a team solve on one instance takes effect on all of them."
kind = "behavior"
primary = "pytest"
workflow = "deployment"
tests = [
    "test_app.py::test_shared_state_across_instances",
    "test_app.py::test_wf_deployment_peer_board",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-05"
title = "Database outage and recovery"
text = "While the database is unreachable, from start or while running, every API route other than health answers 503 unavailable within five seconds and no process exits, and within five seconds of its return routes, existing sessions and the live stream work again without a restart."
kind = "behavior"
primary = "pytest"
workflow = "deployment"
tests = [
    "test_app.py::test_outage_from_start",
    "test_app.py::test_outage_midrun_and_recovery",
    "test_app.py::test_wf_deployment_outage",
]
criteria = []
parameter_cases = []

