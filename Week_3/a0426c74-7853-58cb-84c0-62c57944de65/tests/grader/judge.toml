description = "Recipe: Find where the routes under /api/grading are registered or dispatched and read the condition guarding them. Search the server and client source for other test-only routes, hidden query flags, header switches or fixed test accounts. Pass: The grading routes exist only behind a check that PLOT_GRADING equals 1."

[criterion.annotations]
