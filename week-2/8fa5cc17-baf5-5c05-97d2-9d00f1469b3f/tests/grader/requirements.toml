S3_ENDPOINT = "http://127.0.0.1:9"

[[outages]]
id = "short-timer"
port = 4175
url_env = "APP_SHORT_URL"

[outages.env]
QUIRE_LOCKOUT_WINDOW_SECONDS = "20"
QUIRE_SESSION_IDLE_SECONDS = "20"
DATABASE_URL = "${DATABASE_URL}_short"
S3_BUCKET = "${S3_BUCKET}-short"

[[requirements]]
id = "DP-01"
title = "Owner sign-in"
text = "The seeded owner signs in with email and password on the sign-in screen and gets a fresh device session, as qualified in API and Business rules."
kind = "behavior"
primary = "pytest"
workflow = "sign-in"
tests = [
    "test_app.py::test_sign_in_fresh_session",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Sign-in lockout"
text = "Repeated failed sign-ins for one email or one client address lock sign-in with the published refusal and the same published message whether or not the account exists, the lock lifts on the published schedule, and the sign-in screen shows only what the server's latest answer decided."
kind = "behavior"
primary = "pytest"
workflow = "sign-in"
tests = [
    "test_app.py::test_sign_in_lockout_email",
    "test_app.py::test_sign_in_lockout_client_address",
