[[requirements]]
id = "DP-01"
title = "Reserved payouts wait at the floor."
text = "A transfer at or above the approval floor of a wallet with a quorum waits as pending_approval with the quorum's members, threshold, expiry and the deciding policy revision copied in, and reserves its amount so Available falls while Balance stays."
kind = "behavior"
primary = "pytest"
workflow = "payout-quorum"
tests = [
    "test_app.py::test_wf_payout_quorum_reservation_snapshot",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-02"
title = "Distinct approvers execute once."
text = "Only members of the intent's quorum may decide it, never its initiator, never twice and never through an API key, one rejection rejects it, and the approval that reaches the threshold executes it in the same request without evaluating policy again."
kind = "behavior"
primary = "pytest"
workflow = "payout-quorum"
tests = [
    "test_app.py::test_wf_payout_quorum_decision_rules",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-03"
title = "Send and approve in the console."
text = "An operator sends on the wallet page and reads the waiting message, approvers find the row in the approvals inbox with its progress, and the deciding approval shows the executed toast and removes the row."
kind = "behavior"
primary = "workflow"
workflow = "payout-quorum"
tests = [
    "test_app.py::test_wf_payout_quorum_console_send_approve",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-04"
title = "Racing decisions have one winner."
text = "Simultaneous final approvals, cancellations, rejections and freezes on one intent leave exactly one outcome, execute it at most once, and answer every loser with the conflict code named in Business rules."
kind = "behavior"
primary = "pytest"
workflow = "race-safety"
tests = [
    "test_app.py::test_wf_race_safety_console_double_approve",
    "test_app.py::test_wf_race_safety_decision_races",
]
criteria = []
parameter_cases = []

[[requirements]]
id = "DP-05"
title = "No overdraw under races."
text = "Racing transfers, batches, deposits and reservations never take a wallet's balance or available balance below zero, and available always equals balance minus the reserved amounts of its pending intents."
kind = "behavior"
primary = "pytest"
workflow = "race-safety"
