[[criterion]]
id = "Q3"
name = "Q3"
type = "binary"
weight = 3
description = "Recipe: read module, function, variable and table-access names in the server source. Generic or foreign terms where the brief has a domain term are defects, for example `request`/`payment` for intent, `group`/`signers` for quorum, `threshold` for approval floor, `hold`/`lock` for reservation, `version` for revision, or `transaction row` for ledger entry or movement. Cite each as `file:line`. Pass: names use the brief's domain terms throughout."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L1071"

[[criterion]]
id = "Q4"
name = "Q4"
type = "binary"
weight = 5
description = "Recipe: trace amount values from request parsing through policy comparison, aggregation sums, balance updates, SQL result mapping and response formatting, in server and page scripts. Search for `Number(`, `parseFloat`, `parseInt`, unary `+`, `Math.`, `toFixed` and arithmetic on amount or balance values, plus pg numeric columns read as JS numbers. Any amount passing through a JavaScript `Number` fails. Cite each as `file:line`. Pass: amounts stay exact integers (BigInt, string or database numeric) from request to response."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L602, L1073"

[[criterion]]
id = "Q5"
name = "Q5"
type = "binary"
weight = 5
description = "Recipe: for transfer, batch, deposit, approve, reject, cancel, freeze, expiry and policy update, trace the database calls. Check that each runs inside one transaction that locks the rows it reads (for example `FOR UPDATE` or an equivalent lock). A write split across transactions, or an unlocked read-then-write, is a defect. Cite each as `file:line`. Pass: every listed write runs as one transaction that locks the rows it reads."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "critically_important"
requirements = []
evidence = "file_line"
cites = "L821, L1074"

[[criterion]]
id = "Q8"
name = "Q8"
type = "binary"
weight = 3
description = "Recipe: for transfer, batch, deposit, approve, reject, cancel, freeze, expiry and policy update, find where the audit `seq` is allocated, and where the signed `seq` is allocated for writes that append a signed event (the `intent.*`, `transfer.denied` and `deposit.received` types). A seq read or computed outside the write's own transaction, or by a query that does not lock against a concurrent allocation, is a defect. Cite each as `file:line`. Pass: every listed write allocates its audit seq, and its signed seq when it appends one, inside its own transaction."

[criterion.annotations]
channel = "quality"
basis = "explicit"
importance = "important"
requirements = []
evidence = "file_line"
cites = "L875, L904, L1074"

[[criterion]]
id = "Q6"
name = "Q6"
type = "binary"
weight = 3
description = "Recipe: find how `/api` responses are built, including the not-found handler, body-parse and size errors, and the unexpected-error handler. A response or refusal outside the `{success, data, error, meta: {request_id}}` shape, or a framework default body, is a defect. The brief's exceptions are allowed: the plain `{\"status\":\"ok\"}` object of `GET /api/health` and its plain `503` bodies `{\"status\":\"starting\"}` and `{\"status\":\"unavailable\"}`, the not-found page with `404` for a path outside the brief's routes, the CSV body of the export route, and an idempotent replay that returns the stored `success`, `data` and `error` byte for byte with a fresh `meta.request_id`. A shared builder is not required. Cite each as `file:line`. Pass: every other `/api` response and refusal, unexpected errors included, is in the one envelope shape."

[criterion.annotations]
channel = "quality"
