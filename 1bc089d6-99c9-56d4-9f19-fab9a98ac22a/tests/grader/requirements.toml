schema_version = 1
id_prefix = "DP"
mandatory_count = 60
allowed_kinds = [
    "behavior",
    "visual",
    "source",
]
test_files = [
    "test_app.py",
]
workflow_ids = [
    "story",
    "practice-and-film",
    "build-hour",
    "save-hour",
    "confirm-hour",
    "sign-in",
    "edit-hour",
    "reminders",
    "share",
    "delete-everything",
    "outages",
    "cross-cutting",
]
criterion_ids = [
    "B1",
    "B2",
    "B3",
    "B4",
    "B5",
    "B6",
    "B7",
    "B8",
    "B9",
    "B10",
    "B11",
    "B12",
    "S1",
    "S2",
    "S3",
    "S4",
    "Q1",
    "Q2",
    "Q3",
    "Q4",
    "Q5",
    "Q6",
    "Q7",
]
rubric_total_weight = 81
services = [
    { name = "postgres", env = { STILLHOUR_TEST_CLOCK = "1" } },
    { name = "mailpit", env = { MAIL_FROM = "Stillhour <goodnight@stillhour.example>" } },
]

[criterion_weights]
B1 = 5
B2 = 3
B3 = 3
B4 = 3
B5 = 3
B6 = 5
B7 = 5
B8 = 3
B9 = 3
B10 = 3
B11 = 3
B12 = 3
S1 = 5
S2 = 3
S3 = 5
S4 = 3
Q1 = 3
Q2 = 3
Q3 = 5
Q4 = 3
Q5 = 3
Q6 = 3
Q7 = 3

[runtime]
app_port = 4173
health_path = "/api/health"
manifest = "run.json"
bootstrap_probe = ""

[[outages]]
id = "postgres-down"
port = 4174
url_env = "APP_POSTGRES_DOWN_URL"

[outages.env]
DATABASE_URL = "postgresql://gf_app:unreachable@127.0.0.1:9/gf_dev"

[[outages]]
id = "mailpit-down"
port = 4175
url_env = "APP_MAILPIT_DOWN_URL"

[outages.env]
SMTP_HOST = "127.0.0.1"
SMTP_PORT = "9"

[[requirements]]
