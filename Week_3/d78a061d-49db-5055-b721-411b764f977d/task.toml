[task]
name = "graphite-hollow/linewright"
version = "1.0.0"
description = "Browser-based real-time 3D co-op adventure where players build, pose or upload their own heroes, forge freehand-drawn weapons and play solo and co-op stories, with server-validated glTF uploads against a versioned rulebook, a fixed-step authoritative world, at-most-once realtime delivery across reconnects and restarts, and full English, Japanese and Spanish localisation, backed by Postgres, MinIO and Mailpit."
authors = [
    { name = "Parth Pandey", email = "parth.pandey@ethara.ai" },
    { name = "Kaustubh Dalvi", email = "kaustubh.dalvi@ethara.ai" },
]
