[[criterion]]
id = "S1"
name = "S1"
type = "binary"
weight = 5
description = "Recipe: read the server configuration code, then search all delivered source and config files for each required variable in the brief's Configuration and secrets section, plus connection strings, hostnames, access keys and passwords. The documented defaults for the listening port and the two optional limits are allowed. Cite each read and each defect as `file:line`. Pass: every required service credential and URL is read from the environment at start with no literal value or fallback in the delivered files."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-74",
]
evidence = "file_line"
cites = "L104, L602, L609, L773, L777"

[[criterion]]
id = "S2"
name = "S2"
type = "binary"
weight = 5
description = "Recipe: read the browser entrypoint, its imports, the bundler configuration and any server code that injects data into HTML or returns configuration. Trace whether a server configuration value can reach browser code. Cite the boundary and each defect as `file:line`. Pass: no browser-delivered code path imports, embeds or receives a service credential or service URL."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "critically_important"
requirements = [
    "DP-74",
]
evidence = "file_line"
cites = "L104, L777, L787"

[[criterion]]
id = "S3"
name = "S3"
type = "binary"
weight = 3
description = "Recipe: read the server's error handling for database and object storage failures, including the place that builds API error bodies. A response that forwards a caught error's message fails. Cite the handler as `file:line`. Pass: dependency failures reach the browser only as the published generic error bodies."

[criterion.annotations]
channel = "source"
basis = "explicit"
importance = "important"
requirements = [
    "DP-74",
]
evidence = "file_line"
cites = "L104, L526-L534, L777"

[[criterion]]
id = "Q1"
name = "Q1"
type = "binary"
weight = 3
description = "Recipe: read `tsconfig.json`, then search the domain TypeScript for `any`, `@ts-ignore`, `@ts-expect-error`, `@ts-nocheck` and double casts through `unknown`. Cite each instance as `file:line`. Pass: strict type checking is on with no untyped escape hatch in domain code."

[criterion.annotations]
channel = "quality"
