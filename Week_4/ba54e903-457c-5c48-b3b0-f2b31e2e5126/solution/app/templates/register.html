{% extends "base.html" %}
{% block main %}
<section class="page-hero form-page">
  <h1 class="display page-title">CREATE AN ACCOUNT</h1>
  <div class="form-alert summary" role="alert" id="register-alert"></div>
  <form class="form" id="register-form" novalidate>
    <div class="field">
      <label for="reg-email">Email</label>
      <input id="reg-email" name="email" type="text" inputmode="email" autocomplete="email" aria-describedby="reg-email-error">
      <p class="field-error" id="reg-email-error" hidden></p>
    </div>
    <div class="field">
      <label for="reg-display">Display name</label>
      <input id="reg-display" name="display_name" type="text" autocomplete="name" aria-describedby="reg-display-error">
      <p class="field-error" id="reg-display-error" hidden></p>
    </div>
    <div class="field">
      <label for="reg-username">Username</label>
      <input id="reg-username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="reg-username-error">
      <p class="field-error" id="reg-username-error" hidden></p>
    </div>
    <div class="field">
      <label for="reg-password">Password</label>
      <input id="reg-password" name="password" type="password" autocomplete="new-password" aria-describedby="reg-password-error">
      <p class="field-error" id="reg-password-error" hidden></p>
    </div>
    <div class="field">
      <label for="reg-dob">Date of birth</label>
      <input id="reg-dob" name="date_of_birth" type="text" inputmode="numeric" placeholder="YYYY-MM-DD" autocomplete="bday" aria-describedby="reg-dob-error">
      <p class="field-error" id="reg-dob-error" hidden></p>
    </div>
    <button class="btn btn-accent" type="submit" id="register-submit">Create an account</button>
  </form>
  <p class="form-switch">Already a member? <a id="register-switch" href="/login">Log in</a></p>
</section>
{% endblock %}
{% block scripts %}<script src="/static/js/account.js?v={{ version }}"></script>{% endblock %}
